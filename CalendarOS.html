  { v:'4.19.0', changes: [
    'ROOT CAUSE of the recent data loss found — and it was the "local storage is full" error you have been seeing almost daily. Critical local writes (the completions safety buffer, and the lists cache that holds folder assignments) were wrapped in bare try/catch blocks that only logged to the console. When the quota filled, those writes failed with NO visible sign, so the local cache kept serving stale data — and on the next partial sync that stale copy won the merge. That is why completed tasks came back as pending AND lists lost their folder assignments in the same incident: one shared cause, not two separate bugs.',
    'Fix 1 — storage is now tiered. Caches that can be re-downloaded from Supabase (hydration, training, recipes, health, ratings, metric defs, sync error history) are marked disposable. Anything that only exists locally (completions buffer, lists, tasks, settings) is critical. When a critical write hits the quota, disposable caches are automatically evicted to make room and the write is retried — so the data that cannot be recovered always wins the fight for space.',
    'Fix 2 — a failed write to a critical key now always warns you, even when the calling code asked for a silent save. Silence was precisely what allowed the original loss to go unnoticed for weeks.',
    'Fix 3 — Ctrl+K now searches items INSIDE your lists, not just list titles. Each result shows which list it belongs to and whether it is already checked off.',
  ]},
  { v:'4.18.0', changes: [
    'DATA INTEGRITY FIX for a real, reported incident: completions from ~2-3 weeks earlier silently reverted to pending after a partial/failed sync (browser had served a cached copy of the app). Root cause: completion history is deliberately not kept in the main local task cache, so the only local record of it was a safety buffer capped at 14 DAYS. Anything older than that had no local copy to restore from, so when a pull came back without it, it was simply gone. The 2-3 week age of the affected tasks put them exactly outside that window.',
    'Fix 1 — the completions safety buffer is now UNBOUNDED (was 14 days). Completions are tiny records, so keeping the full history locally costs almost nothing next to the cost of ever losing one.',
    'Fix 2 — a hard invariant is now enforced on every sync: a pull can NEVER un-complete a task. If something is complete locally and a pull comes back without it, that is treated as a partial/stale pull, the completion is restored, and the corrected state is pushed back to Supabase. Un-completing remains possible only as an explicit action you take, which goes through the separate delete path. Both are covered by tests that reproduce the original incident.',
    'Restorations are logged to Settings → Activity & Error Log, so if this ever triggers again you can see exactly how many entries were rescued and when.',
  ]},

  { v:'4.10.1', changes: [

  ]},

  { v:'4.9.0', changes: [

  { v:'4.0.0', changes: [

  { v:'2.9.3', changes: [
    'Added "Sync Error History" (Settings → Activity & Error Log): a small, separate, local-only record of only sync FAILURES (last 15), durable across reloads and not cleared by a later successful sync — unlike the existing session log, which is intentionally in-memory-only and resets on every reload. This closes a real diagnostic gap hit while investigating the v2.9.0/2.9.2 sync bug: by the time a diagnostic log was requested, the app had already reloaded and synced cleanly, so the session log had nothing left to show — there was no way to see what had actually failed. Copy/Download Log now include this history alongside the session log.',
  ]},
  { v:'2.9.2', changes: [
    'Fixed a real, reproducible sync bug reported in practice: tasks cleared in the morning reappearing as overdue a couple hours later. Root cause — the v2.9.0 Training feature added its 4 new Supabase tables into the SAME all-or-nothing loop as the core task/list/health tables, in both the full push and full pull. If the training-tables SQL migration hadn\'t been re-run yet in the live Supabase project (a very plausible gap right after updating), any pull would throw partway through and abort BEFORE ever assigning the freshly-fetched core data to state — meaning the app silently fell back to old/stale local data on every open instead of showing the real confirmed state, and any push would throw after the real task data had already reached Supabase but before completing, leaving the dirty flag stuck true and retrying (and re-failing) identically forever. Training pull/push are now fully fault-isolated from core sync: a training-specific failure is logged (visible in Settings → Activity & Error Log) but can never block, delay, or fail the core task/list/health push or pull. Verified with a test that mocks Supabase responding normally for core tables while every training table 404s exactly as an unmigrated project would — confirms core data still loads/pushes correctly and the training failure is logged but contained.',

// Fills in any settings fields missing from a saved blob (e.g. one written by
// an earlier version of the app), including partially-missing nested objects
// like recurTypeColors. Safe to call any time — never overwrites real values.
function backfillSettingsDefaults(){
  Object.keys(DEFAULT_SETTINGS_EXTRAS).forEach(k=>{
    if(state.settings[k] === undefined || state.settings[k] === null){
      state.settings[k] = DEFAULT_SETTINGS_EXTRAS[k];
    }
  });
  // recurTypeColors can exist but be missing individual newer types
  RECUR_TYPES.forEach(type=>{
    if(!state.settings.recurTypeColors[type]){
      state.settings.recurTypeColors[type] = DEFAULT_SETTINGS_EXTRAS.recurTypeColors[type] || '#3C7A73';
    }
  });
  if(!state.settings.siloColors) state.settings.siloColors = {};
  if(!state.settings.locationColors) state.settings.locationColors = {};
  // any locations/pages added since pageOrder was created should still show up
  const ALL_PAGE_KEYS = ['dashboard','overdue','tasks','calendar','week','lists','health','training','recipes','progress','settings'];
  if(!state.settings.pageOrder) state.settings.pageOrder = ALL_PAGE_KEYS.slice();
  ALL_PAGE_KEYS.forEach(k=>{ if(!state.settings.pageOrder.includes(k)) state.settings.pageOrder.push(k); });
}

/* ---------- Date helpers ---------- */
function todayStr(){
  const d = new Date();
  return fmtDate(d);
}
function fmtDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){
  if(!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(dateStr, n){
  const d = parseDate(dateStr);
  d.setDate(d.getDate()+n);
  return fmtDate(d);
}
function daysBetween(aStr, bStr){
  const a = parseDate(aStr), b = parseDate(bStr);
  return Math.round((b - a) / 86400000);
}
function isPast(dateStr, refStr){
  return daysBetween(dateStr, refStr) > 0;
}
function humanDate(dateStr){
  if(!dateStr) return '—';
  const d = parseDate(dateStr);
  const t = parseDate(todayStr());
  const diff = daysBetween(todayStr(), dateStr);
  if(diff === 0) return 'Today';
  if(diff === 1) return 'Tomorrow';
  if(diff === -1) return 'Yesterday';
  return `${DOW_ABBR[d.getDay()]}, ${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getDate()}`;
}
function fullDate(dateStr){
  const d = parseDate(dateStr);
  return `${DOW_FULL[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

/* ---------- Recurrence Engine ---------- */
// Determine whether a recurring task is "due" (should show) on a given date.
function isDueOn(task, dateStr){
  if(task.start && dateStr < task.start) return false;
  if(task.end && dateStr > task.end) return false;
  const d = parseDate(dateStr);
  const dow = d.getDay();

  switch(task.type){
    case 'Daily':
      return true;
    case 'Days of Week': {
      if(!task.detail) return false;
      const days = task.detail.split(',').map(s=>s.trim());
      return days.includes(DOW_ABBR[dow]);
    }
    case 'Weekly': {
      if(!task.detail) return false;
      return task.detail.trim().toLowerCase() === DOW_FULL[dow].toLowerCase();
    }
    case 'Bi-Weekly': {
      if(!task.detail) return false;
      if(task.detail.trim().toLowerCase() !== DOW_FULL[dow].toLowerCase()) return false;
      const startD = parseDate(task.start);
      // align to the first matching weekday on/after start
      let firstOcc = new Date(startD);
      while(firstOcc.getDay() !== dow) firstOcc.setDate(firstOcc.getDate()+1);
      const weeksDiff = Math.floor((d - firstOcc) / (7*86400000));
      return weeksDiff >= 0 && weeksDiff % 2 === 0;
    }
    case 'Monthly': {
      const dom = parseInt(task.detail, 10);
      if(isNaN(dom)) return false;
      // clamp to last day of month for short months
      const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      return d.getDate() === Math.min(dom, lastDay);
    }
    case 'Yearly': {
      if(!task.detail || !task.detail.includes('-')) return false;
      const [mm, dd] = task.detail.split('-').map(Number);
      return (d.getMonth()+1) === mm && d.getDate() === dd;
    }
    case 'Every X Days': {
      const n = parseInt(task.detail, 10);
      if(isNaN(n) || n <= 0) return false;
      const diff = daysBetween(task.start, dateStr);
      return diff >= 0 && diff % n === 0;
    }
    default:
      return false;
  }
}

/* ---------- Reschedule exceptions (move a single occurrence) ----------
   task.rescheduleExceptions = [{ from:'YYYY-MM-DD', to:'YYYY-MM-DD' }]
   The original date keeps its normal isDueOn() match (it just gets marked
   'missed' there); the new date needs this extra check since it usually
   isn't a date the recurrence pattern would naturally land on. */
function rescheduleExceptionFor(task, dateStr){
  return (task.rescheduleExceptions||[]).find(e=>e.to===dateStr) || null;
}
function isEffectivelyDueOn(task, dateStr){
  return isDueOn(task, dateStr) || !!rescheduleExceptionFor(task, dateStr);
}
async function rescheduleOccurrence(taskId, fromDate, toDate){
  const t = state.tasks.recurring.find(x=>x.id===taskId);
  if(!t) return;
  if(!t.rescheduleExceptions) t.rescheduleExceptions = [];
  // replace any existing exception for this same original date
  t.rescheduleExceptions = t.rescheduleExceptions.filter(e=>e.from!==fromDate);
  t.rescheduleExceptions.push({ from: fromDate, to: toDate });
  setOccurrenceStatus(taskId, fromDate, 'missed');
  await saveTasks();
}

/* ---------- Recurring "overdue" (mirrors one-time overdue) ----------
   Looks at the single most recent date (before today) this task was due —
   whether that landed there naturally or via a reschedule exception — and
   if it was never resolved (checked done or flagged missed), it counts as
   overdue and keeps showing until you deal with it. Deliberately does NOT
   dig further back than that one date, so a task ignored for months doesn't
   suddenly resurface a pile of ancient reminders.
   Daily tasks are deliberately excluded — a fresh occurrence shows up every
   single day regardless, so pinning yesterday's unresolved one too would
   just be permanent duplicate clutter. Instead, an unresolved Daily
   occurrence gets auto-recorded as missed at day rollover (see confirmNewDay). */
function getOverdueRecurring(){
  const today = todayStr();
  const results = [];
  state.tasks.recurring.forEach(t=>{
    if(t.type === 'Daily') return;
    let cursor = addDays(today, -1);
    let guard = 0;
    while(guard < 400){
      if(cursor < t.start) break;
      if(isEffectivelyDueOn(t, cursor)){
        if(!getOccurrence(t.id, cursor)){
          results.push({ task: t, date: cursor });
        }
        break; // only the single most recent due date matters
      }
      cursor = addDays(cursor, -1);
      guard++;
    }
  });
  return results;
}

/* ---------- Occurrence completion tracking ----------
   state.tasks.completions[taskId] = { 'YYYY-MM-DD': { status:'done'|'missed', loggedAt: isoString } }
   Replaces the old flat array-of-dates format; migrateCompletionsFormat() upgrades
   any old data on load. */
function getOccurrence(taskId, dateStr){
  const log = state.tasks.completions[taskId];
  return log ? log[dateStr] : undefined;
}
function isCompletedOn(taskId, dateStr){
  const o = getOccurrence(taskId, dateStr);
  return !!(o && o.status === 'done');
}
function isMissedOn(taskId, dateStr){
  const o = getOccurrence(taskId, dateStr);
  return !!(o && o.status === 'missed');
}
// Pending deletes to push to Supabase — entries removed locally that Supabase
// still needs to be told about (fixes: unchecking didn't sync — see changelog).
const pendingCompletionDeletes = [];
// Same pattern for Training: exercises/sessions/calendar-days/logs removed
// locally (via import remap or manual delete) need an explicit DELETE sent —
// an upsert of what remains never tells Supabase to drop a row.
const pendingTrainingDeletes = []; // [{table, match: {col:val,...}}]
const pendingRecipeDeletes = []; // [{table, match: {col:val,...}}]
const pendingHydrationDeletes = []; // [{table, match: {col:val,...}}]
let pendingDivergence = null; // set by a pull when local and remote disagree; consumed by maybeShowDivergenceModal()
/* Set by init() when the New Day review had to stand aside for a divergence
   prompt, and consumed by applyDivergenceChoices() once that prompt is
   resolved. Without this the review was simply DROPPED for that launch: init
   returned early intending to defer it, but nothing ever resumed it, so it
   only reappeared on the next launch (lastActiveDate still being stale).
   Deliberately startup-only — a mid-session sync that happens to surface a
   divergence should not pop a "Good morning" review. */
let newDayDeferredByDivergence = false;
// Same pattern for health metric definitions — deleting one locally without
// also telling Supabase means the next pull brings it right back (this was
// a real, reported bug: "delete a metric, refresh, it's back").
const pendingMetricDefDeletes = []; // [id, id, ...]
// One-shot completion "pop" animation targets — set right before a render
// that should show the animation, cleared immediately after. This is how
// motion works despite the app doing full innerHTML re-renders: a freshly
// re-created DOM node still plays a CSS animation on insertion, so tagging
// exactly the item that was just toggled (and only for that one render)
// gives a real, precise animation without replaying on every unrelated
// re-render of the same checked item.
let _justCompletedId = null; // task id
let _justCompletedListItemId = null; // list item id
let _justReorderedListId = null; // list id whose items were just drag-reordered, for the one-shot "settle" animation
function setOccurrenceStatus(taskId, dateStr, status){
  // status: 'done' | 'missed' | null (null clears the occurrence entirely)
  const c = state.tasks.completions;
  if(!c[taskId]) c[taskId] = {};
  const existed = !!c[taskId][dateStr];
  if(status === null){
    delete c[taskId][dateStr];
    if(existed) pendingCompletionDeletes.push({ taskId, date: dateStr });
  } else {
    c[taskId][dateStr] = { status, loggedAt: new Date().toISOString() };
  }
  saveTasks();
}
// Toggle helpers: clicking an already-active state clears it; each is
// mutually exclusive with the other (marking done clears a missed flag, etc).
function toggleDone(taskId, dateStr){
  setOccurrenceStatus(taskId, dateStr, isCompletedOn(taskId, dateStr) ? null : 'done');
}
function toggleMissed(taskId, dateStr){
  setOccurrenceStatus(taskId, dateStr, isMissedOn(taskId, dateStr) ? null : 'missed');
}
function migrateCompletionsFormat(){
  const c = state.tasks.completions;
  Object.keys(c).forEach(taskId=>{
    if(Array.isArray(c[taskId])){
      const obj = {};
      c[taskId].forEach(dateStr=>{ obj[dateStr] = { status:'done', loggedAt: null }; });
      c[taskId] = obj;
    }
  });
}

// Compute current streak (consecutive due-occurrences completed) ending at refDate (exclusive of today unless done)
function computeStreak(task, refDateStr){
  let streak = 0;
  let cursor = refDateStr;
  let guard = 0;
  while(guard < 730){
    guard++;
    if(cursor < task.start) break;
    if(isDueOn(task, cursor)){
      if(isCompletedOn(task.id, cursor)){
        streak++;
      } else {
        break;
      }
    }
    cursor = addDays(cursor, -1);
  }
  return streak;
}

// Next date (today or later) this recurring task is due, searching up to
// ~2 years out. Returns null for tasks that have effectively ended (e.g. a
// past end date) with no future occurrences.
function nextOccurrenceDate(task){
  let cursor = todayStr();
  let guard = 0;
  while(guard < 730){
    if(task.end && cursor > task.end) return null;
    if(isDueOn(task, cursor)) return cursor;
    cursor = addDays(cursor, 1);
    guard++;
  }
  return null;
}

// On-time % and average delay in days, based only on occurrences the person
// actually logged (checked done or flagged missed) — untouched days aren't
// counted since we have no signal either way.
function computeOnTimeStats(task){
  const log = state.tasks.completions[task.id];
  if(!log) return null;
  const entries = Object.entries(log);
  if(!entries.length) return null;
  let doneCount = 0, missedCount = 0, delaySum = 0;
  entries.forEach(([dateStr, o])=>{
    if(o.status === 'missed'){ missedCount++; return; }
    if(o.status === 'done'){
      doneCount++;
      if(o.loggedAt){
        const loggedDateStr = fmtDate(new Date(o.loggedAt));
        delaySum += Math.max(0, daysBetween(dateStr, loggedDateStr));
      }
    }
  });
  const total = doneCount + missedCount;
  if(total === 0) return null;
  return {
    onTimePercent: Math.round((doneCount/total)*100),
    avgDelayDays: doneCount ? +(delaySum/doneCount).toFixed(1) : 0,
    total,
  };
}

// Aggregate on-time % across ALL recurring tasks, but only for occurrences
// logged (done or missed) within the current calendar week (Sun–Sat, up to
// today). Returns null if nothing's been logged yet this week.
function computeWeeklyOnTimeRate(){
  const today = parseDate(todayStr());
  const weekStart = addDays(todayStr(), -today.getDay()); // most recent Sunday
  let doneCount = 0, missedCount = 0;
  Object.values(state.tasks.completions).forEach(byDate=>{
    Object.entries(byDate).forEach(([dateStr, o])=>{
      if(dateStr < weekStart || dateStr > todayStr()) return;
      if(o.status === 'done') doneCount++;
      else if(o.status === 'missed') missedCount++;
    });
  });
  const total = doneCount + missedCount;
  if(total === 0) return null;
  return Math.round((doneCount/total)*100);
}

/* ---------- Overdue helpers ---------- */
function oneTimeIsOverdue(t){
  return !t.done && t.due && t.due < todayStr();
}

    }

    if(listsRes){
      state.lists = JSON.parse(listsRes.value);
    } else {

    }

    if(healthRes){

    state.health.forEach(h=>{ if(!h.custom) h.custom = {}; });

    state.healthMetricDefs = metricDefsRes ? JSON.parse(metricDefsRes.value) : [];
    ensureCoreMetricDefs();

    state.dailyRatings = ratingsRes ? JSON.parse(ratingsRes.value) : [];

    // Training data (exercises/sessions/calendar/logs) is small and bounded
    // (a month's plan + logs at a time, not a growing per-day history like

    // even when sync is on — same treatment as tasks/lists.
    if(trainingRes){
      const t = JSON.parse(trainingRes.value);
      state.training = { exercises: t.exercises||[], sessions: t.sessions||[], calendar: t.calendar||[], logs: t.logs||[], resources: t.resources||[] };
    } else {
      state.training = { exercises: [], sessions: [], calendar: [], logs: [], resources: [] };
    }

    // Recipes — same treatment as Training (small/bounded, kept locally
    // even when sync is on, rather than reclaimed like completions/health).
    if(recipesRes){

    state.hydrationLogs = hydrationRes ? (JSON.parse(hydrationRes.value)||[]) : [];

    // settings were already loaded by loadSettingsOnly() before the gate;

    if(!state.settings || !state.settings.locations) await loadSettingsOnly();
    if(!state.settings.sync) state.settings.sync = null;

    // Once sync is on, Supabase is the durable copy of everything historical
    // (completions, health entries, ratings) — reclaim whatever local space
    // an older version of the app was using for that, right away rather than
    // leaving it to sit stale forever. The recent-completions buffer is the
    // one exception: load it into state now (best-known state before the
    // pull even runs), and pullFromSupabase() will properly merge/reconcile
    // it against whatever Supabase actually has.
    if(syncConfigured()){
      try{
        const recentRes = await safeGet(STORAGE_KEYS.RECENT_COMPLETIONS);
        if(recentRes){
          const buffer = decodeCompletionsBuffer(JSON.parse(recentRes.value));

          state.tasks.completions = merged;

      try{ await window.storage.set(STORAGE_KEYS.TASKS, JSON.stringify({ oneTime: state.tasks.oneTime, recurring: state.tasks.recurring }), false); } catch(e){}
      try{ await window.storage.delete(STORAGE_KEYS.HEALTH, false); } catch(e){}
      try{ await window.storage.delete(STORAGE_KEYS.RATINGS, false); } catch(e){}
      diagLogEvent('load', 'sync configured — reclaimed local space for completions/health/ratings history');
    }

    const syncMetaRes = await safeGet(STORAGE_KEYS.SYNC_META);
    if(syncMetaRes){
      const saved = JSON.parse(syncMetaRes.value);
      state.syncMeta = Object.assign(state.syncMeta, saved, { status: 'off' });
    }
  } catch(e){
    console.error('Load error', e);
    diagLogEvent('load', 'loadAll threw', { error: e.message||String(e) });
  }
  state.loaded = true;
}

// Runs the Supabase reconciliation in the BACKGROUND, after the app is
// already visible with local data — no more waiting on a network round-trip
// just to see your own cached tasks. While this runs, a full-screen overlay
// blocks every change (per your choice) since local-vs-remote reconciliation
// is exactly the moment a stray edit could get lost or cause a conflict.
async function runBackgroundSync(){
  if(!syncConfigured()) return;
  state.initialSyncBlocking = true;
  state.syncMeta.status = 'syncing';
  renderSyncBlockOverlay();
  const verb = state.syncMeta.dirty ? 'Sending unsaved changes' : 'Pulling latest from Supabase';
  diagLogEvent('startup-sync', `Starting: ${verb}`, { dirty: state.syncMeta.dirty });
  setSyncBlockText(verb + '…');
  const onProgress = (cur, total)=> setSyncBlockText(`${verb}… ${Math.round((cur/total)*100)}%`);
  const startedAt = performance.now();
  try{
    if(state.syncMeta.dirty){
      await pushFullStateToSupabase(onProgress);
    } else {
      await pullFromSupabase(onProgress);
    }
    await markSyncSuccess();
    diagLogEvent('startup-sync', 'Completed OK', { ms: Math.round(performance.now()-startedAt) });
  } catch(e){
    console.error('Background sync failed', e);
    diagLogEvent('startup-sync', 'FAILED', { error: e.message||String(e), ms: Math.round(performance.now()-startedAt) });
    await markSyncError(e.message || String(e));
    showToast('Sync unavailable — continuing with your local data');
  }
  state.initialSyncBlocking = false;
  renderSyncBlockOverlay();
  updateSyncBadge();
  // The app shell (#mainContent, sidebar) doesn't exist yet during the very
  // first automatic sync on startup — it's only built by the full render()
  // inside revealApp(), which runs AFTER this function resolves. Calling
  // renderMain() before that shell exists throws (nothing to write into),
  // and since that throw happens here, outside this function's own
  // try/catch, it silently rejected this whole function's promise — and
  // because init()'s call to this function had no .catch(), revealApp()
  // never ran automatically. That was the actual cause of "stuck at 100%,
  // only the bypass button gets me in." Guarding on whether the shell
  // exists yet keeps both fixes: no crash during the first sync, and no
  // needless sidebar re-animation on every later one.
  if(document.getElementById('mainContent')){
    renderMain();
    updateNavActiveState();
    updateNavBadges();
  }
}

async function markSyncDirty(){
  // Persisted IMMEDIATELY, before any of the actual network calls run. If the
  // tab closes or reloads mid-sync, the next load MUST still see dirty=true
  // — otherwise it wrongly assumes everything's already confirmed on the
  // server, pulls fresh data, and overwrites correct local changes with a
  // stale remote copy that never actually received this update. This was a
  // real, reproducible bug — this write closes that window.
  state.syncMeta.dirty = true;
  state.syncMeta.status = 'syncing';
  await safeStorageSet(STORAGE_KEYS.SYNC_META, JSON.stringify(state.syncMeta), 'sync meta', {silent:true});
}
async function markSyncSuccess(){
  state.syncMeta.dirty = false;
  state.syncMeta.status = 'synced';
  state.syncMeta.lastSyncedAt = new Date().toISOString();
  state.syncMeta.lastError = null;
  await safeStorageSet(STORAGE_KEYS.SYNC_META, JSON.stringify(state.syncMeta));
}
async function markSyncError(message){
  state.syncMeta.status = 'error';
  state.syncMeta.lastError = message;
  // dirty stays true — we know local hasn't been confirmed on the server
  await safeStorageSet(STORAGE_KEYS.SYNC_META, JSON.stringify(state.syncMeta));
  await recordSyncErrorHistory('core', message);
}

/* ---------- Supabase sync (optional, cross-device) ----------
   Normalized tables (see Settings > Sync for the exact SQL):
     one_time_tasks, recurring_tasks, task_completions, lists, list_items,
     health_logs, app_settings, training_exercises, training_sessions,
     training_calendar, training_logs — each scoped by a "pin" column.
   Each entity table also carries a `meta jsonb` column for fields added
   later without needing a migration first.
   Security note: RLS on these tables is permissive (open to anyone holding
   the anon key). The PIN is an app-level convenience, not a cryptographic
   guarantee. */
/* ---------- Backup coverage guard ----------
   Every table the app pushes to Supabase, and every table the backup script
   actually pulls. These are DECLARED lists, not a live check of the script —
   the app cannot read the repo. Their value is that adding a table to the app
   without adding it to the backup produces a visible red banner instead of a
   silent gap that goes unnoticed for months.

   SYNCED_TABLES is verified against the real supaUpsert() calls by the test
   suite, so it cannot drift from what the app actually writes.

   Keep BACKED_UP_TABLES in step with TABLES in backup_calendaros.py. */
const SYNCED_TABLES = [
  'one_time_tasks','recurring_tasks','task_completions','lists','list_items',
  'health_logs','daily_ratings','health_metric_defs','app_settings',
  'training_exercises','training_sessions','training_calendar','training_logs',
  'training_resources','recipes','recipe_ingredients','hydration_logs',
];
const BACKED_UP_TABLES = [
  'one_time_tasks','recurring_tasks','task_completions','lists','list_items',
  'health_logs','daily_ratings','health_metric_defs','app_settings',
  'training_exercises','training_sessions','training_calendar','training_logs',
  'training_resources','recipes','recipe_ingredients','hydration_logs',
];
/* Builds the backup script with its TABLES list generated from SYNCED_TABLES,
   so the code you copy is always current by construction. The banner tells you
   coverage has drifted; this makes fixing it a copy-paste rather than a
   hand-edit you could get wrong. */
function buildBackupScript(){
  const el = document.getElementById('backupScriptTemplate');
  if(!el) return '';
  const lines = [];
  lines.push('TABLES = [');
  lines.push('    # Generated from the app\'s own table list \u2014 keep in step by');
  lines.push('    # re-copying this from Settings whenever the banner appears.');
  SYNCED_TABLES.forEach(t=> lines.push(`    "${t}",`));
  lines.push(']');
  return el.textContent.replace('__TABLES_BLOCK__', lines.join('\n')).trim();
}
function copyBackupScript(){
  const code = buildBackupScript();
  if(!code){ showToast('Backup script not found in this build'); return; }
  copyTextToClipboard(code).then(okCopy=>{
    showToast(okCopy ? 'Backup script copied \u2014 paste it into backup_calendaros.py' : 'Could not copy \u2014 use Download instead');
  });
}
function downloadBackupScript(){
  const code = buildBackupScript();
  if(!code){ showToast('Backup script not found in this build'); return; }
  const blob = new Blob([code], { type:'text/x-python;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'backup_calendaros.py';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('Backup script downloaded');
}
function toggleBackupScriptBlock(){
  const block = document.getElementById('backupScriptBlock');
  const btn = document.getElementById('backupScriptToggleBtn');
  if(!block) return;
  const hidden = block.style.display === 'none';
  block.style.display = hidden ? '' : 'none';

function unbackedUpTables(){
  return SYNCED_TABLES.filter(t=> !BACKED_UP_TABLES.includes(t));
}
function renderBackupCoverageBanner(){
  const missing = unbackedUpTables();
  if(!missing.length) return '';
  return `
    <div class="backup-warning-banner">
      <span class="backup-warning-glyph">\u26A0</span>
      <span class="backup-warning-text">
        <b>${missing.length} table${missing.length===1?' is':'s are'} not covered by the daily backup:</b>
        ${missing.map(t=>`<code>${escapeHtml(t)}</code>`).join(' ')}
        <br>Data in ${missing.length===1?'it':'them'} exists only in Supabase and on your devices \u2014 if it is lost, there is nothing to restore from. Add ${missing.length===1?'it':'them'} to <code>TABLES</code> in <code>backup_calendaros.py</code>.
      </span>
    </div>
  `;
}

function syncConfigured(){
  const s = state.settings.sync;
  return !!(s && s.url && s.anonKey && s.pin);
}
function supaHeaders(extra){
  const s = state.settings.sync;
  return Object.assign({ apikey: s.anonKey, Authorization: `Bearer ${s.anonKey}`, 'Content-Type':'application/json' }, extra||{});
}
// Guards every Supabase call so a dead network or unreachable project can
// never hang the app on the loading screen forever.
async function fetchWithTimeout(url, options, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
  } catch(e){
    if(e.name === 'AbortError') throw new Error('Supabase request timed out — check your connection');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}
async function supaUpsert(table, rows, conflictCols){
  if(!rows.length) return;
  const s = state.settings.sync;
  const url = `${s.url.replace(/\/$/,'')}/rest/v1/${table}?on_conflict=${conflictCols}`;
  try{
    const res = await fetchWithTimeout(url, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(rows)
    });
    if(!res.ok){
      const errText = await res.text();
      diagLogEvent('supabase', `upsert ${table} FAILED`, { status: res.status, rows: rows.length, error: errText.slice(0,300) });
      throw new Error(`${table} upsert failed: ${res.status} ${errText}`);
    }
    diagLogEvent('supabase', `upsert ${table} OK`, { rows: rows.length });
  } catch(e){
    if(!e.message || !e.message.includes('upsert failed')){
      diagLogEvent('supabase', `upsert ${table} THREW`, { rows: rows.length, error: e.message||String(e) });
    }
    throw e;
  }
}
async function supaDeleteMatch(table, matchQuery){
  const s = state.settings.sync;
  const url = `${s.url.replace(/\/$/,'')}/rest/v1/${table}?${matchQuery}`;
  const res = await fetchWithTimeout(url, { method:'DELETE', headers: supaHeaders() });
  if(!res.ok){
    diagLogEvent('supabase', `delete ${table} FAILED`, { status: res.status, matchQuery });
    throw new Error(`${table} delete failed: ${res.status}`);
  }
  diagLogEvent('supabase', `delete ${table} OK`, { matchQuery });
}
const SUPA_PAGE_SIZE = 1000;

/* Reads EVERY row of a table, in pages.

   This used to be a single unbounded request. PostgREST caps how many rows it
   will return in one response (Supabase's default cap is commonly 1000) and it
   truncates SILENTLY — a 200 OK with a partial body and no indication that
   anything is missing. That is uniquely dangerous here, because a pull replaces
   local state wholesale and the app then pushes that state back: a truncated
   read would have become a real deletion on the next save. task_completions was
   already at ~830 rows and growing ~28/day, so this was days away from biting.

   Two safety rules, both deliberate:
   1. Any failure THROWS rather than returning what we managed to collect.
      Callers are already written to treat a throw as "leave local alone"
      (see the fault-isolated pull blocks), whereas a short array would be
      indistinguishable from "the server really has fewer rows now".
   2. If the server reports a total via Content-Range and we did not end up
      with exactly that many rows, that is also a throw. Silent truncation is
      the thing being defended against, so a count mismatch must never pass. */
async function supaSelectAll(table){
  const s = state.settings.sync;
  const base = `${s.url.replace(/\/$/,'')}/rest/v1/${table}?pin=eq.${encodeURIComponent(s.pin)}&select=*`;
  const rows = [];
  let offset = 0;
  let reportedTotal = null;

  while(true){
    const res = await fetchWithTimeout(base, {
      headers: supaHeaders({
        'Range-Unit': 'items',
        'Range': `${offset}-${offset + SUPA_PAGE_SIZE - 1}`,
        // count=exact makes PostgREST report the true total in Content-Range,
        // which is what lets us prove we got everything.
        'Prefer': 'count=exact'
      })
    });
    if(!res.ok){
      diagLogEvent('supabase', `select ${table} FAILED`, { status: res.status, offset });
      throw new Error(`${table} select failed: ${res.status}`);
    }
    const page = await res.json();
    if(!Array.isArray(page)){
      throw new Error(`${table} select returned an unexpected payload`);
    }
    if(reportedTotal === null){
      const cr = res.headers && res.headers.get ? res.headers.get('Content-Range') : null;
      const m = cr && /\/(\d+)\s*$/.exec(cr);
      if(m) reportedTotal = parseInt(m[1], 10);
    }

    // A server that ignores Range hands back the whole table at once. Paging
    // on from there would duplicate rows, so treat it as complete.
    if(page.length > SUPA_PAGE_SIZE){
      rows.length = 0;
      rows.push(...page);
      break;
    }

    rows.push(...page);
    if(page.length < SUPA_PAGE_SIZE) break; // last page
    offset += SUPA_PAGE_SIZE;

    if(offset > 500000){
      throw new Error(`${table} select exceeded 500k rows — aborting rather than looping`);
    }
  }

  if(reportedTotal !== null && rows.length !== reportedTotal){
    diagLogEvent('supabase', `select ${table} TRUNCATED`, { got: rows.length, expected: reportedTotal });
    throw new Error(`${table} select incomplete: got ${rows.length} of ${reportedTotal} rows — refusing to use a partial read`);
  }

  diagLogEvent('supabase', `select ${table} OK`, { rows: rows.length, pages: Math.max(1, Math.ceil(rows.length / SUPA_PAGE_SIZE)) });
  return rows;
}

/* Single accessor for an exercise's videos. Exercises may carry the legacy
   single `videoUrl`, the newer `videoUrls` array, or both — every consumer
   goes through here so none of them has to know which. */
function exVideoUrls(ex){
  if(!ex) return [];
  const out = [];
  const push = (u)=>{
    if(typeof u !== 'string') return;
    const t = u.trim();
    if(t && !out.includes(t)) out.push(t);
  };
  if(Array.isArray(ex.videoUrls)) ex.videoUrls.forEach(push);
  push(ex.videoUrl);
  return out;
}

/* ---- full push / pull ---- */
async function pushFullStateToSupabase(onProgress){
  const coreSteps = [
    ()=> supaUpsert('one_time_tasks', state.tasks.oneTime.map(oneTimeToRow), 'id'),
    ()=> supaUpsert('recurring_tasks', state.tasks.recurring.map(recurringToRow), 'id'),
    ()=> flushPendingCompletionDeletes(),
    ()=> { const rows = buildCompletionRows(); return rows.length ? supaUpsert('task_completions', rows, 'pin,task_id,completed_date') : null; },
    ()=> supaUpsert('lists', state.lists.map((l,i)=>listToRow(l,i)), 'id'),
    ()=> {
      const itemRows = [];
      state.lists.forEach(l=> l.items.forEach((it,i)=> itemRows.push(listItemToRow(it, l.id, i))));
      return itemRows.length ? supaUpsert('list_items', itemRows, 'id') : null;
    },
    ()=> { const rows = state.health.map(healthToRow); return rows.length ? supaUpsert('health_logs', rows, 'pin,log_date') : null; },
    ()=> { const rows = state.dailyRatings.map(ratingToRow); return rows.length ? supaUpsert('daily_ratings', rows, 'pin,rating_date') : null; },
    ()=> flushPendingMetricDefDeletes(),
    ()=> { const rows = state.healthMetricDefs.map(metricDefToRow); return rows.length ? supaUpsert('health_metric_defs', rows, 'pin,id') : null; },
    ()=> supaUpsert('app_settings', [{ pin: state.settings.sync.pin, locations: state.settings.locations, silos: state.settings.silos, list_folders: state.settings.listFolders, week_view_presets: state.settings.weekViewPresets, calendar_view_presets: state.settings.calendarViewPresets, hydration_containers: state.settings.hydrationContainers, hydration_goal_ml: state.settings.hydrationGoalMl, exercise_tags: state.settings.exerciseTags, weekend_days: state.settings.weekendDays, location_day_rules: state.settings.locationDayRules, last_active_date: state.settings.lastActiveDate }], 'pin'),
  ];
  // Training runs AFTER the core steps and is deliberately fault-isolated
  // from them: if the training-tables SQL migration hasn't been run yet in
  // this Supabase project (or any other training-specific failure happens),
  // that must NEVER abort or fail the core task/list/health push. Before
  // this isolation, a single throw anywhere in this array failed the whole
  // function — meaning a training-table issue alone marked the entire push
  // "failed" (dirty stays true forever, retried and failing identically on
  // every subsequent load) even though the real task data already made it
  // to Supabase. That's the same failure shape as the v2.7.3 dirty-flag bug,
  // just from a different cause — closing it the same way: isolate blast radius.
  const trainingSteps = [
    ()=> flushPendingTrainingDeletes(),
    ()=> supaUpsert('training_exercises', state.training.exercises.map(trainingExerciseToRow), 'pin,id'),
    ()=> supaUpsert('training_sessions', state.training.sessions.map(trainingSessionToRow), 'pin,id'),
    ()=> { const rows = state.training.calendar.map(trainingCalendarToRow); return rows.length ? supaUpsert('training_calendar', rows, 'pin,cal_date') : null; },
    ()=> { const rows = state.training.logs.map(trainingLogToRow); return rows.length ? supaUpsert('training_logs', rows, 'pin,log_date,exercise_id') : null; },
  ];
  const total = coreSteps.length + trainingSteps.length;
  for(let i=0;i<coreSteps.length;i++){
    await coreSteps[i](); // core failures still throw and correctly fail the whole sync — unchanged
    if(onProgress) onProgress(i+1, total);
  }
  try{
    for(let i=0;i<trainingSteps.length;i++){
      await trainingSteps[i]();
      if(onProgress) onProgress(coreSteps.length+i+1, total);
    }
  } catch(e){
    // Swallowed deliberately. Logged so it's visible in Settings > Activity
    // & Error Log, but this must never propagate and fail the core sync.
    diagLogEvent('sync', 'Training push failed — core sync still succeeded', { error: e.message||String(e) });
    recordSyncErrorHistory('training-push', e.message||String(e));
    console.error('Training push failed (core task/list/health data still synced fine):', e);
  }
  // Recipes: same fault-isolation treatment as Training, for the same
  // reason — a missing/failed recipe-table migration must never be able to
  // fail the core task/list/health push.
  try{
    await flushPendingRecipeDeletes();
    await supaUpsert('recipes', state.recipes.items.map(recipeToRow), 'pin,id');
    const ingredientRows = [];
    state.recipes.items.forEach(r=> (r.ingredients||[]).forEach((ing,idx)=> ingredientRows.push(recipeIngredientToRow(ing, r.id, idx))));
    if(ingredientRows.length) await supaUpsert('recipe_ingredients', ingredientRows, 'pin,id');
  } catch(e){
    diagLogEvent('sync', 'Recipes push failed — core sync still succeeded', { error: e.message||String(e) });
    recordSyncErrorHistory('recipes-push', e.message||String(e));
    console.error('Recipes push failed (core task/list/health data still synced fine):', e);
  }
  // Hydration: same fault-isolation treatment as Training/Recipes.
  try{
    await flushPendingHydrationDeletes();
    if(state.hydrationLogs.length) await supaUpsert('hydration_logs', state.hydrationLogs.map(hydrationLogToRow), 'pin,id');
  } catch(e){
    diagLogEvent('sync', 'Hydration push failed — core sync still succeeded', { error: e.message||String(e) });
    recordSyncErrorHistory('hydration-push', e.message||String(e));
    console.error('Hydration push failed (core task/list/health data still synced fine):', e);
  }
}

async function pullFromSupabase(onProgress){
  const coreTables = ['one_time_tasks','recurring_tasks','task_completions','lists','list_items','health_logs','daily_ratings','health_metric_defs','app_settings'];
  const trainingTables = ['training_exercises','training_sessions','training_calendar','training_logs'];
  const recipeTables = ['recipes','recipe_ingredients'];
  const hydrationTables = ['hydration_logs'];
  const totalTables = coreTables.length + trainingTables.length + recipeTables.length + hydrationTables.length;
  const results = {};
  for(let i=0;i<coreTables.length;i++){
    results[coreTables[i]] = await supaSelectAll(coreTables[i]);
    if(onProgress) onProgress(i+1, totalTables);
  }
  const { one_time_tasks:oneTimeRows, recurring_tasks:recurringRows, task_completions:completionRows,
          lists:listRows, list_items:itemRows, health_logs:healthRows, daily_ratings:ratingRows, health_metric_defs:metricDefRows, app_settings:settingsRows } = results;

  // Training is fetched separately, AFTER the core tables, and is
  // deliberately fault-isolated: if the training-tables SQL migration
  // hasn't been run yet in this Supabase project (or any other
  // training-specific failure happens), that must NEVER abort the core
  // task/list/health pull. Before this isolation, one throw anywhere in a
  // single combined table loop aborted the ENTIRE pull before any state
  // assignment ran — meaning a training-table issue alone was enough to
  // make every subsequent app open silently fall back to old local/cached
  // data instead of pulling the real confirmed state, on any device that
  // wasn't the one holding the latest changes. That is very likely the
  // exact mechanism behind "tasks I cleared this morning came back a few
  // hours later" — closing it the same way the v2.7.3 dirty-flag bug was
  // closed: isolate blast radius so a training issue can only ever affect
  // training data, never the core task pull.
  let trainingPulled = null;
  try{
    const trainResults = {};
    for(let i=0;i<trainingTables.length;i++){
      trainResults[trainingTables[i]] = await supaSelectAll(trainingTables[i]);
      if(onProgress) onProgress(coreTables.length+i+1, totalTables);
    }
    trainingPulled = trainResults;
  } catch(e){
    diagLogEvent('sync', 'Training pull failed — core pull still proceeded', { error: e.message||String(e) });
    recordSyncErrorHistory('training-pull', e.message||String(e));
    console.error('Training pull failed (core task/list/health data still pulled fine):', e);
  }

  // Recipes: same fault-isolation as Training — a missing/failed migration
  // here must never abort the core pull.
  let recipesPulled = null;
  try{
    const recipeResults = {};
    for(let i=0;i<recipeTables.length;i++){
      recipeResults[recipeTables[i]] = await supaSelectAll(recipeTables[i]);
      if(onProgress) onProgress(coreTables.length+trainingTables.length+i+1, totalTables);
    }
    recipesPulled = recipeResults;
  } catch(e){
    diagLogEvent('sync', 'Recipes pull failed — core pull still proceeded', { error: e.message||String(e) });
    recordSyncErrorHistory('recipes-pull', e.message||String(e));
    console.error('Recipes pull failed (core task/list/health data still pulled fine):', e);
  }

  // Hydration: same fault-isolation as Training/Recipes — a missing/failed
  // migration here must never abort the core pull.
  let hydrationPulled = null;
  try{
    const hydrationResults = {};
    for(let i=0;i<hydrationTables.length;i++){
      hydrationResults[hydrationTables[i]] = await supaSelectAll(hydrationTables[i]);
      if(onProgress) onProgress(coreTables.length+trainingTables.length+recipeTables.length+i+1, totalTables);
    }
    hydrationPulled = hydrationResults;
  } catch(e){
    diagLogEvent('sync', 'Hydration pull failed — core pull still proceeded', { error: e.message||String(e) });
    recordSyncErrorHistory('hydration-pull', e.message||String(e));
    console.error('Hydration pull failed (core task/list/health data still pulled fine):', e);
  }

  const hasAnyRemoteData = oneTimeRows.length || recurringRows.length || listRows.length;

  // Snapshot what THIS DEVICE currently holds, before any of it is replaced
  // by the pull. Without this there is nothing left to compare against or
  // to restore from if the person decides the local copy was the right one.
  const localSnapshot = hasAnyRemoteData ? {
    oneTime: JSON.parse(JSON.stringify(state.tasks.oneTime||[])),
    recurring: JSON.parse(JSON.stringify(state.tasks.recurring||[])),
    completions: JSON.parse(JSON.stringify(state.tasks.completions||{})),
    lists: JSON.parse(JSON.stringify(state.lists||[])),
  } : null;

  if(hasAnyRemoteData){
    state.tasks.oneTime = oneTimeRows.map(rowToOneTime);
    state.tasks.recurring = recurringRows.map(rowToRecurring);
    const completions = {};
    completionRows.forEach(r=>{
      if(!completions[r.task_id]) completions[r.task_id] = {};
      completions[r.task_id][r.completed_date] = { status: r.status || 'done', loggedAt: r.logged_at || null };
    });

    // Reconcile against the local offline-safety buffer — if this device has
    // more recent activity than what just came from Supabase (e.g. changes
    // made while genuinely offline), the local version wins rather than
    // being silently overwritten by the pull.
    let needsReconcilePush = false;
    try{
      const recentRes = await safeGet(STORAGE_KEYS.RECENT_COMPLETIONS);
      if(recentRes){
        const buffer = decodeCompletionsBuffer(JSON.parse(recentRes.value));
        const { merged, hadNewerLocal } = mergeRecentCompletionsIntoRemote(completions, buffer);
        state.tasks.completions = merged;
        needsReconcilePush = hadNewerLocal;
        if(hadNewerLocal) diagLogEvent('sync', 'Pull found newer local completions than Supabase had — reconciling');
      } else {
        state.tasks.completions = completions;
      }
    } catch(e){
      state.tasks.completions = completions;
    }

    listRows.sort((a,b)=> (a.sort_order||0)-(b.sort_order||0));
    const itemsByList = {};
    itemRows.sort((a,b)=> (a.sort_order||0)-(b.sort_order||0)).forEach(r=>{
      if(!itemsByList[r.list_id]) itemsByList[r.list_id] = [];
      itemsByList[r.list_id].push({ id:r.id, text:r.text, category:r.category, done:!!r.done });
    });
    state.lists = listRows.map(l=>({ id:l.id, title:l.title, folder:l.folder||null, items: itemsByList[l.id] || [] }));

    // Now that the remote copy has been applied, compare it against what this
    // device held a moment ago. Anything meaningful that differs is surfaced
    // as an explicit choice rather than silently resolved — silent resolution
    // is exactly what previously reverted completed tasks and wiped list
    // folder assignments without anyone noticing.
    if(localSnapshot){
      pendingDivergence = detectDivergence(localSnapshot, {
        oneTime: state.tasks.oneTime,
        recurring: state.tasks.recurring,
        completions: state.tasks.completions,
        lists: state.lists,
      }, localSnapshot);
    }

    state.health = healthRows.map(rowToHealth);
    state.dailyRatings = ratingRows.map(rowToRating);
    state.healthMetricDefs = metricDefRows.map(rowToMetricDef);
    pendingMetricDefDeletes.length = 0; // remote is now authoritative, drop any stale pending deletes
    ensureCoreMetricDefs();

    // training_resources is pulled SEPARATELY and is NOT in trainingTables, on
    // purpose. supaSelectAll THROWS on a missing table, so including a
    // newly-added table in that loop would mean any project that hasn't run
    // the v4.28.0 migration yet fails its ENTIRE training pull — precisely the
    // blast-radius failure described above. Isolated here, a missing
    // training_resources table can only ever affect resources.
    let resourcesPulled = null;
    try{
      resourcesPulled = await supaSelectAll('training_resources');
    } catch(e){
      diagLogEvent('supabase', 'training_resources pull skipped (table missing or unreachable)', { error: e.message||String(e) });
    }

    if(trainingPulled){
      state.training = {
        exercises: trainingPulled.training_exercises.map(rowToTrainingExercise),
        sessions: trainingPulled.training_sessions.map(rowToTrainingSession),
        calendar: trainingPulled.training_calendar.map(rowToTrainingCalendar),
        logs: trainingPulled.training_logs.map(rowToTrainingLog),
        // If the resources pull failed, PRESERVE what's already local rather
        // than assigning [] — otherwise a missing table would silently delete
        // the person's whole reference library on the next open.
        resources: resourcesPulled ? resourcesPulled.map(rowToTrainingResource) : ((state.training && state.training.resources) || []),
      };
      pendingTrainingDeletes.length = 0; // remote is now authoritative, drop any stale pending deletes
    } else if(resourcesPulled){
      // Training pull failed but resources came back — apply just that slice,
      // leaving every other part of state.training untouched.
      state.training = Object.assign({}, state.training, { resources: resourcesPulled.map(rowToTrainingResource) });
    }
    // else: training fetch failed — leave state.training exactly as it was
    // (whatever loadAll() already put there), rather than wiping it or
    // crashing. Local training data (and its own next successful sync) is
    // unaffected by this pull's training-fetch failure.

    if(recipesPulled){
      const ingredientsByRecipe = {};
      recipesPulled.recipe_ingredients.forEach(r=>{
        if(!ingredientsByRecipe[r.recipe_id]) ingredientsByRecipe[r.recipe_id] = [];
        ingredientsByRecipe[r.recipe_id].push(r);
      });
      state.recipes = { items: recipesPulled.recipes.map(r=> rowToRecipe(r, ingredientsByRecipe[r.id])) };
      pendingRecipeDeletes.length = 0;
    }
    // else: recipes fetch failed — same "leave it as-is" treatment as training.

    if(hydrationPulled){
      state.hydrationLogs = hydrationPulled.hydration_logs.map(rowToHydrationLog);
      pendingHydrationDeletes.length = 0;
    }
    // else: hydration fetch failed — same "leave it as-is" treatment as training/recipes.

    if(settingsRows.length){
      state.settings.locations = settingsRows[0].locations || state.settings.locations;
      state.settings.silos = settingsRows[0].silos || state.settings.silos;
      if(settingsRows[0].list_folders) state.settings.listFolders = settingsRows[0].list_folders;
      if(settingsRows[0].week_view_presets) state.settings.weekViewPresets = settingsRows[0].week_view_presets;
      if(settingsRows[0].calendar_view_presets) state.settings.calendarViewPresets = settingsRows[0].calendar_view_presets;
      if(settingsRows[0].hydration_containers) state.settings.hydrationContainers = settingsRows[0].hydration_containers;
      if(settingsRows[0].exercise_tags) state.settings.exerciseTags = settingsRows[0].exercise_tags;
      if(settingsRows[0].hydration_goal_ml!=null) state.settings.hydrationGoalMl = settingsRows[0].hydration_goal_ml;
      // Array.isArray rather than truthiness: an intentionally EMPTY array
      // (all weekend days cleared, or all location rules deleted) must still
      // apply, while a missing column — i.e. the migration hasn't been run
      // yet — is undefined and correctly leaves the local value untouched.
      if(Array.isArray(settingsRows[0].weekend_days)) state.settings.weekendDays = settingsRows[0].weekend_days;
      if(Array.isArray(settingsRows[0].location_day_rules)) state.settings.locationDayRules = settingsRows[0].location_day_rules;
      // Whichever device confirmed a later day wins — this is what makes
      // "start a new day on one device" actually show up on the others,
      // instead of each device only ever trusting its own local record.
      const remoteLastActive = settingsRows[0].last_active_date;
      if(remoteLastActive && (!state.settings.lastActiveDate || remoteLastActive > state.settings.lastActiveDate)){
        state.settings.lastActiveDate = remoteLastActive;
      }
    }
    pendingCompletionDeletes.length = 0; // remote is now authoritative, drop any stale pending deletes

    // Local writes here are just refreshing the offline cache. This code
    // path only ever runs when sync is configured (pullFromSupabase is only
    // called in that case), so only the small, bounded task/list structure
    // gets cached locally — completion/health/ratings history stays in
    // memory and in Supabase only, never written to local storage here.
    await safeStorageSet(STORAGE_KEYS.TASKS, JSON.stringify({ oneTime: state.tasks.oneTime, recurring: state.tasks.recurring }), 'tasks');
    await safeStorageSet(STORAGE_KEYS.RECENT_COMPLETIONS, JSON.stringify(buildRecentCompletionsBuffer(state.tasks.completions)), 'completions safety buffer');
    await safeStorageSet(STORAGE_KEYS.LISTS, JSON.stringify(state.lists), 'lists');
    try{ await window.storage.delete(STORAGE_KEYS.HEALTH, false); } catch(e){}
    try{ await window.storage.delete(STORAGE_KEYS.RATINGS, false); } catch(e){}
    try{ await window.storage.set(STORAGE_KEYS.HEALTH_METRIC_DEFS, JSON.stringify(state.healthMetricDefs), false); } catch(e){ console.error('local cache write failed (metric defs)', e); }
    if(trainingPulled){ try{ await window.storage.set(STORAGE_KEYS.TRAINING, JSON.stringify(state.training), false); } catch(e){ console.error('local cache write failed (training)', e); } }
    if(recipesPulled){ try{ await window.storage.set(STORAGE_KEYS.RECIPES, JSON.stringify(state.recipes), false); } catch(e){ console.error('local cache write failed (recipes)', e); } }
    if(hydrationPulled){ try{ await window.storage.set(STORAGE_KEYS.HYDRATION, JSON.stringify(state.hydrationLogs), false); } catch(e){ console.error('local cache write failed (hydration)', e); } }
    await safeStorageSet(STORAGE_KEYS.SETTINGS, JSON.stringify(state.settings), 'settings');

    if(needsReconcilePush){
      // this device had offline activity Supabase didn't know about — push
      // the merged, corrected state back so Supabase (and other devices)
      // catch up, rather than waiting for the next unrelated user action.
      scheduleSync('tasks', ()=>[
        ()=> supaUpsert('one_time_tasks', state.tasks.oneTime.map(oneTimeToRow), 'id'),
        ()=> supaUpsert('recurring_tasks', state.tasks.recurring.map(recurringToRow), 'id'),
        ()=> { const rows = buildCompletionRows(); return rows.length ? supaUpsert('task_completions', rows, 'pin,task_id,completed_date') : null; },
      ]);
    }
  } else {
    // nothing remote yet — seed it from what we have locally
    await pushFullStateToSupabase(onProgress);
  }
}

async function testSupabaseConnection(url, anonKey, pin){
  const testUrl = `${url.replace(/\/$/,'')}/rest/v1/one_time_tasks?pin=eq.${encodeURIComponent(pin)}&limit=1`;
  const res = await fetchWithTimeout(testUrl, { headers: { apikey: anonKey, Authorization: `Bearer ${anonKey}` } }, 10000);
  if(!res.ok) throw new Error('Connection test failed: HTTP ' + res.status);
  return true;
}

async function safeGet(key){
  try{
    return await window.storage.get(key, false);
  } catch(e){
    return null;
  }
}

// Wraps window.storage.set with a couple of short retries before giving up —
// a transient rejection (e.g. two writes landing in the same instant) shouldn't
// mean a lost change. Returns true/false instead of throwing, and surfaces the
// real error message so a genuine failure is diagnosable without dev tools.
function isQuotaError(e){
  if(!e) return false;
  const msg = (e.message || String(e)).toLowerCase();
  return e.name === 'QuotaExceededError' || msg.includes('quota') || msg.includes('exceeded');
}

// ---------------------------------------------------------------
// STORAGE PRIORITY TIERS
//
// A full local cache used to cause SILENT data loss: writes for lists and
// the completions buffer were wrapped in bare try/catch blocks that only
// console.error'd. When the quota filled up (which was happening ~daily),
// those writes failed unnoticed, the local cache kept serving STALE data,
// and on the next partial sync that stale data won the merge — which is how
// completed tasks came back as pending and lists lost their folder
// assignments. Fixing the quota problem IS fixing that data loss.
//
// DISPOSABLE = pure caches. Every one of these is fully recoverable from
// Supabase on the next successful pull, so throwing them away costs nothing
// but a moment of load time. They are also the biggest and fastest-growing
// things in local storage (hydration grows every time you log a drink;
// training logs grow every session; recipes can hold long text).
//
// CRITICAL = the local-only safety net. If these are lost, the data is
// genuinely gone or silently reverted. They must always win the fight for
// space, so we evict disposables to make room for them rather than the
// other way around.
const DISPOSABLE_STORAGE_KEYS = [
  'dispatch:hydration',
  'dispatch:training',
  'dispatch:recipes',
  'dispatch:health',
  'dispatch:ratings',
  'dispatch:healthmetricdefs',
  'dispatch:syncerrorhistory',
];
const CRITICAL_STORAGE_KEYS = [
  'dispatch:recentcompletions', // the ONLY local record of completion history
  'dispatch:lists',             // holds folder assignments
  'dispatch:tasks',
  'dispatch:settings',
  'dispatch:trainingdrafts',    // the ONLY copy of typed-but-not-yet-saved training entry
];
async function evictDisposableCaches(exceptKey){
  let evicted = [];
  for(const key of DISPOSABLE_STORAGE_KEYS){
    if(key === exceptKey) continue;
    try{
      const existing = await window.storage.get(key, false);
      if(existing){
        await window.storage.delete(key, false);
        evicted.push(key);
      }
    } catch(e){ /* key absent or unreadable — nothing to reclaim, keep going */ }
  }
  if(evicted.length){
    diagLogEvent('local-save', `Local storage full — evicted ${evicted.length} disposable cache(s) to protect critical data`, { evicted });
  }
  return evicted;
}

async function safeStorageSet(key, value, label, opts){
  opts = opts || {};
  const delays = [0, 300, 900];
  let lastErr = null;
  let triedEviction = false;
  for(let i=0;i<delays.length;i++){
    if(delays[i]) await new Promise(r=>setTimeout(r, delays[i]));
    try{
      await window.storage.set(key, value, false);
      diagLogEvent('local-save', `OK "${label||key}"`, { bytes: value.length });
      return true;
    } catch(e){
      lastErr = e;
      if(isQuotaError(e)){
        // Retrying the same payload against a full cache is pointless — but
        // making ROOM and then retrying is not. Disposable caches are all
        // re-fetchable from Supabase, so we trade them for the write we're
        // trying to land. Only done once per call, and only for quota errors.
        if(!triedEviction){
          triedEviction = true;
          const evicted = await evictDisposableCaches(key);
          if(evicted.length){
            try{
              await window.storage.set(key, value, false);
              diagLogEvent('local-save', `OK "${label||key}" (after evicting ${evicted.length} disposable cache(s))`, { bytes: value.length, evicted });
              if(!opts.silent) showToast(`Local storage was full — cleared ${evicted.length} re-downloadable cache${evicted.length===1?'':'s'} to make room`);
              return true;
            } catch(e2){ lastErr = e2; }
          }
        }
        break; // still no room even after eviction
      }
    }
  }
  console.error(`Local save failed for "${label||key}" after retries:`, lastErr);
  diagLogEvent('local-save', `FAILED "${label||key}"`, { bytes: value.length, error: lastErr&&lastErr.message, isQuota: isQuotaError(lastErr) });
  // A failed write to a CRITICAL key is a data-integrity event, not a cosmetic
  // one — it must never pass silently, regardless of the caller's silent flag,
  // because silence here is exactly what let the original data loss happen.
  const isCritical = CRITICAL_STORAGE_KEYS.includes(key);
  if(!opts.silent || isCritical){
    showToast(isCritical
      ? `⚠ Could not save ${label||key} locally — your Supabase copy is still authoritative, but avoid working offline until this clears`
      : `⚠ Save failed: ${lastErr && lastErr.message ? lastErr.message : 'storage unavailable'}`);
  }
  return { ok:false, err:lastErr };
}

// Only trims the copy written to the browser's local cache — Supabase always
// gets the full, untrimmed history via the normal sync steps. This is purely
// about staying under the browser's local storage size limit, which only
// applies when running outside claude.ai (Supabase has no such limit).
// Offline safety net: even when sync is configured (so full completion
// history isn't cached locally — see saveTasks), a small BOUNDED window of
// just the most recent activity still gets written locally every save.
// Without this, marking things done while genuinely offline only lives in
// memory — if the tab closes or reloads before a sync succeeds, that work
// is gone with no local trace at all. This buffer is small enough (a couple
// weeks, not years) to never recreate the original quota problem, while
// still surviving a realistic offline session.
// RETIRED (was 14): the completions safety buffer is now unbounded. This
// window is deliberately no longer used — see buildRecentCompletionsBuffer
// for why capping it caused real data loss.
const RECENT_COMPLETIONS_WINDOW_DAYS = null;
// The buffer is stored in a COMPACT encoding rather than raw state shape.
// Raw form per entry is ~55 bytes: {"status":"done","loggedAt":"2026-01-01T00:00:00.000Z"}
// Compact form is ~14: "d|1767225600"  (status char + epoch SECONDS)
// With years of daily recurring tasks this is the difference between a
// buffer that fits comfortably and one that trips the storage quota — which
// matters because this buffer is the only local record of completion
// history and must never be the thing that gets dropped.
function encodeCompletionEntry(o){
  const statusChar = (o && o.status === 'missed') ? 'm' : 'd';
  if(!o || !o.loggedAt) return statusChar;
  const secs = Math.floor(new Date(o.loggedAt).getTime()/1000);
  return isNaN(secs) ? statusChar : `${statusChar}|${secs}`;
}
function decodeCompletionEntry(v){
  // Tolerates the OLD object format too, so an existing buffer written by a
  // previous version still loads correctly instead of being discarded.
  if(v && typeof v === 'object') return { status: v.status || 'done', loggedAt: v.loggedAt || null };
  const s = String(v||'d');
  const [statusChar, secs] = s.split('|');
  return {
    status: statusChar === 'm' ? 'missed' : 'done',
    loggedAt: secs ? new Date(Number(secs)*1000).toISOString() : null,
  };
}
function encodeCompletionsBuffer(completions){
  const out = {};
  Object.entries(completions||{}).forEach(([taskId, byDate])=>{
    const kept = {};
    Object.entries(byDate||{}).forEach(([dateStr, o])=>{ kept[dateStr] = encodeCompletionEntry(o); });
    if(Object.keys(kept).length) out[taskId] = kept;
  });
  return out;
}
function decodeCompletionsBuffer(raw){
  const out = {};
  Object.entries(raw||{}).forEach(([taskId, byDate])=>{
    const kept = {};
    Object.entries(byDate||{}).forEach(([dateStr, v])=>{ kept[dateStr] = decodeCompletionEntry(v); });
    if(Object.keys(kept).length) out[taskId] = kept;
  });
  return out;
}
// Previously this kept only a 14-day window. That window was the exact
// mechanism behind a real, reported data-loss incident: completions from
// 2-3 weeks earlier (i.e. JUST outside the window) silently reverted to
// pending after a partial/failed sync, because there was no local copy left
// to restore them from — completion history is deliberately not kept in the
// main task cache, so this buffer is the ONLY local record of it.
// It is now unbounded, but stored compactly (see encodeCompletionsBuffer).
function buildRecentCompletionsBuffer(completions){
  return encodeCompletionsBuffer(completions);
}
// Merges a local completions buffer into freshly-pulled remote data — for any
// (task, date) where the local entry is newer, OR where remote is simply
// missing it, the local version wins and gets pushed back.
//
// INVARIANT this enforces: a pull can NEVER un-complete something. If a task
// is marked done locally and the pull doesn't mention it, that means the pull
// was partial/stale — NOT that the task was un-completed. Un-completing is an
// explicit user action, and that path goes through pendingCompletionDeletes
// (which actually tells Supabase to delete the row), never through here.
// Without this, a partial pull silently reverts completions to pending —
// exactly the reported data-loss incident.
function mergeRecentCompletionsIntoRemote(remoteCompletions, localBuffer){
  const merged = JSON.parse(JSON.stringify(remoteCompletions||{}));
  let hadNewerLocal = false;
  let restoredCount = 0;
  Object.entries(localBuffer||{}).forEach(([taskId, byDate])=>{
    Object.entries(byDate).forEach(([dateStr, localEntry])=>{
      const remoteEntry = merged[taskId] && merged[taskId][dateStr];
      const remoteMissing = !remoteEntry;
      const localIsNewer = remoteMissing || (localEntry.loggedAt && (!remoteEntry.loggedAt || localEntry.loggedAt > remoteEntry.loggedAt));
      if(localIsNewer){
        if(!merged[taskId]) merged[taskId] = {};
        merged[taskId][dateStr] = localEntry;
        hadNewerLocal = true;
        if(remoteMissing) restoredCount++;
      }
    });
  });
  if(restoredCount){
    diagLogEvent('sync', `Pull was missing ${restoredCount} completion(s) that exist locally — restored them and re-pushing (a pull can never un-complete a task)`, { restoredCount });
  }
  return { merged, hadNewerLocal, restoredCount };
}

function pruneCompletionsForCache(tasks, maxDays){
  const cutoff = addDays(todayStr(), -maxDays);
  const trimmedCompletions = {};
  Object.entries(tasks.completions).forEach(([taskId, byDate])=>{
    const kept = {};
    Object.entries(byDate).forEach(([dateStr, o])=>{ if(dateStr >= cutoff) kept[dateStr] = o; });
    if(Object.keys(kept).length) trimmedCompletions[taskId] = kept;
  });
  return { oneTime: tasks.oneTime, recurring: tasks.recurring, completions: trimmedCompletions };
}

// Remembers the last trim level that actually worked for each local cache,
// so once a device settles into "trimmed mode" it stays quiet instead of
// re-attempting (and re-failing) the full untrimmed payload — and showing
// the same warning toast — on every single save. This resets on reload, so
// if more room frees up, the next fresh session will notice and recover.
const localTrimState = { tasks: null, health: null, ratings: null };

// Saves the tasks blob locally, automatically trimming old completion
// history if the browser's local storage quota is hit — rather than just
// failing outright. Full history is never lost: it stays in memory for this
// session and in Supabase if sync is on; only the local offline cache shrinks.
async function saveTasksLocalWithFallback(){
  // Already known this session to need trimming — go straight to the last
  // working level instead of re-probing (and re-failing) the full payload.
  if(localTrimState.tasks){
    const trimmed = pruneCompletionsForCache(state.tasks, localTrimState.tasks);
    const res = await safeStorageSet(STORAGE_KEYS.TASKS, JSON.stringify(trimmed), 'tasks', {silent:true});
    if(res === true) return true;
    // even the known-good level stopped fitting (data grew) — fall through and re-probe from scratch
  }

  const fullResult = await safeStorageSet(STORAGE_KEYS.TASKS, JSON.stringify(state.tasks), 'tasks', {silent:true});
  if(fullResult === true){
    if(localTrimState.tasks !== null){
      showToast('Local cache has room again — back to keeping full history');
      localTrimState.tasks = null;
    }
    return true;
  }
  if(!isQuotaError(fullResult.err)){
    showToast(`⚠ Save failed: ${fullResult.err && fullResult.err.message ? fullResult.err.message : 'storage unavailable'}`);
    return false;
  }
  for(const days of [365, 180, 90, 30, 14, 7, 3]){
    const trimmed = pruneCompletionsForCache(state.tasks, days);
    const res = await safeStorageSet(STORAGE_KEYS.TASKS, JSON.stringify(trimmed), 'tasks', {silent:true});
    if(res === true){
      const changed = localTrimState.tasks !== days;
      localTrimState.tasks = days;
      if(changed){
        showToast(syncConfigured()
          ? `Local cache trimmed to fit (kept last ${days} days) — full history will still sync to Supabase`
          : `⚠ Local cache trimmed to fit (kept last ${days} days) — set up Supabase sync to keep full history safe`);
      }
      return true;
    }
  }
  showToast('⚠ Local cache is full even after trimming — this change may not survive a browser restart. Consider setting up Supabase sync.');
  return false;
}

// Runs a list of {label, fn} sync steps sequentially, updating syncMeta
// progress (and the badge) after each so "syncing... 43%" is real progress,
// not a guess. Used by every save path so progress shows up everywhere.
// Serializes every sync push so two saves can never race each other. Without
// this, a slow/earlier save could still be holding a stale, larger snapshot
// of the data (e.g. a completion row that has since been unchecked) and
// overwrite a newer, smaller snapshot if it happens to finish later —
// resurrecting things that were just deleted. Queuing means only one sync
// runs at a time, and each one reads state fresh right when its turn comes
// (see the lazy `()=> ...` closures below), not from a snapshot taken back
// when the click happened.
let syncChain = Promise.resolve();
function enqueueSync(taskFn){
  // Hard stop when the session is locked. This is the single choke point every
  // outbound write passes through, so guarding here means a locked tab cannot
  // transmit anything — which is the entire point of the idle lock. A task
  // arriving after the lock is DROPPED, not deferred: it was built from state
  // this tab has been sitting on, and that is exactly the stale data we are
  // refusing to send. Relaunching re-pulls the authoritative copy.
  if(sessionLocked){
    diagLogEvent('idle-lock', 'Outbound sync blocked — session is locked');
    return Promise.resolve();
  }
  const run = () => taskFn().catch(e=> console.error('queued sync task failed', e));
  syncChain = syncChain.then(run, run);
  return syncChain;
}

async function runSyncSteps(steps){
  const startedAt = performance.now();
  await markSyncDirty();
  state.syncMeta.progress = { current: 0, total: steps.length };
  updateSyncBadge();
  try{
    for(let i=0;i<steps.length;i++){
      await steps[i]();
      state.syncMeta.progress = { current: i+1, total: steps.length };
      updateSyncBadge();
    }
    await markSyncSuccess();
    diagLogEvent('sync', `runSyncSteps OK (${steps.length} steps)`, { ms: Math.round(performance.now()-startedAt) });
  } catch(e){
    console.error('sync step failed', e);
    diagLogEvent('sync', `runSyncSteps FAILED`, { error: e.message||String(e), ms: Math.round(performance.now()-startedAt) });
    await markSyncError(e.message||String(e));
  }
  updateSyncBadge();
}

// Collapses rapid-fire saves (e.g. checking off several tasks in a row)
// into a single queued sync job instead of one job per action. Without this,
// each queued job just wastefully re-pushes the same growing snapshot, and
// worse — a big backlog of queued-but-not-yet-run jobs is exactly what's at
// risk of being lost if the tab closes before the queue finishes draining.
// Since each job reads state fresh when it actually runs (see the lazy
// closures below), piggybacking on an already-scheduled job is always safe:
// it'll pick up whatever the latest state is by the time its turn comes.
const syncScheduled = { tasks:false, lists:false, health:false, ratings:false, metricDefs:false, settings:false };
const syncDirtyDuringRun = { tasks:false, lists:false, health:false, ratings:false, metricDefs:false, settings:false };
function scheduleSync(key, buildSteps){
  // Checked BEFORE the in-flight flag is set. enqueueSync also refuses while
  // locked, but if we set the flag first and it then refused, the flag would
  // never be cleared and every later save for this key would be silently
  // swallowed as "already in flight". That is a data-loss bug, not a no-op.
  if(sessionLocked){
    diagLogEvent('sync-queue', `${key}: not scheduled — session is locked`);
    return;
  }
  if(syncScheduled[key]){
    // a job for this data is already in flight — don't stack another one,
    // just flag that there's more to catch once it's done.
    syncDirtyDuringRun[key] = true;
    diagLogEvent('sync-queue', `${key}: piggybacked on in-flight job`);
    return;
  }
  syncScheduled[key] = true;
  syncDirtyDuringRun[key] = false;
  diagLogEvent('sync-queue', `${key}: new job scheduled`);
  enqueueSync(async ()=>{
    try{
      // buildSteps() is called INSIDE this try on purpose. It reads live state
      // (e.g. state.training.exercises.map(...)) and can therefore throw. It
      // used to be evaluated outside any handler that records anything, so a
      // throw here produced: nothing in the Activity & Error Log, no toast, no
      // badge — and syncScheduled[key] left permanently true, which made every
      // subsequent save for this key return early as "already in flight".
      // The result was a category of failure with no data reaching the server
      // and no error anywhere. Now it is caught, recorded, and the flag is
      // always cleared.
      await runSyncSteps(buildSteps());
      // anything that arrived while that run was in flight gets exactly one
      // guaranteed follow-up pass (reading fresh state), instead of being lost
      if(syncDirtyDuringRun[key]){
        syncDirtyDuringRun[key] = false;
        diagLogEvent('sync-queue', `${key}: running guaranteed follow-up pass`);
        await runSyncSteps(buildSteps());
      }
    } catch(e){
      const msg = `${key} sync job failed before it could run: ${e.message||String(e)}`;
      console.error(msg, e);
      diagLogEvent('sync-queue', `${key}: job threw outside runSyncSteps`, { error: e.message||String(e) });
      await markSyncError(msg);
    } finally {
      // ALWAYS clears, on every path. This is the invariant that was missing.
      syncScheduled[key] = false;
    }
  });
}
// True whenever ANYTHING is queued-but-not-yet-synced — drives the
// close-tab warning below.
function hasUnsyncedWork(){
  return Object.values(syncScheduled).some(Boolean) || state.syncMeta.dirty;
}
window.addEventListener('beforeunload', (e)=>{
  if(syncConfigured() && hasUnsyncedWork()){
    e.preventDefault();
    e.returnValue = ''; // triggers the browser's native "leave site? changes may not be saved" prompt
  }
});

async function saveTasks(){
  if(syncConfigured()){
    // Supabase is the durable copy of completion history — only cache the
    // small, bounded task/list definitions locally, so the app still opens
    // instantly and works offline for editing, without local storage ever
    // growing unbounded with years of check-off history.
    await safeStorageSet(STORAGE_KEYS.TASKS, JSON.stringify({ oneTime: state.tasks.oneTime, recurring: state.tasks.recurring }), 'tasks', {silent:true});
    // ...but DO keep a small bounded window of just the most recent activity
    // locally too — the offline safety net (see buildRecentCompletionsBuffer).
    // NOT silent and NOT a bare try/catch: this buffer is the only local
    // record of completion history, so a failure here must surface loudly
    // (and safeStorageSet will evict disposable caches to make room first).
    await safeStorageSet(STORAGE_KEYS.RECENT_COMPLETIONS, JSON.stringify(buildRecentCompletionsBuffer(state.tasks.completions)), 'completions safety buffer');
  } else {
    // No sync configured — local storage is the ONLY copy, so it needs the
    // full trim-fallback safety net to avoid ever losing data outright.
    await saveTasksLocalWithFallback();

      ()=> supaUpsert('recurring_tasks', state.tasks.recurring.map(recurringToRow), 'id'),

    ]);
  }
}

// Generic version of the tasks fallback for simple date-array logs (health,
// ratings) — same idea: trim what's cached locally, never what's in memory
// or pushed to Supabase, and stay quiet once settled at a stable trim level.
// Only used when sync ISN'T configured — see saveHealth/saveRatings below.
async function saveDatedArrayLocalWithFallback(key, arr, label, stateKey){
  if(localTrimState[stateKey]){
    const cutoff = addDays(todayStr(), -localTrimState[stateKey]);
    const trimmed = arr.filter(e=> e.date >= cutoff);
    const res = await safeStorageSet(key, JSON.stringify(trimmed), label, {silent:true});
    if(res === true) return true;
  }

  const full = await safeStorageSet(key, JSON.stringify(arr), label, {silent:true});
  if(full === true){
    if(localTrimState[stateKey] !== null){
      showToast(`Local ${label} cache has room again — back to keeping full history`);
      localTrimState[stateKey] = null;
    }
    return true;
  }
  if(!isQuotaError(full.err)){
    showToast(`⚠ Save failed: ${full.err && full.err.message ? full.err.message : 'storage unavailable'}`);
    return false;
  }
  for(const days of [365, 180, 90, 30, 14, 7, 3]){
    const cutoff = addDays(todayStr(), -days);
    const trimmed = arr.filter(e=> e.date >= cutoff);
    const res = await safeStorageSet(key, JSON.stringify(trimmed), label, {silent:true});
    if(res === true){
      const changed = localTrimState[stateKey] !== days;
      localTrimState[stateKey] = days;
      if(changed){
        showToast(`⚠ Local ${label} cache trimmed to fit (kept last ${days} days). Consider setting up Supabase sync to stop needing this.`);
      }
      return true;
    }
  }
  showToast(`⚠ Local ${label} cache is full even after trimming.`);
  return false;
}

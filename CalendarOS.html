/* =========================================================
   RENDER: TRAINING VIEW
   Framework, not copy-paste: `exercises` is a reusable library,
   `sessions` reference exercises via `blocks`, `calendar` maps a specific
   date -> sessionId (this is what gets re-mapped monthly via import),
   `logs` are session-level (completed/difficulty/notes) keyed by date.
   ========================================================= */
/* =========================================================
   RENDER: TRAINING VIEW
   Framework, not copy-paste: `exercises` is a reusable library,
   `sessions` reference exercises via `blocks`, `calendar` maps a specific
   date -> sessionId (re-mapped monthly via import). `logs` are now PER
   EXERCISE (date + exerciseId), not per day — sessions with no exercises
   (walk/rest days) log against the sentinel exerciseId '__session__' so
   there's still something to check off/rate/annotate on those days.
   Subpages (Today's Training / Calendar View / Log History / Session
   Library / Exercise Library) live in a left sidebar + panel, same
   pattern as Settings.
   ========================================================= */
const TRAINING_SESSION_LEVEL_ID = '__session__';

function ensureTrainingViewDate(){
  if(!state.trainingSelectedDate) state.trainingSelectedDate = todayStr();
}
function getTrainingCalEntry(date){
  return state.training.calendar.find(c=>c.date===date) || null;
}
function getTrainingSessionById(id){
  return state.training.sessions.find(s=>s.id===id) || null;
}
function getTrainingExerciseById(id){
  return state.training.exercises.find(e=>e.id===id) || null;
}
function getTrainingLogsForDate(date){
  return state.training.logs.filter(l=>l.date===date);
}
function getTrainingLogForExercise(date, exerciseId){
  return state.training.logs.find(l=>l.date===date && l.exerciseId===exerciseId) || null;
}
function shiftTrainingDate(delta){
  ensureTrainingViewDate();
  state.trainingSelectedDate = addDays(state.trainingSelectedDate, delta);

function setTrainingViewDate(d){

  renderMain();

function setTrainingSection(key){
  noteActivity();
  state.trainingSection = key;

}

// The exercise "blocks" a day's session actually has to log against — for a
// normal strength session this is session.blocks as-is; for a walk/rest
// session with no exercises, it's a single synthetic block standing in for
// "the whole session," keyed by the sentinel id above.
function getTrainingLoggableBlocks(session){
  if(session.blocks && session.blocks.length) return session.blocks;
  return [{ exerciseId: TRAINING_SESSION_LEVEL_ID, reps:null, sets:null, notes:null, __sessionLevel:true }];
}

// Day-based (session-free) equivalents — training now logs directly against
// a date instead of requiring a pre-built Session mapped via the Calendar
// subpage. Old session/calendar data isn't deleted (still syncs, still
// exportable) — it's just no longer part of the main flow.
function getTrainingDayExerciseIds(date){
  const loggedIds = state.training.logs.filter(l=>l.date===date).map(l=>l.exerciseId);
  const pending = state.trainingPendingAdds[date] || [];
  return Array.from(new Set([...loggedIds, ...pending]));
}
function computeDayAggregateV2(date){
  const ids = getTrainingDayExerciseIds(date);
  if(!ids.length) return null;
  const logs = getTrainingLogsForDate(date);
  let completed = 0, diffSum = 0, diffCount = 0;
  ids.forEach(id=>{
    const log = logs.find(l=>l.exerciseId===id);
    if(log && log.completed) completed++;
    if(log && log.difficulty!=null){ diffSum += log.difficulty; diffCount++; }
  });
  return { completed, total: ids.length, avgDifficulty: diffCount ? Math.round((diffSum/diffCount)*10)/10 : null };
}
function isTrainingDayFullyLoggedV2(date){
  const ids = getTrainingDayExerciseIds(date);
  if(!ids.length) return false;
  if((state.trainingPendingAdds[date]||[]).length) return false; // unsaved additions — not "done" yet
  return ids.every(id => !!getTrainingLogForExercise(date, id));
}

function computeDayAggregate(date){
  const cal = getTrainingCalEntry(date);
  if(!cal) return null;
  const session = getTrainingSessionById(cal.sessionId);
  if(!session) return null; // dangling — nothing to aggregate
  const blocks = getTrainingLoggableBlocks(session);
  const logs = getTrainingLogsForDate(date);
  let completed = 0, diffSum = 0, diffCount = 0;
  blocks.forEach(b=>{
    const log = logs.find(l=> l.exerciseId===b.exerciseId);
    if(log && log.completed) completed++;
    if(log && log.difficulty!=null){ diffSum += log.difficulty; diffCount++; }
  });
  return { completed, total: blocks.length, avgDifficulty: diffCount ? Math.round((diffSum/diffCount)*10)/10 : null, session };
}

function getTrainingIntegrityIssues(){
  const definedSessIds = new Set(state.training.sessions.map(s=>s.id));
  const definedExIds = new Set(state.training.exercises.map(e=>e.id));
  const missingSessIds = new Set();
  const emptyMappedDates = [];
  state.training.calendar.forEach(c=>{
    if(!c.sessionId) emptyMappedDates.push(c.date);
    else if(!definedSessIds.has(c.sessionId)) missingSessIds.add(c.sessionId);
  });
  const missingExIds = new Set();
  state.training.sessions.forEach(s=> (s.blocks||[]).forEach(b=>{ if(b.exerciseId && !definedExIds.has(b.exerciseId)) missingExIds.add(b.exerciseId); }));
  return { missingSessIds: [...missingSessIds], missingExIds: [...missingExIds], emptyMappedDates };
}

async function clearAllWrongTrainingMappings(){
  const definedSessIds = new Set(state.training.sessions.map(s=>s.id));
  const definedExIds = new Set(state.training.exercises.map(e=>e.id));

  const badCalEntries = state.training.calendar.filter(c=> !c.sessionId || !definedSessIds.has(c.sessionId));
  let danglingBlockCount = 0;
  state.training.sessions.forEach(s=> (s.blocks||[]).forEach(b=>{ if(b.exerciseId && !definedExIds.has(b.exerciseId)) danglingBlockCount++; }));

  if(!badCalEntries.length && !danglingBlockCount){
    showToast('Nothing to clear — no wrong mappings found');
    return;
  }

  const summaryLines = [
    badCalEntries.length ? `${badCalEntries.length} calendar day(s) with a broken or empty session mapping` : null,
    danglingBlockCount ? `${danglingBlockCount} exercise reference(s) inside sessions that don't exist in your library` : null,
  ].filter(Boolean).join('\n');
  if(!confirm(`Clear wrong mappings?\n\n${summaryLines}\n\nThis removes only the broken references — your sessions, exercises, and logged history are untouched. Continue?`)) return;

  badCalEntries.forEach(c=> pendingTrainingDeletes.push({ table:'training_calendar', match:{ cal_date: c.date } }));
  state.training.calendar = state.training.calendar.filter(c=> c.sessionId && definedSessIds.has(c.sessionId));

  state.training.sessions.forEach(s=>{
    if(s.blocks && s.blocks.length){
      s.blocks = s.blocks.filter(b=> !b.exerciseId || definedExIds.has(b.exerciseId));
    }
  });

  await saveTraining();
  diagLogEvent('activity', 'Cleared wrong training mappings', { calDays: badCalEntries.length, exBlocks: danglingBlockCount });
  renderMain();
  showToast(`Cleared ${badCalEntries.length} day mapping(s) and ${danglingBlockCount} exercise reference(s)`);
}

/* ---------- Draft persistence (local-only, NEVER synced) ----------

   Drafts used to live only in memory. That is fine on a desktop where the tab
   stays open, but on iOS Safari a background tab is discarded aggressively —
   lock the screen or switch apps for a few minutes and coming back reloads the
   page. Everything typed since the last "Save Today's Log" was silently gone,
   which for a gym session logged across several machines could be the whole
   workout.

   These writes are deliberately kept out of the sync path entirely. A draft is
   by definition not-yet-committed data belonging to this one device; pushing it
   anywhere would mean a half-typed row on the phone could reach Supabase and
   from there another device.

   Pending adds are stored alongside, because a staged-but-unsaved exercise is
   the same kind of work: lose it and the typed values for it have nowhere to
   go even if the values themselves survived. */
const TRAINING_DRAFT_MAX_AGE_MS = 24 * 60 * 60 * 1000;
let trainingDraftSaveTimer = null;
let trainingDraftsRestored = 0;

function scheduleTrainingDraftSave(){
  // Debounced: typing a weight fires oninput per keystroke, and a storage
  // write per keystroke is both wasteful and a good way to hit a quota error
  // mid-set. 400ms is short enough that a tab discarded a second after you
  // stop typing still keeps the value.
  if(trainingDraftSaveTimer) clearTimeout(trainingDraftSaveTimer);
  trainingDraftSaveTimer = setTimeout(()=>{ trainingDraftSaveTimer = null; persistTrainingDrafts(); }, 400);
}

async function persistTrainingDrafts(){
  const drafts = state.trainingDraftValues || {};
  const pending = state.trainingPendingAdds || {};
  const hasDrafts = Object.keys(drafts).length > 0;
  const hasPending = Object.keys(pending).some(d => (pending[d]||[]).length);
  try{
    if(!hasDrafts && !hasPending){
      // Nothing outstanding — remove the key rather than leaving an empty
      // object behind, so a later load can't "restore" a stale shell.
      await window.storage.delete(STORAGE_KEYS.TRAINING_DRAFTS, false);
      return;
    }
    const payload = JSON.stringify({ savedAt: new Date().toISOString(), drafts, pendingAdds: pending });
    await safeStorageSet(STORAGE_KEYS.TRAINING_DRAFTS, payload, 'training drafts', { silent: true });
  } catch(e){
    // Never surface this as a blocking failure: the in-memory draft is still
    // intact and the person is mid-entry. Recorded so it is diagnosable.
    diagLogEvent('local-save', 'training draft persist failed', { error: e.message||String(e) });
  }
}

/* Writes immediately rather than waiting out the debounce. Used on the events
   that precede a tab going away, where 400ms is 400ms too long. */
function flushTrainingDrafts(){
  if(trainingDraftSaveTimer){ clearTimeout(trainingDraftSaveTimer); trainingDraftSaveTimer = null; }
  persistTrainingDrafts();
}

function restoreTrainingDrafts(raw){
  trainingDraftsRestored = 0;
  if(!raw) return;
  let parsed;
  try{ parsed = JSON.parse(raw); } catch(e){ return; }
  if(!parsed || typeof parsed !== 'object') return;

  // Age cap. A draft displays ON TOP of the last saved log, so restoring a
  // stale one would show old typed numbers over a log that has since been
  // saved — and pressing Save would then write the stale values back. Anything
  // older than a day is treated as abandoned rather than resumed.
  const savedAt = Date.parse(parsed.savedAt || '');
  if(!isFinite(savedAt) || (Date.now() - savedAt) > TRAINING_DRAFT_MAX_AGE_MS){
    diagLogEvent('load', 'training drafts discarded — older than 24h', { savedAt: parsed.savedAt || null });
    try{ window.storage.delete(STORAGE_KEYS.TRAINING_DRAFTS, false); } catch(e){}
    return;
  }

  const drafts = (parsed.drafts && typeof parsed.drafts === 'object') ? parsed.drafts : {};
  const pending = (parsed.pendingAdds && typeof parsed.pendingAdds === 'object') ? parsed.pendingAdds : {};
  state.trainingDraftValues = drafts;
  state.trainingPendingAdds = pending;
  trainingDraftsRestored = Object.keys(drafts).length
    + Object.keys(pending).reduce((n,d)=> n + ((pending[d]||[]).length), 0);
  if(trainingDraftsRestored){
    diagLogEvent('load', 'restored unsaved training entry', { entries: trainingDraftsRestored, savedAt: parsed.savedAt });
  }
}

/* Announced, never silent. Restoring typed values without saying so would make
   it impossible to tell a resumed draft from a saved log at a glance — which is
   exactly the ambiguity that makes stale drafts dangerous. */
function announceRestoredTrainingDrafts(){
  if(!trainingDraftsRestored) return;
  const n = trainingDraftsRestored;
  trainingDraftsRestored = 0;
  setTimeout(()=> showToast(`Restored unsaved training entry for ${n} exercise${n===1?'':'s'} — remember to Save`), 900);
}

// Live preview of the header aggregate as you toggle/rate exercises, before
// hitting Save — the saved-state recompute on save already worked, but
// leaving the header stale until Save felt broken (reported: "counter next
// to the session name does not update"). This reads current DOM state, not
// saved state, purely for instant feedback; Save still writes the real data.
function updateTrainingDayAggPreview(){
  const badge = document.getElementById('trainingDayAggBadge');
  if(!badge) return;
  const rowEls = document.querySelectorAll('#trainingExerciseRows [data-row-id]');
  let completed = 0, diffSum = 0, diffCount = 0;
  rowEls.forEach(rowEl=>{
    const rowId = rowEl.dataset.rowId;

    if(doneEl && doneEl.classList.contains('on')) completed++;
    const diffEl = document.querySelector(`#${rowId}_diff .radio-pill.active`);
    if(diffEl){ diffSum += Number(diffEl.dataset.val); diffCount++; }
  });
  const avg = diffCount ? Math.round((diffSum/diffCount)*10)/10 : null;
  badge.textContent = `${completed}/${rowEls.length} done${avg!=null?` · avg difficulty ${avg}`:''}`;
}

async function saveTrainingDayLogs(date){
  const rowEls = document.querySelectorAll('#trainingExerciseRows [data-row-id]');
  if(!rowEls.length){ showToast('Nothing to save'); return; }
  let count = 0;
  rowEls.forEach(rowEl=>{
    const rowId = rowEl.dataset.rowId;
    const exerciseId = rowEl.dataset.exerciseId;
    const doneEl = document.getElementById(`${rowId}_done`);
    const completed = doneEl ? doneEl.classList.contains('on') : false;
    const diffEl = document.querySelector(`#${rowId}_diff .radio-pill.active`);
    const difficulty = diffEl ? Number(diffEl.dataset.val) : null;
    const notesEl = document.getElementById(`${rowId}_notes`);
    const notes = notesEl ? notesEl.value.trim() : '';
    const setsEl = document.getElementById(`${rowId}_sets`);
    const sets = setsEl && setsEl.value !== '' ? Number(setsEl.value) : null;
    const repsEl = document.getElementById(`${rowId}_reps`);
    const reps = repsEl ? repsEl.value.trim() : '';
    const weightEl = document.getElementById(`${rowId}_weight`);
    const weight = weightEl && weightEl.value !== '' ? Number(weightEl.value) : null;
    const distanceEl = document.getElementById(`${rowId}_distanceKm`);
    const distanceKm = distanceEl && distanceEl.value !== '' ? Number(distanceEl.value) : null;
    const durationEl = document.getElementById(`${rowId}_durationMin`);
    const durationMin = durationEl && durationEl.value !== '' ? Number(durationEl.value) : null;
    const hrEl = document.getElementById(`${rowId}_avgHeartRate`);
    const avgHeartRate = hrEl && hrEl.value !== '' ? Number(hrEl.value) : null;
    const paceEl = document.getElementById(`${rowId}_avgPace`);
    const avgPace = paceEl ? paceEl.value.trim() : '';
    const inclineEl = document.getElementById(`${rowId}_incline`);
    const incline = inclineEl ? inclineEl.value.trim() : '';
    const calEl = document.getElementById(`${rowId}_calories`);
    const calories = calEl && calEl.value !== '' ? Number(calEl.value) : null;
    let log = getTrainingLogForExercise(date, exerciseId);
    if(!log){
      log = { date, exerciseId, sessionId: null, completed:false, difficulty:null, notes:'', sets:null, reps:'', weight:null,
               distanceKm:null, durationMin:null, avgHeartRate:null, avgPace:'', incline:'', calories:null, loggedAt:null };
      state.training.logs.push(log);
    }
    log.completed = completed;
    log.difficulty = difficulty;
    log.notes = notes;
    log.sets = sets;
    log.reps = reps;
    log.weight = weight;
    log.distanceKm = distanceKm;
    log.durationMin = durationMin;
    log.avgHeartRate = avgHeartRate;
    log.avgPace = avgPace;
    log.incline = incline;
    log.calories = calories;
    log.loggedAt = new Date().toISOString();
    count++;
  });
  if(state.trainingPendingAdds[date]) delete state.trainingPendingAdds[date];
  clearTrainingDraftsForDate(date);
  flushTrainingDrafts(); // the values are committed to logs now — drop the draft copy at once
  await saveTraining();
  diagLogEvent('activity', `Training log saved for ${date}`, { exercises: count });
  // Saving after each machine is the right habit at the gym — it is what keeps
  // a discarded tab from costing you the session. Collapsing to the summary
  // card on every save punished that: adding the next exercise then cost an
  // extra "Edit Log" tap each time. Today's card therefore stays open once
  // saved; a past day still collapses, since there you are correcting a log
  // rather than building one up.
  if(state.trainingEditingDate === date && date !== todayStr()) state.trainingEditingDate = null;
  else if(date === todayStr()) state.trainingEditingDate = date;
  renderMain();
  showToast(`Saved log for ${count} exercise${count===1?'':'s'}`);
}
function addExerciseToDay(date, exerciseId){
  if(!state.trainingPendingAdds[date]) state.trainingPendingAdds[date] = [];
  if(getTrainingDayExerciseIds(date).includes(exerciseId)) return;
  state.trainingPendingAdds[date].push(exerciseId);
  flushTrainingDrafts(); // a staged exercise is unsaved work — survive a tab discard
  state.trainingEditingDate = date; // make sure we're not showing a stale collapsed summary
  // Explicitly land on Training → Today after adding, regardless of what
  // page/subpage you were on when this fired (e.g. after creating a brand
  // new exercise inline from the picker's "Add a new exercise" link).
  state.view = 'training';
  state.trainingSection = 'today';
  renderMain();
  updateNavActiveState();
  updateNavBadges();
}
async function removeExerciseFromDay(date, exerciseId){
  // The draft used to be discarded HERE, before the saved-row path had even
  // asked for confirmation — so cancelling the "Delete this log entry?" prompt
  // still threw away whatever had been typed for that exercise. Each path now
  // clears its own draft, and only once it has actually committed to removing
  // the row.
  const pending = state.trainingPendingAdds[date] || [];
  if(pending.includes(exerciseId)){
    state.trainingPendingAdds[date] = pending.filter(id=>id!==exerciseId);
    delete state.trainingDraftValues[trainingDraftKey(date, exerciseId)];
    flushTrainingDrafts();
    renderMain();
    return;
  }
  await deleteTrainingExerciseLog(date, exerciseId); // already-saved row — has its own confirm + renderMain
}

/* ---------- Training randomizer ----------
   Picks N exercises from a chosen tag and stages them into the day's log via
   the SAME addExerciseToDay() path used by the manual picker — so they land
   as pending adds you still confirm and save, never as silently-written log
   rows, and duplicates are skipped by that function's own guard.

   Two selection behaviours, chosen at the point of use:
     - 'fresh'  : prefers what you've trained least recently (never-logged
                  first, then oldest last-logged). Same pool, better spread.
     - 'random' : uniformly random from the whole pool.
   Both are drawn WITHOUT replacement, so you never get the same exercise twice. */
function exerciseLastLoggedDate(exId){
  let latest = null;
  state.training.logs.forEach(l=>{
    if(l.exerciseId !== exId) return;
    if(!latest || l.date > latest) latest = l.date;
  });
  return latest;
}
function pickRandomExercises(pool, n, behaviour){
  const items = [...pool];
  if(behaviour === 'fresh'){
    // Never-logged first (null sorts before any date), then oldest-first.
    // Ties are broken randomly so repeated presses don't return a fixed order.
    items.forEach(ex=>{ ex.__last = exerciseLastLoggedDate(ex.id); ex.__jitter = Math.random(); });
    items.sort((a,b)=>{
      if(a.__last === b.__last) return a.__jitter - b.__jitter;
      if(a.__last === null) return -1;
      if(b.__last === null) return 1;
      return a.__last < b.__last ? -1 : 1;
    });
    const out = items.slice(0, n);
    items.forEach(ex=>{ delete ex.__last; delete ex.__jitter; });
    return out;
  }
  // Uniform random, Fisher-Yates, without replacement.
  for(let i=items.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items.slice(0, n);
}

async function runTrainingRandomizer(date){
  const tagBtn = document.querySelector('#randTagPills .radio-pill.active');
  if(!tagBtn){ showToast('Pick a region first'); return; }
  const tagId = tagBtn.dataset.tagId;
  const behaviourBtn = document.querySelector('#randBehaviourPills .radio-pill.active');
  const behaviour = behaviourBtn ? behaviourBtn.dataset.val : 'fresh';
  const countRaw = Number(document.getElementById('randCount').value);
  const count = Math.max(1, Math.min(20, Math.round(isFinite(countRaw) ? countRaw : 5)));

  const already = getTrainingDayExerciseIds(date);
  const pool = state.training.exercises.filter(ex=>
    (ex.tagIds||[]).includes(tagId) && !already.includes(ex.id)
  );
  if(!pool.length){
    const tagName = (state.settings.exerciseTags.find(t=>t.id===tagId)||{}).name || 'that region';
    showToast(`No more ${tagName} exercises available to add`);
    return;
  }
  const picked = pickRandomExercises(pool, count, behaviour);

  // Remember the choices for next time — a convenience preference, kept local
  // alongside the other display preferences rather than synced.
  state.settings.randomizerPrefs = { count, behaviour, tagId };
  await saveSettings();

  const overlay = document.getElementById('randomizerOverlay');
  if(overlay) overlay.remove();

  // addExerciseToDay() re-renders each time; stage them all first, then let
  // the final call do the single render.
  picked.forEach(ex=> addExerciseToDay(date, ex.id));

  const shortfall = count - picked.length;
  showToast(shortfall > 0
    ? `Added ${picked.length} — only ${picked.length} left in that region`
    : `Added ${picked.length} exercise${picked.length===1?'':'s'}`);
}

async function deleteTrainingExerciseLog(date, exerciseId){
  const log = getTrainingLogForExercise(date, exerciseId);
  if(!log) return;
  if(!confirm(`Delete this log entry? This can't be undone.`)) return;
  delete state.trainingDraftValues[trainingDraftKey(date, exerciseId)];
  flushTrainingDrafts();
  state.training.logs = state.training.logs.filter(l=> !(l.date===date && l.exerciseId===exerciseId));
  pendingTrainingDeletes.push({ table:'training_logs', match:{ log_date:date, exercise_id:exerciseId } });
  // Deleting training data is irreversible and is the one thing most worth
  // being able to account for after the fact, so it goes in the activity log
  // alongside task and list deletions rather than only in the raw sync trace.
  diagLogEvent('activity', `Deleted training log for ${date}`, { exerciseId });
  await recordDeletion(`Training log for ${date}`, `exercise ${exerciseId}`);
  await saveTraining();
  renderMain();
  showToast('Log entry deleted');
}
async function deleteTrainingDayLogs(date){
  const logs = getTrainingLogsForDate(date);
  if(!logs.length) return;
  if(!confirm(`Delete all ${logs.length} logged exercise${logs.length===1?'':'s'} for ${humanDate(date)}? This can't be undone.`)) return;
  logs.forEach(l=> pendingTrainingDeletes.push({ table:'training_logs', match:{ log_date:date, exercise_id:l.exerciseId } }));
  state.training.logs = state.training.logs.filter(l=>l.date!==date);
  diagLogEvent('activity', `Deleted ALL ${logs.length} training log(s) for ${date}`, { exerciseIds: logs.map(l=>l.exerciseId) });
  await recordDeletion(`ALL training logs for ${date}`, `${logs.length} entr${logs.length===1?'y':'ies'}`);
  await saveTraining();
  renderMain();
  showToast('Logs deleted');
}

/* ---------- Subpage: Calendar View ---------- */
function renderTrainingCalendarSubpage(){
  if(!state.trainingCalMonthCursor){
    const t = parseDate(todayStr());
    state.trainingCalMonthCursor = { year: t.getFullYear(), month: t.getMonth() };
  }
  const { year, month } = state.trainingCalMonthCursor;
  const firstOfMonth = new Date(year, month, 1);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const typeColors = { strength:'var(--brass)', walk:'var(--teal)', rest:'var(--slate-light)' };

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cal = getTrainingCalEntry(dateStr);
    const session = cal ? getTrainingSessionById(cal.sessionId) : null;
    const isToday = dateStr === todayStr();
    const dotColor = session ? (typeColors[session.type]||'var(--slate)') : (cal ? 'var(--brass-deep)' : null);
    const agg = computeDayAggregate(dateStr);
    cells += `
      <div class="cal-cell ${isToday?'today':''}" onclick="toggleTrainingCalExpand('${dateStr}')">
        <div class="cal-cell-top">
          <span class="date-num">${day}</span>
          ${dotColor ? `<span style="width:8px;height:8px;border-radius:50%;background:${dotColor};display:inline-block;flex-shrink:0;"></span>` : ''}
        </div>
        ${session ? `<div class="page-sub" style="font-size:9.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(session.name)}</div>`
          : (cal ? `<div class="page-sub" style="font-size:9.5px; color:var(--brass-deep);">⚠ missing</div>` : '')}
        ${agg ? `<div class="page-sub" style="font-size:9.5px;">${agg.completed}/${agg.total}</div>` : ''}
      </div>`;
  }

  const expanded = state.trainingCalExpandedDate;

  return `
    <div class="card" style="padding:20px;">
      <div class="cal-header">
        <button class="btn secondary sm" onclick="shiftTrainingCalMonth(-1)">← Prev</button>
        <h2>${MONTH_NAMES[month]} ${year}</h2>
        <button class="btn secondary sm" onclick="shiftTrainingCalMonth(1)">Next →</button>
        <button class="btn ghost sm" onclick="goToCurrentTrainingCalMonth()">Today</button>
      </div>
      <div class="cal-grid">
        ${DOW_ABBR.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    ${expanded ? `
      <div class="section">
        <div class="section-head"><h2>${humanDate(expanded)}</h2><button class="btn ghost sm" onclick="toggleTrainingCalExpand('${expanded}')">Close</button></div>
        ${renderTrainingDayCard(expanded)}
      </div>
    ` : ''}

    <div class="danger-zone">
      <h3>Danger Zone</h3>
      <div class="page-sub" style="margin-bottom:10px;">Unmaps every day on the calendar. Your session library, exercise library, and logged history are each cleared independently — this only touches the plan/schedule.</div>
      <button class="btn danger sm" onclick="confirmClearTrainingPlan()">Clear Training Plan</button>
    </div>
  `;
}
function shiftTrainingCalMonth(delta){
  let { year, month } = state.trainingCalMonthCursor;
  month += delta;
  if(month < 0){ month = 11; year--; }
  if(month > 11){ month = 0; year++; }
  state.trainingCalMonthCursor = { year, month };
  renderMain();
}

  const t = parseDate(todayStr());

/* ---------- Subpage: Log History ---------- */
function renderTrainingHistorySubpage(){
  const dates = [...new Set(state.training.logs.map(l=>l.date))].sort((a,b)=> a<b?1:-1).slice(0,60);
  return `
    <div class="section">
      <div class="section-head"><h2>Log History</h2></div>
      ${dates.length ? dates.map(date=>{
        const agg = computeDayAggregate(date);
        const cal = getTrainingCalEntry(date);
        const session = cal ? getTrainingSessionById(cal.sessionId) : null;
        const logs = getTrainingLogsForDate(date);
        return `
          <div class="card" style="padding:14px 18px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <b>${humanDate(date)}${session?` — ${escapeHtml(session.name)}`:''}</b>
              <div style="display:flex; align-items:center; gap:10px;">
                ${agg ? `<span class="page-sub">${agg.completed}/${agg.total} done${agg.avgDifficulty!=null?` · avg ${agg.avgDifficulty}`:''}</span>` : ''}
                <button class="btn ghost sm" onclick="setTrainingViewDate('${date}'); setTrainingSection('today');">Open</button>
                <button class="icon-btn" title="Delete all logs for this day" onclick="deleteTrainingDayLogs('${date}')">✕</button>
              </div>
            </div>
            <table class="log-table" style="margin-top:8px;">
              <thead><tr><th>Exercise</th><th>Completed</th><th>Sets / Reps / Weight or Walking Stats</th><th>Difficulty</th><th>Notes</th><th></th></tr></thead>
              <tbody>
                ${logs.map(l=>{
                  const isSessionLevel = l.exerciseId === TRAINING_SESSION_LEVEL_ID;
                  const ex = !isSessionLevel ? getTrainingExerciseById(l.exerciseId) : null;
                  const name = isSessionLevel ? (session?escapeHtml(session.name):'(session)') : (ex?escapeHtml(ex.name):`⚠ missing "${escapeHtml(l.exerciseId)}"`);
                  const isWalking = ex && ex.category === 'walking';
                  let statsCell;
                  if(isWalking){
                    const parts = [];
                    if(l.distanceKm!=null) parts.push(`${l.distanceKm} km`);
                    if(l.durationMin!=null) parts.push(`${l.durationMin} min`);
                    if(l.avgHeartRate!=null) parts.push(`${l.avgHeartRate} bpm avg`);
                    if(l.avgPace) parts.push(`${l.avgPace} /km avg pace`);
                    if(l.incline) parts.push(`${l.incline}% incline`);
                    if(l.calories!=null) parts.push(`${l.calories} cal`);
                    statsCell = parts.length ? escapeHtml(parts.join(' · ')) : '—';
                  } else {
                    const strengthParts = [];
                    strengthParts.push(l.sets===null||l.sets===undefined?'— sets':`${l.sets} sets`);
                    strengthParts.push(l.reps?escapeHtml(l.reps)+' reps':'— reps');
                    strengthParts.push(l.weight===null||l.weight===undefined?'— kg':`${l.weight} kg`);
                    statsCell = strengthParts.join(' · ');
                  }
                  return `<tr>
                    <td>${name}</td>
                    <td>${l.completed?'✓':'—'}</td>
                    <td>${statsCell}</td>
                    <td>${l.difficulty===null||l.difficulty===undefined?'—':difficultyBadge(l.difficulty)}</td>
                    <td style="max-width:240px; white-space:normal;">${escapeHtml(l.notes||'')}</td>
                    <td><button class="icon-btn" title="Delete" onclick="deleteTrainingExerciseLog('${date}','${escapeHtml(l.exerciseId)}')">✕</button></td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }).join('') : `<div class="card empty-state"><span class="glyph">☺</span>No training logged yet.</div>`}
    </div>

    <div class="danger-zone">
      <h3>Danger Zone</h3>
      <div class="page-sub" style="margin-bottom:10px;">Permanently deletes every logged exercise entry across every day. Your plan (sessions, exercises, calendar) is not affected.</div>
      <button class="btn danger sm" onclick="confirmClearTrainingLogs()">Clear All Logs</button>
    </div>
  `;
}

        <h2>Session Library</h2>
        <button class="btn brass sm" onclick="openTrainingSessionBuilder()">+ New Session</button>
      </div>

          <div class="metric-manage-row">

            <button class="btn ghost sm" onclick="openTrainingAssignDatesModal('${s.id}')">Assign to Dates</button>

        `).join('') : `<div class="page-sub" style="padding:10px 0;">No sessions yet — import a plan, or build one manually with "+ New Session".</div>`}
      </div>
    </div>

    <div class="danger-zone">
      <h3>Danger Zone</h3>
      <div class="page-sub" style="margin-bottom:10px;">Permanently deletes every session in your library. Sessions, exercises, calendar, and logs are each cleared independently — this only touches sessions.</div>

async function deleteTrainingSession(id){
  const sess = state.training.sessions.find(s=>s.id===id);
  if(!sess) return;
  const usedDays = state.training.calendar.filter(c=>c.sessionId===id).length;
  const msg = usedDays
    ? `Delete "${sess.name}"? It's currently mapped to ${usedDays} calendar day(s) — those days will show as unmapped until you import a replacement.`
    : `Delete "${sess.name}"?`;
  if(!confirm(msg)) return;
  state.training.sessions = state.training.sessions.filter(s=>s.id!==id);
  pendingTrainingDeletes.push({ table:'training_sessions', match:{ id } });
  await saveTraining();
  renderMain();
  showToast('Session deleted');
}

/* ---------- Subpage: Resources (free-form reference library) ----------
   Deliberately loose: a title plus any combination of a link and free text.
   Optional tags reuse the SAME exerciseTags list as exercises, so filtering
   stays consistent across the Training module rather than inventing a second
   vocabulary. */
function renderTrainingResourcesSubpage(){
  const all = state.training.resources || [];
  const tags = state.settings.exerciseTags || [];
  const filter = state.resourceTagFilter || 'all';
  const isUntagged = (r)=> !(r.tagIds||[]).length;
  const shown = filter==='all' ? all
    : filter==='untagged' ? all.filter(isUntagged)
    : all.filter(r=> (r.tagIds||[]).includes(filter));
  const sorted = [...shown].sort((a,b)=> a.title.localeCompare(b.title));
  const untaggedCount = all.filter(isUntagged).length;

  return `
    <div class="section">
      <div class="section-head">
        <h2>Resources</h2>
        <button class="btn brass sm" onclick="openResourceModal()">+ Add Resource</button>
      </div>
      <div class="page-sub" style="margin-bottom:10px;">
        Anything worth keeping that isn't tied to one exercise — programme links, mobility routines, coaching cues, notes to yourself. Tag them with the same tags your exercises use.
      </div>
      ${all.length ? `
        ${(tags.length || untaggedCount) ? `
          <div class="chip-select" style="margin-bottom:10px; flex-wrap:wrap;">
            <button class="${filter==='all'?'active':''}" onclick="setResourceTagFilter('all')">All <span class="chip-count">${all.length}</span></button>
            ${tags.map(t=>{
              const n = all.filter(r=>(r.tagIds||[]).includes(t.id)).length;
              return n ? `<button class="${filter===t.id?'active':''}" onclick="setResourceTagFilter('${t.id}')">${escapeHtml(t.name)} <span class="chip-count">${n}</span></button>` : '';
            }).join('')}
            ${untaggedCount ? `<button class="chip-untagged ${filter==='untagged'?'active':''}" onclick="setResourceTagFilter('untagged')">Untagged <span class="chip-count">${untaggedCount}</span></button>` : ''}
          </div>
        ` : ''}
        <div class="card" style="padding:4px 0;">
          ${sorted.length ? sorted.map(r=>`
            <div class="resource-row">
              <div class="resource-main">
                <div class="resource-title">${escapeHtml(r.title)}</div>
                ${r.body ? `<div class="resource-body">${escapeHtml(r.body)}</div>` : ''}
                ${(r.tagIds||[]).length ? `<div class="resource-tags">${(r.tagIds||[]).map(tid=>{
                  const t = tags.find(x=>x.id===tid);
                  return t ? `<span class="resource-tag">${escapeHtml(t.name)}</span>` : '';
                }).join('')}</div>` : ''}
              </div>
              <span class="resource-actions">
                ${r.url ? `<a class="btn ghost sm" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">↗ Open</a>` : ''}
                <button class="icon-btn" title="Edit" onclick="openResourceModal('${r.id}')">✎</button>
                <button class="icon-btn" title="Delete" onclick="deleteTrainingResource('${r.id}')">✕</button>
              </span>
            </div>
          `).join('') : `<div style="padding:14px;"><span class="page-sub">Nothing under this filter.</span></div>`}
        </div>
      ` : `<div class="card" style="padding:16px;"><span class="page-sub">No resources yet. Add a link or a note you want to keep to hand.</span></div>`}
    </div>
  `;
}
function setResourceTagFilter(v){ state.resourceTagFilter = v; renderMain(); }

let resourceDraftTagIds = [];
function openResourceModal(existingId){
  const existing = existingId ? (state.training.resources||[]).find(r=>r.id===existingId) : null;
  resourceDraftTagIds = existing ? [...(existing.tagIds||[])] : [];
  const tags = state.settings.exerciseTags || [];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'resourceOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal">
      <h3>${existing?'Edit':'Add'} Resource</h3>
      <div class="field"><label>Title</label><input type="text" id="resTitle" value="${existing?escapeHtml(existing.title):''}" placeholder="e.g. Shoulder mobility routine"></div>
      <div class="field"><label>Link (optional)</label><input type="text" id="resUrl" value="${existing?escapeHtml(existing.url||''):''}" placeholder="https://..."></div>
      <div class="field"><label>Notes (optional)</label><textarea id="resBody" rows="5" placeholder="Anything you want to remember">${existing?escapeHtml(existing.body||''):''}</textarea></div>
      <div class="field">
        <label>Tags <span class="page-sub" style="font-weight:400;">(optional)</span></label>
        <div class="radio-pills" id="resTagPills" style="flex-wrap:wrap;">
          ${tags.map(t=>`<button type="button" class="radio-pill ${resourceDraftTagIds.includes(t.id)?'active':''}" data-tag-id="${t.id}" onclick="this.classList.toggle('active')">${escapeHtml(t.name)}</button>`).join('') || '<span class="page-sub">No tags yet.</span>'}
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="document.getElementById('resourceOverlay').remove();">Cancel</button>
        <button class="btn brass" onclick="submitResource('${existingId||''}')">${existing?'Save':'Add'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(()=>{ const el=document.getElementById('resTitle'); if(el){ el.focus(); el.select(); } }, 50);
}
async function submitResource(existingId){
  const title = (document.getElementById('resTitle').value||'').trim();
  if(!title){ showToast('Give it a title'); return; }
  const url = (document.getElementById('resUrl').value||'').trim();
  const body = (document.getElementById('resBody').value||'').trim();
  const tagIds = [...document.querySelectorAll('#resTagPills .radio-pill.active')].map(b=>b.dataset.tagId);
  if(!state.training.resources) state.training.resources = [];
  if(existingId){
    const r = state.training.resources.find(x=>x.id===existingId);
    if(r){ r.title=title; r.url=url; r.body=body; r.tagIds=tagIds; }
  } else {
    state.training.resources.push({ id:newId('res'), title, url, body, tagIds });
  }
  await saveTraining();
  const overlay = document.getElementById('resourceOverlay');
  if(overlay) overlay.remove();
  renderMain();
  showToast(existingId?'Resource updated':'Resource added');
}
async function deleteTrainingResource(id){
  const r = (state.training.resources||[]).find(x=>x.id===id);
  if(!r) return;
  if(!confirm(`Delete "${r.title}"?`)) return;
  state.training.resources = state.training.resources.filter(x=>x.id!==id);
  pendingTrainingDeletes.push({ table:'training_resources', match:{ id } });
  await saveTraining();
  renderMain();
  showToast('Resource deleted');
}

/* ---------- Subpage: Exercise Library (alphabetical) ---------- */
function renderTrainingExercisesSubpage(){
  const tagFilter = state.exerciseTagFilter || 'all';
  const allSorted = [...state.training.exercises].sort((a,b)=> a.name.localeCompare(b.name));
  // 'untagged' is a pseudo-filter: it isn't a real tag id, it selects every
  // exercise with no tags at all, so gaps in tagging are easy to spot and fix.
  const isUntagged = (ex)=> !(ex.tagIds||[]).length;
  const sorted = tagFilter==='all' ? allSorted
    : tagFilter==='untagged' ? allSorted.filter(isUntagged)
    : allSorted.filter(ex=>(ex.tagIds||[]).includes(tagFilter));
  const tags = state.settings.exerciseTags;
  const untaggedCount = allSorted.filter(isUntagged).length;
  return `
    <div class="section">
      <div class="section-head">
        <h2>Exercise Library</h2>
        <span style="display:flex; gap:6px;">
          <button class="icon-btn" title="Manage tags" onclick="openManageExerciseTagsModal()">⚙</button>
          <button class="btn brass sm" onclick="openAddExerciseModal()">+ Add Exercise</button>
        </span>
      </div>
      ${(tags.length || untaggedCount) ? `
        <div class="chip-select" style="margin-bottom:10px; flex-wrap:wrap;">
          <button class="${tagFilter==='all'?'active':''}" onclick="setExerciseTagFilter('all')">All <span class="chip-count">${allSorted.length}</span></button>
          ${tags.map(t=>{
            const n = allSorted.filter(ex=>(ex.tagIds||[]).includes(t.id)).length;
            return `<button class="${tagFilter===t.id?'active':''}" onclick="setExerciseTagFilter('${t.id}')">${escapeHtml(t.name)} <span class="chip-count">${n}</span></button>`;
          }).join('')}
          ${untaggedCount ? `<button class="chip-untagged ${tagFilter==='untagged'?'active':''}" onclick="setExerciseTagFilter('untagged')">Untagged <span class="chip-count">${untaggedCount}</span></button>` : ''}
        </div>
        ${tagFilter==='untagged' ? `<div class="page-sub" style="margin-bottom:10px;">These aren't tagged yet, so they won't appear under any body-part filter and the randomizer can't pick them. Tag them to fix that.</div>` : ''}
      ` : ''}
      <div class="card" style="padding:4px 16px;">
        ${sorted.length ? sorted.map(ex=>`
          <div class="metric-manage-row">
            <span class="metric-manage-name">
              ${escapeHtml(ex.name)}${ex.category==='walking' ? ' <span class="page-sub" style="font-size:10px; text-transform:uppercase; letter-spacing:0.03em; border:1px solid var(--line); border-radius:4px; padding:1px 5px; margin-left:4px;">Walking</span>' : ''}
              ${(ex.tagIds||[]).map(tid=>{ const t = tags.find(x=>x.id===tid); return t ? `<span class="page-sub" style="font-size:10px; background:var(--paper-dim); border-radius:4px; padding:1px 6px; margin-left:4px;">${escapeHtml(t.name)}</span>` : ''; }).join('')}
            </span>
            ${exVideoUrls(ex).length ? (exVideoUrls(ex).length===1
              ? `<a class="btn ghost sm" href="${escapeHtml(exVideoUrls(ex)[0])}" target="_blank" rel="noopener">▶ Video</a>`
              : `<button class="btn ghost sm" onclick="openExerciseVideoPicker('${ex.id}')">▶ Videos (${exVideoUrls(ex).length})</button>`) : ''}
            <button class="icon-btn" title="Edit" onclick="openEditExerciseModal('${ex.id}')">✎</button>
            <button class="icon-btn" title="Delete" onclick="deleteTrainingExercise('${ex.id}')">✕</button>
          </div>
        `).join('') : `<div class="page-sub" style="padding:10px 0;">${tagFilter==='all' ? 'No exercises yet — add one with "+ Add Exercise", or import a plan.' : 'No exercises with this tag.'}</div>`}
      </div>
    </div>

    <div class="danger-zone">
      <h3>Danger Zone</h3>
      <div class="page-sub" style="margin-bottom:10px;">Permanently deletes every exercise in your library. Sessions, calendar, and logs are each cleared independently — this only touches exercises.</div>
      <button class="btn danger sm" onclick="confirmClearTrainingExercises()">Clear All Exercises</button>
    </div>
  `;
}
function setExerciseTagFilter(tagId){
  state.exerciseTagFilter = tagId;
  renderMain();
}
async function deleteTrainingExercise(id){
  const ex = state.training.exercises.find(e=>e.id===id);
  if(!ex) return;
  if(!confirm(`Delete "${ex.name}" from the exercise library? Sessions referencing it will show it as removed rather than breaking.`)) return;
  state.training.exercises = state.training.exercises.filter(e=>e.id!==id);
  pendingTrainingDeletes.push({ table:'training_exercises', match:{ id } });
  await saveTraining();
  renderMain();
  showToast('Exercise deleted');
}

/* =========================================================
   RECIPE TRACKER
   ========================================================= */
const RECIPE_MEAL_TYPES = ['breakfast','lunch','dinner','snack','dessert'];

function setRecipesMealTypeFilter(mt){
  state.recipesMealTypeFilter = mt;
  renderMain();
}
function openRecipeDetail(id){
  state.recipesSelectedId = id;
  state.recipeDesiredServings = null; // reset scaler to base servings on open
  renderMain();
}
function closeRecipeDetail(){
  state.recipesSelectedId = null;
  renderMain();
}
function renderRecipesView(){
  if(state.recipesSelectedId){
    const recipe = state.recipes.items.find(r=>r.id===state.recipesSelectedId);
    if(recipe) return renderRecipeDetail(recipe);
    state.recipesSelectedId = null; // dangling — fall through to the grid
  }
  const items = [...state.recipes.items].sort((a,b)=>a.name.localeCompare(b.name));
  const filter = state.recipesMealTypeFilter || 'all';
  const filtered = filter==='all' ? items : items.filter(r=>r.mealType===filter);
  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Recipes</h1>
        <div class="page-sub">${items.length} recipe${items.length===1?'':'s'} in your library</div>
      </div>
      <span style="display:flex; gap:8px; align-items:center;">
        <button class="btn secondary sm" onclick="openRecipeImportModal()">⇩ Import</button>
        <button class="btn brass sm" onclick="openRecipeEditModal()">+ Add Recipe</button>
      </span>
    </div>
    <div class="filter-bar">
      <div class="chip-select">
        <button class="${filter==='all'?'active':''}" onclick="setRecipesMealTypeFilter('all')">All</button>
        ${RECIPE_MEAL_TYPES.map(mt=>`<button class="${filter===mt?'active':''}" onclick="setRecipesMealTypeFilter('${mt}')" style="text-transform:capitalize;">${mt}</button>`).join('')}
      </div>
    </div>
    <div class="recipe-grid">
      ${filtered.length ? filtered.map(r=>`
        <div class="recipe-card" onclick="openRecipeDetail('${r.id}')">
          <div class="recipe-card-img" ${r.imageUrl?`style="background-image:url('${escapeHtml(r.imageUrl)}');"`:''}>${!r.imageUrl?'❖':''}</div>
          <div class="recipe-card-body">
            <b>${escapeHtml(r.name)}</b>
            ${r.mealType ? `<span class="page-sub" style="text-transform:capitalize;">${escapeHtml(r.mealType)}</span>` : ''}
          </div>
        </div>
      `).join('') : `<div class="page-sub" style="padding:20px 4px;">No recipes yet — add one with "+ Add Recipe".</div>`}
    </div>
  `;
}
function renderRecipeDetail(recipe){
  const desired = state.recipeDesiredServings || recipe.baseServings || 1;
  const scale = recipe.baseServings>0 ? desired/recipe.baseServings : 1;
  const m = recipe.macros||{};
  const hasMacros = m.calories!=null||m.protein!=null||m.carbs!=null||m.fat!=null||m.fiber!=null;
  return `
    <div class="topbar">
      <div><button class="btn ghost sm" onclick="closeRecipeDetail()">← Back to Recipes</button></div>
      <span style="display:flex; gap:8px;">
        <button class="icon-btn" title="Edit" onclick="openRecipeEditModal('${recipe.id}')">✎</button>
        <button class="icon-btn" title="Delete" onclick="deleteRecipe('${recipe.id}')">✕</button>
      </span>
    </div>
    <div class="card" style="padding:20px; margin-top:8px;">
      ${recipe.imageUrl ? `<img src="${escapeHtml(recipe.imageUrl)}" alt="${escapeHtml(recipe.name)}" style="width:100%; max-height:280px; object-fit:cover; border-radius:10px; margin-bottom:14px;" onerror="this.style.display='none';">` : ''}
      <h1 class="page-title" style="margin-bottom:4px;">${escapeHtml(recipe.name)}</h1>
      ${recipe.mealType ? `<div class="page-sub" style="text-transform:capitalize; margin-bottom:10px;">${escapeHtml(recipe.mealType)}</div>` : ''}

      ${hasMacros ? `
        <div class="macro-row">
          ${m.calories!=null ? `<div class="macro-pill"><b>${m.calories}</b><span>kcal</span></div>` : ''}
          ${m.protein!=null ? `<div class="macro-pill"><b>${m.protein}g</b><span>protein</span></div>` : ''}
          ${m.carbs!=null ? `<div class="macro-pill"><b>${m.carbs}g</b><span>carbs</span></div>` : ''}
          ${m.fat!=null ? `<div class="macro-pill"><b>${m.fat}g</b><span>fat</span></div>` : ''}
          ${m.fiber!=null ? `<div class="macro-pill"><b>${m.fiber}g</b><span>fiber</span></div>` : ''}
        </div>
        <div class="page-sub" style="margin-bottom:14px;">Per serving</div>
      ` : ''}

      <div class="field" style="max-width:220px;">
        <label>Servings to make</label>
        <input type="number" min="1" step="1" value="${desired}" oninput="setRecipeDesiredServings(this.value)" style="padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--paper); color:var(--ink);">
      </div>
      <div class="page-sub" style="margin:6px 0 14px;">Recipe makes ${recipe.baseServings} serving${recipe.baseServings===1?'':'s'} at base amounts — ingredient amounts below scale automatically.</div>

      <h3 style="margin-bottom:8px;">Ingredients</h3>
      <div class="card" style="padding:4px 16px; margin-bottom:16px;">
        ${recipe.ingredients.length ? recipe.ingredients.map(ing=>`
          <div class="metric-manage-row">
            <span class="metric-manage-name">${escapeHtml(ing.name)}</span>
            <span id="ingAmt_${ing.id}">${Math.round(ing.grams*scale*10)/10}g</span>
          </div>
        `).join('') : `<div class="page-sub" style="padding:10px 0;">No ingredients listed.</div>`}
      </div>

      ${recipe.steps ? `<h3 style="margin-bottom:8px;">Steps</h3><div class="page-sub" style="white-space:pre-wrap; line-height:1.6;">${escapeHtml(recipe.steps)}</div>` : ''}
    </div>
  `;
}
function setRecipeDesiredServings(v){
  const n = Number(v);
  state.recipeDesiredServings = n>0 ? n : 1;
  const recipe = state.recipes.items.find(r=>r.id===state.recipesSelectedId);
  if(!recipe) return;
  const scale = recipe.baseServings>0 ? state.recipeDesiredServings/recipe.baseServings : 1;
  // Direct DOM update (no renderMain) so the servings input never loses
  // focus/cursor position while typing — same reasoning as the training
  // day-aggregate live preview.
  recipe.ingredients.forEach(ing=>{
    const el = document.getElementById(`ingAmt_${ing.id}`);
    if(el) el.textContent = `${Math.round(ing.grams*scale*10)/10}g`;
  });

// Parses + validates. Returns { recipe } or { error }.
function parseRecipeImport(text){
  let data;
  try{
    data = JSON.parse(stripJsonComments(text));
  } catch(e){
    return { error: 'Could not parse that JSON — check for a syntax error (a trailing comma is the usual culprit).' };
  }
  if(Array.isArray(data)){
    return { error: 'That looks like several recipes in one file. Import one recipe at a time.' };
  }
  if(!data || typeof data !== 'object') return { error: 'That JSON is not a recipe object.' };
  const name = typeof data.name === 'string' ? data.name.trim() : '';
  if(!name) return { error: 'The recipe needs a "name".' };

  const mealType = RECIPE_MEAL_TYPES.includes(data.mealType) ? data.mealType : '';
  const baseServings = Number(data.baseServings) > 0 ? Number(data.baseServings) : 1;

  const rawIngs = Array.isArray(data.ingredients) ? data.ingredients : [];
  const ingredients = [];
  let droppedIngs = 0;
  rawIngs.forEach(i=>{
    if(!i || typeof i.name !== 'string' || !i.name.trim()){ droppedIngs++; return; }
    const grams = Number(i.grams);
    // id is REQUIRED — recipe_ingredients.id is not-null and is half the
    // upsert key. The manual editor assigns one; the importer originally did
    // not, so imported recipes pushed a null id and every recipe sync failed
    // with a not-null constraint violation until the recipe was deleted.
    ingredients.push({ id: newId('ing'), name: i.name.trim(), grams: isFinite(grams) && grams > 0 ? grams : 0 });
  });

  const macros = { calories:null, protein:null, carbs:null, fat:null, fiber:null };
  const m = (data.macros && typeof data.macros === 'object') ? data.macros : {};
  Object.keys(macros).forEach(k=>{
    const v = Number(m[k]);
    macros[k] = (m[k] === null || m[k] === undefined || m[k] === '' || !isFinite(v)) ? null : v;
  });

  let steps = '';
  if(typeof data.steps === 'string') steps = data.steps;
  else if(Array.isArray(data.steps)) steps = data.steps.filter(x=>typeof x === 'string').join('\n');

  return { recipe: {
    id: newId('recipe'), name, mealType,
    imageUrl: typeof data.imageUrl === 'string' ? data.imageUrl : '',
    baseServings, ingredients, steps, macros
  }, droppedIngs };
}

async function saveRecipeDraft(){

  const d = recipeDraft;
  const name = (d.name||'').trim();
  if(!name){ showToast('Give the recipe a name'); return; }
  const cleanIngredients = d.ingredients.filter(i=>i.name && i.name.trim()).map(i=>({ id:i.id, name:i.name.trim(), grams:i.grams||0 }));
  const recipe = { id:d.id, name, mealType:d.mealType||null, imageUrl:(d.imageUrl||'').trim()||null, baseServings:d.baseServings||1, steps:d.steps||'', macros:d.macros, ingredients:cleanIngredients };
  const idx = state.recipes.items.findIndex(r=>r.id===d.id);
  if(idx>=0) state.recipes.items[idx] = recipe; else state.recipes.items.push(recipe);
  await saveRecipes();
  closeRecipeEditModal();
  diagLogEvent('activity', `${d.isNew?'Added':'Edited'} recipe "${name}"`);
  renderMain();
  showToast(`Recipe ${d.isNew?'added':'updated'}`);
}
async function deleteRecipe(id){
  const recipe = state.recipes.items.find(r=>r.id===id);
  if(!recipe) return;
  if(!confirm(`Delete "${recipe.name}"? This can't be undone.`)) return;
  pendingRecipeDeletes.push({ table:'recipes', match:{ id } });
  // Skip ingredients that never had an id — there is nothing on the server to
  // delete, and a delete matching on undefined is at best a wasted call.
  (recipe.ingredients||[]).forEach(ing=>{
    if(ing.id) pendingRecipeDeletes.push({ table:'recipe_ingredients', match:{ id:ing.id } });
  });
  state.recipes.items = state.recipes.items.filter(r=>r.id!==id);
  await saveRecipes();
  state.recipesSelectedId = null;
  renderMain();
  showToast('Recipe deleted');
}

function stripJsonComments(text){
  return text.split('\n').filter(line => !line.trim().startsWith('//')).join('\n');
}

function processTrainingImportText(text){
  let data;
  try{
    data = JSON.parse(stripJsonComments(text));
  } catch(e){
    showToast('⚠ Could not parse that JSON — check for a syntax error');
    return;
  }
  const plan = { newEx:[], updEx:[], newSess:[], updSess:[], newCal:[], updCal:[], skipped:0 };

  (Array.isArray(data.exercises)?data.exercises:[]).forEach(ex=>{
    if(!ex || !ex.name){ plan.skipped++; return; }
    const id = (ex.id||'').trim();
    const existing = id ? state.training.exercises.find(e=>e.id===id) : null;
    // Accept either the legacy single videoUrl or a videoUrls array from the
    // import file, and keep both in step so nothing is silently dropped.
    const importedUrls = Array.isArray(ex.videoUrls)
      ? ex.videoUrls.filter(u=>typeof u==='string' && u.trim()).map(u=>u.trim())
      : (ex.videoUrl ? [String(ex.videoUrl).trim()] : []);
    const fields = { name: ex.name, videoUrl: importedUrls[0]||'', videoUrls: importedUrls, notes: ex.notes||'' };
    if(existing) plan.updEx.push({ existing, fields });
    else plan.newEx.push(Object.assign({ id: id || newId('ex') }, fields));
  });

  (Array.isArray(data.sessions)?data.sessions:[]).forEach(sess=>{
    if(!sess || !sess.name){ plan.skipped++; return; }
    const id = (sess.id||'').trim();
    const existing = id ? state.training.sessions.find(s=>s.id===id) : null;
    const fields = { name: sess.name, type: sess.type||'strength', format: sess.format||'', color: sess.color||null, blocks: Array.isArray(sess.blocks)?sess.blocks:[] };
    if(existing) plan.updSess.push({ existing, fields });
    else plan.newSess.push(Object.assign({ id: id || newId('sess') }, fields));
  });

  (Array.isArray(data.calendar)?data.calendar:[]).forEach(c=>{
    if(!c || !c.date || !c.sessionId){ plan.skipped++; return; }
    const existing = state.training.calendar.find(x=>x.date===c.date);
    if(existing) plan.updCal.push({ existing, sessionId: c.sessionId });
    else plan.newCal.push({ date: c.date, sessionId: c.sessionId });
  });

  const summary = `Exercises — new: ${plan.newEx.length}, updated: ${plan.updEx.length}\n` +
    `Sessions — new: ${plan.newSess.length}, updated: ${plan.updSess.length}\n` +
    `Calendar days — new: ${plan.newCal.length}, remapped: ${plan.updCal.length}` +
    (plan.skipped ? `\nSkipped (missing required fields): ${plan.skipped}` : '');
  if(!confirm(`Import this training plan?\n\n${summary}\n\nApply these changes?`)) return;

  plan.newEx.forEach(e=> state.training.exercises.push(e));
  plan.updEx.forEach(({existing, fields})=> Object.assign(existing, fields));
  plan.newSess.forEach(s=> state.training.sessions.push(s));
  plan.updSess.forEach(({existing, fields})=> Object.assign(existing, fields));
  plan.newCal.forEach(c=> state.training.calendar.push(c));
  plan.updCal.forEach(({existing, sessionId})=> { existing.sessionId = sessionId; });

  saveTraining();
  diagLogEvent('activity', 'Imported training plan', {
    newEx:plan.newEx.length, updEx:plan.updEx.length, newSess:plan.newSess.length,
    updSess:plan.updSess.length, newCal:plan.newCal.length, updCal:plan.updCal.length,
  });
  renderMain();
  showToast(`Imported: ${plan.newEx.length+plan.updEx.length} exercises, ${plan.newSess.length+plan.updSess.length} sessions, ${plan.newCal.length+plan.updCal.length} calendar days`);
}

function toggleMoveDateForm(date){
  state.trainingMoveFormDate = state.trainingMoveFormDate === date ? null : date;
  renderMain();
}
async function moveTrainingDayMapping(oldDate, newDate){
  if(!newDate){ showToast('Pick a date first'); return; }
  if(oldDate === newDate){ showToast('That\'s the same date'); return; }
  const cal = getTrainingCalEntry(oldDate);
  if(!cal) return;
  const existingAtNew = getTrainingCalEntry(newDate);
  const logsAtOld = getTrainingLogsForDate(oldDate);
  let msg = `Move this session from ${humanDate(oldDate)} to ${humanDate(newDate)}?`;
  if(existingAtNew) msg += `\n\n${humanDate(newDate)} already has a session mapped — it will be replaced.`;
  if(logsAtOld.length) msg += `\n\nNote: ${logsAtOld.length} already-logged exercise(s) for ${humanDate(oldDate)} stay attached to that original date — they don't move with it.`;
  if(!confirm(msg)) return;

  pendingTrainingDeletes.push({ table:'training_calendar', match:{ cal_date: oldDate } });
  state.training.calendar = state.training.calendar.filter(c=> c.date!==oldDate && c.date!==newDate);
  state.training.calendar.push({ date:newDate, sessionId:cal.sessionId });
  state.trainingMoveFormDate = null;
  await saveTraining();
  diagLogEvent('activity', `Moved training session from ${oldDate} to ${newDate}`);
  if(state.trainingSelectedDate === oldDate) state.trainingSelectedDate = newDate;
  renderMain();
  showToast('Session moved');
}

  syncSessionDraftFromDom();

}

/* ---------- Difficulty colour scale ----------
   1 = bright green through to 5 = fire red, via lime/amber/orange. A straight
   green-to-red RGB interpolation passes through muddy brown, so the scale is
   five hand-picked stops with linear interpolation between them (which also
   makes it usable for fractional values like an average difficulty).

   Rendered as a SOLID badge rather than coloured text. Coloured text failed
   the readability floor at the amber end on light themes (2.77x), and the app
   has seven themes including two dark ones. A filled badge carries its own
   background, so contrast no longer depends on what is behind it — the text
   colour is chosen per-badge by luminance and measures at least 4.8x
   everywhere. */
const DIFFICULTY_STOPS = ['#16A34A','#84A70B','#E0A100','#F06A0C','#DC2626'];

function difficultyColor(v){
  const n = Number(v);
  if(!isFinite(n)) return DIFFICULTY_STOPS[2];
  const clamped = Math.max(1, Math.min(5, n));
  const lowIdx = Math.max(0, Math.min(3, Math.floor(clamped) - 1));
  const frac = clamped - (lowIdx + 1);
  const a = DIFFICULTY_STOPS[lowIdx], b = DIFFICULTY_STOPS[lowIdx + 1];
  const hex = (h)=> [1,3,5].map(i=> parseInt(h.substr(i,2),16));
  const [r1,g1,b1] = hex(a), [r2,g2,b2] = hex(b);
  const mix = (x,y)=> Math.round(x + (y - x) * frac);
  return '#' + [mix(r1,r2), mix(g1,g2), mix(b1,b2)]
    .map(c=> c.toString(16).padStart(2,'0')).join('').toUpperCase();
}

/* Picks black or white text for whatever the badge colour turns out to be,
   using relative luminance, so an interpolated colour is legible too. */
function difficultyTextColor(bg){
  const lin = (c)=>{ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const [r,g,b] = [1,3,5].map(i=> parseInt(bg.substr(i,2),16));
  const L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  const contrast = (l1,l2)=> (Math.max(l1,l2)+0.05) / (Math.min(l1,l2)+0.05);
  return contrast(L, 1) >= contrast(L, 0.0116) ? '#FFFFFF' : '#1A1A1A';
}

function difficultyBadge(v, opts){
  const n = Number(v);
  if(!isFinite(n)) return '';
  const bg = difficultyColor(n);
  const fg = difficultyTextColor(bg);
  // Whole numbers show plain; a fractional average keeps one decimal.
  const label = Number.isInteger(n) ? String(n) : n.toFixed(1);
  const title = (opts && opts.title) || `Difficulty ${label} of 5`;
  return `<span class="difficulty-badge" style="background:${bg}; color:${fg};" title="${escapeHtml(title)}">${escapeHtml(label)}</span>`;
}

/* ---------- Exercise history (last 5 sessions) ----------
   Read-only: pulls straight from training.logs so it can never disagree with
   what was actually recorded, and writes nothing. Excludes the day currently
   being logged, since showing today's half-filled row as "history" would be
   misleading when the point is to decide what to put in it. */
function getExerciseHistory(exId, excludeDate, limit){
  return state.training.logs
    .filter(l=> l.exerciseId === exId && l.date !== excludeDate)
    .filter(l=> l.completed || l.sets || l.reps || l.weight!=null || l.distanceKm!=null || l.durationMin!=null)
    .sort((a,b)=> a.date < b.date ? 1 : -1)
    .slice(0, limit || 5);
}
function formatHistoryMetrics(l, isWalking){
  const bits = [];
  if(isWalking){
    if(l.distanceKm!=null) bits.push(`${l.distanceKm} km`);
    if(l.durationMin!=null) bits.push(`${l.durationMin} min`);
    if(l.avgPace) bits.push(String(l.avgPace));
    if(l.avgHeartRate!=null) bits.push(`${l.avgHeartRate} bpm`);
    if(l.incline) bits.push(`incline ${l.incline}`);
    if(l.calories!=null) bits.push(`${l.calories} kcal`);
  } else {
    // "3 × 10 @ 22.5kg" — the shape asked for.
    const sr = [l.sets!=null?l.sets:null, l.reps||null].filter(v=>v!==null && v!=='');
    if(sr.length===2) bits.push(`${l.sets} × ${l.reps}`);
    else if(l.sets!=null) bits.push(`${l.sets} sets`);
    else if(l.reps) bits.push(String(l.reps));
    if(l.weight!=null) bits.push(`@ ${l.weight}kg`);
  }
  return bits.join(' ');
}

/* Splits the one-per-line textarea into a clean URL list: trims, drops blanks,
   and de-duplicates. Deliberately does NOT validate the URL format — people
   paste timestamped links, playlists and app deep-links, and rejecting those
   would be more annoying than helpful. */
function parseVideoUrlLines(text){
  const out = [];
  String(text||'').split('\n').forEach(line=>{
    const t = line.trim();
    if(t && !out.includes(t)) out.push(t);
  });
  return out;
}

function videoHostLabel(url){
  try{
    const h = new URL(url).hostname.replace(/^www\./,'');
    return h || url;
  } catch(e){
    return url;
  }
}

async function deleteExerciseTag(id){
  const tag = state.settings.exerciseTags.find(t=>t.id===id);

  if(!confirm(`Delete the tag "${tag.name}"? It will be removed from any exercises using it.`)) return;
  state.settings.exerciseTags = state.settings.exerciseTags.filter(t=>t.id!==id);
  state.training.exercises.forEach(ex=>{ if(ex.tagIds) ex.tagIds = ex.tagIds.filter(tid=>tid!==id); });

  refreshManageExerciseTagsModal();

let trainingAssignDraft = null; // { sessionId, dates: [] }

function renderAssignDatesModalBody(){
  const overlay = document.getElementById('assignDatesOverlay');
  if(!overlay || !trainingAssignDraft) return;
  const session = getTrainingSessionById(trainingAssignDraft.sessionId);
  const dates = trainingAssignDraft.dates;
  overlay.innerHTML = `
    <div class="modal" style="max-width:540px;">
      <h3>Assign "${escapeHtml(session?session.name:'')}" to Dates</h3>

          <span class="page-sub">to</span>
          <input type="date" id="assignRangeEnd" style="flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--paper); color:var(--ink);">
        </div>
        <div class="radio-pills" id="assignWeekdayPicker">
          ${DOW_ABBR.map((d,i)=>`<button type="button" class="radio-pill" data-dow="${i}" onclick="this.classList.toggle('active')">${d}</button>`).join('')}
        </div>
        <button class="btn secondary sm" style="margin-top:8px;" onclick="generateAssignDateRange()">Generate Dates</button>
      </div>

      <div class="field">
        <label>Dates to assign (${dates.length})</label>
        <div style="max-height:180px; overflow-y:auto;">
          ${dates.length ? dates.slice().sort().map(d=>`
            <div class="metric-manage-row">
              <span class="metric-manage-name">${humanDate(d)}${getTrainingCalEntry(d)?' <span class="page-sub">(replaces existing)</span>':''}</span>
              <button class="icon-btn" onclick="removeAssignDate('${d}')">✕</button>
            </div>
          `).join('') : `<div class="page-sub">No dates added yet.</div>`}
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn secondary" onclick="closeTrainingAssignDatesModal()">Cancel</button>
        <button class="btn brass" onclick="submitAssignDates()" ${dates.length?'':'disabled'}>Assign ${dates.length} Date${dates.length===1?'':'s'}</button>
      </div>

function addSingleAssignDate(){
  const val = document.getElementById('assignSingleDate').value;
  if(!val) return;
  if(!trainingAssignDraft.dates.includes(val)) trainingAssignDraft.dates.push(val);
  renderAssignDatesModalBody();
}
function removeAssignDate(d){
  trainingAssignDraft.dates = trainingAssignDraft.dates.filter(x=>x!==d);
  renderAssignDatesModalBody();
}
function generateAssignDateRange(){
  const start = document.getElementById('assignRangeStart').value;
  const end = document.getElementById('assignRangeEnd').value;
  if(!start || !end){ showToast('Pick a start and end date'); return; }
  const activeDows = [...document.querySelectorAll('#assignWeekdayPicker .radio-pill.active')].map(b=>Number(b.dataset.dow));
  if(!activeDows.length){ showToast('Pick at least one weekday'); return; }
  let cur = parseDate(start);
  const endD = parseDate(end);
  let added = 0;
  while(cur <= endD){
    const dow = cur.getDay();
    if(activeDows.includes(dow)){
      const ds = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
      if(!trainingAssignDraft.dates.includes(ds)){ trainingAssignDraft.dates.push(ds); added++; }
    }
    cur.setDate(cur.getDate()+1);
  }
  renderAssignDatesModalBody();
  showToast(`Added ${added} date(s)`);
}
async function submitAssignDates(){
  const { sessionId, dates } = trainingAssignDraft;
  if(!dates.length){ showToast('Add at least one date'); return; }
  const replacing = dates.filter(d=> getTrainingCalEntry(d)).length;
  if(replacing && !confirm(`${replacing} of these date(s) already have a session mapped — they'll be replaced. Continue?`)) return;
  dates.forEach(d=>{
    const existing = state.training.calendar.find(c=>c.date===d);
    if(existing) existing.sessionId = sessionId;
    else state.training.calendar.push({ date:d, sessionId });
  });
  await saveTraining();
  diagLogEvent('activity', `Assigned session to ${dates.length} date(s) manually`);
  closeTrainingAssignDatesModal();
  renderMain();
  showToast(`Assigned to ${dates.length} date(s)`);
}

  const rules = state.settings.locationDayRules || [];
  const locs = state.settings.locations || [];
  const wd = state.settings.weekendDays || [];

          This only changes how tasks are <b>displayed and grouped</b>; each task keeps its own location, and removing a rule puts everything back exactly as it was.
          Remapped tasks are marked with a <b>↷</b> so you can always tell.
        </div>

          </div>

            <select id="locRuleFrom" style="flex:1; min-width:130px;">
              ${locs.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('')}
            </select>

async function saveIdleTimeout(){
  const el = document.getElementById('idleTimeoutInput');
  if(!el) return;
  const v = Math.round(Number(el.value));
  if(!isFinite(v) || v < 0 || v > 1440){ showToast('Enter a value between 0 and 1440'); return; }
  state.settings.idleTimeoutMin = v;
  await saveSettings();
  lastActivityAt = Date.now(); // changing it shouldn't instantly trip an old timeout
  renderMain();
  showToast(v === 0 ? 'Idle lock turned off' : `Idle lock set to ${v} minutes`);
}

async function addLocationDayRule(){
  const fromEl = document.getElementById('locRuleFrom');
  const toEl = document.getElementById('locRuleTo');
  if(!fromEl || !toEl) return;
  const from = fromEl.value, to = toEl.value;
  if(!from || !to){ showToast('Pick both locations'); return; }
  if(from === to){ showToast('Those are the same location'); return; }
  if(!state.settings.locationDayRules) state.settings.locationDayRules = [];
  const rules = state.settings.locationDayRules;
  if(rules.some(r=>r.from===from)){ showToast(`There's already a rule for ${from}`); return; }
  // Prevent a chain (A→B where B→C already exists) — resolution is a single
  // hop by design, so a chain would silently not do what it looks like.
  if(rules.some(r=>r.to===from) || rules.some(r=>r.from===to)){
    showToast('That would chain two rules together — not supported');
    return;
  }
  rules.push({ id:newId('locrule'), from, to });
  await saveSettings();
  renderMain();
  showToast(`Weekend rule added: ${from} ↷ ${to}`);
}
async function removeLocationDayRule(id){
  state.settings.locationDayRules = (state.settings.locationDayRules||[]).filter(r=>r.id!==id);
  await saveSettings();
  renderMain();
  showToast('Rule removed');
}

function formatBytes(n){
  if(n < 1024) return `${n} B`;
  if(n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/(1024*1024)).toFixed(2)} MB`;
}
// IMPORTANT: localStorage quota is per-ORIGIN, not per-app. CalendarOS and
// LedgerOS are served from the same GitHub Pages domain, which means they
// share ONE ~5MB pool. An earlier version of this panel only counted keys
// with our own "cos_" prefix, which produced a badly misleading picture:
// it reported ~53KB while saves were failing with quota errors, because the
// space was being consumed by a DIFFERENT app on the same origin. This now
// scans everything so the real cause is visible.
function getLocalStorageUsage(){
  const rows = [];
  let total = 0;
  let foreignTotal = 0;
  try{
    Object.keys(localStorage).forEach(k=>{
      // Size cost is key + value; both count against the quota.
      const bytes = ((localStorage.getItem(k)||'').length + k.length);
      total += bytes;
      const isOurs = k.startsWith('cos_');
      const logicalKey = isOurs ? k.slice(4) : k;
      if(!isOurs) foreignTotal += bytes;
      rows.push({
        key: logicalKey,
        rawKey: k,
        bytes,
        isOurs,
        tier: !isOurs ? 'other-app'
            : CRITICAL_STORAGE_KEYS.includes(logicalKey) ? 'critical'
            : DISPOSABLE_STORAGE_KEYS.includes(logicalKey) ? 'disposable' : 'other',
      });
    });
  } catch(e){ return null; }
  rows.sort((a,b)=>b.bytes-a.bytes);
  return { rows, total, foreignTotal };
}
async function clearDisposableCachesManually(){
  if(!confirm('Clear all re-downloadable caches (hydration, training, recipes, health, ratings, metric defs, error history)?\n\nNothing is lost — these all come back from Supabase on the next sync. Your tasks, completions, lists and settings are NOT touched.')) return;
  const evicted = await evictDisposableCaches(null);
  showToast(evicted.length ? `Cleared ${evicted.length} cache${evicted.length===1?'':'s'}` : 'Nothing to clear');
  renderMain();
}
function renderStorageUsagePanel(){
  const usage = getLocalStorageUsage();
  if(!usage) return '';
  const LIMIT_APPROX = 5 * 1024 * 1024; // browsers are typically ~5MB per ORIGIN
  const pct = Math.min(100, (usage.total/LIMIT_APPROX)*100);
  const barColor = pct > 85 ? 'var(--flag)' : pct > 60 ? 'var(--brass)' : 'var(--teal)';
  const oursTotal = usage.total - usage.foreignTotal;
  const foreignRows = usage.rows.filter(r=>!r.isOurs);
  return `
    <div class="section">
      <div class="section-head"><h2>Local Storage Usage</h2></div>
      <div class="card" style="padding:16px;">
        <div class="page-sub" style="margin-bottom:12px;">
          Browsers cap local storage at roughly 5&nbsp;MB <b>per domain — shared by every app hosted on it</b>, not per app. Since CalendarOS and LedgerOS are served from the same GitHub Pages domain, they draw on the same pool. When it fills, saves fail — and a failed save means this device keeps showing stale data, which is how completed tasks and list folder assignments have previously appeared to revert.
        </div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
          <b style="font-family:var(--font-display); font-size:18px;">${formatBytes(usage.total)}</b>
          <span class="page-sub">~${Math.round(pct)}% of the typical per-domain limit</span>
        </div>
        <div style="height:8px; background:var(--paper-dim); border-radius:999px; overflow:hidden; margin-bottom:6px;">
          <div style="height:100%; width:${pct}%; background:${barColor}; border-radius:999px;"></div>
        </div>
        <div class="page-sub" style="margin-bottom:14px;">
          CalendarOS: <b>${formatBytes(oursTotal)}</b> · Other apps on this domain: <b style="color:${usage.foreignTotal > oursTotal ? 'var(--flag)' : 'inherit'};">${formatBytes(usage.foreignTotal)}</b>
        </div>

        ${usage.foreignTotal > oursTotal ? `
          <div class="card" style="padding:12px 14px; margin-bottom:14px; border:1px solid var(--flag); background:var(--flag-soft);">
            <b>⚠ Most of the space is being used by another app on this domain, not CalendarOS.</b>
            <div class="page-sub" style="margin-top:6px; line-height:1.6;">
              CalendarOS is only using ${formatBytes(oursTotal)}, so clearing CalendarOS caches will not fix quota errors. The ${foreignRows.length} item${foreignRows.length===1?'':'s'} listed below with the <b>OTHER-APP</b> tag are the ones filling the shared pool — most likely LedgerOS, which lives on the same GitHub Pages domain. Freeing space there (or moving one app to its own domain/subdomain) is what will actually resolve this.
            </div>
          </div>
        ` : ''}

        ${usage.rows.map(r=>`
          <div class="metric-manage-row">
            <span class="metric-manage-name">
              <span style="display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:${r.tier==='critical'?'var(--flag)':r.tier==='disposable'?'var(--teal)':r.tier==='other-app'?'var(--brass)':'var(--slate-light)'};"></span>
              ${escapeHtml(r.key)}
              <span class="page-sub" style="font-size:10px; text-transform:uppercase; letter-spacing:0.03em; margin-left:4px;">${r.tier}</span>
            </span>
            <span class="page-sub">${formatBytes(r.bytes)}</span>
          </div>
        `).join('')}
        <div class="modal-actions" style="justify-content:flex-start; margin-top:12px;">
          <button class="btn secondary sm" onclick="clearDisposableCachesManually()">Clear re-downloadable CalendarOS caches</button>
        </div>
      </div>
    </div>
  `;
}

function exportBackup(){

function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let backup;
    try{
      backup = JSON.parse(e.target.result);
    } catch(err){
      showToast('⚠ That file is not valid JSON');
      event.target.value = '';
      return;
    }
    if(!backup.tasks || !backup.lists){
      showToast('⚠ That file doesn\'t look like a CalendarOS backup');
      event.target.value = '';
      return;
    }
    const ok = confirm(
      `Import this backup from ${backup.exportedAt ? new Date(backup.exportedAt).toLocaleString() : 'an unknown date'}?\n\n` +
      `This REPLACES everything currently in the app. This cannot be undone.`
    );
    event.target.value = '';
    if(!ok) return;

    state.tasks = backup.tasks;
    migrateCompletionsFormat();
    state.tasks.oneTime.forEach(t=>{ if(!t.dueHistory) t.dueHistory = []; });
    state.lists = backup.lists || [];
    state.health = backup.health || [];
    state.health.forEach(h=>{ if(!h.custom) h.custom = {}; });
    state.dailyRatings = backup.dailyRatings || [];
    state.healthMetricDefs = backup.healthMetricDefs || [];
    if(backup.settings){
      const keepSync = state.settings.sync; // never overwrite live credentials from an import
      state.settings = Object.assign({}, state.settings, backup.settings, { sync: keepSync });
      backfillSettingsDefaults();
    }

    await saveTasks();
    await saveLists();
    await saveHealth();
    await saveRatings();
    await saveHealthMetricDefs();
    await saveSettings();

    showToast('Backup imported');
    render();
  };
  reader.readAsText(file);
}

/* ---------- Drag-and-drop location reorder ---------- */
let dragFromIndex = null;
function onDragStart(e){
  dragFromIndex = Number(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
async function onDragDrop(e){
  e.preventDefault();
  const toIndex = Number(e.currentTarget.dataset.index);
  if(dragFromIndex === null || dragFromIndex === toIndex) return;
  const arr = state.settings.locations;
  const [moved] = arr.splice(dragFromIndex, 1);
  arr.splice(toIndex, 0, moved);
  await saveSettings();
  renderMain();
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  dragFromIndex = null;
}

/* ---------- Drag-and-drop page/sidebar reorder ---------- */
let pageDragFromIndex = null;
function onPageDragStart(e){
  pageDragFromIndex = Number(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
async function onPageDragDrop(e){
  e.preventDefault();
  const toIndex = Number(e.currentTarget.dataset.index);
  if(pageDragFromIndex === null || pageDragFromIndex === toIndex) return;
  const arr = state.settings.pageOrder;
  const [moved] = arr.splice(pageDragFromIndex, 1);

/* ---------- CSV export / import for batch task editing ----------
   Unified schema covering both task types in one file — a Type column
   picks which fields apply. Blank ID on import = create new; matching an
   existing ID = update that task in place. This is the batch-edit workflow:
   export, edit many rows in a spreadsheet, re-import. */
const TASK_CSV_COLUMNS = ['Type','ID','Name','Location','Silo','Priority','Due Date','Done','Recurrence Type','Recurrence Detail','Start Date','End Date','Notes'];

function csvEscape(val){
  val = val===null || val===undefined ? '' : String(val);
  if(/[",\n]/.test(val)) return '"' + val.replace(/"/g,'""') + '"';
  return val;
}
function csvRow(fields){ return fields.map(csvEscape).join(','); }

// Minimal RFC4180-style parser: handles quoted fields containing commas,
// newlines, and escaped quotes ("").
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0]||'').trim() !== '');
}

function exportTasksCsv(){
  const lines = [csvRow(TASK_CSV_COLUMNS)];
  state.tasks.oneTime.forEach(t=>{
    lines.push(csvRow(['OneTime', t.id, t.name, t.location, t.silo, t.priority, t.due||'', t.done?'Yes':'No', '', '', '', '', t.notes||'']));
  });
  state.tasks.recurring.forEach(t=>{
    lines.push(csvRow(['Recurring', t.id, t.name, t.location, t.silo, t.priority, '', '', t.type, t.detail||'', t.start||'', t.end||'', t.notes||'']));
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calendaros-tasks-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  diagLogEvent('activity', `Exported tasks to CSV (${state.tasks.oneTime.length + state.tasks.recurring.length} tasks)`);
  showToast('Tasks exported');
}

function handleImportTasksCsv(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    event.target.value = '';
    let rows;
    try{ rows = parseCsv(e.target.result); }
    catch(err){ showToast('⚠ Could not parse that CSV file'); return; }
    if(rows.length < 2){ showToast('⚠ No data rows found in that file'); return; }

    const header = rows[0].map(h=>h.trim());
    const idx = name => header.indexOf(name);
    const iType=idx('Type'), iId=idx('ID'), iName=idx('Name'), iLoc=idx('Location'), iSilo=idx('Silo'),
          iPri=idx('Priority'), iDue=idx('Due Date'), iDone=idx('Done'), iRType=idx('Recurrence Type'),
          iRDetail=idx('Recurrence Detail'), iStart=idx('Start Date'), iEnd=idx('End Date'), iNotes=idx('Notes');
    if(iType===-1 || iName===-1){ showToast('⚠ CSV is missing required "Type" or "Name" columns'); return; }

    // Build the plan first — nothing in state.tasks is touched yet, so a
    // "Cancel" at the confirm step below genuinely leaves everything as-is.
    const plan = { newOneTime:[], updOneTime:[], newRecurring:[], updRecurring:[], skipped:0 };
    rows.slice(1).forEach(r=>{
      const type = (r[iType]||'').trim();
      const name = (r[iName]||'').trim();
      if(!name){ plan.skipped++; return; }
      const id = (r[iId]||'').trim();

      if(type === 'OneTime'){
        const existing = id ? state.tasks.oneTime.find(t=>t.id===id) : null;
        const fields = {
          name, location: (r[iLoc]||'').trim(), silo: (r[iSilo]||'').trim(),
          priority: (r[iPri]||'Medium').trim() || 'Medium', due: (r[iDue]||'').trim() || null,
          done: /^(yes|true|1)$/i.test((r[iDone]||'').trim()), notes: (r[iNotes]||'').trim(),
        };
        if(existing) plan.updOneTime.push({ existing, fields });
        else plan.newOneTime.push(fields);
      } else if(type === 'Recurring'){
        const existing = id ? state.tasks.recurring.find(t=>t.id===id) : null;
        const fields = {
          name, location: (r[iLoc]||'').trim(), silo: (r[iSilo]||'').trim(),
          priority: (r[iPri]||'Medium').trim() || 'Medium',
          type: (r[iRType]||'Daily').trim() || 'Daily', detail: (r[iRDetail]||'').trim(),
          start: (r[iStart]||'').trim() || todayStr(), end: (r[iEnd]||'').trim() || null,
          notes: (r[iNotes]||'').trim(),
        };
        if(existing) plan.updRecurring.push({ existing, fields });
        else plan.newRecurring.push(fields);
      } else {
        plan.skipped++;
      }
    });

    const summary = `New: ${plan.newOneTime.length} one-time, ${plan.newRecurring.length} recurring\n` +
      `Updated: ${plan.updOneTime.length} one-time, ${plan.updRecurring.length} recurring` +
      (plan.skipped ? `\nSkipped (missing/invalid Type or Name): ${plan.skipped}` : '');
    if(!confirm(`Import this CSV?\n\n${summary}\n\nApply these changes?`)) return;

    // Now actually apply — nothing above this line touched state.tasks.
    plan.newOneTime.forEach(fields=>{
      state.tasks.oneTime.push(Object.assign({ id:newId('ot'), dueHistory:[], doneDate: fields.done?todayStr():null }, fields));
    });
    plan.updOneTime.forEach(({existing, fields})=>{
      if(fields.due && existing.due && existing.due !== fields.due){
        if(!existing.dueHistory) existing.dueHistory = [];
        existing.dueHistory.push(existing.due);
      }
      Object.assign(existing, fields, { doneDate: fields.done ? (existing.doneDate||todayStr()) : null });
    });
    plan.newRecurring.forEach(fields=>{
      state.tasks.recurring.push(Object.assign({ id:newId('rt') }, fields));
    });
    plan.updRecurring.forEach(({existing, fields})=>{
      Object.assign(existing, fields);
    });

    await saveTasks();
    diagLogEvent('activity', 'Imported tasks from CSV', {
      newOneTime: plan.newOneTime.length, updOneTime: plan.updOneTime.length,
      newRecurring: plan.newRecurring.length, updRecurring: plan.updRecurring.length, skipped: plan.skipped,
    });
    renderMain();
    showToast(`Imported: ${plan.newOneTime.length+plan.updOneTime.length} one-time, ${plan.newRecurring.length+plan.updRecurring.length} recurring`);
  };
  reader.readAsText(file);
}

      ${tab==='oneTime' ? `

      ` : ''}

async function applyBatchEdit(tab){
  const location = document.getElementById('batch_location').value;
  const silo = document.getElementById('batch_silo').value;
  const priority = document.getElementById('batch_priority').value;
  const dueEnabled = tab==='oneTime' && document.getElementById('batch_due_enable').checked;
  const due = dueEnabled ? document.getElementById('batch_due').value : null;

  if(!location && !silo && !priority && !dueEnabled){ showToast('Pick at least one field to change'); return; }

  const list = tab==='oneTime' ? state.tasks.oneTime : state.tasks.recurring;
  let count = 0;
  list.forEach(t=>{
    if(!state.selectedTaskIds.has(t.id)) return;
    if(location) t.location = location;
    if(silo) t.silo = silo;
    if(priority) t.priority = priority;
    if(dueEnabled && due){
      if(!t.dueHistory) t.dueHistory = [];
      if(t.due && t.due !== due) t.dueHistory.push(t.due);
      t.due = due;
    }
    count++;
  });
  await saveTasks();
  exitBatchSelect();
  renderMain();
  showToast(`Updated ${count} task${count===1?'':'s'}`);
}

// Returns the actual task objects due on a date, split into recurring vs
// one-time (overdue one-time tasks still pile onto today's box instead of
// their original date, matching the Dashboard/Overdue behavior).
function getTasksForDateSplit(dateStr){
  const today = todayStr();
  const oneTime = [];
  state.tasks.oneTime.forEach(t=>{
    if(t.due === dateStr){
      if(!t.done && dateStr < today) return;
      oneTime.push(t);
    }
  });
  if(dateStr === today){
    getOverdueOneTime().forEach(t=> oneTime.push(t));
  }
  const recurring = [];
  state.tasks.recurring.forEach(t=>{ if(isEffectivelyDueOn(t, dateStr)) recurring.push(t); });
  return { recurring, oneTime };
}

function calDotColor(task, kind){
  const mode = state.calColorMode || 'location';
  if(mode === 'location') return locationColor(task.location);
  if(mode === 'silo') return siloColor(task.silo);
  // 'recurType': only meaningful for recurring tasks; one-time tasks get a
  // fixed neutral marker matching the deep-red One-Time pill used elsewhere
  return kind === 'recurring' ? recurTypeColor(task.type) : 'var(--flag)';
}
function calDotLabel(task, kind){
  const mode = state.calColorMode || 'location';
  const attr = mode === 'location' ? task.location : mode === 'silo' ? task.silo : (kind==='recurring' ? task.type : 'One-Time');
  return `${task.name} — ${attr}`;
}
function setCalColorMode(mode){
  state.calColorMode = mode;
  renderMain();
}
async function toggleWeekendDay(day){

  const idx = arr.indexOf(day);

function calLegendItems(){
  const mode = state.calColorMode || 'location';
  if(mode === 'location') return state.settings.locations.map(l=>[l, locationColor(l)]);

  return RECUR_TYPES.map(t=>[t, recurTypeColor(t)]).concat([['One-Time', 'var(--flag)']]);
}

function renderCalendarView(){
  if(!state.calMonthCursor){
    const t = parseDate(todayStr());
    state.calMonthCursor = { year: t.getFullYear(), month: t.getMonth() };
  }
  if(!state.calColorMode) state.calColorMode = 'location';
  const { year, month } = state.calMonthCursor;
  const firstOfMonth = new Date(year, month, 1);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const weekendDays = state.settings.weekendDays || [];
  const MAX_DOTS_PER_ROW = 8;

  const dotsRowHtml = (tasks, kind)=>{
    if(!tasks.length) return '';
    const shown = tasks.slice(0, MAX_DOTS_PER_ROW);
    const extra = tasks.length - shown.length;
    return `<div class="dot-row">
      ${shown.map(t=>`<span class="dot" style="background:${calDotColor(t,kind)};" title="${escapeHtml(calDotLabel(t,kind))}"></span>`).join('')}
      ${extra>0 ? `<span class="dot-extra">+${extra}</span>` : ''}
    </div>`;
  };

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const { recurring, oneTime } = getTasksForDateSplit(dateStr);
    const isToday = dateStr === todayStr();
    const dow = new Date(year, month, day).getDay();
    const isWeekend = weekendDays.includes(DOW_ABBR[dow]);
    const total = recurring.length + oneTime.length;
    cells += `
      <div class="cal-cell ${isToday?'today':''} ${isWeekend?'weekend':''}" onclick="jumpToDate('${dateStr}')">
        <div class="cal-cell-top">
          <span class="date-num">${day}</span>
          ${total>0 ? `<span class="density-count">${total}</span>` : ''}
        </div>
        <div class="cal-cell-tasks">
          ${dotsRowHtml(recurring, 'recurring')}
          ${recurring.length && oneTime.length ? `<div class="cal-cell-sep"></div>` : ''}
          ${dotsRowHtml(oneTime, 'oneTime')}
        </div>
      </div>`;
  }

  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Calendar</h1>
        <div class="page-sub">Recurring tasks on top, one-time below — click a day to jump to Dashboard. Weekend days are set in Settings.</div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="chip-select">
        <button class="${state.calColorMode==='location'?'active':''}" onclick="setCalColorMode('location')">By Location</button>
        <button class="${state.calColorMode==='silo'?'active':''}" onclick="setCalColorMode('silo')">By Silo</button>
        <button class="${state.calColorMode==='recurType'?'active':''}" onclick="setCalColorMode('recurType')">By Recurrence Type</button>
      </div>
    </div>

    <div class="cal-legend">
      ${calLegendItems().map(([label,color])=>`<span class="cal-legend-item"><span class="cal-legend-dot" style="background:${color};"></span>${escapeHtml(label)}</span>`).join('')}
      <span class="cal-legend-item" style="margin-left:auto;"><span class="cal-legend-dot" style="background:color-mix(in srgb, var(--brass) 8%, var(--paper-raised)); border:1px solid var(--line);"></span>Weekend</span>
    </div>

    <div class="card" style="padding:20px;">
      <div class="cal-header">
        <button class="btn secondary sm" onclick="shiftMonth(-1)">← Prev</button>
        <h2>${MONTH_NAMES[month]} ${year}</h2>
        <button class="btn secondary sm" onclick="shiftMonth(1)">Next →</button>
        <button class="btn ghost sm" onclick="goToCurrentMonth()">Today</button>
      </div>
      <div class="cal-grid">
        ${DOW_ABBR.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `;
}
function shiftMonth(delta){
  let { year, month } = state.calMonthCursor;
  month += delta;
  if(month < 0){ month = 11; year--; }
  if(month > 11){ month = 0; year++; }
  state.calMonthCursor = { year, month };
  renderMain();
}
function goToCurrentMonth(){
  const t = parseDate(todayStr());
  state.calMonthCursor = { year: t.getFullYear(), month: t.getMonth() };
  renderMain();
}
function jumpToDate(dateStr){
  state.selectedDate = dateStr;
  state.dashboardFilter = 'Today';
  state.view = 'dashboard';
  render();
}

async function toggleListItem(listId, itemId){
  const list = state.lists.find(l=>l.id===listId);
  const item = list?.items.find(i=>i.id===itemId);
  if(!item) return;
  item.done = !item.done;
  if(item.done) _justCompletedListItemId = itemId;
  await saveLists();
  renderMain();
  _justCompletedListItemId = null;
}
let listItemDragFromIndex = null;
let listItemDragListId = null;
function onListItemDragStart(e, listId){
  listItemDragFromIndex = Number(e.currentTarget.dataset.index);
  listItemDragListId = listId;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onListItemDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
async function onListItemDragDrop(e, listId){
  e.preventDefault();
  if(listItemDragListId !== listId) return; // dragged from a different list somehow — ignore
  const toIndex = Number(e.currentTarget.dataset.index);
  if(listItemDragFromIndex === null || listItemDragFromIndex === toIndex) return;
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const [moved] = list.items.splice(listItemDragFromIndex, 1);
  list.items.splice(toIndex, 0, moved);
  _justReorderedListId = listId;
  await saveLists();
  renderMain();
  _justReorderedListId = null;
}
function onListItemDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  listItemDragFromIndex = null;
  listItemDragListId = null;
}
// Inline edit-in-place (replaces the old prompt()-based editListItemText):
// clicking an item's text swaps it for a text input in the same spot.
// Enter or clicking away saves; Escape cancels without saving.
function startEditListItem(listId, itemId){
  state.editingListItemId = itemId;
  renderMain();
  setTimeout(()=>{
    const el = document.getElementById(`editItemInput_${itemId}`);
    if(el){ el.focus(); el.select(); }
  }, 0);
}
function cancelEditListItem(){
  state.editingListItemId = null;
  renderMain();
}
async function commitEditListItem(listId, itemId, value){
  state.editingListItemId = null;
  const list = state.lists.find(l=>l.id===listId);
  const item = list?.items.find(i=>i.id===itemId);
  if(!item){ renderMain(); return; }
  const trimmed = (value||'').trim();
  if(trimmed && trimmed !== item.text){
    item.text = trimmed;
    await saveLists();
  }
  renderMain();
}
async function uncheckAllListItems(listId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  list.items.forEach(i=> i.done = false);
  await saveLists();
  renderMain();
  showToast('All items unchecked');
}
async function clearAllListItems(listId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list || !list.items.length) return;
  if(!confirm(`Remove all ${list.items.length} item${list.items.length===1?'':'s'} from "${list.title}"? This can't be undone.`)) return;
  const removedIds = list.items.map(i=>i.id);
  diagLogEvent('activity', `Cleared all items from list "${list.title}"`, { listId, count: removedIds.length });
  list.items = [];
  await saveLists();
  if(syncConfigured()){
    await enqueueSync(()=> runSyncSteps(
      removedIds.map(id => ()=> supaDeleteMatch('list_items', `id=eq.${encodeURIComponent(id)}`))
    ));
  }
  renderMain();
  showToast('All items removed');
}
async function deleteListItem(listId, itemId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const itemText = list.items.find(i=>i.id===itemId)?.text;
  diagLogEvent('activity', `Deleted list item "${itemText}"`, { listId, itemId });
  list.items = list.items.filter(i=>i.id!==itemId);
  await saveLists();
  if(syncConfigured()){
    await enqueueSync(()=> runSyncSteps([
      ()=> supaDeleteMatch('list_items', `id=eq.${encodeURIComponent(itemId)}`),
    ]));
  }
  renderMain();
}
async function addListItem(listId, text){
  text = (text||'').trim();
  if(!text) return;
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  list.items.push({ id: newId('item'), text, done:false });
  diagLogEvent('activity', `Added list item "${text}" to "${list.title}"`, { listId });
  await saveLists();
  renderMain();
  // keep the person typing without needing to re-click the box
  const inp = document.getElementById(`addItemInput_${listId}`);
  if(inp){ inp.focus(); }
}
function buildListExportText(list){
  const doneCount = list.items.filter(i=>i.done).length;
  const lines = [
    list.title,
    '='.repeat(list.title.length),
    '',
    `${doneCount}/${list.items.length} done — exported ${todayStr()}`,
    '',
  ];
  if(list.items.length){
    list.items.forEach((item,idx)=>{
      const cat = item.category ? ` (${item.category})` : '';
      lines.push(`${idx+1}. ${item.text}${cat}`);
    });
  } else {
    lines.push('(no items)');
  }
  return lines.join('\n');
}
function exportListAsText(listId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const text = buildListExportText(list);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'listExportOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <h3>Export "${escapeHtml(list.title)}"</h3>
      <div class="modal-sub">Select all is done for you — just hit Copy, or select manually.</div>
      <div class="field">
        <textarea id="listExportText" rows="12" readonly style="font-family:var(--font-mono); font-size:12.5px;" onclick="this.select();">${escapeHtml(text)}</textarea>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="document.getElementById('listExportOverlay').remove();">Close</button>
        <button class="btn brass" onclick="copyListExportText()">Copy</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  diagLogEvent('activity', `Opened export popup for list "${list.title}"`);
  setTimeout(()=>{
    const ta = document.getElementById('listExportText');
    if(ta){ ta.focus(); ta.select(); }
  }, 50);
}
function copyListExportText(){
  const ta = document.getElementById('listExportText');
  if(!ta) return;
  navigator.clipboard.writeText(ta.value).then(
    ()=> showToast('Copied to clipboard'),
    ()=>{ ta.select(); showToast('Could not auto-copy — text is selected, try Ctrl/Cmd+C'); }
  );
}
async function deleteList(listId){
  if(!confirm('Delete this entire list?')) return;
  const listTitle = state.lists.find(l=>l.id===listId)?.title;
  diagLogEvent('activity', `Deleted list "${listTitle}"`, { listId });
  state.lists = state.lists.filter(l=>l.id!==listId);
  await saveLists();
  if(syncConfigured()){
    await enqueueSync(()=> runSyncSteps([
      ()=> supaDeleteMatch('lists', `id=eq.${encodeURIComponent(listId)}`),
      ()=> supaDeleteMatch('list_items', `list_id=eq.${encodeURIComponent(listId)}`),
    ]));
  }
  renderMain();
}
async function addNewList(){
  const title = prompt('Name this list:');
  if(!title || !title.trim()) return;
  state.lists.push({ id: newId('list'), title: title.trim(), folder: null, items: [] });
  diagLogEvent('activity', `Created list "${title.trim()}"`);
  await saveLists();

}
async function setListFolder(listId, folder){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  list.folder = folder || null;
  await saveLists();
  renderMain();
}
async function renameList(listId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const newTitle = prompt('Rename list:', list.title);
  if(newTitle === null) return; // cancelled
  const trimmed = newTitle.trim();
  if(!trimmed || trimmed === list.title) return;

/* =========================================================
   RENDER: HEALTH LOG VIEW
   ========================================================= */
const CORE_METRIC_DEFAULTS = [
  { id:'core_weight', name:'Weight', type:'number', unit:'kg', field:'weight' },
  { id:'core_water', name:'Water Intake', type:'number', unit:'ml', field:'water' },
  { id:'core_caldeficit', name:'Calorie Deficit', type:'number', unit:'kcal', field:'calDeficit' },
  { id:'core_no2', name:'No. 2', type:'yesno', unit:null, field:'no2' },
];
function coreFieldFor(metricId){
  const d = CORE_METRIC_DEFAULTS.find(x=>x.id===metricId);
  return d ? d.field : null;
}
// Seeds the 4 original fields as regular metric definitions — but only ONCE,
// ever, tracked by a persisted flag. Without this guard, deleting a core
// metric would just get it silently re-added the next time this runs (e.g.
// on the next page render), since it'd still look "missing".
function ensureCoreMetricDefs(){
  if(!state.settings.healthCoreMetricsSeeded){
    CORE_METRIC_DEFAULTS.forEach((def, i)=>{
      if(!state.healthMetricDefs.find(m=>m.id===def.id)){
        state.healthMetricDefs.unshift({ id:def.id, name:def.name, type:def.type, unit:def.unit, core:true, visible:true, sortOrder:i-100 });
      }
    });
    state.settings.healthCoreMetricsSeeded = true;
    saveSettings();
  }
  state.healthMetricDefs.forEach(m=>{
    if(m.visible === undefined) m.visible = true;
    if(m.core === undefined) m.core = false;
    if(m.sortOrder === undefined) m.sortOrder = 0;
  });
}
function getMetricValue(entry, m){
  if(m.core) return entry[coreFieldFor(m.id)];
  return entry.custom ? entry.custom[m.id] : undefined;
}
function setMetricValueOnEntry(entry, m, value){
  if(m.core){ entry[coreFieldFor(m.id)] = value; }
  else { if(!entry.custom) entry.custom = {}; entry.custom[m.id] = value; }
}

function getHealthEntry(dateStr){
  let entry = state.health.find(h=>h.date === dateStr);
  if(!entry){
    entry = { date: dateStr, water:null, no2:null, calDeficit:null, weight:null, custom:{} };
    state.health.push(entry);
  }
  if(!entry.custom) entry.custom = {};
  return entry;
}

if(!state.healthViewDate) state.healthViewDate = todayStr();

function renderHealthView(){
  ensureCoreMetricDefs();
  const viewDate = state.healthViewDate;
  const entry = getHealthEntry(viewDate);
  const history = [...state.health].sort((a,b)=> a.date < b.date ? 1 : -1).slice(0,30);
  const sortedMetrics = [...state.healthMetricDefs].sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
  const visibleMetrics = sortedMetrics.filter(m=>m.visible!==false);

  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Health Log</h1>
        <div class="page-sub">Daily wellness tracking — no due dates, just log and go</div>
      </div>
      <button class="btn secondary" onclick="openMetricModal()">+ Add Metric</button>
    </div>

    <div class="filter-bar">
      <button class="btn ghost sm" onclick="shiftHealthDate(-1)">← Prev Day</button>
      <input type="date" class="filter-date" value="${viewDate}" max="${todayStr()}" onchange="setHealthViewDate(this.value)">
      <button class="btn ghost sm" onclick="shiftHealthDate(1)" ${viewDate>=todayStr()?'disabled':''}>Next Day →</button>
      ${viewDate!==todayStr() ? `<button class="btn ghost sm" onclick="setHealthViewDate(todayStr())">↺ Jump to Today</button>` : ''}
      <span class="page-sub" style="margin-left:auto;">${fullDate(viewDate)}</span>
    </div>

    <div class="health-grid">
      ${visibleMetrics.map(m=>renderMetricCard(m, entry)).join('')}
    </div>
    ${visibleMetrics.length===0 ? `<div class="card empty-state" style="margin-bottom:20px;"><span class="glyph">☺</span>All metrics are hidden — manage them below to bring some back.</div>` : ''}

    <div class="section">
      <div class="section-head"><h2>Manage Metrics</h2></div>
      <div class="card" style="padding:4px 16px;">
        ${sortedMetrics.map(m=>`
          <div class="metric-manage-row">
            <span class="metric-manage-name">${escapeHtml(m.name)}${m.core?' <span class="ptr-locked">built-in</span>':''}</span>
            <div class="toggle-switch-row">
              <span class="page-sub">Show</span>
              <div class="toggle-switch ${m.visible!==false?'on':''}" onclick="toggleMetricVisible('${m.id}')"><div class="knob"></div></div>
            </div>
            <button class="icon-btn" title="Edit" onclick="openMetricModal('${m.id}')">✎</button>
            <button class="icon-btn" title="Delete" onclick="deleteMetricDef('${m.id}')">✕</button>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>History</h2></div>
      <div class="page-sub" style="margin-bottom:8px;">Click a row to edit that day above.</div>
      <div class="card" style="padding:6px 16px; overflow-x:auto;">

function renderMetricCard(m, entry){

        <input type="number" step="any" value="${val??''}" placeholder="0" onchange="setMetricValue('${m.id}', this.value)">

      </div>`;
  } else if(m.type === 'yesno'){
    inputHtml = `
      <div class="toggle-yn">

        <button class="${val===false?'active':''}" onclick="setMetricValue('${m.id}', false)">No</button>
      </div>`;
  } else {
    inputHtml = `<input type="text" value="${escapeHtml(val||'')}" placeholder="—" onchange="setMetricValue('${m.id}', this.value)">`;

function formatMetricValue(m, val){

  if(m.type === 'yesno') return val === true ? 'Yes' : val === false ? 'No' : '—';
  return escapeHtml(String(val));
}

async function deleteHealthDay(dateStr){

      <div class="modal-sub">${editing ? (editing.core ? "Core metrics can be renamed and hidden, but not deleted or changed in type." : "Rename it, change its unit, or hide it from the daily log.") : "Add anything you want to track daily — no code changes needed, ever."}</div>
      <div class="field">

        <label>Type</label>
        <div class="radio-pills">

        </div>

      </div>

function pickMetricType(type){
  if(window.__editingMetricId) return; // locked while editing an existing metric
  window.__newMetricType = type;
  document.querySelectorAll('#addMetricOverlay .radio-pill').forEach(b=> b.classList.toggle('active', b.dataset.type===type));
  document.getElementById('metricUnitField').style.display = type==='number' ? '' : 'none';
}
async function submitMetricModal(){
  const name = document.getElementById('metricName').value.trim();
  if(!name){ showToast('Give it a name'); return; }
  const unit = document.getElementById('metricUnit').value.trim();
  if(window.__editingMetricId){
    const m = state.healthMetricDefs.find(x=>x.id===window.__editingMetricId);
    if(m){ m.name = name; if(m.type==='number') m.unit = unit||null; }
    await saveHealthMetricDefs();
    showToast(`Updated "${name}"`);
  } else {
    const def = { id: newId('metric'), name, type: window.__newMetricType, unit: unit||null, core:false, visible:true, sortOrder: state.healthMetricDefs.length };
    state.healthMetricDefs.push(def);
    await saveHealthMetricDefs();
    showToast(`Added "${name}"`);
  }
  document.getElementById('addMetricOverlay').remove();
  renderMain();
}
async function deleteMetricDef(metricId){
  const def = state.healthMetricDefs.find(m=>m.id===metricId);
  if(!def) return;
  const msg = def.core
    ? `Remove the built-in "${def.name}" metric? Its logged history stays in your data, but it won't be recreated automatically — you'd need to add it back manually as a new metric later.`
    : `Remove "${def.name}"? Past logged values stay in your history, you just won't see an input for it going forward.`;
  if(!confirm(msg)) return;
  state.healthMetricDefs = state.healthMetricDefs.filter(m=>m.id!==metricId);
  pendingMetricDefDeletes.push(metricId);
  await saveHealthMetricDefs();
  renderMain();
}

/* =========================================================
   RENDER: TRAINING VIEW
   Framework, not copy-paste: `exercises` is a reusable library,
   `sessions` reference exercises via `blocks`, `calendar` maps a specific
   date -> sessionId (this is what gets re-mapped monthly via import),
   `logs` are session-level (completed/difficulty/notes) keyed by date.
   ========================================================= */
/* =========================================================
   RENDER: TRAINING VIEW
   Framework, not copy-paste: `exercises` is a reusable library,
   `sessions` reference exercises via `blocks`, `calendar` maps a specific
   date -> sessionId (re-mapped monthly via import). `logs` are now PER
   EXERCISE (date + exerciseId), not per day — sessions with no exercises
   (walk/rest days) log against the sentinel exerciseId '__session__' so
   there's still something to check off/rate/annotate on those days.
   Subpages (Today's Training / Calendar View / Log History / Session
   Library / Exercise Library) live in a left sidebar + panel, same
   pattern as Settings.
   ========================================================= */
const TRAINING_SESSION_LEVEL_ID = '__session__';

function ensureTrainingViewDate(){
  if(!state.trainingSelectedDate) state.trainingSelectedDate = todayStr();
}
function getTrainingCalEntry(date){
  return state.training.calendar.find(c=>c.date===date) || null;
}
function getTrainingSessionById(id){
  return state.training.sessions.find(s=>s.id===id) || null;
}
function getTrainingExerciseById(id){
  return state.training.exercises.find(e=>e.id===id) || null;
}
function getTrainingLogsForDate(date){
  return state.training.logs.filter(l=>l.date===date);
}
function getTrainingLogForExercise(date, exerciseId){
  return state.training.logs.find(l=>l.date===date && l.exerciseId===exerciseId) || null;
}
function shiftTrainingDate(delta){
  ensureTrainingViewDate();
  state.trainingSelectedDate = addDays(state.trainingSelectedDate, delta);
  renderMain();
}
function setTrainingViewDate(d){
  state.trainingSelectedDate = d;
  renderMain();
}
function setTrainingSection(key){
  state.trainingSection = key;
  renderMain();
}

// The exercise "blocks" a day's session actually has to log against — for a
// normal strength session this is session.blocks as-is; for a walk/rest
// session with no exercises, it's a single synthetic block standing in for
// "the whole session," keyed by the sentinel id above.
function getTrainingLoggableBlocks(session){
  if(session.blocks && session.blocks.length) return session.blocks;
  return [{ exerciseId: TRAINING_SESSION_LEVEL_ID, reps:null, sets:null, notes:null, __sessionLevel:true }];
}

function computeDayAggregate(date){
  const cal = getTrainingCalEntry(date);
  if(!cal) return null;
  const session = getTrainingSessionById(cal.sessionId);
  if(!session) return null; // dangling — nothing to aggregate
  const blocks = getTrainingLoggableBlocks(session);
  const logs = getTrainingLogsForDate(date);
  let completed = 0, diffSum = 0, diffCount = 0;
  blocks.forEach(b=>{
    const log = logs.find(l=> l.exerciseId===b.exerciseId);
    if(log && log.completed) completed++;
    if(log && log.difficulty!=null){ diffSum += log.difficulty; diffCount++; }
  });
  return { completed, total: blocks.length, avgDifficulty: diffCount ? Math.round((diffSum/diffCount)*10)/10 : null, session };
}

function getTrainingIntegrityIssues(){
  const definedSessIds = new Set(state.training.sessions.map(s=>s.id));
  const definedExIds = new Set(state.training.exercises.map(e=>e.id));
  const missingSessIds = new Set();
  const emptyMappedDates = [];
  state.training.calendar.forEach(c=>{
    if(!c.sessionId) emptyMappedDates.push(c.date);
    else if(!definedSessIds.has(c.sessionId)) missingSessIds.add(c.sessionId);
  });
  const missingExIds = new Set();
  state.training.sessions.forEach(s=> (s.blocks||[]).forEach(b=>{ if(b.exerciseId && !definedExIds.has(b.exerciseId)) missingExIds.add(b.exerciseId); }));
  return { missingSessIds: [...missingSessIds], missingExIds: [...missingExIds], emptyMappedDates };
}

async function clearAllWrongTrainingMappings(){
  const definedSessIds = new Set(state.training.sessions.map(s=>s.id));
  const definedExIds = new Set(state.training.exercises.map(e=>e.id));

  const badCalEntries = state.training.calendar.filter(c=> !c.sessionId || !definedSessIds.has(c.sessionId));
  let danglingBlockCount = 0;
  state.training.sessions.forEach(s=> (s.blocks||[]).forEach(b=>{ if(b.exerciseId && !definedExIds.has(b.exerciseId)) danglingBlockCount++; }));

  if(!badCalEntries.length && !danglingBlockCount){
    showToast('Nothing to clear — no wrong mappings found');
    return;
  }

  const summaryLines = [
    badCalEntries.length ? `${badCalEntries.length} calendar day(s) with a broken or empty session mapping` : null,
    danglingBlockCount ? `${danglingBlockCount} exercise reference(s) inside sessions that don't exist in your library` : null,
  ].filter(Boolean).join('\n');
  if(!confirm(`Clear wrong mappings?\n\n${summaryLines}\n\nThis removes only the broken references — your sessions, exercises, and logged history are untouched. Continue?`)) return;

  badCalEntries.forEach(c=> pendingTrainingDeletes.push({ table:'training_calendar', match:{ cal_date: c.date } }));
  state.training.calendar = state.training.calendar.filter(c=> c.sessionId && definedSessIds.has(c.sessionId));

  state.training.sessions.forEach(s=>{
    if(s.blocks && s.blocks.length){
      s.blocks = s.blocks.filter(b=> !b.exerciseId || definedExIds.has(b.exerciseId));
    }
  });

  await saveTraining();
  diagLogEvent('activity', 'Cleared wrong training mappings', { calDays: badCalEntries.length, exBlocks: danglingBlockCount });
  renderMain();
  showToast(`Cleared ${badCalEntries.length} day mapping(s) and ${danglingBlockCount} exercise reference(s)`);
}

function renderTrainingView(){
  ensureTrainingViewDate();
  if(!state.trainingSection) state.trainingSection = 'today';
  const issues = getTrainingIntegrityIssues();
  const hasIssues = issues.missingSessIds.length || issues.missingExIds.length || issues.emptyMappedDates.length;

  const TRAINING_NAV = [
    ['today','◐',"Today's Training"],
    ['calendar','▦','Calendar View'],
    ['history','≡','Log History'],
    ['sessions','▤','Session Library'],
    ['exercises','⛊','Exercise Library'],

  const sectionRenderers = {
    today: renderTrainingToday,
    calendar: renderTrainingCalendarSubpage,

    exercises: renderTrainingExercisesSubpage,

  const active = sectionRenderers[state.trainingSection] ? state.trainingSection : 'today';

  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Training</h1>
        <div class="page-sub">${state.training.sessions.length} session${state.training.sessions.length===1?'':'s'} in library · ${state.training.calendar.length} day${state.training.calendar.length===1?'':'s'} planned</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn secondary sm" onclick="exportTrainingJson()">Export</button>
        <button class="btn secondary sm" onclick="copyTrainingImportTemplate()">Copy Import Template</button>
        <button class="btn secondary sm" onclick="copyTrainingImportPrompt()">Copy Prompt</button>
        <button class="btn secondary sm" onclick="openTrainingPasteImportModal()">Paste &amp; Import</button>
        <label class="btn brass sm" style="cursor:pointer;">
          Import File
          <input type="file" accept="application/json" style="display:none;" onchange="handleImportTrainingJson(event)">
        </label>
      </div>
    </div>

    ${hasIssues ? `
      <div class="card" style="padding:14px 16px; margin-bottom:16px; border:1px solid var(--brass-deep);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
          <div>
            <b style="color:var(--brass-deep);">⚠ This plan has wrong/dangling mappings</b>
            <div class="page-sub" style="margin-top:6px; line-height:1.6;">
              ${issues.missingSessIds.length ? `${issues.missingSessIds.length} calendar day(s) point to a session id not in your library: ${issues.missingSessIds.map(id=>`<code>${escapeHtml(id)}</code>`).join(', ')}.<br>` : ''}
              ${issues.emptyMappedDates.length ? `${issues.emptyMappedDates.length} calendar day(s) have an empty session reference.<br>` : ''}
              ${issues.missingExIds.length ? `${issues.missingExIds.length} exercise id(s) referenced by a session aren't in your library: ${issues.missingExIds.map(id=>`<code>${escapeHtml(id)}</code>`).join(', ')}.<br>` : ''}
            </div>
          </div>
          <button class="btn brass sm" onclick="clearAllWrongTrainingMappings()">Clear Wrong Mappings</button>
        </div>
      </div>
    ` : ''}

    <div class="settings-layout">
      <div class="settings-nav">
        ${TRAINING_NAV.map(([key,icon,label])=>`
          <button class="settings-nav-item ${active===key?'active':''}" onclick="setTrainingSection('${key}')">
            <span class="settings-nav-icon">${icon}</span>${label}
          </button>
        `).join('')}
      </div>
      <div class="settings-panel">
        ${sectionRenderers[active]()}
      </div>
    </div>
  `;
}

function renderTrainingUpcomingList(fromDate){

    else if(!session) label = `<span class="page-sub" style="color:var(--brass-deep);">⚠ missing "${escapeHtml(cal.sessionId)}"</span>`;

      <span>${agg ? `${agg.completed}/${agg.total}` : ''}</span>

function pickTrainingExDifficultyUI(rowId, val){

// Live preview of the header aggregate as you toggle/rate exercises, before
// hitting Save — the saved-state recompute on save already worked, but
// leaving the header stale until Save felt broken (reported: "counter next
// to the session name does not update"). This reads current DOM state, not
// saved state, purely for instant feedback; Save still writes the real data.
function updateTrainingDayAggPreview(){
  const badge = document.getElementById('trainingDayAggBadge');
  if(!badge) return;
  const rowEls = document.querySelectorAll('#trainingExerciseRows [data-row-id]');
  let completed = 0, diffSum = 0, diffCount = 0;
  rowEls.forEach(rowEl=>{
    const rowId = rowEl.dataset.rowId;
    const doneEl = document.getElementById(`${rowId}_done`);
    if(doneEl && doneEl.classList.contains('on')) completed++;
    const diffEl = document.querySelector(`#${rowId}_diff .radio-pill.active`);
    if(diffEl){ diffSum += Number(diffEl.dataset.val); diffCount++; }
  });
  const avg = diffCount ? Math.round((diffSum/diffCount)*10)/10 : null;
  badge.textContent = `${completed}/${rowEls.length} done${avg!=null?` · avg difficulty ${avg}`:''}`;
}

function renderTrainingDayCard(date){
  const cal = getTrainingCalEntry(date);
  if(!cal){
    return `<div class="card empty-state" style="margin-bottom:20px;"><span class="glyph">☺</span>No session mapped to ${humanDate(date)} yet. Import this month's plan to fill in the calendar.</div>`;

    </div>`;
  }
  const blocks = getTrainingLoggableBlocks(session);
  const agg = computeDayAggregate(date);
  const typeColors = { strength:'var(--brass)', walk:'var(--teal)', rest:'var(--slate-light)' };
  const typeColor = typeColors[session.type] || 'var(--slate)';
  const hasLogs = getTrainingLogsForDate(date).length > 0;
  const moveFormOpen = state.trainingMoveFormDate === date;
  return `
    <div class="card" style="padding:18px; margin-bottom:20px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px; flex-wrap:wrap;">

async function saveTrainingDayLogs(date, sessionId){
  const rowEls = document.querySelectorAll('#trainingExerciseRows [data-row-id]');
  if(!rowEls.length){ showToast('Nothing to save'); return; }
  let count = 0;
  rowEls.forEach(rowEl=>{
    const rowId = rowEl.dataset.rowId;
    const exerciseId = rowEl.dataset.exerciseId;
    const doneEl = document.getElementById(`${rowId}_done`);
    const completed = doneEl ? doneEl.classList.contains('on') : false;
    const diffEl = document.querySelector(`#${rowId}_diff .radio-pill.active`);
    const difficulty = diffEl ? Number(diffEl.dataset.val) : null;
    const notesEl = document.getElementById(`${rowId}_notes`);
    const notes = notesEl ? notesEl.value.trim() : '';
    let log = getTrainingLogForExercise(date, exerciseId);
    if(!log){
      log = { date, exerciseId, sessionId, completed:false, difficulty:null, notes:'', loggedAt:null };
      state.training.logs.push(log);
    }
    log.sessionId = sessionId;
    log.completed = completed;
    log.difficulty = difficulty;
    log.notes = notes;
    log.loggedAt = new Date().toISOString();
    count++;
  });
  await saveTraining();
  diagLogEvent('activity', `Training log saved for ${date}`, { exercises: count });
  renderMain();
  showToast(`Saved log for ${count} exercise${count===1?'':'s'}`);
}
async function deleteTrainingExerciseLog(date, exerciseId){
  const log = getTrainingLogForExercise(date, exerciseId);
  if(!log) return;
  if(!confirm(`Delete this log entry? This can't be undone.`)) return;
  state.training.logs = state.training.logs.filter(l=> !(l.date===date && l.exerciseId===exerciseId));
  pendingTrainingDeletes.push({ table:'training_logs', match:{ log_date:date, exercise_id:exerciseId } });
  await saveTraining();
  renderMain();
  showToast('Log entry deleted');
}
async function deleteTrainingDayLogs(date){
  const logs = getTrainingLogsForDate(date);
  if(!logs.length) return;
  if(!confirm(`Delete all ${logs.length} logged exercise${logs.length===1?'':'s'} for ${humanDate(date)}? This can't be undone.`)) return;
  logs.forEach(l=> pendingTrainingDeletes.push({ table:'training_logs', match:{ log_date:date, exercise_id:l.exerciseId } }));
  state.training.logs = state.training.logs.filter(l=>l.date!==date);
  await saveTraining();
  renderMain();
  showToast('Logs deleted');
}
async function clearTrainingDayMapping(date){
  const cal = getTrainingCalEntry(date);
  if(!cal) return;
  if(!confirm(`Remove the session mapped to ${humanDate(date)}? Any logs already saved for that day are kept.`)) return;
  state.training.calendar = state.training.calendar.filter(c=>c.date!==date);
  pendingTrainingDeletes.push({ table:'training_calendar', match:{ cal_date: date } });
  await saveTraining();
  renderMain();
  showToast('Day cleared');
}

/* ---------- Subpage: Calendar View ---------- */
function renderTrainingCalendarSubpage(){
  if(!state.trainingCalMonthCursor){
    const t = parseDate(todayStr());
    state.trainingCalMonthCursor = { year: t.getFullYear(), month: t.getMonth() };
  }
  const { year, month } = state.trainingCalMonthCursor;
  const firstOfMonth = new Date(year, month, 1);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const typeColors = { strength:'var(--brass)', walk:'var(--teal)', rest:'var(--slate-light)' };

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cal = getTrainingCalEntry(dateStr);
    const session = cal ? getTrainingSessionById(cal.sessionId) : null;
    const isToday = dateStr === todayStr();
    const dotColor = session ? (typeColors[session.type]||'var(--slate)') : (cal ? 'var(--brass-deep)' : null);
    const agg = computeDayAggregate(dateStr);
    cells += `
      <div class="cal-cell ${isToday?'today':''}" onclick="toggleTrainingCalExpand('${dateStr}')">
        <div class="cal-cell-top">
          <span class="date-num">${day}</span>
          ${dotColor ? `<span style="width:8px;height:8px;border-radius:50%;background:${dotColor};display:inline-block;flex-shrink:0;"></span>` : ''}
        </div>
        ${session ? `<div class="page-sub" style="font-size:9.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(session.name)}</div>`
          : (cal ? `<div class="page-sub" style="font-size:9.5px; color:var(--brass-deep);">⚠ missing</div>` : '')}
        ${agg ? `<div class="page-sub" style="font-size:9.5px;">${agg.completed}/${agg.total}</div>` : ''}
      </div>`;
  }

  const expanded = state.trainingCalExpandedDate;

  return `
    <div class="card" style="padding:20px;">
      <div class="cal-header">
        <button class="btn secondary sm" onclick="shiftTrainingCalMonth(-1)">← Prev</button>
        <h2>${MONTH_NAMES[month]} ${year}</h2>
        <button class="btn secondary sm" onclick="shiftTrainingCalMonth(1)">Next →</button>
        <button class="btn ghost sm" onclick="goToCurrentTrainingCalMonth()">Today</button>
      </div>
      <div class="cal-grid">
        ${DOW_ABBR.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    ${expanded ? `
      <div class="section">
        <div class="section-head"><h2>${humanDate(expanded)}</h2><button class="btn ghost sm" onclick="toggleTrainingCalExpand('${expanded}')">Close</button></div>
        ${renderTrainingDayCard(expanded)}
      </div>
    ` : ''}

    <div class="danger-zone">
      <h3>Danger Zone</h3>
      <div class="page-sub" style="margin-bottom:10px;">Unmaps every day on the calendar. Your session library, exercise library, and logged history are each cleared independently — this only touches the plan/schedule.</div>
      <button class="btn danger sm" onclick="confirmClearTrainingPlan()">Clear Training Plan</button>
    </div>
  `;
}
function shiftTrainingCalMonth(delta){
  let { year, month } = state.trainingCalMonthCursor;
  month += delta;
  if(month < 0){ month = 11; year--; }
  if(month > 11){ month = 0; year++; }
  state.trainingCalMonthCursor = { year, month };
  renderMain();
}
function goToCurrentTrainingCalMonth(){
  const t = parseDate(todayStr());
  state.trainingCalMonthCursor = { year: t.getFullYear(), month: t.getMonth() };
  renderMain();
}
function toggleTrainingCalExpand(date){
  state.trainingCalExpandedDate = state.trainingCalExpandedDate === date ? null : date;
  renderMain();
}

  if(!sess) return;
  const usedDays = state.training.calendar.filter(c=>c.sessionId===id).length;
  const msg = usedDays
    ? `Delete "${sess.name}"? It's currently mapped to ${usedDays} calendar day(s) — those days will show as unmapped until you import a replacement.`

function exportTrainingJson(){

    calendar: state.training.calendar,

  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });

  const a = document.createElement('a');
  a.href = url;
  a.download = `calendaros-training-${todayStr()}.json`;

  a.remove();
  URL.revokeObjectURL(url);
  diagLogEvent('activity', `Exported training data (${state.training.logs.length} logs)`);
  showToast('Training data exported');
}

function stripJsonComments(text){
  return text.split('\n').filter(line => !line.trim().startsWith('//')).join('\n');
}

function processTrainingImportText(text){
  let data;
  try{
    data = JSON.parse(stripJsonComments(text));
  } catch(e){
    showToast('⚠ Could not parse that JSON — check for a syntax error');
    return;
  }
  const plan = { newEx:[], updEx:[], newSess:[], updSess:[], newCal:[], updCal:[], skipped:0 };

  (Array.isArray(data.exercises)?data.exercises:[]).forEach(ex=>{
    if(!ex || !ex.name){ plan.skipped++; return; }
    const id = (ex.id||'').trim();
    const existing = id ? state.training.exercises.find(e=>e.id===id) : null;
    const fields = { name: ex.name, videoUrl: ex.videoUrl||'', notes: ex.notes||'' };
    if(existing) plan.updEx.push({ existing, fields });
    else plan.newEx.push(Object.assign({ id: id || newId('ex') }, fields));
  });

  (Array.isArray(data.sessions)?data.sessions:[]).forEach(sess=>{
    if(!sess || !sess.name){ plan.skipped++; return; }
    const id = (sess.id||'').trim();
    const existing = id ? state.training.sessions.find(s=>s.id===id) : null;
    const fields = { name: sess.name, type: sess.type||'strength', format: sess.format||'', color: sess.color||null, blocks: Array.isArray(sess.blocks)?sess.blocks:[] };
    if(existing) plan.updSess.push({ existing, fields });
    else plan.newSess.push(Object.assign({ id: id || newId('sess') }, fields));
  });

  (Array.isArray(data.calendar)?data.calendar:[]).forEach(c=>{
    if(!c || !c.date || !c.sessionId){ plan.skipped++; return; }
    const existing = state.training.calendar.find(x=>x.date===c.date);
    if(existing) plan.updCal.push({ existing, sessionId: c.sessionId });
    else plan.newCal.push({ date: c.date, sessionId: c.sessionId });
  });

  const summary = `Exercises — new: ${plan.newEx.length}, updated: ${plan.updEx.length}\n` +
    `Sessions — new: ${plan.newSess.length}, updated: ${plan.updSess.length}\n` +
    `Calendar days — new: ${plan.newCal.length}, remapped: ${plan.updCal.length}` +
    (plan.skipped ? `\nSkipped (missing required fields): ${plan.skipped}` : '');
  if(!confirm(`Import this training plan?\n\n${summary}\n\nApply these changes?`)) return;

  plan.newEx.forEach(e=> state.training.exercises.push(e));
  plan.updEx.forEach(({existing, fields})=> Object.assign(existing, fields));
  plan.newSess.forEach(s=> state.training.sessions.push(s));
  plan.updSess.forEach(({existing, fields})=> Object.assign(existing, fields));
  plan.newCal.forEach(c=> state.training.calendar.push(c));
  plan.updCal.forEach(({existing, sessionId})=> { existing.sessionId = sessionId; });

  saveTraining();
  diagLogEvent('activity', 'Imported training plan', {
    newEx:plan.newEx.length, updEx:plan.updEx.length, newSess:plan.newSess.length,
    updSess:plan.updSess.length, newCal:plan.newCal.length, updCal:plan.updCal.length,
  });
  renderMain();

/* ---------- #6: Move a single day's session to a different date ---------- */
function toggleMoveDateForm(date){
  state.trainingMoveFormDate = state.trainingMoveFormDate === date ? null : date;

}
async function moveTrainingDayMapping(oldDate, newDate){
  if(!newDate){ showToast('Pick a date first'); return; }
  if(oldDate === newDate){ showToast('That\'s the same date'); return; }
  const cal = getTrainingCalEntry(oldDate);
  if(!cal) return;
  const existingAtNew = getTrainingCalEntry(newDate);
  const logsAtOld = getTrainingLogsForDate(oldDate);
  let msg = `Move this session from ${humanDate(oldDate)} to ${humanDate(newDate)}?`;
  if(existingAtNew) msg += `\n\n${humanDate(newDate)} already has a session mapped — it will be replaced.`;
  if(logsAtOld.length) msg += `\n\nNote: ${logsAtOld.length} already-logged exercise(s) for ${humanDate(oldDate)} stay attached to that original date — they don't move with it.`;
  if(!confirm(msg)) return;

  pendingTrainingDeletes.push({ table:'training_calendar', match:{ cal_date: oldDate } });
  state.training.calendar = state.training.calendar.filter(c=> c.date!==oldDate && c.date!==newDate);
  state.training.calendar.push({ date:newDate, sessionId:cal.sessionId });
  state.trainingMoveFormDate = null;
  await saveTraining();
  diagLogEvent('activity', `Moved training session from ${oldDate} to ${newDate}`);
  if(state.trainingSelectedDate === oldDate) state.trainingSelectedDate = newDate;
  renderMain();
  showToast('Session moved');
}

function filterExercisePicker(idx){
  syncSessionDraftFromDom();
  const inputEl = document.getElementById(`sessBlockExInput_${idx}`);
  const resultsEl = document.getElementById(`sessBlockExResults_${idx}`);
  if(!inputEl || !resultsEl) return;
  const q = inputEl.value.trim().toLowerCase();
  const matches = [...state.training.exercises].sort((a,b)=>a.name.localeCompare(b.name)).filter(e=> !q || e.name.toLowerCase().includes(q)).slice(0,8);

  const idx = Number(el.dataset.idx);
  const exId = el.dataset.exId;
  const exName = el.dataset.exName;
  if(!trainingSessionDraft || !trainingSessionDraft.blocks[idx]) return;
  trainingSessionDraft.blocks[idx].exerciseId = exId;
  const inputEl = document.getElementById(`sessBlockExInput_${idx}`);
  const valueEl = document.getElementById(`sessBlockExValue_${idx}`);
  if(inputEl) inputEl.value = exName;
  if(valueEl) valueEl.value = exId;
  hideExercisePickerResults(idx);

async function saveSessionDraft(){
  syncSessionDraftFromDom();
  const d = trainingSessionDraft;
  const name = (d.name||'').trim();
  if(!name){ showToast('Give the session a name'); return; }
  d.name = name;
  const incomplete = d.blocks.filter(b=> !b.exerciseId);
  if(incomplete.length && !confirm(`${incomplete.length} exercise row(s) don't have an exercise selected and will be dropped. Continue?`)) return;
  const cleanBlocks = d.blocks.filter(b=> b.exerciseId).map(b=> ({ exerciseId:b.exerciseId, reps:b.reps||'', sets:b.sets||null, notes:b.notes||'' }));

  const existing = state.training.sessions.find(s=>s.id===d.id);
  const wasNew = !existing;
  if(existing){
    existing.name = d.name; existing.type = d.type; existing.format = d.format; existing.blocks = cleanBlocks;
  } else {
    state.training.sessions.push({ id:d.id, name:d.name, type:d.type, format:d.format, blocks:cleanBlocks });
  }
  await saveTraining();
  closeTrainingSessionBuilder();
  diagLogEvent('activity', `${wasNew?'Created':'Updated'} session "${d.name}" manually`);
  renderMain();
  showToast(`Session ${wasNew?'created':'updated'}`);
}

        </div>

          ${dates.length ? dates.slice().sort().map(d=>`
            <div class="metric-manage-row">
              <span class="metric-manage-name">${humanDate(d)}${getTrainingCalEntry(d)?' <span class="page-sub">(replaces existing)</span>':''}</span>
              <button class="icon-btn" onclick="removeAssignDate('${d}')">✕</button>
            </div>
          `).join('') : `<div class="page-sub">No dates added yet.</div>`}
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn secondary" onclick="closeTrainingAssignDatesModal()">Cancel</button>
        <button class="btn brass" onclick="submitAssignDates()" ${dates.length?'':'disabled'}>Assign ${dates.length} Date${dates.length===1?'':'s'}</button>
      </div>

function addSingleAssignDate(){
  const val = document.getElementById('assignSingleDate').value;
  if(!val) return;
  if(!trainingAssignDraft.dates.includes(val)) trainingAssignDraft.dates.push(val);
  renderAssignDatesModalBody();
}
function removeAssignDate(d){
  trainingAssignDraft.dates = trainingAssignDraft.dates.filter(x=>x!==d);
  renderAssignDatesModalBody();
}
function generateAssignDateRange(){
  const start = document.getElementById('assignRangeStart').value;
  const end = document.getElementById('assignRangeEnd').value;
  if(!start || !end){ showToast('Pick a start and end date'); return; }
  const activeDows = [...document.querySelectorAll('#assignWeekdayPicker .radio-pill.active')].map(b=>Number(b.dataset.dow));
  if(!activeDows.length){ showToast('Pick at least one weekday'); return; }
  let cur = parseDate(start);
  const endD = parseDate(end);
  let added = 0;
  while(cur <= endD){
    const dow = cur.getDay();
    if(activeDows.includes(dow)){
      const ds = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
      if(!trainingAssignDraft.dates.includes(ds)){ trainingAssignDraft.dates.push(ds); added++; }
    }
    cur.setDate(cur.getDate()+1);
  }
  renderAssignDatesModalBody();
  showToast(`Added ${added} date(s)`);
}
async function submitAssignDates(){
  const { sessionId, dates } = trainingAssignDraft;
  if(!dates.length){ showToast('Add at least one date'); return; }
  const replacing = dates.filter(d=> getTrainingCalEntry(d)).length;
  if(replacing && !confirm(`${replacing} of these date(s) already have a session mapped — they'll be replaced. Continue?`)) return;
  dates.forEach(d=>{
    const existing = state.training.calendar.find(c=>c.date===d);
    if(existing) existing.sessionId = sessionId;
    else state.training.calendar.push({ date:d, sessionId });
  });
  await saveTraining();
  diagLogEvent('activity', `Assigned session to ${dates.length} date(s) manually`);
  closeTrainingAssignDatesModal();
  renderMain();
  showToast(`Assigned to ${dates.length} date(s)`);
}

    ['security','🔒','Security'],

        <div class="field">

          <div class="sql-block" id="sqlBlock">-- SAFETY CHECK — leave this at the top. If this script is ever accidentally
-- pasted into the LedgerOS Supabase project instead of CalendarOS's, this
-- aborts immediately before anything else runs, so nothing gets touched.
do $$
begin
  if exists (select 1 from information_schema.tables where table_schema='public' and table_name='pd_ledger') then
    raise exception 'STOP: this looks like the LedgerOS project (found table "pd_ledger"), not CalendarOS. Aborting — nothing was changed. Re-run this in the correct Supabase project.';
  end if;
end $$;

-- Run this if you're setting up a brand new Supabase project:
create table if not exists one_time_tasks (
  id text primary key, pin text not null, name text not null,
  location text, silo text, priority text default 'Medium',
  due date, done boolean default false, done_date date,
  due_history jsonb default '[]',
  notes text, meta jsonb default '{}', updated_at timestamptz default now()
);
create table if not exists recurring_tasks (
  id text primary key, pin text not null, name text not null,
  location text, silo text, priority text default 'Medium',
  type text, detail text, start_date date, end_date date,
  reschedule_exceptions jsonb default '[]',
  notes text, meta jsonb default '{}', updated_at timestamptz default now()
);
create table if not exists task_completions (
  pin text not null, task_id text not null, completed_date date not null,
  status text default 'done', logged_at timestamptz,
  primary key (pin, task_id, completed_date)
);
create table if not exists lists (
  id text primary key, pin text not null, title text not null, folder text,
  sort_order int default 0, updated_at timestamptz default now()
);
create table if not exists list_items (
  id text primary key, pin text not null, list_id text not null,
  text text not null, category text, done boolean default false, sort_order int default 0
);
create table if not exists health_logs (

  water int, no2 boolean, cal_deficit int, weight numeric, custom_metrics jsonb default '{}',
  primary key (pin, log_date)
);
create table if not exists daily_ratings (
  pin text not null, rating_date date not null, rating int,
  done_count int, total_count int, overdue_cleared int, logged_at timestamptz,
  primary key (pin, rating_date)
);
create table if not exists health_metric_defs (
  pin text not null, id text not null, name text not null,
  type text not null, unit text, sort_order int default 0,
  core boolean default false, visible boolean default true,
  primary key (pin, id)
);
create table if not exists app_settings (
  pin text primary key, locations jsonb default '[]', silos jsonb default '[]',
  list_folders jsonb default '[]', last_active_date date
);
create table if not exists training_exercises (
  pin text not null, id text not null, name text not null,
  video_url text, notes text, updated_at timestamptz default now(),
  primary key (pin, id)
);
create table if not exists training_sessions (
  pin text not null, id text not null, name text not null,
  type text default 'strength', format text, color text,
  blocks jsonb default '[]', updated_at timestamptz default now(),
  primary key (pin, id)
);
create table if not exists training_calendar (
  pin text not null, cal_date date not null, session_id text,
  primary key (pin, cal_date)
);
create table if not exists training_logs (
  pin text not null, log_date date not null, exercise_id text not null default '__session__',
  session_id text, completed boolean default false, difficulty int, notes text, logged_at timestamptz,
  primary key (pin, log_date, exercise_id)
);

-- Already had these tables from an earlier version? Run these lines instead —
-- they only ADD new tables/columns, nothing existing is touched or deleted:
alter table one_time_tasks add column if not exists due_history jsonb default '[]';
alter table task_completions add column if not exists status text default 'done';
alter table task_completions add column if not exists logged_at timestamptz;
alter table recurring_tasks add column if not exists reschedule_exceptions jsonb default '[]';
alter table health_logs add column if not exists weight numeric;
alter table health_logs add column if not exists custom_metrics jsonb default '{}';
alter table health_metric_defs add column if not exists core boolean default false;
alter table health_metric_defs add column if not exists visible boolean default true;
alter table app_settings add column if not exists list_folders jsonb default '[]';
alter table lists add column if not exists folder text;

-- BREAKING CHANGE (v3.0.0): training_logs moved from one row per DAY to one
-- row per EXERCISE per day, so it needs an exercise_id column as part of its
-- key. This clears existing training_logs rows — nothing else is touched.
-- Only run this if you have training_logs from before v3.0.0 (harmless / a
-- no-op if you don't, or if you already ran it):
delete from training_logs;
alter table training_logs add column if not exists exercise_id text not null default '__session__';
alter table training_logs drop constraint if exists training_logs_pkey;
alter table training_logs add primary key (pin, log_date, exercise_id);

do $$
declare t text;
begin
  for t in select unnest(array['one_time_tasks','recurring_tasks','task_completions','lists','list_items','health_logs','daily_ratings','health_metric_defs','app_settings',
                                'training_exercises','training_sessions','training_calendar','training_logs'])
  loop
    execute format('alter table %I enable row level security;', t);
    execute format('drop policy if exists "allow anon all" on %I;', t);
    execute format('create policy "allow anon all" on %I for all using (true) with check (true);', t);
  end loop;
end $$;</div>
          <button class="btn secondary sm" style="margin-top:8px;" onclick="copySql()">Copy SQL</button>
          <div class="page-sub" style="margin-top:8px;">
            Already had the old single-table version connected? This SQL only adds the new tables — safe to run again. Hit Connect below and your current data will populate them.
          </div>
        </div>

        <div class="sync-warning">

        </div>

        <div class="modal-actions" style="justify-content:flex-start; margin-top:16px;">

          ${syncOn ? `<button class="btn secondary" onclick="disconnectSync()">Disconnect</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let backup;
    try{
      backup = JSON.parse(e.target.result);
    } catch(err){
      showToast('⚠ That file is not valid JSON');
      event.target.value = '';
      return;
    }
    if(!backup.tasks || !backup.lists){
      showToast('⚠ That file doesn\'t look like a CalendarOS backup');
      event.target.value = '';
      return;
    }
    const ok = confirm(
      `Import this backup from ${backup.exportedAt ? new Date(backup.exportedAt).toLocaleString() : 'an unknown date'}?\n\n` +
      `This REPLACES everything currently in the app. This cannot be undone.`
    );
    event.target.value = '';
    if(!ok) return;

    state.tasks = backup.tasks;
    migrateCompletionsFormat();
    state.tasks.oneTime.forEach(t=>{ if(!t.dueHistory) t.dueHistory = []; });
    state.lists = backup.lists || [];
    state.health = backup.health || [];
    state.health.forEach(h=>{ if(!h.custom) h.custom = {}; });
    state.dailyRatings = backup.dailyRatings || [];
    state.healthMetricDefs = backup.healthMetricDefs || [];
    if(backup.settings){
      const keepSync = state.settings.sync; // never overwrite live credentials from an import
      state.settings = Object.assign({}, state.settings, backup.settings, { sync: keepSync });
      backfillSettingsDefaults();
    }

    await saveTasks();
    await saveLists();
    await saveHealth();
    await saveRatings();
    await saveHealthMetricDefs();
    await saveSettings();

    showToast('Backup imported');
    render();
  };
  reader.readAsText(file);
}

/* ---------- Drag-and-drop location reorder ---------- */
let dragFromIndex = null;
function onDragStart(e){
  dragFromIndex = Number(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
async function onDragDrop(e){
  e.preventDefault();
  const toIndex = Number(e.currentTarget.dataset.index);
  if(dragFromIndex === null || dragFromIndex === toIndex) return;
  const arr = state.settings.locations;
  const [moved] = arr.splice(dragFromIndex, 1);
  arr.splice(toIndex, 0, moved);
  await saveSettings();
  renderMain();
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  dragFromIndex = null;
}

/* ---------- Drag-and-drop page/sidebar reorder ---------- */
let pageDragFromIndex = null;
function onPageDragStart(e){
  pageDragFromIndex = Number(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
async function onPageDragDrop(e){
  e.preventDefault();
  const toIndex = Number(e.currentTarget.dataset.index);
  if(pageDragFromIndex === null || pageDragFromIndex === toIndex) return;
  const arr = state.settings.pageOrder;
  const [moved] = arr.splice(pageDragFromIndex, 1);
  arr.splice(toIndex, 0, moved);
  pageDragFromIndex = null;
  await saveSettings();
  render(); // sidebar order changed, needs a full shell re-render
}

async function addTag(field, value){
  value = (value||'').trim();
  if(!value) return;
  if(state.settings[field].includes(value)){ showToast('Already exists'); return; }
  state.settings[field].push(value);
  await saveSettings();
  renderMain();
}
async function removeTag(field, value){
  state.settings[field] = state.settings[field].filter(v=>v!==value);

async function renameTag(field, oldValue){
  const newValue = prompt(`Rename "${oldValue}" to:`, oldValue);
  if(!newValue || !newValue.trim() || newValue.trim() === oldValue) return;
  const trimmed = newValue.trim();
  const idx = state.settings[field].indexOf(oldValue);
  if(idx === -1) return;
  state.settings[field][idx] = trimmed;

  // cascade the rename across every task that referenced the old value
  const taskField = field === 'locations' ? 'location' : 'silo';
  state.tasks.oneTime.forEach(t=>{ if(t[taskField] === oldValue) t[taskField] = trimmed; });
  state.tasks.recurring.forEach(t=>{ if(t[taskField] === oldValue) t[taskField] = trimmed; });

  await saveSettings();
  await saveTasks();
  renderMain();
  showToast(`Renamed to "${trimmed}" — updated on all matching tasks`);
}

async function removeListFolder(name){
  const usedBy = state.lists.filter(l=>l.folder===name).length;
  const msg = usedBy
    ? `Remove the "${name}" folder? ${usedBy} list(s) using it will become unfoldered — they're not deleted.`
    : `Remove the "${name}" folder?`;
  if(!confirm(msg)) return;
  state.settings.listFolders = (state.settings.listFolders||[]).filter(f=>f!==name);
  state.lists.forEach(l=>{ if(l.folder===name) l.folder = null; });
  await saveSettings();

  renderMain();
  showToast('Folder removed');
}

async function connectSync(){
  const url = document.getElementById('syncUrl').value.trim();
  const anonKey = document.getElementById('syncKey').value.trim();
  const pin = document.getElementById('syncPin').value.trim();
  if(!url || !anonKey || !pin){ showToast('Fill in URL, key, and PIN'); return; }
  try{
    await testSupabaseConnection(url, anonKey, pin);
  } catch(e){
    console.error(e);
    showToast('Could not connect — check URL/key and that you ran the SQL');
    return;
  }
  state.settings.sync = { url, anonKey, pin };
  await window.storage.set(STORAGE_KEYS.SETTINGS, JSON.stringify(state.settings), false);
  state.syncMeta.status = 'syncing';
  state.initialSyncBlocking = true;
  renderSyncBlockOverlay();
  updateSyncBadge();

  // reconcile: remote wins if it already has rows, otherwise push what we have now
  try{
    await pullFromSupabase((cur,total)=>{
      state.syncMeta.progress = { current: cur, total };
      setSyncBlockText(`Syncing… ${Math.round((cur/total)*100)}%`);
      updateSyncBadge();
      renderMain();
    });
    await markSyncSuccess();
  } catch(e){
    console.error(e);
    await markSyncError(e.message||String(e));
    state.initialSyncBlocking = false;
    renderSyncBlockOverlay();
    updateSyncBadge();
    showToast('Connected, but initial sync failed — check the console');
    renderMain();
    return;
  }
  state.initialSyncBlocking = false;
  renderSyncBlockOverlay();
  updateSyncBadge();
  renderMain();
  showToast('Connected — synced across devices');
}

async function disconnectSync(){
  if(!confirm('Disconnect sync? This device will keep its local copy of your data, but will stop mirroring to Supabase.')) return;
  state.settings.sync = null;
  await saveSettings();
  state.syncMeta = { status: 'off', dirty: false, lastSyncedAt: null, lastError: null };
  try{ await window.storage.set(STORAGE_KEYS.SYNC_META, JSON.stringify(state.syncMeta), false); } catch(e){}
  renderMain();
  showToast('Sync disconnected');
}

function quickDateButtonsHtml(inputId){
  return `
    <div class="quick-date-row">
      <button type="button" class="quick-date-btn" onclick="setQuickDate('${inputId}','tomorrow')">Tomorrow</button>
      <button type="button" class="quick-date-btn" onclick="setQuickDate('${inputId}','plus3')">In 3 days</button>
      <button type="button" class="quick-date-btn" onclick="setQuickDate('${inputId}','plus7')">In 7 days</button>
      <button type="button" class="quick-date-btn" onclick="setQuickDate('${inputId}','nextSunday')">Next Sunday</button>
      <button type="button" class="quick-date-btn" onclick="setQuickDate('${inputId}','nextMonth1st')">1st of next month</button>
    </div>
  `;
}
function setQuickDate(inputId, preset){
  const today = todayStr();
  let result;
  if(preset === 'tomorrow') result = addDays(today, 1);
  else if(preset === 'plus3') result = addDays(today, 3);
  else if(preset === 'plus7') result = addDays(today, 7);
  else if(preset === 'nextSunday'){
    const d = parseDate(today);
    let daysUntilSunday = (7 - d.getDay()) % 7;
    if(daysUntilSunday === 0) daysUntilSunday = 7; // "next" Sunday, not today even if today is Sunday
    result = addDays(today, daysUntilSunday);
  } else if(preset === 'nextMonth1st'){
    const d = parseDate(today);
    const y = d.getMonth()===11 ? d.getFullYear()+1 : d.getFullYear();
    const m = d.getMonth()===11 ? 0 : d.getMonth()+1;
    result = `${y}-${String(m+1).padStart(2,'0')}-01`;
  }
  const input = document.getElementById(inputId);
  if(input) input.value = result;
}

function recurDetailInputHtml(type, detail){
  if(type === 'Daily'){
    return `<label>Detail</label><input type="text" id="f_detail" value="" disabled placeholder="No detail needed for Daily">`;
  }
  if(type === 'Days of Week'){
    const selected = (detail||'').split(',').map(s=>s.trim());
    return `<label>Days (select all that apply)</label>
      <div class="radio-pills">
        ${DOW_ABBR.map(d=>`<button type="button" class="radio-pill dow-pill ${selected.includes(d)?'active':''}" data-day="${d}" onclick="this.classList.toggle('active')">${d}</button>`).join('')}
      </div>`;
  }
  if(type === 'Weekly' || type === 'Bi-Weekly'){
    return `<label>${type === 'Bi-Weekly' ? 'Occurs every 2 weeks on' : 'Day of week'}</label>
      <select id="f_detail">${DOW_FULL.map(d=>`<option value="${d}" ${d===detail?'selected':''}>${d}</option>`).join('')}</select>`;
  }
  if(type === 'Monthly'){
    return `<label>Day of Month (1–31)</label><input type="number" id="f_detail" min="1" max="31" value="${detail||1}">`;
  }
  if(type === 'Yearly'){
    const [mm,dd] = (detail||'01-01').split('-');
    return `<label>Month-Day (MM-DD)</label>
      <div class="field-row">
        <input type="number" id="f_detail_mm" min="1" max="12" value="${mm||1}" placeholder="MM">
        <input type="number" id="f_detail_dd" min="1" max="31" value="${dd||1}" placeholder="DD">
      </div>`;
  }
  if(type === 'Every X Days'){
    return `<label>Every N Days</label><input type="number" id="f_detail" min="1" value="${detail||5}">`;
  }
  return '';
}

function pickRecurType(type){
  modalRecurType = type;

function readRecurDetail(){
  const type = modalRecurType;
  if(type === 'Daily') return '';
  if(type === 'Days of Week'){
    const picked = Array.from(document.querySelectorAll('.dow-pill.active')).map(b=>b.dataset.day);

    const dd = String(document.getElementById('f_detail_dd').value).padStart(2,'0');
    return `${mm}-${dd}`;

  return el ? el.value : '';
}

async function saveTaskModal(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ showToast('Task name is required'); return; }
  const location = document.getElementById('f_location').value;
  const silo = document.getElementById('f_silo').value;
  const priority = document.getElementById('f_priority').value;
  const notes = document.getElementById('f_notes').value;

  if(modalKind === 'oneTime'){
    const due = document.getElementById('f_due').value;
    if(modalEditingId){
      const t = state.tasks.oneTime.find(x=>x.id===modalEditingId);
      if(!t.dueHistory) t.dueHistory = [];
      if(t.due && due && t.due !== due){
        t.dueHistory.push(t.due);
      }
      Object.assign(t, { name, location, silo, priority, notes, due });
    } else {
      state.tasks.oneTime.push({ id:newId('ot'), name, location, silo, priority, notes, due, done:false, dueHistory:[] });

    const type = modalRecurType;
    const detail = readRecurDetail();

    if(modalEditingId){

      state.tasks.recurring.push({ id:newId('rt'), name, location, silo, priority, notes, type, detail, start, end });

  renderMain();

/* =========================================================
   NEW DAY CONFIRMATION
   ========================================================= */
function computeNewDaySummary(last){
  const dueOneTime = state.tasks.oneTime.filter(t=>t.due === last);
  const doneOneTime = dueOneTime.filter(t=>t.done).length;

  const dueRecurring = state.tasks.recurring.filter(t=>isEffectivelyDueOn(t, last));
  const doneRecurring = dueRecurring.filter(t=>isCompletedOn(t.id, last)).length;
  const missedRecurring = dueRecurring.filter(t=>isMissedOn(t.id, last)).length;

  // one-time tasks that were ALREADY overdue before `last`, but got cleared on that specific day
  const overdueCleared = state.tasks.oneTime.filter(t=> t.done && t.doneDate === last && t.due && t.due < last).length;

  const done = doneOneTime + doneRecurring;
  const total = dueOneTime.length + (dueRecurring.length - missedRecurring);
  const rating = total > 0 ? Math.round((done/total)*100) : null;

  return { dueOneTime: dueOneTime.length, doneOneTime, dueRecurring: dueRecurring.length, doneRecurring, overdueCleared, done, total, rating };
}

// Review list for the New Day screen: everything currently overdue (one-time),
// plus recurring tasks that were due specifically on the previous day and
// still haven't been resolved either way.
function getNewDayReviewRows(last){
  const rows = [];
  getOverdueOneTime().forEach(t=> rows.push({ kind:'oneTime', task:t, dueOn:t.due, overdue:true }));
  state.tasks.recurring.forEach(t=>{
    if(isEffectivelyDueOn(t, last) && !getOccurrence(t.id, last)){
      rows.push({ kind:'recurring', task:t, dueOn:last, overdue:false });
    }
  });
  return rows;
}

function maybeShowNewDayModal(){
  const last = state.settings.lastActiveDate;
  const today = todayStr();
  if(!last || last === today) return;
  newDayReviewDate = last;

  const overlay = document.createElement('div');

function newDayModalHtml(last, today){
  const s = computeNewDaySummary(last);
  const rows = getNewDayReviewRows(last);
  return `
    <div class="modal wide">
      <h3>Good morning 👋</h3>
      <div class="modal-sub">Here's how ${humanDate(last)} wrapped up. Check off anything you actually finished but forgot to mark, then confirm to move ${APP_NAME} forward to ${humanDate(today)}.</div>
      <div class="newday-summary" id="newDaySummaryBlock">
        ${newDaySummaryRowsHtml(s)}
      </div>
      ${rows.length ? `
        <div class="page-sub" style="margin:14px 0 8px;">${rows.length} item${rows.length===1?'':'s'} to review — from ${humanDate(last)} and earlier</div>
        <div class="newday-review-list" id="newDayReviewList">
          ${renderTicketList(rows)}
        </div>
      ` : `<div class="page-sub" style="margin-top:14px;">Nothing outstanding to review — nice.</div>`}
      <div class="modal-sub" style="margin-top:12px;">Nothing is deleted — past days stay in your history and streaks. This just moves "Today" forward.</div>
      <div class="modal-actions">

function newDaySummaryRowsHtml(s){
  return `
    <div class="row"><span>One-time tasks completed</span><b>${s.doneOneTime} / ${s.dueOneTime}</b></div>
    <div class="row"><span>Recurring tasks completed</span><b>${s.doneRecurring} / ${s.dueRecurring}</b></div>
    <div class="row"><span>Overdue tasks cleared that day</span><b>${s.overdueCleared}</b></div>
    <div class="row newday-rating-row"><span>Day rating</span><b>${s.rating===null?'—':s.rating+'%'}</b></div>

// Called after any checkbox/missed toggle while this modal is open, so the
// counts and the remaining list both stay live instead of going stale.
function refreshNewDayModal(){
  const overlay = document.getElementById('newDayOverlay');
  if(!overlay || !newDayReviewDate) return;
  const last = newDayReviewDate;
  const summaryEl = document.getElementById('newDaySummaryBlock');
  if(summaryEl) summaryEl.innerHTML = newDaySummaryRowsHtml(computeNewDaySummary(last));

/* Backfills ids onto any ingredient missing one.

   Fixing the importer alone is not enough: a recipe imported before the fix is
   already sitting in local storage with id-less ingredients, and would go on
   failing its upsert forever with no way out short of deleting the recipe.
   This repairs such rows in place the next time recipes are saved. It only
   ever ADDS an id where none exists, so it cannot disturb ingredients that
   already have one. Returns true if anything was repaired. */
function ensureRecipeIngredientIds(){
  let repaired = 0;
  (state.recipes.items||[]).forEach(r=>{
    (r.ingredients||[]).forEach(ing=>{
      if(!ing.id){ ing.id = newId('ing'); repaired++; }
    });
  });
  if(repaired){
    diagLogEvent('recipes', `Backfilled ids on ${repaired} ingredient(s) missing one`);
  }
  return repaired > 0;
}

    ]);
  }
}

/* ---------- ID generator ---------- */
function newId(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

/* ---------- Dynamic theming (accent color, completed color, dark mode) ---------- */
function darken(hex, amount){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  let r = (num>>16) - Math.round(255*amount);
  let g = ((num>>8)&0xff) - Math.round(255*amount);
  let b = (num&0xff) - Math.round(255*amount);
  r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyDynamicTheme(){
  let styleEl = document.getElementById('dynamicTheme');
  if(!styleEl){
    styleEl = document.createElement('style');
    styleEl.id = 'dynamicTheme';
    document.head.appendChild(styleEl);
  }
  const accent = state.settings.accentColor || '#B9862F';
  const completed = state.settings.completedColor || '#3C7A73';
  styleEl.textContent = `
    :root{
      --brass: ${accent};
      --brass-deep: ${darken(accent, 0.18)};
      --completed-color: ${completed};
      --completed-deep: ${darken(completed, 0.2)};
    }
  `;
  document.body.classList.toggle('dark-mode', !!state.settings.darkMode);
}
function recurTypeColor(type){
  return (state.settings.recurTypeColors && state.settings.recurTypeColors[type]) || 'var(--teal)';
}

const SILO_FALLBACK_PALETTE = ['#B9862F','#3C7A73','#5C7999','#8E661F','#A0527A','#4C7A3D','#7C5CBF','#C1443D','#3A3F47'];
function siloColor(silo){
  if(!state.settings.siloColors) state.settings.siloColors = {};
  if(state.settings.siloColors[silo]) return state.settings.siloColors[silo];
  // stable fallback: hash the name so the same silo always gets the same color
  // even before it's been explicitly assigned one in Settings
  let hash = 0;
  for(let i=0;i<silo.length;i++) hash = (hash*31 + silo.charCodeAt(i)) >>> 0;
  return SILO_FALLBACK_PALETTE[hash % SILO_FALLBACK_PALETTE.length];
}

const LOCATION_FALLBACK_PALETTE = ['#5C7999','#B9862F','#4C7A3D','#A0527A','#7C5CBF','#C1443D','#3A3F47','#3C7A73'];
/* ---------- Weekend location remapping ----------
   A task's stored `location` is its DEFAULT — where it normally happens.
   On weekend days (state.settings.weekendDays) an optional set of mapping
   rules can remap one location to another, e.g. "1.Office" -> "3.Home".

   CRITICAL DESIGN NOTE: this is resolution at READ time only. The stored
   task.location is never rewritten, and the sync mappers (oneTimeToRow /
   recurringToRow) deliberately keep pushing the RAW value. That means:
     - turning the feature off restores the previous behaviour exactly,
     - no historical data is mutated,
     - nothing can be lost if a rule is edited or deleted.
   Everything user-visible (grouping, tags, colours, filters, Progress stats)
   goes through taskLocationFor(). Raw exports (CSV) keep the stored value.

   `dateStr` may be null/undefined — callers without a date context get the
   task's default location, which is always the safe answer.
*/
function isWeekendDate(dateStr){
  if(!dateStr) return false;
  const d = parseDate(dateStr);
  if(!d || isNaN(d.getTime())) return false;
  const wd = state.settings.weekendDays || [];
  return wd.includes(DOW_ABBR[d.getDay()]);
}
function taskLocationFor(task, dateStr){
  const base = (task && task.location) || '';
  if(!dateStr) return base;
  const rules = state.settings.locationDayRules || [];
  if(!rules.length) return base;
  if(!isWeekendDate(dateStr)) return base;
  const rule = rules.find(r=> r && r.from === base && r.to);
  return rule ? rule.to : base;
}
/* True when this task is showing somewhere other than its stored location on
   the given date — used to mark the tag so the remap is visible, not silent. */
function isLocationRemapped(task, dateStr){
  return taskLocationFor(task, dateStr) !== ((task && task.location) || '');
}

function locationColor(loc){
  if(!state.settings.locationColors) state.settings.locationColors = {};
  if(state.settings.locationColors[loc]) return state.settings.locationColors[loc];
  let hash = 0;
  for(let i=0;i<loc.length;i++) hash = (hash*31 + loc.charCodeAt(i)) >>> 0;
  return LOCATION_FALLBACK_PALETTE[hash % LOCATION_FALLBACK_PALETTE.length];
}

/* ---------- Diagnostics log ----------
   In-memory only (never written to local storage — that would just recreate
   the same quota problem). A bounded circular buffer covering the current
   session: every sync attempt, every local storage write, every load/pull,
   with real timestamps and error details. Exportable from Settings so a
   sync issue can be diagnosed from the actual log instead of a description
   after the fact. */
const diagLog = [];
const MAX_DIAG_LOG = 800;
function diagLogEvent(category, message, data){
  diagLog.push({ t: new Date().toISOString(), category, message, data: data!==undefined ? data : null });
  if(diagLog.length > MAX_DIAG_LOG) diagLog.shift();
}
// Sync error HISTORY — deliberately separate from diagLog above. diagLog is
// in-memory/session-only by design (persisting the full 800-entry log would
// recreate the original storage-quota problem), which means it's gone the
// moment the tab reloads — exactly the gap that made a real incident
// undiagnosable after the fact (the person could only send us a log from
// *after* things had already gone healthy again). This is a small, separate,
// LOCAL-ONLY (never synced to Supabase) rolling history of only the sync
// failures themselves — bounded to the last 15, so it can't grow unbounded,
// but durable across reloads and not wiped by a later successful sync. See
// Settings → Activity & Error Log → "Sync Error History".
const MAX_SYNC_ERROR_HISTORY = 15;
async function recordSyncErrorHistory(source, message){
  const entry = { t: new Date().toISOString(), source, message };
  try{
    const res = await safeGet(STORAGE_KEYS.SYNC_ERROR_HISTORY);
    const history = res ? JSON.parse(res.value) : [];
    history.push(entry);
    while(history.length > MAX_SYNC_ERROR_HISTORY) history.shift();
    await safeStorageSet(STORAGE_KEYS.SYNC_ERROR_HISTORY, JSON.stringify(history), 'sync error history', {silent:true});
    state.syncErrorHistory = history; // keep in-memory copy in sync so the Settings page reflects it immediately, no reload needed
  } catch(e){ console.error('failed to persist sync error history (non-fatal)', e); }
}
/* Durable record of DESTRUCTIVE actions.

   diagLog is deliberately session-only, so an activity entry describing a
   deletion is gone the moment the tab reloads — which is exactly when you want
   it, because you only go looking after noticing something is missing days
   later. Deletions are irreversible and are the class of action most worth
   accounting for afterwards, so they get their own small, bounded, local-only
   history that survives reloads. Never synced: it records what happened on
   THIS device. */
const MAX_DELETION_HISTORY = 40;
async function recordDeletion(what, detail){
  const entry = { t: new Date().toISOString(), what, detail: detail || null };
  try{
    const res = await safeGet(STORAGE_KEYS.DELETION_HISTORY);
    const history = res ? JSON.parse(res.value) : [];
    history.push(entry);
    while(history.length > MAX_DELETION_HISTORY) history.shift();
    await safeStorageSet(STORAGE_KEYS.DELETION_HISTORY, JSON.stringify(history), 'deletion history', {silent:true});
    state.deletionHistory = history;
  } catch(e){ console.error('failed to persist deletion history (non-fatal)', e); }
}
async function clearDeletionHistory(){
  try{ await window.storage.delete(STORAGE_KEYS.DELETION_HISTORY, false); } catch(e){}
  state.deletionHistory = [];
  renderMain();
}

async function clearSyncErrorHistory(){
  try{ await window.storage.delete(STORAGE_KEYS.SYNC_ERROR_HISTORY, false); } catch(e){}
  state.syncErrorHistory = [];
  renderMain();
}
function formatDiagLog(){
  const errorHistory = state.syncErrorHistory || [];
  const lines = [
    `CalendarOS Diagnostic Log — generated ${new Date().toISOString()}`,
    `App version: ${APP_VERSION} | Storage: ${usingNativeAppStorage?'Claude':'Browser (standalone)'} | Sync configured: ${syncConfigured()}`,
    `Sync status: ${state.syncMeta.status} | dirty: ${state.syncMeta.dirty} | last synced: ${state.syncMeta.lastSyncedAt||'never'} | last error: ${state.syncMeta.lastError||'none'}`,
    '='.repeat(70),
    `SYNC ERROR HISTORY (persists across reloads, unlike the session log below — last ${MAX_SYNC_ERROR_HISTORY}):`,
  ];
  if(errorHistory.length){
    errorHistory.forEach(e=> lines.push(`  [${e.t}] [${e.source}] ${e.message}`));
  } else {
    lines.push('  (none recorded)');
  }
  lines.push('='.repeat(70));
  lines.push(`CURRENT SESSION LOG (in-memory only — resets on every reload, started ${diagLog.length?diagLog[0].t:'n/a'}):`);
  diagLog.forEach(e=>{
    lines.push(`[${e.t}] [${e.category}] ${e.message}${e.data ? ' — ' + JSON.stringify(e.data) : ''}`);
  });
  return lines.join('\n');
}

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 2400);
}

function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   DATA QUERIES
   ========================================================= */
function getOverdueOneTime(){
  return state.tasks.oneTime
    .filter(oneTimeIsOverdue)
    .sort((a,b)=> a.due < b.due ? -1 : 1);
}

/* =========================================================
   PROGRESS: activity log built from existing data — no new
   schema. Recurring tasks already record every resolved
   occurrence in state.tasks.completions; reschedule moves are
   already in task.rescheduleExceptions. One-time tasks: a
   completion is done+doneDate, a "miss" is inferred from being
   currently overdue and undone, and moves are reconstructed
   from the dueHistory chain (each entry is the PREVIOUS due
   date at the moment it changed, so consecutive entries give a
   from→to pair, with the task's current `due` closing the chain).
   ========================================================= */
function buildActivityLog(daysBack){
  const today = todayStr();
  const cutoff = daysBack ? addDays(today, -daysBack) : null;
  const entries = [];

  state.tasks.recurring.forEach(t=>{
    const comp = state.tasks.completions[t.id] || {};
    Object.keys(comp).forEach(dateStr=>{
      if(cutoff && dateStr < cutoff) return;
      entries.push({ date: dateStr, taskId: t.id, taskName: t.name, kind:'recurring', status: comp[dateStr].status, location:taskLocationFor(t, dateStr), silo:t.silo });
    });
    (t.rescheduleExceptions||[]).forEach(ex=>{
      if(cutoff && ex.from < cutoff) return;
      entries.push({ date: ex.from, taskId: t.id, taskName: t.name, kind:'recurring', status:'moved', movedTo: ex.to, location:taskLocationFor(t, ex.from), silo:t.silo });
    });
  });

  state.tasks.oneTime.forEach(t=>{
    if(t.done && t.doneDate){
      if(!cutoff || t.doneDate >= cutoff) entries.push({ date:t.doneDate, taskId:t.id, taskName:t.name, kind:'oneTime', status:'done', location:taskLocationFor(t, t.doneDate), silo:t.silo });
    } else if(!t.done && t.due && t.due < today){
      if(!cutoff || t.due >= cutoff) entries.push({ date:t.due, taskId:t.id, taskName:t.name, kind:'oneTime', status:'missed', location:taskLocationFor(t, t.due), silo:t.silo });
    }
    const hist = t.dueHistory||[];
    hist.forEach((oldDue,i)=>{
      if(cutoff && oldDue < cutoff) return;
      const to = i+1<hist.length ? hist[i+1] : t.due;
      entries.push({ date: oldDue, taskId:t.id, taskName:t.name, kind:'oneTime', status:'moved', movedTo: to, location:taskLocationFor(t, oldDue), silo:t.silo });
    });
  });

  entries.sort((a,b)=> b.date < a.date ? -1 : b.date > a.date ? 1 : 0); // newest first
  return entries;
}

// Flags tasks with a real pattern of being missed — not just "was missed
// once". Requires a minimum sample size so a brand-new task with 1 miss out
// of 1 occurrence doesn't get flagged as "100% missed".
const FREQUENTLY_MISSED_MIN_SAMPLE = 3;
const FREQUENTLY_MISSED_RATE_THRESHOLD = 0.3;
function getFrequentlyMissedTasks(){
  const stats = {};
  const ensure = (taskId, name, kind) => {
    if(!stats[taskId]) stats[taskId] = { taskId, name, kind, done:0, missed:0, dowMissCounts:[0,0,0,0,0,0,0] };
    return stats[taskId];
  };
  state.tasks.recurring.forEach(t=>{
    const comp = state.tasks.completions[t.id] || {};
    Object.entries(comp).forEach(([dateStr, o])=>{
      const s = ensure(t.id, t.name, 'recurring');
      if(o.status==='done') s.done++;
      else if(o.status==='missed'){ s.missed++; s.dowMissCounts[parseDate(dateStr).getDay()]++; }
    });
  });
  state.tasks.oneTime.forEach(t=>{
    if(t.done && t.doneDate){ ensure(t.id, t.name, 'oneTime').done++; }
    else if(!t.done && t.due && t.due < todayStr()){
      const s = ensure(t.id, t.name, 'oneTime');
      s.missed++;
      s.dowMissCounts[parseDate(t.due).getDay()]++;
    }
  });
  return Object.values(stats)
    .map(s=>{
      const resolved = s.done + s.missed;
      const missRate = resolved ? s.missed/resolved : 0;
      const maxDowCount = Math.max(...s.dowMissCounts);
      // Only surface a "usually missed on X" insight when there's an actual
      // lean toward one day — not when misses are evenly spread across the week.
      const worstDow = (s.missed>=2 && maxDowCount >= 2 && maxDowCount > s.missed/7)
        ? DOW_FULL[s.dowMissCounts.indexOf(maxDowCount)] : null;
      return Object.assign(s, { resolved, missRate, worstDow });
    })
    .filter(s=> s.resolved >= FREQUENTLY_MISSED_MIN_SAMPLE && s.missRate >= FREQUENTLY_MISSED_RATE_THRESHOLD)
    .sort((a,b)=> b.missRate - a.missRate || b.missed - a.missed);
}
function renderFrequentlyMissedSection(){
  const flagged = getFrequentlyMissedTasks();
  if(!flagged.length) return '';
  return `
    <div class="section">

      <div class="page-sub" style="margin-bottom:8px;">Tasks missed at least ${Math.round(FREQUENTLY_MISSED_RATE_THRESHOLD*100)}% of the time, with at least ${FREQUENTLY_MISSED_MIN_SAMPLE} resolved occurrences.</div>
      <div class="card" style="padding:4px 16px;">

/* ---------- Insights: streaks, location/silo performance, trend ---------- */
// Current streak = consecutive 'done' entries counting back from the most
// recent LOGGED date for that task (not necessarily today), stopping at the
// first 'missed'. Recurring tasks only — a one-time task has no repeat
// cadence for "streak" to mean anything.
function computeTaskStreak(taskId){
  const comp = state.tasks.completions[taskId] || {};
  const dates = Object.keys(comp).sort((a,b)=> a<b ? 1 : -1); // most recent first
  let streak = 0;
  for(const d of dates){
    if(comp[d].status === 'done') streak++;
    else break;
  }
  return streak;
}
function getTopStreaks(limit){
  return state.tasks.recurring
    .map(t=> ({ taskId:t.id, name:t.name, streak: computeTaskStreak(t.id) }))
    .filter(s=> s.streak >= 3) // below this a "streak" isn't really a meaningful insight yet
    .sort((a,b)=> b.streak-a.streak)
    .slice(0, limit||3);
}

// Best/worst by location or silo — a minimum sample size so a group with
// one lucky completion doesn't read as "100% best".
const GROUP_STATS_MIN_SAMPLE = 3;
function computeGroupStats(groupKeyFn){
  const stats = {};
  buildActivityLog(null).forEach(e=>{
    if(e.status==='moved') return;
    const key = groupKeyFn(e) || 'Unassigned';
    if(!stats[key]) stats[key] = { key, done:0, missed:0 };
    if(e.status==='done') stats[key].done++; else stats[key].missed++;
  });
  return Object.values(stats)
    .map(s=> Object.assign(s, { total: s.done+s.missed, rate: (s.done+s.missed) ? s.done/(s.done+s.missed) : null }))
    .filter(s=> s.total >= GROUP_STATS_MIN_SAMPLE)
    .sort((a,b)=> b.rate-a.rate);
}

// Overall trend: last 30 days' completion rate vs the 30 days before that.
function computeOverallTrend(){
  const today = todayStr();
  const midpoint = addDays(today, -30);
  const recent = buildActivityLog(30).filter(e=>e.status!=='moved');
  const prior = buildActivityLog(60).filter(e=> e.status!=='moved' && e.date < midpoint);
  const rate = (arr)=>{ const done=arr.filter(e=>e.status==='done').length; return arr.length ? done/arr.length : null; };
  const recentRate = rate(recent), priorRate = rate(prior);
  if(recentRate===null || priorRate===null) return null;
  return { recentRate, priorRate, deltaPct: Math.round((recentRate-priorRate)*100) };
}

// Time-of-day pattern for a single task — inherently per-task, so this
// lives on the task detail page rather than the overview.
function computeTimeOfDayPattern(taskId){
  const comp = state.tasks.completions[taskId] || {};
  const buckets = { Morning:0, Afternoon:0, Evening:0, Night:0 };
  let count = 0;
  Object.values(comp).forEach(o=>{
    if(o.status!=='done' || !o.loggedAt) return;
    const h = new Date(o.loggedAt).getHours();
    count++;
    if(h>=5 && h<12) buckets.Morning++;
    else if(h>=12 && h<17) buckets.Afternoon++;
    else if(h>=17 && h<21) buckets.Evening++;
    else buckets.Night++;
  });
  if(count < 3) return null;
  const [bestBucket, bestCount] = Object.entries(buckets).sort((a,b)=>b[1]-a[1])[0];
  if(bestCount < count*0.5) return null; // no clear lean toward one time of day
  return { bucket: bestBucket, pct: Math.round((bestCount/count)*100) };
}

function shiftProgressCalMonth(delta){
  if(!state.progressCalMonthCursor){
    const t = parseDate(todayStr());
    state.progressCalMonthCursor = { year:t.getFullYear(), month:t.getMonth() };

  let { year, month } = state.progressCalMonthCursor;
  month += delta;
  if(month<0){ month=11; year--; } else if(month>11){ month=0; year++; }
  state.progressCalMonthCursor = { year, month };
  renderMain();
}

function matchesFilters(item, dateStr){
  // Location filter matches the RESOLVED location for the date in view, so a
  // weekend-remapped task is found under the location it's actually shown in.
  if(state.locationFilter !== 'All' && taskLocationFor(item, dateStr) !== state.locationFilter) return false;
  if(state.searchQuery){
    const q = state.searchQuery.toLowerCase();
    // Search covers both the stored and resolved location so neither term misses.
    const resolvedLoc = taskLocationFor(item, dateStr);
    const locHay = resolvedLoc === item.location ? item.location : `${item.location} ${resolvedLoc}`;
    const hay = `${item.name} ${locHay} ${item.silo} ${item.notes||''}`.toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function getDashboardTasks(){

  if(state.dashboardFilter === 'Today') windowDays = 0;
  else if(state.dashboardFilter === 'Next7') windowDays = 7;
  else if(state.dashboardFilter === 'Next30') windowDays = 30;
  const endDate = addDays(sel, windowDays);

  const rows = [];

  // one-time tasks due within window (and not done)
  state.tasks.oneTime.forEach(t=>{
    if(t.done) return;
    if(!t.due) return;
    if(t.due >= sel && t.due <= endDate){
      rows.push({ kind:'oneTime', task:t, dueOn:t.due, overdue: oneTimeIsOverdue(t) });
    }
  });

  // completed-today one-time tasks stay visible (muted) in the Today view only,
  // regardless of their original due date — they drop off once the day rolls over.
  if(state.dashboardFilter === 'Today' && sel === todayStr()){
    state.tasks.oneTime.forEach(t=>{
      if(t.done && t.doneDate === todayStr()){
        rows.push({ kind:'oneTime', task:t, dueOn:t.due, overdue:false, completedToday:true });
      }
    });
  }

  // overdue one-time — only pinned when looking at "Today". When viewing a
  // specific past date, that date's own overdue task already appears above
  // via the normal due-within-window match, so it isn't duplicated here.
  if(sel === todayStr()){
    getOverdueOneTime().forEach(t=>{
      rows.push({ kind:'oneTime', task:t, dueOn:t.due, overdue:true });
    });
  }

  // recurring tasks — earliest occurrence within window (exception-aware,
  // so a rescheduled-to date shows up even if the pattern wouldn't naturally land there)
  state.tasks.recurring.forEach(t=>{
    for(let i=0;i<=windowDays;i++){
      const d = addDays(sel, i);
      if(isEffectivelyDueOn(t, d)){
        rows.push({ kind:'recurring', task:t, dueOn:d, overdue:false, rescheduled: !!rescheduleExceptionFor(t,d) });
        break;
      }
    }
  });

  // overdue recurring — mirrors overdue one-time, only pinned on "Today"
  if(sel === todayStr()){
    getOverdueRecurring().forEach(({task,date})=>{
      rows.push({ kind:'recurring', task, dueOn:date, overdue:true });
    });
  }

  // dedupe overdue duplicates (a one-time task could theoretically be both overdue+in-window; overdue wins already separate list)
  const seen = new Set();
  const deduped = [];
  rows.forEach(r=>{
    const key = r.kind+'_'+r.task.id+'_'+(r.overdue?'OD':(r.completedToday?'DONE':'W'));
    if(seen.has(key)) return;
    seen.add(key);
    if(matchesFilters(r.task, r.dueOn)) deduped.push(r);
  });

  // sort: overdue first, then normal tasks by due date/priority, completed-today last
  const prOrder = {High:0, Medium:1, Low:2};
  deduped.sort((a,b)=>{
    const aDone = !!a.completedToday, bDone = !!b.completedToday;
    if(aDone !== bDone) return aDone ? 1 : -1;
    if(a.overdue !== b.overdue) return a.overdue ? -1 : 1;
    if(a.dueOn !== b.dueOn) return a.dueOn < b.dueOn ? -1 : 1;
    return (prOrder[a.task.priority]??1) - (prOrder[b.task.priority]??1);
  });
  return deduped;
}

function countDueToday(){
  const sel = todayStr();
  let count = 0;
  state.tasks.oneTime.forEach(t=>{ if(!t.done && t.due === sel) count++; });
  state.tasks.recurring.forEach(t=>{ if(isEffectivelyDueOn(t, sel) && !isCompletedOn(t.id, sel)) count++; });
  return count;
}

function applyContentWidthClass(){

}
function applyColorTheme(){
  const theme = state.settings.colorTheme || 'warm';

  else document.body.setAttribute('data-theme', theme);

function syncBadgeHtml(){
  if(!syncConfigured()){
    return `<div class="sync-badge off" title="Cross-device sync isn't set up">
      <span class="sync-badge-dot"></span>Local only
    </div>`;
  }
  const m = state.syncMeta;
  const relTime = m.lastSyncedAt ? timeAgo(m.lastSyncedAt) : 'never';
  if(m.status === 'syncing'){
    const pct = m.progress && m.progress.total ? Math.round((m.progress.current/m.progress.total)*100) : null;
    return `<div class="sync-badge syncing" title="Syncing with Supabase…">
      <span class="sync-badge-dot"></span>Syncing${pct!==null?` ${pct}%`:'…'}
    </div>`;
  }
  if(m.status === 'error' || m.dirty){
    return `<div class="sync-badge error" title="${escapeHtml(m.lastError||'Changes are waiting to sync')}" onclick="retrySync()">
      <span class="sync-badge-dot"></span>Sync pending — retry
    </div>`;
  }
  return `<div class="sync-badge on" title="Last synced ${relTime}">
    <span class="sync-badge-dot"></span>Synced ${relTime}
  </div>`;
}
function updateSyncBadge(){
  const el = document.getElementById('syncBadgeWrap');
  if(el) el.innerHTML = syncBadgeHtml();
}
function timeAgo(isoStr){
  const diffMs = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}
async function retrySync(){
  if(!syncConfigured()) return;
  state.syncMeta.status = 'syncing';
  state.initialSyncBlocking = true;
  renderSyncBlockOverlay();
  updateSyncBadge();
  await enqueueSync(async ()=>{
    try{
      await pushFullStateToSupabase((cur,total)=>{
        state.syncMeta.progress = { current: cur, total };
        setSyncBlockText(`Syncing… ${Math.round((cur/total)*100)}%`);
        updateSyncBadge();
        renderMain(); // keeps the Settings-page progress line live too
      });
      await markSyncSuccess();
      showToast('Synced');
    } catch(e){
      console.error('Retry sync failed', e);
      await markSyncError(e.message||String(e));
      showToast('Sync retry failed — still saved locally');
    }
  });
  state.initialSyncBlocking = false;
  renderSyncBlockOverlay();
  updateSyncBadge();
}

async function clearLocalCacheNow(){
  const syncOn = syncConfigured();
  const warning = syncOn
    ? "Clear this device's local cache? Nothing is lost — Supabase has everything, and the app will pull it fresh on your next reload."
    : "Clear this device's local cache? Sync isn't connected, so anything not backed up elsewhere will be PERMANENTLY LOST. This cannot be undone.";
  if(!confirm(warning)) return;
  const keysToClear = [
    STORAGE_KEYS.TASKS, STORAGE_KEYS.LISTS, STORAGE_KEYS.HEALTH, STORAGE_KEYS.RATINGS, STORAGE_KEYS.HEALTH_METRIC_DEFS, STORAGE_KEYS.TRAINING,
  ];
  for(const key of keysToClear){
    try{ await window.storage.delete(key, false); } catch(e){ console.error('clear cache failed for', key, e); }
  }
  showToast('Local cache cleared — reloading…');
  setTimeout(()=> window.location.reload(), 900);
}

function navItem(view, icon, label, count){
  const active = state.view === view ? 'active' : '';
  const countHtml = (count !== undefined) ? `<span class="nav-count">${count}</span>` : '';
  return `<button class="nav-item ${active}" data-view="${view}" onclick="setView('${view}')">
    <span class="nav-icon">${icon}</span>${label}${countHtml}
  </button>`;
}
function updateNavActiveState(){
  document.querySelectorAll('.nav-item').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === state.view);
  });

function updateNavBadges(){
  const dashCount = document.querySelector('.nav-item[data-view="dashboard"] .nav-count');
  if(dashCount) dashCount.textContent = countDueToday();

function setView(v){
  noteActivity();
  diagLogEvent('activity', `Navigated to ${v}`);
  state.view = v;
  state.searchQuery = '';
  if(v !== 'tasks'){ state.batchSelectMode = false; state.selectedTaskIds = new Set(); }
  // Was calling the full shell-rebuilding render() here — that re-created
  // every sidebar nav item on every single page click, re-triggering their
  // entrance animation each time (reported: "whole page view moves,
  // animation looks like it restarts"). renderMain() only swaps the content
  // area, so the sidebar (and its one-time entrance animation) stays put;
  // the content area's own fade-in still plays, so navigating still feels
  // alive without the whole app appearing to reload.
  renderMain();
  updateNavActiveState();
  updateNavBadges();
}

function renderMain(){
  applyDynamicTheme();
  const el = document.getElementById('mainContent');
  if(!el) return; // shell not built yet (e.g. called before revealApp's first render()) — nothing to write into yet, safe no-op
  if((state.settings.hiddenPages||[]).includes(state.view)){
    state.view = 'dashboard';
  }
  // Prepended to EVERY page rather than tucked away in Settings: an uncovered
  // table is a standing risk to data you cannot see, so it should not be
  // possible to use the app for weeks without noticing. Empty string when
  // coverage is complete, so it costs nothing in the normal case.
  const backupBanner = renderBackupCoverageBanner();
  try{
    if(state.view === 'dashboard') el.innerHTML = renderDashboard();
    else if(state.view === 'overdue') el.innerHTML = renderOverdueView();
    else if(state.view === 'tasks') el.innerHTML = renderTasksView();
    else if(state.view === 'calendar') el.innerHTML = renderCalendarView();
    else if(state.view === 'week') el.innerHTML = renderWeekView();
    else if(state.view === 'recipes') el.innerHTML = renderRecipesView();
    else if(state.view === 'progress') el.innerHTML = renderProgressView();
    else if(state.view === 'lists') el.innerHTML = renderListsView();
    else if(state.view === 'health') el.innerHTML = renderHealthView();
    else if(state.view === 'training') el.innerHTML = renderTrainingView();
    else if(state.view === 'settings') el.innerHTML = renderSettingsView();
    if(backupBanner) el.innerHTML = backupBanner + el.innerHTML;
  } catch(err){
    console.error('Render error on view:', state.view, err);
    el.innerHTML = `
      <div class="card" style="padding:24px; max-width:520px;">
        <h2 style="font-family:var(--font-display); margin-top:0;">This page hit a snag</h2>
        <p style="color:var(--slate); font-size:13px; line-height:1.6;">
          ${escapeHtml(err.message)}
        </p>
        <p style="color:var(--slate); font-size:13px;">This is usually caused by a settings value left over from an older version. Repairing resets any missing appearance settings to their defaults — it won't touch your tasks, lists, or health log.</p>
        <button class="btn brass" onclick="repairSettingsAndRetry()">Repair &amp; Retry</button>
      </div>`;
  }
  renderPinnedPanel();
}

function renderDashboard(){
  let allRows = getDashboardTasks();
  let rows = state.settings.hideCompleted ? allRows.filter(r=>!isRowCompleted(r)) : allRows;
  const overdueN = getOverdueOneTime().length;
  const doneToday = state.tasks.oneTime.filter(t=>t.done && t.due===todayStr()).length +
    state.tasks.recurring.filter(t=> isEffectivelyDueOn(t, todayStr()) && isCompletedOn(t.id, todayStr())).length;
  const missedToday = state.tasks.recurring.filter(t=> isEffectivelyDueOn(t, todayStr()) && isMissedOn(t.id, todayStr())).length;
  const totalToday = countDueToday() + doneToday;
  const weeklyOnTime = computeWeeklyOnTimeRate();

  // Design-direction preview, Dashboard only (see conversation) — real data,
  // scoped entirely under .dash-v2 so no other page is affected.
  const overdueRingPct = Math.min(100, Math.round((overdueN / Math.max(1, overdueN + totalToday)) * 100));
  const onTimeRingPct = weeklyOnTime===null ? 0 : weeklyOnTime;

  return `

        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card flag">
        <div class="stat-num">${overdueN}</div>
        <div class="stat-label">Overdue</div>
      </div>
      <div class="stat-card brass">
        <div class="stat-num">${weeklyOnTime===null?'—':weeklyOnTime+'%'}</div>
        <div class="stat-label">On-Time This Week</div>
      </div>
    </div>

    <div class="ring-row">
      <div class="ring-card">
        <div class="ring" style="background:conic-gradient(var(--flag) 0% ${overdueRingPct}%, var(--flag-soft) ${overdueRingPct}% 100%);"><span>${overdueN}</span></div>
        <div class="ring-label">Overdue total</div>
      </div>

        <div class="ring" style="background:conic-gradient(var(--teal) 0% ${onTimeRingPct}%, var(--teal-soft-ring) ${onTimeRingPct}% 100%);"><span>${weeklyOnTime===null?'—':weeklyOnTime+'%'}</span></div>
        <div class="ring-label">On-time rate</div>
      </div>

    <div class="filter-bar">

        ${['Today','Next7','Next30'].map(f=>`<button class="${state.dashboardFilter===f?'active':''}" onclick="setDashboardFilter('${f}')">${f==='Today'?'Today':f==='Next7'?'Next 7 Days':'Next 30 Days'}</button>`).join('')}
      </div>
      <input type="date" class="filter-date" value="${state.selectedDate}" onchange="setSelectedDate(this.value)">
      ${state.selectedDate!==todayStr() ? `<button class="btn ghost sm" onclick="setSelectedDate('${todayStr()}')">↺ Jump to Today</button>` : ''}
      <div class="toggle-switch-row">

const collapsedGroups = new Set();
function toggleGroupCollapse(loc){
  if(collapsedGroups.has(loc)) collapsedGroups.delete(loc);
  else collapsedGroups.add(loc);
  renderMain();
}

function renderGroupedTickets(rows, allRows, opts){
  allRows = allRows || rows; // backward compatible if called without a separate full set
  opts = opts || {};
  if(allRows.length === 0){
    return `<div class="card empty-state"><span class="glyph">☺</span>Nothing here. Clear runway ahead.</div>`;
  }
  const groups = {};
  rows.forEach(r=>{
    const loc = taskLocationFor(r.task, r.dueOn) || 'Unassigned';
    if(!groups[loc]) groups[loc] = [];
    groups[loc].push(r);
  });
  // Counted separately from the visible groups above so the header count
  // stays accurate (e.g. "76/76 (100%)") even when Hide Completed has
  // filtered every row for that location out of the visible list — the
  // location itself still shows, just with an empty body.
  const allGroups = {};
  allRows.forEach(r=>{
    const loc = taskLocationFor(r.task, r.dueOn) || 'Unassigned';
    if(!allGroups[loc]) allGroups[loc] = [];
    allGroups[loc].push(r);
  });
  const locOrder = state.settings.locations.filter(l=>allGroups[l]).concat(Object.keys(allGroups).filter(l=>!state.settings.locations.includes(l)));
  return locOrder.map(loc=>{
    const groupRows = groups[loc] || [];
    const countingRows = allGroups[loc] || [];
    const collapsed = collapsedGroups.has(loc);
    // Counts as "handled" if either completed OR missed — both are states
    // you've already taken action on/acknowledged, vs. still needing a
    // decision. isRowResolved() already encodes exactly this (done OR
    // missed), reused here rather than recomputed.
    const handledCount = countingRows.filter(isRowResolved).length;
    const pct = countingRows.length ? Math.round((handledCount/countingRows.length)*100) : 0;
    return `
      <div class="group-block">
        <div class="group-header ${collapsed?'collapsed':''}" onclick="toggleGroupCollapse('${escapeHtml(loc)}')">
          <span class="caret">▾</span>
          <h3>${escapeHtml(loc)}</h3>
          <span class="group-count">${handledCount}/${countingRows.length} (${pct}%)</span>
        </div>
        <div class="group-body ${collapsed?'collapsed':''}">
          ${groupRows.length ? sortWithCompletedLast(groupRows).map(r=>renderTicket(r, Object.assign({hideLocation:true}, opts))).join('') : `<div class="page-sub" style="padding:10px 14px;">Nothing to show here while hidden.</div>`}
        </div>
      </div>
    `;
  }).join('');
}

function isRowCompleted(row){
  return row.kind==='recurring' ? isCompletedOn(row.task.id, row.dueOn) : !!row.task.done;
}
function isRowResolved(row){
  // "resolved" = no longer needs attention today — either done or explicitly
  // flagged missed. Both sink to the bottom of their section.
  return isRowCompleted(row) || (row.kind==='recurring' && isMissedOn(row.task.id, row.dueOn));
}
function sortWithCompletedLast(rows){
  return rows.map((r,i)=>({r,i})).sort((a,b)=>{
    const aDone = isRowResolved(a.r), bDone = isRowResolved(b.r);
    if(aDone !== bDone) return aDone ? 1 : -1;
    return a.i - b.i; // stable: preserve original relative order otherwise
  }).map(x=>x.r);
}

function renderTicketList(rows, opts){
  if(rows.length === 0){
    return `<div class="card empty-state"><span class="glyph">☺</span>Nothing here. Clear runway ahead.</div>`;
  }
  return `<div class="ticket-list">${sortWithCompletedLast(rows).map(r=>renderTicket(r, opts)).join('')}</div>`;
}

function renderTicket(row, opts){
  opts = opts || {};
  const t = row.task;
  const isRecurring = row.kind === 'recurring';
  const dateForCompletion = row.dueOn;
  const completed = isRecurring ? isCompletedOn(t.id, dateForCompletion) : t.done;
  const missed = isRecurring && isMissedOn(t.id, dateForCompletion);
  const overdue = row.overdue;
  const streak = isRecurring ? computeStreak(t, addDays(dateForCompletion,-1)) : 0;
  const onTimeStats = isRecurring ? computeOnTimeStats(t) : null;

  const typeTag = isRecurring
    ? `<span class="tag recur" style="background:${recurTypeColor(t.type)}22; color:${recurTypeColor(t.type)};">${t.type} ↻</span>`
    : `<span class="tag tag-onetime">One-Time</span>`;

  const priTag = `<span class="tag pri-${t.priority}">${t.priority}</span>`;
  const siloTag = `<span class="tag" style="background:${siloColor(t.silo)}22; color:${siloColor(t.silo)};">${escapeHtml(t.silo)}</span>`;
  const resolvedLoc = taskLocationFor(t, dateForCompletion);
  const locRemapped = resolvedLoc !== t.location;
  const locTag = opts.hideLocation ? '' : `<span class="tag${locRemapped?' tag-loc-moved':''}"${locRemapped?` title="Normally ${escapeHtml(t.location)} — moved here by a weekend location rule"`:''}>${escapeHtml(resolvedLoc)}${locRemapped?' ↷':''}</span>`;
  const statsTag = onTimeStats ? `<span class="tag stat-pill" title="${onTimeStats.total} logged occurrence${onTimeStats.total===1?'':'s'}">${onTimeStats.onTimePercent}% on-time${onTimeStats.avgDelayDays>0?` · +${onTimeStats.avgDelayDays}d avg`:''}</span>` : '';

  const dueLabel = isRecurring
    ? (t.detail ? `${t.type}${t.type==='Days of Week'||t.type==='Weekly'||t.type==='Bi-Weekly' ? ' · '+t.detail : ''}` : t.type)
    : humanDate(t.due);
  const nextDateTag = (opts.showNextDate && isRecurring)
    ? (()=>{ const n = nextOccurrenceDate(t); return n ? `<span class="tag next-date-tag">Next: ${humanDate(n)}</span>` : ''; })()
    : '';

  // one stamp at a time, priority: overdue > rescheduled > streak
  let stamp = '';
  if(overdue){
    stamp = `<div class="stamp overdue">Overdue</div>`;
  } else if(!isRecurring && t.dueHistory && t.dueHistory.length){
    stamp = `<div class="stamp reschedule" onclick="event.stopPropagation(); showRescheduleHistory('${t.id}')" title="Click to see previous dates">Rescheduled ${t.dueHistory.length}×</div>`;
  } else if(row.rescheduled){
    const exc = rescheduleExceptionFor(t, dateForCompletion);
    stamp = `<div class="stamp reschedule" title="Moved from ${exc?humanDate(exc.from):'another day'}">Rescheduled</div>`;
  } else if(isRecurring && streak >= 2){
    stamp = `<div class="stamp streak">${streak} day streak</div>`;
  }

  const tickClass = (completed ? 'checked' : (missed ? 'missed-tick' : '')) + (t.id===_justCompletedId ? ' pop' : '');
  const tickGlyph = missed ? '✕' : '✓';
  const missedBtn = isRecurring
    ? `<button class="icon-btn ${missed?'missed-active':''}" title="${missed?'Unmark missed':'Mark missed for this day'}" onclick="toggleMissedTask('${t.id}','${dateForCompletion}')">⚑</button>`
    : '';
  const selectBox = state.batchSelectMode
    ? `<button class="li-check select-check ${state.selectedTaskIds.has(t.id)?'checked':''}" onclick="toggleTaskSelected('${t.id}')">${state.selectedTaskIds.has(t.id)?'✓':''}</button>`
    : '';
  const colorfulStyle = ` style="--task-color:${locationColor(resolvedLoc)};"`;
  const tickBtn = opts.hideCheckbox
    ? ''
    : `<button class="tick-btn ${tickClass} tick-colorful"${colorfulStyle} onclick="toggleComplete('${row.kind}','${t.id}','${dateForCompletion}')">${tickGlyph}</button>`;

  return `
    <div class="ticket ${completed?'done':''} ${overdue?'overdue':''} ${missed?'missed':''} ${opts.hideCheckbox?'no-tick':''}">
      ${stamp}
      ${selectBox}
      ${tickBtn}
      <div class="ticket-body" onclick="openTaskModal('${row.kind}','${t.id}'${isRecurring?`,'${dateForCompletion}'`:''})" title="Click to edit">
        <div class="ticket-title-row">
          <span class="ticket-title">${escapeHtml(t.name)}</span>
          ${t.notes && t.notes.trim() ? `<span class="note-flag" title="Has a note">📝</span>` : ''}
        </div>
        <div class="ticket-meta">
          ${locTag}
          ${siloTag}
          ${typeTag}
          ${priTag}
          ${statsTag}
          ${nextDateTag}
          <span>${dueLabel}</span>
        </div>
      </div>
      <div class="ticket-actions">
        ${missedBtn}
        <button class="icon-btn" title="Delete" onclick="deleteTask('${row.kind}','${t.id}')">✕</button>
      </div>
    </div>
  `;
}

// Set while the New Day review modal is open — a task checked off there was
// actually done back on that previous day, not "now", so we backdate the
// completion to keep history/stats accurate rather than crediting today.
let newDayReviewDate = null;

async function toggleComplete(kind, taskId, dateStr, isUndo){
  if(kind === 'oneTime'){
    const t = state.tasks.oneTime.find(x=>x.id===taskId);
    if(!t) return;
    const prevDone = t.done;
    t.done = !t.done;
    t.doneDate = t.done ? (newDayReviewDate || todayStr()) : null;
    if(t.done) _justCompletedId = taskId; // one-shot pop animation on the checkmark, cleared right after this render
    diagLogEvent('activity', `${t.done?'Completed':'Un-completed'} one-time task "${t.name}"`, { id:taskId, isUndo:!!isUndo });
    saveTasks(); // fire-and-forget: UI updates now, sync (local+remote) happens in the background
    if(!isUndo) pushUndo({ kind, taskId, dateStr, prevValue: prevDone, name: t.name, action:'done' });
  } else {
    const t = state.tasks.recurring.find(x=>x.id===taskId);
    if(!t) return;
    const cur = isCompletedOn(taskId, dateStr);
    toggleDone(taskId, dateStr);
    if(!cur) _justCompletedId = taskId; // wasn't done before, now toggled to done
    diagLogEvent('activity', `${!cur?'Completed':'Un-completed'} recurring task "${t.name}" for ${dateStr}`, { id:taskId, isUndo:!!isUndo });
    if(!isUndo) pushUndo({ kind, taskId, dateStr, prevValue: cur, name: t.name, action:'done' });
  }
  renderMain();
  _justCompletedId = null;
  if(newDayReviewDate) refreshNewDayModal();
}

async function toggleMissedTask(taskId, dateStr, isUndo){
  const t = state.tasks.recurring.find(x=>x.id===taskId);
  const prevMissed = isMissedOn(taskId, dateStr);
  toggleMissed(taskId, dateStr);
  diagLogEvent('activity', `${!prevMissed?'Marked missed':'Un-marked missed'}: "${t?.name}" for ${dateStr}`, { id:taskId, isUndo:!!isUndo });
  if(!isUndo && t) pushUndo({ kind:'recurring', taskId, dateStr, prevValue: prevMissed, name: t.name, action:'missed' });
  renderMain();
  if(newDayReviewDate) refreshNewDayModal();
}

/* ---------- Undo (Ctrl+Z / Cmd+Z) ---------- */
function pushUndo(entry){
  state.undoStack.push(entry);
  if(state.undoStack.length > MAX_UNDO) state.undoStack.shift();
}
async function undoLast(){
  const entry = state.undoStack.pop();
  if(!entry) { showToast('Nothing to undo'); return; }
  if(entry.kind === 'oneTime'){
    const t = state.tasks.oneTime.find(x=>x.id===entry.taskId);
    if(t){ t.done = entry.prevValue; t.doneDate = t.done ? todayStr() : null; saveTasks(); }
  } else if(entry.action === 'missed'){
    setOccurrenceStatus(entry.taskId, entry.dateStr, entry.prevValue ? 'missed' : null);
  } else {
    setOccurrenceStatus(entry.taskId, entry.dateStr, entry.prevValue ? 'done' : null);
  }
  renderMain();
  showToast(`Undid: ${entry.name}`);
}
let awaitingNewTaskTypeChoice = false;
document.addEventListener('keydown', (e)=>{
  const isUndoCombo = (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z');
  if(isUndoCombo && !e.shiftKey){
    // don't hijack undo while typing in a text field
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    undoLast();
  }
  const isSaveCombo = (e.ctrlKey || e.metaKey) && e.key === 'Enter';
  if(isSaveCombo && document.getElementById('modalOverlay')){
    e.preventDefault();
    saveTaskModal();
  }
  if(e.key === 'Escape' && document.getElementById('modalOverlay')){
    e.preventDefault();
    closeModal();
  }
  if(e.key === 'Escape' && document.getElementById('quickAddExOverlay')){
    e.preventDefault();
    closeQuickAddExerciseModal();
  }

  // New task shortcut: press N (no modifier — Ctrl/Cmd+N is reserved by the
  // browser itself for "new window" and can't be intercepted from JS in any
  // browser, so a plain key is what actually works), then O (one-time) or
  // R (recurring). Works the same way whether triggered by this shortcut or
  // by clicking "+ New Task" (see openNewTaskChooser) — both just set
  // awaitingNewTaskTypeChoice and this same handler picks up the O/R press.
  if(awaitingNewTaskTypeChoice){
    e.preventDefault();
    dismissNewTaskHint();
    const chooserOverlay = document.getElementById('typeChooserOverlay');
    if(chooserOverlay) chooserOverlay.remove();
    if(e.key === 'o' || e.key === 'O'){
      openTaskModal('oneTime');
      setTimeout(()=>{ const el = document.getElementById('f_name'); if(el){ el.focus(); el.select(); } }, 30);
    } else if(e.key === 'r' || e.key === 'R'){
      openTaskModal('recurring');
      setTimeout(()=>{ const el = document.getElementById('f_name'); if(el){ el.focus(); el.select(); } }, 30);
    }
    return;
  }
  const isNewKey = (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey;
  const modalOpen = document.getElementById('modalOverlay') || document.getElementById('typeChooserOverlay');
  const gateShowing = document.getElementById('gateScreen')?.innerHTML;
  if(isNewKey && !modalOpen && !gateShowing){
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return; // don't hijack normal typing
    e.preventDefault();
    showNewTaskHint();
  }
});

function showNewTaskHint(){
  awaitingNewTaskTypeChoice = true;
  let el = document.getElementById('newTaskHint');
  if(!el){
    el = document.createElement('div');

  }
  el.innerHTML = `<b>O</b> One-Time &nbsp;·&nbsp; <b>R</b> Recurring &nbsp;·&nbsp; <span style="opacity:.6;">Esc to cancel</span>`;
  el.classList.add('show');
}
function dismissNewTaskHint(){
  awaitingNewTaskTypeChoice = false;

}

async function deleteTask(kind, taskId){
  if(!confirm('Delete this task? This cannot be undone.')) return;
  const taskName = (kind==='oneTime' ? state.tasks.oneTime : state.tasks.recurring).find(t=>t.id===taskId)?.name;
  diagLogEvent('activity', `Deleted ${kind} task "${taskName}"`, { id:taskId });
  if(kind === 'oneTime'){
    state.tasks.oneTime = state.tasks.oneTime.filter(t=>t.id!==taskId);
  } else {
    state.tasks.recurring = state.tasks.recurring.filter(t=>t.id!==taskId);
    delete state.tasks.completions[taskId];
  }
  await saveTasks();
  if(syncConfigured()){
    await enqueueSync(()=> runSyncSteps([
      ()=> supaDeleteMatch(kind === 'oneTime' ? 'one_time_tasks' : 'recurring_tasks', `id=eq.${encodeURIComponent(taskId)}`),
      ()=> kind === 'recurring' ? supaDeleteMatch('task_completions', `task_id=eq.${encodeURIComponent(taskId)}`) : null,
    ]));
  }
  renderMain();
  showToast('Task deleted');
}

/* ---------- CSV export / import for batch task editing ----------
   Unified schema covering both task types in one file — a Type column
   picks which fields apply. Blank ID on import = create new; matching an
   existing ID = update that task in place. This is the batch-edit workflow:
   export, edit many rows in a spreadsheet, re-import. */
const TASK_CSV_COLUMNS = ['Type','ID','Name','Location','Silo','Priority','Due Date','Done','Recurrence Type','Recurrence Detail','Start Date','End Date','Notes'];

function csvEscape(val){
  val = val===null || val===undefined ? '' : String(val);
  if(/[",\n]/.test(val)) return '"' + val.replace(/"/g,'""') + '"';
  return val;
}
function csvRow(fields){ return fields.map(csvEscape).join(','); }

// Minimal RFC4180-style parser: handles quoted fields containing commas,
// newlines, and escaped quotes ("").
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0]||'').trim() !== '');
}

function exportTasksCsv(){
  const lines = [csvRow(TASK_CSV_COLUMNS)];
  state.tasks.oneTime.forEach(t=>{
    lines.push(csvRow(['OneTime', t.id, t.name, t.location, t.silo, t.priority, t.due||'', t.done?'Yes':'No', '', '', '', '', t.notes||'']));
  });
  state.tasks.recurring.forEach(t=>{
    lines.push(csvRow(['Recurring', t.id, t.name, t.location, t.silo, t.priority, '', '', t.type, t.detail||'', t.start||'', t.end||'', t.notes||'']));
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calendaros-tasks-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  diagLogEvent('activity', `Exported tasks to CSV (${state.tasks.oneTime.length + state.tasks.recurring.length} tasks)`);
  showToast('Tasks exported');
}

function handleImportTasksCsv(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    event.target.value = '';
    let rows;
    try{ rows = parseCsv(e.target.result); }
    catch(err){ showToast('⚠ Could not parse that CSV file'); return; }
    if(rows.length < 2){ showToast('⚠ No data rows found in that file'); return; }

    const header = rows[0].map(h=>h.trim());
    const idx = name => header.indexOf(name);
    const iType=idx('Type'), iId=idx('ID'), iName=idx('Name'), iLoc=idx('Location'), iSilo=idx('Silo'),
          iPri=idx('Priority'), iDue=idx('Due Date'), iDone=idx('Done'), iRType=idx('Recurrence Type'),
          iRDetail=idx('Recurrence Detail'), iStart=idx('Start Date'), iEnd=idx('End Date'), iNotes=idx('Notes');
    if(iType===-1 || iName===-1){ showToast('⚠ CSV is missing required "Type" or "Name" columns'); return; }

    // Build the plan first — nothing in state.tasks is touched yet, so a
    // "Cancel" at the confirm step below genuinely leaves everything as-is.
    const plan = { newOneTime:[], updOneTime:[], newRecurring:[], updRecurring:[], skipped:0 };
    rows.slice(1).forEach(r=>{
      const type = (r[iType]||'').trim();
      const name = (r[iName]||'').trim();
      if(!name){ plan.skipped++; return; }
      const id = (r[iId]||'').trim();

      if(type === 'OneTime'){
        const existing = id ? state.tasks.oneTime.find(t=>t.id===id) : null;
        const fields = {
          name, location: (r[iLoc]||'').trim(), silo: (r[iSilo]||'').trim(),
          priority: (r[iPri]||'Medium').trim() || 'Medium', due: (r[iDue]||'').trim() || null,
          done: /^(yes|true|1)$/i.test((r[iDone]||'').trim()), notes: (r[iNotes]||'').trim(),
        };
        if(existing) plan.updOneTime.push({ existing, fields });
        else plan.newOneTime.push(fields);
      } else if(type === 'Recurring'){
        const existing = id ? state.tasks.recurring.find(t=>t.id===id) : null;
        const fields = {
          name, location: (r[iLoc]||'').trim(), silo: (r[iSilo]||'').trim(),
          priority: (r[iPri]||'Medium').trim() || 'Medium',
          type: (r[iRType]||'Daily').trim() || 'Daily', detail: (r[iRDetail]||'').trim(),
          start: (r[iStart]||'').trim() || todayStr(), end: (r[iEnd]||'').trim() || null,
          notes: (r[iNotes]||'').trim(),
        };
        if(existing) plan.updRecurring.push({ existing, fields });
        else plan.newRecurring.push(fields);
      } else {
        plan.skipped++;
      }
    });

    const summary = `New: ${plan.newOneTime.length} one-time, ${plan.newRecurring.length} recurring\n` +
      `Updated: ${plan.updOneTime.length} one-time, ${plan.updRecurring.length} recurring` +
      (plan.skipped ? `\nSkipped (missing/invalid Type or Name): ${plan.skipped}` : '');
    if(!confirm(`Import this CSV?\n\n${summary}\n\nApply these changes?`)) return;

    // Now actually apply — nothing above this line touched state.tasks.
    plan.newOneTime.forEach(fields=>{
      state.tasks.oneTime.push(Object.assign({ id:newId('ot'), dueHistory:[], doneDate: fields.done?todayStr():null }, fields));
    });
    plan.updOneTime.forEach(({existing, fields})=>{
      if(fields.due && existing.due && existing.due !== fields.due){
        if(!existing.dueHistory) existing.dueHistory = [];
        existing.dueHistory.push(existing.due);
      }
      Object.assign(existing, fields, { doneDate: fields.done ? (existing.doneDate||todayStr()) : null });
    });
    plan.newRecurring.forEach(fields=>{
      state.tasks.recurring.push(Object.assign({ id:newId('rt') }, fields));
    });
    plan.updRecurring.forEach(({existing, fields})=>{
      Object.assign(existing, fields);
    });

    await saveTasks();
    diagLogEvent('activity', 'Imported tasks from CSV', {
      newOneTime: plan.newOneTime.length, updOneTime: plan.updOneTime.length,
      newRecurring: plan.newRecurring.length, updRecurring: plan.updRecurring.length, skipped: plan.skipped,
    });
    renderMain();
    showToast(`Imported: ${plan.newOneTime.length+plan.updOneTime.length} one-time, ${plan.newRecurring.length+plan.updRecurring.length} recurring`);
  };
  reader.readAsText(file);
}

function enterBatchSelect(){ state.batchSelectMode = true; state.selectedTaskIds = new Set(); renderMain(); }
function exitBatchSelect(){ state.batchSelectMode = false; state.selectedTaskIds = new Set(); renderMain(); }
function toggleTaskSelected(taskId){

function renderBatchBar(tab, selCount){

      <select id="batch_silo"><option value="">Silo: no change</option>${state.settings.silos.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select>
      <select id="batch_priority"><option value="">Priority: no change</option>${PRIORITIES.map(p=>`<option value="${p}">${p}</option>`).join('')}</select>

async function applyBatchEdit(tab){
  const location = document.getElementById('batch_location').value;
  const silo = document.getElementById('batch_silo').value;
  const priority = document.getElementById('batch_priority').value;
  const dueEnabled = tab==='oneTime' && document.getElementById('batch_due_enable').checked;
  const due = dueEnabled ? document.getElementById('batch_due').value : null;

  if(!location && !silo && !priority && !dueEnabled){ showToast('Pick at least one field to change'); return; }

  const list = tab==='oneTime' ? state.tasks.oneTime : state.tasks.recurring;
  let count = 0;
  list.forEach(t=>{
    if(!state.selectedTaskIds.has(t.id)) return;
    if(location) t.location = location;
    if(silo) t.silo = silo;
    if(priority) t.priority = priority;
    if(dueEnabled && due){
      if(!t.dueHistory) t.dueHistory = [];
      if(t.due && t.due !== due) t.dueHistory.push(t.due);
      t.due = due;
    }
    count++;
  });
  await saveTasks();
  exitBatchSelect();
  renderMain();
  showToast(`Updated ${count} task${count===1?'':'s'}`);
}

// Returns the actual task objects due on a date, split into recurring vs
// one-time (overdue one-time tasks still pile onto today's box instead of
// their original date, matching the Dashboard/Overdue behavior).
function getTasksForDateSplit(dateStr){
  const today = todayStr();
  const oneTime = [];
  state.tasks.oneTime.forEach(t=>{
    if(t.due === dateStr){
      if(!t.done && dateStr < today) return;
      oneTime.push(t);
    }
  });
  if(dateStr === today){
    getOverdueOneTime().forEach(t=> oneTime.push(t));
  }
  const recurring = [];
  state.tasks.recurring.forEach(t=>{ if(isEffectivelyDueOn(t, dateStr)) recurring.push(t); });
  return { recurring, oneTime };
}

// Shared by Week and Calendar (each keeps its own independent filter state,
// but the matching logic itself is identical). "Daily" means a recurring
// task whose recurrence type is exactly 'Daily' — one-time tasks are never
// considered daily, so hideDaily never touches them.
function taskMatchesPageFilter(task, kind, filter, dateStr){
  if(!filter) return true;
  if(filter.hideDaily && kind==='recurring' && task.type==='Daily') return false;
  // Frequency is multi-select (array) — empty array means no filter applied.
  // Only makes sense for recurring tasks (one-time tasks have no
  // recurrence type) — one-time tasks pass through untouched, same
  // treatment as hideDaily.
  if(filter.frequency && filter.frequency.length && kind==='recurring' && !filter.frequency.includes(task.type)) return false;
  if(filter.silo && filter.silo!=='All' && task.silo!==filter.silo) return false;
  if(filter.location && filter.location!=='All' && taskLocationFor(task, dateStr)!==filter.location) return false;
  if(filter.priority && filter.priority!=='All' && task.priority!==filter.priority) return false;
  return true;
}

          ${RECUR_TYPES.map(rt=>`

              ${escapeHtml(rt)}
            </label>
          `).join('')}
          <button type="button" class="btn ghost sm" style="margin-top:6px; width:100%;" onclick="clearFrequencyFilter('${pageKey}')">Clear (show all)</button>
        </div>
      </div>
      <select onchange="${setFn}('silo', this.value)" style="padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; background:var(--paper); color:var(--ink);">
        <option value="All" ${filter.silo==='All'?'selected':''}>Type: All</option>
        ${state.settings.silos.map(s=>`<option value="${escapeHtml(s)}" ${filter.silo===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
      </select>
      <select onchange="${setFn}('location', this.value)" style="padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; background:var(--paper); color:var(--ink);">
        <option value="All" ${filter.location==='All'?'selected':''}>Location: All</option>
        ${state.settings.locations.map(l=>`<option value="${escapeHtml(l)}" ${filter.location===l?'selected':''}>${escapeHtml(l)}</option>`).join('')}
      </select>
      <select onchange="${setFn}('priority', this.value)" style="padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; background:var(--paper); color:var(--ink);">
        <option value="All" ${filter.priority==='All'?'selected':''}>Priority: All</option>
        ${PRIORITIES.map(p=>`<option value="${p}" ${filter.priority===p?'selected':''}>${p}</option>`).join('')}
      </select>
      <button class="btn secondary sm" onclick="${saveFn}()">Save as View</button>
      ${presets.length ? `
        <span style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-left:4px;">
          ${presets.map(p=>`
            <span class="chip-select" style="display:inline-flex;">
              <button onclick="${applyFn}('${p.id}')" title="Apply this view">${escapeHtml(p.name)}</button>
              <button onclick="${deleteFn}('${p.id}')" title="Delete this view" style="padding:0 8px;">✕</button>
            </span>
          `).join('')}
        </span>
      ` : ''}
    </div>
  `;
}
function setWeekFilterField(field, value){
  state.weekFilter[field] = value;
  renderMain();
}
function setCalendarFilterField(field, value){
  state.calendarFilter[field] = value;
  renderMain();
}
function getPageFilter(pageKey){
  return pageKey==='week' ? state.weekFilter : state.calendarFilter;
}
function toggleFreqDropdown(pageKey){
  const panel = document.getElementById(`${pageKey}FreqDropdownPanel`);
  if(!panel) return;
  const willOpen = panel.style.display !== 'block';
  document.querySelectorAll('.freq-dropdown-panel').forEach(p=> p.style.display='none');
  panel.style.display = willOpen ? 'block' : 'none';
}
function toggleFrequencyOption(pageKey, type, checked){
  const filter = getPageFilter(pageKey);
  if(!Array.isArray(filter.frequency)) filter.frequency = [];
  if(checked){
    if(!filter.frequency.includes(type)) filter.frequency.push(type);
  } else {
    filter.frequency = filter.frequency.filter(t=>t!==type);
  }
  renderMain();
  // renderMain() rebuilds the filter bar with the panel closed by default —
  // reopen it right after so checking multiple boxes in a row doesn't
  // require re-clicking the dropdown button each time.
  setTimeout(()=>{ const panel = document.getElementById(`${pageKey}FreqDropdownPanel`); if(panel) panel.style.display='block'; }, 0);
}
function clearFrequencyFilter(pageKey){
  getPageFilter(pageKey).frequency = [];
  renderMain();
  setTimeout(()=>{ const panel = document.getElementById(`${pageKey}FreqDropdownPanel`); if(panel) panel.style.display='block'; }, 0);

document.addEventListener('click', (e)=>{
  if(e.target.closest('.freq-multiselect')) return;
  document.querySelectorAll('.freq-dropdown-panel').forEach(p=> p.style.display='none');
});
// Frequency used to be a single string ('All' or one RECUR_TYPES value)
// before it became multi-select — normalize any older saved preset (or
// hand-edited Supabase row) into the current array format rather than
// letting a stray string break .length/.includes() checks.
function normalizeFilterFrequency(filter){
  if(!Array.isArray(filter.frequency)){
    filter.frequency = (typeof filter.frequency === 'string' && filter.frequency !== 'All') ? [filter.frequency] : [];
  }
  return filter;
}

function calDotColor(task, kind, dateStr){
  const mode = state.calColorMode || 'location';
  if(mode === 'location') return locationColor(taskLocationFor(task, dateStr));
  if(mode === 'silo') return siloColor(task.silo);
  // 'recurType': only meaningful for recurring tasks; one-time tasks get a
  // fixed neutral marker matching the deep-red One-Time pill used elsewhere
  return kind === 'recurring' ? recurTypeColor(task.type) : 'var(--flag)';
}
function calDotLabel(task, kind, dateStr){
  const mode = state.calColorMode || 'location';
  const attr = mode === 'location' ? taskLocationFor(task, dateStr) : mode === 'silo' ? task.silo : (kind==='recurring' ? task.type : 'One-Time');
  return `${task.name} — ${attr}`;
}
function setCalColorMode(mode){
  state.calColorMode = mode;
  renderMain();
}
async function toggleWeekendDay(day){
  const arr = state.settings.weekendDays;
  const idx = arr.indexOf(day);
  if(idx === -1) arr.push(day); else arr.splice(idx,1);
  await saveSettings();
  renderMain();
}

/* ---------- Week view: one column per day, actual task names (not just dot counts) ---------- */
function startOfWeek(dateStr){
  const dow = parseDate(dateStr).getDay(); // 0=Sun
  return addDays(dateStr, -dow);
}
function ensureWeekCursor(){
  if(!state.weekCursorDate) state.weekCursorDate = startOfWeek(todayStr());
}
function shiftWeek(delta){
  ensureWeekCursor();
  state.weekCursorDate = addDays(state.weekCursorDate, delta*7);
  renderMain();
}
function jumpToThisWeek(){
  state.weekCursorDate = startOfWeek(todayStr());
  renderMain();
}
function renderWeekView(){
  ensureWeekCursor();
  const start = state.weekCursorDate;
  const days = [];
  for(let i=0;i<7;i++) days.push(addDays(start, i));
  const weekendDays = state.settings.weekendDays || [];
  const today = todayStr();
  const filter = state.weekFilter;

  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Week</h1>
        <div class="page-sub">${fullDate(days[0])} – ${fullDate(days[6])}</div>
      </div>
    </div>
    <div class="filter-bar">
      <button class="btn ghost sm" onclick="shiftWeek(-1)">← Prev Week</button>
      <button class="btn ghost sm" onclick="jumpToThisWeek()">↺ This Week</button>
      <button class="btn ghost sm" onclick="shiftWeek(1)">Next Week →</button>
    </div>
    ${renderPageFilterBar('week', filter, state.settings.weekViewPresets||[])}
    <div class="week-grid">
      ${days.map(d=>{
        const dow = parseDate(d).getDay();
        const isWeekend = weekendDays.includes(DOW_ABBR[dow]);
        const isToday = d === today;
        const { recurring, oneTime } = getTasksForDateSplit(d);
        const items = [
          ...recurring.map(t=>({ t, kind:'recurring', done: isCompletedOn(t.id, d) })),
          ...oneTime.map(t=>({ t, kind:'oneTime', done: !!t.done })),
        ].filter(({t,kind})=> taskMatchesPageFilter(t, kind, filter, d));
        return `
          <div class="week-day-col ${isToday?'today':''} ${isWeekend?'weekend':''}">
            <div class="week-day-head" onclick="jumpToDate('${d}')" title="Open in Dashboard">
              <span class="week-day-name">${DOW_ABBR[dow]}</span>
              <span class="week-day-num">${parseDate(d).getDate()}</span>
            </div>
            <div class="week-day-tasks">
              ${items.length ? items.map(({t,kind,done})=>`
                <div class="week-task-chip ${done?'done':''}" style="border-left-color:${calDotColor(t,kind,d)};" onclick="jumpToDate('${d}')" title="${escapeHtml(calDotLabel(t,kind,d))}">${escapeHtml(t.name)}</div>
              `).join('') : `<div class="page-sub" style="padding:4px 0; font-size:11px;">—</div>`}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function calLegendItems(){
  const mode = state.calColorMode || 'location';
  if(mode === 'location') return state.settings.locations.map(l=>[l, locationColor(l)]);
  if(mode === 'silo') return state.settings.silos.map(s=>[s, siloColor(s)]);
  return RECUR_TYPES.map(t=>[t, recurTypeColor(t)]).concat([['One-Time', 'var(--flag)']]);
}

function renderCalendarView(){
  if(!state.calMonthCursor){
    const t = parseDate(todayStr());
    state.calMonthCursor = { year: t.getFullYear(), month: t.getMonth() };
  }
  if(!state.calColorMode) state.calColorMode = 'location';
  const { year, month } = state.calMonthCursor;
  const firstOfMonth = new Date(year, month, 1);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const weekendDays = state.settings.weekendDays || [];
  const MAX_CHIPS_PER_CELL = 4;
  const filter = state.calendarFilter;

  const taskChipsHtml = (tasks, kind, dateStr)=>{
    if(!tasks.length) return '';
    const shown = tasks.slice(0, MAX_CHIPS_PER_CELL);
    const extra = tasks.length - shown.length;
    return `<div class="cal-cell-chip-list">
      ${shown.map(t=>`<div class="cal-task-chip" style="border-left-color:${calDotColor(t,kind,dateStr)};" title="${escapeHtml(calDotLabel(t,kind,dateStr))}" onclick="event.stopPropagation(); openTaskModal('${kind}','${t.id}');">${escapeHtml(t.name)}</div>`).join('')}
      ${extra>0 ? `<div class="cal-task-chip-extra">+${extra} more</div>` : ''}
    </div>`;
  };

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const { recurring: recurringRaw, oneTime: oneTimeRaw } = getTasksForDateSplit(dateStr);
    const recurring = recurringRaw.filter(t=> taskMatchesPageFilter(t, 'recurring', filter, dateStr));
    const oneTime = oneTimeRaw.filter(t=> taskMatchesPageFilter(t, 'oneTime', filter, dateStr));
    const isToday = dateStr === todayStr();
    const dow = new Date(year, month, day).getDay();
    const isWeekend = weekendDays.includes(DOW_ABBR[dow]);
    const total = recurring.length + oneTime.length;
    cells += `
      <div class="cal-cell ${isToday?'today':''} ${isWeekend?'weekend':''}" onclick="jumpToDate('${dateStr}')">
        <div class="cal-cell-top">
          <span class="date-num">${day}</span>
          ${total>0 ? `<span class="density-count">${total}</span>` : ''}
        </div>
        <div class="cal-cell-tasks">
          ${taskChipsHtml(recurring, 'recurring', dateStr)}
          ${recurring.length && oneTime.length ? `<div class="cal-cell-sep"></div>` : ''}
          ${taskChipsHtml(oneTime, 'oneTime', dateStr)}
        </div>
      </div>`;
  }

  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Calendar</h1>
        <div class="page-sub">Recurring tasks on top, one-time below — click a day to jump to Dashboard. Weekend days are set in Settings.</div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="chip-select">
        <button class="${state.calColorMode==='location'?'active':''}" onclick="setCalColorMode('location')">By Location</button>
        <button class="${state.calColorMode==='silo'?'active':''}" onclick="setCalColorMode('silo')">By Silo</button>
        <button class="${state.calColorMode==='recurType'?'active':''}" onclick="setCalColorMode('recurType')">By Recurrence Type</button>
      </div>
    </div>
    ${renderPageFilterBar('calendar', filter, state.settings.calendarViewPresets||[])}

    <div class="cal-legend">
      ${calLegendItems().map(([label,color])=>`<span class="cal-legend-item"><span class="cal-legend-dot" style="background:${color};"></span>${escapeHtml(label)}</span>`).join('')}
      <span class="cal-legend-item" style="margin-left:auto;"><span class="cal-legend-dot" style="background:color-mix(in srgb, var(--brass) 8%, var(--paper-raised)); border:1px solid var(--line);"></span>Weekend</span>
    </div>

    <div class="card" style="padding:20px;">
      <div class="cal-header">
        <button class="btn secondary sm" onclick="shiftMonth(-1)">← Prev</button>
        <h2>${MONTH_NAMES[month]} ${year}</h2>
        <button class="btn secondary sm" onclick="shiftMonth(1)">Next →</button>
        <button class="btn ghost sm" onclick="goToCurrentMonth()">Today</button>
      </div>
      <div class="cal-grid">
        ${DOW_ABBR.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `;
}
function shiftMonth(delta){
  let { year, month } = state.calMonthCursor;
  month += delta;
  if(month < 0){ month = 11; year--; }
  if(month > 11){ month = 0; year++; }
  state.calMonthCursor = { year, month };
  renderMain();
}
function goToCurrentMonth(){
  const t = parseDate(todayStr());
  state.calMonthCursor = { year: t.getFullYear(), month: t.getMonth() };
  renderMain();
}
function jumpToDate(dateStr){
  state.selectedDate = dateStr;
  state.dashboardFilter = 'Today';
  state.view = 'dashboard';
  renderMain();
  updateNavActiveState();
  updateNavBadges();
}

/* =========================================================
   RENDER: LISTS VIEW

if(!state.selectedListId && state.lists.length) state.selectedListId = state.lists[0].id;

let listItemDragFromIndex = null;
let listItemDragListId = null;
function onListItemDragStart(e, listId){
  listItemDragFromIndex = Number(e.currentTarget.dataset.index);
  listItemDragListId = listId;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onListItemDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
async function onListItemDragDrop(e, listId){
  e.preventDefault();
  if(listItemDragListId !== listId) return; // dragged from a different list somehow — ignore
  const toIndex = Number(e.currentTarget.dataset.index);
  if(listItemDragFromIndex === null || listItemDragFromIndex === toIndex) return;
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const [moved] = list.items.splice(listItemDragFromIndex, 1);
  list.items.splice(toIndex, 0, moved);
  _justReorderedListId = listId;
  await saveLists();
  renderMain();
  _justReorderedListId = null;
}
function onListItemDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  listItemDragFromIndex = null;
  listItemDragListId = null;

async function deleteListItem(listId, itemId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const item = list.items.find(i=>i.id===itemId);
  if(!item) return;
  // Play a quick fade/collapse on the actual row first, so deleting always
  // feels immediate — the background sync call below can take a moment on
  // a slow connection, but the UI never waits on it.
  const rowEl = document.querySelector(`.notebook-line[data-item-id="${itemId}"]`);
  if(rowEl){
    rowEl.classList.add('removing');
    await new Promise(r=> setTimeout(r, 160));

  diagLogEvent('activity', `Deleted list item "${item.text}"`, { listId, itemId });
  list.items = list.items.filter(i=>i.id!==itemId);
  await saveLists();
  renderMain(); // instant — does not wait on the sync call below
  if(syncConfigured()){
    enqueueSync(()=> runSyncSteps([
      ()=> supaDeleteMatch('list_items', `id=eq.${encodeURIComponent(itemId)}`),
    ])).catch(e=> console.error('list item delete sync failed', e));

/* Copies straight to the clipboard on click — no popup in normal use.
   The popup is kept ONLY as a last-resort rescue: navigator.clipboard is
   unavailable on insecure origins and can be blocked outright, and silently
   doing nothing would lose the text with no way to get it back. Normal path
   never shows it. */
function exportListAsText(listId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const text = buildListExportText(list);
  copyTextToClipboard(text).then(okCopy=>{
    if(okCopy){
      diagLogEvent('activity', `Copied list "${list.title}" as text`);
      showToast(`"${list.title}" copied to clipboard`);
    } else {
      diagLogEvent('activity', `Clipboard blocked — fell back to popup for list "${list.title}"`);
      showListExportFallback(list, text);
    }
  });
}

/* Tries the async Clipboard API, then the legacy execCommand path (which
   still works in some contexts where the modern API is blocked). Resolves
   true/false rather than throwing, so callers always get an answer. */
function copyTextToClipboard(text){
  const legacy = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const okExec = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      return !!okExec;
    } catch(e){ return false; }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true, ()=> legacy());
  }
  return Promise.resolve(legacy());
}

function showListExportFallback(list, text){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'listExportOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `

  `;
  document.body.appendChild(overlay);

}

const CORE_METRIC_DEFAULTS = [
  { id:'core_weight', name:'Weight', type:'number', unit:'kg', field:'weight' },
  { id:'core_water', name:'Water Intake', type:'number', unit:'ml', field:'water' },

function coreFieldFor(metricId){
  const d = CORE_METRIC_DEFAULTS.find(x=>x.id===metricId);
  return d ? d.field : null;
}
// Seeds the 4 original fields as regular metric definitions — but only ONCE,
// ever, tracked by a persisted flag. Without this guard, deleting a core
// metric would just get it silently re-added the next time this runs (e.g.
// on the next page render), since it'd still look "missing".
const HYDRATION_ICON_CHOICES = [
  // Water & plain
  '💧','🥛','🍶','🧴','🚰','🫗',
  // Coffee & hot drinks
  '☕','🍵','🫖','🧋',
  // Cold, juice & soft drinks
  '🥤','🧃','🍹','🍸','🥥','🍋','🍊','🍓',
  // Ice & chilled
  '🧊','❄️',
  // Sport / energy / other
  '⚡','🏺','🍯','🥂',
];
function ensureHydrationDefaults(){
  if(!state.settings.hydrationDefaultsSeeded){
    if(!state.settings.hydrationContainers.length){
      state.settings.hydrationContainers = [
        { id:'cont_glass', name:'Glass', icon:'🥛' },
        { id:'cont_bottle_s', name:'Small Bottle', icon:'🍶' },

}
function ensureCoreMetricDefs(){
  if(!state.settings.healthCoreMetricsSeeded){
    CORE_METRIC_DEFAULTS.forEach((def, i)=>{
      if(!state.healthMetricDefs.find(m=>m.id===def.id)){
        state.healthMetricDefs.unshift({ id:def.id, name:def.name, type:def.type, unit:def.unit, core:true, visible:true, sortOrder:i-100 });
      }

// container can record 330ml once and 660ml the next time. Each hydration_logs
// row already carried its own `ml` column, so this needed no schema change —
// and existing logs keep whatever amount they were recorded with.
async function logHydration(date, containerId, ml){
  const container = state.settings.hydrationContainers.find(c=>c.id===containerId);
  if(!container) return;
  const amount = Math.round(Number(ml));
  if(!isFinite(amount) || amount <= 0){ showToast('Enter an amount in ml'); return; }
  if(amount > 20000){ showToast('That looks too large — check the amount'); return; }
  state.hydrationLogs.push({ id:newId('hyd'), date, containerId, ml:amount, loggedAt:new Date().toISOString() });
  await saveHydration();
  renderMain();
  showToast(`Logged ${amount}ml — ${container.name}`);
}

// The daily log now shows one consolidated line per container (e.g. "Glass
// ×5") instead of 5 separate lines — this removes just the most recently
// logged occurrence in that group, decrementing the count by one, rather
// than clearing the whole group at once.
async function deleteHydrationLogOccurrence(date, containerId){
  const matches = state.hydrationLogs.filter(l=>l.date===date && l.containerId===containerId);
  if(!matches.length) return;

  await deleteHydrationLog(mostRecent.id);
}

function renderHydrationBottleSvg(pct){
  const clamped = Math.max(0, Math.min(100, pct));
  const bottleTop = 10, bottleBottom = 195, bottleHeight = bottleBottom - bottleTop;
  const fillHeight = (clamped/100) * bottleHeight;
  const fillY = bottleBottom - fillHeight;
  const bottlePath = 'M45,10 L75,10 L75,30 Q95,40 95,70 L95,180 Q95,195 80,195 L40,195 Q25,195 25,180 L25,70 Q25,40 45,30 Z';
  return `
    <svg viewBox="0 0 120 205" width="110" height="188" style="flex-shrink:0;">
      <defs><clipPath id="hydBottleClip"><path d="${bottlePath}"/></clipPath></defs>
      <rect x="20" y="${fillY}" width="80" height="${fillHeight}" fill="var(--teal)" clip-path="url(#hydBottleClip)" style="transition: y 0.5s ease, height 0.5s ease;"/>
      <path d="${bottlePath}" fill="none" stroke="var(--line)" stroke-width="3"/>
      <text x="60" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)" font-family="var(--font-display)">${Math.round(clamped)}%</text>
    </svg>
  `;
}

  } else if(m.type === 'yesno'){
    inputHtml = `
      <div class="toggle-yn">

      </div>`;
  } else {
    inputHtml = `<input type="text" value="${escapeHtml(val||'')}" placeholder="—" onchange="setMetricValue('${m.id}', this.value)">`;

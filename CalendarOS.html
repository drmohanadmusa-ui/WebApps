async function renameTag(field, oldValue){
  const newValue = prompt(`Rename "${oldValue}" to:`, oldValue);
  if(!newValue || !newValue.trim() || newValue.trim() === oldValue) return;
  const trimmed = newValue.trim();
  const idx = state.settings[field].indexOf(oldValue);
  if(idx === -1) return;
  state.settings[field][idx] = trimmed;

  // cascade the rename across every task that referenced the old value
  const taskField = field === 'locations' ? 'location' : 'silo';
  state.tasks.oneTime.forEach(t=>{ if(t[taskField] === oldValue) t[taskField] = trimmed; });
  state.tasks.recurring.forEach(t=>{ if(t[taskField] === oldValue) t[taskField] = trimmed; });

  await saveSettings();
  await saveTasks();
  renderMain();
  showToast(`Renamed to "${trimmed}" — updated on all matching tasks`);
}

async function connectSync(){
  const url = document.getElementById('syncUrl').value.trim();
  const anonKey = document.getElementById('syncKey').value.trim();
  const pin = document.getElementById('syncPin').value.trim();
  if(!url || !anonKey || !pin){ showToast('Fill in URL, key, and PIN'); return; }
  try{
    await testSupabaseConnection(url, anonKey, pin);
  } catch(e){
    console.error(e);
    showToast('Could not connect — check URL/key and that you ran the SQL');
    return;
  }
  state.settings.sync = { url, anonKey, pin };
  await window.storage.set(STORAGE_KEYS.SETTINGS, JSON.stringify(state.settings), false);
  state.syncMeta.status = 'syncing';
  state.initialSyncBlocking = true;
  renderSyncBlockOverlay();
  updateSyncBadge();

  // reconcile: remote wins if it already has rows, otherwise push what we have now
  try{
    await pullFromSupabase((cur,total)=>{
      state.syncMeta.progress = { current: cur, total };
      setSyncBlockText(`Syncing… ${Math.round((cur/total)*100)}%`);
      updateSyncBadge();
      renderMain();
    });
    await markSyncSuccess();
  } catch(e){
    console.error(e);
    await markSyncError(e.message||String(e));
    state.initialSyncBlocking = false;
    renderSyncBlockOverlay();
    updateSyncBadge();
    showToast('Connected, but initial sync failed — check the console');
    renderMain();
    return;
  }
  state.initialSyncBlocking = false;
  renderSyncBlockOverlay();
  updateSyncBadge();
  renderMain();
  showToast('Connected — synced across devices');
}

async function disconnectSync(){
  if(!confirm('Disconnect sync? This device will keep its local copy of your data, but will stop mirroring to Supabase.')) return;
  state.settings.sync = null;
  await saveSettings();
  state.syncMeta = { status: 'off', dirty: false, lastSyncedAt: null, lastError: null };
  try{ await window.storage.set(STORAGE_KEYS.SYNC_META, JSON.stringify(state.syncMeta), false); } catch(e){}
  renderMain();
  showToast('Sync disconnected');
}

      <button type="button" class="quick-date-btn" onclick="setQuickDate('${inputId}','plus7')">In 7 days</button>
      <button type="button" class="quick-date-btn" onclick="setQuickDate('${inputId}','nextSunday')">Next Sunday</button>
      <button type="button" class="quick-date-btn" onclick="setQuickDate('${inputId}','nextMonth1st')">1st of next month</button>
    </div>
  `;
}
function setQuickDate(inputId, preset){
  const today = todayStr();
  let result;
  if(preset === 'tomorrow') result = addDays(today, 1);
  else if(preset === 'plus3') result = addDays(today, 3);
  else if(preset === 'plus7') result = addDays(today, 7);
  else if(preset === 'nextSunday'){
    const d = parseDate(today);
    let daysUntilSunday = (7 - d.getDay()) % 7;
    if(daysUntilSunday === 0) daysUntilSunday = 7; // "next" Sunday, not today even if today is Sunday
    result = addDays(today, daysUntilSunday);
  } else if(preset === 'nextMonth1st'){
    const d = parseDate(today);
    const y = d.getMonth()===11 ? d.getFullYear()+1 : d.getFullYear();
    const m = d.getMonth()===11 ? 0 : d.getMonth()+1;
    result = `${y}-${String(m+1).padStart(2,'0')}-01`;
  }
  const input = document.getElementById(inputId);
  if(input) input.value = result;
}

   ========================================================= */
function computeNewDaySummary(last){
  const dueOneTime = state.tasks.oneTime.filter(t=>t.due === last);
  const doneOneTime = dueOneTime.filter(t=>t.done).length;

  const dueRecurring = state.tasks.recurring.filter(t=>isEffectivelyDueOn(t, last));
  const doneRecurring = dueRecurring.filter(t=>isCompletedOn(t.id, last)).length;
  const missedRecurring = dueRecurring.filter(t=>isMissedOn(t.id, last)).length;

  // one-time tasks that were ALREADY overdue before `last`, but got cleared on that specific day
  const overdueCleared = state.tasks.oneTime.filter(t=> t.done && t.doneDate === last && t.due && t.due < last).length;

  const done = doneOneTime + doneRecurring;
  const total = dueOneTime.length + (dueRecurring.length - missedRecurring);
  const rating = total > 0 ? Math.round((done/total)*100) : null;

  const hydrationTotal = getHydrationTotalForDate(last);
  const hydrationGoal = state.settings.hydrationGoalMl || 2500;

  return { dueOneTime: dueOneTime.length, doneOneTime, dueRecurring: dueRecurring.length, doneRecurring, overdueCleared, done, total, rating, hydrationTotal, hydrationGoal };
}

// Review list for the New Day screen: everything currently overdue (one-time),
// plus recurring tasks that were due specifically on the previous day and
// still haven't been resolved either way.
function getNewDayReviewRows(last){
  const rows = [];
  getOverdueOneTime().forEach(t=> rows.push({ kind:'oneTime', task:t, dueOn:t.due, overdue:true }));
  state.tasks.recurring.forEach(t=>{
    if(isEffectivelyDueOn(t, last) && !getOccurrence(t.id, last)){
      rows.push({ kind:'recurring', task:t, dueOn:last, overdue:false });
    }
  });
  return rows;
}

/* =========================================================
   LOCAL vs ONLINE DIVERGENCE PROMPT

   When the copy on this device and the copy in Supabase disagree in a way
   that actually matters, do NOT quietly pick a winner. Show exactly what
   differs and let the person decide. Silent resolution is precisely how
   completed tasks reverted to pending and lists lost their folder
   assignments without anyone noticing at the time.

   Deliberate design choices:
   - Silent when the two copies agree (the overwhelmingly common case).
   - Whole-app choice, but itemised, so the decision is informed.
   - Dismissing / closing keeps ONLINE, because Supabase is the shared
     source of truth and is the safer default of the two.
   ========================================================= */
function countCompletions(completions){
  let n = 0;
  Object.values(completions||{}).forEach(byDate=>{ n += Object.keys(byDate||{}).length; });
  return n;
}
// Task-level granularity: for a recurring task, "differs" means its whole
// completions map differs from what's online — not individual completion
// dates. Every item defaults to choice:'online' (the safe default — the
// pull has already applied it, so "online" requires no further action;
// only items explicitly switched to 'local' get restored on Apply).
//
// IMPORTANT: comparisons below deliberately ignore metadata that can differ
// in REPRESENTATION without the underlying data actually differing — e.g.
// loggedAt timestamps come back from Supabase's timestamptz serialization in
// a different string format than what gets written locally via
// toISOString(), even for the exact same instant. A prior version compared
// raw JSON.stringify() of the whole completion record (which also depends on
// key order), and that produced false positives on effectively every
// recurring task — reported directly: a person saw "Local: 28 completion
// records / Online: 28 completion records" flagged as differing, for
// basically every task in their list. Only STATUS per date is compared now,
// since that's the only part that's actually substantive to reconcile.
function completionsSignature(comp){
  return Object.keys(comp||{}).sort().map(d=>`${d}:${(comp[d]&&comp[d].status)||''}`).join('|');
}
/* Treats null, undefined and '' as the same absence of a value.

   This matters because the two sides arrive by different routes. The local
   snapshot goes through JSON.parse(JSON.stringify(...)), which DELETES keys
   whose value is undefined, while Supabase returns an explicit null for an
   empty column. A task with no doneDate therefore compared as undefined vs
   null and was reported as a disagreement — with both summaries reading
   identically, because the summary line only shows done state and due date.
   That produced a prompt with no visible difference and no way to act on it
   sensibly. Same class of false positive as the 4.25.1 fix: comparing
   representation instead of meaning. */
function sameValue(a, b){
  const norm = (v)=> (v === undefined || v === null || v === '') ? null : v;
  return norm(a) === norm(b);
}

/* Returns the fields that genuinely differ, with display values. Used both to
   decide whether to prompt at all and to SAY what differs — a prompt you
   cannot see the reason for is worse than no prompt, because there is no
   basis on which to choose. */
function fieldDiffs(l, r, fields){
  const out = [];
  fields.forEach(([key, label, fmt])=>{
    const lv = l ? l[key] : undefined;
    const rv = r ? r[key] : undefined;
    if(sameValue(lv, rv)) return;
    const show = (v)=> (v === undefined || v === null || v === '') ? '(none)' : (fmt ? fmt(v) : String(v));
    out.push({ key, label, local: show(lv), online: show(rv) });
  });
  return out;
}

function detectDivergence(local, remote, snapshot){
  const taskItems = [];

  const localOTById = {}; (local.oneTime||[]).forEach(t=>{ localOTById[t.id]=t; });
  const remoteOTById = {}; (remote.oneTime||[]).forEach(t=>{ remoteOTById[t.id]=t; });
  new Set([...Object.keys(localOTById), ...Object.keys(remoteOTById)]).forEach(id=>{
    const l = localOTById[id], r = remoteOTById[id];
    const diffs = (l && r) ? fieldDiffs(l, r, [
      ['done', 'Status', v=> v ? 'Done' : 'Not done'],
      ['doneDate', 'Completed on', v=> humanDate(v)],
      ['due', 'Due', v=> humanDate(v)],
      ['name', 'Name'],
    ]) : [];
    // Only a missing side, or a REAL field difference, is worth asking about.
    const differs = !l || !r || diffs.length > 0;
    if(!differs) return;
    const summarise = (t)=> `${t.done?'Done':'Not done'}${t.due?` · due ${humanDate(t.due)}`:''}`;
    taskItems.push({
      id, kind:'oneTime',
      name: (r&&r.name) || (l&&l.name) || '(unnamed task)',
      localSummary: l ? summarise(l) : 'Does not exist on this device',
      onlineSummary: r ? summarise(r) : 'Does not exist online',
      diffs,
      choice: 'online',
    });
  });

  const localRecById = {}; (local.recurring||[]).forEach(t=>{ localRecById[t.id]=t; });
  const remoteRecById = {}; (remote.recurring||[]).forEach(t=>{ remoteRecById[t.id]=t; });
  new Set([...Object.keys(localRecById), ...Object.keys(remoteRecById)]).forEach(id=>{
    const l = localRecById[id], r = remoteRecById[id];
    const lComp = (local.completions&&local.completions[id]) || {};
    const rComp = (remote.completions&&remote.completions[id]) || {};
    const differs = !l || !r || completionsSignature(lComp)!==completionsSignature(rComp);
    if(!differs) return;
    const lCount = Object.keys(lComp).length, rCount = Object.keys(rComp).length;
    taskItems.push({
      id, kind:'recurring',
      name: (r&&r.name) || (l&&l.name) || '(unnamed task)',
      localSummary: l ? `${lCount} completion record${lCount===1?'':'s'}` : 'Does not exist on this device',
      onlineSummary: r ? `${rCount} completion record${rCount===1?'':'s'}` : 'Does not exist online',
      choice: 'online',
    });
  });

  const listItems = [];
  const localListsById = {}; (local.lists||[]).forEach(l=>{ localListsById[l.id]=l; });
  const remoteListsById = {}; (remote.lists||[]).forEach(l=>{ remoteListsById[l.id]=l; });
  new Set([...Object.keys(localListsById), ...Object.keys(remoteListsById)]).forEach(id=>{
    const l = localListsById[id], r = remoteListsById[id];
    // Items sorted by id before joining — same false-positive risk as above
    // if local vs remote item ARRAY ORDER differs even when the actual set
    // of items is identical.
    const sig = (x)=> x ? `${x.folder||''}|${(x.items||[]).slice().sort((a,b)=> a.id<b.id?-1:1).map(i=>`${i.id}:${i.text}:${!!i.done}`).join(',')}` : null;
    const differs = !l || !r || sig(l)!==sig(r);
    if(!differs) return;
    listItems.push({
      id, kind:'list',
      name: (r&&r.title) || (l&&l.title) || '(unnamed list)',
      localSummary: l ? `Folder: ${l.folder||'None'} · ${(l.items||[]).length} item${(l.items||[]).length===1?'':'s'}` : 'Does not exist on this device',
      onlineSummary: r ? `Folder: ${r.folder||'None'} · ${(r.items||[]).length} item${(r.items||[]).length===1?'':'s'}` : 'Does not exist online',
      choice: 'online',
    });
  });

  if(!taskItems.length && !listItems.length) return null;
  return {
    categories: {
      tasks: { label:'Tasks', items:taskItems, expanded:false },
      lists: { label:'Lists', items:listItems, expanded:false },
    },
    snapshot,
  };
}

async function applyDivergenceChoices(){
  const d = pendingDivergence;
  pendingDivergence = null;
  const overlay = document.getElementById('divergenceOverlay');
  if(overlay) overlay.remove();
  // Resume on EVERY exit path, including this early one. If the deferred
  // review were skipped here it would be dropped for the launch all over
  // again — precisely the failure this release fixes.
  if(!d){ resumeDeferredNewDayReview(); return; }

  let touchedLocal = false;
  const localChoices = [];

  d.categories.tasks.items.forEach(item=>{
    if(item.choice !== 'local') return; // 'online' is already applied by the pull — nothing to do
    touchedLocal = true;
    localChoices.push(`${item.kind} task "${item.name}"`);
    if(item.kind === 'oneTime'){
      const snapT = d.snapshot.oneTime.find(t=>t.id===item.id);
      state.tasks.oneTime = state.tasks.oneTime.filter(t=>t.id!==item.id);
      if(snapT) state.tasks.oneTime.push(snapT); // omitted entirely if it never existed locally — correctly "undoes" an online-only add
    } else {
      const snapT = d.snapshot.recurring.find(t=>t.id===item.id);
      state.tasks.recurring = state.tasks.recurring.filter(t=>t.id!==item.id);
      if(snapT) state.tasks.recurring.push(snapT);
      // Task-level, not per-completion: the whole completions map for this
      // task id is replaced by the local snapshot's version.
      if(d.snapshot.completions[item.id]) state.tasks.completions[item.id] = d.snapshot.completions[item.id];
      else delete state.tasks.completions[item.id];
    }
  });

  d.categories.lists.items.forEach(item=>{
    if(item.choice !== 'local') return;
    touchedLocal = true;
    localChoices.push(`list "${item.name}"`);
    const snapL = d.snapshot.lists.find(l=>l.id===item.id);
    state.lists = state.lists.filter(l=>l.id!==item.id);
    if(snapL) state.lists.push(snapL);
  });

  if(touchedLocal){
    await saveTasks();
    await saveLists();
    diagLogEvent('sync', `Divergence resolved per-item: kept LOCAL for ${localChoices.length} item(s)`, { items: localChoices });
    if(syncConfigured()){
      try{
        await enqueueSync(()=> pushFullStateToSupabase());
        showToast(`${localChoices.length} local choice${localChoices.length===1?'':'s'} applied and pushed online`);
      } catch(e){
        showToast('⚠ Applied locally, but the push online failed — it will retry on the next sync');
      }
    } else {
      showToast(`${localChoices.length} local choice${localChoices.length===1?'':'s'} applied`);
    }
  } else {
    diagLogEvent('sync', 'Divergence resolved: kept ONLINE for everything');
    showToast('Online copy kept for everything');
  }
  renderMain();
  updateNavActiveState();
  updateNavBadges();

  resumeDeferredNewDayReview();
}

async function confirmNewDay(forDate){
  // Daily tasks left unresolved for the day that's ending get silently
  // recorded as missed (Daily deliberately never pins as a persistent
  // "Overdue" row — see getOverdueRecurring). Done before the rating is
  // computed so it's correctly excluded from that day's denominator instead
  // of counting as "not done".
  state.tasks.recurring.forEach(t=>{
    if(t.type === 'Daily' && isEffectivelyDueOn(t, forDate) && !getOccurrence(t.id, forDate)){
      setOccurrenceStatus(t.id, forDate, 'missed');
    }
  });

  const s = computeNewDaySummary(forDate);
  if(s.rating !== null){
    state.dailyRatings = state.dailyRatings.filter(r=>r.date!==forDate);
    state.dailyRatings.push({ date: forDate, rating: s.rating, doneCount: s.done, totalCount: s.total, overdueCleared: s.overdueCleared, loggedAt: new Date().toISOString() });
    await saveRatings();
  }
  newDayReviewDate = null;
  state.settings.lastActiveDate = todayStr();
  state.selectedDate = todayStr();
  await saveSettings();
  const overlay = document.getElementById('newDayOverlay');
  if(overlay) overlay.remove();
  render();
}

/* =========================================================
   PASSCODE GATE
   Blocks all app content — including Settings, seed data, everything —
   until the right passcode is entered. Re-asked on every load; nothing is
   ever remembered as "unlocked" between sessions.

   IMPORTANT (told to the person, not hidden): this is a static file with no
   server behind it. This gate deters casual viewing of a shared link; it is
   not real security against someone who deliberately inspects the page
   source. Real protection means controlling who can reach the URL at all.
   ========================================================= */
function gateEl(){ return document.getElementById('gateScreen'); }

// If "stay unlocked on this device" is on and the last successful unlock
// matches the CURRENT correct value, skip the gate entirely. If the PIN/
// passcode has since changed, this naturally stops matching and the gate
// reappears — no separate invalidation logic needed.
async function checkRememberedUnlock(stored){
  if(!stored || stored.rememberUnlock === false) return false;
  const correctValue = (stored.sync && stored.sync.pin) ? stored.sync.pin : (stored.localPasscode || null);
  if(!correctValue) return false;
  const unlockRes = await safeGet(STORAGE_KEYS.UNLOCK);
  if(!unlockRes) return false;
  try{
    const saved = JSON.parse(unlockRes.value);
    return saved && saved.value === correctValue;
  } catch(e){ return false; }
}
async function rememberThisUnlock(stored, correctValue){
  if(stored.rememberUnlock === false) return;
  try{ await window.storage.set(STORAGE_KEYS.UNLOCK, JSON.stringify({ value: correctValue }), false); } catch(e){}
}
async function forgetRememberedUnlock(){
  try{ await window.storage.delete(STORAGE_KEYS.UNLOCK, false); } catch(e){}
}

// The gate needs to write partial settings (just a pin, or just localPasscode)
// before the rest of the app has ever initialized full defaults. This
// guarantees whatever gets written is always a COMPLETE settings object —
// otherwise a fresh device's first write would omit locations/silos/etc,
// and every view that reads them would crash on next load.
function completeSettingsObject(partial){
  const base = Object.assign({
    locations: ['1.Office','2.Errand','3.Home','4.Madinah','5.Last'],
    silos: ['Financial','Work','Personal Tasks','Self Development','Career Development','Home Maintenance','Lamees'],
    lastActiveDate: todayStr(),
    sync: null,
  }, DEFAULT_SETTINGS_EXTRAS, partial||{});
  return base;
}

async function runPasscodeGate(){
  const settingsRes = await safeGet(STORAGE_KEYS.SETTINGS);
  const stored = settingsRes ? JSON.parse(settingsRes.value) : null;
  const knownPin = stored && stored.sync && stored.sync.pin ? stored.sync.pin : null;
  const knownLocalPasscode = stored && stored.localPasscode ? stored.localPasscode : null;

  if(await checkRememberedUnlock(stored)) return; // skip the gate entirely

  return new Promise(resolve=>{
    if(knownPin){
      renderPinGate(knownPin, resolve, stored);
    } else if(knownLocalPasscode){
      renderPinGate(knownLocalPasscode, resolve, stored);
    } else {
      renderSetupGate(resolve);
    }
  });
}

function renderPinGate(correctValue, resolve, stored){
  gateEl().innerHTML = `
    <div class="gate-screen">
      <div class="gate-card">
        <div class="gate-brand"><span class="brand-mark"></span>${APP_NAME}</div>
        <div class="gate-sub">Enter your passcode to continue.</div>
        <div class="gate-error" id="gateError">Incorrect passcode.</div>
        <div class="field">
          <input type="password" id="gatePasscodeInput" inputmode="numeric" placeholder="Passcode" autofocus>
        </div>
        <button class="btn brass" style="width:100%; justify-content:center;" onclick="submitPinGate()">Unlock</button>
        <button class="gate-link" onclick="forgotGatePasscode()">Forgot passcode?</button>
      </div>
    </div>
  `;
  window.__gateResolve = resolve;
  window.__gateCorrectValue = correctValue;
  window.__gateStored = stored;
  const input = document.getElementById('gatePasscodeInput');
  input.focus();
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitPinGate(); });
}
async function forgotGatePasscode(){
  const ok = confirm(
    "This clears this device's saved connection info (not your actual tasks) and returns you to setup.\n\n" +
    "If you were syncing with Supabase: your data is safe there — just reconnect with your URL, key, and PIN.\n" +
    "If you were in local-only mode: your local tasks stay on this device — you'll set a new passcode to get back in.\n\n" +
    "Continue?"
  );
  if(!ok) return;
  const settingsRes = await safeGet(STORAGE_KEYS.SETTINGS);
  const stored = completeSettingsObject(settingsRes ? JSON.parse(settingsRes.value) : {});
  stored.sync = null;
  stored.localPasscode = null;
  await window.storage.set(STORAGE_KEYS.SETTINGS, JSON.stringify(stored), false);
  await forgetRememberedUnlock();
  renderSetupGate(window.__gateResolve);
}
async function submitPinGate(){
  const val = document.getElementById('gatePasscodeInput').value;
  if(val === window.__gateCorrectValue){
    await rememberThisUnlock(window.__gateStored || {}, val);
    gateEl().innerHTML = '';
    window.__gateResolve();
  } else {
    document.getElementById('gateError').classList.add('show');
    const input = document.getElementById('gatePasscodeInput');
    input.value = '';
    input.focus();
  }
}

function renderSetupGate(resolve){
  gateEl().innerHTML = `
    <div class="gate-screen">
      <div class="gate-card wide">
        <div class="gate-brand"><span class="brand-mark"></span>${APP_NAME}</div>
        <div class="gate-sub">First time on this device. Connect to your existing Supabase sync to pull your data and set this device's passcode.</div>
        <div class="gate-error" id="gateError"></div>
        <div class="field"><label>Project URL</label><input type="text" id="gateUrl" placeholder="https://xxxxx.supabase.co"></div>
        <div class="field"><label>Anon / Public API Key</label><input type="text" id="gateKey" placeholder="eyJhbGciOi..."></div>
        <div class="field"><label>PIN</label><input type="password" id="gatePin" inputmode="numeric" placeholder="Your sync PIN"></div>
        <button class="btn brass" style="width:100%; justify-content:center;" onclick="submitSetupGate()">Connect &amp; Unlock</button>
        <div class="gate-divider">or</div>
        <button class="gate-link" onclick="showLocalOnlyGate()">Use this device without sync — set a local passcode instead</button>
      </div>
    </div>
  `;
  window.__gateResolve = resolve;
}
async function submitSetupGate(){
  const url = document.getElementById('gateUrl').value.trim();
  const anonKey = document.getElementById('gateKey').value.trim();
  const pin = document.getElementById('gatePin').value.trim();
  const errEl = document.getElementById('gateError');
  if(!url || !anonKey || !pin){ errEl.textContent = 'Fill in all three fields.'; errEl.classList.add('show'); return; }
  errEl.classList.remove('show');
  try{
    await testSupabaseConnection(url, anonKey, pin);
  } catch(e){
    errEl.textContent = 'Could not connect — check the URL and key.';
    errEl.classList.add('show');
    return;
  }
  // save just enough for loadAll() to pick up normally right after this
  const settingsRes = await safeGet(STORAGE_KEYS.SETTINGS);
  const stored = completeSettingsObject(settingsRes ? JSON.parse(settingsRes.value) : {});
  stored.sync = { url, anonKey, pin };
  await window.storage.set(STORAGE_KEYS.SETTINGS, JSON.stringify(stored), false);
  await rememberThisUnlock(stored, pin);
  gateEl().innerHTML = '';
  window.__gateResolve();
}
function showLocalOnlyGate(){
  gateEl().innerHTML = `
    <div class="gate-screen">
      <div class="gate-card">
        <div class="gate-brand"><span class="brand-mark"></span>${APP_NAME}</div>
        <div class="gate-sub">Set a passcode for this device. There's no recovery for this — if you forget it, the only way back in is resetting this device's local data.</div>
        <div class="gate-error" id="gateError">Enter at least 4 characters.</div>
        <div class="field"><label>New Passcode</label><input type="password" id="gateNewPasscode" inputmode="numeric" placeholder="Choose a passcode"></div>
        <button class="btn brass" style="width:100%; justify-content:center;" onclick="submitLocalPasscodeSetup()">Set Passcode &amp; Continue</button>
      </div>
    </div>
  `;
  document.getElementById('gateNewPasscode').focus();
}
async function submitLocalPasscodeSetup(){
  const val = document.getElementById('gateNewPasscode').value;
  if(!val || val.length < 4){ document.getElementById('gateError').classList.add('show'); return; }
  const settingsRes = await safeGet(STORAGE_KEYS.SETTINGS);
  const stored = completeSettingsObject(settingsRes ? JSON.parse(settingsRes.value) : {});
  stored.localPasscode = val;
  await window.storage.set(STORAGE_KEYS.SETTINGS, JSON.stringify(stored), false);
  await rememberThisUnlock(stored, val);
  gateEl().innerHTML = '';
  window.__gateResolve();
}

async function init(){
  diagLogEvent('app', `Starting — v${APP_VERSION}, storage: ${usingNativeAppStorage?'Claude':'browser'}`);
  await runPasscodeGate();
  await loadSettingsOnly(); // pick up anything the gate just wrote (pin/passcode), fully
  applyColorTheme(); // before the splash shows, so it reflects the chosen theme from the first frame
  document.getElementById('loadingScreen').classList.remove('hidden');
  state.splashActive = true;
  await loadAll(); // local data only now — fast, no network wait

  let bypassTimer = null;
  let offlineListener = null;
  const clearBypassWatchers = ()=>{
    if(bypassTimer){ clearTimeout(bypassTimer); bypassTimer = null; }
    if(offlineListener){ window.removeEventListener('offline', offlineListener); offlineListener = null; }
  };
  const revealApp = ()=>{
    if(!state.splashActive) return; // idempotent — only reveal once, whichever path gets there first
    state.splashActive = false;
    clearBypassWatchers();
    hideSplashBypassButton();
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
    setInterval(updateSyncBadge, 30000);
    startIdleWatch();
    if(!usingNativeAppStorage){
      setTimeout(()=> showToast('Running standalone — saving to this browser instead of Claude'), 700);
    }
    announceRestoredTrainingDrafts();
  };

  if(syncConfigured()){
    // The splash now covers the full wait — local load AND the initial
    // Supabase reconciliation — per request: no need to interact with the
    // app while it's loading. But a hung/very slow connection shouldn't
    // trap the person on a splash screen forever, so a bypass appears if
    // either: it's taken longer than 30s, or the browser reports no
    // internet connection at all (checked immediately, and again if
    // connectivity drops mid-wait — no need to sit through the full 30s
    // if we already know there's no network).
    let bypassShown = false;
    const maybeBypass = ()=>{ if(!bypassShown){ bypassShown = true; showSplashBypassButton(revealApp); } };
    bypassTimer = setTimeout(maybeBypass, 30000);
    if(navigator.onLine === false) maybeBypass(); // offline from the start — don't make them wait 30s to find out
    offlineListener = ()=> maybeBypass();
    window.addEventListener('offline', offlineListener);
    // runBackgroundSync() itself is unchanged — still resolves (success or
    // internally-handled failure) on its own, still drives the New Day
    // check on ITS OWN completion (not on bypass), preserving the existing
    // safety property that New Day review never shows before a real sync
    // attempt has actually resolved.
    // The .catch() here is a deliberate safety net: this chain previously
    // had none, so a single uncaught error anywhere in the sync path (any
    // future one, not just the one already fixed above) would silently
    // reject the whole chain and skip revealApp() entirely — stranding
    // someone on the splash screen with no way in except waiting for the
    // 30s bypass timer. Now, whatever happens, the app still opens.
    runBackgroundSync().then(()=>{
      revealApp();
    }).then(()=>{
      // Ordered BEFORE the New Day review deliberately: New Day marks
      // unresolved tasks as missed and writes that up to Supabase, so it must
      // never run against data the person hasn't confirmed is the right copy.
      // If a divergence prompt is showing, New Day waits until it's resolved.
      if(maybeShowDivergenceModal()){
        // Stand aside, but leave a note so resolution can pick this back up.
        // New Day writes 'missed' statuses up to Supabase, so it must never
        // run against data the person hasn't confirmed is the right copy.
        newDayDeferredByDivergence = true;
        return;
      }
      maybeShowNewDayModal();
    }).catch((e)=>{
      console.error('Startup sync chain failed unexpectedly — revealing app anyway', e);
      diagLogEvent('startup-sync', 'Startup chain threw — revealed app via safety net', { error: e.message||String(e) });
      revealApp();
    });
  } else {
    revealApp();
    maybeShowNewDayModal();
  }
}
function showSplashBypassButton(onClick){
  const status = document.getElementById('splashStatus');
  if(status) status.textContent = 'Taking longer than usual — you may be offline.';
  const btn = document.getElementById('splashBypassBtn');
  if(btn){
    btn.classList.remove('hidden');
    btn.onclick = onClick;
  }
}
function hideSplashBypassButton(){
  const btn = document.getElementById('splashBypassBtn');
  if(btn) btn.classList.add('hidden');
}

/* =========================================================
   COMMAND PALETTE (Cmd/Ctrl+K) — jump to a page, list, or task
   ========================================================= */
let cmdPaletteOpen = false;
let cmdPaletteQuery = '';
let cmdPaletteIndex = 0;

function openCommandPalette(){
  cmdPaletteOpen = true;
  cmdPaletteQuery = '';
  cmdPaletteIndex = 0;
  renderCommandPalette();
}
function closeCommandPalette(){
  cmdPaletteOpen = false;
  const el = document.getElementById('cmdPaletteOverlay');
  if(el) el.remove();
}
function getCommandPaletteResults(){
  const q = cmdPaletteQuery.trim().toLowerCase();
  const results = [];
  const PAGES = [
    ['dashboard','▣','Dashboard'], ['overdue','⚑','Overdue'], ['tasks','☰','All Tasks'],
    ['calendar','▦','Calendar'], ['week','▧','Week'], ['lists','▤','Lists'], ['health','♥','Health Log'],
    ['training','⛊','Training'], ['recipes','❖','Recipes'], ['progress','◈','Progress'], ['settings','⚙','Settings'],
  ];
  PAGES.forEach(([key,icon,label])=>{
    if(!q || label.toLowerCase().includes(q)){
      results.push({ icon, label, sub:'Page', action:()=>{ setView(key); closeCommandPalette(); } });
    }
  });
  if(q){
    state.lists.forEach(l=>{
      if(l.title.toLowerCase().includes(q)){
        results.push({ icon:'▤', label:l.title, sub:'List', action:()=>{ setView('lists'); selectList(l.id); closeCommandPalette(); } });
      }
    });
    // Items INSIDE lists — the list name is carried in the sub-label so a
    // match like "milk" tells you which list it's sitting in. Selecting it
    // opens the containing list.
    state.lists.forEach(l=>{
      (l.items||[]).forEach(item=>{
        if(item.text && item.text.toLowerCase().includes(q)){
          results.push({
            icon: item.done ? '☑' : '☐',
            label: item.text,
            sub: `In list: ${l.title}${item.done?' · done':''}`,
            action:()=>{ setView('lists'); selectList(l.id); closeCommandPalette(); },
          });
        }
      });
    });
    state.tasks.oneTime.forEach(t=>{
      if(!t.done && t.name.toLowerCase().includes(q)){
        results.push({ icon:'☐', label:t.name, sub:'One-Time Task', action:()=>{ closeCommandPalette(); openTaskModal('oneTime', t.id); } });
      }
    });
    state.tasks.recurring.forEach(t=>{
      if(t.name.toLowerCase().includes(q)){
        results.push({ icon:'↻', label:t.name, sub:'Recurring Task', action:()=>{ closeCommandPalette(); openTaskModal('recurring', t.id); } });
      }
    });
  }
  return results.slice(0,10);
}
function renderCommandPalette(){
  let overlay = document.getElementById('cmdPaletteOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.className = 'modal-overlay cmd-overlay';
    overlay.id = 'cmdPaletteOverlay';
    overlay.onclick = (e)=>{ if(e.target===overlay) closeCommandPalette(); };
    document.body.appendChild(overlay);
    overlay.innerHTML = `
      <div class="cmd-palette" onclick="event.stopPropagation();">
        <input type="text" id="cmdPaletteInput" value="${escapeHtml(cmdPaletteQuery)}" placeholder="Jump to a page, list, or task…"
               class="cmd-palette-input"
               oninput="cmdPaletteQuery=this.value; cmdPaletteIndex=0; renderCommandPaletteResults();"
               onkeydown="handleCmdPaletteKey(event)">
        <div class="cmd-palette-results" id="cmdPaletteResults"></div>
      </div>
    `;
    const input = document.getElementById('cmdPaletteInput');
    if(input) input.focus();
  }
  renderCommandPaletteResults();
}
// Rebuilding the whole overlay (including the <input>) on every arrow-key
// press was the cause of the reported flicker — recreating a focused input
// node causes a visible flash even when focus/value are restored right
// after. This only ever touches the results list now; the input element is
// created once and never touched again until the palette closes.
function renderCommandPaletteResults(){
  const results = getCommandPaletteResults();
  if(cmdPaletteIndex >= results.length) cmdPaletteIndex = Math.max(0, results.length-1);
  const resultsEl = document.getElementById('cmdPaletteResults');
  if(!resultsEl) return;
  resultsEl.innerHTML = results.length ? results.map((r,i)=>`
    <div class="cmd-palette-item ${i===cmdPaletteIndex?'active':''}" data-idx="${i}" onmousedown="getCommandPaletteResults()[${i}].action()">
      <span class="cmd-palette-icon">${r.icon}</span>
      <span class="cmd-palette-label">${escapeHtml(r.label)}</span>
      <span class="cmd-palette-sub">${escapeHtml(r.sub)}</span>
    </div>
  `).join('') : `<div class="page-sub" style="padding:16px 18px;">No matches</div>`;
  const activeEl = resultsEl.querySelector('.cmd-palette-item.active');
  if(activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({ block:'nearest' });
}
// Arrow-key navigation must NEVER rebuild the result rows — only toggle
// which one is highlighted. Rebuilding (via innerHTML) recreates every row
// as a fresh DOM node, and .cmd-palette-item has a CSS entrance animation
// that plays whenever a matching element is inserted — so every arrow
// press was replaying that animation across the whole list (reported: "the
// list re-animates every time I press an arrow key"). Only
// renderCommandPaletteResults() (called when the actual result SET
// changes, i.e. while typing) should ever touch innerHTML here.
function updateCommandPaletteHighlight(){
  const resultsEl = document.getElementById('cmdPaletteResults');
  if(!resultsEl) return;
  let activeEl = null;
  resultsEl.querySelectorAll('.cmd-palette-item').forEach(el=>{
    const isActive = Number(el.dataset.idx) === cmdPaletteIndex;
    el.classList.toggle('active', isActive);
    if(isActive) activeEl = el;
  });
  if(activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({ block:'nearest' });
}
function handleCmdPaletteKey(e){
  const results = getCommandPaletteResults();
  if(e.key==='ArrowDown'){ e.preventDefault(); if(results.length){ cmdPaletteIndex=Math.min(results.length-1, cmdPaletteIndex+1); updateCommandPaletteHighlight(); } }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(results.length){ cmdPaletteIndex=Math.max(0, cmdPaletteIndex-1); updateCommandPaletteHighlight(); } }
  else if(e.key==='Enter'){ e.preventDefault(); if(results[cmdPaletteIndex]) results[cmdPaletteIndex].action(); }
  else if(e.key==='Escape'){ closeCommandPalette(); }
}
/* =========================================================
   IDLE SESSION LOCK
   Guards against a forgotten tab transmitting stale data after you have
   moved to another device. After IDLE_TIMEOUT_MIN of no activity the tab
   locks: all outbound sync is blocked (see enqueueSync), timers are cleared,
   and the only way forward is Relaunch, which does a full reload and so
   re-pulls the authoritative copy.

   Two deliberate safety properties:
   1. It NEVER locks while there is unsaved or unsynced work. Losing your
      unsaved training log in order to prevent a data problem would be a bad
      trade. It waits, re-checking, and locks once the work is clear.
   2. It warns first, with a countdown and a way to stay, so you cannot lose
      an in-progress edit you stepped away from mid-keystroke.
   ========================================================= */
let sessionLocked = false;
let lastActivityAt = Date.now();
let idleCheckTimer = null;
let idleWarningTimer = null;
let idleWarningDeadline = null;

const IDLE_WARNING_SECONDS = 60;
const IDLE_CHECK_INTERVAL_MS = 15000;

function idleTimeoutMs(){
  const mins = Number(state.settings.idleTimeoutMin);
  if(!isFinite(mins) || mins <= 0) return 0; // 0 / invalid = feature off
  return mins * 60 * 1000;
}

/* Unsaved = anything that would be lost by a reload, or anything queued but
   not yet pushed. Kept deliberately broad: when in doubt, do not lock. */
function hasUnsavedLocalWork(){
  if(hasUnsyncedWork()) return true;
  const drafts = state.trainingDraftValues || {};
  if(Object.keys(drafts).length) return true;
  const pending = state.trainingPendingAdds || {};
  if(Object.keys(pending).some(d => (pending[d]||[]).length)) return true;
  return false;
}

function noteActivity(){
  if(sessionLocked) return;
  lastActivityAt = Date.now();
  // Any real activity during the warning countdown cancels it — you are here.
  if(idleWarningDeadline) dismissIdleWarning(true);
}

function onVisibilityChangeForIdle(){
  // Returning to a tab that has been hidden past the timeout is the exact
  // forgotten-tab case, so check immediately rather than waiting for a tick.
  if(!document.hidden) checkIdle();
}
function startIdleWatch(){
  ['mousedown','keydown','touchstart','wheel'].forEach(evt=>{
    document.addEventListener(evt, noteActivity, { passive:true });
  });
  // Named (not inline) so a repeat startIdleWatch() call de-duplicates via
  // addEventListener's identical-listener rule rather than stacking handlers.
  document.addEventListener('visibilitychange', onVisibilityChangeForIdle);
  if(idleCheckTimer) clearInterval(idleCheckTimer);
  idleCheckTimer = setInterval(checkIdle, IDLE_CHECK_INTERVAL_MS);
}

function checkIdle(){
  if(sessionLocked) return;
  const timeout = idleTimeoutMs();
  if(!timeout) return; // disabled
  if(idleWarningDeadline) return; // already counting down
  if(Date.now() - lastActivityAt < timeout) return;
  if(hasUnsavedLocalWork()){
    // Do not lock over unsaved work — re-check on the next tick instead.
    diagLogEvent('idle-lock', 'Idle timeout reached but unsaved work present — holding off');
    return;
  }
  showIdleWarning();
}

function showIdleWarning(){
  if(sessionLocked || idleWarningDeadline) return;
  idleWarningDeadline = Date.now() + IDLE_WARNING_SECONDS * 1000;
  diagLogEvent('idle-lock', 'Idle warning shown');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'idleWarningOverlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <h3>Still there?</h3>
      <div class="modal-sub">This tab has been idle for a while. To make sure it never sends out-of-date information after you have used ${escapeHtml(APP_NAME)} somewhere else, it will lock in <b id="idleCountdown">${IDLE_WARNING_SECONDS}</b>s.</div>
      <div class="modal-actions">
        <button class="btn brass" onclick="dismissIdleWarning()">I'm still here</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  if(idleWarningTimer) clearInterval(idleWarningTimer);
  idleWarningTimer = setInterval(tickIdleWarning, 1000);
}

function tickIdleWarning(){
  if(!idleWarningDeadline) return;
  const left = Math.ceil((idleWarningDeadline - Date.now()) / 1000);
  const el = document.getElementById('idleCountdown');
  if(el) el.textContent = String(Math.max(0, left));
  if(left <= 0){
    // Re-check unsaved work at the last moment — something may have queued
    // during the countdown, and that must still take priority over locking.
    if(hasUnsavedLocalWork()){
      diagLogEvent('idle-lock', 'Countdown elapsed but unsaved work appeared — cancelling lock');
      dismissIdleWarning(true);
      return;
    }
    lockSession();
  }
}

function dismissIdleWarning(silent){
  if(idleWarningTimer){ clearInterval(idleWarningTimer); idleWarningTimer = null; }
  idleWarningDeadline = null;
  const o = document.getElementById('idleWarningOverlay');
  if(o) o.remove();
  lastActivityAt = Date.now();
  if(!silent) diagLogEvent('idle-lock', 'Idle warning dismissed by user');
}

function lockSession(){
  if(sessionLocked) return;
  sessionLocked = true; // set FIRST — enqueueSync checks this
  if(idleWarningTimer){ clearInterval(idleWarningTimer); idleWarningTimer = null; }
  idleWarningDeadline = null;
  if(idleCheckTimer){ clearInterval(idleCheckTimer); idleCheckTimer = null; }
  const w = document.getElementById('idleWarningOverlay');
  if(w) w.remove();
  diagLogEvent('idle-lock', 'Session locked — outbound sync disabled until relaunch');

  const overlay = document.createElement('div');
  overlay.className = 'idle-lock-overlay';
  overlay.id = 'idleLockOverlay';
  overlay.innerHTML = `
    <div class="idle-lock-card">
      <div class="idle-lock-glyph">⏻</div>
      <h2>Session closed</h2>
      <p>${escapeHtml(APP_NAME)} closed this tab after ${escapeHtml(String(state.settings.idleTimeoutMin))} minutes of inactivity.</p>
      <p class="idle-lock-why">If you have used ${escapeHtml(APP_NAME)} on another device since, this tab's copy is out of date. It has stopped sending anything, so nothing here can overwrite newer changes. Relaunching loads the current version.</p>
      <button class="btn brass" onclick="relaunchAfterLock()">Relaunch</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

function relaunchAfterLock(){
  // Full reload: the point is to come back with a fresh pull rather than
  // resuming on top of state this tab has been holding.
  location.reload();
}

/* ---------- Ctrl/Cmd+Enter submits the open modal ----------
   Fires the primary (brass) action of the TOPMOST modal, so it works from
   inside a textarea where a bare Enter has to stay as a newline.

   Deliberately refuses to fire destructive actions. Enter is a key people hit
   on reflex, and a modifier combo that could silently delete a list or a day's
   logs is not worth the convenience. Native confirm() dialogs are outside the
   page and unaffected either way. */
const DESTRUCTIVE_ACTION_RE = /delete|remove|clear|reset|wipe|discard|revoke|disconnect/i;

function modalPrimaryButton(modal){
  // Prefer an explicit primary; fall back to the last brass button, which is
  // the established convention for the confirming action in this codebase.
  const candidates = [...modal.querySelectorAll('.modal-actions .btn.brass')];
  if(!candidates.length) return null;
  return candidates[candidates.length - 1];
}
function isDestructiveButton(btn){
  if(!btn) return true; // unknown -> treat as unsafe
  const label = (btn.textContent || '').trim();
  const handler = btn.getAttribute('onclick') || '';
  return DESTRUCTIVE_ACTION_RE.test(label) || DESTRUCTIVE_ACTION_RE.test(handler);
}
function submitTopmostModal(){
  // Last overlay in the DOM is the topmost one.
  const overlays = [...document.querySelectorAll('.modal-overlay')];
  if(!overlays.length) return false;
  const modal = overlays[overlays.length - 1].querySelector('.modal');
  if(!modal) return false;
  const btn = modalPrimaryButton(modal);
  if(!btn || btn.disabled) return false;
  if(isDestructiveButton(btn)){
    showToast('Use the button for that one');
    return true; // handled: deliberately did nothing destructive
  }
  btn.click();
  return true;
}

/* The last chance to write anything down. iOS Safari fires pagehide when it
   backgrounds a tab and may then discard it without ever running another line
   of this script, so waiting out the 400ms debounce is not an option here.
   visibilitychange covers the app-switch case on the platforms that do not
   fire pagehide until the tab is actually torn down. */
window.addEventListener('pagehide', flushTrainingDrafts);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushTrainingDrafts(); });

document.addEventListener('keydown', (e)=>{
  if((e.metaKey||e.ctrlKey) && e.key === 'Enter'){
    if(submitTopmostModal()) e.preventDefault();
    return;
  }
});

document.addEventListener('keydown', (e)=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(cmdPaletteOpen) closeCommandPalette(); else openCommandPalette();
  }
});

init();

</script>

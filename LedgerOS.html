/* ---- Investments: analytics ---- */
// Units / cost held by a given date, so historical portfolio value can be reconstructed.
function invPositionStateAsOf(posId, asOfDate, selfOnly){
  const txs = invTxForPosition(posId).filter(t=>t.date<=asOfDate);
  const selfIds = new Set((D.invOwners||[]).filter(o=>o.isSelf).map(o=>o.id));
  let units=0, costSar=0;
  const byOwner = {};
  for(const t of txs){
    const at = invTxAttribution(t);
    if(!at.valid) continue;
    const unitMap = t.kind==='sell'? invTxEnteredUnits(t) : at.units;
    for(const oid in unitMap){
      if(selfOnly && !selfIds.has(Number(oid))) continue;
      const oUnits = unitMap[oid];
      if(!(oUnits>0)) continue;
      const oSar = at.moneySar[oid]||0;
      const st = byOwner[oid] = byOwner[oid] || {units:0, costSar:0};
      if(t.kind==='sell'){
        const avg = st.units>0? st.costSar/st.units : 0;
        st.units -= oUnits; st.costSar -= avg*oUnits;
        if(st.units<1e-12){ st.units=0; st.costSar=0; }
      } else { st.units += oUnits; st.costSar += oSar; }
    }
  }
  for(const k in byOwner){ units += byOwner[k].units; costSar += byOwner[k].costSar; }
  return {units, costSar};
}
function invPriceAsOf(posId, asOfDate){
  const vals = (D.invValuations||[]).filter(v=>v.positionId===posId && v.date<=asOfDate).sort((a,b)=>a.date<b.date?-1:1);
  return vals.length? Number(vals[vals.length-1].price)||0 : 0;
}
// Portfolio value and cost at every date a price was logged — the series behind the chart.
function invPortfolioHistory(selfOnly){
  const dates = Array.from(new Set((D.invValuations||[]).map(v=>v.date))).sort();
  return dates.map(d=>{
    let value=0, cost=0;
    for(const pos of (D.invPositions||[])){
      const st = invPositionStateAsOf(pos.id, d, selfOnly);
      if(st.units<=0){ cost += st.costSar; continue; }
      value += st.units * invPriceAsOf(pos.id, d) * invFxFor(pos.currency);
      cost += st.costSar;
    }
    return {date:d, value, cost};
  });
}
// Money-weighted annual return (XIRR). Simple percentage return ignores WHEN money went in,
// which matters a lot here because the person back-fills purchases across years.
function invXirr(flows){
  // flows: [{date:'YYYY-MM-DD', amount}] — negative = money in, positive = money out/value.
  if(flows.length<2) return null;
  const hasNeg = flows.some(f=>f.amount<0), hasPos = flows.some(f=>f.amount>0);
  if(!hasNeg || !hasPos) return null;
  const t0 = new Date(flows[0].date).getTime();
  const yrs = f => (new Date(f.date).getTime()-t0)/(365.25*24*3600*1000);
  const npv = r => flows.reduce((s,f)=> s + f.amount/Math.pow(1+r, yrs(f)), 0);
  let lo=-0.9999, hi=10;
  if(npv(lo)*npv(hi) > 0) return null;
  for(let i=0;i<200;i++){
    const mid=(lo+hi)/2;
    if(npv(lo)*npv(mid) <= 0) hi=mid; else lo=mid;
  }
  const r=(lo+hi)/2;
  return isFinite(r)? r*100 : null;
}
function invPortfolioXirr(selfOnly){
  const selfIds = new Set((D.invOwners||[]).filter(o=>o.isSelf).map(o=>o.id));
  const flows = [];
  for(const t of (D.invTransactions||[]).slice().sort((a,b)=>a.date<b.date?-1:1)){
    const at = invTxAttribution(t);
    if(!at.valid) continue;
    // Money in/out per the fee-adjusted attribution — the fee is not a cash flow of the
    // investment itself, so the self owner's XIRR is not inflated by fees earned.
    let amt = 0;
    for(const oid in at.moneySar){ if(!selfOnly || selfIds.has(Number(oid))) amt += at.moneySar[oid]||0; }
    if(!(Math.abs(amt)>0)) continue;
    flows.push({date:t.date, amount: t.kind==='sell'? amt : -amt});
  }
  if(!flows.length) return null;
  let currentValue = 0;
  for(const pos of (D.invPositions||[])){
    const st = invPositionStateAsOf(pos.id, todayStr(), selfOnly);
    currentValue += st.units * invPriceAsOf(pos.id, todayStr()) * invFxFor(pos.currency);
  }
  if(currentValue>0) flows.push({date: todayStr(), amount: currentValue});
  return invXirr(flows);
}
function invDaysSince(dateStr){
  if(!dateStr) return null;
  return Math.floor((new Date(todayStr()) - new Date(dateStr))/(24*3600*1000));
}
// Positions whose price hasn't been refreshed recently — stale prices quietly make the whole
// portfolio value wrong, so they're surfaced rather than left to be noticed by accident.
function invStalePositions(dayThreshold){
  const limit = dayThreshold||14;
  return invActivePositions().map(p=>{
    const st = computePositionState(p.id);
    if(st.totalUnits<=0) return null;
    const lv = invLatestValuation(p.id);
    const days = lv? invDaysSince(lv.date) : null;
    if(lv && days<=limit) return null;
    return {pos:p, days, never:!lv};
  }).filter(Boolean);
}
function invAllocationBy(keyFn, selfOnly){
  const map = {};
  for(const pos of (D.invPositions||[])){
    const st = invPositionStateAsOf(pos.id, todayStr(), selfOnly);
    if(st.units<=0) continue;
    const val = st.units * invPriceAsOf(pos.id, todayStr()) * invFxFor(pos.currency);
    if(val<=0) continue;
    const k = keyFn(pos) || '—';
    map[k] = (map[k]||0) + val;
  }
  return Object.entries(map).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
}
// Realised gain grouped by calendar year — useful as a record of what was actually banked.
function invRealisedByYear(selfOnly){
  const selfIds = new Set((D.invOwners||[]).filter(o=>o.isSelf).map(o=>o.id));
  const byYear = {};
  for(const pos of (D.invPositions||[])){
    const txs = invTxForPosition(pos.id);
    const st = {};
    for(const t of txs){
      const at = invTxAttribution(t);
      if(!at.valid) continue;
      const unitMap = t.kind==='sell'? invTxEnteredUnits(t) : at.units;
      for(const oid in unitMap){
        if(selfOnly && !selfIds.has(Number(oid))) continue;
        const oUnits = unitMap[oid];
        if(!(oUnits>0)) continue;
        const oSar = at.moneySar[oid]||0;
        const s = st[oid] = st[oid] || {units:0, costSar:0};
        if(t.kind==='sell'){
          const avg = s.units>0? s.costSar/s.units : 0;
          const gain = oSar - avg*oUnits;
          const yr = String(t.date).slice(0,4);
          byYear[yr] = (byYear[yr]||0) + gain;
          s.units -= oUnits; s.costSar -= avg*oUnits;
          if(s.units<1e-12){ s.units=0; s.costSar=0; }
        } else { s.units += oUnits; s.costSar += oSar; }
      }
    }
  }
  return Object.entries(byYear).map(([year,gain])=>({year,gain})).sort((a,b)=>a.year<b.year?1:-1);
}

/* ---- Investments: CSV bulk entry ----
   Back-filling years of past purchases one modal at a time would be punishing, so transactions
   and prices can both be round-tripped through CSV. Import is all-or-nothing: every row is
   validated first and nothing is written unless the whole file passes. */
function invCsvDownload(name, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = name+' - '+todayStr()+'.csv'; dl.click();
}
function invOwnerAllocToString(owners){
  return (owners||[]).map(o=>o.ownerId+':'+o.units).join(';');
}
function invOwnerAllocFromString(s){
  return String(s||'').split(';').map(x=>x.trim()).filter(Boolean).map(pair=>{
    const [oid,u] = pair.split(':');
    return {ownerId: Number(oid), units: Number(u)};
  });
}
function exportInvTransactionsCSV(){
  const rows = [['Tx ID','Position ID','Position','Date','Kind','Units','Total SAR','Owners (id:units;…)','Note']];
  for(const t of (D.invTransactions||[]).slice().sort((a,b)=>a.date<b.date?-1:1)){
    const pos = invPositionById(t.positionId);
    rows.push([t.id, t.positionId, pos?pos.name:'', t.date, t.kind, t.units, t.totalSar, invOwnerAllocToString(t.owners), t.note||'']);
  }
  invCsvDownload('LedgerOS Investment Transactions', rows);
  toast('Transactions exported ✓');
}
function exportInvValuationsCSV(){
  const rows = [['Valuation ID','Position ID','Position','Date','Price (native currency)']];
  for(const v of (D.invValuations||[]).slice().sort((a,b)=>a.date<b.date?-1:1)){
    const pos = invPositionById(v.positionId);

}

function handleInvCsvFile(ev, which){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(String(reader.result||''));
    if(which==='tx') importInvTransactionsCSV(rows); else importInvValuationsCSV(rows);
  };
  reader.readAsText(f);
}
async function importInvTransactionsCSV(rows){
  if(!rows.length){ toast('Empty file', true); return; }
  const body = rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
  const errors = [], staged = [];
  const knownOwners = new Set((D.invOwners||[]).map(o=>o.id));
  body.forEach((r, i)=>{
    const line = i+2;
    const [txId, posId, , date, kind, units, totalSar, ownersStr, note] = r;
    const pid = Number(posId);
    if(!invPositionById(pid)){ errors.push('Row '+line+': unknown Position ID "'+posId+'"'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||'').trim())){ errors.push('Row '+line+': date must be YYYY-MM-DD'); return; }
    const k = String(kind||'').trim().toLowerCase();
    if(k!=='buy' && k!=='sell'){ errors.push('Row '+line+': Kind must be buy or sell'); return; }
    const u = Number(units), sar = Number(totalSar);
    if(!(u>0)){ errors.push('Row '+line+': Units must be greater than zero'); return; }
    if(!(sar>0)){ errors.push('Row '+line+': Total SAR must be greater than zero'); return; }
    const owners = invOwnerAllocFromString(ownersStr);
    if(!owners.length){ errors.push('Row '+line+': Owners column is required'); return; }
    for(const o of owners){
      if(!knownOwners.has(o.ownerId)){ errors.push('Row '+line+': unknown owner id '+o.ownerId); return; }
      if(!(o.units>0)){ errors.push('Row '+line+': owner '+o.ownerId+' has no units'); return; }
    }
    const allocTotal = owners.reduce((s,o)=>s+o.units,0);
    if(Math.abs(allocTotal-u)>1e-6){ errors.push('Row '+line+': owner units ('+allocTotal+') must equal Units ('+u+')'); return; }
    staged.push({id: String(txId||'').trim()? Number(txId) : null, positionId:pid, date:String(date).trim(), kind:k, units:u, totalSar:sar, owners, note:String(note||'')});
  });
  if(errors.length){ showInvCsvErrors(errors); return; }
  // Dry run: replay every position affected and make sure no owner is ever sold into negative
  // units. Catching it here keeps a bad file from half-importing and corrupting cost basis.
  const original = D.invTransactions;
  const simulated = original.filter(t=>!staged.some(s=>s.id===t.id)).concat(staged.map(s=>({...s, id: s.id||-1})));
  D.invTransactions = simulated;
  const negErrors = [];
  for(const pid of Array.from(new Set(staged.map(s=>s.positionId)))){
    const st = computePositionState(pid);
    for(const oid in st.byOwner){
      if(st.byOwner[oid].units < -1e-6){
        const o = invOwnerById(Number(oid)); const p = invPositionById(pid);
        negErrors.push((p?p.name:'Position '+pid)+': '+(o?o.name:'owner '+oid)+' would end up holding negative units');
      }
    }
  }
  D.invTransactions = original;
  if(negErrors.length){ showInvCsvErrors(negErrors); return; }
  for(const s of staged){
    if(s.id && (D.invTransactions||[]).some(t=>t.id===s.id)){
      const ex = D.invTransactions.find(t=>t.id===s.id);
      Object.assign(ex, {positionId:s.positionId, date:s.date, kind:s.kind, units:s.units, totalSar:s.totalSar, owners:s.owners, note:s.note});
      await persistInvTransaction(ex);
    } else {
      const rec = {...s, id: invNextId(D.invTransactions), updated_at:null};
      D.invTransactions.push(rec);
      await persistInvTransaction(rec);
    }
  }
  closeModal(); renderInvestmentsPage(); toast(staged.length+' transaction(s) imported ✓');
}
async function importInvValuationsCSV(rows){
  if(!rows.length){ toast('Empty file', true); return; }
  const body = rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
  const errors = [], staged = [];
  body.forEach((r,i)=>{
    const line = i+2;
    const [valId, posId, , date, price] = r;
    const pid = Number(posId);
    if(!invPositionById(pid)){ errors.push('Row '+line+': unknown Position ID "'+posId+'"'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||'').trim())){ errors.push('Row '+line+': date must be YYYY-MM-DD'); return; }
    const p = Number(price);
    if(!(p>0)){ errors.push('Row '+line+': Price must be greater than zero'); return; }
    staged.push({id: String(valId||'').trim()? Number(valId) : null, positionId:pid, date:String(date).trim(), price:p});
  });
  if(errors.length){ showInvCsvErrors(errors); return; }
  for(const s of staged){
    const existing = s.id? (D.invValuations||[]).find(v=>v.id===s.id)
                         : (D.invValuations||[]).find(v=>v.positionId===s.positionId && v.date===s.date);
    if(existing){ Object.assign(existing, {positionId:s.positionId, date:s.date, price:s.price}); await persistInvValuation(existing); }
    else { const rec = {...s, id: invNextId(D.invValuations), updated_at:null}; D.invValuations.push(rec); await persistInvValuation(rec); }
  }
  closeModal(); renderInvestmentsPage(); toast(staged.length+' price(s) imported ✓');
}

/* ---- Investments: Reconciliation sub-page ----
   Enter what each platform's own statement says — units per position and the USD cash balance —
   and see what doesn't agree with the tracker. Entries are stored per platform/position and
   synced, so the check reads the same on every device.
   Unit variance uses a 1e-9 tolerance and full precision on display: rounding units to 2dp would
   let a small crypto allocation read as matched when it isn't. */
// The most recent date anything was entered for this platform — either the cash figure or any
// position's unit count — used for the "last reconciled" staleness indicator. A platform with
// several positions reconciled last week and one touched yesterday should read as "yesterday",
// not silently stay stuck on whichever field happens to be checked first.
/* ---- Reconciliation: combined CSV export/import for batch updates ----
   One file covers every platform in one pass — every position's statement units, plus each
   platform's cash line — following the same convention as the price-log CSV: reference columns
   plus a single writable "New statement value" column, so import behaviour stays predictable
   across the app rather than each CSV tool inventing its own shape. A blank cell on import is
   left untouched (not treated as "clear this entry"), same reasoning as the price CSV: the
   export always contains current values, so a truly blank cell most likely means "I didn't
   check this line today," not "erase what's there." */
function invReconCSVRows(){
  const rows = [];
  (D.invPlatforms||[]).forEach(p=>{
    const r = invPlatformReconciliation(p.id);
    r.positions.forEach(x=>{
      rows.push({platform:p.name, position:x.pos.name, ticker:x.pos.ticker||'', type:'Position',
        tracker:invFmtUnits(x.trackerUnits), lastStatement:x.stmtUnits===null?'':invFmtUnits(x.stmtUnits),
        lastChecked:x.pos.stmtDate||''});
    });
    rows.push({platform:p.name, position:'Cash (USD)', ticker:'', type:'Cash',
      tracker:fmt2(r.trackerCashUsd), lastStatement:r.stmtCashUsd===null?'':fmt2(r.stmtCashUsd),
      lastChecked:p.stmtDate||''});
  });
  return rows;
}
function downloadInvReconCSV(){
  const rows = invReconCSVRows();
  const header = ['Platform','Position','Ticker','Type','Tracker Amount','Last Statement Value','Last Checked','New Statement Value'];
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r=> lines.push([r.platform, r.position, r.ticker, r.type, r.tracker, r.lastStatement, r.lastChecked, ''].map(csvEscape).join(',')));
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = 'LedgerOS reconciliation - '+todayStr()+'.csv'; dl.click();
  toast('Exported '+rows.length+' line(s) to CSV — fill in "New Statement Value" and re-import');
}
async function handleInvReconImport(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = csvToObjects(reader.result);
    inputEl.value = '';
    if(!rows.length){ toast('No rows found in that CSV', true); return; }
    let saved = 0, blank = 0, unmatched = 0;
    for(const r of rows){
      const platformName = (r['platform']||'').trim();
      const ticker = (r['ticker']||'').trim();
      const posName = (r['position']||'').trim();
      const type = (r['type']||'').trim().toLowerCase();
      const raw = r['new statement value'];
      const plat = (D.invPlatforms||[]).find(p=>p.name.trim().toLowerCase()===platformName.toLowerCase());
      if(!plat){ unmatched++; continue; }
      if(String(raw||'').trim()===''){ blank++; continue; } // blank = leave untouched, not a clear
      if(type==='cash'){
        await saveInvPlatformStmtCash(plat.id, raw);
      } else {
        const pos = invPositionsForPlatform(plat.id).find(p=>
          (ticker && (p.ticker||'').trim().toLowerCase()===ticker.toLowerCase()) ||
          (!ticker && p.name.trim().toLowerCase()===posName.toLowerCase()));
        if(!pos){ unmatched++; continue; }
        await saveInvPositionStmtUnits(pos.id, raw);
      }
      saved++;
    }
    renderInvestmentsPage();
    toast(saved+' line(s) updated ✓'+(blank?' · '+blank+' left blank (untouched)':'')+(unmatched?' · '+unmatched+' row(s) didn\'t match':''));
  };
  reader.readAsText(file);
}

function invPlatformLastReconciledDate(platformId){
  const p = invPlatformById(platformId);
  let latest = (p && p.stmtDate) || null;
  invPositionsForPlatform(platformId).forEach(pos=>{
    if(pos.stmtDate && (!latest || pos.stmtDate>latest)) latest = pos.stmtDate;
  });
  return latest;
}
// Enter behaves like Tab across every reconciliation input on the page — down each platform's

function invReconEnterNext(el, ev){
  if(ev.key!=='Enter') return;
  ev.preventDefault();
  const inputs = Array.from(document.querySelectorAll('.recon-input'));
  const idx = inputs.indexOf(el);
  if(idx>=0 && idx<inputs.length-1) inputs[idx+1].focus();
  else if(idx===inputs.length-1) el.blur();
}

        {label:'Cost', data:history.map(h=>h.cost), borderColor:'#8a93a6', borderDash:[5,4], fill:false, tension:0.25, pointRadius:0},

// Market value held on one platform, split into "you" and "family" — shown on the collapsed
// header so collapsing a platform never hides the numbers that matter day to day.
function invPlatformOwnerTotals(platformId){
  const selfId = invSelfOwnerId();
  let selfMarket=0, famMarket=0;
  invPositionsForPlatform(platformId).forEach(pos=>{
    const v = computePositionValuation(pos);
    for(const oid in v.byOwner){
      const slice = ownerSliceOfPosition(pos, Number(oid));
      if(!slice) continue;
      if(selfId!==null && Number(oid)===selfId) selfMarket += slice.marketSar;
      else famMarket += slice.marketSar;
    }
  });
  return {selfMarket, famMarket};
}

// USD is the typed field whenever platform cash is the counterparty, because the platform's own
// statement — the thing being reconciled against — is denominated in USD. SAR is derived, never
// typed, so the two figures can't disagree.
// Stores the raw typed text without re-rendering, so a formula like "105*10" doesn't get
// clobbered mid-type by a full modal repaint (same pattern as the JV amount field). The formula
// is evaluated and the field reformatted on blur, in invTxUsdBlur below.
function setInvTxUsd(val){
  const d = window._invTxDraft;
  if(!d) return;
  d.usdAmount = val;
  const usd = Number(val);
  if(usd>0){
    d.totalSar = Math.round(usd*getInvFxRate()*100)/100;
    const sarEl = document.getElementById('invTxSarDerived');
    if(sarEl) sarEl.value = d.totalSar;
  }
  invTxRefreshDerived();
}
function invTxUsdBlur(el){
  const d = window._invTxDraft;
  if(!d) return;
  const raw = String(d.usdAmount||'').trim();
  const formulaResult = tryEvalFormula(raw);
  const usd = formulaResult!==null? formulaResult : Number(raw);
  d.usdAmount = (raw===''||isNaN(usd))? '' : usd;
  d.totalSar = (usd>0)? Math.round(usd*getInvFxRate()*100)/100 : '';
  renderInvTxModal();
}
// "Opening balance" only makes sense on a buy — declaring a holding requires no sale event.
// Switching to Sell while it's selected falls back to Bank rather than leaving an invalid
// combination sitting in the draft.
function setInvTxKind(kind){
  const d = window._invTxDraft;
  if(!d) return;
  d.kind = kind;
  if(kind==='sell' && d.cashSide==='opening') d.cashSide = 'bank';
  renderInvTxModal();
}
function setInvTxCashSide(side){
  const d = window._invTxDraft;
  if(!d) return;
  d.cashSide = (side==='cash'||side==='opening')? side : 'bank';
  if(d.cashSide==='cash'||d.cashSide==='opening'){
    // Coming from the bank side there may already be a SAR figure — seed USD from it rather than
    // blanking what was typed.
    if(!(Number(d.usdAmount)>0) && Number(d.totalSar)>0) d.usdAmount = Math.round(Number(d.totalSar)/getInvFxRate()*100)/100;
    if(Number(d.usdAmount)>0) d.totalSar = Math.round(Number(d.usdAmount)*getInvFxRate()*100)/100;
  }
  renderInvTxModal();
}
function setInvTxFeePct(val){

function setInvTxSplitMode(mode){

  const unitsNum = Number(d.units)||0, totalSar = Number(d.totalSar)||0;
  if(mode==='sar'){

    (d.owners||[]).forEach(o=>{
      const u = Number(o.units)||0;

function setInvTxOwnerSar(ownerId, val){

// Text for the "price per unit" hint and the allocation summary, shared by the initial render
// and the in-place refresh so the two can't drift apart.
// Whether this transaction is entered in USD rather than SAR. Two independent reasons can
// trigger it: the funding source is USD-denominated by construction (platform cash always is,
// since invPlatformCash tracks USD; an opening balance always requires it too), OR the position
// itself simply trades in USD (a US stock, most crypto) — in which case entering the SAR
// equivalent by hand is the inconvenient path even when the money is genuinely coming from the
// bank. Either reason is sufficient on its own.
function invTxShowsUsdEntry(d, pos){
  return d.cashSide==='cash' || d.cashSide==='opening' || (pos && pos.currency==='USD');
}
function invTxPpuText(d, pos){
  const u = Number(d.units)||0, s = Number(d.totalSar)||0;
  if(!(u>0 && s>0)) return 'Enter the total that actually moved — price per unit is derived from it.';
  if(invTxShowsUsdEntry(d, pos) && Number(d.usdAmount)>0){
    return 'Price per unit: '+fmt2(Number(d.usdAmount)/u)+' USD (already net of fees)';
  }
  return 'Price per unit: '+money(s/u)+' SAR (already net of fees)';
}
// Live preview of what the management fee actually does to this transaction, so the effect is
// visible before saving rather than only showing up later in the ownership percentages.
function invTxFeeText(d){
  const rate = invMgmtFeeRate(d);
  if(!(rate>0)) return 'No management fee on this transaction.';
  const selfId = invSelfOwnerId();
  if(selfId===null) return 'Set which owner is you (Investments → Owners) before charging a fee.';
  const preview = invTxAttribution({
    kind: d.kind, units: Number(d.units)||0, totalSar: Number(d.totalSar)||0,
    owners: (d.owners||[]).map(o=>({ownerId:o.ownerId, units:Number(o.units)||0})), feePct: d.feePct
  });
  if(!preview.valid) return 'Fee of '+ (rate*100).toFixed(2) +'% will be charged to family owners once the split is entered.';
  if(d.kind==='sell'){
    if(!(preview.feeSar>0)) return 'No family owners on this sell, so no fee is charged.';
    return 'Fee: '+money(preview.feeSar)+' SAR of the family owners\' proceeds goes to you. Recorded as fee income, not investment gain.';
  }
  if(!(preview.feeUnits>0)) return 'No family owners on this buy, so no fee is charged.';
  return 'Fee: '+invFmtUnits(preview.feeUnits)+' units move from the family owners to you. Their SAR contribution is unchanged, so the fee is taken in units.';
}
function invTxAllocText(d){
  const unitsNum = Number(d.units)||0;
  if(d.splitMode==='sar'){
    const total = Object.keys(d.ownersSar||{}).reduce((s,k)=>s+(Number(d.ownersSar[k])||0),0);
    const target = Number(d.totalSar)||0;
    const bad = target>0 && Math.abs(total-target)>0.005;
    return 'Allocated: '+money(total)+' of '+money(target)+(bad?' — these must match before saving':'');
  }
  const total = (d.owners||[]).reduce((s,o)=>s+(Number(o.units)||0),0);
  const bad = unitsNum>0 && Math.abs(total-unitsNum)>1e-9;
  return 'Allocated: '+invFmtUnits(total)+' of '+invFmtUnits(unitsNum)+(bad?' — these must match before saving':'');
}
// Patches only the computed parts of the open modal. Re-rendering the whole modal on every
// keystroke destroyed and recreated the inputs, which is what threw focus out of the box the
// person was typing in.
function invTxRefreshDerived(){
  const d = window._invTxDraft;
  if(!d) return;
  const pos = invPositionById(d.positionId);
  const unitsNum = Number(d.units)||0, totalSar = Number(d.totalSar)||0;
  const ppu = document.getElementById('invTxPPU');
  if(ppu) ppu.textContent = invTxPpuText(d, pos);
  const sarAlloc = Object.keys(d.ownersSar||{}).map(k=>({ownerId:Number(k), sar:Number(d.ownersSar[k])||0})).filter(a=>a.sar>0);
  const derived = d.splitMode==='sar'? invDeriveUnitsFromSar(unitsNum, sarAlloc, totalSar) : [];
  (D.invOwners||[]).forEach(o=>{
    const el = document.getElementById('invTxDeriv_'+o.id);
    if(!el) return;
    if(d.splitMode==='sar'){
      const dv = derived.find(x=>x.ownerId===o.id);
      el.textContent = dv? invFmtUnits(dv.units) : '—';
    } else {
      const row = (d.owners||[]).find(x=>x.ownerId===o.id);
      const uVal = row? Number(row.units)||0 : 0;
      el.textContent = (unitsNum>0 && totalSar>0)? money(invSarForUnits(unitsNum, totalSar, uVal)) : '—';
    }
  });
  const feeEl = document.getElementById('invTxFeeNote');
  if(feeEl) feeEl.textContent = invTxFeeText(d);
  const sum = document.getElementById('invTxAllocSummary');
  if(sum){
    sum.textContent = invTxAllocText(d);
    const bad = /must match/.test(sum.textContent);
    sum.style.color = bad? 'var(--red)' : '';
  }

function setInvTxOwnerUnits(ownerId, val){
  const d = window._invTxDraft;
  d.owners = d.owners || [];
  const row = d.owners.find(x=>x.ownerId===ownerId);
  if(row) row.units = val; else d.owners.push({ownerId, units:val});
  d.owners = d.owners.filter(x=>String(x.units).trim()!=='');

// When editing an existing sell, its own units are already netted out of the computed state, so
// they must be added back before checking whether the new figure is affordable.
function sellUnitsInExistingTx(txId, ownerId){
  const t = (D.invTransactions||[]).find(x=>x.id===txId);
  if(!t || t.kind!=='sell') return 0;
  const row = (t.owners||[]).find(o=>o.ownerId===ownerId);
  return row? (Number(row.units)||0) : 0;
}
async function saveInvTx(){
  const d = window._invTxDraft;
  const units = Number(d.units)||0, totalSar = Number(d.totalSar)||0;
  const posForSave = invPositionById(d.positionId);
  if(units<=0){ toast('Units must be greater than zero', true); return; }
  // Checked before the generic SAR total, because whenever the USD field is shown (cash/opening
  // funding, or simply a USD-denominated position) the SAR field is derived and disabled — a
  // person seeing "Total SAR must be greater than zero" would have nowhere obvious to act on it.
  // The actionable field is USD.
  if(invTxShowsUsdEntry(d, posForSave) && !(Number(d.usdAmount)>0)){ toast('Enter the USD amount', true); return; }
  if(totalSar<=0){ toast('Total SAR must be greater than zero', true); return; }
  // In SAR mode the person allocates money and the units are derived from it; the stored record
  // is always units-based, so the ownership maths downstream is identical either way.
  let owners;
  if(d.splitMode==='sar'){
    const sarAlloc = Object.keys(d.ownersSar||{}).map(k=>({ownerId:Number(k), sar:Number(d.ownersSar[k])||0})).filter(a=>a.sar>0);
    if(!sarAlloc.length){ toast('Assign the SAR amount to at least one owner', true); return; }
    const sarTotal = sarAlloc.reduce((s,a)=>s+a.sar,0);
    if(Math.abs(sarTotal-totalSar)>0.005){ toast('Allocated SAR must equal the transaction total ('+money(totalSar)+')', true); return; }
    owners = invDeriveUnitsFromSar(units, sarAlloc, totalSar).filter(o=>o.units>0);
    if(!owners.length){ toast('Could not work out units from that split', true); return; }
  } else {
    owners = (d.owners||[]).map(o=>({ownerId:o.ownerId, units:Number(o.units)||0})).filter(o=>o.units>0);
    if(!owners.length){ toast('Assign the units to at least one owner', true); return; }
    const allocTotal = owners.reduce((s,o)=>s+o.units,0);
    if(Math.abs(allocTotal-units)>1e-9){ toast('Allocated units must equal the transaction units', true); return; }
  }
  // A sell must not remove more units than the owner actually holds — otherwise cost basis and
  // realised gain both go silently wrong from that point forward.
  if(d.kind==='sell'){
    const st = computePositionState(d.positionId);
    for(const o of owners){
      const held = ((st.byOwner[o.ownerId]||{units:0}).units) + (d.id? sellUnitsInExistingTx(d.id, o.ownerId) : 0);
      if(o.units > held + 1e-9){
        const on = invOwnerById(o.ownerId);
        toast((on?on.name:'That owner')+' only holds '+held.toLocaleString(undefined,{maximumFractionDigits:8})+' units', true);
        return;
      }
    }
  }
  const cashSide = (d.cashSide==='cash'||d.cashSide==='opening')? d.cashSide : 'bank';
  // Persisted whenever the USD field was actually shown and used — not only for cash/opening
  // funding — so editing a bank-funded USD-denominated position later shows the figure that was
  // originally typed, rather than reverting to a blank field next to a populated SAR one.
  const usdAmount = invTxShowsUsdEntry(d, posForSave)? (Number(d.usdAmount)||0) : 0;
  const feePct = Math.max(0, Math.min(100, Number(d.feePct)||0));
  if(cashSide==='opening' && d.kind!=='buy'){ toast('Opening balance only applies to a buy', true); return; }
  if(feePct>0 && invSelfOwnerId()===null){ toast('Mark one owner as "This is me" before charging a management fee', true); return; }
  // A buy funded from platform cash can legitimately overdraw if a movement hasn't been entered
  // yet, so this warns rather than blocks — being unable to record what actually happened is
  // worse than a temporarily negative balance.
  if(cashSide==='cash' && d.kind==='buy'){
    const pos = invPositionById(d.positionId);
    const avail = pos? invPlatformCash(pos.platformId).totalUsd : 0;
    const already = d.id? (Number((D.invTransactions||[]).find(t=>t.id===d.id)?.usdAmount)||0) : 0;
    if(usdAmount - already > avail + 0.005) toast('Heads up: this takes the platform cash balance negative', true);
  }
  const fields = {date:d.date, kind:d.kind, units, totalSar, owners, note:d.note||'', cashSide, usdAmount, feePct};
  if(d.id){
    const ex = (D.invTransactions||[]).find(t=>t.id===d.id);
    Object.assign(ex, fields);
    await persistInvTransaction(ex);
  } else {
    const rec = Object.assign({id: invNextId(D.invTransactions), positionId:d.positionId, updated_at:null}, fields);
    D.invTransactions.push(rec);
    await persistInvTransaction(rec);
  }
  // Remember the fee rate so it doesn't need re-typing, and stays consistent across family members.
  if(feePct!==getInvMgmtFeePct()) await setInvMgmtFeePct(feePct);
  openInvPosition(d.positionId); renderInvestmentsPage(); toast('Transaction saved ✓');
}
async function deleteInvTx(id){
  const t = (D.invTransactions||[]).find(x=>x.id===id); if(!t) return;
  const posId = t.positionId;
  D.invTransactions = D.invTransactions.filter(x=>x.id!==id);
  await syncWrite('pd_inv_transactions','delete',{id}, t.updated_at||null);

  const total = invCashAllocTotal(d), target = Number(d.usdAmount)||0;
  const bad = target>0 && Math.abs(total-target)>0.005;
  return 'Allocated: $'+fmt2(total)+' of $'+fmt2(target)+(bad?' — these must match before saving':'');
}
// Splits a withdrawal into the capital and profit portions the way the JV would be booked:
// capital to the platform's In account, profit to its Profit account. Profit is drawn first,
// because taking out money you have made before touching your original capital is the natural
// reading — and it is what keeps the reconciliation bridge exact either way.
function invWithdrawalSplit(d){
  const amt = Math.abs(Number(d.usdAmount)||0);
  const cash = invPlatformCash(d.platformId);
  const availProfit = Math.max(0, cash.profitUsd);
  if(d.profitOverride!==null && d.profitOverride!==undefined && d.profitOverride!==''){
    const prof = Math.max(0, Math.min(amt, Number(d.profitOverride)||0));
    return {profitUsd: prof, capitalUsd: amt-prof, availProfit, auto:false};
  }
  const prof = Math.min(amt, availProfit);
  return {profitUsd: prof, capitalUsd: amt-prof, availProfit, auto:true};
}

  if(d.kind==='transfer' && !d.toPlatformId){ toast('Choose which platform the money is going to', true); return; }

/* ============================= CROSS-PLATFORM POSITION TRANSFER =============================
   Moves units of the SAME asset from one platform's position record to another — the crypto/
   stock-relocation case, distinct from a buy or sell. Modelled as one linked pair of ordinary
   transactions rather than a new engine, so every existing consumer (cost basis, XIRR, realised
   gain, reconciliation) handles it automatically with no special-casing:

     OUT leg (kind:'sell', cashSide:'transfer') on the source position — removes ALL sent units
       (fee included) at their current weighted-average cost, "proceeds" = the value of the
       units that actually arrive.
     IN leg (kind:'buy', cashSide:'transfer') on the destination position — receives the arriving
       units (sent minus fee) at exactly that same cost.

   Since the OUT leg's WAC engine releases cost for every sent unit but "proceeds" only cover the
   arriving units, the shortfall — the fee'd units' cost — surfaces as a small REALISED LOSS,
   split pro-rata across the current owners exactly like any other sale. Nothing is smeared
   invisibly into anyone's remaining cost basis, and nothing needs to reconcile against the bank,
   because the two legs' cost/value balance to zero except for that honestly-booked loss.
   linkId ties the pair together for display/editing; feeUnits is stored on the OUT leg for
   reference (the loss itself is derived, not stored). */
function invMatchPositionOnPlatform(sourcePos, platformId){
  const key = (sourcePos.ticker||sourcePos.name||'').trim().toLowerCase();
  if(!key) return null;
  return (D.invPositions||[]).find(p=>p.platformId===platformId && (p.ticker||p.name||'').trim().toLowerCase()===key) || null;
}
// Splits `total` units across owners in the same proportions as `shares` (typically each
// owner's current unit holding), with any rounding remainder placed on the largest holder so the
// parts always sum EXACTLY to `total` — the same convention used for SAR-to-units splitting
// elsewhere, applied here to a unit-to-unit split.
function invSplitUnitsByShares(shares, total){
  const totalShares = Object.values(shares).reduce((s,v)=>s+v,0);
  if(!(totalShares>0) || !(total>0)) return {};
  const out = {};
  let allocated = 0, largestOid = null, largestShare = -1;
  for(const oid in shares){
    const share = shares[oid];
    if(share>largestShare){ largestShare = share; largestOid = oid; }
    const u = invRoundUnits(total*(share/totalShares));
    out[oid] = u; allocated += u;
  }
  const remainder = invRoundUnits(total - allocated);
  if(largestOid!==null && Math.abs(remainder)>0) out[largestOid] = invRoundUnits(out[largestOid]+remainder);
  return out;
}
function openInvPositionTransfer(posId){
  const pos = invPositionById(posId); if(!pos) return;
  const others = (D.invPlatforms||[]).filter(p=>p.id!==pos.platformId);

function invTransferRefreshDerived(){
  const d = window._invTransferDraft;
  if(!d) return;
  const el = document.getElementById('invTransferSummary');
  if(el){ const st = computePositionState(d.sourcePosId); el.textContent = invTransferSummaryText(d, st); }
}
function invTransferSummaryText(d, st){
  const sent = Number(d.unitsSent)||0, fee = Math.max(0, Number(d.feeUnits)||0);
  if(!(sent>0)) return 'Enter how many units to send.';
  if(fee>sent) return 'The fee cannot be larger than the units sent.';
  if(sent>st.totalUnits+1e-9) return 'More units than this position currently holds ('+invFmtUnits(st.totalUnits)+').';
  const arriving = sent-fee;
  const avg = st.totalUnits>0? st.totalCostSar/st.totalUnits : 0;
  const lossSar = avg*fee;
  return invFmtUnits(arriving)+' units will arrive at the destination'+
    (fee>0? ', with '+invFmtUnits(fee)+' lost to the fee — recorded as a realised loss of '+money(lossSar)+' SAR, split across the current owners.' : '.');
}
async function saveInvPositionTransfer(){
  const d = window._invTransferDraft;
  const sourcePos = invPositionById(d.sourcePosId);
  if(!sourcePos){ toast('Position not found', true); return; }
  if(!d.destPlatformId){ toast('Choose a destination platform', true); return; }
  if(d.destPlatformId===sourcePos.platformId){ toast('Choose a different platform to transfer to', true); return; }
  const sent = Number(d.unitsSent)||0, fee = Math.max(0, Number(d.feeUnits)||0);
  if(!(sent>0)){ toast('Enter the units to send', true); return; }
  if(fee>sent){ toast('The fee cannot exceed the units sent', true); return; }
  const st = computePositionState(sourcePos.id, d.date);
  if(sent>st.totalUnits+1e-9){ toast('Only '+invFmtUnits(st.totalUnits)+' units are held as of that date', true); return; }
  const avg = st.totalUnits>0? st.totalCostSar/st.totalUnits : 0;
  const arriving = sent-fee;
  const arrivingValueSar = Math.round(avg*arriving*100)/100;

  const shares = {}; for(const oid in st.byOwner) shares[oid] = st.byOwner[oid].units;
  const sentByOwner = invSplitUnitsByShares(shares, sent);
  const arrivingByOwner = invSplitUnitsByShares(shares, arriving);

  let destPos = invMatchPositionOnPlatform(sourcePos, d.destPlatformId);
  if(!destPos){
    destPos = {id: invNextId(D.invPositions), platformId: d.destPlatformId, name: sourcePos.name,
      ticker: sourcePos.ticker||'', assetClass: sourcePos.assetClass||'Other', currency: sourcePos.currency||'SAR',
      status:'Active', stmtUnits:null, stmtDate:null, updated_at:null};
    D.invPositions.push(destPos);
    await persistInvPosition(destPos);
  }

  const outId = invNextId(D.invTransactions);
  const outTx = {id: outId, positionId: sourcePos.id, date: d.date, kind:'sell', units: sent,
    totalSar: arrivingValueSar, owners: Object.keys(sentByOwner).map(oid=>({ownerId:Number(oid), units:sentByOwner[oid]})),
    note: (d.note?d.note+' — ':'')+'Transfer to '+(invPlatformById(d.destPlatformId)?.name||''),
    cashSide:'transfer', usdAmount:0, feePct:0, linkId:null, feeUnits: fee, updated_at:null};
  D.invTransactions.push(outTx);
  await persistInvTransaction(outTx);

  const inTx = {id: invNextId(D.invTransactions), positionId: destPos.id, date: d.date, kind:'buy', units: arriving,
    totalSar: arrivingValueSar, owners: Object.keys(arrivingByOwner).map(oid=>({ownerId:Number(oid), units:arrivingByOwner[oid]})),
    note: (d.note?d.note+' — ':'')+'Transfer from '+(invPlatformById(sourcePos.platformId)?.name||''),
    cashSide:'transfer', usdAmount:0, feePct:0, linkId: outId, feeUnits:0, updated_at:null};
  D.invTransactions.push(inTx);

/* ---- Investments: CSV-based price logging ----
   Manual per-position price entry didn't scale once there were more than a handful of
   positions, so this generates a CSV instead: export the current state (including today's
   prices, if any are already logged), edit only the price column in a spreadsheet, re-import.
   Positions left blank on import keep their last known price — a blank is "I didn't check this
   one today," not "clear the price." */
function invPriceLogCSVRows(){
  return invActivePositions().map(p=>{
    const st = computePositionState(p.id);
    const val = invLatestValuation(p.id);
    return {pos:p, units:st.totalUnits, lastPrice: val?Number(val.price):null, lastDate: val?val.date:null};
  });
}
function downloadInvPriceLogCSV(){
  const rows = invPriceLogCSVRows();
  const header = ['Position','Ticker','Platform','Units Held','Last Price','Last Price Date','Amount Total','New Price'];
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r=>{
    const plat = invPlatformById(r.pos.platformId);
    const total = r.lastPrice!==null? r.units*r.lastPrice : '';
    lines.push([r.pos.name, r.pos.ticker||'', plat?plat.name:'', r.units, r.lastPrice!==null?r.lastPrice:'', r.lastDate||'', total, ''].map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = 'LedgerOS prices - '+todayStr()+'.csv'; dl.click();
  toast('Exported '+rows.length+' position(s) to CSV — fill in "New Price" and re-import');
}
async function handleInvPriceLogImport(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = csvToObjects(reader.result);
    inputEl.value = '';
    if(!rows.length){ toast('No rows found in that CSV', true); return; }
    const date = window._invPriceImportDate || todayStr();
    let saved = 0, blank = 0, unmatched = 0;
    for(const r of rows){
      const name = (r['position']||'').trim();
      const ticker = (r['ticker']||'').trim();
      const priceRaw = r['new price'];
      const pos = (D.invPositions||[]).find(p=>
        (ticker && (p.ticker||'').trim().toLowerCase()===ticker.toLowerCase()) ||
        (!ticker && p.name.trim().toLowerCase()===name.toLowerCase()));
      if(!pos){ unmatched++; continue; }
      const price = Number(priceRaw);
      if(!priceRaw || !(price>0)){ blank++; continue; } // blank = keep last known price, not a clear
      const existing = (D.invValuations||[]).find(v=>v.positionId===pos.id && v.date===date);
      if(existing){ existing.price = price; await persistInvValuation(existing); }
      else { const rec = {id: invNextId(D.invValuations), positionId:pos.id, date, price, updated_at:null}; D.invValuations.push(rec); await persistInvValuation(rec); }
      saved++;
    }
    renderInvestmentsPage();
    toast(saved+' price(s) saved ✓'+(blank?' · '+blank+' left blank (kept last known price)':'')+(unmatched?' · '+unmatched+' row(s) didn\'t match a position':''));
  };
  reader.readAsText(file);
}
// Whole days between two 'YYYY-MM-DD' strings. Used purely for the "is this price stale"
// check, so it deliberately ignores time-of-day — a price logged this morning and checked this
// evening is 0 days old, not a fraction.
function daysBetweenDates(fromDate, toDate){
  const a = new Date(fromDate+'T00:00:00'), b = new Date(toDate+'T00:00:00');
  return Math.round((b-a)/86400000);
}
const INV_PRICE_STALE_DAYS = 7;
function invPriceStaleness(posId){
  const v = invLatestValuation(posId);
  if(!v) return {hasPrice:false, days:null, stale:false};
  const days = daysBetweenDates(v.date, todayStr());
  return {hasPrice:true, date:v.date, price:v.price, days, stale: days>INV_PRICE_STALE_DAYS};
}
function invManualPriceRows(){
  return invActivePositions().map(p=>({pos:p, st: invPriceStaleness(p.id)}))
    .sort((a,b)=> (a.st.stale===b.st.stale)? 0 : (a.st.stale? -1 : 1)); // stale prices surface first
}
async function saveInvManualPrice(posId, val, dateInputId){
  const price = Number(val);
  if(!(price>0)) return; // typing/backspacing through a value shouldn't fire a save on every keystroke's blur
  const dateEl = document.getElementById(dateInputId);
  const date = (dateEl && dateEl.value) || todayStr();
  const existing = (D.invValuations||[]).find(v=>v.positionId===posId && v.date===date);
  if(existing){ existing.price = price; await persistInvValuation(existing); }
  else { const rec = {id: invNextId(D.invValuations), positionId:posId, date, price, updated_at:null}; D.invValuations.push(rec); await persistInvValuation(rec); }
  renderInvManualPriceTable();
  toast('Price saved ✓');
}
function renderInvManualPriceTable(){

  logActivity('action', (existing?'Edited':'Created')+' custom Forecast category "'+label+'"');
  await syncWrite('pd_custom_forecast_categories', 'upsert', obj, base);
}
async function deleteCustomCategory(id){
  if(blockIfSyncing()) return;
  const c = D.customForecastCategories.find(x=>x.id===id); if(!c) return;
  const affected = D.accounts.filter(a=>a.forecast_category===c.key);
  const warn = affected.length? ' '+affected.length+' account(s) currently use it — they\'ll become unassigned.' : '';
  if(!confirm('Delete custom category "'+c.label+'"?'+warn)) return;
  D.customForecastCategories = D.customForecastCategories.filter(x=>x.id!==id);
  affected.forEach(a=>{ a.forecast_category = null; });
  syncCustomForecastCategories();
  persistLocal(); closeModal(); renderSettings();
  toast('Custom category deleted');
  logActivity('action', 'Deleted custom Forecast category: '+c.label+(affected.length? ' ('+affected.length+' account(s) unassigned)':''));
  await syncWrite('pd_custom_forecast_categories', 'delete', {id}, c.updated_at||null);
  if(affected.length){
    await syncWriteMany(affected.map(a=>({table:'pd_accounts', kind:'upsert', row:{id:a.id, forecast_category:null}, base:a.updated_at||null})), {concurrency:6});
  }
}

// This month's plan-or-actual for one account — same fallback used throughout the Forecast page.
function accountMonthPlanOrActual(a, monthKey, currentMonth){
  const c = computeForecastCell(a, monthKey, currentMonth);
  return c.plan!==null? c.plan : (monthKey<currentMonth? c.actual : 0);
}

function duplicateJamiah(id){

  const src = findJamiah(id); if(!src) return;

  if(!name) return;
  const copy = {
    id: nextJamiahId(), name: name.trim(), account: src.account, startMonth: src.startMonth, durationMonths: src.durationMonths,
    groups: src.groups.map(g=>({...g})),
    participants: src.participants.map(p=>({...p})),
    roundGroup: {...src.roundGroup},
    tags: {}, // deliberately not copied — the source's tags point at specific already-posted transactions;
              // carrying them over would count the same real payment as paid in two Jamiahs at once
  };
  D.jamiahs.push(copy);
  persistJamiah(copy);
  jamiahDetailId = copy.id;
  renderJamiahPage();
  toast('Duplicated as "'+copy.name+'" — groups, participants, pledges and the round schedule all carried over. Transaction tags start fresh.');

function setJamiahField(id, field, val){
  if(blockIfSyncing()) return;
  const j = findJamiah(id); if(!j) return;

  persistJamiah(j);
  renderJamiahDetail(id);
}
function addJamiahGroup(id){
  if(blockIfSyncing()) return;
  const j = findJamiah(id); if(!j) return;
  const gid = nextJamiahGroupId(j);
  j.groups.push({id:gid, name:'Group '+gid});
  persistJamiah(j);
  renderJamiahDetail(id);
}
function renameJamiahGroup(id, gid, name){
  if(blockIfSyncing()) return;
  const j = findJamiah(id); if(!j) return;
  const g = j.groups.find(x=>x.id===gid); if(!g) return;
  g.name = name;
  persistJamiah(j);
}
function deleteJamiahGroup(id, gid){
  if(blockIfSyncing()) return;
  const j = findJamiah(id); if(!j) return;
  if(j.participants.some(p=>p.groupId===gid)){ toast("Move or remove this group's participants first", true); return; }
  if(!confirm('Delete this group?')) return;
  j.groups = j.groups.filter(g=>g.id!==gid);
  Object.keys(j.roundGroup).forEach(m=>{ if(j.roundGroup[m]===gid) delete j.roundGroup[m]; });
  persistJamiah(j);
  renderJamiahDetail(id);
}

  if(!name){ toast('Enter a name', true); return; }
  const pid = nextJamiahParticipantId(j);
  j.participants.push({id:pid, name, groupId: j.groups[0]?j.groups[0].id:null, pledgeAmount: 0});
  persistJamiah(j);
  renderJamiahDetail(id);
}
function updateJamiahParticipant(id, pid, field, val){
  if(blockIfSyncing()) return;
  const j = findJamiah(id); if(!j) return;
  const p = j.participants.find(x=>x.id===pid); if(!p) return;
  p[field] = val;
  persistJamiah(j);
  if(field==='groupId') renderJamiahDetail(id);
}
function jamiahParticipantRaw(id, pid){
  const j = findJamiah(id); const p = j&&j.participants.find(x=>x.id===pid);
  return p? p.pledgeAmount : '';
}
function updateJamiahParticipantAmt(id, pid, el){
  if(blockIfSyncing()) return;
  const j = findJamiah(id); if(!j) return;
  const p = j.participants.find(x=>x.id===pid); if(!p) return;
  const raw = el.value.replace(/,/g,'').trim();
  const num = Number(raw);
  p.pledgeAmount = isNaN(num)? 0 : num;
  el.value = fmt2(p.pledgeAmount);

const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_MONTHS_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// ===== Arabic Settlement Statement — translation engine =====
// Layer 3 fallback: a free, keyless, CORS-friendly translation API. Quality is decent but not
// great — every AI-sourced line is flagged for review in the statement UI, never sent silently.
async function aiTranslateToArabic(text){
  try{
    const res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|ar');
    if(!res.ok) return null;
    const data = await res.json();
    return data?.responseData?.translatedText || null;
  }catch(e){ return null; }
}
// Applies your saved name spellings (Settings → Name Translations) as a find-and-replace pass,
// so names come out correctly regardless of which layer translated the surrounding sentence.
function applyNameTranslations(text){
  let result = text;
  Object.entries(D.nameTranslations||{}).forEach(([en,ar])=>{
    if(!en || !ar) return;
    const re = new RegExp('\\b'+en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    result = result.replace(re, ar);
  });
  return result;
}
// Strips a trailing month-tag (e.g. "- Jul 26'" or "- Jul - 26'") off a description, translating
// it separately with Arabic month names, so the pattern/learned-dictionary lookups below match
// against the stable base text regardless of which month it happened to be posted in.
function splitDescrMonthTag(descr){
  const m = String(descr).match(/\s*-\s*([A-Za-z]{3})\s*-?\s*(\d{2})'?\s*$/);
  if(!m) return {base: descr, arTag: ''};
  const idx = AR_MONTHS_ABBR.findIndex(mo=>mo.toLowerCase()===m[1].toLowerCase());
  if(idx<0) return {base: descr, arTag: ''};
  return {base: descr.slice(0, m.index).trim(), arTag: ' - '+AR_MONTHS[idx]+' '+m[2]};
}
// Layer 2: a small set of common recurring transaction phrasings, seeded from real usage. $1/$2
// are the captured English fragments (typically names), fixed up afterward by applyNameTranslations.
const ITEM_WORD_AR = {phone:'هاتف', laptop:'لابتوب', device:'جهاز'};
const DESCR_PATTERNS = [
  {re:/^incoming transfer from (.+) for (.+)$/i, ar:'تحويل وارد من $1 مقابل $2'},
  {re:/^incoming transfer from (.+) from (.+)$/i, ar:'تحويل وارد من $1 من $2'},
  {re:/^incoming transfer from (.+)$/i, ar:'تحويل وارد من $1'},
  {re:/^additional transfer to (.+)$/i, ar:'تحويل إضافي إلى $1'},
  {re:/^transfer to (.+) for (.+)$/i, ar:'تحويل إلى $1 مقابل $2'},
  {re:/^transfer to (.+) as per (.+) for (.+)$/i, ar:'تحويل إلى $1 حسب طلب $2 مقابل $3'},
  {re:/^transfer to (.+)$/i, ar:'تحويل إلى $1'},
  {re:/^(.+) monthly gift$/i, ar:'هدية شهرية من $1'},
  {re:/^(.+) amount from (.+?)(?:\s+for)?$/i, ar:'مبلغ $1 من $2'},
  {re:/^(.+) rest of (.+)$/i, ar:'باقي $2 من $1'},
  {re:/^(.+) new (phone|laptop|device) \+ shipping$/i, ar:'$2 جديد لـ $1 + الشحن', wordMap:{2:'item'}},
  {re:/^(.+) new (phone|laptop|device)$/i, ar:'$2 جديد لـ $1', wordMap:{2:'item'}},
];
// Full translation pipeline for one description: learned dictionary -> pattern rules -> AI fallback.
// Synchronous where possible; only calls the network if genuinely nothing else matched.
async function translateDescriptionToArabic(descr){
  const {base, arTag} = splitDescrMonthTag(descr||'');
  const normalized = base.trim().toLowerCase();
  if(!normalized) return {text:'', source:'empty'};
  if(D.descrTranslations[normalized]){
    return {text: applyNameTranslations(D.descrTranslations[normalized])+arTag, source:'learned'};
  }
  for(const pat of DESCR_PATTERNS){
    const m = base.match(pat.re);
    if(m){
      let result = pat.ar;
      for(let i=1;i<m.length;i++){
        let piece = m[i]||'';
        if(pat.wordMap && pat.wordMap[i]==='item') piece = ITEM_WORD_AR[piece.toLowerCase()] || piece;
        result = result.split('$'+i).join(piece);
      }
      return {text: applyNameTranslations(result)+arTag, source:'pattern'};
    }
  }
  const ai = await aiTranslateToArabic(base);
  if(ai) return {text: applyNameTranslations(ai)+arTag, source:'ai'};
  return {text: base+arTag, source:'failed'}; // couldn't translate at all — show original, let the person fix it manually
}
// Called when the person edits an AI-translated (or failed) line in the statement review screen
// and confirms it — grows the learned dictionary so the same phrase doesn't need AI help again.
async function learnDescrTranslation(originalDescr, correctedArabicFull){
  const {base, arTag} = splitDescrMonthTag(originalDescr||'');
  const normalized = base.trim().toLowerCase();
  if(!normalized) return;
  // Strip the (already-appended) Arabic month tag back off before storing, so the dictionary
  // entry generalizes across months rather than being locked to this one specific month.
  let toStore = correctedArabicFull;
  if(arTag && toStore.endsWith(arTag)) toStore = toStore.slice(0, -arTag.length).trim();
  D.descrTranslations[normalized] = toStore;
  persistLocal();
  await syncWrite('pd_descr_translations', 'upsert', {id:1, translations:D.descrTranslations}, null);
}

// Mathematical ceiling, applied per line: 13.01 -> 14.00, 13.99 -> 14.00, 13.00 stays 13.00,
// and -13.01 -> -13.00 (true ceiling, not away-from-zero). The toFixed(2) pass first is deliberate:

// ===== Section-order drag reordering — Pointer Events (unlike native HTML5 drag-and-drop,
// Pointer Events work reliably on iOS/Android touch, which is why this replaces Move Up/Down
// without reintroducing the mobile-reliability problem that motivated those buttons originally) =====
let sectionDrag = null;
function startSectionDrag(e){
  e.preventDefault();
  const item = e.currentTarget.closest('.section-order-item');
  const list = document.getElementById('forecastSectionOrderList');
  if(!item || !list) return;
  sectionDrag = {item, list, startY: e.clientY};
  item.style.position = 'relative';
  item.style.zIndex = '10';
  item.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
  if(item.setPointerCapture) item.setPointerCapture(e.pointerId);
  document.addEventListener('pointermove', onSectionDragMove);
  document.addEventListener('pointerup', onSectionDragEnd, {once:true});
}
function onSectionDragMove(e){
  if(!sectionDrag) return;
  const dy = e.clientY - sectionDrag.startY;
  sectionDrag.item.style.transform = `translateY(${dy}px)`;
  const siblings = Array.from(sectionDrag.list.children).filter(el=>el!==sectionDrag.item);
  const draggedRect = sectionDrag.item.getBoundingClientRect();
  const draggedMid = draggedRect.top + draggedRect.height/2;
  for(const sib of siblings){
    const r = sib.getBoundingClientRect();
    const mid = r.top + r.height/2;
    if(draggedMid < mid && sib.previousElementSibling !== sectionDrag.item){
      sectionDrag.list.insertBefore(sectionDrag.item, sib);
      break;
    } else if(draggedMid > mid && sib===siblings[siblings.length-1] && sib.nextElementSibling !== sectionDrag.item){
      sectionDrag.list.insertBefore(sectionDrag.item, sib.nextSibling);
      break;
    }
  }
}
function onSectionDragEnd(){
  if(!sectionDrag) return;
  document.removeEventListener('pointermove', onSectionDragMove);
  sectionDrag.item.style.transform = '';
  sectionDrag.item.style.position = '';
  sectionDrag.item.style.zIndex = '';
  sectionDrag.item.style.boxShadow = '';
  const newOrder = Array.from(sectionDrag.list.children).map(el=>el.dataset.key);
  setForecastSectionOrderList(newOrder);
  sectionDrag = null;
}

function earliestLedgerMonth(){
  if(!D.ledger.length) return todayStr().slice(0,7);
  return D.ledger.reduce((min,l)=> l.date<min?l.date:min, todayStr()).slice(0,7);
}
// Closing Balance = Starting + Inflow + Outflow, chained uniformly from the earliest real ledger
// month all the way through whichever month is needed — for EVERY month, not just future ones
// (Option B, chosen explicitly: simpler, but means a category's sign flip now visibly affects
// every column including historical/current, and if your categorization has any gaps, Closing
// Balance can differ slightly from your real bank balance even with no flips active — see the
// month-by-month discrepancy row on the panel itself).
function computeMonthlyCashFlowPure(months, currentMonth){
  const anchorMonth = earliestLedgerMonth();
  const trueAnchorBalance = 0; // nothing predates the earliest-ever ledger entry, by definition
  const chain = {};
  function computeMonth(monthKey, priorClosing){
    const subrows = {};
    [...FORECAST_INFLOW_CATS, ...FORECAST_OUTFLOW_CATS].forEach(c=>{ subrows[c] = categoryMonthFlow(c, monthKey, currentMonth); });
    const inflow = FORECAST_INFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const outflow = FORECAST_OUTFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const starting = priorClosing;
    const change = inflow+outflow;
    return {starting, inflow, outflow, change, closing: starting+change, subrows};
  }
  chain[anchorMonth] = computeMonth(anchorMonth, trueAnchorBalance);
  const maxNeeded = months.filter(m=>m>anchorMonth).sort().pop();
  if(maxNeeded){
    let mk = anchorMonth, guard = 0;
    while(mk < maxNeeded && guard<1200){
      const nextMk = nextMonthKeyPlain(mk);
      chain[nextMk] = computeMonth(nextMk, chain[mk].closing);
      mk = nextMk; guard++;
    }
  }
  return months.map(m=>{
    if(chain[m]) return {month:m, ...chain[m]};
    // a requested month before any real ledger history exists — nothing to show
    return {month:m, starting:0, inflow:0, outflow:0, change:0, closing:0, subrows:Object.fromEntries([...FORECAST_INFLOW_CATS,...FORECAST_OUTFLOW_CATS].map(c=>[c,0]))};
  });
}
// Toggle: re-anchors the current month's Starting Balance to your real ledger balance (as of the
// end of last month), then re-chains current + every future month forward from that real number —
// so future projections build on solid ground even if older historical months have categorization
// gaps. Past months are always left exactly as the pure chain shows them, untouched, so you can
// still see and diagnose where discrepancies originate. Default ON.
function getCashPositionAnchorToActual(){
  const v = localStorage.getItem('cashPositionAnchorToActual');
  return v===null ? true : v==='true';
}
function setCashPositionAnchorToActual(v){
  safeSetItemWarn('cashPositionAnchorToActual', v?'true':'false');
}
function computeMonthlyCashFlow(months, currentMonth){
  const pureRows = computeMonthlyCashFlowPure(months, currentMonth);
  if(!getCashPositionAnchorToActual()) return pureRows;
  const realAnchor = bankBalanceAsOf(monthRange(prevMonthKey(currentMonth))[1]);
  const anchoredChain = {};
  function anchoredMonth(monthKey, priorClosing){
    const subrows = {};
    [...FORECAST_INFLOW_CATS, ...FORECAST_OUTFLOW_CATS].forEach(c=>{ subrows[c] = categoryMonthFlow(c, monthKey, currentMonth); });
    const inflow = FORECAST_INFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const outflow = FORECAST_OUTFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const change = inflow+outflow;
    return {starting:priorClosing, inflow, outflow, change, closing:priorClosing+change, subrows};
  }
  anchoredChain[currentMonth] = anchoredMonth(currentMonth, realAnchor);
  const maxNeeded = months.filter(m=>m>currentMonth).sort().pop();
  if(maxNeeded){
    let mk = currentMonth, guard=0;
    while(mk < maxNeeded && guard<1200){
      const nextMk = nextMonthKeyPlain(mk);
      anchoredChain[nextMk] = anchoredMonth(nextMk, anchoredChain[mk].closing);
      mk = nextMk; guard++;
    }
  }
  return months.map((m,i) => {
    if(m < currentMonth) return pureRows[i]; // past stays exactly as the pure chain shows it
    return {month:m, ...anchoredChain[m]};
  });
}

function renderForecastCell(a, m, currentMonth, noDecimals, opts){
  opts = opts || {};

  const fmt = noDecimals? money0 : money;

  const isInactive = a.status==='Inactive';
  const cellBg = m===currentMonth? 'background:var(--chip)' : '';
  const dPlan = (c.plan!==null && c.plan!==undefined)? c.plan*sign : null;
  const dActual = c.actual*sign;
  const dVariance = (c.variance!==null && c.variance!==undefined)? c.variance*sign : null;
  const title = isInactive? 'Account is inactive — no forecast input possible' : 'Plan: '+(dPlan!==null?fmt(dPlan):'—')+' | Actual: '+fmt(dActual)+(dVariance!==null?' | Variance: '+fmt(dVariance):'');

  }

    const raw = (c.plan!==null && c.plan!==undefined)? c.plan*sign : '';
    const displayFmt = noDecimals? (v=>v===''?'':money0(v)) : fmt2;
    return `<td class="num" style="${cellBg}" title="${esc(title)}"><input type="text" inputmode="decimal" class="num" style="width:100px" value="${raw!==''?displayFmt(raw):''}" placeholder="—" data-raw="${raw}"
      onfocus="this.value=this.dataset.raw" onblur="setManualPlan(${a.id},'${m}',this.value===''?'':(Number(String(this.value).replace(/,/g,''))*(${sign})))"></td>`;

  return `<td class="num mono" style="${cellBg}" title="${esc(title)}">${dPlan!==null?fmt(dPlan):'<span class="mut">—</span>'}${badge}${provTag}${budgetTag}${smartTag}</td>`;

// Keeps every horizontally-scrollable table on the Forecast page (Cash Position + each category
// section) locked to the same scroll position, so columns for the same month always line up
// visually across the whole page, no matter which panel you actually grab to scroll.
function syncForecastScrollContainers(){
  const body = document.getElementById('forecastBody');
  if(!body) return;
  const containers = Array.from(body.querySelectorAll('.forecast-scroll'));
  let syncing = false;
  containers.forEach(c=>{
    c.addEventListener('scroll', ()=>{
      if(syncing) return;
      syncing = true;
      containers.forEach(other=>{ if(other!==c) other.scrollLeft = c.scrollLeft; });
      syncing = false;
    });
  });
}
function renderForecastBody(){
  const el = document.getElementById('forecastBody');
  if(!el) return;
  // Every scrollable panel on this page scrolls in sync (see syncForecastScrollContainers), so
  // capturing scroll position from any one existing container before an edit-triggered rebuild
  // is enough to restore the whole page's horizontal position afterward — without this, editing
  // any cell would silently snap the view back to the leftmost column.
  const existingScroller = el.querySelector('.forecast-scroll');
  const savedScrollLeft = existingScroller ? existingScroller.scrollLeft : 0;
  beginForecastFastPath();
  try{
    const months = forecastMonthsWindow();
    const currentMonth = todayStr().slice(0,7);
    const accs = forecastableAccounts().filter(a=>{ const c=getForecastCategory(a); return c && c!=='ignore'; });
    const byCat = {};
    accs.forEach(a=>{ const cat=getForecastCategory(a); (byCat[cat] ??= []).push(a); });
    const order = getForecastSectionOrder().filter(k=>byCat[k] && byCat[k].length);

    el.innerHTML = `
      <div class="panel noprint row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div class="row">
          <button class="btn ghost sm" onclick="forecastShiftWindow(-1)">‹ Prev</button>
          <div class="mono" style="padding:0 10px">${esc(monthLabel(months[0]))} → ${esc(monthLabel(months[months.length-1]))}</div>
          <button class="btn ghost sm" onclick="forecastShiftWindow(1)">Next ›</button>
        </div>
        <div class="row">
          <input type="month" id="forecastJumpInput" value="${forecastWindowStart}">
          <button class="btn ghost sm" onclick="forecastJumpToMonth()">Jump to month</button>
          <button class="btn ghost sm" onclick="forecastJumpToday()">Jump to current month</button>
        </div>
      </div>
      ${renderCashFlowPanel(months, currentMonth)}
      ${order.map(key=>renderForecastCategorySection(key, FORECAST_CATEGORIES[key], byCat[key], months, currentMonth)).join('') || '<div class="panel empty">No accounts categorized yet — open ⚙ Forecast Settings above to assign categories.</div>'}
    `;
    syncForecastScrollContainers();
    if(savedScrollLeft){
      const first = el.querySelector('.forecast-scroll');
      if(first) first.scrollLeft = savedScrollLeft;
    }
  } finally {
    endForecastFastPath();
  }
}

function selectAllForAccount(acc){
  const items = unallocItems().filter(l=>l.acc===acc);
  const allSelected = items.length>0 && items.every(l=>allocSelected.has(l.id));
  if(allSelected){
    items.forEach(l=>allocSelected.delete(l.id));
  } else {
    // selecting a different account's lines clears any other account's existing selection, same rule as single-line toggling
    const firstId = [...allocSelected][0];
    if(firstId!==undefined){ const firstLine = D.ledger.find(l=>l.id===firstId); if(firstLine && firstLine.acc!==acc){ allocSelected.clear(); } }
    items.forEach(l=>allocSelected.add(l.id));
  }
  renderAllocUnallocResults();

function toggleAllocSel(id, acc){
  // an allocation can only ever contain lines from one account — starting a selection in a
  // different account's group clears whatever was selected elsewhere first
  if(!allocSelected.has(id) && allocSelected.size>0){
    const firstId = [...allocSelected][0];
    const firstLine = D.ledger.find(l=>l.id===firstId);
    if(firstLine && firstLine.acc!==acc){ allocSelected.clear(); }
  }
  if(allocSelected.has(id)) allocSelected.delete(id); else allocSelected.add(id);
  renderAllocUnallocResults();
}
async function assignAllocation(acc){
  if(blockIfSyncing()) return;
  const input = document.getElementById('allocNumInput_'+acc);
  const raw = input.value.trim();
  const num = parseInt(raw,10);
  if(!num || num<1){ toast('Enter a valid allocation number', true); return; }
  const ids = [...allocSelected];
  const accs = new Set(ids.map(id=>{ const l=D.ledger.find(x=>x.id===id); return l?l.acc:null; }));
  if(accs.size>1){ toast('An allocation can only group transactions from a single account', true); return; }
  const touched = [];
  ids.forEach(id=>{ const l = D.ledger.find(x=>x.id===id); if(l){ const base=l.updated_at||null; l.alloc = num; touched.push({row:l, base}); } });
  persistLocal();
  for(const t of touched){ await syncWrite('pd_ledger', 'upsert', {id:t.row.id, jv:t.row.jv, entry_date:t.row.date, acc:t.row.acc, descr:t.row.descr, amt:t.row.amt, alloc:t.row.alloc, allocatable:t.row.allocatable, acc_name_snapshot:t.row.accNameSnapshot||null}, t.base); }
  toast('Allocation #'+pad5(num)+' created with '+ids.length+' lines ✓');
  allocSelected.clear();
  renderAlloc();
}

function viewAllocGroup(n){

async function renumberAllocation(oldNum){
  if(blockIfSyncing()) return;
  const raw = document.getElementById('allocRenumInput').value.trim();
  const newNum = parseInt(raw,10);
  if(!newNum || newNum<1){ toast('Enter a valid allocation number', true); return; }
  if(newNum===oldNum){ toast("That's already the current number"); return; }
  const collision = D.ledger.some(l=>l.alloc===newNum);
  if(collision){ toast('Allocation #'+pad5(newNum)+' is already in use — pick a different number', true); return; }
  const rows = D.ledger.filter(l=>l.alloc===oldNum);
  const touched = rows.map(l=>({row:l, base:l.updated_at||null}));
  rows.forEach(l=>{ l.alloc=newNum; });
  persistLocal();
  for(const t of touched){ await syncWrite('pd_ledger', 'upsert', {id:t.row.id, jv:t.row.jv, entry_date:t.row.date, acc:t.row.acc, descr:t.row.descr, amt:t.row.amt, alloc:t.row.alloc, allocatable:t.row.allocatable, acc_name_snapshot:t.row.accNameSnapshot||null}, t.base); }
  toast('Renumbered to #'+pad5(newNum)+' ✓');
  viewAllocGroup(newNum);
  // The allocation modal is now reachable from the Ledger page and the JV modal too, so only
  // repaint the Allocations page when that's actually the page underneath — otherwise this
  // would render allocation content into #app while the nav still says Ledger.
  if(screen==='alloc') renderAlloc();
}
async function unassignLine(id,n){
  if(blockIfSyncing()) return;
  const l = D.ledger.find(x=>x.id===id);
  if(l){
    const base = l.updated_at||null;
    l.alloc=null;
    persistLocal();
    await syncWrite('pd_ledger', 'upsert', {id:l.id, jv:l.jv, entry_date:l.date, acc:l.acc, descr:l.descr, amt:l.amt, alloc:l.alloc, allocatable:l.allocatable, acc_name_snapshot:l.accNameSnapshot||null}, base);
  }
  const remaining = D.ledger.filter(l=>l.alloc===n).length;
  if(remaining) viewAllocGroup(n); else closeModal();
  // Same guard as renumberAllocation — repaint whichever page is actually underneath, since the
  // allocation modal can now be opened from the Ledger page as well.
  if(screen==='alloc') renderAlloc();
  else if(screen==='ledger') renderLedgerResults();
  toast('Removed from allocation');
}

/* ---- Page order: drag and drop ---- */
let _pgDragId = null;
function pgDragStart(ev, id){
  _pgDragId = id;
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain', id); }catch(e){}
  const row = ev.currentTarget; if(row) row.classList.add('dragging');
}
function pgDragEnd(){
  _pgDragId = null;
  document.querySelectorAll('.pg-row').forEach(r=>r.classList.remove('dragging','drop-above','drop-below'));
}
function pgDragOver(ev, id){
  if(!_pgDragId || _pgDragId===id) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  const row = ev.currentTarget;
  const rect = row.getBoundingClientRect();
  const above = (ev.clientY - rect.top) < rect.height/2;
  document.querySelectorAll('.pg-row').forEach(r=>r.classList.remove('drop-above','drop-below'));
  row.classList.add(above? 'drop-above' : 'drop-below');
}
function pgDragLeave(ev){
  const row = ev.currentTarget;
  if(row) row.classList.remove('drop-above','drop-below');
}
async function pgDrop(ev, targetId){
  ev.preventDefault();
  const dragged = _pgDragId;
  const row = ev.currentTarget;
  const rect = row? row.getBoundingClientRect() : null;
  const above = rect? (ev.clientY - rect.top) < rect.height/2 : true;
  pgDragEnd();
  if(!dragged || dragged===targetId) return;
  const ids = reorderableScreens().map(s=>s[0]);
  const from = ids.indexOf(dragged);
  if(from<0) return;
  ids.splice(from, 1);
  let to = ids.indexOf(targetId);
  if(to<0) to = ids.length; else if(!above) to = to+1;
  ids.splice(to, 0, dragged);
  await savePageOrder(ids);
  renderNav();
  renderSettings();
  toast('Page order saved ✓');
}
function renderPageOrderSection(hidden){
  const rows = reorderableScreens().map(([id,label,icon])=>`
    <div class="pg-row" draggable="true"
      ondragstart="pgDragStart(event,'${id}')" ondragend="pgDragEnd()"
      ondragover="pgDragOver(event,'${id}')" ondragleave="pgDragLeave(event)" ondrop="pgDrop(event,'${id}')">
      <span class="pg-grip" title="Drag to reorder">⠿</span>
      <span class="pg-name">${icon||''} ${esc(label)}</span>
      ${ALWAYS_VISIBLE_SCREENS.includes(id)
        ? '<span class="pg-lock">always visible</span>'
        : `<input type="checkbox" class="chk" ${!hidden.includes(id)?'checked':''} onchange="togglePageVisibility('${id}', this.checked)" title="Show in sidebar">`}
    </div>`).join('');
  const pinned = SCREENS.find(s=>s[0]===PINNED_LAST_SCREEN);
  return `
    <div class="panel">
      <h3>🧭 Pages</h3>
      <div class="mut" style="font-size:12px;margin-bottom:12px">Drag to reorder the sidebar, and untick a page to hide it. Dashboard and Settings can't be hidden, so you can never lock yourself out. The order is synced to all your devices; visibility stays per-device.</div>
      ${rows}
      ${pinned? `<div class="pg-row pinned" title="Settings is always last">
        <span class="pg-grip" style="opacity:.35">⠿</span>
        <span class="pg-name">${pinned[2]||''} ${esc(pinned[1])}</span>
        <span class="pg-lock">pinned last</span>
      </div>`:''}
    </div>`;
}

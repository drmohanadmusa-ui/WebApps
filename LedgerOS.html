async function saveJVEdit(){
  if(blockIfSyncing()) return;
  const d = jvEditDraft;
  const total = d.lines.reduce((s,l)=>s+(Number(l.amt)||0),0);
  const complete = d.lines.every(l=> l.acc && l.descr && String(l.descr).trim() && l.amt!==''&&l.amt!==null&&l.amt!==undefined && !isNaN(Number(l.amt)));
  if(!complete){ toast('Every line needs an account, description, and amount', true); return; }
  if(d.lines.length<2){ toast('A JV needs at least two lines', true); return; }
  const inactiveLines = d.lines.filter(l=>{
    const a = D.accounts.find(x=>x.id===Number(l.acc));
    if(!a || a.status!=='Inactive') return false;
    const original = D.ledger.find(x=>x.id===l.id);
    return !original || Number(original.acc)!==Number(l.acc); // only a problem if this line is being newly assigned to it
  });
  if(inactiveLines.length){
    const names = [...new Set(inactiveLines.map(l=>accShort(Number(l.acc))))].join(', ');
    toast('Can\'t save — this JV includes an Inactive account: '+names, true);
    return;
  }
  if(Math.abs(total)>=0.005){ toast('Lines must net to zero before saving', true); return; }
  if(!d.date){ toast('A date is required', true); return; }
  if(d.date>todayStr()){ toast('Date cannot be in the future', true); return; }
  const jvDate = d.date;
  if(jvDate.slice(0,7)!==todayStr().slice(0,7)){
    if(!confirm('This JV is dated '+jvDate+', outside the current month. Changing it will affect historical numbers for that period. Continue?')) return;
  }
  // Any original line no longer present in the draft was deliberately removed — delete it for real.
  const originalIds = D.ledger.filter(l=>l.jv===d.jv).map(l=>l.id);
  const keptIds = new Set(d.lines.map(l=>l.id).filter(id=>id!=null));
  const removedIds = originalIds.filter(id=>!keptIds.has(id));
  const removedRows = removedIds.map(id=>D.ledger.find(l=>l.id===id)).filter(Boolean);
  if(removedRows.length){
    D.ledger = D.ledger.filter(l=>!removedIds.includes(l.id));
  }
  const touched = [];
  let nextId = null;
  d.lines.forEach(l=>{
    if(l.id==null){
      // a line added during this edit session — a genuinely new ledger row
      if(nextId==null) nextId = nextLedgerId();
      const row = {id: nextId++, jv: d.jv, date: jvDate||todayStr(), acc: Number(l.acc), descr: l.descr, amt: Number(l.amt), alloc: null, allocatable: false};
      D.ledger.push(row);
      touched.push(row);
      return;
    }
    const row = D.ledger.find(x=>x.id===l.id);
    if(!row) return;
    row.acc = Number(l.acc); row.descr = l.descr; row.amt = Number(l.amt); row.date = jvDate;
    touched.push(row);
  });
  persistLocal();
  closeModal();
  toast('JV #'+d.jv+' updated ✓'+(removedRows.length? ' ('+removedRows.length+' line(s) removed)':''));
  const dateChanged = d.origDate && d.origDate!==jvDate;
  logActivity('action', 'Edited JV #'+d.jv+' ('+touched.length+' line(s) changed'+(removedRows.length? ', '+removedRows.length+' line(s) deleted':'')+(dateChanged? ', date changed '+d.origDate+' → '+jvDate:'')+')');
  for(const row of touched){
    await syncWrite('pd_ledger', 'upsert', {id:row.id, jv:row.jv, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt, alloc:row.alloc, allocatable:row.allocatable}, row.updated_at||null);
  }
  for(const row of removedRows){
    await syncWrite('pd_ledger', 'delete', {id:row.id}, row.updated_at||null);
  }
  if(screen==='ledger') renderLedger();
  else if(screen==='dashboard') renderDashboard();
  else if(screen==='statement') renderStatement();
  else if(screen==='alloc') renderAlloc();
}
function exportJVCSV(jv){
  const lines = D.ledger.filter(l=>l.jv===jv).sort((a,b)=>a.id-b.id);
  const header = ['JV#','Date','Account#','Account Name','Description','Amount'];
  const rows = [header.join(',')];
  lines.forEach(l=> rows.push([l.jv,l.date,l.acc,accShort(l.acc),l.descr,l.amt].map(csvEscape).join(',')));
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jv-'+jv+'.csv'; a.click();
  toast('JV #'+jv+' exported to CSV');
}
function duplicateJV(jv){
  const lines = D.ledger.filter(l=>l.jv===jv).sort((a,b)=>a.id-b.id);
  jvDraft = { date: todayStr(), lines: lines.map(l=>({key:Math.random().toString(36).slice(2), acc:l.acc, descr:l.descr, amt:l.amt, _matches:[], _hi:-1})) };

  go('newjv');
  toast('Loaded JV #'+jv+' as a starting point — review and post');
}
async function deleteJV(jv){
  if(blockIfSyncing()) return;
  if(!confirm('Delete JV #'+jv+' and all its lines? This cannot be undone.')) return;
  const rows = D.ledger.filter(l=>l.jv===jv);
  D.ledger = D.ledger.filter(l=>l.jv!==jv);
  persistLocal(); closeModal(); renderLedger();
  toast('JV #'+jv+' deleted');
  logActivity('action', 'Deleted JV #'+jv+' ('+rows.length+' lines)');
  for(const r of rows){ await syncWrite('pd_ledger', 'delete', {id:r.id}, r.updated_at||null); }
}

function showImportProgress(title){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg"><div class="modal">

    <div style="background:var(--chip);border-radius:8px;overflow:hidden;height:18px;margin:16px 0">

function updateImportProgress(current, total, label){
  const bar = document.getElementById('importProgressBar');
  const text = document.getElementById('importProgressText');
  if(!bar || !text) return;
  const pct = total>0? Math.min(100, Math.round(current/total*100)) : 100;
  bar.style.width = pct+'%';
  text.textContent = (label||'Processing')+'… '+current.toLocaleString()+' / '+total.toLocaleString()+' ('+pct+'%)';
}
function finishImportProgress(message, errorReport){
  const bar = document.getElementById('importProgressBar');
  const text = document.getElementById('importProgressText');
  if(bar) bar.style.width = '100%';
  if(text) text.textContent = '100% complete';
  logActivity('action', 'Import finished: '+String(message).replace(/\n/g,' | '));
  window._importErrorReportData = errorReport || null;
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onmousedown="if(event.target===this)closeModal()"><div class="modal">

function exportImportErrorReport(){
  const data = window._importErrorReportData;
  if(!data || !data.rows.length) return;
  const lines = [data.headers.map(csvEscape).join(',')];
  data.rows.forEach(row=>lines.push(row.map(csvEscape).join(',')));
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = (data.filename||'Import Errors')+' - '+todayStr()+'.csv'; dl.click();

// Resolved plan for the Budget page/grid: Provisions take priority (locked), else whatever is
// stored in D.budget for that account+month (editable). Mirrors the exact same precedence the
// Forecast page's Expense cells use, so the two pages always agree on the same numbers.
function resolvedBudgetCell(accId, monthKey){
  const provPlan = provisionsPlanFor(accId, monthKey);
  if(provPlan!==null) return {plan: provPlan, source:'provisions', editable:false};
  const val = budgetPlanFor(accId, monthKey);
  return {plan: val, source: val!==null? 'budget' : null, editable:true};
}

async function saveBudgetCell(accId, monthKey, rawVal){
  if(blockIfSyncing()) return;
  const clean = String(rawVal).replace(/,/g,'').trim();
  const existing = D.budget.find(b=>b.acc===accId && monthOf(b.date)===monthKey);
  if(clean===''||Number(clean)===0){
    if(existing){
      D.budget = D.budget.filter(b=>b!==existing);
      persistLocal(); renderBudgetGrid();
      await syncWrite('pd_budget', 'delete', {id:existing.id}, existing.updated_at||null);
    }
    return;
  }
  const val = Number(clean);
  if(isNaN(val)) return;
  if(existing){
    const base = existing.updated_at||null;
    existing.amt = val;
    persistLocal(); renderBudgetGrid();
    await syncWrite('pd_budget', 'upsert', {id:existing.id, entry_date:existing.date, acc:existing.acc, descr:existing.descr, amt:existing.amt}, base);
  } else {
    const row = {id: nextBudgetId(), date: monthKey+'-01', acc: accId, descr: 'Budget - '+monthLabel(monthKey), amt: val};
    D.budget.push(row);
    persistLocal(); renderBudgetGrid();
    await syncWrite('pd_budget', 'upsert', {id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt}, null);

async function handleBudgetGridImport(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {

    inputEl.value = '';

  };

async function importBudgetGridCSV(rows){
  if(blockIfSyncing()) return;
  const startTime = Date.now();
  const currentMonth = todayStr().slice(0,7);
  const sampleKeys = Object.keys(rows[0]||{});
  const monthCols = sampleKeys.filter(k=>/^\d{4}-\d{2}$/.test(k) && k>currentMonth);
  if(!confirm('Import '+rows.length+' rows? This will replace future budget entries ('+monthCols.length+' future month columns detected) for every matched account. Historical/current-month columns are always ignored.')) return;
  let matched=0, unmatched=0, planWritten=0; const mismatches=[];
  const touchedUpserts=[], touchedDeletes=[];
  showImportProgress('Importing Budget Grid…');
  let processed=0;
  for(const r of rows){
    const id = parseInt(r['account id']||r['account#']||r['account'],10);
    const a = D.accounts.find(x=>x.id===id);
    if(!a){ unmatched++; processed++; continue; }
    matched++;
    for(const mk of monthCols){
      const raw = r[mk];
      if(raw===undefined) continue;
      const c = resolvedBudgetCell(a.id, mk);
      const clean = String(raw).replace(/,/g,'').trim();
      if(!c.editable){
        if(clean!=='' && Math.abs(Number(clean)-Number(c.plan||0))>0.01){
          mismatches.push({acc:a.id, name:accShort(a.id), month:mk, imported:Number(clean), computed:c.plan});
        }
        continue;
      }
      const existing = D.budget.find(b=>b.acc===a.id && monthOf(b.date)===mk);
      if(clean===''){
        if(existing){ D.budget = D.budget.filter(b=>b!==existing); touchedDeletes.push({id:existing.id, updated_at:existing.updated_at||null}); planWritten++; }
      } else {
        const val = Number(clean);
        if(isNaN(val)) continue;
        if(existing){ existing.amt = val; touchedUpserts.push(existing); }
        else { const row = {id: nextBudgetId(), date: mk+'-01', acc: a.id, descr: 'Budget - '+monthLabel(mk), amt: val}; D.budget.push(row); touchedUpserts.push(row); }
        planWritten++;
      }
    }
    processed++;
    updateImportProgress(processed, rows.length, 'Processing');
    // Yield to the browser every few rows so the progress bar actually paints — without this, a
    // long synchronous loop (many accounts × many months) blocks rendering entirely and the bar
    // appears to jump straight to 100% at the very end instead of animating.
    if(processed % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
  }
  persistLocal();
  const syncOps = [
    ...touchedUpserts.map(row=>({table:'pd_budget', kind:'upsert', row:{id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt}, base:row.updated_at||null})),
    ...touchedDeletes.map(del=>({table:'pd_budget', kind:'delete', row:{id:del.id}, base:del.updated_at})),
  ];
  if(syncOps.length){
    await syncWriteMany(syncOps, {concurrency:6, onProgress:(done,total)=>updateImportProgress(done,total,'Syncing to cloud')});
  }
  const elapsedSec = ((Date.now()-startTime)/1000).toFixed(1);
  let msg = 'Import complete: '+matched.toLocaleString()+' matched, '+planWritten.toLocaleString()+' month values written';
  msg += '\nTook '+elapsedSec+'s';
  if(unmatched) msg += '\n'+unmatched.toLocaleString()+' row(s) skipped (no matching account)';
  if(mismatches.length){
    const list = mismatches.slice(0,25).map(m=>`${m.name} (${m.acc}) — ${monthLabel(m.month)}: imported ${money(m.imported)}, kept computed ${money(m.computed)}`).join('\n');
    msg += '\n\n⚠ '+mismatches.length+' Provisions-locked cell(s) didn\'t match — kept the computed value:\n'+list+(mismatches.length>25?`\n…and ${mismatches.length-25} more.`:'');
  }
  finishImportProgress(msg);
  renderBudget();
}

function applyPnLPreset(val){

  else if(val==='lastmonth'){ [pnlFrom,pnlTo] = monthRange(prevMonthKey(today.slice(0,7))); }
  else if(val==='specific'){ [pnlFrom,pnlTo] = monthRange(pnlSpecificMonth); }
  else if(val==='ytd'){ pnlFrom = today.slice(0,4)+'-01-01'; pnlTo = today; }
  else if(val==='year'){ pnlFrom = pnlYear+'-01-01'; pnlTo = pnlYear+'-12-31'; }
  renderPnL();
}
function pnlSpecificMonthChange(v){ pnlSpecificMonth=v; pnlPreset='specific'; [pnlFrom,pnlTo]=monthRange(v); renderPnL(); }
function pnlYearChange(v){ pnlYear=v; pnlPreset='year'; pnlFrom=v+'-01-01'; pnlTo=v+'-12-31'; renderPnL(); }
// Quick prev/next month navigation — shifts from whichever month is currently being viewed
// (falls back to the From date's month for ytd/year/custom presets) and switches to viewing
// that single specific month, without needing the dropdown.
function pnlShiftMonth(delta){
  let anchor;
  if(pnlPreset==='specific') anchor = pnlSpecificMonth;
  else if(pnlPreset==='month') anchor = todayStr().slice(0,7);
  else if(pnlPreset==='lastmonth') anchor = prevMonthKey(todayStr().slice(0,7));
  else anchor = pnlFrom.slice(0,7);
  const newMonth = delta>0? nextMonthKeyPlain(anchor) : prevMonthKey(anchor);
  pnlSpecificMonth = newMonth;
  pnlPreset = 'specific';
  [pnlFrom, pnlTo] = monthRange(newMonth);
  renderPnL();
}

function renderPnL(){
  // ---- Income: shown positive, grouped by category with subtotals ----
  const incAccs = D.accounts.filter(a=>firstDigit(a.id)===3 && (a.acc_type==='Individual Account'||a.acc_type==='Accrual Account'));
  const incByCat = {};
  incAccs.forEach(a=>{ const raw = sumAcc(l=>l.acc===a.id, pnlFrom, pnlTo); if(raw!==0) (incByCat[a.category] ??= []).push({a, v: Math.abs(raw)}); });
  const incCats = Object.keys(incByCat).sort((x,y)=> Math.min(...incByCat[x].map(i=>i.a.id)) - Math.min(...incByCat[y].map(i=>i.a.id)));
  let incTotal = 0;
  const incBody = incCats.map(cat=>{
    const items = incByCat[cat]; const catTotal = items.reduce((s,i)=>s+i.v,0); incTotal += catTotal;
    return `<tr style="background:var(--chip)"><td style="font-weight:700;color:var(--accent)">${esc(cat)}</td><td class="num mono g" style="font-weight:700">${money(catTotal)}</td></tr>` +
      items.map(i=>`<tr><td class="click" style="padding-left:18px" onclick="viewPnLAccountTransactions(${i.a.id})">${esc(accShort(i.a.id))}</td><td class="num mono g">${money(i.v)}</td></tr>`).join('');
  }).join('');

  // ---- Expenses: shown negative, grouped by category, with Budget/Actual/Variance — every expense account listed, even at zero ----
  const expAccs = D.accounts.filter(a=>firstDigit(a.id)===6 && (a.acc_type==='Individual Account'||a.acc_type==='Accrual Account') && a.status!=='Deleted');
  const expByCat = {};
  expAccs.forEach(a=>{
    const actualRaw = sumAcc(l=>l.acc===a.id, pnlFrom, pnlTo);
    const budgetRaw = D.budget.filter(b=>b.acc===a.id && b.date>=pnlFrom && b.date<=pnlTo).reduce((s,b)=>s+Number(b.amt),0);
    (expByCat[a.category] ??= []).push({a, actual: actualRaw, budget: budgetRaw});
  });
  const expCats = Object.keys(expByCat).sort((x,y)=> Math.min(...expByCat[x].map(i=>i.a.id)) - Math.min(...expByCat[y].map(i=>i.a.id)));
  let expTotal = 0, expBudgetTotal = 0;
  const expBody = expCats.map(cat=>{
    const items = expByCat[cat].sort((a,b)=>a.a.id-b.a.id);
    const catTotal = items.reduce((s,i)=>s+i.actual,0), catBudget = items.reduce((s,i)=>s+i.budget,0);
    expTotal += catTotal; expBudgetTotal += catBudget;
    return `<tr style="background:var(--chip)"><td style="font-weight:700;color:var(--accent)">${esc(cat)}</td><td class="num mono" style="font-weight:700">${money(catBudget)}</td><td class="num mono" style="font-weight:700">${money(catTotal)}</td><td class="num mono ${moneyClass(catTotal-catBudget)}" style="font-weight:700">${money(catTotal-catBudget)}</td></tr>` +
      items.map(i=>`<tr><td class="click" style="padding-left:18px" onclick="viewPnLAccountTransactions(${i.a.id})">${esc(accShort(i.a.id))}</td><td class="num mono">${money(i.budget)}</td><td class="num mono">${money(i.actual)}</td><td class="num mono ${moneyClass(i.actual-i.budget)}">${money(i.actual-i.budget)}</td></tr>`).join('');
  }).join('');

  // Net Result is always Income minus the magnitude of Expenses — matching standard P&L
  // semantics regardless of whether the underlying expense accounts happen to store true-sign

  const years = dataYears();
  document.getElementById('app').innerHTML = `
    <div class="panel noprint">

          <select onchange="applyPnLPreset(this.value)">
            <option value="month" ${pnlPreset==='month'?'selected':''}>This month</option>

            <option value="specific" ${pnlPreset==='specific'?'selected':''}>Specific month…</option>

          </select>

        ${pnlPreset==='year'? `<div style="width:140px"><label class="fl">Year</label><select onchange="pnlYearChange(this.value)">${years.map(y=>`<option value="${y}" ${y===pnlYear?'selected':''}>${y}</option>`).join('')}</select></div>`:''}
        ${pnlPreset==='custom'? `<div style="width:170px"><label class="fl">From</label><input type="date" value="${pnlFrom}" onchange="pnlFrom=this.value; renderPnL()"></div><div style="width:170px"><label class="fl">To</label><input type="date" value="${pnlTo}" onchange="pnlTo=this.value; renderPnL()"></div>`:''}
        <div class="mut" style="align-self:center;margin-left:auto">${esc(pnlFrom)} → ${esc(pnlTo)}</div>

    </div>
    <div class="panel"><h3>Income</h3><table><tbody>${incBody||'<tr><td class="empty" colspan="2">No income activity</td></tr>'}</tbody>
      <tfoot><tr><td>Total Income</td><td class="num mono g" style="font-size:15px">${money(incTotal)}</td></tr></tfoot></table></div>
    <div class="panel"><h3>Expenses</h3><table><thead><tr><th></th><th class="num">Budget</th><th class="num">Actual</th><th class="num">Variance</th></tr></thead>

/* ============================= PROVISIONS (recurring provision planner) ============================= */
function monthTag(ym){
  const [y,m] = ym.split('-').map(Number);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[m-1]+' - '+String(y).slice(-2)+"'";
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[m-1]+'-'+String(y).slice(-2);
}
function sortedMonthKeys(group){ return Object.keys(group.months||{}).sort(); }
// Provisions is a planning-only page — historical months are never useful to plan for, so
// every place the grid, validation, or exports gather this group's months uses this instead of
// the raw sortedMonthKeys(): current month through the Grid End Month setting only. Any data
// that already exists in a historical month is left untouched in storage — just not shown,
// validated, exported, or importable here.
function provisionsVisibleMonthKeys(group){
  const currentMonth = todayStr().slice(0,7);
  const endMonth = getGridEndMonth();
  return sortedMonthKeys(group).filter(k=>k>=currentMonth && k<=endMonth);
}
function provisionsExportMonthKeys(currentMonth){
  const months = [];
  let mk = currentMonth;
  let guard = 0;
  const endMonth = getGridEndMonth();
  while(mk<=endMonth && guard<2000){ months.push(mk); mk = nextMonthKeyPlain(mk); guard++; }
  return months;
}
function groupStatus(group){
  // Only count values belonging to lines that still exist — a deleted line's leftover values
  // (see removeProvisionLine) must never silently contribute to this check.
  const validLineIds = new Set(group.lines.map(l=>l.lineId));
  const keys = provisionsVisibleMonthKeys(group);
  for(const k of keys){
    const cell = group.months[k]||{};
    const vals = Object.entries(cell).filter(([lid,v])=>validLineIds.has(Number(lid)) && v!==''&&v!==null&&v!==undefined).map(([,v])=>v);
    if(!vals.length) continue;
    const sum = vals.reduce((s,v)=>s+roundCents(v),0);
    if(Math.abs(sum)>0.01) return {ok:false, badMonth:k, badSum:sum};
  }
  const unbalancedDup = findUnbalancedDuplicateAccounts(group);
  if(unbalancedDup.length){
    if(group.dupBalanceExempt) return {ok:true, duplicateInfo:unbalancedDup};
    return {ok:false, duplicateIssue:unbalancedDup};
  }
  return {ok:true};
}
// Whether a group has ANY account appearing on 2+ lines — used to decide whether the
// "duplicate lines don't need to net to zero" toggle is relevant to show at all.
function groupHasDuplicateAccounts(g){
  const accCounts = {};
  g.lines.forEach(l=>{ accCounts[l.acc] = (accCounts[l.acc]||0) + 1; });
  return Object.values(accCounts).some(n=>n>1);
}
function toggleDupBalanceExempt(gid, checked){
  if(blockIfSyncing()) return;
  const g = findProvisionGroup(gid); if(!g) return;
  g.dupBalanceExempt = !!checked;
  persistProvisionGroup(g);
  logActivity('action', (checked?'Exempted':'Un-exempted')+' duplicate-account balance check for provision group "'+g.name+'"');
  renderProvisionGroupsList();
}
function nextProvisionId(){ let m=0; D.provisionGroups.forEach(g=>{ if(g.id>m) m=g.id; }); return m+1; }
function nextLineId(g){ let m=100000; g.lines.forEach(l=>{ if((l.lineId||0)>=m) m=l.lineId+1; }); return m; }
// When the same account appears on 2+ lines within a group (an explicitly supported pattern —
// e.g. one line contributing TO a reserve, another line drawing it back DOWN), the running total
// across every month, across every line-instance of that account, should net to zero eventually.
// Returns [] if balanced, or a list of {acc, total} for each duplicated account that isn't.
function findUnbalancedDuplicateAccounts(g){
  ensureLineIds(g);
  const accCounts = {};
  g.lines.forEach(l=>{ accCounts[l.acc] = (accCounts[l.acc]||0) + 1; });
  const duplicateAccs = Object.keys(accCounts).filter(acc=>accCounts[acc]>1).map(Number);
  const unbalanced = [];
  duplicateAccs.forEach(acc=>{
    const lineIds = g.lines.filter(l=>l.acc===acc).map(l=>l.lineId);
    let total = 0;
    Object.values(g.months||{}).forEach(cell=>{
      lineIds.forEach(lid=>{
        const v = cell[lid];
        if(v!==undefined && v!==null && v!=='') total += roundCents(v);
      });
    });
    total = roundCents(total);
    if(Math.abs(total)>=0.01) unbalanced.push({acc, total});
  });
  return unbalanced;
}
function unbalancedDuplicateMessage(unbalanced){
  return unbalanced.map(u=>accShort(u.acc)+' ('+u.acc+'): running total '+money(u.total)+', not zero').join('\n');
}
function ensureLineIds(g){
  // backward compatibility: groups saved before duplicate-account support have no lineId —
  // their account number was already a safe unique key (duplicates weren't possible yet),
  // so falling back to it here needs no migration of the months data at all.
  g.lines.forEach(l=>{ if(l.lineId===undefined || l.lineId===null){ l.lineId = l.acc; } });
}
function findProvisionGroup(id){ const g = D.provisionGroups.find(g=>g.id===id); if(g) ensureLineIds(g); return g; }
async function persistProvisionGroup(g){
  const base = g.updated_at||null;
  persistLocal();
  await syncWrite('pd_provisions', 'upsert', {id:g.id, name:g.name, lines:g.lines, months:g.months, last_bulk_fill_months:g.lastBulkFillMonths||null, dup_balance_exempt:!!g.dupBalanceExempt}, base);
}

function exportProvisionsCSV(){
  const currentMonth = todayStr().slice(0,7);
  const months = provisionsExportMonthKeys(currentMonth);
  const rows = [];
  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    g.lines.forEach(line=>{
      rows.push({group:g.name, acc:line.acc, lineId:line.lineId, descr:(line.descrBase && line.descrBase!==accShort(line.acc))? line.descrBase : '', group_obj:g});
    });
  });
  if(!rows.length){ toast('No provision groups to export yet', true); return; }
  const header = ['Group','Account ID','Account Name','Line ID','Line Description', ...months];
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r=>{
    const row = [r.group, r.acc, accShort(r.acc), r.lineId, r.descr];
    months.forEach(mk=>{
      const cell = r.group_obj.months[mk];
      const v = cell? cell[r.lineId] : undefined;
      row.push(v!==undefined && v!==null? v : '');
    });
    lines.push(row.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = 'Provisions Grid - '+todayStr()+'.csv'; dl.click();
  toast('Exported '+rows.length.toLocaleString()+' provision line(s) to CSV');

}
async function handleProvisionsImport(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = csvToObjects(reader.result);
    inputEl.value = '';
    if(!rows.length){ toast('No rows found in that CSV', true); return; }
    await importProvisionsCSV(rows);
  };
  reader.readAsText(file);
}
async function importProvisionsCSV(rows){
  if(blockIfSyncing()) return;
  const startTime = Date.now();
  const currentMonth = todayStr().slice(0,7);
  const sampleKeys = Object.keys(rows[0]||{});
  const monthCols = sampleKeys.filter(k=>/^\d{4}-\d{2}$/.test(k) && k>=currentMonth);
  const lineIdCol = sampleKeys.find(k=>/^line[\s_]?id$/.test(k));
  const descrCol = sampleKeys.find(k=>/^line[\s_]?descr(iption)?$/.test(k));
  if(!confirm('Import '+rows.length+' rows? This can create new provision groups and lines for any Group/Account combination that doesn\'t already exist, and will overwrite planned amounts for '+monthCols.length+' month column(s) found ('+currentMonth+' onward — any historical month columns in the file are ignored).')) return;

  showImportProgress('Importing Provisions Grid…');
  let groupsCreated=0, linesCreated=0, valuesWritten=0, skipped=0;
  const touchedGroups = new Set();
  // Tracks, per (group, account), how many CSV rows for that combo we've already matched
  // to an existing line in THIS import run — lets duplicate-account rows (the documented
  // "one line builds a reserve, another draws it down" pattern) map 1st row -> 1st existing
  // line, 2nd row -> 2nd existing line, etc., only creating a new line once the CSV has more
  // rows for that account than there are existing lines. Only used as a fallback when the
  // CSV has no Line ID column (or a row's Line ID cell is blank/invalid).
  const occurrenceSeen = new Map();
  let processed=0;
  for(const r of rows){
    const groupName = (r['group']||'').trim();
    const accId = parseInt(r['account id']||r['account#']||r['account'],10);
    if(!groupName || !accId || !D.accounts.find(a=>a.id===accId)){ skipped++; processed++; continue; }
    let g = D.provisionGroups.find(x=>x.name.toLowerCase()===groupName.toLowerCase());
    if(!g){
      g = {id: nextProvisionId(), name: groupName, lines: [], months: {}};
      D.provisionGroups.push(g);
      groupsCreated++;
    }
    ensureLineIds(g);
    let line = null;
    const csvLineId = lineIdCol? parseInt(r[lineIdCol],10) : NaN;
    if(!isNaN(csvLineId)){
      const match = g.lines.find(l=>l.lineId===csvLineId);
      if(match && match.acc===accId){
        line = match;
      } else if(!match){
        line = {acc: accId, descrBase: accShort(accId), lineId: csvLineId};
        g.lines.push(line);
        linesCreated++;
      }
      // else: Line ID exists but belongs to a different account — fall through to
      // positional matching below rather than silently overwriting the wrong line.
    }
    if(!line){
      const key = g.id+':'+accId;
      const existingForAcc = g.lines.filter(l=>l.acc===accId);
      const seenSoFar = occurrenceSeen.get(key)||0;
      if(seenSoFar<existingForAcc.length){
        line = existingForAcc[seenSoFar];
      } else {
        line = {acc: accId, descrBase: accShort(accId), lineId: nextLineId(g)};
        g.lines.push(line);
        linesCreated++;
      }
      occurrenceSeen.set(key, seenSoFar+1);
    }
    if(descrCol!==undefined){
      const rawDescr = String(r[descrCol]||'').trim();
      line.descrBase = rawDescr || accShort(accId);
    }
    for(const mk of monthCols){
      const raw = r[mk];
      if(raw===undefined) continue;
      const clean = String(raw).replace(/,/g,'').trim();
      if(!g.months[mk]) g.months[mk] = {};
      if(clean===''){ delete g.months[mk][line.lineId]; }
      else { g.months[mk][line.lineId] = Number(clean); valuesWritten++; }
    }
    touchedGroups.add(g);
    processed++;
    updateImportProgress(processed, rows.length, 'Processing');
    if(processed % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
  }
  persistLocal();
  const syncOps = [...touchedGroups].map(g=>({table:'pd_provisions', kind:'upsert', row:{id:g.id, name:g.name, lines:g.lines, months:g.months, last_bulk_fill_months:g.lastBulkFillMonths||null, dup_balance_exempt:!!g.dupBalanceExempt}, base:g.updated_at||null}));
  if(syncOps.length){
    await syncWriteMany(syncOps, {concurrency:6, onProgress:(done,total)=>updateImportProgress(done,total,'Syncing to cloud')});
  }

  const elapsedSec = ((Date.now()-startTime)/1000).toFixed(1);
  let msg = 'Import complete: '+groupsCreated.toLocaleString()+' group(s) created, '+linesCreated.toLocaleString()+' line(s) created, '+valuesWritten.toLocaleString()+' month values written';
  msg += '\nTook '+elapsedSec+'s';
  if(skipped) msg += '\n'+skipped.toLocaleString()+' row(s) skipped (missing group/account, or account not found)';
  finishImportProgress(msg);
  renderProvisionGroupsList();
}
function combinedGenerateProvisionJV(){
  const monthKey = provisionsSelectedMonth;
  if(!monthKey){ toast('Pick a month first', true); return; }
  const allUnbalanced = [];
  D.provisionGroups.forEach(g=>{
    if(g.dupBalanceExempt) return;
    const u = findUnbalancedDuplicateAccounts(g);
    if(u.length) allUnbalanced.push({group:g.name, items:u});
  });
  if(allUnbalanced.length){
    const msg = allUnbalanced.map(x=>x.group+':\n'+unbalancedDuplicateMessage(x.items)).join('\n\n');
    toast('Can\'t generate — duplicate-account lines aren\'t balanced yet:\n'+msg, true);
    return;
  }
  const tag = monthTag(monthKey);
  const lines = [];
  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    const cell = g.months[monthKey];
    if(!cell) return;
    g.lines.forEach(line=>{
      const val = cell[line.lineId];
      if(val===undefined||val===null||val==='') return;
      lines.push({key:Math.random().toString(36).slice(2), acc:line.acc, descr: (line.descrBase||accShort(line.acc))+' - '+tag, amt: Number(val), _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
    });
  });
  if(lines.length<2){ toast('No provision groups have data for '+monthLabel(monthKey), true); return; }
  jvDraft = { date: monthKey+'-01', lines };
  jvReturnScreen = 'provisions';
  go('newjv');
  toast('Generated combined provision JV for '+monthLabel(monthKey)+' from every group with data that month — review and post');
}

function provCellKey(ev, gid, li, mi, monthCount){

  if(targetMi<0 || targetMi>=monthCount) return; // let native Tab move to the next control past the grid

  if(next){ next.focus(); next.select(); }

function monthsUntilGridEnd(fromKey){
  const end = getGridEndMonth();
  if(!fromKey || fromKey>end) return 0;
  const [y1,m1] = fromKey.split('-').map(Number);

  return (y2-y1)*12 + (m2-m1) + 1; // inclusive of both the starting month and the end month
}

function applyBulkFill(gid, li){
  if(blockIfSyncing()) return;
  const g = findProvisionGroup(gid); if(!g) return;
  const line = g.lines[li];
  const startMonth = document.getElementById('bfStartMonth').value;
  const amtRaw = document.getElementById('bfAmount').value;
  const count = parseInt(document.getElementById('bfMonthCount').value,10);
  const amt = Number(String(amtRaw).replace(/,/g,'').trim());
  if(!startMonth || isNaN(amt) || !count || count<1){ toast('Fill in a valid starting month, amount, and number of months', true); return; }
  let [y,m] = startMonth.split('-').map(Number);
  for(let i=0;i<count;i++){
    const key = y+'-'+String(m).padStart(2,'0');
    if(!g.months[key]) g.months[key] = {};
    g.months[key][line.lineId] = amt;
    m++; if(m>12){ m=1; y++; }
  }
  g.lastBulkFillMonths = count;
  persistProvisionGroup(g);
  closeModal();
  renderProvisionGroupsList();
  const unbalanced = g.dupBalanceExempt? [] : findUnbalancedDuplicateAccounts(g);
  if(unbalanced.length){
    toast('Filled '+count+' month(s) — heads up, duplicate-account lines in "'+g.name+'" don\'t net to zero yet:\n'+unbalancedDuplicateMessage(unbalanced), true);
  } else {
    toast('Filled '+count+' month(s) ✓');

}

function renderProvAcDrop(gid, q){

function provAccKey(ev, gid){
  const state = provPicker[gid]||{matches:[],hi:-1};
  const matches = state.matches||[];
  if(ev.key==='ArrowDown'){ if(matches.length){ ev.preventDefault(); state.hi=Math.min(matches.length-1,state.hi+1); provPicker[gid]=state; renderProvAcDrop(gid,''); } }
  else if(ev.key==='ArrowUp'){ if(matches.length){ ev.preventDefault(); state.hi=Math.max(0,state.hi-1); provPicker[gid]=state; renderProvAcDrop(gid,''); } }
  else if(ev.key==='Enter'){ ev.preventDefault(); if(matches.length && state.hi>=0){ provPickAcc(gid, matches[state.hi].id); } }
  else if(ev.key==='Escape'){ provCloseAcDrop(gid); }
}

/* ============================= JAMIAH (rotating group savings) ============================= */
// A Jamiah is a classic ROSCA: a fixed set of participants organized into groups, one group
// receiving the full pot each round while everyone keeps contributing every round. Contributions
// are tracked per-person by tagging real ledger transactions (in one chosen account) to whichever
// participant they belong to — nothing here posts or edits ledger data, it only tags it.
let jamiahDetailId = null;
let jamiahSetupExpanded = false;
function nextJamiahId(){ let m=0; D.jamiahs.forEach(j=>{ if(j.id>m) m=j.id; }); return m+1; }
function findJamiah(id){ return D.jamiahs.find(j=>j.id===id); }
function nextJamiahGroupId(j){ let m=0; j.groups.forEach(g=>{ if(g.id>m) m=g.id; }); return m+1; }
function nextJamiahParticipantId(j){ let m=0; j.participants.forEach(p=>{ if(p.id>m) m=p.id; }); return m+1; }
async function persistJamiah(j){
  const base = j.updated_at||null;
  persistLocal();
  await syncWrite('pd_jamiahs', 'upsert', {id:j.id, name:j.name, account:j.account, start_month:j.startMonth, duration_months:j.durationMonths, groups:j.groups, participants:j.participants, round_group:j.roundGroup, tags:j.tags}, base);
}
function jamiahRounds(j){
  const rounds = [];
  if(!j.startMonth) return rounds;
  let [y,m] = j.startMonth.split('-').map(Number);
  for(let i=0;i<(j.durationMonths||0);i++){
    rounds.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return rounds;
}
function realEstateAllLinkedAccounts(){
  // {account, building, kind} for every apartment/expense account linked to any building
  const rows = [];
  D.realEstateBuildings.forEach(b=>{
    b.apartmentAccountIds.forEach(id=>{ const a=D.accounts.find(x=>x.id===id); if(a) rows.push({account:a, building:b, kind:'Apartment'}); });
    b.expenseAccountIds.forEach(id=>{ const a=D.accounts.find(x=>x.id===id); if(a) rows.push({account:a, building:b, kind:'Expense'}); });
  });
  return rows;
}
function exportRealEstateCSV(){
  const currentMonth = todayStr().slice(0,7);
  const linked = realEstateAllLinkedAccounts();
  if(!linked.length){ toast('No buildings with linked accounts yet', true); return; }
  const months = forecastExportMonthKeys(currentMonth);
  const header = ['Account ID','Account Name','Building','Type','Current Balance', ...months];
  const lines = [header.map(csvEscape).join(',')];
  linked.forEach(({account:a, building:b, kind})=>{
    const row = [a.id, accShort(a.id), b.name, kind, accountBalance(a.id)];
    months.forEach(mk=>{
      row.push(mk<=currentMonth ? forecastActual(a.id, mk) : computeForecastCell(a, mk, currentMonth).plan);
    });
    lines.push(row.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = 'Real Estate Grid - '+todayStr()+'.csv'; dl.click();
  toast('Exported '+linked.length.toLocaleString()+' accounts to CSV');
  logActivity('action', 'Exported Real Estate Grid CSV ('+linked.length+' accounts across '+D.realEstateBuildings.length+' buildings)');
}
async function handleRealEstateImport(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = csvToObjects(reader.result);

}
async function importRealEstateCSV(rows){
  if(blockIfSyncing()) return;
  const startTime = Date.now();
  const currentMonth = todayStr().slice(0,7);
  const linkedIds = new Set(realEstateAllLinkedAccounts().map(r=>r.account.id));
  const sampleKeys = Object.keys(rows[0]||{});
  const monthCols = sampleKeys.filter(k=>/^\d{4}-\d{2}$/.test(k) && k>currentMonth);
  if(!confirm('Import '+rows.length+' rows? This will replace future planned amounts ('+monthCols.length+' future month columns detected) for every matched, building-linked account. Historical/current-month columns are always ignored, and rows for accounts not linked to a building are skipped.')) return;

  showImportProgress('Importing Real Estate Grid…');
  let matched=0, unmatched=0, notLinked=0, planWritten=0; const mismatches=[];
  let processed=0;
  for(const r of rows){
    const id = parseInt(r['account id']||r['account#']||r['account'],10);
    const a = D.accounts.find(x=>x.id===id);
    if(!a){ unmatched++; processed++; continue; }
    if(!linkedIds.has(id)){ notLinked++; processed++; continue; }
    matched++;
    for(const mk of monthCols){
      const raw = r[mk];
      if(raw===undefined) continue;
      const cell = computeForecastCell(a, mk, currentMonth);
      const clean = String(raw).replace(/,/g,'').trim();
      if(cell.editable){
        if(clean===''){ if(D.forecastPlans[a.id]) delete D.forecastPlans[a.id][mk]; }
        else { if(!D.forecastPlans[a.id]) D.forecastPlans[a.id]={}; D.forecastPlans[a.id][mk] = Number(clean); }
        planWritten++;
      } else if(clean!=='' && Math.abs(Number(clean)-Number(cell.plan||0))>0.01){
        mismatches.push({acc:a.id, name:accShort(a.id), month:mk, imported:Number(clean), computed:cell.plan});
      }
    }
    processed++;
    updateImportProgress(processed, rows.length, 'Processing');
    if(processed % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
  }
  persistLocal();
  await syncWrite('pd_forecast_plans', 'upsert', {id:1, plans:D.forecastPlans}, null);

  const elapsedSec = ((Date.now()-startTime)/1000).toFixed(1);
  let msg = 'Import complete: '+matched.toLocaleString()+' matched, '+planWritten.toLocaleString()+' month values written';
  msg += '\nTook '+elapsedSec+'s';
  if(unmatched) msg += '\n'+unmatched.toLocaleString()+' row(s) skipped (no matching account)';
  if(notLinked) msg += '\n'+notLinked.toLocaleString()+' row(s) skipped (account not linked to a building)';
  if(mismatches.length){
    const list = mismatches.slice(0,25).map(m=>`${m.name} (${m.acc}) — ${monthLabel(m.month)}: imported ${money(m.imported)}, kept computed ${money(m.computed)}`).join('\n');
    msg += '\n\n⚠ '+mismatches.length+' locked/computed cell(s) didn\'t match — kept the computed value:\n'+list+(mismatches.length>25?`\n…and ${mismatches.length-25} more.`:'');
  }
  finishImportProgress(msg);
  renderRealEstatePage();
}

function jamiahPaidByPartRound(j){

const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_MONTHS_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// ===== Arabic Settlement Statement — translation engine =====
// Layer 3 fallback: a free, keyless, CORS-friendly translation API. Quality is decent but not
// great — every AI-sourced line is flagged for review in the statement UI, never sent silently.
async function aiTranslateToArabic(text){
  try{
    const res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|ar');
    if(!res.ok) return null;
    const data = await res.json();
    return data?.responseData?.translatedText || null;
  }catch(e){ return null; }
}
// Applies your saved name spellings (Settings → Name Translations) as a find-and-replace pass,
// so names come out correctly regardless of which layer translated the surrounding sentence.
function applyNameTranslations(text){
  let result = text;
  Object.entries(D.nameTranslations||{}).forEach(([en,ar])=>{
    if(!en || !ar) return;
    const re = new RegExp('\\b'+en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    result = result.replace(re, ar);
  });
  return result;
}
// Strips a trailing month-tag (e.g. "- Jul 26'" or "- Jul - 26'") off a description, translating
// it separately with Arabic month names, so the pattern/learned-dictionary lookups below match
// against the stable base text regardless of which month it happened to be posted in.
function splitDescrMonthTag(descr){
  const m = String(descr).match(/\s*-\s*([A-Za-z]{3})\s*-?\s*(\d{2})'?\s*$/);
  if(!m) return {base: descr, arTag: ''};
  const idx = AR_MONTHS_ABBR.findIndex(mo=>mo.toLowerCase()===m[1].toLowerCase());
  if(idx<0) return {base: descr, arTag: ''};
  return {base: descr.slice(0, m.index).trim(), arTag: ' - '+AR_MONTHS[idx]+' '+m[2]};
}
// Layer 2: a small set of common recurring transaction phrasings, seeded from real usage. $1/$2
// are the captured English fragments (typically names), fixed up afterward by applyNameTranslations.
const ITEM_WORD_AR = {phone:'هاتف', laptop:'لابتوب', device:'جهاز'};
const DESCR_PATTERNS = [

// Full translation pipeline for one description: learned dictionary -> pattern rules -> AI fallback.
// Synchronous where possible; only calls the network if genuinely nothing else matched.
async function translateDescriptionToArabic(descr){
  const {base, arTag} = splitDescrMonthTag(descr||'');
  const normalized = base.trim().toLowerCase();
  if(!normalized) return {text:'', source:'empty'};
  if(D.descrTranslations[normalized]){
    return {text: applyNameTranslations(D.descrTranslations[normalized])+arTag, source:'learned'};
  }
  for(const pat of DESCR_PATTERNS){
    const m = base.match(pat.re);
    if(m){
      let result = pat.ar;
      for(let i=1;i<m.length;i++){
        let piece = m[i]||'';
        if(pat.wordMap && pat.wordMap[i]==='item') piece = ITEM_WORD_AR[piece.toLowerCase()] || piece;
        result = result.split('$'+i).join(piece);
      }
      return {text: applyNameTranslations(result)+arTag, source:'pattern'};
    }
  }
  const ai = await aiTranslateToArabic(base);
  if(ai) return {text: applyNameTranslations(ai)+arTag, source:'ai'};
  return {text: base+arTag, source:'failed'}; // couldn't translate at all — show original, let the person fix it manually
}
// Called when the person edits an AI-translated (or failed) line in the statement review screen
// and confirms it — grows the learned dictionary so the same phrase doesn't need AI help again.
async function learnDescrTranslation(originalDescr, correctedArabicFull){
  const {base, arTag} = splitDescrMonthTag(originalDescr||'');
  const normalized = base.trim().toLowerCase();
  if(!normalized) return;
  // Strip the (already-appended) Arabic month tag back off before storing, so the dictionary
  // entry generalizes across months rather than being locked to this one specific month.
  let toStore = correctedArabicFull;
  if(arTag && toStore.endsWith(arTag)) toStore = toStore.slice(0, -arTag.length).trim();
  D.descrTranslations[normalized] = toStore;
  persistLocal();
  await syncWrite('pd_descr_translations', 'upsert', {id:1, translations:D.descrTranslations}, null);
}

// ===== Section-order drag reordering — Pointer Events (unlike native HTML5 drag-and-drop,
// Pointer Events work reliably on iOS/Android touch, which is why this replaces Move Up/Down
// without reintroducing the mobile-reliability problem that motivated those buttons originally) =====
let sectionDrag = null;
function startSectionDrag(e){
  e.preventDefault();
  const item = e.currentTarget.closest('.section-order-item');
  const list = document.getElementById('forecastSectionOrderList');
  if(!item || !list) return;
  sectionDrag = {item, list, startY: e.clientY};
  item.style.position = 'relative';
  item.style.zIndex = '10';
  item.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
  if(item.setPointerCapture) item.setPointerCapture(e.pointerId);
  document.addEventListener('pointermove', onSectionDragMove);
  document.addEventListener('pointerup', onSectionDragEnd, {once:true});
}
function onSectionDragMove(e){
  if(!sectionDrag) return;
  const dy = e.clientY - sectionDrag.startY;
  sectionDrag.item.style.transform = `translateY(${dy}px)`;
  const siblings = Array.from(sectionDrag.list.children).filter(el=>el!==sectionDrag.item);
  const draggedRect = sectionDrag.item.getBoundingClientRect();
  const draggedMid = draggedRect.top + draggedRect.height/2;
  for(const sib of siblings){
    const r = sib.getBoundingClientRect();
    const mid = r.top + r.height/2;
    if(draggedMid < mid && sib.previousElementSibling !== sectionDrag.item){
      sectionDrag.list.insertBefore(sectionDrag.item, sib);
      break;
    } else if(draggedMid > mid && sib===siblings[siblings.length-1] && sib.nextElementSibling !== sectionDrag.item){
      sectionDrag.list.insertBefore(sectionDrag.item, sib.nextSibling);
      break;
    }
  }
}
function onSectionDragEnd(){
  if(!sectionDrag) return;
  document.removeEventListener('pointermove', onSectionDragMove);
  sectionDrag.item.style.transform = '';
  sectionDrag.item.style.position = '';
  sectionDrag.item.style.zIndex = '';
  sectionDrag.item.style.boxShadow = '';
  const newOrder = Array.from(sectionDrag.list.children).map(el=>el.dataset.key);
  setForecastSectionOrderList(newOrder);
  sectionDrag = null;
}

// Real Estate has its own label/month column widths (not the Forecast page's shared constant)
// so widening the account-name column here doesn't affect the Forecast Cash Position panel.
const RE_LABEL_COL_WIDTH = 260;
const RE_MONTH_COL_WIDTH = 90; // narrower than Forecast's — whole numbers only, no decimals here
const FORECAST_INFLOW_CATS  = ['income','invest_income_st','invest_income_lt','asset_st','asset_lt'];
const FORECAST_OUTFLOW_CATS = ['expense','invest_expense_st','invest_expense_lt','liability_st','liability_lt','provision','accrual'];
// Behaviors offered for user-defined custom categories (Settings → Custom Categories). 'autoclear'
// is tightly coupled to the Bank Account clearing system, so it's deliberately not offered here —
// that stays built-in-only for now.
const CUSTOM_CATEGORY_BEHAVIORS = ['manual','manual_or_provision','expense','provision'];
// Merges D.customForecastCategories into the same shared registries the built-in categories
// live in (FORECAST_CATEGORIES, FORECAST_INFLOW_CATS/OUTFLOW_CATS) — this is the ONE integration
// point. Everything else (Cash Position rows, Forecast Grid sections, the account category
// picker, sign-reversal settings, computeForecastCell's behavior dispatch) already reads these
// three dynamically, so a custom category behaves identically to a built-in one everywhere,
// with no other code changes needed. Call after data loads, and after any add/edit/delete.
let _syncedCustomCategoryKeys = [];
function syncCustomForecastCategories(){
  _syncedCustomCategoryKeys.forEach(k=>{
    delete FORECAST_CATEGORIES[k];
    let idx = FORECAST_INFLOW_CATS.indexOf(k); if(idx>=0) FORECAST_INFLOW_CATS.splice(idx,1);
    idx = FORECAST_OUTFLOW_CATS.indexOf(k); if(idx>=0) FORECAST_OUTFLOW_CATS.splice(idx,1);
  });
  _syncedCustomCategoryKeys = [];
  (D.customForecastCategories||[]).forEach(c=>{
    FORECAST_CATEGORIES[c.key] = {label:c.label, behavior:c.behavior, custom:true};
    (c.direction==='inflow'? FORECAST_INFLOW_CATS : FORECAST_OUTFLOW_CATS).push(c.key);
    _syncedCustomCategoryKeys.push(c.key);
  });
}
// Per-category display sign flip for the Cash Position panel — a local display preference (not
// synced), configured in Forecast Settings. Deliberately flows through into every downstream total
// (Total Inflows/Outflows, Cash Change, Closing Balance) per explicit instruction — so when any
// flip is active, Closing Balance may no longer equal your real bank balance, by design.
function getForecastSignFlips(){
  try{ const v = JSON.parse(localStorage.getItem('forecastSignFlips')||'{}'); return (v && typeof v==='object')? v : {}; }catch(e){ return {}; }
}
function setForecastSignFlip(catKey, flipped){
  const flips = getForecastSignFlips();
  if(flipped) flips[catKey] = true; else delete flips[catKey];
  const ok = safeSetItem('forecastSignFlips', JSON.stringify(flips));
  if(!ok) toast('Could not save that — your browser\'s local storage is full. This change did not stick.', true);
}
function categorySignMultiplier(catKey){ return getForecastSignFlips()[catKey] ? -1 : 1; }
function anyForecastSignFlipActive(){ return Object.keys(getForecastSignFlips()).length>0; }
function renderForecastSignFlipList(){
  const flips = getForecastSignFlips();
  const cats = [...FORECAST_INFLOW_CATS, ...FORECAST_OUTFLOW_CATS];
  return cats.map(key=>`
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;cursor:pointer">
      <input type="checkbox" class="chk" ${flips[key]?'checked':''} onchange="setForecastSignFlip('${key}', this.checked); renderForecastSettingsPage()"> ${esc(FORECAST_CATEGORIES[key].label)} ${flips[key]?'<span class="badge neg">reversed</span>':''}
    </label>`).join('');
}
function bankBalanceAsOf(asOfDate){
  const ids = new Set(D.accounts.filter(a=>a.category==='Bank Accounts' && a.id!==10199).map(a=>a.id));
  return sumAcc(l=>ids.has(l.acc), undefined, asOfDate);
}
function forecastCategoryAccounts(catKey){
  return forecastableAccounts().filter(a=>getForecastCategory(a)===catKey);
}
// This month's plan-or-actual flow for every account tagged with this forecast category — same
// plan/actual fallback used everywhere else on the Forecast page. Sign-flip applies to the WHOLE
// row (historical, current month, and future) uniformly, per explicit instruction — not just the
// future portion.
function categoryMonthFlow(catKey, monthKey, currentMonth){
  let sum = 0;
  forecastCategoryAccounts(catKey).forEach(a=>{
    // Inactive accounts are hidden from the Forecast page and don't contribute to current/future
    // totals — but their real historical activity (before they went inactive) stays counted in
    // past totals for accuracy.
    if(monthKey>=currentMonth && a.status==='Inactive') return;
    const c = computeForecastCell(a, monthKey, currentMonth);
    const val = c.plan!==null? c.plan : (monthKey<currentMonth? c.actual : 0);
    sum += Number(val)||0;
  });
  return sum * categorySignMultiplier(catKey);
}
function earliestLedgerMonth(){
  if(!D.ledger.length) return todayStr().slice(0,7);
  return D.ledger.reduce((min,l)=> l.date<min?l.date:min, todayStr()).slice(0,7);
}
// Closing Balance = Starting + Inflow + Outflow, chained uniformly from the earliest real ledger
// month all the way through whichever month is needed — for EVERY month, not just future ones
// (Option B, chosen explicitly: simpler, but means a category's sign flip now visibly affects
// every column including historical/current, and if your categorization has any gaps, Closing
// Balance can differ slightly from your real bank balance even with no flips active — see the
// month-by-month discrepancy row on the panel itself).
function computeMonthlyCashFlowPure(months, currentMonth){
  const anchorMonth = earliestLedgerMonth();
  const trueAnchorBalance = 0; // nothing predates the earliest-ever ledger entry, by definition
  const chain = {};
  function computeMonth(monthKey, priorClosing){
    const subrows = {};
    [...FORECAST_INFLOW_CATS, ...FORECAST_OUTFLOW_CATS].forEach(c=>{ subrows[c] = categoryMonthFlow(c, monthKey, currentMonth); });
    const inflow = FORECAST_INFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const outflow = FORECAST_OUTFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const starting = priorClosing;
    const change = inflow+outflow;
    return {starting, inflow, outflow, change, closing: starting+change, subrows};
  }
  chain[anchorMonth] = computeMonth(anchorMonth, trueAnchorBalance);
  const maxNeeded = months.filter(m=>m>anchorMonth).sort().pop();
  if(maxNeeded){
    let mk = anchorMonth, guard = 0;
    while(mk < maxNeeded && guard<1200){
      const nextMk = nextMonthKeyPlain(mk);
      chain[nextMk] = computeMonth(nextMk, chain[mk].closing);
      mk = nextMk; guard++;
    }
  }
  return months.map(m=>{
    if(chain[m]) return {month:m, ...chain[m]};
    // a requested month before any real ledger history exists — nothing to show
    return {month:m, starting:0, inflow:0, outflow:0, change:0, closing:0, subrows:Object.fromEntries([...FORECAST_INFLOW_CATS,...FORECAST_OUTFLOW_CATS].map(c=>[c,0]))};
  });
}
// Toggle: re-anchors the current month's Starting Balance to your real ledger balance (as of the
// end of last month), then re-chains current + every future month forward from that real number —
// so future projections build on solid ground even if older historical months have categorization
// gaps. Past months are always left exactly as the pure chain shows them, untouched, so you can
// still see and diagnose where discrepancies originate. Default ON.
function getCashPositionAnchorToActual(){
  const v = localStorage.getItem('cashPositionAnchorToActual');
  return v===null ? true : v==='true';
}
function setCashPositionAnchorToActual(v){
  safeSetItem('cashPositionAnchorToActual', v?'true':'false');
}
function computeMonthlyCashFlow(months, currentMonth){
  const pureRows = computeMonthlyCashFlowPure(months, currentMonth);
  if(!getCashPositionAnchorToActual()) return pureRows;
  const realAnchor = bankBalanceAsOf(monthRange(prevMonthKey(currentMonth))[1]);
  const anchoredChain = {};
  function anchoredMonth(monthKey, priorClosing){
    const subrows = {};
    [...FORECAST_INFLOW_CATS, ...FORECAST_OUTFLOW_CATS].forEach(c=>{ subrows[c] = categoryMonthFlow(c, monthKey, currentMonth); });
    const inflow = FORECAST_INFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const outflow = FORECAST_OUTFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const change = inflow+outflow;
    return {starting:priorClosing, inflow, outflow, change, closing:priorClosing+change, subrows};
  }
  anchoredChain[currentMonth] = anchoredMonth(currentMonth, realAnchor);
  const maxNeeded = months.filter(m=>m>currentMonth).sort().pop();
  if(maxNeeded){
    let mk = currentMonth, guard=0;
    while(mk < maxNeeded && guard<1200){
      const nextMk = nextMonthKeyPlain(mk);
      anchoredChain[nextMk] = anchoredMonth(nextMk, anchoredChain[mk].closing);
      mk = nextMk; guard++;
    }
  }
  return months.map((m,i) => {
    if(m < currentMonth) return pureRows[i]; // past stays exactly as the pure chain shows it
    return {month:m, ...anchoredChain[m]};
  });
}
function renderCashFlowPanel(months, currentMonth){
  const rows = computeMonthlyCashFlow(months, currentMonth);
  const anchored = getCashPositionAnchorToActual();
  const catRow = (catKey) => `<tr><td class="mut click" style="padding-left:10px;cursor:pointer" onclick="jumpToForecastSection('${catKey}')" title="Jump to this section below">${esc(FORECAST_CATEGORIES[catKey].label)}${categorySignMultiplier(catKey)===-1?' <span class="badge neg" style="font-size:9px">reversed</span>':''}</td>${rows.map(r=>`<td class="num mono ${moneyClass(r.subrows[catKey])}">${money0(r.subrows[catKey])}</td>`).join('')}</tr>`;
  const signWarning = anyForecastSignFlipActive()? `<div class="mut" style="font-size:11.5px;margin-bottom:8px;color:var(--red)">⚠ One or more categories have a reversed sign convention active (Forecast Settings → Cash Position Sign Conventions) — this affects every column for that category, historical and current included, and flows through to Closing Balance.</div>` : '';
  return `<div class="panel" style="overflow-x:auto">
    <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">💰 Bank Accounts — Projected Cash Position</h3>
      <label class="noprint" style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;font-weight:normal">
        <input type="checkbox" class="chk" ${anchored?'checked':''} onchange="setCashPositionAnchorToActual(this.checked); renderForecastBody()">
        Anchor current month to real balance
      </label>
    </div>
    <div class="mut" style="font-size:11.5px;margin:6px 0 8px">${anchored
      ? 'Current month\'s Starting Balance is your real ledger balance as of the end of last month — current and future months build forward from there. Past months still show the pure chain, untouched, so you can spot where any gap originates.'
      : 'Every month here is Starting + Inflows + Outflows, chained from your earliest ledger activity, with no correction for any historical gaps.'}
      Click any month's total for a full cash-flow breakdown. Numbers are rounded to whole units here — the export keeps full decimal precision.</div>
    ${signWarning}
    <table style="min-width:${FORECAST_LABEL_COL_WIDTH+months.length*FORECAST_MONTH_COL_WIDTH}px;table-layout:fixed">
      <colgroup><col style="width:${FORECAST_LABEL_COL_WIDTH}px">${months.map(()=>`<col style="width:${FORECAST_MONTH_COL_WIDTH}px">`).join('')}</colgroup>
      <thead><tr><th></th>${months.map(m=>`<th class="num" style="${m===currentMonth?'background:var(--chip)':''}">${esc(monthLabel(m))}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Month Cash Starting Balance</td>${rows.map(r=>`<td class="num mono ${moneyClass(r.starting)}">${money0(r.starting)}</td>`).join('')}</tr>
        ${FORECAST_INFLOW_CATS.map(catRow).join('')}
        <tr style="font-weight:700;background:#e8f5e9"><td>Total Monthly Inflows</td>${rows.map(r=>`<td class="num mono ${moneyClass(r.inflow)}">${money0(r.inflow)}</td>`).join('')}</tr>
        ${FORECAST_OUTFLOW_CATS.map(catRow).join('')}
        <tr style="font-weight:700;background:#ffebee"><td>Total Monthly Outflows</td>${rows.map(r=>`<td class="num mono ${moneyClass(r.outflow)}">${money0(r.outflow)}</td>`).join('')}</tr>
        <tr style="font-weight:700"><td>Monthly Cash Change</td>${rows.map(r=>`<td class="num mono ${moneyClass(r.change)}">${money0(r.change)}</td>`).join('')}</tr>
        <tr style="font-weight:700;background:var(--chip)"><td>Closing Balance</td>${rows.map(r=>`<td class="num mono ${moneyClass(r.closing)} click" style="cursor:pointer" onclick="openCashPositionBreakdown('${r.month}')">${money0(r.closing)}</td>`).join('')}</tr>
      </tbody>
    </table>
  </div>`;
}
function renderForecastCell(a, m, currentMonth, noDecimals, opts){
  opts = opts || {};
  const sign = opts.reverse? -1 : 1;
  const fmt = noDecimals? money0 : money;
  const c = computeForecastCell(a, m, currentMonth);
  const isInactive = a.status==='Inactive';
  const cellBg = m===currentMonth? 'background:var(--chip)' : '';
  const dPlan = (c.plan!==null && c.plan!==undefined)? c.plan*sign : null;
  const dActual = c.actual*sign;
  const dVariance = (c.variance!==null && c.variance!==undefined)? c.variance*sign : null;
  const title = isInactive? 'Account is inactive — no forecast input possible' : 'Plan: '+(dPlan!==null?fmt(dPlan):'—')+' | Actual: '+fmt(dActual)+(dVariance!==null?' | Variance: '+fmt(dVariance):'');
  if(isInactive){
    return `<td class="num mut" style="${cellBg};opacity:0.45" title="${esc(title)}">${dPlan!==null?fmt(dPlan):'—'}</td>`;
  }
  if(c.editable && !opts.readOnly){
    const raw = (c.plan!==null && c.plan!==undefined)? c.plan*sign : '';
    const displayFmt = noDecimals? (v=>v===''?'':money0(v)) : fmt2;
    return `<td class="num" style="${cellBg}" title="${esc(title)}"><input type="text" inputmode="decimal" class="num" style="width:100px" value="${raw!==''?displayFmt(raw):''}" placeholder="—" data-raw="${raw}"
      onfocus="this.value=this.dataset.raw" onblur="setManualPlan(${a.id},'${m}',this.value===''?'':(Number(String(this.value).replace(/,/g,''))*(${sign})))"></td>`;
  }
  let badge = c.conflict? ` <span class="badge neg click" title="Provisions and Budget disagree — click to resolve" onclick="openForecastConflictResolver(${a.id},'${m}')">⚠</span>` : '';
  let provTag = (c.source==='provisions')? ` <span class="badge pos click" title="Sourced from Provisions — click to open" onclick="openProvisionSourceFor(${a.id},'${m}')">P</span>` : '';
  let smartTag = (c.source==='smart_rule')? ` <span class="badge click" style="background:rgba(154,107,31,0.18);color:var(--accent)" title="Smart Rule: ${esc(c.smartRuleName||'')} — edit in Settings → Smart Rules" onclick="goSmartRulesSettings()">R</span>` : '';
  let budgetTag = (c.source==='budget'||c.source==='budget-empty')? ` <span class="badge click" style="background:rgba(154,107,31,0.18);color:var(--accent)" title="${c.source==='budget'?'Sourced from Budget':'No Budget entry yet'} — click to edit on the Budget page" onclick="jumpToBudgetPage(${a.id},'${m}')">B</span>` : '';
  return `<td class="num mono" style="${cellBg}" title="${esc(title)}">${dPlan!==null?fmt(dPlan):'<span class="mut">—</span>'}${badge}${provTag}${budgetTag}${smartTag}</td>`;
}
function jumpToForecastSection(catKey){
  const collapsed = getForecastCollapsedSections();
  const idx = collapsed.indexOf(catKey);
  if(idx>=0){
    collapsed.splice(idx,1);
    safeSetItem('forecastCollapsedSections', JSON.stringify(collapsed));
    renderForecastBody();
  }
  requestAnimationFrame(()=>{
    const el = document.getElementById('forecastSection_'+catKey);
    if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
}
function getForecastSectionOrder(){
  const allKeys = Object.keys(FORECAST_CATEGORIES).filter(k=>k!=='ignore');
  try{
    const saved = JSON.parse(localStorage.getItem('forecastSectionOrder')||'[]');
    const merged = saved.filter(k=>allKeys.includes(k));
    allKeys.forEach(k=>{ if(!merged.includes(k)) merged.push(k); });
    return merged;
  }catch(e){ return allKeys; }
}
function setForecastSectionOrderList(order){ safeSetItem('forecastSectionOrder', JSON.stringify(order)); }
function getForecastCollapsedSections(){
  try{ return JSON.parse(localStorage.getItem('forecastCollapsedSections')||'[]'); }catch(e){ return []; }
}
function toggleForecastSectionCollapse(catKey){
  const collapsed = getForecastCollapsedSections();
  const idx = collapsed.indexOf(catKey);
  if(idx>=0) collapsed.splice(idx,1); else collapsed.push(catKey);
  safeSetItem('forecastCollapsedSections', JSON.stringify(collapsed));
  renderForecastBody();
}
function renderForecastCategorySection(catKey, catDef, accs, months, currentMonth){
  const collapsed = getForecastCollapsedSections().includes(catKey);
  const reversed = categorySignMultiplier(catKey)===-1;
  // Totals go through categoryMonthFlow so this section's Total row always matches the Cash Flow
  // panel exactly, including the same Inactive-account handling (excluded from current/future
  // months, still counted in real past months for historical accuracy).
  const totals = months.map(m=>categoryMonthFlow(catKey, m, currentMonth) * (reversed?-1:1));
  // Inactive accounts are hidden from the Forecast page entirely — they don't show as a row, and
  // their current balance doesn't contribute to the Current Balance total shown here.
  const visibleAccs = accs.filter(a=>a.status!=='Inactive');
  const balanceTotal = visibleAccs.reduce((s,a)=>s+accountBalance(a.id),0) * (reversed?-1:1);
  return `<div class="panel" style="overflow-x:auto" id="forecastSection_${catKey}">
    <div class="row click" style="cursor:pointer" onclick="toggleForecastSectionCollapse('${catKey}')">
      <h3 style="margin:0">${esc(catDef.label)}${reversed?' <span class="badge neg" style="font-size:9px">reversed</span>':''}</h3>
      <span class="mut" style="font-size:12px">${collapsed?'▸ Expand':'▾ Collapse'}</span>
    </div>
    <table style="min-width:${FORECAST_LABEL_COL_WIDTH+months.length*FORECAST_MONTH_COL_WIDTH}px;margin-top:8px;table-layout:fixed">
      <colgroup><col style="width:${FORECAST_ACCOUNT_COL_WIDTH}px"><col style="width:${FORECAST_BALANCE_COL_WIDTH}px">${months.map(()=>`<col style="width:${FORECAST_MONTH_COL_WIDTH}px">`).join('')}</colgroup>
      <thead><tr><th>Account</th><th class="num">Current Balance</th>${months.map(m=>`<th class="num" style="${m===currentMonth?'background:var(--chip)':''}">${esc(monthLabel(m))}</th>`).join('')}</tr></thead>
      <tbody>${collapsed? '' : visibleAccs.map(a=>`<tr>
        <td><span class="click" style="cursor:pointer" onclick="openAccountStatsPopup(${a.id})" title="Click for historical averages">${esc(accShort(a.id))}</span></td>
        <td class="num mono">${money0(accountBalance(a.id) * (reversed?-1:1))}</td>
        ${months.map(m=>renderForecastCell(a, m, currentMonth, true, {reverse:reversed})).join('')}
      </tr>`).join('')}</tbody>
      <tfoot><tr style="font-weight:700">
        <td>Total</td><td class="num mono">${money0(balanceTotal)}</td>
        ${totals.map(t=>`<td class="num mono ${moneyClass(t)}">${money0(t)}</td>`).join('')}
      </tr></tfoot>
    </table>
  </div>`;
}
// Keeps every horizontally-scrollable table on the Forecast page (Cash Position + each category
// section) locked to the same scroll position, so columns for the same month always line up
// visually across the whole page, no matter which panel you actually grab to scroll.
function syncForecastScrollContainers(){
  const body = document.getElementById('forecastBody');
  if(!body) return;
  const containers = Array.from(body.querySelectorAll('.panel')).filter(p=>p.style.overflowX==='auto');
  let syncing = false;
  containers.forEach(c=>{
    c.addEventListener('scroll', ()=>{
      if(syncing) return;
      syncing = true;
      containers.forEach(other=>{ if(other!==c) other.scrollLeft = c.scrollLeft; });
      syncing = false;
    });
  });
}
function renderForecastBody(){
  const el = document.getElementById('forecastBody');
  if(!el) return;
  beginForecastFastPath();
  try{
    const months = forecastMonthsWindow();
    const currentMonth = todayStr().slice(0,7);
    const accs = forecastableAccounts().filter(a=>{ const c=getForecastCategory(a); return c && c!=='ignore'; });
    const byCat = {};
    accs.forEach(a=>{ const cat=getForecastCategory(a); (byCat[cat] ??= []).push(a); });
    const order = getForecastSectionOrder().filter(k=>byCat[k] && byCat[k].length);

    el.innerHTML = `
      <div class="panel noprint row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div class="row">
          <button class="btn ghost sm" onclick="forecastShiftWindow(-1)">‹ Prev</button>
          <div class="mono" style="padding:0 10px">${esc(monthLabel(months[0]))} → ${esc(monthLabel(months[months.length-1]))}</div>
          <button class="btn ghost sm" onclick="forecastShiftWindow(1)">Next ›</button>
        </div>
        <div class="row">
          <input type="month" id="forecastJumpInput" value="${forecastWindowStart}">
          <button class="btn ghost sm" onclick="forecastJumpToMonth()">Jump to month</button>
          <button class="btn ghost sm" onclick="forecastJumpToday()">Jump to current month</button>
        </div>
      </div>
      ${renderCashFlowPanel(months, currentMonth)}
      ${order.map(key=>renderForecastCategorySection(key, FORECAST_CATEGORIES[key], byCat[key], months, currentMonth)).join('') || '<div class="panel empty">No accounts categorized yet — open ⚙ Forecast Settings above to assign categories.</div>'}
    `;
    syncForecastScrollContainers();
  } finally {
    endForecastFastPath();
  }
}

function allocatableAccountsWithData(){

function createBalancingJV(acc){
  const accSelected = [...allocSelected].filter(id=>{ const l=D.ledger.find(x=>x.id===id); return l && l.acc===acc; });
  const selSum = accSelected.reduce((s,id)=>{ const l=D.ledger.find(x=>x.id===id); return s+(l?Number(l.amt):0); },0);
  const needed = Math.round(-selSum*100)/100;
  resetJVDraft();
  jvDraft.lines[0].acc = acc;
  jvDraft.lines[0].amt = needed;
  jvDraft.lines[0].descr = 'Balance allocation for '+accShort(acc);
  reconcileAcc = null;
  jvReturnScreen = 'alloc';
  go('newjv');
  toast('Prefilled a line for '+accShort(acc)+' ('+money(needed)+') to balance your selection — add the offsetting account and post');
}
function selectAllForAccount(acc){
  const items = unallocItems().filter(l=>l.acc===acc);
  const allSelected = items.length>0 && items.every(l=>allocSelected.has(l.id));
  if(allSelected){
    items.forEach(l=>allocSelected.delete(l.id));
  } else {
    // selecting a different account's lines clears any other account's existing selection, same rule as single-line toggling
    const firstId = [...allocSelected][0];
    if(firstId!==undefined){ const firstLine = D.ledger.find(l=>l.id===firstId); if(firstLine && firstLine.acc!==acc){ allocSelected.clear(); } }
    items.forEach(l=>allocSelected.add(l.id));
  }
  renderAllocUnallocResults();
}
function toggleAllocSel(id, acc){
  // an allocation can only ever contain lines from one account — starting a selection in a
  // different account's group clears whatever was selected elsewhere first
  if(!allocSelected.has(id) && allocSelected.size>0){
    const firstId = [...allocSelected][0];
    const firstLine = D.ledger.find(l=>l.id===firstId);
    if(firstLine && firstLine.acc!==acc){ allocSelected.clear(); }
  }
  if(allocSelected.has(id)) allocSelected.delete(id); else allocSelected.add(id);
  renderAllocUnallocResults();
}
async function assignAllocation(acc){
  if(blockIfSyncing()) return;
  const input = document.getElementById('allocNumInput_'+acc);
  const raw = input.value.trim();
  const num = parseInt(raw,10);
  if(!num || num<1){ toast('Enter a valid allocation number', true); return; }
  const ids = [...allocSelected];
  const accs = new Set(ids.map(id=>{ const l=D.ledger.find(x=>x.id===id); return l?l.acc:null; }));
  if(accs.size>1){ toast('An allocation can only group transactions from a single account', true); return; }
  const touched = [];
  ids.forEach(id=>{ const l = D.ledger.find(x=>x.id===id); if(l){ const base=l.updated_at||null; l.alloc = num; touched.push({row:l, base}); } });
  persistLocal();
  for(const t of touched){ await syncWrite('pd_ledger', 'upsert', {id:t.row.id, jv:t.row.jv, entry_date:t.row.date, acc:t.row.acc, descr:t.row.descr, amt:t.row.amt, alloc:t.row.alloc, allocatable:t.row.allocatable}, t.base); }
  toast('Allocation #'+pad5(num)+' created with '+ids.length+' lines ✓');
  allocSelected.clear();
  renderAlloc();
}

function viewAllocGroup(n){
  const lines = D.ledger.filter(l=>l.alloc===n).sort((a,b)=> a.acc-b.acc || (a.date||'').localeCompare(b.date||''));
  const total = lines.reduce((s,l)=>s+Number(l.amt),0);
  showModal(`<h3>Allocation #${pad5(n)}</h3>
    <div class="row" style="margin-bottom:14px"><label class="fl" style="margin:0">Renumber to</label><input id="allocRenumInput" style="width:130px" value="${pad5(n)}"><button class="btn ghost sm" onclick="renumberAllocation(${n})">Save number</button></div>
    <table><thead><tr><th style="width:70px">JV#</th><th>Date</th><th>Account</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
    <tbody>${lines.map(l=>`<tr><td class="mono click" onclick="viewJV(${l.jv})">#${l.jv}</td><td class="mono">${esc(l.date)}</td><td>${l.acc}<div class="mut" style="font-size:11px">${esc(accShort(l.acc))}</div></td><td>${esc(l.descr)}</td>
      <td class="num mono ${moneyClass(l.amt)}">${money(l.amt)}</td><td><button class="x" title="Remove from allocation" onclick="unassignLine(${l.id},${n})">✕</button></td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4">Net</td><td class="num mono ${moneyClass(total)}">${money(total)}</td><td></td></tr></tfoot></table>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Close</button></div>`, true);
}
async function renumberAllocation(oldNum){
  if(blockIfSyncing()) return;
  const raw = document.getElementById('allocRenumInput').value.trim();
  const newNum = parseInt(raw,10);
  if(!newNum || newNum<1){ toast('Enter a valid allocation number', true); return; }
  if(newNum===oldNum){ toast("That's already the current number"); return; }
  const collision = D.ledger.some(l=>l.alloc===newNum);
  if(collision){ toast('Allocation #'+pad5(newNum)+' is already in use — pick a different number', true); return; }
  const rows = D.ledger.filter(l=>l.alloc===oldNum);
  const touched = rows.map(l=>({row:l, base:l.updated_at||null}));
  rows.forEach(l=>{ l.alloc=newNum; });
  persistLocal();
  for(const t of touched){ await syncWrite('pd_ledger', 'upsert', {id:t.row.id, jv:t.row.jv, entry_date:t.row.date, acc:t.row.acc, descr:t.row.descr, amt:t.row.amt, alloc:t.row.alloc, allocatable:t.row.allocatable}, t.base); }
  toast('Renumbered to #'+pad5(newNum)+' ✓');
  viewAllocGroup(newNum);
  renderAlloc();
}
async function unassignLine(id,n){
  if(blockIfSyncing()) return;
  const l = D.ledger.find(x=>x.id===id);
  if(l){
    const base = l.updated_at||null;
    l.alloc=null;
    persistLocal();
    await syncWrite('pd_ledger', 'upsert', {id:l.id, jv:l.jv, entry_date:l.date, acc:l.acc, descr:l.descr, amt:l.amt, alloc:l.alloc, allocatable:l.allocatable}, base);
  }
  const remaining = D.ledger.filter(l=>l.alloc===n).length;
  if(remaining) viewAllocGroup(n); else closeModal();
  renderAlloc();
  toast('Removed from allocation');
}

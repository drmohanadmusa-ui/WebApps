async function postJV(){
  if(blockIfSyncing()) return;
  if(jvPosting) return; // already posting this exact JV — ignore a fast double-click rather than posting it twice
  const nonBlank = jvDraft.lines.filter(l=>!jvIsBlankLine(l));
  const incomplete = nonBlank.filter(l=>!jvIsCompleteLine(l));
  if(incomplete.length){ toast('Every line needs an account, a description, and an amount — fill in or remove the incomplete line(s)', true); return; }
  const lines = nonBlank;
  const inactiveLines = lines.filter(l=>{ const a = D.accounts.find(x=>x.id===Number(l.acc)); return a && a.status==='Inactive'; });
  if(inactiveLines.length){
    const names = [...new Set(inactiveLines.map(l=>accShort(Number(l.acc))))].join(', ');
    toast('Can\'t post — this JV includes an Inactive account: '+names, true);
    return;
  }
  const total = lines.reduce((s,l)=>s+(Number(l.amt)||0),0);
  if(Math.abs(total)>=0.005){ toast('Lines must net to zero before posting',true); return; }
  if(lines.length<2){ toast('Add at least two lines',true); return; }
  jvPosting = true;
  // Posting waits on one Supabase write per line, so a multi-line JV can sit for a moment with
  // no feedback. The button itself shows the wait rather than an overlay, since that's where
  // the person is already looking.
  const postBtn = document.getElementById('jvPostBtn');
  const postBtnHtml = postBtn? postBtn.innerHTML : '';
  if(postBtn){ postBtn.disabled = true; postBtn.innerHTML = '<span class="btn-spin"></span>Posting…'; }
  try{
    const jv = nextJV();
    let id = nextLedgerId();
    const rows = lines.map(l=>({id:id++, jv, date:jvDraft.date, acc:Number(l.acc), descr:l.descr||'', amt:Number(l.amt), alloc:null, allocatable:false, accNameSnapshot:accShort(Number(l.acc))}));
    D.ledger.push(...rows);
    persistLocal();
    for(const r of rows){
      await syncWrite('pd_ledger', 'upsert', {id:r.id, jv:r.jv, entry_date:r.date, acc:r.acc, descr:r.descr, amt:r.amt, alloc:r.alloc, allocatable:r.allocatable, acc_name_snapshot:r.accNameSnapshot}, null);
    }
    toast('JV #'+jv+' posted ✓'+(syncQueue.length? ' (queued for sync)':''));
    logActivity('action', 'Posted JV #'+jv+' ('+lines.length+' lines, net '+money(total)+')');
    resetJVDraft();
    ledgerFilter = {acc:'', from:'', to:'', q:'', jv:'', preset:'', specificMonth:'', unallocOnly:false};
    ledgerPage = 0;
    if(jvReturnScreen){ const dest = jvReturnScreen; jvReturnScreen = null; go(dest); }
    else if(reconcileAcc){ reconcileAcc = null; go('dashboard'); }
    else go('ledger');
  } finally {
    jvPosting = false;
    // On success the page has already navigated away and the button is gone; only restore it
    // when it's still on screen (i.e. posting failed and the person is still on New JV).
    if(postBtn && document.body.contains(postBtn)){
      postBtn.innerHTML = postBtnHtml;
      postBtn.disabled = !(jvBalanced() && !syncInProgress);
    }
  }
}

/* ============================= LEDGER ============================= */
function filteredLedger(){
  return D.ledger.filter(l=>{
    if(ledgerFilter.unallocOnly && !(ACC_BY_ID[l.acc]?.is_allocatable && !l.alloc)) return false;
    if(ledgerFilter.acc && String(l.acc)!==String(ledgerFilter.acc)) return false;
    if(ledgerFilter.from && l.date < ledgerFilter.from) return false;
    if(ledgerFilter.to && l.date > ledgerFilter.to) return false;
    if(ledgerFilter.jv && String(l.jv)!==String(ledgerFilter.jv)) return false;
    if(ledgerFilter.q){
      const q=ledgerFilter.q.toLowerCase().replace(/,/g,'');
      const amtStr = absMoney(l.amt).replace(/,/g,'').toLowerCase();
      if(!(String(l.descr||'').toLowerCase().includes(q) || String(l.acc).includes(q) || accShort(l.acc).toLowerCase().includes(q) || (l.accNameSnapshot||'').toLowerCase().includes(q) || amtStr.includes(q))) return false;
    }
    return true;
  }).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.jv-a.jv);
}
function shiftDate(dstr, days){ const d=new Date(dstr+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function monthRange(ym){ const [y,m]=ym.split('-').map(Number); const lastDay=new Date(y,m,0).getDate(); return [ym+'-01', ym+'-'+String(lastDay).padStart(2,'0')]; }
function applyLedgerPreset(val){
  ledgerFilter.preset = val;
  const today = todayStr();
  if(val==='month'){ [ledgerFilter.from, ledgerFilter.to] = monthRange(today.slice(0,7)); }
  else if(val==='30'){ ledgerFilter.from = shiftDate(today,-30); ledgerFilter.to = today; }
  else if(val==='60'){ ledgerFilter.from = shiftDate(today,-60); ledgerFilter.to = today; }
  else if(val==='90'){ ledgerFilter.from = shiftDate(today,-90); ledgerFilter.to = today; }
  else if(val==='ytd'){ ledgerFilter.from = today.slice(0,4)+'-01-01'; ledgerFilter.to = today; }
  else if(val==='all'){ ledgerFilter.from=''; ledgerFilter.to=''; }
  else if(val==='specific'){ const ym = ledgerFilter.specificMonth || today.slice(0,7); ledgerFilter.specificMonth = ym; [ledgerFilter.from, ledgerFilter.to] = monthRange(ym); }
  ledgerPage=0; renderLedger();
}
function ledgerSpecificMonthChange(val){ ledgerFilter.specificMonth = val; ledgerFilter.preset='specific'; [ledgerFilter.from, ledgerFilter.to] = monthRange(val); ledgerPage=0; renderLedger(); }
function csvEscape(v){ v = v===null||v===undefined? '' : String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function ledgerExportFilename(){
  const parts = [];
  if(ledgerFilter.acc){ parts.push(accShort(Number(ledgerFilter.acc)).replace(/[\\/:*?"<>|,]/g,'')); } else { parts.push('All Accounts'); }
  if(ledgerFilter.preset==='specific' && ledgerFilter.specificMonth){ parts.push(monthLabel(ledgerFilter.specificMonth)); }
  else if(ledgerFilter.preset==='month'){ parts.push(monthLabel(todayStr().slice(0,7))); }
  else if(ledgerFilter.preset==='ytd'){ parts.push(todayStr().slice(0,4)+' YTD'); }
  else if(ledgerFilter.preset==='all'){ parts.push('Full History'); }
  else if(ledgerFilter.from || ledgerFilter.to){ parts.push((ledgerFilter.from||'start')+' to '+(ledgerFilter.to||'today')); }
  else { parts.push(todayStr()); }
  return parts.join(' - ')+'.csv';
}
function exportLedgerCSV(){
  const rows = filteredLedger();
  const header = ['JV#','Date','Account#','Account Name','Description','Amount','Alloc#'];
  const lines = [header.join(',')];
  rows.forEach(l=> lines.push([l.jv, l.date, l.acc, ledgerAccName(l), l.descr, l.amt, l.alloc? pad5(l.alloc):''].map(csvEscape).join(',')));
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ledgerExportFilename(); a.click();
  toast('Exported '+rows.length.toLocaleString()+' rows to CSV');
}

async function saveJVEdit(){
  if(blockIfSyncing()) return;
  const d = jvEditDraft;
  const total = d.lines.reduce((s,l)=>s+(Number(l.amt)||0),0);
  const complete = d.lines.every(l=> l.acc && l.descr && String(l.descr).trim() && l.amt!==''&&l.amt!==null&&l.amt!==undefined && !isNaN(Number(l.amt)));
  if(!complete){ toast('Every line needs an account, description, and amount', true); return; }
  if(d.lines.length<2){ toast('A JV needs at least two lines', true); return; }
  const inactiveLines = d.lines.filter(l=>{
    const a = D.accounts.find(x=>x.id===Number(l.acc));
    if(!a || a.status!=='Inactive') return false;
    const original = D.ledger.find(x=>x.id===l.id);
    return !original || Number(original.acc)!==Number(l.acc); // only a problem if this line is being newly assigned to it
  });
  if(inactiveLines.length){
    const names = [...new Set(inactiveLines.map(l=>accShort(Number(l.acc))))].join(', ');
    toast('Can\'t save — this JV includes an Inactive account: '+names, true);
    return;
  }
  if(Math.abs(total)>=0.005){ toast('Lines must net to zero before saving', true); return; }
  if(!d.date){ toast('A date is required', true); return; }
  if(d.date>todayStr()){ toast('Date cannot be in the future', true); return; }
  const jvDate = d.date;
  if(jvDate.slice(0,7)!==todayStr().slice(0,7)){
    if(!confirm('This JV is dated '+jvDate+', outside the current month. Changing it will affect historical numbers for that period. Continue?')) return;
  }
  // Any original line no longer present in the draft was deliberately removed — delete it for real.
  const originalIds = D.ledger.filter(l=>l.jv===d.jv).map(l=>l.id);
  const keptIds = new Set(d.lines.map(l=>l.id).filter(id=>id!=null));
  const removedIds = originalIds.filter(id=>!keptIds.has(id));
  const removedRows = removedIds.map(id=>D.ledger.find(l=>l.id===id)).filter(Boolean);
  if(removedRows.length){
    D.ledger = D.ledger.filter(l=>!removedIds.includes(l.id));
  }
  const touched = [];
  let nextId = null;
  d.lines.forEach(l=>{
    if(l.id==null){
      // a line added during this edit session — a genuinely new ledger row
      if(nextId==null) nextId = nextLedgerId();
      const row = {id: nextId++, jv: d.jv, date: jvDate||todayStr(), acc: Number(l.acc), descr: l.descr, amt: Number(l.amt), alloc: null, allocatable: false, accNameSnapshot: accShort(Number(l.acc))};
      D.ledger.push(row);
      touched.push(row);
      return;
    }
    const row = D.ledger.find(x=>x.id===l.id);
    if(!row) return;
    const accChanged = row.acc !== Number(l.acc);
    row.acc = Number(l.acc); row.descr = l.descr; row.amt = Number(l.amt); row.date = jvDate;
    if(accChanged) row.accNameSnapshot = accShort(row.acc); // moved to a different account — treat like a fresh assignment
    touched.push(row);
  });
  persistLocal();
  closeModal();
  toast('JV #'+d.jv+' updated ✓'+(removedRows.length? ' ('+removedRows.length+' line(s) removed)':''));
  const dateChanged = d.origDate && d.origDate!==jvDate;
  logActivity('action', 'Edited JV #'+d.jv+' ('+touched.length+' line(s) changed'+(removedRows.length? ', '+removedRows.length+' line(s) deleted':'')+(dateChanged? ', date changed '+d.origDate+' → '+jvDate:'')+')');
  for(const row of touched){
    await syncWrite('pd_ledger', 'upsert', {id:row.id, jv:row.jv, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt, alloc:row.alloc, allocatable:row.allocatable, acc_name_snapshot:row.accNameSnapshot||null}, row.updated_at||null);
  }
  for(const row of removedRows){
    await syncWrite('pd_ledger', 'delete', {id:row.id}, row.updated_at||null);
  }
  if(screen==='ledger') renderLedger();
  else if(screen==='dashboard') renderDashboard();
  else if(screen==='statement') renderStatement();
  else if(screen==='alloc') renderAlloc();
}
function exportJVCSV(jv){
  const lines = D.ledger.filter(l=>l.jv===jv).sort((a,b)=>a.id-b.id);
  const header = ['JV#','Date','Account#','Account Name','Description','Amount'];
  const rows = [header.join(',')];
  lines.forEach(l=> rows.push([l.jv,l.date,l.acc,ledgerAccName(l),l.descr,l.amt].map(csvEscape).join(',')));
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jv-'+jv+'.csv'; a.click();
  toast('JV #'+jv+' exported to CSV');
}
function duplicateJV(jv){
  const lines = D.ledger.filter(l=>l.jv===jv).sort((a,b)=>a.id-b.id);
  jvDraft = { date: todayStr(), lines: lines.map(l=>({key:Math.random().toString(36).slice(2), acc:l.acc, descr:l.descr, amt:l.amt, _matches:[], _hi:-1})) };
  closeModal();
  go('newjv');
  toast('Loaded JV #'+jv+' as a starting point — review and post');
}
// Reversing replaces deleting: the original JV stays in the ledger and a mirror-image JV is
// posted against it, so history is preserved and the net effect is zero. Deletion is no longer
// offered anywhere in the JV UI.
function buildReversalLines(jv, newJvNo, reversalDate, startId){
  const originals = D.ledger.filter(l=>l.jv===jv).sort((a,b)=>a.id-b.id);
  let id = startId;
  return originals.map(l=>({
    id: id++,
    jv: newJvNo,
    date: reversalDate,
    acc: l.acc,
    descr: 'Reversal of JV #'+jv+' — '+(l.descr||''),
    amt: -Number(l.amt),
    // Deliberately NOT carried over: a reversal is a fresh, unallocated entry. The caller warns
    // the person when the original was allocated so the allocation can be revisited by hand.
    alloc: null,
    allocatable: false,
    accNameSnapshot: l.accNameSnapshot || accShort(l.acc),
    updated_at: null,
  }));
}
async function reverseJV(jv){
  if(blockIfSyncing()) return;
  const originals = D.ledger.filter(l=>l.jv===jv);
  if(!originals.length){ toast('JV #'+jv+' not found', true); return; }
  const allocated = originals.filter(l=>l.alloc);
  let msg = 'Reverse JV #'+jv+'?\n\nA new JV dated today will be posted with the opposite amounts, so the net effect is zero. The original stays in the ledger.';
  if(allocated.length){
    msg += '\n\n⚠ '+allocated.length+' line(s) in this JV are assigned to an allocation group. The reversal lines will NOT be allocated, so you may need to revisit that allocation.';
  }
  if(!confirm(msg)) return;
  const newJvNo = nextJV();
  const startId = 1 + D.ledger.reduce((m,l)=>Math.max(m, Number(l.id)||0), 0);
  const rows = buildReversalLines(jv, newJvNo, todayStr(), startId);
  D.ledger.push(...rows);
  persistLocal(); closeModal(); renderLedger();
  toast('JV #'+jv+' reversed by JV #'+newJvNo+' ✓');
  logActivity('action', 'Reversed JV #'+jv+' with JV #'+newJvNo+' ('+rows.length+' lines)');
  for(const r of rows){
    await syncWrite('pd_ledger', 'upsert', {id:r.id, jv:r.jv, entry_date:r.date, acc:r.acc, descr:r.descr, amt:r.amt, alloc:r.alloc, allocatable:r.allocatable, acc_name_snapshot:r.accNameSnapshot}, null);
  }
  viewJV(newJvNo);
}

async function saveAccount(){

  if(!name){ toast('Enter an account name', true); return; }

// Resolved plan for the Budget page/grid: Provisions take priority (locked), else whatever is
// stored in D.budget for that account+month (editable). Mirrors the exact same precedence the
// Forecast page's Expense cells use, so the two pages always agree on the same numbers.
function resolvedBudgetCell(accId, monthKey){
  const provPlan = provisionsPlanFor(accId, monthKey);
  if(provPlan!==null) return {plan: provPlan, source:'provisions', editable:false};
  const val = budgetPlanFor(accId, monthKey);
  return {plan: val, source: val!==null? 'budget' : null, editable:true};
}

const BUDGET_WINDOW_SIZE = 12;
function budgetMonthsWindow(){
  const months = [];
  const end = getGridEndMonth();
  let mk = budgetWindowStart;
  let guard = 0;
  while((mk<=end || months.length===0) && guard<600){ months.push(mk); mk = nextMonthKeyPlain(mk); guard++; }
  return months;
}
function budgetShiftWindow(delta){
  const candidate = delta>0? nextMonthKeyPlain(budgetWindowStart) : prevMonthKey(budgetWindowStart);
  if(delta>0 && candidate>getGridEndMonth()){ toast('Reached your configured grid end month (Settings → Grid & Export End Month)', true); return; }
  budgetWindowStart = candidate;
  renderBudgetGrid();
}

async function saveBudgetCell(accId, monthKey, rawVal){
  if(blockIfSyncing()) return;
  const clean = String(rawVal).replace(/,/g,'').trim();
  const existing = D.budget.find(b=>b.acc===accId && monthOf(b.date)===monthKey);
  if(clean===''||Number(clean)===0){
    if(existing){
      D.budget = D.budget.filter(b=>b!==existing);
      persistLocal(); renderBudgetGrid();
      await syncWrite('pd_budget', 'delete', {id:existing.id}, existing.updated_at||null);
    }
    return;
  }
  const val = Number(clean);
  if(isNaN(val)) return;
  if(existing){
    const base = existing.updated_at||null;
    existing.amt = val;
    persistLocal(); renderBudgetGrid();
    await syncWrite('pd_budget', 'upsert', {id:existing.id, entry_date:existing.date, acc:existing.acc, descr:existing.descr, amt:existing.amt}, base);
  } else {
    const row = {id: nextBudgetId(), date: monthKey+'-01', acc: accId, descr: 'Budget - '+monthLabel(monthKey), amt: val};
    D.budget.push(row);
    persistLocal(); renderBudgetGrid();
    await syncWrite('pd_budget', 'upsert', {id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt}, null);
  }
}

async function importBudgetGridCSV(rows){
  if(blockIfSyncing()) return;
  const startTime = Date.now();
  const currentMonth = todayStr().slice(0,7);
  const sampleKeys = Object.keys(rows[0]||{});
  const monthCols = sampleKeys.filter(k=>/^\d{4}-\d{2}$/.test(k) && k>currentMonth);
  if(!confirm('Import '+rows.length+' rows? This will replace future budget entries ('+monthCols.length+' future month columns detected) for every matched account. Historical/current-month columns are always ignored.')) return;
  let matched=0, unmatched=0, planWritten=0; const mismatches=[];
  const touchedUpserts=[], touchedDeletes=[];
  showImportProgress('Importing Budget Grid…');
  let processed=0;
  for(const r of rows){
    const id = parseInt(r['account id']||r['account#']||r['account'],10);
    const a = D.accounts.find(x=>x.id===id);
    if(!a){ unmatched++; processed++; continue; }
    matched++;
    for(const mk of monthCols){
      const raw = r[mk];
      if(raw===undefined) continue;
      const c = resolvedBudgetCell(a.id, mk);
      const clean = String(raw).replace(/,/g,'').trim();
      if(!c.editable){
        if(clean!=='' && Math.abs(Number(clean)-Number(c.plan||0))>0.01){
          mismatches.push({acc:a.id, name:accShort(a.id), month:mk, imported:Number(clean), computed:c.plan});
        }
        continue;
      }
      const existing = D.budget.find(b=>b.acc===a.id && monthOf(b.date)===mk);
      if(clean===''){
        if(existing){ D.budget = D.budget.filter(b=>b!==existing); touchedDeletes.push({id:existing.id, updated_at:existing.updated_at||null}); planWritten++; }
      } else {
        const val = Number(clean);
        if(isNaN(val)) continue;
        if(existing){ existing.amt = val; touchedUpserts.push(existing); }
        else { const row = {id: nextBudgetId(), date: mk+'-01', acc: a.id, descr: 'Budget - '+monthLabel(mk), amt: val}; D.budget.push(row); touchedUpserts.push(row); }
        planWritten++;
      }
    }
    processed++;
    updateImportProgress(processed, rows.length, 'Processing');
    // Yield to the browser every few rows so the progress bar actually paints — without this, a
    // long synchronous loop (many accounts × many months) blocks rendering entirely and the bar
    // appears to jump straight to 100% at the very end instead of animating.
    if(processed % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
  }
  persistLocal();
  const syncOps = [
    ...touchedUpserts.map(row=>({table:'pd_budget', kind:'upsert', row:{id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt}, base:row.updated_at||null})),
    ...touchedDeletes.map(del=>({table:'pd_budget', kind:'delete', row:{id:del.id}, base:del.updated_at})),
  ];
  if(syncOps.length){
    await syncWriteMany(syncOps, {concurrency:6, onProgress:(done,total)=>updateImportProgress(done,total,'Syncing to cloud')});
  }
  const elapsedSec = ((Date.now()-startTime)/1000).toFixed(1);
  let msg = 'Import complete: '+matched.toLocaleString()+' matched, '+planWritten.toLocaleString()+' month values written';
  msg += '\nTook '+elapsedSec+'s';
  if(unmatched) msg += '\n'+unmatched.toLocaleString()+' row(s) skipped (no matching account)';
  if(mismatches.length){
    const list = mismatches.slice(0,25).map(m=>`${m.name} (${m.acc}) — ${monthLabel(m.month)}: imported ${money(m.imported)}, kept computed ${money(m.computed)}`).join('\n');
    msg += '\n\n⚠ '+mismatches.length+' Provisions-locked cell(s) didn\'t match — kept the computed value:\n'+list+(mismatches.length>25?`\n…and ${mismatches.length-25} more.`:'');
  }
  finishImportProgress(msg);
  renderBudget();
}

let pnlFrom = todayStr().slice(0,8)+'01', pnlTo = todayStr();

  else if(val==='lastmonth'){ [pnlFrom,pnlTo] = monthRange(prevMonthKey(today.slice(0,7))); }
  else if(val==='specific'){ [pnlFrom,pnlTo] = monthRange(pnlSpecificMonth); }

function pnlYearChange(v){ pnlYear=v; pnlPreset='year'; pnlFrom=v+'-01-01'; pnlTo=v+'-12-31'; renderPnL(); }
// Quick prev/next month navigation — shifts from whichever month is currently being viewed
// (falls back to the From date's month for ytd/year/custom presets) and switches to viewing
// that single specific month, without needing the dropdown.
function pnlShiftMonth(delta){
  let anchor;
  if(pnlPreset==='specific') anchor = pnlSpecificMonth;
  else if(pnlPreset==='month') anchor = todayStr().slice(0,7);
  else if(pnlPreset==='lastmonth') anchor = prevMonthKey(todayStr().slice(0,7));
  else anchor = pnlFrom.slice(0,7);
  const newMonth = delta>0? nextMonthKeyPlain(anchor) : prevMonthKey(anchor);

// P&L's "Budget" figure for an expense account must match what the Budget page itself would show
// for that account across the same period — which checks Provisions FIRST for each month, only
// falling back to raw Budget rows if there's no Provisions entry (see resolvedBudgetCell). A plain
// scan of D.budget alone (the previous approach) silently under-counted any account whose planned
// figure actually comes from Provisions — which is the primary way most recurring expenses (rent,
// subscriptions, etc.) get planned in this app, so the gap could be substantial.
function pnlBudgetForAccountInRange(accId, fromDate, toDate){
  let total = 0;
  let mk = fromDate.slice(0,7);
  const endMk = toDate.slice(0,7);
  let guard = 0;
  while(mk<=endMk && guard<600){
    const provPlan = provisionsPlanFor(accId, mk);
    total += provPlan!==null ? provPlan : (budgetPlanFor(accId, mk)||0);
    mk = nextMonthKeyPlain(mk);
    guard++;
  }
  return total;
}
// Magnitude-based expense variance: positive means under budget (surplus, good), negative means
// over budget (bad) — correct regardless of which sign convention the underlying account uses.
// A raw signed subtraction (actual - budget) can flip the wrong way depending on account sign
// convention, which is exactly the bug this replaces.
function pnlVarianceMagnitude(budget, actual){ return Math.abs(budget) - Math.abs(actual); }
function renderPnL(){
  beginForecastFastPath();
  try{
  // ---- Income: shown positive, grouped by category with subtotals ----
  const incAccs = D.accounts.filter(a=>firstDigit(a.id)===3 && (a.acc_type==='Individual Account'||a.acc_type==='Accrual Account'));
  const incByCat = {};
  incAccs.forEach(a=>{ const raw = sumAcc(l=>l.acc===a.id, pnlFrom, pnlTo); if(raw!==0) (incByCat[a.category] ??= []).push({a, v: Math.abs(raw)}); });
  const incCats = Object.keys(incByCat).sort((x,y)=> Math.min(...incByCat[x].map(i=>i.a.id)) - Math.min(...incByCat[y].map(i=>i.a.id)));
  let incTotal = 0;
  const incBody = incCats.map(cat=>{
    const items = incByCat[cat]; const catTotal = items.reduce((s,i)=>s+i.v,0); incTotal += catTotal;
    return `<tr style="background:var(--chip)"><td style="font-weight:700;color:var(--accent)">${esc(cat)}</td><td class="num mono g" style="font-weight:700">${money(catTotal)}</td></tr>` +
      items.map(i=>`<tr><td class="click" style="padding-left:18px" onclick="viewPnLAccountTransactions(${i.a.id})">${esc(accShort(i.a.id))}</td><td class="num mono g">${money(i.v)}</td></tr>`).join('');
  }).join('');

  // ---- Expenses: shown negative, grouped by category, with Budget/Actual/Variance — every expense account listed, even at zero ----
  const expAccs = D.accounts.filter(a=>firstDigit(a.id)===6 && (a.acc_type==='Individual Account'||a.acc_type==='Accrual Account') && a.status!=='Deleted');
  const expByCat = {};
  expAccs.forEach(a=>{
    const actualRaw = sumAcc(l=>l.acc===a.id, pnlFrom, pnlTo);
    const budgetRaw = pnlBudgetForAccountInRange(a.id, pnlFrom, pnlTo);
    (expByCat[a.category] ??= []).push({a, actual: actualRaw, budget: budgetRaw});
  });
  const expCats = Object.keys(expByCat).sort((x,y)=> Math.min(...expByCat[x].map(i=>i.a.id)) - Math.min(...expByCat[y].map(i=>i.a.id)));
  let expTotal = 0, expBudgetTotal = 0;
  const expCatData = expCats.map(cat=>{
    const items = expByCat[cat].sort((a,b)=>a.a.id-b.a.id);
    const catTotal = items.reduce((s,i)=>s+i.actual,0), catBudget = items.reduce((s,i)=>s+i.budget,0);
    expTotal += catTotal; expBudgetTotal += catBudget;
    return {cat, items, catTotal, catBudget};
  });
  // % of Total: each line/category's share of Total Period Expenses, by magnitude (so it stays
  // sensible regardless of an account's underlying sign convention). Computed as a second pass
  // since expTotal isn't final until every category has been summed above.

/* ============================= PROVISIONS (recurring provision planner) ============================= */
function monthTag(ym){
  const [y,m] = ym.split('-').map(Number);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[m-1]+' - '+String(y).slice(-2)+"'";
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[m-1]+'-'+String(y).slice(-2);
}
function sortedMonthKeys(group){ return Object.keys(group.months||{}).sort(); }
// Provisions is a planning-only page — historical months are never useful to plan for, so
// every place the grid, validation, or exports gather this group's months uses this instead of
// the raw sortedMonthKeys(): current month through the Grid End Month setting only. Any data
// that already exists in a historical month is left untouched in storage — just not shown,
// validated, exported, or importable here.
function provisionsVisibleMonthKeys(group){
  const currentMonth = todayStr().slice(0,7);
  const endMonth = getGridEndMonth();
  return sortedMonthKeys(group).filter(k=>k>=currentMonth && k<=endMonth);
}
function provisionsExportMonthKeys(currentMonth){
  const months = [];
  let mk = currentMonth;
  let guard = 0;
  const endMonth = getGridEndMonth();
  while(mk<=endMonth && guard<2000){ months.push(mk); mk = nextMonthKeyPlain(mk); guard++; }
  return months;
}
function groupStatus(group){
  // Only count values belonging to lines that still exist — a deleted line's leftover values
  // (see removeProvisionLine) must never silently contribute to this check.
  const validLineIds = new Set(group.lines.map(l=>l.lineId));
  const keys = provisionsVisibleMonthKeys(group);
  for(const k of keys){
    const cell = group.months[k]||{};
    const vals = Object.entries(cell).filter(([lid,v])=>validLineIds.has(Number(lid)) && v!==''&&v!==null&&v!==undefined).map(([,v])=>v);
    if(!vals.length) continue;
    const sum = vals.reduce((s,v)=>s+roundCents(v),0);
    if(Math.abs(sum)>0.01) return {ok:false, badMonth:k, badSum:sum};
  }
  const unbalancedDup = findUnbalancedDuplicateAccounts(group);
  if(unbalancedDup.length){
    if(group.dupBalanceExempt) return {ok:true, duplicateInfo:unbalancedDup};
    return {ok:false, duplicateIssue:unbalancedDup};
  }
  return {ok:true};
}
// Whether a group has ANY account appearing on 2+ lines — used to decide whether the
// "duplicate lines don't need to net to zero" toggle is relevant to show at all.
function groupHasDuplicateAccounts(g){
  const accCounts = {};
  g.lines.forEach(l=>{ accCounts[l.acc] = (accCounts[l.acc]||0) + 1; });
  return Object.values(accCounts).some(n=>n>1);
}
function toggleDupBalanceExempt(gid, checked){
  if(blockIfSyncing()) return;
  const g = findProvisionGroup(gid); if(!g) return;
  g.dupBalanceExempt = !!checked;
  persistProvisionGroup(g);
  logActivity('action', (checked?'Exempted':'Un-exempted')+' duplicate-account balance check for provision group "'+g.name+'"');
  renderProvisionGroupsList();
}
function nextProvisionId(){ let m=0; D.provisionGroups.forEach(g=>{ if(g.id>m) m=g.id; }); return m+1; }
function nextLineId(g){ let m=100000; g.lines.forEach(l=>{ if((l.lineId||0)>=m) m=l.lineId+1; }); return m; }
// When the same account appears on 2+ lines within a group (an explicitly supported pattern —
// e.g. one line contributing TO a reserve, another line drawing it back DOWN), the running total
// across every month, across every line-instance of that account, should net to zero eventually.
// Returns [] if balanced, or a list of {acc, total} for each duplicated account that isn't.
function findUnbalancedDuplicateAccounts(g){
  ensureLineIds(g);
  const accCounts = {};
  g.lines.forEach(l=>{ accCounts[l.acc] = (accCounts[l.acc]||0) + 1; });
  const duplicateAccs = Object.keys(accCounts).filter(acc=>accCounts[acc]>1).map(Number);
  const unbalanced = [];
  duplicateAccs.forEach(acc=>{
    const lineIds = g.lines.filter(l=>l.acc===acc).map(l=>l.lineId);
    let total = 0;
    Object.values(g.months||{}).forEach(cell=>{
      lineIds.forEach(lid=>{
        const v = cell[lid];
        if(v!==undefined && v!==null && v!=='') total += roundCents(v);
      });
    });
    total = roundCents(total);
    if(Math.abs(total)>=0.01) unbalanced.push({acc, total});
  });
  return unbalanced;
}
function unbalancedDuplicateMessage(unbalanced){
  return unbalanced.map(u=>accShort(u.acc)+' ('+u.acc+'): running total '+money(u.total)+', not zero').join('\n');
}
function ensureLineIds(g){
  // backward compatibility: groups saved before duplicate-account support have no lineId —
  // their account number was already a safe unique key (duplicates weren't possible yet),
  // so falling back to it here needs no migration of the months data at all.
  g.lines.forEach(l=>{ if(l.lineId===undefined || l.lineId===null){ l.lineId = l.acc; } });
}
function findProvisionGroup(id){ const g = D.provisionGroups.find(g=>g.id===id); if(g) ensureLineIds(g); return g; }
async function persistProvisionGroup(g){
  const base = g.updated_at||null;
  persistLocal();
  await syncWrite('pd_provisions', 'upsert', {id:g.id, name:g.name, lines:g.lines, months:g.months, last_bulk_fill_months:g.lastBulkFillMonths||null, dup_balance_exempt:!!g.dupBalanceExempt}, base);
}

function exportProvisionsCSV(){
  const currentMonth = todayStr().slice(0,7);
  const months = provisionsExportMonthKeys(currentMonth);
  const rows = [];
  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    g.lines.forEach(line=>{
      rows.push({group:g.name, acc:line.acc, lineId:line.lineId, descr:(line.descrBase && line.descrBase!==accShort(line.acc))? line.descrBase : '', group_obj:g});
    });
  });
  if(!rows.length){ toast('No provision groups to export yet', true); return; }
  const header = ['Group','Account ID','Account Name','Line ID','Line Description', ...months];
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r=>{
    const row = [r.group, r.acc, accShort(r.acc), r.lineId, r.descr];
    months.forEach(mk=>{
      const cell = r.group_obj.months[mk];
      const v = cell? cell[r.lineId] : undefined;
      row.push(v!==undefined && v!==null? v : '');
    });
    lines.push(row.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = 'Provisions Grid - '+todayStr()+'.csv'; dl.click();
  toast('Exported '+rows.length.toLocaleString()+' provision line(s) to CSV');
  logActivity('action', 'Exported Provisions Grid CSV ('+rows.length+' lines across '+D.provisionGroups.length+' groups)');
}
async function handleProvisionsImport(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = csvToObjects(reader.result);
    inputEl.value = '';
    if(!rows.length){ toast('No rows found in that CSV', true); return; }
    await importProvisionsCSV(rows);
  };
  reader.readAsText(file);
}
async function importProvisionsCSV(rows){
  if(blockIfSyncing()) return;
  const startTime = Date.now();
  const currentMonth = todayStr().slice(0,7);
  const sampleKeys = Object.keys(rows[0]||{});
  const monthCols = sampleKeys.filter(k=>/^\d{4}-\d{2}$/.test(k) && k>=currentMonth);
  const lineIdCol = sampleKeys.find(k=>/^line[\s_]?id$/.test(k));
  const descrCol = sampleKeys.find(k=>/^line[\s_]?descr(iption)?$/.test(k));
  if(!confirm('Import '+rows.length+' rows? This can create new provision groups and lines for any Group/Account combination that doesn\'t already exist, and will overwrite planned amounts for '+monthCols.length+' month column(s) found ('+currentMonth+' onward — any historical month columns in the file are ignored).')) return;

  showImportProgress('Importing Provisions Grid…');
  let groupsCreated=0, linesCreated=0, valuesWritten=0, valuesChanged=0, skipped=0;
  const touchedGroups = new Set();
  // Tracks, per (group, account), how many CSV rows for that combo we've already matched
  // to an existing line in THIS import run — lets duplicate-account rows (the documented
  // "one line builds a reserve, another draws it down" pattern) map 1st row -> 1st existing
  // line, 2nd row -> 2nd existing line, etc., only creating a new line once the CSV has more
  // rows for that account than there are existing lines. Only used as a fallback when the
  // CSV has no Line ID column (or a row's Line ID cell is blank/invalid).
  const occurrenceSeen = new Map();
  let processed=0;
  for(const r of rows){
    const groupName = (r['group']||'').trim();
    const accId = parseInt(r['account id']||r['account#']||r['account'],10);
    if(!groupName || !accId || !D.accounts.find(a=>a.id===accId)){ skipped++; processed++; continue; }
    let g = D.provisionGroups.find(x=>x.name.toLowerCase()===groupName.toLowerCase());
    if(!g){
      g = {id: nextProvisionId(), name: groupName, lines: [], months: {}};
      D.provisionGroups.push(g);
      groupsCreated++;
    }
    ensureLineIds(g);
    let line = null;
    const csvLineId = lineIdCol? parseInt(r[lineIdCol],10) : NaN;
    if(!isNaN(csvLineId)){
      const match = g.lines.find(l=>l.lineId===csvLineId);
      if(match && match.acc===accId){
        line = match;
      } else if(!match){
        line = {acc: accId, descrBase: accShort(accId), lineId: csvLineId};
        g.lines.push(line);
        linesCreated++;
      }
      // else: Line ID exists but belongs to a different account — fall through to
      // positional matching below rather than silently overwriting the wrong line.
    }
    if(!line){
      const key = g.id+':'+accId;
      const existingForAcc = g.lines.filter(l=>l.acc===accId);
      const seenSoFar = occurrenceSeen.get(key)||0;
      if(seenSoFar<existingForAcc.length){
        line = existingForAcc[seenSoFar];
      } else {
        line = {acc: accId, descrBase: accShort(accId), lineId: nextLineId(g)};
        g.lines.push(line);
        linesCreated++;
      }
      occurrenceSeen.set(key, seenSoFar+1);
    }
    if(descrCol!==undefined){
      const rawDescr = String(r[descrCol]||'').trim();
      line.descrBase = rawDescr || accShort(accId);
    }
    for(const mk of monthCols){
      const raw = r[mk];
      if(raw===undefined) continue;
      const clean = String(raw).replace(/,/g,'').trim();
      if(!g.months[mk]) g.months[mk] = {};
      if(clean===''){ delete g.months[mk][line.lineId]; }
      else {
        const newVal = Number(clean);
        const oldVal = g.months[mk][line.lineId];
        if(oldVal===undefined || oldVal===null || oldVal==='' || Number(oldVal)!==newVal) valuesChanged++;
        g.months[mk][line.lineId] = newVal;
        valuesWritten++;
      }
    }
    touchedGroups.add(g);
    processed++;
    updateImportProgress(processed, rows.length, 'Processing');
    if(processed % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
  }
  persistLocal();
  const syncOps = [...touchedGroups].map(g=>({table:'pd_provisions', kind:'upsert', row:{id:g.id, name:g.name, lines:g.lines, months:g.months, last_bulk_fill_months:g.lastBulkFillMonths||null, dup_balance_exempt:!!g.dupBalanceExempt}, base:g.updated_at||null}));
  if(syncOps.length){
    await syncWriteMany(syncOps, {concurrency:6, onProgress:(done,total)=>updateImportProgress(done,total,'Syncing to cloud')});
  }

  const elapsedSec = ((Date.now()-startTime)/1000).toFixed(1);
  let msg = 'Import complete: '+groupsCreated.toLocaleString()+' group(s) created, '+linesCreated.toLocaleString()+' line(s) created, '+valuesWritten.toLocaleString()+' month values written ('+valuesChanged.toLocaleString()+' actually changed from before)';
  msg += '\nTook '+elapsedSec+'s';
  if(skipped) msg += '\n'+skipped.toLocaleString()+' row(s) skipped (missing group/account, or account not found)';
  finishImportProgress(msg);
  renderProvisionGroupsList();
}
function combinedGenerateProvisionJV(){
  const monthKey = provisionsSelectedMonth;
  if(!monthKey){ toast('Pick a month first', true); return; }
  const allUnbalanced = [];
  D.provisionGroups.forEach(g=>{
    if(g.dupBalanceExempt) return;
    const u = findUnbalancedDuplicateAccounts(g);
    if(u.length) allUnbalanced.push({group:g.name, items:u});
  });
  if(allUnbalanced.length){
    const msg = allUnbalanced.map(x=>x.group+':\n'+unbalancedDuplicateMessage(x.items)).join('\n\n');
    toast('Can\'t generate — duplicate-account lines aren\'t balanced yet:\n'+msg, true);
    return;
  }
  const tag = monthTag(monthKey);
  const lines = [];
  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    const cell = g.months[monthKey];
    if(!cell) return;
    g.lines.forEach(line=>{
      const val = cell[line.lineId];
      if(val===undefined||val===null||val==='') return;
      lines.push({key:Math.random().toString(36).slice(2), acc:line.acc, descr: (line.descrBase||accShort(line.acc))+' - '+tag, amt: Number(val), _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
    });
  });
  if(lines.length<2){ toast('No provision groups have data for '+monthLabel(monthKey), true); return; }
  jvDraft = { date: monthKey+'-01', lines };
  jvReturnScreen = 'provisions';
  go('newjv');
  toast('Generated combined provision JV for '+monthLabel(monthKey)+' from every group with data that month — review and post');
}
function renderProvisionGroupsList(){
  const el = document.getElementById('provisionGroupsList');
  if(!el) return;

  // fresh DOM node — browsers don't preserve scroll position across that, so without this, being
  // scrolled over to see future months would silently snap back to the leftmost column on every
  // single edit. Capture before, restore after.
  const scrollPositions = {};
  D.provisionGroups.forEach(g=>{
    const wrap = document.getElementById('provGridWrap_'+g.id);
    if(wrap) scrollPositions[g.id] = wrap.scrollLeft;
  });
  const selMonth = provisionsSelectedMonth;
  el.innerHTML = D.provisionGroups.map(g=>{
    ensureLineIds(g);
    const status = groupStatus(g);
    const isEditing = provisionEditingId===g.id;
    const months = provisionsVisibleMonthKeys(g);

    const monthMissing = selMonth && !hasSelMonth;
    return `<div class="panel" style="${monthMissing?'border-color:var(--red)':(hasSelMonth?'border-color:var(--green)':'')}">
      <div class="row" style="justify-content:space-between">
        <div class="row">
          <span class="badge ${status.ok?'pos':'neg'}">${status.ok?'OK':'Error'}</span>
          <input value="${esc(g.name)}" onchange="renameProvisionGroup(${g.id},this.value)" style="font-size:16px;font-weight:600;border:none;background:transparent;padding:2px 4px;min-width:220px">
        </div>
        <div class="row">
          <button class="btn ghost sm" onclick="toggleProvisionEdit(${g.id})">${isEditing?'Collapse':'Edit Grid'}</button>

async function saveProvisionLineDescr(gid, li, val){

  line.descrBase = clean || accShort(line.acc);

function provCellKey(ev, gid, li, mi, monthCount){

  const targetMi = mi + dir;
  if(targetMi<0 || targetMi>=monthCount) return; // let native Tab move to the next control past the grid
  ev.preventDefault();
  ev.target.blur(); // commits the value and re-renders the grid synchronously (via setProvisionCell)
  const next = document.getElementById('provCell_'+gid+'_'+li+'_'+targetMi); // fresh lookup — the old node no longer exists
  if(next){ next.focus(); next.select(); }
}
function monthsUntilGridEnd(fromKey){
  const end = getGridEndMonth();
  if(!fromKey || fromKey>end) return 0;
  const [y1,m1] = fromKey.split('-').map(Number);

  return (y2-y1)*12 + (m2-m1) + 1; // inclusive of both the starting month and the end month
}

function applyBulkFill(gid, li){
  if(blockIfSyncing()) return;
  const g = findProvisionGroup(gid); if(!g) return;
  const line = g.lines[li];
  const startMonth = document.getElementById('bfStartMonth').value;
  const amtRaw = document.getElementById('bfAmount').value;
  const count = parseInt(document.getElementById('bfMonthCount').value,10);
  const amt = Number(String(amtRaw).replace(/,/g,'').trim());
  if(!startMonth || isNaN(amt) || !count || count<1){ toast('Fill in a valid starting month, amount, and number of months', true); return; }
  let [y,m] = startMonth.split('-').map(Number);
  for(let i=0;i<count;i++){
    const key = y+'-'+String(m).padStart(2,'0');
    if(!g.months[key]) g.months[key] = {};
    g.months[key][line.lineId] = amt;
    m++; if(m>12){ m=1; y++; }
  }
  g.lastBulkFillMonths = count;
  persistProvisionGroup(g);
  closeModal();
  renderProvisionGroupsList();
  const unbalanced = g.dupBalanceExempt? [] : findUnbalancedDuplicateAccounts(g);
  if(unbalanced.length){
    toast('Filled '+count+' month(s) — heads up, duplicate-account lines in "'+g.name+'" don\'t net to zero yet:\n'+unbalancedDuplicateMessage(unbalanced), true);
  } else {
    toast('Filled '+count+' month(s) ✓');
  }
}

/* ============================= JAMIAH (rotating group savings) ============================= */
// A Jamiah is a classic ROSCA: a fixed set of participants organized into groups, one group
// receiving the full pot each round while everyone keeps contributing every round. Contributions
// are tracked per-person by tagging real ledger transactions (in one chosen account) to whichever
// participant they belong to — nothing here posts or edits ledger data, it only tags it.
let jamiahDetailId = null;
let jamiahSetupExpanded = false;
function nextJamiahId(){ let m=0; D.jamiahs.forEach(j=>{ if(j.id>m) m=j.id; }); return m+1; }
function findJamiah(id){ return D.jamiahs.find(j=>j.id===id); }
function nextJamiahGroupId(j){ let m=0; j.groups.forEach(g=>{ if(g.id>m) m=g.id; }); return m+1; }
function nextJamiahParticipantId(j){ let m=0; j.participants.forEach(p=>{ if(p.id>m) m=p.id; }); return m+1; }
async function persistJamiah(j){
  const base = j.updated_at||null;
  persistLocal();
  await syncWrite('pd_jamiahs', 'upsert', {id:j.id, name:j.name, account:j.account, start_month:j.startMonth, duration_months:j.durationMonths, groups:j.groups, participants:j.participants, round_group:j.roundGroup, tags:j.tags}, base);
}
function jamiahRounds(j){
  const rounds = [];
  if(!j.startMonth) return rounds;
  let [y,m] = j.startMonth.split('-').map(Number);
  for(let i=0;i<(j.durationMonths||0);i++){
    rounds.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return rounds;
}
function realEstateAllLinkedAccounts(){
  // {account, building, kind} for every apartment/expense account linked to any building
  const rows = [];
  D.realEstateBuildings.forEach(b=>{
    b.apartmentAccountIds.forEach(id=>{ const a=D.accounts.find(x=>x.id===id); if(a) rows.push({account:a, building:b, kind:'Apartment'}); });
    b.expenseAccountIds.forEach(id=>{ const a=D.accounts.find(x=>x.id===id); if(a) rows.push({account:a, building:b, kind:'Expense'}); });
  });
  return rows;
}
function exportRealEstateCSV(){
  const currentMonth = todayStr().slice(0,7);
  const linked = realEstateAllLinkedAccounts();
  if(!linked.length){ toast('No buildings with linked accounts yet', true); return; }
  const months = forecastExportMonthKeys(currentMonth);
  const header = ['Account ID','Account Name','Building','Type','Current Balance', ...months];
  const lines = [header.map(csvEscape).join(',')];
  linked.forEach(({account:a, building:b, kind})=>{
    const row = [a.id, accShort(a.id), b.name, kind, accountBalance(a.id)];
    months.forEach(mk=>{
      row.push(mk<=currentMonth ? forecastActual(a.id, mk) : computeForecastCell(a, mk, currentMonth).plan);
    });
    lines.push(row.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = 'Real Estate Grid - '+todayStr()+'.csv'; dl.click();

}
async function handleRealEstateImport(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {

  };

async function importRealEstateCSV(rows){
  if(blockIfSyncing()) return;
  const startTime = Date.now();
  const currentMonth = todayStr().slice(0,7);
  const linkedIds = new Set(realEstateAllLinkedAccounts().map(r=>r.account.id));
  const sampleKeys = Object.keys(rows[0]||{});
  const monthCols = sampleKeys.filter(k=>/^\d{4}-\d{2}$/.test(k) && k>currentMonth);
  if(!confirm('Import '+rows.length+' rows? This will replace future planned amounts ('+monthCols.length+' future month columns detected) for every matched, building-linked account. Historical/current-month columns are always ignored, and rows for accounts not linked to a building are skipped.')) return;

  showImportProgress('Importing Real Estate Grid…');
  let matched=0, unmatched=0, notLinked=0, planWritten=0; const mismatches=[];
  let processed=0;
  for(const r of rows){
    const id = parseInt(r['account id']||r['account#']||r['account'],10);
    const a = D.accounts.find(x=>x.id===id);
    if(!a){ unmatched++; processed++; continue; }
    if(!linkedIds.has(id)){ notLinked++; processed++; continue; }
    matched++;
    for(const mk of monthCols){
      const raw = r[mk];
      if(raw===undefined) continue;
      const cell = computeForecastCell(a, mk, currentMonth);
      const clean = String(raw).replace(/,/g,'').trim();
      if(cell.editable){
        if(clean===''){ if(D.forecastPlans[a.id]) delete D.forecastPlans[a.id][mk]; }
        else { if(!D.forecastPlans[a.id]) D.forecastPlans[a.id]={}; D.forecastPlans[a.id][mk] = Number(clean); }
        planWritten++;
      } else if(clean!=='' && Math.abs(Number(clean)-Number(cell.plan||0))>0.01){
        mismatches.push({acc:a.id, name:accShort(a.id), month:mk, imported:Number(clean), computed:cell.plan});
      }
    }
    processed++;
    updateImportProgress(processed, rows.length, 'Processing');
    if(processed % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
  }
  persistLocal();
  await syncWrite('pd_forecast_plans', 'upsert', {id:1, plans:D.forecastPlans}, null);

  const elapsedSec = ((Date.now()-startTime)/1000).toFixed(1);
  let msg = 'Import complete: '+matched.toLocaleString()+' matched, '+planWritten.toLocaleString()+' month values written';
  msg += '\nTook '+elapsedSec+'s';
  if(unmatched) msg += '\n'+unmatched.toLocaleString()+' row(s) skipped (no matching account)';
  if(notLinked) msg += '\n'+notLinked.toLocaleString()+' row(s) skipped (account not linked to a building)';
  if(mismatches.length){
    const list = mismatches.slice(0,25).map(m=>`${m.name} (${m.acc}) — ${monthLabel(m.month)}: imported ${money(m.imported)}, kept computed ${money(m.computed)}`).join('\n');

  }

}

/* ============================= INVESTMENTS =============================
   Structure: Platform -> Position -> Transactions + Valuations.

   Cost basis is held in SAR (the amount that actually left the bank), because that is exactly
   what the ledger records and what "SAR used / units bought" produces — so the person's figures
   are already net of fees with no separate fee field needed. Valuations are logged in the asset's
   NATIVE price (e.g. USD for a US stock) and converted at one app-wide USD->SAR rate.

   Co-ownership works by attributing UNITS per owner on each transaction, never by storing a
   percentage. Ownership % is derived as ownerUnits/totalUnits, so it re-derives itself whenever
   anyone buys more — nothing to keep in sync. This also prices each owner in at what the asset
   actually cost on the day they bought, so an owner who joins after a gain doesn't get handed a
   share of gains that happened before they were invested (which is what a contributed-capital
   percentage would silently do).

   Realised gain/loss is DISPLAYED here only. Posting it to the PROFIT account stays a manual
   ledger action, per the person's explicit choice.
*/
const INV_ASSET_CLASSES = ['Stocks','Crypto','Other'];

function invPlatformById(id){ return (D.invPlatforms||[]).find(p=>p.id===id) || null; }

function invNextId(arr){ return 1 + (arr||[]).reduce((m,x)=>Math.max(m, Number(x.id)||0), 0); }
function invFxFor(currency){ return currency==='USD'? getInvFxRate() : 1; }

/* ===================== MANAGEMENT FEE & TRANSACTION ATTRIBUTION =====================
   There is exactly ONE place that decides how a transaction's units and money are split across
   owners. Cost basis, historical state, XIRR, realised gain and the cash balances all read from
   it. A fee applied in some of those and not others would make the same transaction value
   differently on different screens, which is the failure mode this design exists to prevent.

   The fee is charged to FAMILY owners only and always lands on the single self owner:

   - On a BUY it is taken in kind, as units. Buying 100 units split 50/50 at 5% gives the family
     owner 47.5 and the self owner 52.5. The SAR split is deliberately NOT adjusted: the family
     owner still paid for 50 units' worth, so their average cost rises and the self owner's falls.
     That difference IS the fee. Moving the SAR too would just make it a smaller purchase.

   - On a SELL it is taken out of the USD proceeds. Units leave each owner in full, and the fee
     share of the family owner's proceeds is credited to the self owner instead. It reduces the
     family owner's realised gain and is reported as FEE INCOME, not as an investment return —
     it is earned by managing, not by investing, and folding it into the self owner's realised
     gain would flatter the portfolio's performance.                                            */
function invMgmtFeeRate(t){
  const p = Number(t && t.feePct);
  if(!(p>0)) return 0;
  return Math.min(p, 100)/100;
}
function invSelfOwnerId(){
  const s = (D.invOwners||[]).find(o=>o.isSelf);
  return s? s.id : null;
}
function getInvMgmtFeePct(){ const v = Number((D.invSettings||{}).mgmtFeePct); return v>0? v : 0; }
const INV_UNIT_R = 1e8; // 8dp — matches the SAR-split engine; 2dp would destroy a crypto split.
function invRoundUnits(u){ return Math.round(u*INV_UNIT_R)/INV_UNIT_R; }

// units    — who ends up holding the units (fee applied on buys)
// moneySar — the cost/proceeds each owner is credited with for cost-basis and realised-gain
//            purposes (fee deducted from family on sells; the self owner is NOT credited here,
//            because the fee is income rather than an investment return)
// cashSar  — the money that physically moves to/from each owner's cash (fee deducted from family
//            AND added to self, because that is where the money actually goes)
function invTxAttribution(t){
  const rate = invMgmtFeeRate(t);
  const selfId = invSelfOwnerId();
  const totalUnits = Math.abs(Number(t.units)||0);
  const totalSar = Math.abs(Number(t.totalSar)||0);
  let alloc = (Array.isArray(t.owners) && t.owners.length)
    ? t.owners.map(a=>({ownerId:a.ownerId, units:Math.abs(Number(a.units)||0)}))
    : [];
  // Older or partially-entered transactions with no attribution fall back to the self owner, so
  // they still compute instead of silently vanishing from every total.
  if(!alloc.length && selfId!==null) alloc = [{ownerId:selfId, units:totalUnits}];
  const allocUnits = alloc.reduce((s,a)=>s+a.units, 0);
  if(!(allocUnits>0)) return {units:{}, moneySar:{}, cashSar:{}, feeSar:0, feeUnits:0, selfId, valid:false};

  const units={}, moneySar={}, cashSar={};
  let feeSar=0, feeUnits=0;
  for(const a of alloc){
    const oUnits = a.units;
    if(oUnits<=0) continue;
    const oSar = totalSar*(oUnits/allocUnits);
    const isFamily = selfId!==null && a.ownerId!==selfId;
    units[a.ownerId]    = (units[a.ownerId]||0) + oUnits;
    moneySar[a.ownerId] = (moneySar[a.ownerId]||0) + oSar;
    cashSar[a.ownerId]  = (cashSar[a.ownerId]||0) + oSar;
    if(rate>0 && isFamily){
      if(t.kind==='sell'){
        const f = oSar*rate;
        feeSar += f;
        moneySar[a.ownerId] -= f;
        cashSar[a.ownerId]  -= f;
      } else {
        const fu = invRoundUnits(oUnits*rate);
        feeUnits += fu;
        units[a.ownerId] -= fu;
      }
    }
  }
  if(selfId!==null){
    // The shaved units and the fee cash both land on the self owner, so the totals still add up
    // to exactly what was transacted — no units or money are created or destroyed by the fee.
    if(feeUnits>0) units[selfId]   = invRoundUnits((units[selfId]||0) + feeUnits);
    if(feeSar>0)   cashSar[selfId] = (cashSar[selfId]||0) + feeSar;
  }
  for(const k in units) units[k] = invRoundUnits(units[k]);
  return {units, moneySar, cashSar, feeSar, feeUnits, selfId, valid:true};
}
// The units as entered, before any fee adjustment. A sell removes what each owner actually
// holds — the fee comes out of the proceeds, not out of the units leaving — so the unit movement
// on a sell follows this rather than the fee-adjusted map.
function invTxEnteredUnits(t){
  const selfId = invSelfOwnerId();
  const totalUnits = Math.abs(Number(t.units)||0);
  let alloc = (Array.isArray(t.owners) && t.owners.length)
    ? t.owners.map(a=>({ownerId:a.ownerId, units:Math.abs(Number(a.units)||0)}))
    : [];
  if(!alloc.length && selfId!==null) alloc = [{ownerId:selfId, units:totalUnits}];
  const out = {};
  for(const a of alloc){ if(a.units>0) out[a.ownerId] = invRoundUnits((out[a.ownerId]||0) + a.units); }
  return out;
}
// Fee income earned by the self owner, by year. Sell-side only — the buy-side fee is taken in
// units, so it shows up later as gain on those units rather than as income today.
function invFeeIncomeByYear(){
  const byYear = {};
  for(const t of (D.invTransactions||[])){
    if(t.kind!=='sell') continue;
    const at = invTxAttribution(t);
    if(!at.valid || !(at.feeSar>0)) continue;
    const yr = String(t.date).slice(0,4);
    byYear[yr] = (byYear[yr]||0) + at.feeSar;
  }
  return Object.entries(byYear).map(([year,fee])=>({year, fee})).sort((a,b)=>a.year<b.year?1:-1);
}

// Weighted-average-cost engine, run per position over its transactions in date order.
// Returns per-owner units / cost / realised gain, plus position totals.
// asOfDate (optional): filters transactions to those on or before that date, letting the SAME
// engine answer both "state right now" (call with no date) and "state as it stood on some past
// date" (used by the reconciliation-since-a-start-date bridge below) — one weighted-average loop
// rather than a second copy that could drift from this one.
//
// openingCostSar tracks how much of an owner's cost basis came from "Opening balance" buys —
// entries with no bank or platform-cash funding, used to declare a holding you already had before
// tracking started. It bleeds down at the SAME rate as total cost on a sell (proportionally, not
// by lot), which matches weighted-average-cost's own philosophy of not tracking lot identity.
// This is what lets the reconciliation bridge exclude opening balances from the "money that
// should tie back to the bank" side — there is no ledger entry backing them, and never will be.
function computePositionState(posId, asOfDate){
  const txs = asOfDate? invTxForPosition(posId).filter(t=>t.date<=asOfDate) : invTxForPosition(posId);
  const byOwner = {}; // ownerId -> {units, costSar, realizedSar, openingCostSar}
  // Realised gain broken out per transaction per owner. The cash engine needs to know how much
  // of a sell's proceeds was profit rather than returned capital, and re-deriving that with a
  // second copy of this weighted-average loop would be a second source of truth waiting to drift.
  const realizedByTx = {};
  const ensure = oid => (byOwner[oid] = byOwner[oid] || {units:0, costSar:0, realizedSar:0, openingCostSar:0});
  for(const t of txs){
    // Units and money both come from the single attribution helper, so the management fee is
    // applied here exactly as it is everywhere else.
    const at = invTxAttribution(t);
    if(!at.valid) continue;
    // A sell removes the units each owner actually holds (the fee comes out of the proceeds, not
    // the units), so the unit movement on a sell follows the entered split rather than the
    // fee-adjusted one.
    const unitMap = t.kind==='sell'? invTxEnteredUnits(t) : at.units;
    for(const oid in unitMap){
      const oUnits = unitMap[oid];
      if(!(oUnits>0)) continue;
      const oSar = at.moneySar[oid]||0;
      const st = ensure(Number(oid));
      if(t.kind==='sell'){
        // Weighted average cost: the cost released is this owner's average cost times units sold.
        const avg = st.units>0? st.costSar/st.units : 0;
        const costOut = avg*oUnits;
        const gain = oSar - costOut;
        st.realizedSar += gain;
        (realizedByTx[t.id] = realizedByTx[t.id] || {})[oid] = gain;
        // Opening-balance cost bleeds down in the same proportion as total cost, since WAC
        // doesn't distinguish which dollars are leaving on a partial sell.
        const openingRatio = st.costSar>0? st.openingCostSar/st.costSar : 0;
        st.openingCostSar -= costOut*openingRatio;
        st.units -= oUnits;
        st.costSar -= costOut;
        if(st.units<1e-12){ st.units = 0; st.costSar = 0; st.openingCostSar = 0; }
      } else {
        st.units += oUnits;
        st.costSar += oSar;
        if(t.cashSide==='opening') st.openingCostSar += oSar;
      }
    }
  }
  let totalUnits=0, totalCostSar=0, totalRealizedSar=0, totalOpeningCostSar=0;
  for(const k in byOwner){ totalUnits+=byOwner[k].units; totalCostSar+=byOwner[k].costSar; totalRealizedSar+=byOwner[k].realizedSar; totalOpeningCostSar+=byOwner[k].openingCostSar; }
  return {byOwner, totalUnits, totalCostSar, totalRealizedSar, totalOpeningCostSar, realizedByTx};
}
// Full valuation of a position: current market value in SAR and unrealised gain vs cost.
function computePositionValuation(pos){
  const st = computePositionState(pos.id);
  const val = invLatestValuation(pos.id);
  const price = val? Number(val.price)||0 : 0;
  const fx = invFxFor(pos.currency);
  const marketSar = st.totalUnits * price * fx;
  return {
    ...st,
    price, priceDate: val? val.date : null, fx,
    marketSar,
    unrealizedSar: val? (marketSar - st.totalCostSar) : 0,
    hasValuation: !!val,
  };
}
// Per-owner slice of a position's market value, using that owner's share of units.
function ownerSliceOfPosition(pos, ownerId){
  const v = computePositionValuation(pos);
  const o = v.byOwner[ownerId];
  if(!o || o.units<=0) return null;
  const marketSar = o.units * v.price * v.fx;
  return {
    units:o.units, costSar:o.costSar, realizedSar:o.realizedSar,
    marketSar, unrealizedSar: v.hasValuation? (marketSar - o.costSar) : 0,
    pctOfPosition: v.totalUnits>0? (o.units/v.totalUnits*100) : 0,
    price:v.price, priceDate:v.priceDate, hasValuation:v.hasValuation,
  };
}
// Converts a SAR-based split into units. The person often thinks in money ("1K for me, 2K for
// my wife") rather than in fractions of a coin, so the modal lets them enter SAR and derives the
// units from it. Any rounding remainder is placed on the LARGEST holder so the per-owner units
// always sum exactly to the transaction's units — otherwise cost basis would drift by a sliver
// on every split purchase. Units keep full precision deliberately: rounding them to 2 decimals
// would be catastrophic for crypto (0.0125 BTC would become 0.01).
function invDeriveUnitsFromSar(totalUnits, allocSar, totalSar){
  const rows = (allocSar||[]).map(a=>({ownerId:a.ownerId, sar: Number(a.sar)||0})).filter(a=>a.sar>0);
  const sumSar = rows.reduce((s,a)=>s+a.sar,0);
  if(!(sumSar>0) || !(totalUnits>0)) return [];
  // Divide by the transaction's TOTAL SAR, not by what's been allocated so far. Using the
  // running subtotal made a half-filled split read as 100% of the units, so the first person
  // entered appeared to own the whole position until the rest of the rows were typed in.
  const denom = Number(totalSar)>0? Number(totalSar) : sumSar;
  const R = 1e8; // 8 decimal places — enough for crypto; rounding to 2 would destroy a BTC split.
  const out = rows.map(a=>({ownerId:a.ownerId, units: Math.round(totalUnits*(a.sar/denom)*R)/R}));
  // Only reconcile the remainder once the split is complete — forcing units to sum to the total
  // mid-entry would put the whole balance on one person while the other rows are still blank.
  const fullyAllocated = Math.abs(sumSar-denom)<0.005;
  if(fullyAllocated){
    const drift = Math.round((totalUnits - out.reduce((s,o)=>s+o.units,0))*R)/R;
    if(drift!==0 && out.length){
      let idx = 0;
      for(let i=1;i<out.length;i++) if(out[i].units>out[idx].units) idx = i;
      out[idx].units = Math.round((out[idx].units + drift)*R)/R;
    }
  }
  return out;
}
// Units display to 8 decimal places for crypto and stocks, trailing zeros trimmed so whole
// numbers still read cleanly.
function invFmtUnits(u){
  const n = Number(u)||0;
  if(!n) return '0';
  return String(Math.round(n*1e8)/1e8);
}
// The reverse view: what each owner's units are worth in SAR, for showing both columns at once.
function invSarForUnits(totalUnits, totalSar, units){
  if(!(totalUnits>0)) return 0;
  return Math.round((totalSar*(units/totalUnits))*100)/100;
}
function invActivePositions(){ return (D.invPositions||[]).filter(p=>p.status!=='Closed'); }
// Rolls the same asset up across platforms (the person holds some assets in more than one place).
function invAssetRollup(){
  const map = {};
  for(const pos of (D.invPositions||[])){
    const key = (pos.ticker||pos.name||'').trim().toLowerCase();
    if(!key) continue;
    const v = computePositionValuation(pos);
    if(v.totalUnits<=0) continue;
    if(!map[key]) map[key] = {label: pos.ticker||pos.name, assetClass:pos.assetClass, units:0, costSar:0, marketSar:0, platforms:[], anyValuation:false};
    const m = map[key];
    m.units += v.totalUnits; m.costSar += v.totalCostSar; m.marketSar += v.marketSar;
    if(v.hasValuation) m.anyValuation = true;
    const plat = invPlatformById(pos.platformId);
    if(plat && !m.platforms.includes(plat.name)) m.platforms.push(plat.name);
  }
  return Object.values(map).sort((a,b)=>b.marketSar-a.marketSar);
}
// Totals per owner across the whole portfolio. Self and family are reported separately by the UI.
function invOwnerTotals(){
  const out = [];
  for(const o of (D.invOwners||[])){
    let units=0, costSar=0, marketSar=0, realizedSar=0, valued=true;
    for(const pos of (D.invPositions||[])){
      const s = ownerSliceOfPosition(pos, o.id);
      if(!s) continue;
      units += s.units; costSar += s.costSar; marketSar += s.marketSar; realizedSar += s.realizedSar;
      if(!s.hasValuation) valued = false;
    }
    out.push({owner:o, units, costSar, marketSar, realizedSar, unrealizedSar: marketSar-costSar, fullyValued:valued});
  }
  return out;
}
/* ============================= PLATFORM CASH =============================
   Selling an asset and leaving the proceeds on the platform as USD means the money never came
   back to the bank, so it has to be tracked somewhere or it simply disappears from the picture.

   Everything runs as one chronological simulation across every platform at once, rather than
   per-platform, because transfers move money (and the profit sitting inside it) between
   platforms and the running balance at the moment of the transfer is what decides how much
   profit travels with it.

   Two numbers are carried per owner per platform:
     usd        — the cash balance itself.
     profitUsd  — how much of that balance is realised gain rather than returned capital. This is
                  what makes the reconciliation bridge exact: the ledger's Out/In accounts only
                  ever hold capital (profit is booked to the Profit account), so profit sitting
                  in platform cash has to be excluded when comparing the two.
   Buys funded from cash deliberately do NOT consume profitUsd — reinvested profit stays flagged
   as profit, which is what keeps the bridge balanced when gains are rolled back into positions. */
function invCashEvents(asOfDate){
  const events = [];
  const fx = getInvFxRate();
  for(const pos of (D.invPositions||[])){
    const txs = invTxForPosition(pos.id).filter(t=>t.cashSide==='cash');
    if(!txs.length) continue;
    const st = computePositionState(pos.id);
    for(const t of txs){
      const at = invTxAttribution(t);
      if(!at.valid) continue;
      const realised = (st.realizedByTx||{})[t.id] || {};
      const deltas = {};
      for(const oid in at.cashSar){
        const sar = at.cashSar[oid]||0;
        // A buy takes money off the platform; a sell puts it on.
        deltas[oid] = (t.kind==='sell'? sar : -sar)/fx;
      }
      const profitDeltas = {};
      if(t.kind==='sell'){ for(const oid in realised) profitDeltas[oid] = (realised[oid]||0)/fx; }
      events.push({date:t.date, id:t.id, seq:0, platformId:pos.platformId, type:'tx', deltas, profitDeltas});
    }
  }
  for(const m of (D.invCashMovements||[])){
    events.push({date:m.date, id:m.id, seq:1, type:'move', move:m});
  }
  events.sort((a,b)=> a.date===b.date? (a.seq-b.seq || a.id-b.id) : (a.date<b.date? -1:1));
  return asOfDate? events.filter(e=>e.date<=asOfDate) : events;
}
function invCashState(asOfDate){
  const state = {}; // platformId -> ownerId -> {usd, profitUsd}
  let feesUsd = 0;
  const cell = (pid, oid) => {
    const p = state[pid] = state[pid] || {};
    return p[oid] = p[oid] || {usd:0, profitUsd:0};
  };
  const allocOf = m => {
    const rows = (Array.isArray(m.owners)? m.owners : []).map(a=>({ownerId:a.ownerId, usd:Number(a.usd)||0})).filter(a=>a.usd!==0);
    if(rows.length) return rows;
    const selfId = invSelfOwnerId();
    return selfId!==null? [{ownerId:selfId, usd:Math.abs(Number(m.usdAmount)||0)}] : [];
  };
  for(const ev of invCashEvents(asOfDate)){
    if(ev.type==='tx'){
      for(const oid in ev.deltas) cell(ev.platformId, oid).usd += ev.deltas[oid];
      for(const oid in ev.profitDeltas) cell(ev.platformId, oid).profitUsd += ev.profitDeltas[oid];
      continue;
    }
    const m = ev.move;
    const rows = allocOf(m);
    const totalAlloc = rows.reduce((s,a)=>s+Math.abs(a.usd),0);
    if(m.kind==='deposit'){
      for(const a of rows) cell(m.platformId, a.ownerId).usd += Math.abs(a.usd);
    } else if(m.kind==='withdrawal'){
      // The capital/profit split mirrors how the JV is booked (capital to the In account, profit
      // to the Profit account), so the bridge stays exact whichever way the money is taken out.
      const profitTotal = Math.abs(Number(m.profitUsd)||0);
      for(const a of rows){
        const c = cell(m.platformId, a.ownerId);
        const amt = Math.abs(a.usd);
        c.usd -= amt;
        c.profitUsd -= totalAlloc>0? profitTotal*(amt/totalAlloc) : 0;
      }
    } else if(m.kind==='transfer'){
      for(const a of rows){
        const amt = Math.abs(a.usd);
        const from = cell(m.platformId, a.ownerId);
        // Profit travels with the money in the same proportion it sits in the balance being
        // drawn from — otherwise moving cash between platforms would quietly reclassify profit
        // as capital and break the reconciliation.
        const ratio = from.usd>0? Math.min(1, amt/from.usd) : 0;
        const profitMoved = from.profitUsd*ratio;
        from.usd -= amt;
        from.profitUsd -= profitMoved;
        if(m.toPlatformId){
          const to = cell(m.toPlatformId, a.ownerId);
          to.usd += amt;
          to.profitUsd += profitMoved;
        }
      }
      const fee = Math.abs(Number(m.feeUsd)||0);
      if(fee>0){
        // Transfer fees are borne by you alone, not shared with the family owners.
        const selfId = invSelfOwnerId();
        if(selfId!==null) cell(m.platformId, selfId).usd -= fee;
        feesUsd += fee;
      }
    }
  }
  return {state, feesUsd};
}
function invPlatformCash(platformId, asOfDate){
  const {state} = invCashState(asOfDate);
  const byOwner = state[platformId] || {};
  let totalUsd=0, profitUsd=0;
  for(const k in byOwner){ totalUsd += byOwner[k].usd; profitUsd += byOwner[k].profitUsd; }
  return {byOwner, totalUsd, profitUsd};
}
// An owner's cash across every platform, in SAR.
function invOwnerCashSar(ownerId, asOfDate){
  const {state} = invCashState(asOfDate);
  const fx = getInvFxRate();
  let usd=0, profit=0;
  for(const pid in state){
    const c = state[pid][ownerId];
    if(!c) continue;
    usd += c.usd; profit += c.profitUsd;
  }
  return {cashSar: usd*fx, profitSar: profit*fx, cashUsd: usd, profitUsd: profit};
}

// Reconciliation: the tracker's remaining cost basis for an owner should equal what the ledger
// says is still out (money invested minus capital returned), since profit is booked separately.
// The bridge is:
//     cost basis still held  +  cash on platforms  −  realised profit sitting in that cash
//   = ledger Out − In
// The last term is what makes cash fit the existing convention rather than breaking it: the
// Out/In accounts only ever carry capital, because realised profit is booked to the Profit
// account. Profit left sitting on a platform has therefore never touched Out/In and has to be
// taken back out of the comparison, or every profitable sell-to-cash would raise a false alarm.
// Sums an owner's tracker capital across every position/cash source, as of a given date (or
// "now" when asOfDate is omitted). "Capital" excludes both retained profit AND opening-balance
// cost — neither has a matching bank movement, ever, so both are subtracted the same way.
function invOwnerCapitalAsOf(ownerId, asOfDate){
  let costSar=0, openingCostSar=0;
  for(const pos of (D.invPositions||[])){
    const st = computePositionState(pos.id, asOfDate);
    const o = st.byOwner[ownerId];
    if(o){ costSar += o.costSar; openingCostSar += o.openingCostSar; }
  }
  const cash = invOwnerCashSar(ownerId, asOfDate);
  return {
    costSar, openingCostSar, cashSar: cash.cashSar, profitSar: cash.profitSar,
    capital: costSar - openingCostSar + cash.cashSar - cash.profitSar
  };
}
// The bridge is:
//     cost basis still held  −  opening-balance cost  +  cash on platforms  −  realised profit
//     sitting in that cash
//   = ledger Out − In
//
// Opening-balance cost is excluded for the same reason retained profit is: it has no ledger
// entry behind it and never will, because it exists precisely to declare a holding you already
// had before you started tracking. Counting it would raise a permanent false alarm.
//
// When a reconciliation start date is set, the comparison switches to CHANGE SINCE THAT DATE on
// both sides, rather than full history. This matters because you cannot simply drop old ledger
// entries from the sum — a position bought before the start date and sold after it still needs
// its cost counted. Comparing (capital now − capital as of the start date) against (ledger
// activity strictly after the start date) cancels out whatever was wrong before that date on
// both sides equally, so the check becomes "is everything booked correctly from here on,"
// without requiring the historical entries to ever be fixed.
function invOwnerReconciliation(){
  const startDate = (D.invSettings||{}).reconStartDate || null;
  return (D.invOwners||[]).map(o=>{
    const now = invOwnerCapitalAsOf(o.id, null);
    const outAll = o.outAcc? Math.abs(accountBalance(o.outAcc)) : 0;
    const inAll  = o.inAcc?  Math.abs(accountBalance(o.inAcc))  : 0;
    const ledgerNetAll = outAll - inAll;

    let trackerCapital, ledgerNet, sinceDate = null;
    if(startDate){
      const before = invOwnerCapitalAsOf(o.id, shiftDate(startDate, -1));
      const outSince = o.outAcc? Math.abs(sumAcc(l=>l.acc===o.outAcc, startDate, '9999-12-31')) : 0;
      const inSince  = o.inAcc?  Math.abs(sumAcc(l=>l.acc===o.inAcc,  startDate, '9999-12-31')) : 0;
      trackerCapital = now.capital - before.capital;
      ledgerNet = outSince - inSince;
      sinceDate = startDate;
    } else {
      trackerCapital = now.capital;
      ledgerNet = ledgerNetAll;
    }
    const diff = trackerCapital - ledgerNet;
    return {owner:o, trackerCost: now.costSar, cashSar: now.cashSar, retainedProfitSar: now.profitSar,
            openingCostSar: now.openingCostSar, trackerCapital, ledgerNet, diff, sinceDate,
            linked: !!(o.outAcc||o.inAcc), ok: Math.abs(diff)<1};
  });
}
// Platform reconciliation: what the platform's own statement says, against what the tracker
// computes — units per position and the USD cash balance. Unit tolerance is deliberately tiny
// (1e-9) and units are shown at full precision, so a small crypto allocation can't be rounded
// into a false match.
function invPlatformReconciliation(platformId){
  const cash = invPlatformCash(platformId);
  const positions = invPositionsForPlatform(platformId).map(pos=>{
    const st = computePositionState(pos.id);
    const stmt = (pos.stmtUnits===null||pos.stmtUnits===undefined||pos.stmtUnits==='')? null : Number(pos.stmtUnits);
    const variance = stmt===null? null : stmt - st.totalUnits;
    return {pos, trackerUnits: st.totalUnits, stmtUnits: stmt,
            variance, ok: stmt!==null && Math.abs(variance)<1e-9};
  });
  const p = invPlatformById(platformId);
  const stmtCash = (p && p.stmtCashUsd!==null && p.stmtCashUsd!==undefined && p.stmtCashUsd!=='')? Number(p.stmtCashUsd) : null;
  const cashVariance = stmtCash===null? null : stmtCash - cash.totalUsd;
  const entered = positions.filter(r=>r.stmtUnits!==null).length + (stmtCash!==null?1:0);
  const matched = positions.filter(r=>r.ok).length + (stmtCash!==null && Math.abs(cashVariance)<0.005 ?1:0);
  return {platform:p, positions, trackerCashUsd: cash.totalUsd, stmtCashUsd: stmtCash,
          cashVariance, cashOk: stmtCash!==null && Math.abs(cashVariance)<0.005,
          entered, matched, allMatched: entered>0 && entered===matched};
}

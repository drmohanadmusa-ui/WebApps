<script>
/* ============================= STATE ============================= */
// Bump this on every shipped change (major.minor.patch). Shown in Settings.
const APP_VERSION = '4.28.0';
// STANDING CONVENTION (as of v3.6.1, applies to every release from here on):
// every time APP_VERSION is bumped, add a matching entry to CHANGELOG below —
// version, date (YYYY-MM-DD), and a short bullet list of what changed. This is
// shown to the person in Settings → Change Log. Do not skip this step.
const CHANGELOG = [
  {version:'4.28.0', date:'2026-08-24', changes:[
    'Investments page: the four top widgets (Your Cost Basis, Your Current Value, Your Unrealised P/L, Held for Family) and the four widgets inside a position\u2019s detail window now show USD (bold) and SAR (smaller, underneath) together, instead of SAR only.',
    'Removed the price-date line under each position\u2019s price in the platform table \u2014 it was cluttering the table. The price itself is always plain text now. Stale-price alerts live only in Log Prices going forward; the separate \u201cPrices need refreshing\u201d panel on the main Investments page is gone.',
    'NEW: platforms on the Investments page are collapsible, and start COLLAPSED every time the app loads. A collapsed platform shows its USD cash balance, your portion of its value, and your family\u2019s portion, right on the header. Expand/collapse choices are remembered while you\u2019re using the app, but reset on reload.',
    'NEW: Reconciliation \u2192 combined CSV export/import across every platform in one file, for batch updates \u2014 same convention as the price-log CSV (a single writable \u201cNew Statement Value\u201d column; a blank cell leaves that entry untouched rather than clearing it).',
    'Each position in the Reconciliation table now shows its OWN last-checked date, red past 7 days \u2014 previously only one aggregate date was shown per platform. The platform-level summary stays alongside it.',
    'Reconciliation inputs: pressing Enter now jumps to the next field, the same as Tab \u2014 down each platform\u2019s Statement units column, into its Cash row, then straight into the next platform.',
  ]},
  {version:'4.27.0', date:'2026-08-24', changes:[
    'FIXED: the USD entry field from v4.26.0 only appeared for cash and opening-balance funding \u2014 a buy funded straight from the bank on a USD-denominated position (most US stocks, most crypto) still showed \'Total SAR paid\'. It now shows a USD field whenever the POSITION itself trades in USD, regardless of funding source; the SAR figure is still what actually posts, derived at your configured rate.',
    'Price per unit follows the same rule \u2014 reads in USD whenever the position trades in USD, not only for cash/opening transactions.',
    'Editing an older transaction on a USD-denominated position now back-fills the USD field from its stored SAR total, instead of showing a blank USD figure next to a populated SAR one.',
  ]},
  {version:'4.26.0', date:'2026-08-24', changes:[
    'Opening balance transactions now use a USD entry field, same as platform-cash transactions \u2014 SAR is derived at your configured rate. The field also accepts a typed calculation (e.g. 105*10), evaluated when you leave the field.',
    'Price per unit on the transaction modal now reads in USD whenever a USD amount was entered (cash or opening balance), instead of always showing SAR.',
    'FIXED: leaving USD blank on a cash or opening-balance transaction used to show \'Total SAR must be greater than zero\' \u2014 confusing, since that field is derived and disabled. It now correctly says to enter the USD amount.',
    'The Cash log button moved into the same row as + Position / Deposit / Withdraw / Transfer, instead of sitting alone on the balance line.',
    'NEW: manual price entry, alongside the existing CSV import/export \u2014 Investments \u2192 Log Prices now opens with a table of every position, its last known price and how long ago it was set, editable directly. Prices not updated in over 7 days show in red, both there and in the position\'s own Price column on the Portfolio tab.',
    'FIXED: the Reconciliation page\'s tables used independent column widths per platform, so a platform with a long position name (\'Marathon Digital Holdings Inc\') drifted out of alignment against one with short names (\'Virgo\'). Every platform table now shares one fixed column layout.',
    'Reconciliation panels now show when each platform was last reconciled (the most recent of its cash figure or any position\'s unit count), in red if that was more than 7 days ago.',
  ]},
  {version:'4.25.0', date:'2026-08-24', changes:[
    'FIXED: New Position was still defaulting to Stocks / SAR despite the earlier intent to default to Crypto / USD \u2014 the change was never actually made. Fixed.',
    'The Ticker / Symbol field on a position is now forced to uppercase as you type, and normalised again on save as a safety net for anything pasted in.',
  ]},
  {version:'4.24.0', date:'2026-08-24', changes:[
    'The account export buttons (Current Balances, Monthly Movement) moved from Settings \u2192 Chart of Accounts to the Accounts page itself, next to Select and + Add Account.',
    'NEW: Accounts page Grid view (List / Grid toggle at the top). Every account with its current balance and a 12-month scrolling window of monthly movement \u2014 the same figures as the two CSV exports, browsable on screen with Prev / Next and Jump to current month.',
  ]},
  {version:'4.23.0', date:'2026-08-22', changes:[
    'Investments \u2192 Reconciliation start date. If older ledger entries are known to be booked incorrectly, set a start date and the reconciliation switches to comparing CHANGE since that date on both sides, instead of full history \u2014 whatever was wrong before the start date cancels out of the comparison equally on both sides, so the check becomes \'is everything booked correctly from here on\'.',
    'NEW: Opening balance funding source on a buy \u2014 declares a holding you already had before you started tracking, with no bank or platform-cash movement. Excluded from Reconciliation, since there is no ledger entry to match it against.',
    'NEW: transfer units of the same asset between platforms (\u21c4 Transfer on a position). If a matching position already exists on the destination it merges in, otherwise a new one is created there automatically. Partial transfers are supported, and a network/withdrawal fee is entered in the asset\'s own units. Ownership proportions carry over unchanged \u2014 nothing is re-entered manually. The fee\'s value is recorded as a small realised loss, split across the current owners in their existing proportions, using the ordinary weighted-average-cost engine rather than a separate calculation.',
    'Price logging is now CSV-based instead of typed one row at a time \u2014 Investments \u2192 Log Prices exports Position, Ticker, Platform, Units Held, Last Price, Last Price Date and Amount Total, you fill in New Price for whatever you checked, and re-import. Rows left blank keep their last known price rather than being cleared.',
    'NEW: Settings \u2192 Chart of Accounts \u2192 Export Accounts. Current Balances (Account #, Name, Category, Balance) and Monthly Movement (every account, one column per month, from the earliest ledger entry through this month) as two separate CSV exports.',
    'Real Estate: a collapsed building now shows its net figure for the current month right on the header, instead of only being visible after expanding.',
    'DATABASE CHANGE: adds pd_inv_settings.recon_start_date and pd_inv_transactions.link_id / fee_units. Copy and run the script under Settings \u2192 Database Schema \u2014 it upgrades an existing database in place.',
  ]},
  {version:'4.22.0', date:'2026-08-22', changes:[
    'There is now ONE database script instead of two. Settings \u2192 Database Schema both builds a new database from nothing and brings an existing one up to date. The separate Migrations section has been removed.',
    'This closes a real trap rather than just tidying up. \'create table if not exists\' is skipped WHOLESALE when the table is already there \u2014 including any column added in a later version \u2014 and it reports success either way. Running the old full script against your live database would have created the new tables while silently leaving the new columns out, and the app would then have failed to save those fields with nothing obvious to show for it.',
    'The upgrade half of the script is generated from the table definitions rather than kept as a separate list, so it cannot fall behind when a column is added. There is no second list to forget to update.',
    'Rule of thumb: after any update whose notes mention a database change, copy the script and run it. Nothing bad happens if you run it when you did not need to.',
  ]},
  {version:'4.21.0', date:'2026-08-22', changes:[
    'FIXED: adding a line to a JV while reconciling an account pre-filled the new line with that same account \u2014 which looked like the first line\'s account copying itself down the voucher. New lines now always start blank. Starting a reconciliation still fills line 1, and the \u2934 button still copies the account from the line above when you want it.',
    'The JV account, description and amount fields now tell the browser not to autofill them, so its own saved form values can no longer drop into a voucher.',
    'The Dashboard\'s This Month Expense card now shows the plain over/under against the month\'s budget. The \'on pace\' figure and its day count have been removed. Clicking the line still opens the P&L for this month.',
    'NEW: Settings \u2192 Database Schema now also lists the MIGRATIONS \u2014 the additive scripts that upgrade a database you already have. The full schema script only builds a database from nothing; run against a live one it silently does nothing, so a newly added column would never appear. Each version can be copied on its own or all together.',
    'FIXED: the schema script was missing pd_sync_meta, the table behind \'skip re-downloading the ledger when nothing changed\'. The app reaches it directly rather than through the usual fetch path, which is how it escaped the check that is supposed to catch exactly this. That check now covers both paths. A database built from the old script worked, but always re-downloaded the full ledger on every load; the v4.21.0 migration adds it.',
    'DATABASE CHANGE: optional. Run the v4.21.0 migration (Settings \u2192 Database Schema) to enable the ledger-skip optimisation. Everything else in this version works without it.',
  ]},
  {version:'4.20.0', date:'2026-08-22', changes:[
    'NEW: platform cash balances. Selling an asset and leaving the proceeds on the platform as USD is now tracked properly instead of the money vanishing from the picture. Each platform carries its own USD balance, shown on its panel along with its SAR equivalent.',
    'Buys and sells now say where the money comes from or goes to \u2014 your bank, or the platform\'s own USD cash. When cash is the counterparty you type the USD figure and the SAR is derived at your configured rate, so the two can never disagree.',
    'NEW: deposits, withdrawals and transfers between platforms. Transfers take a fee, charged to you alone rather than shared with the family owners. Withdrawals are split into their capital and profit portions, mirroring how you would book the JV (capital to the In account, profit to the Profit account).',
    'NEW: management fee. Set a default percentage once and it is applied consistently to every family owner. On a BUY it is taken in units \u2014 100 units split 50/50 at 5% gives them 47.5 and you 52.5 \u2014 while the SAR split stays as entered, so their average cost rises and yours falls. On a SELL it comes out of their proceeds and is credited to you.',
    'Fee income is reported in its own table, separate from realised gain, because it is earned by managing rather than by investing \u2014 folding it in would flatter the portfolio\'s performance.',
    'NEW: Reconciliation sub-page on the Investments page. Enter what each platform\'s own statement shows \u2014 the unit count for every position and the USD cash balance \u2014 and anything that disagrees with the tracker is flagged. Entries are saved and synced per platform, so a half-finished check survives a reload.',
    'The owner reconciliation now shows the full bridge: cost basis, plus platform cash, less realised profit still sitting in that cash, against the ledger\'s Invested minus Withdrawn. Profit retained on a platform is excluded because it is booked to the Profit account and never passes through those two.',
    'DATABASE CHANGE: run the migration SQL shipped alongside this version before using it. It adds the pd_inv_cash_movements table and several new columns. It is additive only \u2014 nothing existing is altered or dropped.',
  ]},
  {version:'4.19.0', date:'2026-08-22', changes:[
    'Allocation numbers are now clickable. The Alloc badge on the Ledger page opens that allocation\'s detail window directly, and the Journal Voucher window has gained an Alloc column showing which allocation each line belongs to (blank when the line is not allocated), also clickable.',
    'The Dashboard\'s This Month Expense card now shows how you are tracking against budget, using exactly the same budget figures as the P&L page\'s Total Expenses card. Two readings are given: against the full month\'s budget, and \'on pace\' — the budget scaled to the days elapsed so far, which is the one that actually tells you anything before month end. Clicking the line opens the P&L for this month.',
  ]},
  {version:'4.18.0', date:'2026-08-19', changes:[
    'The offline cache has moved out of localStorage and into IndexedDB. localStorage is capped at roughly 5 MB PER DOMAIN — shared with every other app on the same hostname — and a full ledger history no longer fits. IndexedDB has its own far larger quota, stores structured data natively, and does not compete with other apps for that 5 MB.',
    'The move runs once on your next load, with a progress screen. It is non-destructive: the old data is copied, read back, and verified record-by-record, and only then is the old key removed. If it is interrupted or fails verification, the original cache is left completely untouched and the move simply runs again next time.',
    'Each collection is now stored as its own record instead of one large blob, so changing one thing no longer rewrites everything.',
    'If IndexedDB is unavailable (private browsing, some embedded browsers), the cache falls back to localStorage but is trimmed to the last 6 months of history so it stays small. Older history remains available whenever you are online.',
    'LedgerOS now checks its own share of the domain\'s localStorage on startup and warns you if it climbs above 25%, rather than leaving it to be discovered after another app has already lost data.',
    'No database or SQL change is needed for any of this — it is entirely local to your browser.',
  ]},
  {version:'4.17.0', date:'2026-08-19', changes:[
    'NEW: Settings → Local Storage. Shows every key stored by every app on this domain (not just LedgerOS), sorted largest first, with sizes, a usage bar against the ~5 MB per-domain limit, and a split between LedgerOS and other apps. Scanning the whole domain is the point: browsers share one 5 MB pool across every app on a hostname, so filtering to one app\'s own keys hides the app that is actually filling it.',
    'The same screen breaks the offline cache down by collection — records, total size and bytes per record — so its size is an answer rather than a guess.',
    'NEW: a guarded "Clear offline cache" action for immediate relief. The cache is a disposable mirror of cloud data, so clearing it loses nothing, but it is blocked while any change is still waiting to sync.',
    'FIXED (data loss risk): a failed write to the pending-sync queue was swallowed by an empty catch block. That queue holds changes that have NOT reached the cloud yet, so when storage was full those changes disappeared on the next refresh with no warning. It now raises an urgent, visible alert.',
  ]},
  {version:'4.16.0', date:'2026-08-19', changes:[
    'Investments → Owners: an owner can now be deleted from their edit window. Deletion is blocked while they are attributed units on any transaction, and the window tells you how many are in the way instead of just greying the button out.',
    'Account statements now open newest-first instead of oldest-first, and the sort choice is remembered on that device once you change it.',
    'FIXED: the browser\'s up/down arrows on number fields sat on top of the digits, making a value like 50000 look struck through. The arrows are gone; typing is unchanged.',
  ]},
  {version:'4.15.0', date:'2026-08-19', changes:[
    'FIXED: the SAR split showed the wrong units while you were still filling it in. It divided by the amount allocated so far instead of the transaction total, so entering 50,000 of a 100,000 SAR purchase made the first person read as owning the full 1 unit. It now divides by the transaction total, so a half-filled split correctly reads as half the units.',
    'FIXED: typing in the New Transaction window threw the cursor out of the box. Every keystroke re-rendered the whole modal, which destroyed and recreated the input being typed in. Only the calculated figures are updated now, so focus stays put.',
    'Units display to 8 decimal places throughout the transaction window, so crypto amounts are no longer truncated on screen. The 2-decimal limit applies to SAR amounts only.',
    'NEW: Ctrl+Enter (Cmd+Enter on Mac) confirms the primary action of any open window — Save, Done, and so on. It works in every existing window, including adding an investment owner, and will work in any window added later without extra wiring. Delete buttons are never triggered by it.',
  ]},
  {version:'4.14.0', date:'2026-08-19', changes:[
    'New JV: the Post JV button now shows a spinner and reads "Posting…" while the entry is being written. Posting waits on one write per line, so a multi-line JV could previously sit for a moment with no feedback. The button restores itself if posting fails and you are still on the page.',
    'Investments: a transaction can now be split by SAR instead of units. Enter what each person paid (e.g. 5,000 SAR of BTC — 1,000 yours, 2,000 your wife\'s, 2,000 your mother\'s) and the units are worked out from those amounts. Both the SAR and the units columns are always shown, whichever way you are entering, and reopening a saved transaction back-calculates the SAR split so either view is ready.',
    'Any rounding remainder in a SAR split is placed on the largest holder, so per-owner units always add up exactly to the transaction total and cost basis cannot drift by a sliver on every split purchase.',
    'Units keep full precision in a SAR split rather than being rounded to 2 decimals — rounding them would be destructive for crypto, where 0.0125 BTC would become 0.01. The 2-decimal limit applies to the SAR amounts, which is correct for currency.',
  ]},
  {version:'4.13.0', date:'2026-08-19', changes:[
    'Settings is now a proper page in the sidebar (⚙️, pinned to the bottom) rather than something you reach by clicking the sync pill. The pill still shows sync status but is no longer clickable.',
    'NEW: drag and drop to reorder the sidebar, under Settings → 🧭 Pages. The order is synced across your devices (requires migration_ui_prefs.sql), so the sidebar reads the same on phone and desktop. Page visibility stays per-device, as before.',
    'Dashboard and Settings no longer have a visibility toggle and are always shown — hiding Settings would remove the only place to un-hide anything. This is enforced in code, not just hidden in the interface.',
    'A page added by a future version is appended to your saved order rather than dropped, so new pages can never silently fail to appear once you have a custom ordering.',
  ]},
  {version:'4.12.0', date:'2026-08-18', changes:[
    'Every page now has an icon in the sidebar, and it carries through to the mobile top bar, the command palette, and the page-visibility list in Settings.',
    'NEW: Settings → Database Schema. The complete, runnable SQL to stand up a brand-new LedgerOS database from scratch — every table, index and RLS policy, plus the structural singleton rows the app needs to function. Copy it or download it as a .sql file. It contains no personal data; your accounts and ledger come back via Backup & Restore. A test now checks this script against every table the app actually reads, so it cannot silently go stale as new tables are added.',
    'Budget → Plan vs Actual: the whole line is now clickable to open that account\'s transactions for the month, instead of only the account number.',
    'Deleting a JV is no longer possible anywhere. It is replaced by ↩ Reverse this JV, which posts a mirror-image JV dated today with the opposite amounts, so the net effect is zero and the original stays in the ledger as history. Each reversal line is described as "Reversal of JV #… — [original text]" and keeps the historical account name. Reversal lines are deliberately left unallocated; if the original was assigned to an allocation group you are warned so you can revisit it.',
  ]},
  {version:'4.11.0', date:'2026-08-18', changes:[
    'The USD→SAR rate is now SYNCED across devices instead of being stored per-device. The rate directly scales reported portfolio value, so a device-local rate meant the same portfolio could read differently on phone and desktop. Requires migration_inv_settings.sql.',
    'NEW: Bulk CSV for investments — export transactions and prices, edit in Excel, re-import. Built mainly for back-filling years of historical purchases without going through the modal one row at a time. Import is all-or-nothing: every row is validated first (unknown position or owner, bad date, owner units not summing to the row total) and a dry run checks no owner would end up holding negative units, so a bad file can never half-import and corrupt cost basis.',
    'NEW: Value vs Cost chart over time, reconstructed properly — units held and price as of each historical date, not today\'s figures projected backwards.',
    'NEW: Allocation doughnuts by asset class and by platform.',
    'NEW: Annualised return (XIRR) KPI. Because purchases are spread across years, a naive percentage would misstate performance; this weights each contribution by when it was actually made.',
    'NEW: Stale price warnings — any held position never priced, or not repriced in 14 days, is surfaced on the page, since an outdated price silently makes the whole portfolio value wrong.',
    'NEW: Realised gain/loss summarised by calendar year (your own share). Still display-only — posting to the PROFIT account remains a manual ledger entry.',
  ]},
  {version:'4.10.0', date:'2026-08-18', changes:[
    'NEW: Investments tracker (Phase 1). Structured as Platform → Position → Transactions + Valuations, so the same asset held on two platforms is tracked separately but still rolled up into a single total for that asset.',
    'Cost basis is held in SAR — the amount that actually left your bank, already net of fees — while prices are logged in each asset\'s own currency and converted at one USD→SAR rate you set on the page.',
    'Co-ownership works by attributing UNITS per owner on each transaction rather than storing percentages. Shares are derived as units ÷ total units, so they re-derive themselves whenever anyone buys more, and each owner is priced in at what the asset cost on the day they bought — an owner joining after a gain does not receive a share of gains earned before they invested.',
    'Family holdings (money passing through your accounts) are reported separately from your own and are deliberately excluded from Dashboard net worth at this stage.',
    'Reconciliation check: flags when the tracker\'s remaining cost basis stops matching the ledger (Invested Out minus Withdrawn In), so the two cannot silently drift apart.',
    'Realised gain/loss on a sale is calculated on a weighted-average-cost basis and displayed on the Investments page only — posting it to your PROFIT account remains a manual ledger action.',
    '"Log Prices" screen: one date and one price per position, so a weekly or monthly update is a single screen and one save.',
    'Per-owner Arabic statement showing position details, purchase value, current value, change and portfolio total.',
    'Requires the accompanying migration_investments.sql to be run first — it creates five new tables and is additive only.',
  ]},
  {version:'4.9.0', date:'2026-08-18', changes:[
    'Arabic Settlement Statement: added a "Round amounts up" toggle on the review screen. When on, the clean output rounds every line up to the next whole number (13.01 and 13.99 both become 14.00; a line already at 13.00 stays as it is), and the total is the sum of those rounded lines so the printed column always adds up to the printed total. The review screen itself keeps showing exact amounts — rounding applies to the clean output only. The toggle starts off each time a statement is generated.',
    'Fixed the sidebar re-animating on every page change: the whole nav list replayed its staggered fade-in each time you switched pages, because the nav is rebuilt on navigation and the entrance animation sat on every button. The animation now plays once when the app loads, and switching pages just moves the highlight.',
  ]},
  {version:'4.8.1', date:'2026-08-16', changes:[
    'Fixed the account search fix from v4.8.0, which missed 7 other account pickers that were still using the old exact-substring matching: the Ledger page\'s own Account filter (the one actually reported as still broken — this is a separate picker from the JV line one), the Accounts settings search box, Provisions\' account picker, Real Estate\'s account pickers, Smart Rules\' account picker, and both account pickers in JV Templates. All now use the same token-based search as everywhere else.',
    'Arabic-language tables (Settlement Statement, and any other RTL table) now right-align their column headers instead of defaulting to left-aligned text inside a right-to-left table.',
  ]},
  {version:'4.8.0', date:'2026-08-16', changes:[
    'P&L page: added a "% of Total" column to the Expenses table, showing each line and category subtotal\'s share of Total Period Expenses.',
    'Fixed account search across the app: it previously required your typed text to appear as one contiguous chunk, so e.g. "gifts expenses" would not find "Gifts - Expenses" because of the hyphen. Search is now token-based — each word you type just needs to appear somewhere in the account name, in any order. Applied everywhere an account can be searched: JV entry/edit, Jamiah\'s linked account, the Allocations account filter, and Accrual Mappings\' Liability/Expense pickers (the last three were previously plain non-searchable dropdowns and are now searchable too).',
    'Arabic Settlement Statement: added a per-line "Include" checkbox — unchecking a line excludes it from the running total, which updates immediately. Added a "Generate clean output" view: a read-only table (JV No, Date, Arabic description, Amount, Total) reflecting only the included lines, for on-screen review once translation and exclusions are finalized.',
  ]},
  {version:'4.7.0', date:'2026-08-13', changes:[
    'P&L page: fixed the expense variance color using a raw signed subtraction (actual − budget), which could show a genuine surplus in red instead of green depending on an account\'s sign convention. Now compares magnitudes (matching the Total Expenses KPI card above it, which already did this correctly) — positive/green always means under budget, negative/red always means over, regardless of sign convention.',
    'Added real progress screens (bar + running count) to three operations that could previously run for a while with no feedback: the Forecast page\'s "Always prefer Budget/Provisions" bulk resolver, "Force Full Ledger Refresh" (Settings), and Batch Edit on 4+ accounts at once.',
    'Ledger page: search box is now debounced (200ms) instead of re-filtering and rebuilding the entire results table on every single keystroke — fixes the lag between typing and seeing it reflected, especially on a large ledger.',
    'Fixed the loading screen\'s progress bar jumping to ~80-90% almost instantly and then sitting still for the rest of the wait. It was only tracking how many of 16 data sources had *fully* finished — 15 of them are small and resolve instantly, so nearly the whole real wait was for the Ledger (by far the largest), which only counted as "1 of 16" with no visible movement. The bar now blends in the Ledger\'s own real page-by-page download progress, and an explicit percentage number is now shown above it.',
  ]},
  {version:'4.6.1', date:'2026-08-13', changes:[
    'New: a 📌 pin toggle next to the theme button, off by default — when turned on, it forces the full desktop sidebar to stay visible even if the browser window is narrow (a smaller monitor, split-screen, etc.), instead of collapsing into the mobile drawer treatment. Saved locally per device.',
    'Fixed a real bug from the last release: the mobile-only CSS block (nav drawer, top bar, safe-area padding) had its braces accidentally split while adding the Allocations table fix, so those rules were applying at every screen width instead of only under 760px — could have caused layout issues on desktop depending on browser/zoom. Verified the stylesheet\'s braces now balance correctly and re-ran the full test suite.',
  ]},
  {version:'4.6.0', date:'2026-08-13', changes:[
    'Mobile: replaced the old mobile nav (which unrolled the entire desktop sidebar — logo, search, all 10 page links, sync status, theme toggle — into one long wrapping block above your content) with a real collapsible menu. A compact top bar with a menu button now sits above the page; tapping it slides in a proper nav drawer over a dimmed background, closes on selecting a page, tapping outside, or pressing Escape.',
    'Mobile: fixed content rendering underneath the phone\'s status bar (clock/signal/battery icons overlapping table rows). The app was telling iOS to draw edge-to-edge under the notch (viewport-fit=cover) without ever padding for it — added proper safe-area padding to the new top bar, the nav drawer, the main content area, and the toast notification.',
    'Mobile: the Dashboard\'s Bank Accounts reconciliation table and the Allocations \u2192 Unallocated table are now properly scrollable with the account name staying visible (sticky), instead of the Statement Balance input overflowing off-screen or descriptions getting squeezed into 4-5 wrapped lines. A broader pass across every other table in the app is a good candidate for a future round if this is still cramped in places.',
  ]},
  {version:'4.5.0', date:'2026-08-12', changes:[
    'New: Historical Account Name. Every JV posted from now on freezes the account name it was posted against — renaming an account later no longer rewrites how old transactions display, in the Ledger, JV views, allocation views, and the Budget category drill-down. Older transactions (posted before this existed) keep showing the live name, same as always, unless corrected via the new Bulk Editor below.',
    'New: Ledger Bulk Editor (Settings → Import CSV → 🛠 Ledger Bulk Editor). Export your entire ledger to CSV, edit any field — including moving transactions between accounts, re-grouping JV#s, correcting a Historical Name, or deleting rows via a Delete column — then re-import. Every row is matched by its Row ID, never by JV#/account/date. Nothing is applied until the whole file passes validation: if any JV would stop balancing to zero, or any previously-closed allocation would break, the entire import is blocked and you get a report of exactly which rows caused it, with nothing changed.',
    'Dashboard: fixed the Short Term Equity / Cash Bank Account / Long Term Equity breakdown popups showing a different total than the card itself (Bank Accounts was including the internal "Working Capital" rollup account in the popup while excluding it from the card). All of these now share one calculation, so the card and its popup can never drift apart again.',
    'Dashboard: KPI cards no longer replay their entrance animation every time you save a bank statement balance (reconciliation) or otherwise re-render the page while already on it — only a genuine navigation to the Dashboard animates them in now.',
    'Ledger: the search box now also matches amounts (partial match, same style as the existing account search) — searching "500" finds 1,500.00, 500.25, etc.',
  ]},
  {version:'4.4.0', date:'2026-08-12', changes:[
    'New feature: Drift Detection. Flags Provisions lines and fixed-value Smart Rules whose planned amount has consistently stopped matching what\'s actually posting (e.g. an insurance premium that renewed at a higher rate but the provision was never updated) — surfaced as a "📉 Drift Alerts" card on the Dashboard, plus inline badges on the Provisions grid and the Smart Rules table.',
    'Drift threshold (default 15%) and how many consecutive months of drift are required before flagging (default 2) are both configurable in Settings → Drift Detection. Kept local to this device only, not synced.',
    'Each flag can be dismissed — dismissal holds until a new month closes and enters the comparison window, at which point it\'s freshly re-evaluated against current numbers rather than staying muted forever or reappearing every day.',
    'Fully local computation — no server calls, no cost, recomputed live whenever the Dashboard, Provisions, or Smart Rules pages render.',
  ]},
  {version:'4.3.2', date:'2026-08-12', changes:[
    'Fixed content peeking out from behind sticky (fixed) columns while scrolling right — a sub-pixel rendering seam let a sliver of the scrolling column show through past the sticky column\'s edge. Fixed once, app-wide, everywhere a sticky column is used (Forecast Grid, Provisions, Cash Position, Budget grid).',
    'Hardened Provisions line descriptions against a narrow case where an edit could be dropped without saving if a sync happened to be in flight at that exact moment — the local edit now always applies immediately, with only the remote write ever deferred (and queued for retry, never lost).',
    'Cash Position / Forecast drill-through flash is now 3x faster per flash, with the total flash held to a precise 4 seconds.',
    'Smart Rule creation page: the account search dropdown now supports arrow-key navigation (Up/Down to highlight, Enter to pick), matching every other account picker in the app. Also fixed a real bug where changing any other field (Applies At, Source, etc.) would silently clear the Rule Name you\'d just typed — the name field wasn\'t being kept in sync with the in-memory draft, so every re-render reverted it.',
    'Smart Rules: added a "Freeze months after the target as 0" toggle. When on, every month after the rule\'s target month is forced to 0 and locked from editing — but only while that month is still blank; anything already manually typed in is left untouched. Requires a small schema migration — see migration_freeze_after_target.sql (additive only, no RLS changes needed).',
    'Forecast page: every category section header ("Income ▾ Collapse" etc.) now stays fixed in place while scrolling its table right, instead of scrolling away with it — same fix as the Cash Position panel from the last release.',
    'Fixed a real regression from the last release: separating the Cash Position panel\'s header from its table had accidentally dropped that panel out of the page-wide horizontal scroll-sync group, since the sync logic was looking for a specific panel+style combination that no longer matched. Replaced that lookup with a dedicated class used consistently by every scrollable table on the Forecast page, which also covers the new sticky section headers above.',
  ]},
  {version:'4.3.1', date:'2026-08-11', changes:[
    'Budget page: account names now stay fixed (sticky) while scrolling right through the grid, matching the Forecast Grid behavior.',
    'Cash Position panel ("💰 Bank Accounts — Projected Cash Position"): the whole header — title, "Anchor to real balance" toggle, description text, and the reversed-sign warning — now stays in place while scrolling the table right, instead of scrolling away with it. Only the table itself scrolls now.',
    'Cash Position drill-through: the glow-highlight on the destination cell now flashes 5 times instead of once, making it easier to spot after the page jumps there.',
    'Fixed a real bug: saving a bank statement balance on the Dashboard (reconciliation) could leave the KPI tiles stuck showing 0 until you navigated away and back. Root cause — the KPI tiles always rendered "0" first and relied entirely on the one-shot entrance animation to ever show the real number, so any re-render after that animation had already played (like the one triggered by saving a statement balance) left them stuck. KPI tiles now show the real value immediately whenever a fresh entrance animation isn\'t about to play.',
    'Fixed a real bug: clicking "Post JV" twice quickly (e.g. a mis-click) could post the same journal voucher twice under two different JV numbers, since the draft wasn\'t cleared until after the sync calls finished. Added a guard so a second click during posting is ignored instead of creating a duplicate.',
  ]},
  {version:'4.3.0', date:'2026-08-10', changes:[
    'Fixed Dashboard showing zero on first open, requiring a navigate-away-and-back to fix: a real regression from the last redesign session, where the initial sync flow was calling go(\'dashboard\') twice on success, silently breaking the KPI count-up animation\'s one-shot guard.',
    'Cash Position panel: category labels are now sticky while scrolling right, matching the Forecast Grid fix from before.',
    'Fixed a subtler cause of content bleeding through near sticky columns on the Forecast Grid, Provisions grid, and Cash Position panel — position:sticky on table cells is known to render unreliably when combined with border-collapse:collapse, which is the app-wide default. Added a targeted fix for just these three tables, without touching the global table style.',
    'Strengthened the dark-mode readability fix from before — Total Monthly Inflows/Outflows now use the same neutral highlight surface as other total rows elsewhere in the app, removing any residual risk of colored text losing contrast in either theme.',
    'Global search (Ctrl+K) animation slowed down for a more pronounced, gradual reveal, as requested.',
    'Budget page: charts moved to the top of the page, right after the month selector. The Budget vs Actual chart is now interactive — clicking either bar for a category opens a breakdown of the real transactions behind that figure, with the budgeted amount shown alongside for comparison.',
  ]},
  {version:'4.2.0', date:'2026-08-10', changes:[
    'Fixed a real dark-mode readability bug: "Total Monthly Inflows" and "Total Monthly Outflows" on the Forecast page used hardcoded light backgrounds that didn\'t adapt to dark mode, making the (also-adjusted) text unreadable. Now theme-aware everywhere.',
    'Forecast Grid: account names and Current Balance are now sticky while scrolling right, matching the earlier Provisions fix. Also fixed the same underlying bug there — editing any cell was rebuilding the page and silently resetting your scroll position back to the leftmost column.',
    'Added Ctrl+K (Cmd+K on Mac) global search — searches pages, accounts (by ID, name, or description), and journal vouchers by number, with arrow-key navigation. Also added a visible Search button in the sidebar for discoverability.',
    'The sync progress bar on the splash screen is now real — it tracks actual completion across all 16 data sources fetched during the initial sync, not a simulated animation.',
    'Added a subtle, theme-aware gradient to the main content background, built from your actual accent color — automatically follows both your accent choice and dark/light theme.',
    'Added a decorative accent shape to dashboard KPI tiles (a soft circle in the corner), in the same spirit as the reference design you shared.',
    'Budget page: added two charts — Budget vs Actual by category for the selected month, and a 6-month spending trend line. Both refresh when you change the month or toggle the theme, so colors never go stale.',
    'Confirmed dashboard KPI tiles already had entrance animation, hover lift, and count-up-from-0 number animation fully working from earlier work — verified rather than rebuilt.',
  ]},
  {version:'4.1.0', date:'2026-08-10', changes:[
    'Fixed the Automatic content width setting sometimes not sticking (reverting to Manual until a restart) — traced to a systemic gap where 13 different settings functions never checked whether their save to local storage actually succeeded. All of them now warn clearly and immediately if a save fails, instead of silently reverting on the next screen.',
    'Fixed a real P&L bug: the Budget column only ever looked at manually-entered Budget rows, completely missing figures sourced from Provisions — which is how most recurring expenses (like "Madinah Home Rent") actually get planned in this app. P&L now resolves each account\'s budget the same way, month by month, that the Budget page itself does (Provisions checked first, falling back to Budget rows).',
    'Fixed Provisions grid losing your scroll position — editing any cell rebuilds the grid, which was silently snapping the view back to the leftmost column even when scrolled over to future months. Scroll position is now preserved across every edit.',
    'Provisions CSV import now reports how many cells actually changed value, not just how many were written — re-importing the same numbers now honestly shows 0 changed.',
    'Draft journal vouchers can now be exported individually as CSV from the Drafts list.',
    'Clicking any month\'s figure on the "💰 Bank Accounts — Projected Cash Position" panel now jumps to and glow-highlights that category\'s subtotal for that exact month in the section below.',
    'Added a real full-screen splash screen (animated mark, status line, bypass button) that covers the entire initial sync on first load — the app now stays blocked until that first sync genuinely finishes, not just until the fast local cache loads. Only applies to the very first sync when the app opens; later syncs (posting a JV, manual "Sync Now", periodic background syncs) still use the existing lightweight indicator. A "Use local copy for now" button appears after 30 seconds or if you\'re offline, so a stuck connection can\'t trap you on the splash screen.',
  ]},
  {version:'4.0.0', date:'2026-08-10', changes:[
    'Visual redesign — a precision-ledger direction: a new cool, near-black-and-indigo palette replacing the old warm brass/serif look, Space Grotesk for headings paired with Inter for body text (both now actually load via Google Fonts — the old fonts were referenced but never loaded), IBM Plex Mono unchanged for all numbers.',
    'A tiered shadow system: subtle elevation on ordinary panels, heavier presence on KPI/summary tiles, and a strong "pop" shadow on modals — so hierarchy reads at a glance instead of everything looking equally flat.',
    'Sidebar is now a genuine solid dark surface regardless of theme, with a nav entrance stagger on load/navigation, a hover indent, and the active page getting a soft glow in the current accent color (uses color-mix, so it automatically matches whichever accent you have selected).',
    'Modals now animate in on open (a quick scale + fade). Careful to only trigger this on a genuine fresh open, not on internal re-renders while a modal is already showing (e.g. editing a form inside it) — otherwise every keystroke would replay the animation.',
    'Settings tab switches fade in. Badges/tags get a small lift on hover. Checkboxes pick up the new accent color.',
    'Added Indigo as a new default accent color option (Settings → Appearance) alongside the existing Amber, Blue, Green, Purple, Rust, and Teal — if you\'d already picked one of those explicitly, that choice is untouched.',
    'Updated the default positive/negative (green/red) colors and the "System Default" font option to match the new look — these are the same customizable settings as before, just new defaults for anyone who hasn\'t already set their own.',
  ]},
  {version:'3.13.1', date:'2026-08-06', changes:[
    'Reversed the paired Source columns added to the wide "Export Grid" CSV last time — it\'s back to its original format. The "Export Grid (Pivot)" export keeps its single Source column.',
    'Forecast Grid import: when there are mismatches or unmatched rows, you can now export the full detailed error report as a CSV instead of only seeing a summary truncated to 25 rows. Covers both value mismatches (imported figure disagreed with what the app computes) and unmatched rows (no matching account found).',
  ]},
  {version:'3.13.0', date:'2026-08-06', changes:[
    'Forecast CSV exports now include a "Source" column showing where each figure came from (Manual entry / Provisions / Budget / Actual (historical) / Smart Rule / etc). The wide "Export Grid" gets a paired Source column next to every month; "Export Grid (Pivot)" gets a single Source column since it\'s already one row per account-month. Re-importing an exported wide grid still works exactly as before — the new columns are ignored on import.',
    'Smart Rules can now target a month ahead instead of only the current month (Settings → ⚡ Smart Rules → "Applies at"). Choosing +1/+2/+3 months forces every month from the current one up to (but not including) the target to 0, and the target month itself shows the live-computed value — e.g. a quarterly sweep where nothing happens in between and the full amount lands on the target month. Existing rules are unaffected (default to current-month-only, unchanged).',
  ]},
  {version:'3.12.1', date:'2026-08-06', changes:[
    'Dashboard: fixed the "Short Term Liabilities" (and Accruals/Provisions/Long Term Liabilities) net worth line items always showing in red parentheses even when genuinely positive — same class of bug as the subtotal-row fix from last time, just missed on the individual line items themselves.',
    'Forecast Settings: the Cash Position sign-reversal checkboxes now warn clearly if the change fails to save (e.g. local storage is full) instead of silently reverting on the next screen — previously this could look like the checkbox "did nothing."',
    'P&L: fixed Net Result being wrong when an expense account\'s real transactions happen to show a positive true sign — it now always computes as Income minus the magnitude of Expenses, matching standard P&L semantics regardless of sign convention (same fix philosophy as the over/under budget correction from before).',
  ]},
  {version:'3.12.0', date:'2026-08-05', changes:[
    'Forecast page: fixed the mislabeled "Total Current Month Start" row — now correctly reads "Closing Balance". Removed the "Discrepancy vs. real balance" diagnostic row (and its underlying calculation) from both the on-screen panel and the CSV export.',
    'Forecast page: Smart Rules indicator changed from a lightning bolt to the letter "R", matching the B (Budget) and P (Provisions) badges.',
    'Forecast page: fixed a real bug where the account stats popup never closed after clicking "View in Ledger" — traced to two silently-duplicated definitions of the same function, only one of which actually closed the modal. Merged into one correct version.',
    'Removed Long Term Events entirely — the category, CSV import/export, the event list/editor, and all related badges and data. Asset (Long Term) and Liability (Long Term) accounts now check Provisions first and fall back to manual entry, the same pattern used by Investment Income/Expense.',
    'Budget page now shows every month through your Grid End Month setting instead of always stopping at 12, and uses the same fast-path indexing as the Forecast Grid so it doesn\'t slow down as the range grows.',
    'P&L: fixed the over/under budget figure being backwards in some cases — it now compares magnitudes (spent more in absolute terms = over budget) instead of raw signed subtraction, so it stays correct regardless of an account\'s true-sign convention. Added ‹ › arrows to quickly step to the previous/next month instead of only the dropdown.',
    'Dashboard: removed the "Assets — by section" and "Liabilities — by section" widgets, and the "Recent Journal Vouchers" section.',
    'Dashboard: fixed Short Term Equity / Cash Bank Account / Long Term Equity always showing their liability subtotal in red parentheses even on the rare occasion it\'s genuinely positive (an intra-month anomaly) — now shows the true sign.',
    'Removed the standalone Cash Flow page entirely.',
    'Code cleanup: audited all ~516 functions in the app for dead code and duplicate definitions. Removed 4 confirmed-unused functions (including a second silent duplicate found the same way as the ledger-modal bug above) and every remaining trace of Long Term Events. No functional changes from this pass — purely removing dead weight.',
  ]},
  {version:'3.11.0', date:'2026-08-05', changes:[
    'Forecast page now shows every month through your Grid End Month setting, instead of always stopping at a fixed 12 months regardless of that setting.',
    'Performance: fixed the real reason the Forecast Grid was slow — every cell was independently re-scanning the entire ledger/budget/provisions/events from scratch. Bulk renders (Forecast Grid, Real Estate) now build a one-pass lookup index first, so each cell becomes a fast lookup instead of a full re-scan. Verified byte-for-byte identical results between the old and new computation paths across every account and month in a large synthetic test dataset — this was purely a speed fix, not a behavior change.',
  ]},
  {version:'3.10.0', date:'2026-08-05', changes:[
    'New: Custom Forecast Categories (Settings → 🗂️ Custom Categories) — add your own categories, just like Income or Expense. Each gets its own section in the Forecast Grid and its own row in the Cash Position summary, no code changes needed. Pick a name, inflow/outflow, and how it should be planned (manual entry, checks Provisions, checks Budget, or Provisions with a manual fallback).',
    'Custom categories automatically work everywhere the built-in ones do: the account category picker, Cash Position sign-reversal settings, and Forecast Grid section ordering.',
    'Deleting a custom category safely unassigns any accounts still using it (asks first) — the accounts themselves are never touched.',
  ]},
  {version:'3.9.0', date:'2026-08-04', changes:[
    'Fixed the REAL cause of "balanced but flagged as unbalanced" Provisions groups: deleting a line ("✕ Remove account") never cleaned up that line\'s stored values — they stayed orphaned in the group\'s data forever, silently still being counted in the balance check even though the line no longer appeared anywhere. Deleting a line now cleans up its values across every month, and the balance check itself now ignores any leftover values from lines that no longer exist (fixing already-affected groups immediately, no data cleanup needed).',
    'Provisions: the net-to-zero error message now shows the actual difference amount, e.g. "Aug-26 doesn\'t net to zero — check the grid below (-12.50)."',
    'Provisions: moved the "✕" remove-line button from the far right (had to scroll all the way across the grid to reach it) to a new sticky column on the far left, right next to the account name.',
    'Provisions Bulk Fill: now shows how many months remain until your Grid End Month setting, updating live as you change the Starting Month.',
  ]},
  {version:'3.8.3', date:'2026-08-04', changes:[
    'Fixed Provisions groups being incorrectly flagged as "doesn\'t net to zero" when they actually did — tiny floating-point drift in stored values (invisible when rounded to cents for display) could push the real sum a hair off zero. Balance checks now round to cents before summing, matching what you actually see on screen.',
    'Fixed the Forecast sign-reversal toggle (Settings → Forecast) not visibly doing anything for categories like Accrual — the reversal was only ever applied to read-only cells; freely-editable cells (which Accrual mostly is) kept showing the raw, un-reversed value. Editable cells now correctly show and accept the reversed figure, while still storing the true underlying value.',
  ]},
  {version:'3.8.2', date:'2026-08-04', changes:[
    'Fixed the Smart Rules sync error ("row violates row-level security policy") — the migration created the table but didn\'t add an access policy. See smart_rules_rls_fix.sql.',
    'Fixed a real crash: several settings (like the Forecast sign-reversal toggle) could throw an uncaught "storage full" error and stop working once the browser\'s local storage filled up after years of data. Every local save now fails gracefully with a warning in the Activity Log instead of crashing — including a recursion bug I caught in my own testing where the failure warning itself could loop forever if the Activity Log\'s own save was what failed.',
  ]},
  {version:'3.8.1', date:'2026-08-03', changes:[
    'Accounts page: fixed the historical-averages/edit icon buttons not lining up between rows — they now render at a fixed, equal size regardless of the emoji glyph, and the icon column itself has a fixed width so it no longer shifts based on how wide a balance number is. Also fixed a column-count mismatch in the category total row.',
  ]},
  {version:'3.8.0', date:'2026-08-03', changes:[
    'New: Smart Rules framework — a general, expandable engine for computing numbers from live data (account balance, account transactions for this/last month, or "same as another line, reversed"), instead of one-off hardcoded logic.',
    'Prebuilt JV templates: any line can now use a "⚡ Smart Amount" computed fresh every time the template is loaded, in the same "Load Template" dropdown as regular templates. Covers patterns like balance-sweep consolidation (two lines, same amount, reversed sign) and clearing an account\'s accumulated monthly transactions into another account.',
    'New Settings → ⚡ Smart Rules tab: pick an account, a rule type, and a sign — no code changes needed. Overrides that account\'s CURRENT MONTH Forecast plan only; every other month keeps its normal category behavior.',
    'Forecast page: fixed the sign-reversal toggle (Settings → Forecast) — it previously only affected the Cash Position summary panel, never the detailed per-account grid. Now applies consistently everywhere, including Provision and Accrual sections.',
    'Forecast "Resolve Mismatch — Apply across all mismatched months": added the ability to apply one custom typed figure to every mismatched month, alongside the existing "prefer Provisions/Budget" options. Also fixed a race condition where this action could return before all months finished writing.',
    'Provisions page: the account-name column is now sticky (frozen) while scrolling — fixes having to scroll back left to see which account a row belongs to after the grid auto-scrolls to the current month.',
    'Real Estate page: fixed the "Net" row showing the wrong sign (a real profit was displaying as negative/red) — now correctly reversed and colored to match the Revenue section.',
    'Accounts page: added a "📊 Historical Averages" button (in both the account list and the edit modal) — reuses the same rolling 3/6/12-month, yearly, and YTD averages already available from the Forecast page.',
    'Added the app version number in small text next to "LedgerOS" in the sidebar.',
  ]},
  {version:'3.7.0', date:'2026-08-03', changes:[
    'Accounts page: multi-select checkboxes are now hidden by default — click "Select" to reveal them.',
    'Forecast page: click a category label in the Bank Accounts — Projected Cash Position panel to jump straight to that section below.',
    'P&L page: added a "Last month" period option; removed color from the Actual column; confirmed Variance colors (Actual − Budget: negative = over budget = red, positive = under budget = green).',
    'Provisions page: historical months are no longer shown in the grid, export, or import — only current month through your Grid End Month setting. Existing historical data is untouched in storage, just hidden. Import also ignores any historical month columns in an uploaded file.',
    'Provisions page: fixed a bug where an in-progress line description edit could occasionally be lost — saving a description no longer triggers a full page re-render that could wipe out another field you were still typing into.',
    'Real Estate page: Revenue section figures are now shown with their sign reversed (Total Revenue in green); removed all editable input boxes — every figure is always sourced from Provisions (future months) or the Ledger (historical months), never typed directly here; removed decimals from monthly figures; widened the account-name column and fixed a bug where the Total Revenue/Expenses/Net rows didn\'t line up with their month columns.',
  ]},
  {version:'3.6.2', date:'2026-08-02', changes:[
    'Backfilled the Change Log with history reconstructed from earlier development sessions, v1.15.0 through v3.2.0 (dates not carried over for these older entries — some were uncertain or unknown at the source).',
  ]},
  {version:'3.6.1', date:'2026-08-02', changes:[
    'Added this Change Log section to Settings — every future release gets an entry here.',
  ]},
  {version:'3.6.0', date:'2026-08-02', changes:[
    'P&L page no longer force-flips expense actual/budget figures negative — shows the real transaction sign, so an accrual reversal or credit now displays correctly instead of always appearing as an outflow.',
    'Provisions lines now support an editable per-line description (click the label in the grid) — flows into the ledger description when you post a Provision JV, and round-trips through CSV export/import via a new "Line Description" column.',
  ]},
  {version:'3.5.1', date:'2026-08-02', changes:[
    'Forecast conflict resolver: added "Apply to all mismatched months" — bulk-resolves every future month with a Budget/Provisions mismatch for an account, each month keeping its own figure from the chosen source. Months that can\'t be safely auto-resolved are skipped and listed.',
  ]},
  {version:'3.5.0', date:'2026-08-02', changes:[
    'Forecast: added a Budget/Provisions mismatch resolver — pick Provisions\' figure, Budget\'s figure, or a custom number, applied to both sides where safely possible.',
    'Fixed CSV imports appearing to hang at 100% — progress feedback now continues through the cloud-sync phase, and syncing runs with limited concurrency (up to 6 at once) across all CSV imports for a real speed-up.',
  ]},
  {version:'3.4.0', date:'2026-08-02', changes:[
    'Added a Content Width setting (Automatic or Manual with size presets) to use the empty space on wide screens.',
    'Lightened the dark theme palette for better readability.',
    'Fixed a checkbox layout bug on the Provisions duplicate-account exempt toggle.',
    'Provisions grid now auto-scrolls to the current month when opened.',
    'Added a "Clear Provisions" button to Settings → Danger Zone.',
  ]},
  {version:'3.3.0', date:'2026-08-02', changes:[
    'Added a per-provision-group "duplicate-account lines don\'t need to net to zero" exemption toggle, for groups that legitimately don\'t balance (e.g. itemized multi-line breakdowns) — shows a neutral note instead of blocking Generate JV.',
  ]},
  {version:'3.2.2', date:'2026-08-02', changes:[
    'Fixed a Provisions CSV import bug where a second row for the same Group+Account could silently erase the first row\'s planned month values.',
    'Added a "Line ID" column to Provisions CSV export for reliable round-trips of duplicate-account lines.',
  ]},
  {version:'3.2.1', date:'2026-08-02', changes:[
    'JV editing: added an editable Date field — applies to every line of the JV, blocks future dates, and the existing "outside current month" warning now checks the date being saved rather than the original.',
  ]},
  {version:'3.2.0', date:'', changes:[
    'Replaced the top navigation bar with a left-side sidebar.',
    'Renamed "Budget vs Actual" to just "Budget".',
    'Fixed: the Provision category wasn\'t showing real actuals for past months.',
    'Fixed: editing a cell on the Real Estate page didn\'t update its totals until a manual refresh.',
    'Provisions page: account labels simplified (name only, click to jump to that account\'s Ledger); the free-text description box replaced with three live figures (Current Balance / Sum of Planned Months / Projected Total); an unbalanced duplicate-account issue now shows as an immediate error instead of only at JV-generation time.',
    'Provisions page: full CSV import/export, including creating new groups from a CSV.',
    'Real Estate page: same account-label simplification and click-to-Ledger navigation.',
    'Added "jump to a specific month" on the Forecast, Budget, and Real Estate pages.',
    'New Settings option to set a fixed end month that caps how far the grids scroll forward and controls where CSV exports end.',
  ]},
  {version:'3.1.0', date:'', changes:[
    'Real Estate page: any account can now be linked as an apartment or expense (previously restricted by category); the account picker is now a proper searchable field instead of a dropdown.',
    'Forecast page numbers now display as whole numbers with no decimals; CSV exports and the Real Estate page deliberately kept full decimal precision.',
  ]},
  {version:'3.0.0', date:'', changes:[
    'New Real Estate page: group rental income and expense accounts by building, see per-building and portfolio-wide profitability, with dedicated import/export — built entirely on existing Forecast Grid data, no separate storage.',
    'Fixed: Asset (Long Term) and Liability (Long Term) categories were not showing real historical actuals for past months at all.',
    'Asset/Liability (Long Term) now also check Provisions (in addition to Long Term Events), with a conflict warning if both exist and disagree.',
  ]},
  {version:'2.7.2', date:'', changes:[
    'Fixed a bug where the "Cash Flow Breakdown" popup (opened by clicking a Closing Balance figure) showed the un-reversed number even when that category\'s sign-reversal was active.',
  ]},
  {version:'2.7.1', date:'', changes:[
    'Extended the "check Provisions first" behavior to all four Investment Income/Expense categories (previously only plain Income/Expense did this) — fixes accounts with real planned Provisions amounts not showing up on the Forecast Grid.',
  ]},

// Shared account-search matcher used by every searchable account dropdown in the app.
// Splits the typed query into whitespace-separated tokens and requires each token to appear
// SOMEWHERE in "<id> <name>" (in any order) — this is deliberately more forgiving than a single
// contiguous substring match, which fails on any punctuation/spacing mismatch (e.g. typing
// "gifts expenses" would not match "Gifts - Expenses" under plain .includes() because of the
// hyphen between the words).
function accountSearchMatches(query, accounts){
  const tokens = (query||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!tokens.length) return accounts.slice(0,25);
  return accounts.filter(a=>{
    const hay = (String(a.id)+' '+(a.name||'')+' '+(a.category||'')).toLowerCase();
    return tokens.every(t=>hay.includes(t));
  }).slice(0,25);
}

function acpInput(pid, val){

function acpRenderDrop(pid){
  const st = window._acp[pid]; const el = document.getElementById('acpdrop_'+pid);
  if(!el || !st) return;

function acpKey(ev, pid){
  const st = window._acp[pid]; if(!st) return;
  const matches = st.matches || [];
  if(ev.key==='ArrowDown'){ if(matches.length){ ev.preventDefault(); st.hi = Math.min(matches.length-1, st.hi+1); acpRenderDrop(pid); } }
  else if(ev.key==='ArrowUp'){ if(matches.length){ ev.preventDefault(); st.hi = Math.max(0, st.hi-1); acpRenderDrop(pid); } }
  else if(ev.key==='Enter'){
    ev.preventDefault();
    const pick = st.hi>=0? matches[st.hi] : (matches.length===1? matches[0] : null);
    if(pick) acpPick(pid, pick.id);
  } else if(ev.key==='Escape'){ acpClose(pid); }
}

function nextAccNumber(catDigit, subCode){
  const used = new Set();

    if(Math.floor(a.id/10000)===catDigit && Math.floor((a.id%10000)/100)===subCode){

/* ============================= PERSIST ============================= */
// Wraps every localStorage write in the app. Storage can fill up over years of real data — this
// makes that fail as a visible, recoverable warning (logged to the Activity Log) instead of an
// uncaught crash. Returns true/false so callers can react if they need to.
function safeSetItem(key, value){
  try{
    localStorage.setItem(key, value);
    return true;
  }catch(e){
    console.warn('localStorage write failed for "'+key+'"', e);
    // Never call logActivity() when the failing write IS the activity log itself — that would
    // recurse forever (logActivity -> saveActivityLog -> safeSetItem -> fails -> logActivity -> ...).
    if(key!=='activityLog_v1' && typeof logActivity==='function'){
      const msg = key==='ledgerData_v1'
        ? 'Could not update the local offline cache — your browser\'s storage is full. Your changes ARE still saved to the cloud; only the local copy used for instant loading is out of date until this is resolved.'
        : 'Could not save "'+key+'" locally — your browser\'s storage is full. This setting may not persist after a page refresh.';
      logActivity('error', msg);
    }
    return false;
  }
}
/* ============================= LOCAL CACHE STORE =============================
   The offline cache used to live in a single localStorage key. localStorage is capped at ~5 MB
   PER DOMAIN, shared with every other app on the same hostname — so a full ledger history there
   crowded out its neighbours and silently failed to save once the cap was reached.

   IndexedDB is the right home for it: hundreds of MB to GB, structured storage, and a separate
   quota from the localStorage pool. Each collection is stored as its own record rather than one
   giant blob, so a change to one collection doesn't rewrite everything.

   localStorage remains a FALLBACK for when IndexedDB is unavailable (private browsing, some
   embedded webviews). In that mode the cache is trimmed to recent history so it stays small
   rather than repeating the original problem.
*/
const IDB_NAME = 'LedgerOS';
const IDB_STORE = 'cache';
const IDB_VERSION = 1;
const LS_CACHE_KEY = 'ledgerData_v1';           // legacy full-blob key, migrated then removed
const LS_TRIMMED_KEY = 'ledgerCacheTrimmed_v1'; // fallback-only, deliberately small
const TRIMMED_LEDGER_MONTHS = 6;
let _idb = null, _idbUnavailable = false, _usingTrimmedFallback = false;

function idbOpen(){
  if(_idb) return Promise.resolve(_idb);
  if(_idbUnavailable) return Promise.resolve(null);
  return new Promise(resolve=>{
    let settled = false;
    const done = v => { if(!settled){ settled = true; resolve(v); } };
    try{
      if(typeof indexedDB==='undefined' || !indexedDB){ _idbUnavailable = true; return done(null); }
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => { _idb = req.result; done(_idb); };
      req.onerror = () => { _idbUnavailable = true; done(null); };
      req.onblocked = () => { _idbUnavailable = true; done(null); };
      // Private-browsing modes sometimes neither resolve nor error; don't hang the boot on it.
      setTimeout(()=>{ if(!settled){ _idbUnavailable = true; done(null); } }, 4000);
    }catch(e){ _idbUnavailable = true; done(null); }
  });
}
function idbTx(mode){
  return idbOpen().then(db=> db? db.transaction(IDB_STORE, mode).objectStore(IDB_STORE) : null);
}
function idbPut(key, value){
  return idbTx('readwrite').then(store=> store? new Promise((resolve,reject)=>{
    const r = store.put(value, key);
    r.onsuccess = ()=>resolve(true);
    r.onerror = ()=>reject(r.error || new Error('IndexedDB write failed'));
  }) : false);
}
function idbGet(key){
  return idbTx('readonly').then(store=> store? new Promise((resolve,reject)=>{
    const r = store.get(key);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error || new Error('IndexedDB read failed'));
  }) : undefined);
}
function idbKeys(){
  return idbTx('readonly').then(store=> store? new Promise((resolve,reject)=>{
    const r = store.getAllKeys();
    r.onsuccess = ()=>resolve(r.result||[]);
    r.onerror = ()=>reject(r.error || new Error('IndexedDB key listing failed'));
  }) : []);
}
function idbClearAll(){
  return idbTx('readwrite').then(store=> store? new Promise((resolve,reject)=>{
    const r = store.clear();
    r.onsuccess = ()=>resolve(true);
    r.onerror = ()=>reject(r.error);
  }) : false);
}

// Writes every collection of D as its own record, then records a manifest of counts used to
// verify a migration actually landed.
async function idbSaveD(){
  const keys = Object.keys(D);
  for(const k of keys) await idbPut(k, D[k]);
  await idbPut('__meta', {savedAt: Date.now(), collections: keys, counts: cacheCounts(D)});
  return true;
}
async function idbLoadD(){
  const keys = await idbKeys();
  if(!keys || !keys.length) return null;
  const out = {};
  for(const k of keys){
    if(k==='__meta') continue;
    out[k] = await idbGet(k);
  }
  return Object.keys(out).length? out : null;
}
// Per-collection record counts — the basis for verifying a migration rather than assuming it.
function cacheCounts(obj){
  const counts = {};
  Object.keys(obj||{}).forEach(k=>{
    const v = obj[k];
    counts[k] = Array.isArray(v)? v.length : (v && typeof v==='object'? Object.keys(v).length : (v===undefined?0:1));
  });
  return counts;
}
function countsMatch(a, b){
  const keys = Object.keys(a||{});
  if(!keys.length) return false;
  for(const k of keys){ if((b||{})[k] !== a[k]) return false; }
  return true;
}

// Fallback cache: keep the shape but hold only recent ledger/budget history, so the localStorage
// copy stays small instead of recreating the original problem.
function buildTrimmedCache(source){
  const cutoff = (function(){
    const d = new Date(todayStr());
    d.setMonth(d.getMonth() - TRIMMED_LEDGER_MONTHS);
    return d.toISOString().slice(0,10);
  })();
  const out = {};
  Object.keys(source||{}).forEach(k=>{ out[k] = source[k]; });
  if(Array.isArray(source.ledger)) out.ledger = source.ledger.filter(l=>String(l.date||'') >= cutoff);
  if(Array.isArray(source.budget)) out.budget = source.budget.filter(b=>String(b.date||'') >= cutoff);
  out.__trimmed = {months: TRIMMED_LEDGER_MONTHS, cutoff};
  return out;
}

// Single entry point for saving the cache. Never throws; reports failure so callers can react.
let _cacheSaveTimer = null, _cacheSaveFailed = false;
async function saveCacheNow(){
  try{
    if(!_idbUnavailable){
      await idbSaveD();
      _usingTrimmedFallback = false;
      if(_cacheSaveFailed){ _cacheSaveFailed = false; }
      return true;
    }
  }catch(e){
    console.warn('IndexedDB cache write failed, falling back to localStorage', e);
    _idbUnavailable = true;
  }
  // Fallback path
  _usingTrimmedFallback = true;
  const ok = safeSetItem(LS_TRIMMED_KEY, JSON.stringify(buildTrimmedCache(D)));
  if(!ok && !_cacheSaveFailed){
    _cacheSaveFailed = true;
    if(typeof toast==='function') toast('Could not save the offline cache — browser storage is full. Your data is still safe in the cloud; see Settings → Local Storage.', true);
  }
  return ok;
}
// persistLocal() is called from dozens of places on every change, so the actual write is
// debounced. A failure still surfaces rather than being swallowed.
function persistLocal(){
  if(_cacheSaveTimer) clearTimeout(_cacheSaveTimer);
  _cacheSaveTimer = setTimeout(()=>{ _cacheSaveTimer = null; saveCacheNow(); }, 250);
}

// ---- Migration: localStorage blob -> IndexedDB ----
// Non-destructive and resumable. The legacy key is only removed AFTER the new store has been
// read back and verified, so an interruption at any point leaves the original intact and the
// migration simply runs again next time.
async function migrateCacheToIdb(onProgress){
  const raw = (function(){ try{ return localStorage.getItem(LS_CACHE_KEY); }catch(e){ return null; } })();
  if(!raw) return {migrated:false, reason:'nothing to migrate'};
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ return {migrated:false, reason:'legacy cache could not be parsed', keepLegacy:true}; }
  const db = await idbOpen();
  if(!db) return {migrated:false, reason:'IndexedDB unavailable', keepLegacy:true};
  const expected = cacheCounts(parsed);
  const keys = Object.keys(parsed);
  let i = 0;
  for(const k of keys){
    i++;
    if(onProgress) onProgress(Math.round(i/(keys.length+1)*100), k);
    await idbPut(k, parsed[k]);
  }
  await idbPut('__meta', {savedAt: Date.now(), collections: keys, counts: expected, migratedFrom:'localStorage'});
  if(onProgress) onProgress(100, 'verifying');
  // Verify by reading back from IndexedDB — not by trusting that the writes returned cleanly.
  const readBack = await idbLoadD();
  const actual = cacheCounts(readBack||{});
  if(!countsMatch(expected, actual)){
    return {migrated:false, reason:'verification failed — legacy cache left untouched', keepLegacy:true, expected, actual};
  }
  try{ localStorage.removeItem(LS_CACHE_KEY); }catch(e){}
  return {migrated:true, counts:expected, freedBytes: raw.length + LS_CACHE_KEY.length};
}
// Load order: IndexedDB, then the trimmed fallback, then the legacy blob (present only if a
// migration hasn't run or didn't verify).
async function loadLocalCache(){
  try{
    const fromIdb = await idbLoadD();
    if(fromIdb) return {data: fromIdb, source:'indexeddb'};
  }catch(e){ console.warn('IndexedDB cache read failed', e); }
  try{
    const trimmed = localStorage.getItem(LS_TRIMMED_KEY);
    if(trimmed){ _usingTrimmedFallback = true; return {data: JSON.parse(trimmed), source:'localstorage-trimmed'}; }
  }catch(e){}
  try{
    const legacy = localStorage.getItem(LS_CACHE_KEY);
    if(legacy) return {data: JSON.parse(legacy), source:'localstorage-legacy'};
  }catch(e){}
  return null;
}
// Guard against LedgerOS quietly crowding out other apps on this domain again.
function checkLocalStorageFootprint(){
  try{
    let mine = 0, total = 0;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      const size = k.length + (localStorage.getItem(k)||'').length;
      total += size;
      if(isLedgerOsKey(k)) mine += size;
    }
    const pct = mine / LS_ORIGIN_LIMIT_BYTES * 100;
    if(pct > 25){
      logActivity('error', 'LedgerOS is using '+fmtBytes(mine)+' of this domain\'s ~5 MB local storage ('+pct.toFixed(0)+'%), which can crowd out other apps on the same domain. See Settings → Local Storage.');
      if(typeof toast==='function') toast('LedgerOS is using '+pct.toFixed(0)+'% of this domain\'s local storage — see Settings → Local Storage', true);
    }
    return {mine, total, pct};
  }catch(e){ return null; }
}

// For a deliberate, one-off settings action (toggling a preference, picking a color, etc.) where
// the person expects an immediate visible result — safeSetItem already logs a failure to the
// Activity Log, but that's easy to miss right after clicking something. This adds an immediate

/* ============================= OFFLINE SYNC QUEUE ============================= */
// Every write to accounts/ledger/budget/templates goes through syncWrite(). If we're online it
// writes straight to Supabase. If we're offline (or the write fails), it's queued locally with a
// "base" version stamp — the updated_at this device last saw for that row. When we reconnect,
// flushSyncQueue() replays the queue, but for each row first checks whether the server's current
// updated_at still matches that base. If it does, nobody else touched it — apply safely. If it
// doesn't, someone else's change already landed there first — that's a real conflict, and we stop
// and ask which version to keep rather than silently picking one.
let syncQueue = [];
let syncConflicts = [];
function loadSyncQueue(){ try{ return JSON.parse(localStorage.getItem('syncQueue_v1')||'[]'); }catch(e){ return []; } }
// The sync queue holds changes that have NOT reached Supabase yet. If this write fails, those
// changes are lost on the next refresh with nothing to show for it — so unlike the offline
// cache (which is disposable), a failure here is surfaced loudly and immediately. The previous
// bare try/catch swallowed the error entirely.
function saveSyncQueue(){
  const ok = safeSetItem('syncQueue_v1', JSON.stringify(syncQueue));
  if(!ok){
    toast('⚠ URGENT: '+syncQueue.length+' unsaved change(s) could not be stored locally — browser storage is full. Do NOT close this tab until sync completes. See Settings → Local Storage.', true);
    try{ console.error('syncQueue_v1 write failed — '+syncQueue.length+' pending change(s) at risk'); }catch(e){}
  }
  return ok;
}
function nowISO(){ return new Date().toISOString(); }
// ===== Activity & Error Log — local-only (this device), for sharing with Claude when diagnosing
// a bug. Deliberately NOT synced to Supabase (it's a diagnostic tool, not app data) and capped in

const ACTIVITY_LOG_CAP = 300;
let activityLog = [];
function loadActivityLog(){

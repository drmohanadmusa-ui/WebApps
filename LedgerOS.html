button,input,select,textarea{font-family:inherit;font-size:13.5px}
input,select,textarea{background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.fl{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
a{color:var(--accent)}
button{cursor:pointer}

.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px}
.brand h1{font-size:15.5px;font-weight:650;white-space:nowrap}
.cloud{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.cloud.cloud-static{cursor:default}
/* The browser's up/down arrows on number fields sat on top of the digits, making a value like
   50000 look struck through. Amounts are typed, not nudged one at a time, so the arrows are
   removed rather than given room. */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
@keyframes btnSpin{to{transform:rotate(360deg)}}
.btn-spin{display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-1px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:btnSpin .6s linear infinite}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)} .dot.ok{background:var(--green)} .dot.err{background:var(--red)}
.tbtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px}
.tbtn:hover{background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.cards .kpi{transition:transform .15s ease,box-shadow .15s ease}
.cards .kpi.fade-in{opacity:0;animation:kpiFadeIn .35s ease forwards}
.cards .kpi:nth-child(1){animation-delay:.03s}
.cards .kpi:nth-child(2){animation-delay:.08s}
.cards .kpi:nth-child(3){animation-delay:.13s}
.cards .kpi:nth-child(4){animation-delay:.18s}
.cards .kpi:nth-child(n+5){animation-delay:.22s}
.cards .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
@keyframes kpiFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-tile);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;width:84px;height:84px;border-radius:50%;top:-38px;right:-28px;opacity:0.4;background:color-mix(in srgb, var(--accent) 20%, transparent);pointer-events:none}
.kpi > *{position:relative;z-index:1}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:600;margin-top:6px}
.kpi .v.g{color:var(--green)} .kpi .v.r{color:var(--red)}
.g{color:var(--green)} .r{color:var(--red)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-card)}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px;font-weight:700}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

table{width:100%;border-collapse:collapse;font-size:13px}
.sticky-table{border-collapse:separate;border-spacing:0}
/* Sticky cells can show a hairline sliver of the content scrolling behind them, due to sub-pixel
   rounding in how browsers position sticky elements during scroll. Masking each sticky cell's
   right edge with a same-background pseudo-element that extends 2px past its own boundary hides
   that seam permanently, at any scroll position. Applies app-wide to every sticky column. */
.sticky-table th[style*="position:sticky"],
.sticky-table td[style*="position:sticky"]{position:sticky}
.sticky-table th[style*="position:sticky"]::after,
.sticky-table td[style*="position:sticky"]::after{content:'';position:absolute;top:0;bottom:0;right:-2px;width:2px;background-color:inherit}
th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table[dir="rtl"] th{text-align:right}
td{padding:8px 9px;border-bottom:1px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.num{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}

.badge{font-size:10.5px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:700;background:var(--chip);color:var(--muted);transition:transform .12s ease,box-shadow .12s ease}
.badge.click:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(16,19,26,0.12)}
.badge.pos{color:var(--green)} .badge.neg{color:var(--red)} .badge.warn{color:var(--yellow)}

.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:650;font-size:13px}
.btn.pri{background:var(--accent);color:#ffffff}
.btn.pri:hover{background:var(--accent2)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line)}
.btn.del{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12px}

.x{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;padding:4px}
.x:hover{color:var(--red)}

.jv-lines{width:100%;border-collapse:collapse}
.jv-lines th{padding:5px 6px} .jv-lines td{padding:4px 6px;border-bottom:none}
.jv-lines input,.jv-lines select{padding:6px 8px;font-size:13px}

.mut{color:var(--muted)}
.right{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#173a29;border:1px solid var(--green);color:#c9f2dd;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;z-index:100}
.toast.show{opacity:1} .toast.bad{background:#3a1c19;border-color:var(--red);color:#ffd6d0}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg-in{animation:modalBgIn .15s ease}
@keyframes modalBgIn{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,.45)}}
.modal-in{animation:modalPopIn .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes modalPopIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.panel-fade-in{animation:panelFadeIn .2s ease}
.glow-highlight{animation:glowHighlight 0.6s ease infinite}
@keyframes glowHighlight{0%{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent);background:color-mix(in srgb, var(--accent) 18%, var(--panel))}100%{box-shadow:0 0 0 0 transparent;background:var(--panel)}}
#splashScreen{position:fixed;inset:0;z-index:9999;background:var(--head),radial-gradient(600px 600px at 50% 20%, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity .35s ease,visibility .35s ease}
#splashScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-ring{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:splashRingPulse 2.2s ease-out infinite}
@keyframes splashRingPulse{0%{transform:scale(0.6);opacity:.7}70%{opacity:0}100%{transform:scale(1.4);opacity:0}}
.splash-mark{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:28px;box-shadow:var(--shadow-pop);opacity:0;animation:splashMarkBreathe 1.8s ease-in-out infinite, splashFadeIn .4s ease forwards}
@keyframes splashMarkBreathe{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.08) rotate(6deg)}}
@keyframes splashFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.splash-title{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--text);margin:18px 0 0;opacity:0;animation:splashFadeIn .4s ease .25s forwards}
.splash-dots{display:flex;gap:6px;margin-top:18px;opacity:0;animation:splashFadeIn .4s ease .4s forwards}
.splash-dots span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:splashDotBounce 1.1s ease-in-out infinite}
.splash-dots span:nth-child(2){animation-delay:.15s}
.splash-dots span:nth-child(3){animation-delay:.3s}
@keyframes splashDotBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.splash-status{margin-top:14px;font-size:12.5px;color:var(--muted);min-height:16px;opacity:0;animation:splashFadeIn .5s ease .6s forwards}
.splash-progress-pct{margin-top:6px;font-size:13px;font-weight:700;color:var(--accent);opacity:0;animation:splashFadeIn .5s ease .65s forwards}
.splash-progress-track{width:180px;height:4px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:10px;opacity:0;animation:splashFadeIn .5s ease .7s forwards}
.splash-progress-fill{height:100%;width:0%;background:linear-gradient(90deg, var(--accent), var(--accent2));border-radius:999px;transition:width .3s ease}
.splash-bypass{margin-top:20px;background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 16px;font-size:12.5px;cursor:pointer;opacity:0;transition:opacity .3s ease}
.splash-bypass.show{opacity:1}
.cmdp-bg{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh;animation:cmdpBgIn .22s ease forwards}
@keyframes cmdpBgIn{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,.45)}}
.cmdp-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);width:100%;max-width:560px;max-height:70vh;overflow:hidden;display:flex;flex-direction:column;animation:cmdpBoxIn .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cmdpBoxIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.cmdp-input{border:none;border-bottom:1px solid var(--line);border-radius:0;font-size:15px;padding:14px 16px}
.cmdp-input:focus{outline:none;border-color:var(--line)}
.cmdp-results{overflow-y:auto;padding:6px}
.cmdp-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.cmdp-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--text);opacity:0;animation:cmdpRowIn .32s ease forwards}
.cmdp-row .cmdp-sub{color:var(--muted);font-size:11.5px;margin-left:auto}
.cmdp-row.hi,.cmdp-row:hover{background:var(--chip)}
@keyframes cmdpRowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.cmdp-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13px}
@keyframes panelFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--shadow-pop)}
.modal.wide{max-width:900px}
.modal h3{font-size:16px;margin-bottom:14px}

.pagebar{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--muted)}
.pagebar button{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--text)}
.pagebar button:disabled{opacity:.35}

.themeBtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px}
.chk{width:16px;height:16px;accent-color:var(--accent)}
.section-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:16px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
.section-h:first-child{border-top:none;margin-top:0;padding-top:0}
::placeholder{color:var(--muted);opacity:.7}
.autoc{position:relative}
.acdrop{display:none;position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:220px;overflow:auto;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.acdrop.show{display:block}
.acdrop div{padding:7px 10px;cursor:pointer;font-size:13px}
.acdrop div:hover,.acdrop div.hi{background:var(--chip)}
.app-shell{display:flex;min-height:100vh}
#sidebar{width:230px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
#sidebar .brand{padding:18px 16px 14px;color:var(--sidebar-text)}
#sidebar .brand .mut{color:var(--sidebar-text-muted)!important}
nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1}
nav button{background:none;border:none;color:var(--sidebar-text-muted);padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:background-color .18s ease,color .18s ease,padding-left .18s ease}
/* Entrance animation is scoped to .anim, which renderNav() applies ONLY on the first render of
   the session. renderNav() rebuilds the nav's innerHTML on every page change, so leaving the
   animation on the base `nav button` rule made the whole list re-cascade on every navigation. */
.nav-ico{display:inline-block;width:1.35em;margin-right:7px;text-align:center;font-size:13px;opacity:.95}
.pg-row{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:5px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;cursor:grab}
.pg-row.dragging{opacity:.45}
.pg-row.drop-above{border-top:2px solid var(--accent)}
.pg-row.drop-below{border-bottom:2px solid var(--accent)}
.pg-row.pinned{opacity:.75;cursor:default;background:var(--chip)}
.pg-grip{color:var(--muted);font-size:14px;line-height:1;user-select:none}
.pg-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-lock{font-size:10.5px;color:var(--muted);white-space:nowrap}
nav button.anim{opacity:0;animation:navItemIn .32s ease forwards}
nav button.anim:nth-child(1){animation-delay:.02s} nav button.anim:nth-child(2){animation-delay:.05s} nav button.anim:nth-child(3){animation-delay:.08s}
nav button.anim:nth-child(4){animation-delay:.11s} nav button.anim:nth-child(5){animation-delay:.14s} nav button.anim:nth-child(6){animation-delay:.17s}
nav button.anim:nth-child(7){animation-delay:.20s} nav button.anim:nth-child(8){animation-delay:.22s} nav button.anim:nth-child(9){animation-delay:.24s}
nav button.anim:nth-child(n+10){animation-delay:.26s}
nav button:hover{background:rgba(255,255,255,0.06);color:var(--sidebar-text);padding-left:16px}
nav button.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent)}
@keyframes navItemIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.sidebar-footer{padding:12px 16px 16px;border-top:1px solid var(--sidebar-line);display:flex;flex-direction:column;gap:8px}
.sidebar-footer .cloud{background:rgba(255,255,255,0.06);border-color:var(--sidebar-line);color:var(--sidebar-text-muted)}
.sidebar-footer .themeBtn{background:rgba(255,255,255,0.06);border-color:var(--sidebar-line);color:var(--sidebar-text)}
main{padding:22px;max-width:var(--content-max-width);margin:0;min-height:100vh;flex:1;min-width:0;
  background:
    radial-gradient(900px 640px at 100% -8%, color-mix(in srgb, var(--accent) 9%, transparent) 0%, transparent 62%),
    radial-gradient(700px 560px at -8% 100%, color-mix(in srgb, var(--green) 6%, transparent) 0%, transparent 60%),
    var(--bg);
}
@media print{#sidebar,.noprint{display:none!important} body{background:#fff;color:#000} main{max-width:none}}
.mobile-topbar{display:none}
.mobile-nav-toggle{display:none}
.mobile-nav-close{display:none}
.mobile-nav-scrim{display:none}
.alloc-unalloc-table .col-check{width:30px}
.alloc-unalloc-table .col-jv{width:80px}
.alloc-unalloc-table .col-date{width:110px}
.alloc-unalloc-table .col-amt{width:130px}
.themeBtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:760px){
  .alloc-unalloc-table .col-jv,.alloc-unalloc-table .col-date{width:1%;white-space:nowrap}
  .alloc-unalloc-table .col-amt{width:auto}
  .app-shell{flex-direction:column}
  .mobile-topbar{
    display:flex;align-items:center;gap:10px;
    position:sticky;top:0;z-index:30;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--sidebar-bg);border-bottom:1px solid var(--sidebar-line);
  }
  .mobile-nav-toggle{
    display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:8px;border:1px solid var(--sidebar-line);
    background:rgba(255,255,255,0.06);color:var(--sidebar-text);font-size:16px;cursor:pointer;flex-shrink:0;
  }
  .mobile-topbar-title{color:var(--sidebar-text);font-weight:700;font-size:15px}
  .mobile-nav-scrim{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,0.45);
    z-index:39;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .mobile-nav-scrim.show{opacity:1;pointer-events:auto}
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;width:min(82vw,300px);height:100vh;
    flex-direction:column;flex-wrap:nowrap;align-items:stretch;
    transform:translateX(-100%);transition:transform .22s ease;
    z-index:40;overflow-y:auto;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    box-shadow:2px 0 24px rgba(0,0,0,0.25);
  }
  #sidebar.open{transform:translateX(0)}
  #sidebar .brand{padding:10px 14px}
  .mobile-nav-close{
    display:flex;align-items:center;justify-content:center;
    position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;
    width:32px;height:32px;border-radius:8px;border:1px solid var(--sidebar-line);
    background:rgba(255,255,255,0.06);color:var(--sidebar-text);font-size:14px;cursor:pointer;z-index:1;
  }
  nav{flex-direction:column;padding:6px 10px}
  .sidebar-footer{flex-direction:column;border-top:1px solid var(--sidebar-line);border-left:none;margin-left:0}
  .grid2,.grid3{grid-template-columns:1fr}
  main#app{padding-left:calc(22px + env(safe-area-inset-left));padding-right:calc(22px + env(safe-area-inset-right));padding-bottom:calc(22px + env(safe-area-inset-bottom))}

  /* Pin override: when sidebarPinned is on, force the full desktop sidebar layout back on
     regardless of window width, instead of the collapsed drawer treatment above. */
  body.sidebar-pinned .app-shell{flex-direction:row}
  body.sidebar-pinned .mobile-topbar{display:none}
  body.sidebar-pinned .mobile-nav-scrim{display:none;opacity:0;pointer-events:none}
  body.sidebar-pinned .mobile-nav-close{display:none}
  body.sidebar-pinned #sidebar{
    position:sticky;top:0;left:auto;bottom:auto;width:230px;height:100vh;
    flex-direction:column;flex-wrap:nowrap;align-items:stretch;
    transform:none;transition:none;z-index:20;overflow-y:auto;
    padding-top:0;padding-bottom:0;padding-left:0;
    box-shadow:none;
  }
  body.sidebar-pinned #sidebar .brand{padding:16px}
  body.sidebar-pinned nav{flex-direction:column;padding:8px}
  body.sidebar-pinned .sidebar-footer{flex-direction:column;border-top:1px solid var(--sidebar-line);border-left:none;margin-left:0}
  body.sidebar-pinned main#app{padding-left:22px;padding-right:22px;padding-bottom:22px}
}
</style>

<body>
<div id="splashScreen">
  <div class="splash-ring"></div>
  <div class="splash-mark">₪</div>
  <h1 class="splash-title">LedgerOS</h1>
  <div class="splash-dots"><span></span><span></span><span></span></div>
  <div class="splash-status" id="splashStatus">Loading…</div>

<script>
const SEED = {"accounts":[],"ledger":[],"budget":[],"templates":[],"categories":[],"subcategories":[],"provisionGroups":[],"accrualMappings":[]};

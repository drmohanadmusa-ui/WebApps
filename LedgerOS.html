<title>LedgerOS — Personal Accounting</title>
<style>
:root{
  --bg:#f4f2ec; --panel:#ffffff; --panel2:#faf8f2; --line:#e2ddd0; --text:#221f1a; --muted:#75705f;
  --accent:#9a6b1f; --accent2:#b9822b; --green:#146c43; --red:#a3352c; --yellow:#96720a; --chip:#efe9d8; --input:#ffffff;
  --r:9px; --mono:'IBM Plex Mono','SF Mono',ui-monospace,Consolas,monospace;
  --content-max-width:1240px;
  --serif:'Source Serif 4','Iowan Old Style',Georgia,serif;
  --sans:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --head:linear-gradient(180deg,#faf8f2,#f4f2ec);
}
[data-theme="dark"]{
  --bg:#2a2620; --panel:#332e26; --panel2:#3a352b; --line:#4d4738; --text:#f5efe2; --muted:#c2b49b;
  --accent:#e0ac4c; --accent2:#edc06c; --green:#4ecc93; --red:#ea7568; --yellow:#e6c250; --chip:#3d372c; --input:#282319;
  --head:linear-gradient(180deg,#332e26,#2a2620);
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--basefs,14px);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
.num,td.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:13.5px}
input,select,textarea{background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.fl{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
a{color:var(--accent)}
button{cursor:pointer}

.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#1a1508;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px}
.brand h1{font-size:15.5px;font-weight:650;white-space:nowrap}
.cloud{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)} .dot.ok{background:var(--green)} .dot.err{background:var(--red)}
.tbtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px}
.tbtn:hover{background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:600;margin-top:6px}
.kpi .v.g{color:var(--green)} .kpi .v.r{color:var(--red)}
.g{color:var(--green)} .r{color:var(--red)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px;font-weight:700}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.num{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}

.badge{font-size:10.5px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:700;background:var(--chip);color:var(--muted)}
.badge.pos{color:var(--green)} .badge.neg{color:var(--red)} .badge.warn{color:var(--yellow)}

.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:650;font-size:13px}
.btn.pri{background:var(--accent);color:#1a1508}
.btn.pri:hover{background:var(--accent2)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line)}
.btn.del{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12px}

.x{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;padding:4px}
.x:hover{color:var(--red)}

.jv-lines{width:100%;border-collapse:collapse}
.jv-lines th{padding:5px 6px} .jv-lines td{padding:4px 6px;border-bottom:none}
.jv-lines input,.jv-lines select{padding:6px 8px;font-size:13px}

.mut{color:var(--muted)}
.right{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173a29;border:1px solid var(--green);color:#c9f2dd;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;z-index:100}
.toast.show{opacity:1} .toast.bad{background:#3a1c19;border-color:var(--red);color:#ffd6d0}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.modal.wide{max-width:900px}
.modal h3{font-size:16px;margin-bottom:14px}

.pagebar{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--muted)}
.pagebar button{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--text)}
.pagebar button:disabled{opacity:.35}

.themeBtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px}
.chk{width:16px;height:16px}
.section-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:16px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
.section-h:first-child{border-top:none;margin-top:0;padding-top:0}
::placeholder{color:var(--muted);opacity:.7}
.autoc{position:relative}
.acdrop{display:none;position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:220px;overflow:auto;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.acdrop.show{display:block}
.acdrop div{padding:7px 10px;cursor:pointer;font-size:13px}
.acdrop div:hover,.acdrop div.hi{background:var(--chip)}
.app-shell{display:flex;min-height:100vh}
#sidebar{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
#sidebar .brand{padding:18px 16px 14px}
nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1}
nav button{background:none;border:none;color:var(--muted);padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;text-align:left;width:100%}
nav button:hover{background:var(--chip);color:var(--text)}
nav button.on{background:var(--accent);color:#1a1508}
.sidebar-footer{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
main{padding:22px;max-width:var(--content-max-width);margin:0;min-height:100vh;flex:1;min-width:0}
@media print{#sidebar,.noprint{display:none!important} body{background:#fff;color:#000} main{max-width:none}}
@media(max-width:760px){.app-shell{flex-direction:column} #sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center} #sidebar .brand{padding:10px 14px} nav{flex-direction:row;flex-wrap:wrap;padding:6px 10px} .sidebar-footer{flex-direction:row;border-top:none;border-left:1px solid var(--line);margin-left:auto} .grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar">
    <div class="brand"><div class="mark">₪</div><h1>LedgerOS</h1><span class="mut" style="font-size:9.5px;margin-left:4px" id="sidebarVersionTag"></span></div>
    <nav id="nav"></nav>
    <div class="sidebar-footer noprint">
      <div class="cloud" id="cloudBtn" onclick="openSettings()"><span class="dot" id="dot"></span><span id="statusTxt">Local only</span></div>
      <button class="themeBtn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    </div>
  </aside>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"></script>

<script>
const SEED = {"accounts":[],"ledger":[],"budget":[],"templates":[],"categories":[],"subcategories":[],"provisionGroups":[],"accrualMappings":[]};
</script>
<script>
/* ============================= STATE ============================= */
// Bump this on every shipped change (major.minor.patch). Shown in Settings.
const APP_VERSION = '3.13.1';
// STANDING CONVENTION (as of v3.6.1, applies to every release from here on):
// every time APP_VERSION is bumped, add a matching entry to CHANGELOG below —
// version, date (YYYY-MM-DD), and a short bullet list of what changed. This is
// shown to the person in Settings → Change Log. Do not skip this step.
const CHANGELOG = [
  {version:'3.13.1', date:'2026-08-06', changes:[
    'Reversed the paired Source columns added to the wide "Export Grid" CSV last time — it\'s back to its original format. The "Export Grid (Pivot)" export keeps its single Source column.',
    'Forecast Grid import: when there are mismatches or unmatched rows, you can now export the full detailed error report as a CSV instead of only seeing a summary truncated to 25 rows. Covers both value mismatches (imported figure disagreed with what the app computes) and unmatched rows (no matching account found).',
  ]},
  {version:'3.13.0', date:'2026-08-06', changes:[
    'Forecast CSV exports now include a "Source" column showing where each figure came from (Manual entry / Provisions / Budget / Actual (historical) / Smart Rule / etc). The wide "Export Grid" gets a paired Source column next to every month; "Export Grid (Pivot)" gets a single Source column since it\'s already one row per account-month. Re-importing an exported wide grid still works exactly as before — the new columns are ignored on import.',
    'Smart Rules can now target a month ahead instead of only the current month (Settings → ⚡ Smart Rules → "Applies at"). Choosing +1/+2/+3 months forces every month from the current one up to (but not including) the target to 0, and the target month itself shows the live-computed value — e.g. a quarterly sweep where nothing happens in between and the full amount lands on the target month. Existing rules are unaffected (default to current-month-only, unchanged).',
  ]},
  {version:'3.12.1', date:'2026-08-06', changes:[
    'Dashboard: fixed the "Short Term Liabilities" (and Accruals/Provisions/Long Term Liabilities) net worth line items always showing in red parentheses even when genuinely positive — same class of bug as the subtotal-row fix from last time, just missed on the individual line items themselves.',
    'Forecast Settings: the Cash Position sign-reversal checkboxes now warn clearly if the change fails to save (e.g. local storage is full) instead of silently reverting on the next screen — previously this could look like the checkbox "did nothing."',
    'P&L: fixed Net Result being wrong when an expense account\'s real transactions happen to show a positive true sign — it now always computes as Income minus the magnitude of Expenses, matching standard P&L semantics regardless of sign convention (same fix philosophy as the over/under budget correction from before).',
  ]},
  {version:'3.12.0', date:'2026-08-05', changes:[
    'Forecast page: fixed the mislabeled "Total Current Month Start" row — now correctly reads "Closing Balance". Removed the "Discrepancy vs. real balance" diagnostic row (and its underlying calculation) from both the on-screen panel and the CSV export.',
    'Forecast page: Smart Rules indicator changed from a lightning bolt to the letter "R", matching the B (Budget) and P (Provisions) badges.',
    'Forecast page: fixed a real bug where the account stats popup never closed after clicking "View in Ledger" — traced to two silently-duplicated definitions of the same function, only one of which actually closed the modal. Merged into one correct version.',
    'Removed Long Term Events entirely — the category, CSV import/export, the event list/editor, and all related badges and data. Asset (Long Term) and Liability (Long Term) accounts now check Provisions first and fall back to manual entry, the same pattern used by Investment Income/Expense.',
    'Budget page now shows every month through your Grid End Month setting instead of always stopping at 12, and uses the same fast-path indexing as the Forecast Grid so it doesn\'t slow down as the range grows.',
    'P&L: fixed the over/under budget figure being backwards in some cases — it now compares magnitudes (spent more in absolute terms = over budget) instead of raw signed subtraction, so it stays correct regardless of an account\'s true-sign convention. Added ‹ › arrows to quickly step to the previous/next month instead of only the dropdown.',
    'Dashboard: removed the "Assets — by section" and "Liabilities — by section" widgets, and the "Recent Journal Vouchers" section.',
    'Dashboard: fixed Short Term Equity / Cash Bank Account / Long Term Equity always showing their liability subtotal in red parentheses even on the rare occasion it\'s genuinely positive (an intra-month anomaly) — now shows the true sign.',
    'Removed the standalone Cash Flow page entirely.',
    'Code cleanup: audited all ~516 functions in the app for dead code and duplicate definitions. Removed 4 confirmed-unused functions (including a second silent duplicate found the same way as the ledger-modal bug above) and every remaining trace of Long Term Events. No functional changes from this pass — purely removing dead weight.',
  ]},
  {version:'3.11.0', date:'2026-08-05', changes:[
    'Forecast page now shows every month through your Grid End Month setting, instead of always stopping at a fixed 12 months regardless of that setting.',
    'Performance: fixed the real reason the Forecast Grid was slow — every cell was independently re-scanning the entire ledger/budget/provisions/events from scratch. Bulk renders (Forecast Grid, Real Estate) now build a one-pass lookup index first, so each cell becomes a fast lookup instead of a full re-scan. Verified byte-for-byte identical results between the old and new computation paths across every account and month in a large synthetic test dataset — this was purely a speed fix, not a behavior change.',
  ]},
  {version:'3.10.0', date:'2026-08-05', changes:[
    'New: Custom Forecast Categories (Settings → 🗂️ Custom Categories) — add your own categories, just like Income or Expense. Each gets its own section in the Forecast Grid and its own row in the Cash Position summary, no code changes needed. Pick a name, inflow/outflow, and how it should be planned (manual entry, checks Provisions, checks Budget, or Provisions with a manual fallback).',
    'Custom categories automatically work everywhere the built-in ones do: the account category picker, Cash Position sign-reversal settings, and Forecast Grid section ordering.',
    'Deleting a custom category safely unassigns any accounts still using it (asks first) — the accounts themselves are never touched.',
  ]},
  {version:'3.9.0', date:'2026-08-04', changes:[
    'Fixed the REAL cause of "balanced but flagged as unbalanced" Provisions groups: deleting a line ("✕ Remove account") never cleaned up that line\'s stored values — they stayed orphaned in the group\'s data forever, silently still being counted in the balance check even though the line no longer appeared anywhere. Deleting a line now cleans up its values across every month, and the balance check itself now ignores any leftover values from lines that no longer exist (fixing already-affected groups immediately, no data cleanup needed).',
    'Provisions: the net-to-zero error message now shows the actual difference amount, e.g. "Aug-26 doesn\'t net to zero — check the grid below (-12.50)."',
    'Provisions: moved the "✕" remove-line button from the far right (had to scroll all the way across the grid to reach it) to a new sticky column on the far left, right next to the account name.',
    'Provisions Bulk Fill: now shows how many months remain until your Grid End Month setting, updating live as you change the Starting Month.',
  ]},
  {version:'3.8.3', date:'2026-08-04', changes:[
    'Fixed Provisions groups being incorrectly flagged as "doesn\'t net to zero" when they actually did — tiny floating-point drift in stored values (invisible when rounded to cents for display) could push the real sum a hair off zero. Balance checks now round to cents before summing, matching what you actually see on screen.',
    'Fixed the Forecast sign-reversal toggle (Settings → Forecast) not visibly doing anything for categories like Accrual — the reversal was only ever applied to read-only cells; freely-editable cells (which Accrual mostly is) kept showing the raw, un-reversed value. Editable cells now correctly show and accept the reversed figure, while still storing the true underlying value.',
  ]},
  {version:'3.8.2', date:'2026-08-04', changes:[
    'Fixed the Smart Rules sync error ("row violates row-level security policy") — the migration created the table but didn\'t add an access policy. See smart_rules_rls_fix.sql.',
    'Fixed a real crash: several settings (like the Forecast sign-reversal toggle) could throw an uncaught "storage full" error and stop working once the browser\'s local storage filled up after years of data. Every local save now fails gracefully with a warning in the Activity Log instead of crashing — including a recursion bug I caught in my own testing where the failure warning itself could loop forever if the Activity Log\'s own save was what failed.',
  ]},
  {version:'3.8.1', date:'2026-08-03', changes:[
    'Accounts page: fixed the historical-averages/edit icon buttons not lining up between rows — they now render at a fixed, equal size regardless of the emoji glyph, and the icon column itself has a fixed width so it no longer shifts based on how wide a balance number is. Also fixed a column-count mismatch in the category total row.',
  ]},
  {version:'3.8.0', date:'2026-08-03', changes:[
    'New: Smart Rules framework — a general, expandable engine for computing numbers from live data (account balance, account transactions for this/last month, or "same as another line, reversed"), instead of one-off hardcoded logic.',
    'Prebuilt JV templates: any line can now use a "⚡ Smart Amount" computed fresh every time the template is loaded, in the same "Load Template" dropdown as regular templates. Covers patterns like balance-sweep consolidation (two lines, same amount, reversed sign) and clearing an account\'s accumulated monthly transactions into another account.',
    'New Settings → ⚡ Smart Rules tab: pick an account, a rule type, and a sign — no code changes needed. Overrides that account\'s CURRENT MONTH Forecast plan only; every other month keeps its normal category behavior.',
    'Forecast page: fixed the sign-reversal toggle (Settings → Forecast) — it previously only affected the Cash Position summary panel, never the detailed per-account grid. Now applies consistently everywhere, including Provision and Accrual sections.',
    'Forecast "Resolve Mismatch — Apply across all mismatched months": added the ability to apply one custom typed figure to every mismatched month, alongside the existing "prefer Provisions/Budget" options. Also fixed a race condition where this action could return before all months finished writing.',
    'Provisions page: the account-name column is now sticky (frozen) while scrolling — fixes having to scroll back left to see which account a row belongs to after the grid auto-scrolls to the current month.',
    'Real Estate page: fixed the "Net" row showing the wrong sign (a real profit was displaying as negative/red) — now correctly reversed and colored to match the Revenue section.',
    'Accounts page: added a "📊 Historical Averages" button (in both the account list and the edit modal) — reuses the same rolling 3/6/12-month, yearly, and YTD averages already available from the Forecast page.',
    'Added the app version number in small text next to "LedgerOS" in the sidebar.',
  ]},
  {version:'3.7.0', date:'2026-08-03', changes:[
    'Accounts page: multi-select checkboxes are now hidden by default — click "Select" to reveal them.',
    'Forecast page: click a category label in the Bank Accounts — Projected Cash Position panel to jump straight to that section below.',
    'P&L page: added a "Last month" period option; removed color from the Actual column; confirmed Variance colors (Actual − Budget: negative = over budget = red, positive = under budget = green).',
    'Provisions page: historical months are no longer shown in the grid, export, or import — only current month through your Grid End Month setting. Existing historical data is untouched in storage, just hidden. Import also ignores any historical month columns in an uploaded file.',
    'Provisions page: fixed a bug where an in-progress line description edit could occasionally be lost — saving a description no longer triggers a full page re-render that could wipe out another field you were still typing into.',
    'Real Estate page: Revenue section figures are now shown with their sign reversed (Total Revenue in green); removed all editable input boxes — every figure is always sourced from Provisions (future months) or the Ledger (historical months), never typed directly here; removed decimals from monthly figures; widened the account-name column and fixed a bug where the Total Revenue/Expenses/Net rows didn\'t line up with their month columns.',
  ]},
  {version:'3.6.2', date:'2026-08-02', changes:[
    'Backfilled the Change Log with history reconstructed from earlier development sessions, v1.15.0 through v3.2.0 (dates not carried over for these older entries — some were uncertain or unknown at the source).',
  ]},
  {version:'3.6.1', date:'2026-08-02', changes:[
    'Added this Change Log section to Settings — every future release gets an entry here.',
  ]},
  {version:'3.6.0', date:'2026-08-02', changes:[
    'P&L page no longer force-flips expense actual/budget figures negative — shows the real transaction sign, so an accrual reversal or credit now displays correctly instead of always appearing as an outflow.',
    'Provisions lines now support an editable per-line description (click the label in the grid) — flows into the ledger description when you post a Provision JV, and round-trips through CSV export/import via a new "Line Description" column.',
  ]},
  {version:'3.5.1', date:'2026-08-02', changes:[
    'Forecast conflict resolver: added "Apply to all mismatched months" — bulk-resolves every future month with a Budget/Provisions mismatch for an account, each month keeping its own figure from the chosen source. Months that can\'t be safely auto-resolved are skipped and listed.',
  ]},
  {version:'3.5.0', date:'2026-08-02', changes:[
    'Forecast: added a Budget/Provisions mismatch resolver — pick Provisions\' figure, Budget\'s figure, or a custom number, applied to both sides where safely possible.',
    'Fixed CSV imports appearing to hang at 100% — progress feedback now continues through the cloud-sync phase, and syncing runs with limited concurrency (up to 6 at once) across all CSV imports for a real speed-up.',
  ]},
  {version:'3.4.0', date:'2026-08-02', changes:[
    'Added a Content Width setting (Automatic or Manual with size presets) to use the empty space on wide screens.',
    'Lightened the dark theme palette for better readability.',
    'Fixed a checkbox layout bug on the Provisions duplicate-account exempt toggle.',
    'Provisions grid now auto-scrolls to the current month when opened.',
    'Added a "Clear Provisions" button to Settings → Danger Zone.',
  ]},
  {version:'3.3.0', date:'2026-08-02', changes:[
    'Added a per-provision-group "duplicate-account lines don\'t need to net to zero" exemption toggle, for groups that legitimately don\'t balance (e.g. itemized multi-line breakdowns) — shows a neutral note instead of blocking Generate JV.',
  ]},
  {version:'3.2.2', date:'2026-08-02', changes:[
    'Fixed a Provisions CSV import bug where a second row for the same Group+Account could silently erase the first row\'s planned month values.',
    'Added a "Line ID" column to Provisions CSV export for reliable round-trips of duplicate-account lines.',
  ]},
  {version:'3.2.1', date:'2026-08-02', changes:[
    'JV editing: added an editable Date field — applies to every line of the JV, blocks future dates, and the existing "outside current month" warning now checks the date being saved rather than the original.',
  ]},
  {version:'3.2.0', date:'', changes:[
    'Replaced the top navigation bar with a left-side sidebar.',
    'Renamed "Budget vs Actual" to just "Budget".',
    'Fixed: the Provision category wasn\'t showing real actuals for past months.',
    'Fixed: editing a cell on the Real Estate page didn\'t update its totals until a manual refresh.',
    'Provisions page: account labels simplified (name only, click to jump to that account\'s Ledger); the free-text description box replaced with three live figures (Current Balance / Sum of Planned Months / Projected Total); an unbalanced duplicate-account issue now shows as an immediate error instead of only at JV-generation time.',
    'Provisions page: full CSV import/export, including creating new groups from a CSV.',
    'Real Estate page: same account-label simplification and click-to-Ledger navigation.',
    'Added "jump to a specific month" on the Forecast, Budget, and Real Estate pages.',
    'New Settings option to set a fixed end month that caps how far the grids scroll forward and controls where CSV exports end.',
  ]},
  {version:'3.1.0', date:'', changes:[
    'Real Estate page: any account can now be linked as an apartment or expense (previously restricted by category); the account picker is now a proper searchable field instead of a dropdown.',
    'Forecast page numbers now display as whole numbers with no decimals; CSV exports and the Real Estate page deliberately kept full decimal precision.',
  ]},
  {version:'3.0.0', date:'', changes:[
    'New Real Estate page: group rental income and expense accounts by building, see per-building and portfolio-wide profitability, with dedicated import/export — built entirely on existing Forecast Grid data, no separate storage.',
    'Fixed: Asset (Long Term) and Liability (Long Term) categories were not showing real historical actuals for past months at all.',
    'Asset/Liability (Long Term) now also check Provisions (in addition to Long Term Events), with a conflict warning if both exist and disagree.',
  ]},
  {version:'2.7.2', date:'', changes:[
    'Fixed a bug where the "Cash Flow Breakdown" popup (opened by clicking a Closing Balance figure) showed the un-reversed number even when that category\'s sign-reversal was active.',
  ]},
  {version:'2.7.1', date:'', changes:[
    'Extended the "check Provisions first" behavior to all four Investment Income/Expense categories (previously only plain Income/Expense did this) — fixes accounts with real planned Provisions amounts not showing up on the Forecast Grid.',
  ]},
  {version:'2.7.0', date:'', changes:[
    'New "Anchor current month to real balance" toggle (on by default) — keeps future projections grounded in the real current bank balance even if older historical months have small categorization gaps.',
    'Replaced the single discrepancy figure with a month-by-month row, to pinpoint exactly when/where a gap started.',
    'Forecast Settings\' account-category setup section is now collapsed by default.',
  ]},
  {version:'2.6.1', date:'', changes:[
    'New "Export Cash Position" button on the Forecast page — exports the full summary grid from the earliest ledger month through the end of the forecast period, respecting any sign-reversal settings.',
  ]},
  {version:'2.5.0', date:'', changes:[
    '(Reconstructed history was uncertain whether this was v2.5.0 or v2.6.0 — kept as 2.5.0 to preserve chronological order.)',
    'Fixed: creating a balancing JV from the Allocations page (or generating one from Provisions) now returns you to that same page after posting, instead of dropping you on the Ledger page.',
    'Cash Position sign-reversal now affects the entire row — historical, current, and future months alike — not just future ones, per explicit direction; a deliberate tradeoff that can show small computed-vs-real discrepancies if categorization isn\'t fully clean.',
  ]},
  {version:'2.4.0', date:'', changes:[
    'Budget page: the entire current-month column is now highlighted, not just its header.',
    'Fixed: large CSV imports (Budget/Forecast grids) showed no real progress and appeared to jump straight to 100%; completion messages now show how long the import actually took.',
    'Fixed a display bug where a value that rounds to zero could still show up colored red or green.',
    'Ledger: editing a JV now lets you delete individual lines, while still enforcing that the JV nets to zero.',
    'Forecast page: clicking a budgeted figure now jumps to the exact cell on the Budget page instead of just the top of the page.',
    'The app now remembers your scroll position on every page when you navigate away and back.',
    'Added the ability to reverse the display sign of any of the 12 Forecast categories in the Cash Position summary (initially limited to future months only).',
  ]},
  {version:'2.3.0', date:'', changes:[
    'Accounts page: select multiple accounts and batch-edit their status, allocatable flag, category, or forecast category at once.',
    'New Activity & Error Log in Settings (local-only) — records errors, failed syncs, and key actions like posting a JV.',
    'Fixed a UI bug where certain popups would jump back to the top every time you interacted with them.',
    'Prebuilt JV templates must now net to zero before saving, with a live running total shown while editing.',

function nextAccNumber(catDigit, subCode){
  const used = new Set();
  D.accounts.forEach(a=>{
    if(Math.floor(a.id/10000)===catDigit && Math.floor((a.id%10000)/100)===subCode){

/* ============================= PERSIST ============================= */
// Wraps every localStorage write in the app. Storage can fill up over years of real data — this
// makes that fail as a visible, recoverable warning (logged to the Activity Log) instead of an
// uncaught crash. Returns true/false so callers can react if they need to.
function safeSetItem(key, value){
  try{
    localStorage.setItem(key, value);
    return true;
  }catch(e){
    console.warn('localStorage write failed for "'+key+'"', e);
    // Never call logActivity() when the failing write IS the activity log itself — that would
    // recurse forever (logActivity -> saveActivityLog -> safeSetItem -> fails -> logActivity -> ...).
    if(key!=='activityLog_v1' && typeof logActivity==='function'){
      const msg = key==='ledgerData_v1'
        ? 'Could not update the local offline cache — your browser\'s storage is full. Your changes ARE still saved to the cloud; only the local copy used for instant loading is out of date until this is resolved.'
        : 'Could not save "'+key+'" locally — your browser\'s storage is full. This setting may not persist after a page refresh.';
      logActivity('error', msg);
    }
    return false;
  }
}
function persistLocal(){ safeSetItem('ledgerData_v1', JSON.stringify(D)); }

/* ============================= OFFLINE SYNC QUEUE ============================= */
// Every write to accounts/ledger/budget/templates goes through syncWrite(). If we're online it
// writes straight to Supabase. If we're offline (or the write fails), it's queued locally with a
// "base" version stamp — the updated_at this device last saw for that row. When we reconnect,
// flushSyncQueue() replays the queue, but for each row first checks whether the server's current
// updated_at still matches that base. If it does, nobody else touched it — apply safely. If it
// doesn't, someone else's change already landed there first — that's a real conflict, and we stop
// and ask which version to keep rather than silently picking one.
let syncQueue = [];
let syncConflicts = [];
function loadSyncQueue(){ try{ return JSON.parse(localStorage.getItem('syncQueue_v1')||'[]'); }catch(e){ return []; } }
function saveSyncQueue(){ try{ safeSetItem('syncQueue_v1', JSON.stringify(syncQueue)); }catch(e){} }
function nowISO(){ return new Date().toISOString(); }
// ===== Activity & Error Log — local-only (this device), for sharing with Claude when diagnosing
// a bug. Deliberately NOT synced to Supabase (it's a diagnostic tool, not app data) and capped in
// size so it can never itself contribute to a localStorage quota problem.
const ACTIVITY_LOG_CAP = 300;
let activityLog = [];
function loadActivityLog(){
  try{ activityLog = JSON.parse(localStorage.getItem('activityLog_v1')||'[]'); if(!Array.isArray(activityLog)) activityLog=[]; }catch(e){ activityLog=[]; }
}
function saveActivityLog(){

}
function logActivity(type, message){

    activityLog.unshift({t: nowISO(), type, message: String(message).slice(0,500)});
    if(activityLog.length>ACTIVITY_LOG_CAP) activityLog.length = ACTIVITY_LOG_CAP;
    saveActivityLog();
  }catch(e){ /* logging must never itself throw */ }
}
function clearActivityLog(){ activityLog=[]; saveActivityLog(); renderSettings(); toast('Log cleared'); }
function activityLogAsText(){

}

function updateSyncBadge(){

function renderSyncBanner(){

// kind: 'upsert' | 'delete'. row: full row object (must include pk). base: updated_at this device
// last saw for that row before this edit (null = brand new row, never existed before).
async function syncWrite(table, kind, row, base){
  if(kind==='upsert') row.updated_at = nowISO();
  const online = usingCloud && SB && navigator.onLine!==false;
  if(online){
    try{
      const r = kind==='upsert' ? await SB.from(table).upsert(row) : await SB.from(table).delete().eq('id', row.id);
      if(!r.error){ updateSyncBadge(); return {ok:true}; }
      console.warn('sync write failed, queueing:', r.error.message);
      logActivity('sync', 'Write to '+table+' (id '+(row.id!==undefined?row.id:'?')+') failed and was queued: '+r.error.message);
    } catch(e){ console.warn('sync write exception, queueing:', e); logActivity('sync', 'Write to '+table+' (id '+(row.id!==undefined?row.id:'?')+') threw an exception and was queued: '+(e&&e.message?e.message:e)); }
  }
  syncQueue.push({qid: Date.now()+'_'+Math.random().toString(36).slice(2), table, kind, row: kind==='upsert'?row:{id:row.id}, base, ts: nowISO()});
  saveSyncQueue();
  updateSyncBadge();
  return {ok:false, queued:true};
}
// Runs many syncWrite() calls with a small worker pool instead of one at a time — used by CSV
// imports so the post-processing "syncing to the cloud" phase doesn't sit fully serial (which is
// what made large imports appear to hang at 100% with no feedback). Each op: {table, kind, row, base}.
async function syncWriteMany(ops, opts){
  const concurrency = Math.max(1, (opts && opts.concurrency) || 6);
  const onProgress = opts && opts.onProgress;
  const total = ops.length;
  let idx = 0, completed = 0;
  async function worker(){
    while(idx < ops.length){
      const i = idx++;
      const op = ops[i];
      await syncWrite(op.table, op.kind, op.row, op.base);
      completed++;
      if(onProgress) onProgress(completed, total);
    }
  }
  const workers = [];
  for(let i=0;i<Math.min(concurrency, ops.length);i++) workers.push(worker());
  await Promise.all(workers);
}
async function flushSyncQueue(){
  if(!usingCloud || !SB || !syncQueue.length){ updateSyncBadge(); return; }
  setStatus('Syncing '+syncQueue.length+' pending change(s)…');
  const remaining = [];
  const newConflicts = [];
  for(const op of syncQueue){
    let serverRow = null, serverUpdatedAt = null;
    try{
      const r = await SB.from(op.table).select('*').eq('id', op.row.id).maybeSingle();
      serverRow = r.data || null;
      serverUpdatedAt = serverRow ? (serverRow.updated_at || null) : null;
    } catch(e){ remaining.push(op); continue; }
    const baseVal = op.base || null;
    if(serverUpdatedAt !== baseVal){
      // someone else's write already landed on this row since we last saw it — real conflict
      newConflicts.push({op, serverRow});
      continue;
    }
    try{
      const r = op.kind==='upsert' ? await SB.from(op.table).upsert(op.row) : await SB.from(op.table).delete().eq('id', op.row.id);
      if(r.error) remaining.push(op);
    } catch(e){ remaining.push(op); }
  }
  syncQueue = remaining;
  saveSyncQueue();
  if(newConflicts.length){
    syncConflicts = syncConflicts.concat(newConflicts);
    updateSyncBadge();
    showConflictModal();
  } else if(remaining.length){
    updateSyncBadge();
    toast(remaining.length+' change(s) still couldn\'t sync — will retry later', true);
  } else {
    updateSyncBadge();
    toast('All pending changes synced ✓');
    await fetchAllFromCloud(); rebuildIndex(); go(screen||'dashboard');
  }
}

async function applyConflictResolutions(){
  let ok=0, failed=0;
  for(const c of syncConflicts){
    const choice = conflictChoices[c.op.qid]||'mine';
    if(choice==='mine'){
      try{
        const r = c.op.kind==='upsert' ? await SB.from(c.op.table).upsert(c.op.row) : await SB.from(c.op.table).delete().eq('id', c.op.row.id);
        if(r.error){ failed++; continue; }
        ok++;
      } catch(e){ failed++; continue; }
    } else {
      applyServerRowToD(c.op.table, c.serverRow, c.op.row.id);
      ok++;
    }
  }
  persistLocal();
  syncConflicts = [];
  conflictChoices = {};
  updateSyncBadge();
  closeModal();
  if(failed){ toast(failed+' resolution(s) failed to push — try again', true); }
  else { toast('All conflicts resolved ✓'); }
  await fetchAllFromCloud(); rebuildIndex(); go(screen||'dashboard');
}

async function fetchAllRows(table, orderCol, selectCols, onProgress){
  selectCols = selectCols || '*';
  let all = [];
  let from = 0;
  const PAGE = 1000;
  let total = null;
  if(onProgress){
    const countRes = await SB.from(table).select('id',{count:'exact',head:true});
    total = countRes.count || 0;
    onProgress(0, total);
  }
  while(true){
    const r = await SB.from(table).select(selectCols).order(orderCol||'id').range(from, from+PAGE-1);
    if(r.error) return {data:null, error:r.error};
    all = all.concat(r.data);
    if(onProgress) onProgress(all.length, total);
    if(r.data.length < PAGE) break;
    from += PAGE;
  }
  return {data: all, error: null};
}

async function insertWithRetry(table, chunk, attempts){
  attempts = attempts || 3;
  let lastErr = null;
  for(let a=1; a<=attempts; a++){
    const r = await SB.from(table).upsert(chunk);
    if(!r.error) return r;
    lastErr = r.error;
    console.warn(table+' batch attempt '+a+' failed:', r.error.message);
    await new Promise(res=>setTimeout(res, 800*a));
  }
  return {error:lastErr};
}

  const BATCH=250;
  const failedBatches = [];
  for(let i=0;i<D.ledger.length;i+=BATCH){
    const chunk = D.ledger.slice(i,i+BATCH).map(l=>({id:l.id,jv:l.jv,entry_date:l.date,acc:l.acc,descr:l.descr,amt:l.amt,alloc:l.alloc,allocatable:l.allocatable}));

function sumAcc(pred, fromDate, toDate){
  let t=0;
  for(const l of D.ledger){
    if(!pred(l)) continue;
    if(fromDate && l.date<fromDate) continue;
    if(toDate && l.date>toDate) continue;
    t += Number(l.amt)||0;
  }
  return t;
}
function accountBalance(accId){ if(_forecastFastIndexes) return _forecastFastIndexes.balanceIdx[accId] || 0; return sumAcc(l=>l.acc===accId); }
// ============================= SMART RULES FRAMEWORK =============================
// A small, general-purpose "value expression" language for computing a number from live
// data — used by both prebuilt JV template lines (this file) and Forecast per-account
// overrides. New expression types can be added here without touching either consumer.
// Expression shapes:
//   {type:'fixed', value}
//   {type:'account_balance', account, sign}                    — accountBalance(account) * sign
//   {type:'account_period_sum', account, period, sign}         — sum of that account's ledger
//        transactions in a given month, period is a signed integer month offset from "now"
//        (0 = this month, -1 = last month, -2 = two months ago, ...) * sign
//   {type:'ref', ref, sign}                                    — another line's ALREADY-computed
//        value (by index, within the same JV template) * sign — this is what makes "insert two
//        lines with the same amount but reversed sign" possible without hardcoding it.
// sign defaults to 1 if omitted.
function smartRulePeriodRange(offset){
  const d = new Date();

// ENTIRE ledger/budget/provisions/events on every single call — and computeForecastCell calls
// them once per (account, month) cell. For a bulk render (Forecast Grid, Real Estate) that's
// ledger_size × accounts × months work, repeated. beginForecastFastPath() builds one-pass
// lookup indexes instead, turning each of those calls into an O(1) lookup. Wrap any bulk render
// in try{ beginForecastFastPath(); ...render... }finally{ endForecastFastPath(); } — the finally

// elsewhere in the app after data changes. Isolated single-cell calls (no active fast path)
// keep using the original scanning behavior unchanged.
let _forecastFastIndexes = null;
function beginForecastFastPath(){
  const ledgerIdx = {};
  const balanceIdx = {};
  D.ledger.forEach(l=>{
    const mk = l.date.slice(0,7);
    const acc = ledgerIdx[l.acc] || (ledgerIdx[l.acc]={});
    acc[mk] = (acc[mk]||0) + (Number(l.amt)||0);
    balanceIdx[l.acc] = (balanceIdx[l.acc]||0) + (Number(l.amt)||0);
  });
  const budgetIdx = {};
  D.budget.forEach(b=>{
    const mk = b.date.slice(0,7);
    const acc = budgetIdx[b.acc] || (budgetIdx[b.acc]={});
    acc[mk] = (acc[mk]!==undefined? acc[mk] : 0) + (Number(b.amt)||0);
  });
  const provIdx = {};
  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    Object.entries(g.months||{}).forEach(([mk,cell])=>{
      g.lines.forEach(line=>{
        const v = cell[line.lineId];
        if(v===undefined||v===null||v==='') return;
        const acc = provIdx[line.acc] || (provIdx[line.acc]={});

  }

  msg += '\nTook '+elapsedSec+'s';

      msg += '\n\n⚠ '+mismatches.length+' locked/computed cell(s) didn\'t match what the app computes (Expense/Asset LT/Liability LT from Budget or Provisions, or Provision). These were NOT overwritten — the computed value was kept:\n'+list+(mismatches.length>25?`\n…and ${mismatches.length-25} more — export the full list below.`:'');
    }
    if(unmatchedRows.length) msg += '\n\nExport the full report below for a complete list, including unmatched rows.';
    const mismatchRows = mismatches.map(m=>['Value Mismatch', m.acc, m.name, m.month, m.imported, m.computed, Number((m.imported-m.computed).toFixed(2))]);

    });
  });
  return total;
}
function budgetPlanFor(accId, monthKey){
  if(_forecastFastIndexes){
    const v = _forecastFastIndexes.budgetIdx[accId]?.[monthKey];
    return v===undefined? null : v;
  }
  const [from,to] = monthRange(monthKey);
  const rows = D.budget.filter(b=>b.acc===accId && b.date>=from && b.date<=to);
  if(!rows.length) return null;
  return rows.reduce((s,b)=>s+Number(b.amt),0);
}

function shiftMonthKey(mk, delta){
  let [y,m]=mk.split('-').map(Number);
  m += delta;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return y+'-'+String(m).padStart(2,'0');
}
function monthsBetweenKeys(fromYm, toYm){
  const out=[]; let mk=fromYm;
  let guard=0;
  while(mk<=toYm && guard<600){ out.push(mk); mk=nextMonthKeyPlain(mk); guard++; }
  return out;
}

  if(!months.length) return null;
  const vals = months.map(m=>forecastActual(accId,m));
  return vals.reduce((s,v)=>s+v,0)/months.length;
}

// Finds the D.budget row(s) and provision (group,line) contributor(s) behind an account+month's
// Budget figure and Provisions figure respectively — used by the conflict resolver below to decide
// whether a side can be safely auto-written (exactly one contributor) or needs a manual fix (2+).
function budgetContributorsFor(accId, monthKey){
  const [from,to] = monthRange(monthKey);
  return D.budget.filter(b=>b.acc===accId && b.date>=from && b.date<=to);
}
function provisionContributorsFor(accId, monthKey){
  const out = [];
  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    const cell = g.months[monthKey];
    if(!cell) return;
    g.lines.forEach(line=>{

      const v = cell[line.lineId];
      if(v===undefined||v===null||v==='') return;
      out.push({group:g, line});
    });

// Writes `val` to the Budget row and/or Provisions line for one account+month, where possible.
// strict=true (used by the bulk "apply to all months" flow): only writes if BOTH sides have
// exactly one contributor — otherwise writes nothing for this month and reports it as skipped.
// strict=false (single-month manual resolve): writes whichever side(s) can be safely written
// and reports the rest via notes, matching the original single-month behavior.
async function applyForecastResolutionToMonth(accId, monthKey, val, opts){
  const strict = !!(opts && opts.strict);
  const budgetRows = budgetContributorsFor(accId, monthKey);
  const provContributors = provisionContributorsFor(accId, monthKey);
  const budgetWritable = budgetRows.length<=1;
  const provWritable = provContributors.length===1;
  if(strict && (!budgetWritable || !provWritable)){
    return {ok:false, notes:[(!budgetWritable? 'Budget has '+budgetRows.length+' entries.' : 'Provisions has '+provContributors.length+' lines.')]};
  }
  const notes = [];
  if(budgetWritable){
    if(budgetRows.length===1){
      const row = budgetRows[0];
      row.amt = val;
      await syncWrite('pd_budget', 'upsert', {id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:val}, row.updated_at||null);
    } else {
      const row = {id: nextBudgetId(), date: monthKey+'-01', acc: accId, descr: 'Budget - '+monthLabel(monthKey), amt: val};
      D.budget.push(row);
      await syncWrite('pd_budget', 'upsert', {id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:val}, null);
    }
  } else {
    notes.push('Budget has '+budgetRows.length+' entries this month — left untouched, adjust manually.');
  }
  if(provWritable){
    const {group, line} = provContributors[0];
    if(!group.months[monthKey]) group.months[monthKey] = {};
    group.months[monthKey][line.lineId] = val;
    await persistProvisionGroup(group);
  } else if(provContributors.length>1){
    notes.push('Provisions has '+provContributors.length+' lines this month — left untouched, adjust manually.');
  }
  return {ok: notes.length===0, notes};
}

async function resolveForecastConflict(accId, monthKey, value){

  const result = await applyForecastResolutionToMonth(accId, monthKey, val, {strict:false});

  }
  logActivity('action', 'Resolved Budget/Provisions mismatch for '+accShort(accId)+' ('+accId+'), '+monthLabel(monthKey)+' — set to '+money(val)+(!result.ok?' (partial: '+result.notes.join(' ')+')':''));

// "Apply to all mismatched months" — for every future month (through the configured Grid End
// Month) where this account currently has a Budget/Provisions conflict, uses that month's OWN
// figure from the chosen source (numbers can differ month to month, unlike the single-figure
// resolve above). Strict mode: a month is only touched if both sides are single-contributor;
// otherwise it's skipped entirely (no partial writes) and reported back.
async function resolveForecastConflictAllMonths(accId, strategy, customValue){
  if(blockIfSyncing()) return;
  const a = D.accounts.find(x=>x.id===accId); if(!a) return;
  const strategyLabel = strategy==='provisions'?'Provisions':strategy==='budget'?'Budget':('the custom figure '+money(customValue));
  if(!confirm('Apply '+strategyLabel+' to every currently-mismatched future month for '+accShort(accId)+'? This writes to both Budget and Provisions where each month allows it.')) return;
  const currentMonth = todayStr().slice(0,7);
  const gridEnd = getGridEndMonth();
  let resolvedCount = 0;
  const skippedMonths = [];
  let mk = currentMonth;
  let guard = 0;
  while(mk<=gridEnd && guard<600){
    const cell = computeForecastCell(a, mk, currentMonth);
    if(cell.conflict){
      const val = strategy==='provisions'? cell.provPlan : strategy==='budget'? cell.budgetPlan : customValue;
      const result = await applyForecastResolutionToMonth(accId, mk, val, {strict:true});
      if(result.ok) resolvedCount++; else skippedMonths.push(mk);
    }
    mk = nextMonthKeyPlain(mk);
    guard++;
  }
  persistLocal();
  closeModal();
  let msg = 'Resolved '+resolvedCount+' month(s) for '+accShort(accId)+' using '+strategyLabel+'.';
  if(skippedMonths.length){ msg += ' Skipped '+skippedMonths.length+' month(s) with multiple entries: '+skippedMonths.map(monthLabel).join(', ')+'.'; }
  toast(msg, skippedMonths.length>0);
  logActivity('action', 'Bulk-resolved Budget/Provisions mismatch for '+accShort(accId)+' ('+accId+') using '+strategy+' — '+resolvedCount+' month(s) resolved'+(skippedMonths.length? ', '+skippedMonths.length+' skipped':''));
  renderForecastBody();
}
function resolveForecastConflictAllMonthsCustom(accId){
  const el = document.getElementById('conflictCustomAllVal');
  const clean = String(el? el.value : '').replace(/,/g,'').trim();
  const val = Number(clean);
  if(clean===''||isNaN(val)){ toast('Enter a valid number', true); return; }
  return resolveForecastConflictAllMonths(accId, 'custom', val);
}
// Computes {plan, actual, variance, editable, locked, conflict, source} for one account+month,
// dispatching on that account's forecast category behavior.
function computeForecastCell(a, monthKey, currentMonth){
  // Smart Rules (Settings → Smart Rules) override the normal category behavior for this specific
  // account. Each rule has a target offset (0 = current month, +1/+2/+3 = that many months
  // ahead). Every month from the current month up to (but not including) the target is forced
  // to 0 — nothing happens there by design (e.g. a quarterly sweep). The target month itself
  // gets the live-computed value (e.g. today's account balance, reversed). Months after the
  // target are untouched by the rule and use the account's normal forecast category logic. This
  // still avoids the circular-dependency problem of trying to project a rule-driven value forward
  // using data that doesn't exist yet — the target month's value is always computed from TODAY's
  // real data, not a simulation of what that future month will actually look like.
  if(monthKey>=currentMonth){
    const rule = D.forecastAccountRules.find(r=>r.account===a.id);
    if(rule){
      const offset = rule.targetOffset||0;
      const targetMonth = shiftMonthKey(currentMonth, offset);
      if(monthKey===targetMonth){
        const actual = forecastActual(a.id, monthKey);
        const plan = evaluateSmartRuleExpr({...rule.rule, account: rule.account}, {});
        return {plan, actual, variance: actual-plan, editable:false, locked:true, source:'smart_rule', smartRuleName:rule.name};
      }
      if(monthKey<targetMonth){
        const actual = forecastActual(a.id, monthKey);
        return {plan:0, actual, variance: actual, editable:false, locked:true, source:'smart_rule', smartRuleName:rule.name};
      }
    }
  }
  const behavior = FORECAST_CATEGORIES[getForecastCategory(a)]?.behavior;
  const actual = forecastActual(a.id, monthKey);
  const isInactive = a.status==='Inactive';
  if(behavior==='manual'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    }
    const plan = getManualPlan(a.id, monthKey);
    return {plan, actual, variance: plan!==null? actual-plan : null, editable: !isInactive, locked:isInactive, source:'manual'};
  }
  if(behavior==='manual_or_provision'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    }
    const provPlan = provisionsPlanFor(a.id, monthKey);
    if(provPlan!==null){
      return {plan: provPlan, actual, variance: actual-provPlan, editable:false, locked:true, source:'provisions'};
    }
    const plan = getManualPlan(a.id, monthKey);
    return {plan, actual, variance: plan!==null? actual-plan : null, editable: !isInactive, locked:isInactive, source: plan!==null?'manual':null};
  }
  if(behavior==='expense'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    }
    const provPlan = provisionsPlanFor(a.id, monthKey);
    const budgetPlan = budgetPlanFor(a.id, monthKey);
    let plan, source;
    if(provPlan!==null){ plan = provPlan; source = 'provisions'; }
    else if(budgetPlan!==null){ plan = budgetPlan; source = 'budget'; }
    else { plan = 0; source = 'budget-empty'; } // no Provisions, no Budget entry yet — shows 0, still links to Budget to plan it
    const conflict = provPlan!==null && budgetPlan!==null && Math.abs(provPlan-budgetPlan)>0.5;
    return {plan, actual, variance: actual-plan, editable:false, locked:true, conflict, source, provPlan, budgetPlan};
  }
  if(behavior==='autoclear'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    } else if(monthKey === currentMonth){
      const priorEnd = monthRange(prevMonthKey(monthKey))[1];
      const priorBalance = D.ledger.filter(l=>l.acc===a.id && l.date<=priorEnd).reduce((s,l)=>s+Number(l.amt),0);
      const plan = -priorBalance;
      return {plan, actual, variance: actual-plan, editable:false, locked:true, source:'autoclear'};
    } else {
      // Future months for autoclear categories (Asset ST / Liability ST / Accrual): the current
      // month is assumed to clear the account to zero, so there is nothing left to plan beyond it.
      // Locked at 0, not editable. Any previously-stored manual plan value for these months is
      // intentionally left untouched in pd_forecast_plans but no longer read here.
      return {plan: 0, actual, variance: 0-actual, editable:false, locked:true, source:'autoclear'};
    }
  }
  if(behavior==='provision'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    }
    const plan = provisionsPlanFor(a.id, monthKey);
    return {plan, actual, variance: plan!==null? actual-plan : null, editable:false, locked:true, source: plan!==null?'provisions':null};
  }
  return {plan:null, actual, variance:null, editable:false, locked:true, source:null};
}

let jvDraft = { date: todayStr(), lines: [] };
function freshLine(){ return {key:Math.random().toString(36).slice(2), acc:'', descr:'', amt:'', _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1}; }
function resetJVDraft(){ jvDraft = { date: todayStr(), lines: [freshLine(),freshLine()] }; }
if(jvDraft.lines.length===0) resetJVDraft();

function jvTotal(){ return jvDraft.lines.reduce((s,l)=>s+(Number(l.amt)||0),0); }
function jvIsBlankLine(l){ return !l.acc && (!l.descr||!l.descr.trim()) && (l.amt===''||l.amt===null||l.amt===undefined); }
function jvIsCompleteLine(l){ return l.acc && l.descr && l.descr.trim() && l.amt!==''&&l.amt!==null&&l.amt!==undefined && !isNaN(Number(l.amt)); }
function jvBalanced(){
  const nonBlank = jvDraft.lines.filter(l=>!jvIsBlankLine(l));
  if(nonBlank.some(l=>!jvIsCompleteLine(l))) return false;
  return Math.abs(jvTotal()) < 0.005 && nonBlank.length>=2;
}
function reconcileProjected(){
  const posted = accountBalance(reconcileAcc);
  const draft = jvDraft.lines.filter(l=>Number(l.acc)===reconcileAcc).reduce((s,l)=>s+(Number(l.amt)||0),0);
  return posted + draft;
}
function reconcileBannerHTML(){
  if(!reconcileAcc) return '';
  const a = ACC_BY_ID[reconcileAcc];
  if(!a || a.stmt_balance===null || a.stmt_balance===undefined) { reconcileAcc=null; return ''; }
  const projected = reconcileProjected();
  const remaining = Number(a.stmt_balance) - projected;
  const done = Math.abs(remaining) < 0.005;
  return `<div class="panel" style="background:${done?'#146c4322':'var(--chip)'};border-color:${done?'var(--green)':'var(--accent)'}">
    <div class="row" style="justify-content:space-between">
      <div><b>🏦 Reconciling ${a.id} — ${esc(accShort(a.id))}</b>
        <div class="mut" style="font-size:12px;margin-top:3px">Statement: <b class="mono">${money(a.stmt_balance)}</b> &nbsp; Ledger incl. this draft: <b class="mono" id="reconcileProjected">${money(projected)}</b></div>
      </div>
      <div style="text-align:right">
        <div class="mut" style="font-size:11px;text-transform:uppercase">Remaining</div>
        <div class="mono" id="reconcileRemaining" style="font-size:18px;font-weight:700;color:${done?'var(--green)':'var(--red)'}">${done? 'Reconciled ✓' : money(remaining)}</div>
      </div>
      <button class="x noprint" onclick="reconcileAcc=null; renderNewJV()" title="Exit reconciliation">✕</button>
    </div>
  </div>`;
}
function updateReconcileBanner(){
  if(!reconcileAcc) return;
  const a = ACC_BY_ID[reconcileAcc]; if(!a) return;
  const projected = reconcileProjected();
  const remaining = Number(a.stmt_balance) - projected;
  const done = Math.abs(remaining) < 0.005;
  const pEl = document.getElementById('reconcileProjected'); if(pEl) pEl.textContent = money(projected);
  const rEl = document.getElementById('reconcileRemaining');
  if(rEl){ rEl.textContent = done? 'Reconciled ✓' : money(remaining); rEl.style.color = done? 'var(--green)':'var(--red)'; }
}

// Lightweight update used while typing an amount — avoids re-rendering (and de-focusing) inputs
function updateJVTotals(){
  const t = jvTotal(), bal = jvBalanced();
  const disp = document.getElementById('jvTotalDisp');
  if(disp){ disp.textContent = money(t); disp.style.color = bal?'var(--green)':'var(--red)'; }

function jvLineRow(l,i){
  return `<tr>
    <td class="autoc"><div style="display:flex;gap:4px;align-items:center">
      <input id="jvAcc_${i}" style="flex:1" placeholder="Search account…" value="${l.acc? esc(accName(l.acc)) : (l._q||'')}"
        oninput="jvAccInput(${i},this.value)" onfocus="jvAccInput(${i},this.value)"
        onkeydown="jvAccKey(event,${i})" onblur="setTimeout(()=>closeAcDrop(${i}),150)">
      ${i>0? `<button type="button" class="x" title="Copy account from line above" onclick="copyAccAbove(${i})">⤴</button>` : ''}
      <button type="button" class="x" title="Clear" onclick="clearJVField(${i},'acc')">✕</button>
      <div class="acdrop" id="acdrop_${i}"></div>
    </div></td>
    <td class="autoc"><div style="display:flex;gap:4px;align-items:center">
      <input id="jvDescr_${i}" style="flex:1" value="${esc(l.descr)}" oninput="jvDescrInput(${i},this.value)" onfocus="jvDescrInput(${i},this.value)"
        onkeydown="jvDescrKey(event,${i})" onblur="setTimeout(()=>closeDescrDrop(${i}),150)" placeholder="Description">
      ${i>0? `<button type="button" class="x" title="Copy description from line above" onclick="copyDescrAbove(${i})">⤴</button>` : ''}
      <button type="button" class="x" title="Clear" onclick="clearJVField(${i},'descr')">✕</button>
      <div class="acdrop" id="descrdrop_${i}"></div>
    </div></td>
    <td><div style="display:flex;gap:4px;align-items:center">
      <input id="jvAmt_${i}" class="num" style="flex:1" type="text" inputmode="decimal" value="${l.amt===''?'':fmt2(l.amt)}"
        oninput="jvDraft.lines[${i}].amt=this.value; updateJVTotals()"
        onfocus="this.value = (jvDraft.lines[${i}].amt===''?'':jvDraft.lines[${i}].amt)"
        onblur="jvAmtBlur(${i})"
        onkeydown="jvAmtKey(event,${i})" placeholder="0.00 or 1+5-2">
      <button type="button" class="x" title="Clear" onclick="clearJVField(${i},'amt')">✕</button>
    </div></td>
    <td><button class="x" title="Remove line" onclick="removeJVLine(${i})">🗑</button></td>
  </tr>`;
}
function clearJVField(i, field){
  const l = jvDraft.lines[i]; if(!l) return;
  if(field==='acc'){ l.acc=''; l._q=''; l._matches=[]; l._hi=-1; const el=document.getElementById('jvAcc_'+i); if(el){ el.value=''; el.focus(); } closeAcDrop(i); }
  else if(field==='descr'){ l.descr=''; const el=document.getElementById('jvDescr_'+i); if(el){ el.value=''; el.focus(); } }
  else if(field==='amt'){ l.amt=''; const el=document.getElementById('jvAmt_'+i); if(el){ el.value=''; el.focus(); } }
  updateJVTotals();
}
function copyDescrAbove(i){
  if(i<1 || i>=jvDraft.lines.length) return;
  const val = jvDraft.lines[i-1].descr||'';
  jvDraft.lines[i].descr = val;
  const el = document.getElementById('jvDescr_'+i);
  if(el) el.value = val;
  const amtEl = document.getElementById('jvAmt_'+i);
  if(amtEl) amtEl.focus();
}
function copyAccAbove(i){
  if(i<1 || i>=jvDraft.lines.length) return;
  const acc = jvDraft.lines[i-1].acc;
  if(!acc) return;
  jvDraft.lines[i].acc = acc;
  jvDraft.lines[i]._q = '';
  jvDraft.lines[i]._matches = [];
  jvDraft.lines[i]._hi = -1;
  const el = document.getElementById('jvAcc_'+i);
  if(el) el.value = accName(acc);
  closeAcDrop(i);
  const descrEl = document.getElementById('jvDescr_'+i);
  if(descrEl) descrEl.focus();
}
// Description autocomplete: suggests descriptions already typed on OTHER lines of this same JV
// (since a debit/credit pair usually shares the same description), and when picked, fills this
// line's amount as the reverse sign of the matched line's amount to help balance the entry.
function jvDescrInput(i, val){
  jvDraft.lines[i].descr = val;
  const q = val.toLowerCase().trim();
  if(!q){ jvDraft.lines[i]._descrMatches=[]; closeDescrDrop(i); return; }
  const seen = new Set(); const uniq=[];
  jvDraft.lines.forEach((l,idx)=>{
    if(idx===i) return;
    if(l.descr && l.descr.toLowerCase().includes(q) && !seen.has(l.descr)){ seen.add(l.descr); uniq.push(l); }
  });
  jvDraft.lines[i]._descrMatches = uniq.slice(0,8);
  jvDraft.lines[i]._descrHi = -1;
  renderDescrDrop(i);
}
function renderDescrDrop(i){
  const l = jvDraft.lines[i];
  const matches = l._descrMatches||[];
  const el = document.getElementById('descrdrop_'+i);
  const html = matches.map((m,idx)=>`<div class="${idx===l._descrHi?'hi':''}" onmousedown="pickDescrMatch(${i},'${m.key}')">${esc(m.descr)} <span class="mut" style="float:right">${m.amt!==''&&m.amt!==null&&!isNaN(Number(m.amt))?money(-Number(m.amt)):''}</span></div>`).join('');
  el.innerHTML = html;
  el.className = html? 'acdrop show' : 'acdrop';
}
function closeDescrDrop(i){ const el=document.getElementById('descrdrop_'+i); if(el){ el.innerHTML=''; el.className='acdrop'; } }
function jvDescrKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  const matches = jvDraft.lines[i]._descrMatches||[];
  if(ev.key==='ArrowDown'){ if(matches.length){ ev.preventDefault(); jvDraft.lines[i]._descrHi = Math.min(matches.length-1, (jvDraft.lines[i]._descrHi??-1)+1); renderDescrDrop(i); } }
  else if(ev.key==='ArrowUp'){ if(matches.length){ ev.preventDefault(); jvDraft.lines[i]._descrHi = Math.max(0, (jvDraft.lines[i]._descrHi??0)-1); renderDescrDrop(i); } }
  else if(ev.key==='Enter'){
    if(matches.length && jvDraft.lines[i]._descrHi>=0){ ev.preventDefault(); pickDescrMatch(i, matches[jvDraft.lines[i]._descrHi].key); }
    else { ev.preventDefault(); closeDescrDrop(i); const el = document.getElementById('jvAmt_'+i); if(el) el.focus(); }
  }
  else if(ev.key==='Escape'){ closeDescrDrop(i); }
}
function pickDescrMatch(i, key){
  const matched = jvDraft.lines.find(l=>l.key===key);
  if(!matched) return;
  jvDraft.lines[i].descr = matched.descr;
  const hasAmt = matched.amt!==''&&matched.amt!==null&&!isNaN(Number(matched.amt));
  const reverseAmt = hasAmt ? -Number(matched.amt) : '';
  jvDraft.lines[i].amt = reverseAmt;
  const descrEl = document.getElementById('jvDescr_'+i); if(descrEl) descrEl.value = matched.descr;
  const amtEl = document.getElementById('jvAmt_'+i); if(amtEl) amtEl.value = reverseAmt===''? '' : fmt2(reverseAmt);
  jvDraft.lines[i]._descrMatches = [];
  closeDescrDrop(i);
  updateJVTotals();
  advanceAfterAmount(i);
}
function advanceAfterAmount(i){
  if(i+1 < jvDraft.lines.length){
    const el = document.getElementById('jvAcc_'+(i+1));
    if(el) el.focus();
  } else {
    addJVLine();

// Safely evaluates a typed arithmetic expression like "1+5-2" and rounds to 2 decimals.
// Only fires if the text actually contains an operator (so plain negative numbers like "-100" pass through untouched).
function tryEvalFormula(str){
  if(!/^[\d+\-*/.() \t]+$/.test(str)) return null;
  if(!/[+\-*/]/.test(str.slice(1))) return null;
  try{
    const result = Function('"use strict"; return (' + str + ')')();
    if(typeof result==='number' && isFinite(result)) return Math.round(result*100)/100;
  } catch(e){}
  return null;
}
function jvAmtBlur(i){
  const raw = jvDraft.lines[i].amt;
  let num;
  if(raw===''||raw===null){ num=''; }
  else{
    const cleaned = String(raw).replace(/,/g,'').trim();
    const formulaResult = tryEvalFormula(cleaned);
    num = formulaResult!==null ? formulaResult : Number(cleaned);
  }
  jvDraft.lines[i].amt = (num===''||isNaN(num))? '' : num;
  const el = document.getElementById('jvAmt_'+i);
  if(el) el.value = jvDraft.lines[i].amt===''? '' : fmt2(jvDraft.lines[i].amt);
  updateJVTotals();
}
function jvAmtKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  if(ev.key==='ArrowUp'||ev.key==='ArrowDown'){
    ev.preventDefault();
    const target = ev.key==='ArrowUp'? i-1 : i+1;
    const el = document.getElementById('jvAmt_'+target);
    if(el){ el.focus(); el.select(); }
  } else if(ev.key==='Enter'){
    ev.preventDefault();
    jvAmtBlur(i);
    advanceAfterAmount(i);
  }
}

function jvAccInput(i,val){
  jvDraft.lines[i]._q = val;
  if(!val){ jvDraft.lines[i].acc=''; }
  const q = val.toLowerCase();
  const matches = postableAccounts().filter(a=> String(a.id).includes(q) || (a.name||'').toLowerCase().includes(q)).slice(0,25);

}
function renderAcDrop(i){
  const l = jvDraft.lines[i];
  const matches = l._matches||[];
  const el = document.getElementById('acdrop_'+i);
  const html = matches.map((a,idx)=>
    `<div class="${idx===l._hi?'hi':''}" onmousedown="pickJVAcc(${i},${a.id})">${a.id} — ${esc(accShort(a.id))}</div>`).join('') || (l._q? '<div class="mut">No match</div>' : '');
  el.innerHTML = html;
  el.className = html? 'acdrop show' : 'acdrop';
}
function jvAccKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  const l = jvDraft.lines[i];
  const matches = l._matches||[];
  if(ev.key==='ArrowDown'){ if(matches.length){ ev.preventDefault(); l._hi = Math.min(matches.length-1, l._hi+1); renderAcDrop(i); } }
  else if(ev.key==='ArrowUp'){ if(matches.length){ ev.preventDefault(); l._hi = Math.max(0, l._hi-1); renderAcDrop(i); } }
  else if(ev.key==='Enter'){
    ev.preventDefault();
    if(matches.length && l._hi>=0){ pickJVAcc(i, matches[l._hi].id); }
    else { closeAcDrop(i); const d = document.getElementById('jvDescr_'+i); if(d) d.focus(); }
  }
  else if(ev.key==='Tab'){
    // commit the highlighted (or the only) match, then move focus to Description ourselves
    if(matches.length){
      const pick = l._hi>=0 ? matches[l._hi] : (matches.length===1 ? matches[0] : null);
      if(pick){ ev.preventDefault(); pickJVAcc(i, pick.id); }
    }
  }
  else if(ev.key==='Escape'){ closeAcDrop(i); }
}

  return `

      </div>` : ''}

function computeAccrualJV(){
  const monthInput = document.getElementById('accrualMonthInput');
  accrualMonth = monthInput? monthInput.value : accrualMonth;
  const mappings = getAccrualMappings();
  if(!mappings.length){ toast('No accrual mappings configured — set them up in Settings first', true); return; }
  const [mFrom, mTo] = monthRange(accrualMonth);
  const lines = [];
  const explanation = [];
  mappings.forEach(map=>{
    const catAccs = D.accounts.filter(a=>a.category===map.category && firstDigit(a.id)===6).map(a=>a.id);
    if(!catAccs.length){ return; }
    const budget = D.budget.filter(b=>catAccs.includes(b.acc) && b.date>=mFrom && b.date<=mTo).reduce((s,b)=>s+Number(b.amt),0);
    const actual = D.ledger.filter(l=>catAccs.includes(l.acc) && l.date>=mFrom && l.date<=mTo).reduce((s,l)=>s+Number(l.amt),0);
    const variance = budget - actual; // positive = under budget (surplus to accrue)
    if(Math.abs(variance)<0.005){ explanation.push({category:map.category, budget, actual, variance:0, action:'On budget — no accrual needed'}); return; }
    const tag = monthTag(accrualMonth);
    if(variance>0){
      // under budget: accrue the surplus — Dr the 99-account, Cr the liability
      lines.push({key:Math.random().toString(36).slice(2), acc:map.expenseAcc, descr:map.category+' Accrual - '+tag, amt: Math.round(variance*100)/100, _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
      lines.push({key:Math.random().toString(36).slice(2), acc:map.liabilityAcc, descr:map.category+' Accrual - '+tag, amt: -Math.round(variance*100)/100, _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
      explanation.push({category:map.category, budget, actual, variance, action:'Under budget — accrued '+money(variance)+' to liability'});
    } else {
      const overage = -variance;
      const liabBalance = accountBalance(map.liabilityAcc); // negative number
      const available = Math.abs(Math.min(liabBalance,0));
      const draw = Math.min(overage, available);
      if(draw<0.005){ explanation.push({category:map.category, budget, actual, variance, action:'Over budget by '+money(overage)+' but no liability balance available to draw from'}); return; }
      lines.push({key:Math.random().toString(36).slice(2), acc:map.liabilityAcc, descr:map.category+' Accrual Drawdown - '+tag, amt: Math.round(draw*100)/100, _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
      lines.push({key:Math.random().toString(36).slice(2), acc:map.expenseAcc, descr:map.category+' Accrual Drawdown - '+tag, amt: -Math.round(draw*100)/100, _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
      const note = draw<overage-0.005? ' (capped — only '+money(available)+' was available)' : '';
      explanation.push({category:map.category, budget, actual, variance, action:'Over budget — drew '+money(draw)+' from liability'+note});
    }
  });
  accrualExplanation = explanation;
  if(!lines.length){ toast('Nothing to accrue for '+monthLabel(accrualMonth)+' — every mapped category is on budget', true); renderNewJV(); return; }
  jvDraft.date = mTo;
  jvDraft.lines = lines;
  renderNewJV();
  toast('Generated accrual JV for '+monthLabel(accrualMonth)+' — review the explanation and lines before posting');
}

async function postJV(){
  if(blockIfSyncing()) return;
  const nonBlank = jvDraft.lines.filter(l=>!jvIsBlankLine(l));
  const incomplete = nonBlank.filter(l=>!jvIsCompleteLine(l));
  if(incomplete.length){ toast('Every line needs an account, a description, and an amount — fill in or remove the incomplete line(s)', true); return; }
  const lines = nonBlank;
  const inactiveLines = lines.filter(l=>{ const a = D.accounts.find(x=>x.id===Number(l.acc)); return a && a.status==='Inactive'; });
  if(inactiveLines.length){
    const names = [...new Set(inactiveLines.map(l=>accShort(Number(l.acc))))].join(', ');
    toast('Can\'t post — this JV includes an Inactive account: '+names, true);
    return;
  }
  const total = lines.reduce((s,l)=>s+(Number(l.amt)||0),0);
  if(Math.abs(total)>=0.005){ toast('Lines must net to zero before posting',true); return; }
  if(lines.length<2){ toast('Add at least two lines',true); return; }
  const jv = nextJV();
  let id = nextLedgerId();
  const rows = lines.map(l=>({id:id++, jv, date:jvDraft.date, acc:Number(l.acc), descr:l.descr||'', amt:Number(l.amt), alloc:null, allocatable:false}));
  D.ledger.push(...rows);
  persistLocal();
  for(const r of rows){
    await syncWrite('pd_ledger', 'upsert', {id:r.id, jv:r.jv, entry_date:r.date, acc:r.acc, descr:r.descr, amt:r.amt, alloc:r.alloc, allocatable:r.allocatable}, null);
  }
  toast('JV #'+jv+' posted ✓'+(syncQueue.length? ' (queued for sync)':''));
  logActivity('action', 'Posted JV #'+jv+' ('+lines.length+' lines, net '+money(total)+')');
  resetJVDraft();
  ledgerFilter = {acc:'', from:'', to:'', q:'', jv:'', preset:'', specificMonth:'', unallocOnly:false};
  ledgerPage = 0;
  if(jvReturnScreen){ const dest = jvReturnScreen; jvReturnScreen = null; go(dest); }
  else if(reconcileAcc){ reconcileAcc = null; go('dashboard'); }
  else go('ledger');
}

/* ============================= LEDGER ============================= */
function filteredLedger(){
  return D.ledger.filter(l=>{
    if(ledgerFilter.unallocOnly && !(ACC_BY_ID[l.acc]?.is_allocatable && !l.alloc)) return false;
    if(ledgerFilter.acc && String(l.acc)!==String(ledgerFilter.acc)) return false;
    if(ledgerFilter.from && l.date < ledgerFilter.from) return false;
    if(ledgerFilter.to && l.date > ledgerFilter.to) return false;
    if(ledgerFilter.jv && String(l.jv)!==String(ledgerFilter.jv)) return false;
    if(ledgerFilter.q){
      const q=ledgerFilter.q.toLowerCase();
      if(!(String(l.descr||'').toLowerCase().includes(q) || String(l.acc).includes(q) || accShort(l.acc).toLowerCase().includes(q))) return false;
    }

  }).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.jv-a.jv);

function shiftDate(dstr, days){ const d=new Date(dstr+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function monthRange(ym){ const [y,m]=ym.split('-').map(Number); const lastDay=new Date(y,m,0).getDate(); return [ym+'-01', ym+'-'+String(lastDay).padStart(2,'0')]; }
function applyLedgerPreset(val){
  ledgerFilter.preset = val;
  const today = todayStr();
  if(val==='month'){ [ledgerFilter.from, ledgerFilter.to] = monthRange(today.slice(0,7)); }
  else if(val==='30'){ ledgerFilter.from = shiftDate(today,-30); ledgerFilter.to = today; }
  else if(val==='60'){ ledgerFilter.from = shiftDate(today,-60); ledgerFilter.to = today; }
  else if(val==='90'){ ledgerFilter.from = shiftDate(today,-90); ledgerFilter.to = today; }
  else if(val==='ytd'){ ledgerFilter.from = today.slice(0,4)+'-01-01'; ledgerFilter.to = today; }
  else if(val==='all'){ ledgerFilter.from=''; ledgerFilter.to=''; }
  else if(val==='specific'){ const ym = ledgerFilter.specificMonth || today.slice(0,7); ledgerFilter.specificMonth = ym; [ledgerFilter.from, ledgerFilter.to] = monthRange(ym); }
  ledgerPage=0; renderLedger();
}
function ledgerSpecificMonthChange(val){ ledgerFilter.specificMonth = val; ledgerFilter.preset='specific'; [ledgerFilter.from, ledgerFilter.to] = monthRange(val); ledgerPage=0; renderLedger(); }
function csvEscape(v){ v = v===null||v===undefined? '' : String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function ledgerExportFilename(){
  const parts = [];
  if(ledgerFilter.acc){ parts.push(accShort(Number(ledgerFilter.acc)).replace(/[\\/:*?"<>|,]/g,'')); } else { parts.push('All Accounts'); }
  if(ledgerFilter.preset==='specific' && ledgerFilter.specificMonth){ parts.push(monthLabel(ledgerFilter.specificMonth)); }
  else if(ledgerFilter.preset==='month'){ parts.push(monthLabel(todayStr().slice(0,7))); }
  else if(ledgerFilter.preset==='ytd'){ parts.push(todayStr().slice(0,4)+' YTD'); }
  else if(ledgerFilter.preset==='all'){ parts.push('Full History'); }
  else if(ledgerFilter.from || ledgerFilter.to){ parts.push((ledgerFilter.from||'start')+' to '+(ledgerFilter.to||'today')); }
  else { parts.push(todayStr()); }
  return parts.join(' - ')+'.csv';
}
function exportLedgerCSV(){

  rows.forEach(l=> lines.push([l.jv, l.date, l.acc, accShort(l.acc), l.descr, l.amt, l.alloc? pad5(l.alloc):''].map(csvEscape).join(',')));

}
function jveAmtBlur(i){
  const raw = jvEditDraft.lines[i].amt;
  let num;
  if(raw===''||raw===null){ num=''; }
  else{
    const cleaned = String(raw).replace(/,/g,'').trim();
    const formulaResult = tryEvalFormula(cleaned);
    num = formulaResult!==null ? formulaResult : Number(cleaned);
  }
  jvEditDraft.lines[i].amt = (num===''||isNaN(num))? '' : num;
  const el = document.getElementById('jveAmt_'+i);
  if(el) el.value = jvEditDraft.lines[i].amt===''? '' : fmt2(jvEditDraft.lines[i].amt);
  updateJVEditTotals();
}
function jveAccInput(i,val){
  const l = jvEditDraft.lines[i];
  l._q = val;
  if(!val){ l.acc=''; }
  const q = val.toLowerCase();
  const matches = postableAccounts().filter(a=> String(a.id).includes(q) || (a.name||'').toLowerCase().includes(q)).slice(0,25);
  l._matches = matches; l._hi = -1;
  jveRenderAcDrop(i);
}
function jveRenderAcDrop(i){
  const l = jvEditDraft.lines[i];
  const matches = l._matches||[];
  const el = document.getElementById('jveAcdrop_'+i);
  const html = matches.map((a,idx)=> `<div class="${idx===l._hi?'hi':''}" onmousedown="jvePickAcc(${i},${a.id})">${a.id} — ${esc(accShort(a.id))}</div>`).join('') || (l._q? '<div class="mut">No match</div>' : '');
  el.innerHTML = html;
  el.className = html? 'acdrop show' : 'acdrop';
}
function jveAccKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  const l = jvEditDraft.lines[i];
  const matches = l._matches||[];
  if(ev.key==='ArrowDown'){
    if(matches.length){ ev.preventDefault(); l._hi=Math.min(matches.length-1,l._hi+1); jveRenderAcDrop(i); }
    else { ev.preventDefault(); const el=document.getElementById('jveAcc_'+(i+1)); if(el){ el.focus(); el.select(); } }
  }
  else if(ev.key==='ArrowUp'){
    if(matches.length){ ev.preventDefault(); l._hi=Math.max(0,l._hi-1); jveRenderAcDrop(i); }
    else { ev.preventDefault(); const el=document.getElementById('jveAcc_'+(i-1)); if(el){ el.focus(); el.select(); } }
  }
  else if(ev.key==='Enter'){ ev.preventDefault(); if(matches.length && l._hi>=0){ jvePickAcc(i,matches[l._hi].id); } else { jveCloseAcDrop(i); const d=document.getElementById('jveDescr_'+i); if(d) d.focus(); } }
  else if(ev.key==='Escape'){ jveCloseAcDrop(i); }
}
function jveDescrKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  if(ev.key==='ArrowDown'){ ev.preventDefault(); const el=document.getElementById('jveDescr_'+(i+1)); if(el){ el.focus(); el.select(); } }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); const el=document.getElementById('jveDescr_'+(i-1)); if(el){ el.focus(); el.select(); } }
  else if(ev.key==='Enter'){ ev.preventDefault(); const el=document.getElementById('jveAmt_'+i); if(el) el.focus(); }
}
function jveAmtKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  if(ev.key==='ArrowUp'||ev.key==='ArrowDown'){
    ev.preventDefault();
    const target = ev.key==='ArrowUp'? i-1 : i+1;
    const el = document.getElementById('jveAmt_'+target);
    if(el){ el.focus(); el.select(); }
  } else if(ev.key==='Enter'){
    ev.preventDefault();
    jveAmtBlur(i);
    const el = document.getElementById('jveAcc_'+(i+1));
    if(el) el.focus();
  }
}
function jvePickAcc(i,accId){
  jvEditDraft.lines[i].acc = accId; jvEditDraft.lines[i]._matches=[]; jvEditDraft.lines[i]._hi=-1;
  const inp = document.getElementById('jveAcc_'+i); if(inp) inp.value = accName(accId);
  jveCloseAcDrop(i); updateJVEditTotals();
  const descr = document.getElementById('jveDescr_'+i); if(descr) descr.focus();
}
function jveCloseAcDrop(i){ const el=document.getElementById('jveAcdrop_'+i); if(el){ el.innerHTML=''; el.className='acdrop'; } }
async function saveJVEdit(){
  if(blockIfSyncing()) return;
  const d = jvEditDraft;
  const total = d.lines.reduce((s,l)=>s+(Number(l.amt)||0),0);
  const complete = d.lines.every(l=> l.acc && l.descr && String(l.descr).trim() && l.amt!==''&&l.amt!==null&&l.amt!==undefined && !isNaN(Number(l.amt)));
  if(!complete){ toast('Every line needs an account, description, and amount', true); return; }
  if(d.lines.length<2){ toast('A JV needs at least two lines', true); return; }
  const inactiveLines = d.lines.filter(l=>{
    const a = D.accounts.find(x=>x.id===Number(l.acc));
    if(!a || a.status!=='Inactive') return false;
    const original = D.ledger.find(x=>x.id===l.id);
    return !original || Number(original.acc)!==Number(l.acc); // only a problem if this line is being newly assigned to it
  });
  if(inactiveLines.length){
    const names = [...new Set(inactiveLines.map(l=>accShort(Number(l.acc))))].join(', ');
    toast('Can\'t save — this JV includes an Inactive account: '+names, true);
    return;
  }
  if(Math.abs(total)>=0.005){ toast('Lines must net to zero before saving', true); return; }
  const jvDate = D.ledger.find(l=>l.jv===d.jv)?.date;
  if(jvDate && jvDate.slice(0,7)!==todayStr().slice(0,7)){
    if(!confirm('This JV is dated '+jvDate+', outside the current month. Changing it will affect historical numbers for that period. Continue?')) return;
  }
  // Any original line no longer present in the draft was deliberately removed — delete it for real.
  const originalIds = D.ledger.filter(l=>l.jv===d.jv).map(l=>l.id);
  const keptIds = new Set(d.lines.map(l=>l.id).filter(id=>id!=null));
  const removedIds = originalIds.filter(id=>!keptIds.has(id));
  const removedRows = removedIds.map(id=>D.ledger.find(l=>l.id===id)).filter(Boolean);
  if(removedRows.length){
    D.ledger = D.ledger.filter(l=>!removedIds.includes(l.id));
  }
  const touched = [];
  let nextId = null;
  d.lines.forEach(l=>{
    if(l.id==null){
      // a line added during this edit session — a genuinely new ledger row
      if(nextId==null) nextId = nextLedgerId();
      const row = {id: nextId++, jv: d.jv, date: jvDate||todayStr(), acc: Number(l.acc), descr: l.descr, amt: Number(l.amt), alloc: null, allocatable: false};
      D.ledger.push(row);
      touched.push(row);
      return;
    }
    const row = D.ledger.find(x=>x.id===l.id);
    if(!row) return;
    row.acc = Number(l.acc); row.descr = l.descr; row.amt = Number(l.amt);
    touched.push(row);
  });
  persistLocal();
  closeModal();
  toast('JV #'+d.jv+' updated ✓'+(removedRows.length? ' ('+removedRows.length+' line(s) removed)':''));
  logActivity('action', 'Edited JV #'+d.jv+' ('+touched.length+' line(s) changed'+(removedRows.length? ', '+removedRows.length+' line(s) deleted':'')+')');
  for(const row of touched){
    await syncWrite('pd_ledger', 'upsert', {id:row.id, jv:row.jv, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt, alloc:row.alloc, allocatable:row.allocatable}, row.updated_at||null);
  }
  for(const row of removedRows){
    await syncWrite('pd_ledger', 'delete', {id:row.id}, row.updated_at||null);
  }
  if(screen==='ledger') renderLedger();
  else if(screen==='dashboard') renderDashboard();
  else if(screen==='statement') renderStatement();
  else if(screen==='alloc') renderAlloc();
}
function exportJVCSV(jv){
  const lines = D.ledger.filter(l=>l.jv===jv).sort((a,b)=>a.id-b.id);
  const header = ['JV#','Date','Account#','Account Name','Description','Amount'];
  const rows = [header.join(',')];
  lines.forEach(l=> rows.push([l.jv,l.date,l.acc,accShort(l.acc),l.descr,l.amt].map(csvEscape).join(',')));
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jv-'+jv+'.csv'; a.click();
  toast('JV #'+jv+' exported to CSV');
}
function duplicateJV(jv){
  const lines = D.ledger.filter(l=>l.jv===jv).sort((a,b)=>a.id-b.id);
  jvDraft = { date: todayStr(), lines: lines.map(l=>({key:Math.random().toString(36).slice(2), acc:l.acc, descr:l.descr, amt:l.amt, _matches:[], _hi:-1})) };
  closeModal();
  go('newjv');
  toast('Loaded JV #'+jv+' as a starting point — review and post');
}
async function deleteJV(jv){
  if(blockIfSyncing()) return;
  if(!confirm('Delete JV #'+jv+' and all its lines? This cannot be undone.')) return;
  const rows = D.ledger.filter(l=>l.jv===jv);
  D.ledger = D.ledger.filter(l=>l.jv!==jv);
  persistLocal(); closeModal(); renderLedger();
  toast('JV #'+jv+' deleted');
  logActivity('action', 'Deleted JV #'+jv+' ('+rows.length+' lines)');
  for(const r of rows){ await syncWrite('pd_ledger', 'delete', {id:r.id}, r.updated_at||null); }
}

async function saveStmtBalance(accId, val, focusNextId){
  if(blockIfSyncing()) return;
  const a = D.accounts.find(x=>x.id===accId); if(!a) return;
  const base = a.updated_at||null;
  const clean = String(val).replace(/,/g,'').trim();

    a.stmt_available = clean===''? null : Number(clean);

// Resolved plan for the Budget page/grid: Provisions take priority (locked), else whatever is
// stored in D.budget for that account+month (editable). Mirrors the exact same precedence the
// Forecast page's Expense cells use, so the two pages always agree on the same numbers.
function resolvedBudgetCell(accId, monthKey){
  const provPlan = provisionsPlanFor(accId, monthKey);
  if(provPlan!==null) return {plan: provPlan, source:'provisions', editable:false};
  const rows = D.budget.filter(b=>b.acc===accId && monthOf(b.date)===monthKey);
  const hasBudget = rows.length>0;
  const val = hasBudget? rows.reduce((s,b)=>s+Number(b.amt),0) : null;
  return {plan: val, source: hasBudget? 'budget' : null, editable:true};
}
let budgetWindowStart = todayStr().slice(0,7);
const BUDGET_WINDOW_SIZE = 12;
function budgetMonthsWindow(){
  const months = [];
  let mk = budgetWindowStart;
  for(let i=0;i<BUDGET_WINDOW_SIZE;i++){ months.push(mk); mk = nextMonthKeyPlain(mk); }
  return months;
}
function budgetShiftWindow(delta){
  budgetWindowStart = delta>0? nextMonthKeyPlain(budgetWindowStart) : prevMonthKey(budgetWindowStart);
  renderBudgetGrid();
}
function budgetJumpToday(){ budgetWindowStart = todayStr().slice(0,7); renderBudgetGrid(); }
function getBudgetCollapsedSections(){

}
function toggleBudgetSectionCollapse(cat){
  const collapsed = getBudgetCollapsedSections();
  const idx = collapsed.indexOf(cat);
  if(idx>=0) collapsed.splice(idx,1); else collapsed.push(cat);
  localStorage.setItem('budgetCollapsedSections', JSON.stringify(collapsed));
  renderBudgetGrid();
}
async function saveBudgetCell(accId, monthKey, rawVal){
  if(blockIfSyncing()) return;
  const clean = String(rawVal).replace(/,/g,'').trim();
  const existing = D.budget.find(b=>b.acc===accId && monthOf(b.date)===monthKey);
  if(clean===''||Number(clean)===0){
    if(existing){
      D.budget = D.budget.filter(b=>b!==existing);
      persistLocal(); renderBudgetGrid();
      await syncWrite('pd_budget', 'delete', {id:existing.id}, existing.updated_at||null);
    }
    return;
  }
  const val = Number(clean);
  if(isNaN(val)) return;
  if(existing){
    const base = existing.updated_at||null;
    existing.amt = val;
    persistLocal(); renderBudgetGrid();
    await syncWrite('pd_budget', 'upsert', {id:existing.id, entry_date:existing.date, acc:existing.acc, descr:existing.descr, amt:existing.amt}, base);
  } else {
    const row = {id: nextBudgetId(), date: monthKey+'-01', acc: accId, descr: 'Budget - '+monthLabel(monthKey), amt: val};
    D.budget.push(row);
    persistLocal(); renderBudgetGrid();
    await syncWrite('pd_budget', 'upsert', {id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt}, null);
  }
}

async function importBudgetGridCSV(rows){
  if(blockIfSyncing()) return;
  const startTime = Date.now();
  const currentMonth = todayStr().slice(0,7);
  const sampleKeys = Object.keys(rows[0]||{});
  const monthCols = sampleKeys.filter(k=>/^\d{4}-\d{2}$/.test(k) && k>currentMonth);
  if(!confirm('Import '+rows.length+' rows? This will replace future budget entries ('+monthCols.length+' future month columns detected) for every matched account. Historical/current-month columns are always ignored.')) return;
  let matched=0, unmatched=0, planWritten=0; const mismatches=[];
  const touchedUpserts=[], touchedDeletes=[];
  showImportProgress('Importing Budget Grid…');
  let processed=0;
  for(const r of rows){
    const id = parseInt(r['account id']||r['account#']||r['account'],10);
    const a = D.accounts.find(x=>x.id===id);
    if(!a){ unmatched++; processed++; continue; }
    matched++;
    for(const mk of monthCols){
      const raw = r[mk];
      if(raw===undefined) continue;
      const c = resolvedBudgetCell(a.id, mk);
      const clean = String(raw).replace(/,/g,'').trim();
      if(!c.editable){
        if(clean!=='' && Math.abs(Number(clean)-Number(c.plan||0))>0.01){
          mismatches.push({acc:a.id, name:accShort(a.id), month:mk, imported:Number(clean), computed:c.plan});
        }
        continue;
      }
      const existing = D.budget.find(b=>b.acc===a.id && monthOf(b.date)===mk);
      if(clean===''){
        if(existing){ D.budget = D.budget.filter(b=>b!==existing); touchedDeletes.push({id:existing.id, updated_at:existing.updated_at||null}); planWritten++; }
      } else {
        const val = Number(clean);
        if(isNaN(val)) continue;
        if(existing){ existing.amt = val; touchedUpserts.push(existing); }
        else { const row = {id: nextBudgetId(), date: mk+'-01', acc: a.id, descr: 'Budget - '+monthLabel(mk), amt: val}; D.budget.push(row); touchedUpserts.push(row); }
        planWritten++;
      }
    }
    processed++;
    updateImportProgress(processed, rows.length, 'Processing');
    // Yield to the browser every few rows so the progress bar actually paints — without this, a
    // long synchronous loop (many accounts × many months) blocks rendering entirely and the bar
    // appears to jump straight to 100% at the very end instead of animating.
    if(processed % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
  }
  persistLocal();
  for(const row of touchedUpserts){ await syncWrite('pd_budget', 'upsert', {id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:row.amt}, row.updated_at||null); }
  for(const del of touchedDeletes){ await syncWrite('pd_budget', 'delete', {id:del.id}, del.updated_at); }
  const elapsedSec = ((Date.now()-startTime)/1000).toFixed(1);
  let msg = 'Import complete: '+matched.toLocaleString()+' matched, '+planWritten.toLocaleString()+' month values written';
  msg += '\nTook '+elapsedSec+'s';
  if(unmatched) msg += '\n'+unmatched.toLocaleString()+' row(s) skipped (no matching account)';
  if(mismatches.length){
    const list = mismatches.slice(0,25).map(m=>`${m.name} (${m.acc}) — ${monthLabel(m.month)}: imported ${money(m.imported)}, kept computed ${money(m.computed)}`).join('\n');
    msg += '\n\n⚠ '+mismatches.length+' Provisions-locked cell(s) didn\'t match — kept the computed value:\n'+list+(mismatches.length>25?`\n…and ${mismatches.length-25} more.`:'');
  }
  finishImportProgress(msg);
  renderBudget();
}

/* ============================= PROVISIONS (recurring provision planner) ============================= */
function monthTag(ym){
  const [y,m] = ym.split('-').map(Number);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[m-1]+' - '+String(y).slice(-2)+"'";
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[m-1]+'-'+String(y).slice(-2);
}
function sortedMonthKeys(group){ return Object.keys(group.months||{}).sort(); }
function groupStatus(group){
  const keys = sortedMonthKeys(group);
  for(const k of keys){
    const cell = group.months[k]||{};
    const vals = Object.values(cell).filter(v=>v!==''&&v!==null&&v!==undefined);
    if(!vals.length) continue;
    const sum = vals.reduce((s,v)=>s+Number(v),0);
    if(Math.abs(sum)>0.01) return {ok:false, badMonth:k};
  }
  return {ok:true};
}
function nextProvisionId(){ let m=0; D.provisionGroups.forEach(g=>{ if(g.id>m) m=g.id; }); return m+1; }
function nextLineId(g){ let m=100000; g.lines.forEach(l=>{ if((l.lineId||0)>=m) m=l.lineId+1; }); return m; }
// When the same account appears on 2+ lines within a group (an explicitly supported pattern —
// e.g. one line contributing TO a reserve, another line drawing it back DOWN), the running total
// across every month, across every line-instance of that account, should net to zero eventually.
// Returns [] if balanced, or a list of {acc, total} for each duplicated account that isn't.
function findUnbalancedDuplicateAccounts(g){
  ensureLineIds(g);
  const accCounts = {};
  g.lines.forEach(l=>{ accCounts[l.acc] = (accCounts[l.acc]||0) + 1; });
  const duplicateAccs = Object.keys(accCounts).filter(acc=>accCounts[acc]>1).map(Number);
  const unbalanced = [];
  duplicateAccs.forEach(acc=>{
    const lineIds = g.lines.filter(l=>l.acc===acc).map(l=>l.lineId);
    let total = 0;
    Object.values(g.months||{}).forEach(cell=>{
      lineIds.forEach(lid=>{
        const v = cell[lid];
        if(v!==undefined && v!==null && v!=='') total += Number(v);
      });
    });
    if(Math.abs(total)>=0.005) unbalanced.push({acc, total});
  });
  return unbalanced;
}
function unbalancedDuplicateMessage(unbalanced){
  return unbalanced.map(u=>accShort(u.acc)+' ('+u.acc+'): running total '+money(u.total)+', not zero').join('\n');
}
function ensureLineIds(g){
  // backward compatibility: groups saved before duplicate-account support have no lineId —
  // their account number was already a safe unique key (duplicates weren't possible yet),
  // so falling back to it here needs no migration of the months data at all.
  g.lines.forEach(l=>{ if(l.lineId===undefined || l.lineId===null){ l.lineId = l.acc; } });
}
function findProvisionGroup(id){ const g = D.provisionGroups.find(g=>g.id===id); if(g) ensureLineIds(g); return g; }
async function persistProvisionGroup(g){
  const base = g.updated_at||null;
  persistLocal();
  await syncWrite('pd_provisions', 'upsert', {id:g.id, name:g.name, lines:g.lines, months:g.months, last_bulk_fill_months:g.lastBulkFillMonths||null}, base);
}

function combinedGenerateProvisionJV(){
  const monthKey = provisionsSelectedMonth;
  if(!monthKey){ toast('Pick a month first', true); return; }
  const allUnbalanced = [];
  D.provisionGroups.forEach(g=>{
    const u = findUnbalancedDuplicateAccounts(g);
    if(u.length) allUnbalanced.push({group:g.name, items:u});
  });
  if(allUnbalanced.length){
    const msg = allUnbalanced.map(x=>x.group+':\n'+unbalancedDuplicateMessage(x.items)).join('\n\n');
    toast('Can\'t generate — duplicate-account lines aren\'t balanced yet:\n'+msg, true);
    return;
  }
  const tag = monthTag(monthKey);
  const lines = [];
  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    const cell = g.months[monthKey];
    if(!cell) return;
    g.lines.forEach(line=>{
      const val = cell[line.lineId];
      if(val===undefined||val===null||val==='') return;
      lines.push({key:Math.random().toString(36).slice(2), acc:line.acc, descr: g.name+' - '+tag, amt: Number(val), _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
    });
  });
  if(lines.length<2){ toast('No provision groups have data for '+monthLabel(monthKey), true); return; }
  jvDraft = { date: monthKey+'-01', lines };
  jvReturnScreen = 'provisions';
  go('newjv');
  toast('Generated combined provision JV for '+monthLabel(monthKey)+' from every group with data that month — review and post');
}

      ${selMonth? (hasSelMonth? `<div class="mut" style="font-size:12px;color:var(--green);margin-top:6px">✓ Has data planned for ${esc(monthLabel(selMonth))} — included if you generate the combined JV.</div>` : `<div class="mut" style="font-size:12px;color:var(--red);margin-top:6px">⚠ No data planned for ${esc(monthLabel(selMonth))} — won't be included in the combined JV.</div>`) : ''}

      ${isEditing? renderProvisionGrid(g) : ''}
    </div>`;
  }).join('') || '<div class="empty">No provision groups yet — click "+ New Group" to plan your first one.</div>';
}
function renameProvisionGroup(id, name){

            onfocus="this.value=this.dataset.raw" onblur="setProvisionCell(${g.id},'${k}',${line.lineId},this.value)"

}
function provCellKey(ev, gid, li, mi, monthCount){
  if(ev.key!=='Tab') return;
  const dir = ev.shiftKey ? -1 : 1;
  const targetMi = mi + dir;
  if(targetMi<0 || targetMi>=monthCount) return; // let native Tab move to the next control past the grid
  ev.preventDefault();
  ev.target.blur(); // commits the value and re-renders the grid synchronously (via setProvisionCell)
  const next = document.getElementById('provCell_'+gid+'_'+li+'_'+targetMi); // fresh lookup — the old node no longer exists
  if(next){ next.focus(); next.select(); }
}
function openBulkFillModal(gid, li){
  const g = findProvisionGroup(gid); if(!g) return;
  const line = g.lines[li];
  showModal(`
    <h3>Bulk Fill — ${line.acc} — ${esc(accShort(line.acc))}</h3>
    <label class="fl">Starting Month</label><input id="bfStartMonth" type="month" value="${todayStr().slice(0,7)}" style="margin-bottom:10px">
    <label class="fl">Amount</label><input id="bfAmount" type="text" inputmode="decimal" placeholder="e.g. 3334 or -3334" style="margin-bottom:10px">
    <label class="fl">Number of Months</label><input id="bfMonthCount" type="number" min="1" value="${g.lastBulkFillMonths||6}" style="margin-bottom:14px">
    <div class="mut" style="font-size:11.5px;margin-bottom:14px">Fills this account's row for that many consecutive months starting from the month above, adding any months to the grid that don't already exist. You can still edit individual months afterward for exceptions.</div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="applyBulkFill(${gid},${li})">Fill</button></div>`);
}
function applyBulkFill(gid, li){
  if(blockIfSyncing()) return;
  const g = findProvisionGroup(gid); if(!g) return;
  const line = g.lines[li];
  const startMonth = document.getElementById('bfStartMonth').value;
  const amtRaw = document.getElementById('bfAmount').value;
  const count = parseInt(document.getElementById('bfMonthCount').value,10);
  const amt = Number(String(amtRaw).replace(/,/g,'').trim());
  if(!startMonth || isNaN(amt) || !count || count<1){ toast('Fill in a valid starting month, amount, and number of months', true); return; }
  let [y,m] = startMonth.split('-').map(Number);
  for(let i=0;i<count;i++){
    const key = y+'-'+String(m).padStart(2,'0');
    if(!g.months[key]) g.months[key] = {};
    g.months[key][line.lineId] = amt;
    m++; if(m>12){ m=1; y++; }
  }
  g.lastBulkFillMonths = count;
  persistProvisionGroup(g);
  closeModal();
  renderProvisionGroupsList();
  const unbalanced = findUnbalancedDuplicateAccounts(g);
  if(unbalanced.length){
    toast('Filled '+count+' month(s) — heads up, duplicate-account lines in "'+g.name+'" don\'t net to zero yet:\n'+unbalancedDuplicateMessage(unbalanced), true);
  } else {
    toast('Filled '+count+' month(s) ✓');
  }
}
function openNewProvisionGroup(){
  if(blockIfSyncing()) return;
  const name = prompt('Name this provision group (e.g. "Madinah Home Rent"):');
  if(!name) return;
  const g = {id: nextProvisionId(), name: name.trim(), lines: [], months: {}};
  D.provisionGroups.push(g);
  persistProvisionGroup(g);
  provisionEditingId = g.id;
  renderProvisionGroupsList();
}
async function deleteProvisionGroup(id){
  if(blockIfSyncing()) return;
  if(!confirm('Delete this provision group? This only removes the plan, not any JVs you already posted.')) return;
  const g = findProvisionGroup(id);
  D.provisionGroups = D.provisionGroups.filter(x=>x.id!==id);
  persistLocal(); renderProvisionGroupsList();
  await syncWrite('pd_provisions', 'delete', {id}, g? g.updated_at||null : null);
}
function setProvisionDescrBase(gid, li, val){ if(blockIfSyncing()) return; const g=findProvisionGroup(gid); if(!g) return; g.lines[li].descrBase = val; persistProvisionGroup(g); }
function setProvisionCell(gid, monthKey, lineId, val){
  if(blockIfSyncing()) return;
  const g = findProvisionGroup(gid); if(!g) return;
  const clean = String(val).replace(/,/g,'').trim();
  if(!g.months[monthKey]) g.months[monthKey] = {};
  if(clean===''){ delete g.months[monthKey][lineId]; } else { g.months[monthKey][lineId] = Number(clean); }
  persistProvisionGroup(g);
  renderProvisionGroupsList();
}
function removeProvisionLine(gid, li){ if(blockIfSyncing()) return; const g=findProvisionGroup(gid); if(!g) return; g.lines.splice(li,1); persistProvisionGroup(g); renderProvisionGroupsList(); }
function addProvisionMonth(gid){
  if(blockIfSyncing()) return;
  const g = findProvisionGroup(gid); if(!g) return;
  const ym = document.getElementById('provAddMonth_'+gid).value;
  if(!ym){ toast('Pick a month first', true); return; }
  if(!g.months[ym]) g.months[ym] = {};
  persistProvisionGroup(g);
  renderProvisionGroupsList();
}
let provPicker = {}; // gid -> {matches, hi}
function provAccInput(gid, val){
  const q = val.toLowerCase();
  const matches = postableAccounts().filter(a=> String(a.id).includes(q) || (a.name||'').toLowerCase().includes(q)).slice(0,20);
  provPicker[gid] = {matches, hi:-1};
  renderProvAcDrop(gid, val);
}
function renderProvAcDrop(gid, q){
  const state = provPicker[gid]||{matches:[],hi:-1};
  const el = document.getElementById('provAcdrop_'+gid);
  const html = state.matches.map((a,idx)=>`<div class="${idx===state.hi?'hi':''}" onmousedown="provPickAcc(${gid},${a.id})">${a.id} — ${esc(accShort(a.id))}</div>`).join('') || (q? '<div class="mut">No match</div>' : '');
  el.innerHTML = html;
  el.className = html? 'acdrop show' : 'acdrop';
}
function provAccKey(ev, gid){
  const state = provPicker[gid]||{matches:[],hi:-1};
  const matches = state.matches||[];
  if(ev.key==='ArrowDown'){ if(matches.length){ ev.preventDefault(); state.hi=Math.min(matches.length-1,state.hi+1); provPicker[gid]=state; renderProvAcDrop(gid,''); } }
  else if(ev.key==='ArrowUp'){ if(matches.length){ ev.preventDefault(); state.hi=Math.max(0,state.hi-1); provPicker[gid]=state; renderProvAcDrop(gid,''); } }
  else if(ev.key==='Enter'){ ev.preventDefault(); if(matches.length && state.hi>=0){ provPickAcc(gid, matches[state.hi].id); } }
  else if(ev.key==='Escape'){ provCloseAcDrop(gid); }
}
function provCloseAcDrop(gid){ const el=document.getElementById('provAcdrop_'+gid); if(el){ el.innerHTML=''; el.className='acdrop'; } }
function provPickAcc(gid, accId){
  const g = findProvisionGroup(gid); if(!g) return;
  g.lines.push({acc:accId, descrBase: accShort(accId), lineId: nextLineId(g)});
  persistProvisionGroup(g);
  const inp = document.getElementById('provAddAcc_'+gid); if(inp) inp.value='';
  provPicker[gid] = {matches:[], hi:-1};
  provCloseAcDrop(gid);
  renderProvisionGroupsList();
}
function generateProvisionJV(gid){
  const g = findProvisionGroup(gid); if(!g) return;
  const unbalanced = findUnbalancedDuplicateAccounts(g);
  if(unbalanced.length){ toast('Can\'t generate — duplicate-account lines in "'+g.name+'" don\'t net to zero yet:\n'+unbalancedDuplicateMessage(unbalanced), true); return; }
  const monthKey = document.getElementById('genMonthSel_'+gid).value;
  if(!monthKey){ toast('No month selected', true); return; }
  const cell = g.months[monthKey]||{};
  const lines = g.lines.filter(l=> cell[l.lineId]!==undefined && cell[l.lineId]!==null && cell[l.lineId]!=='').map(l=>({
    key: Math.random().toString(36).slice(2), acc: l.acc, descr: (l.descrBase||accShort(l.acc))+' - '+monthTag(monthKey), amt: cell[l.lineId], _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1
  }));
  if(lines.length<2){ toast('This month needs at least two lines with amounts entered', true); return; }
  jvDraft = { date: monthKey+'-01', lines };
  jvReturnScreen = 'provisions';
  go('newjv');
  toast('Prefilled '+monthLabel(monthKey)+' provision JV for "'+g.name+'" — review and post');
}

/* ============================= JAMIAH (rotating group savings) ============================= */
// A Jamiah is a classic ROSCA: a fixed set of participants organized into groups, one group
// receiving the full pot each round while everyone keeps contributing every round. Contributions
// are tracked per-person by tagging real ledger transactions (in one chosen account) to whichever
// participant they belong to — nothing here posts or edits ledger data, it only tags it.
let jamiahDetailId = null;
let jamiahSetupExpanded = false;
function nextJamiahId(){ let m=0; D.jamiahs.forEach(j=>{ if(j.id>m) m=j.id; }); return m+1; }
function findJamiah(id){ return D.jamiahs.find(j=>j.id===id); }
function nextJamiahGroupId(j){ let m=0; j.groups.forEach(g=>{ if(g.id>m) m=g.id; }); return m+1; }
function nextJamiahParticipantId(j){ let m=0; j.participants.forEach(p=>{ if(p.id>m) m=p.id; }); return m+1; }
async function persistJamiah(j){
  const base = j.updated_at||null;
  persistLocal();
  await syncWrite('pd_jamiahs', 'upsert', {id:j.id, name:j.name, account:j.account, start_month:j.startMonth, duration_months:j.durationMonths, groups:j.groups, participants:j.participants, round_group:j.roundGroup, tags:j.tags}, base);
}
function jamiahRounds(j){
  const rounds = [];
  if(!j.startMonth) return rounds;
  let [y,m] = j.startMonth.split('-').map(Number);
  for(let i=0;i<(j.durationMonths||0);i++){
    rounds.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return rounds;
}
function renderJamiahPage(){
  if(jamiahDetailId && findJamiah(jamiahDetailId)){ renderJamiahDetail(jamiahDetailId); return; }
  jamiahDetailId = null;
  document.getElementById('app').innerHTML = `
    <div class="panel noprint row" style="justify-content:space-between">
      <div class="mut" style="font-size:12.5px">Track a rotating Jamiah — who's in each group, whose turn it is to receive the pot, and who's paid in each round.</div>
      <button class="btn pri" onclick="openNewJamiah()">+ New Jamiah</button>
    </div>
    <div>${D.jamiahs.map(j=>{
      const rounds = jamiahRounds(j);
      return `<div class="panel click" onclick="openJamiahDetail(${j.id})">
        <div class="row" style="justify-content:space-between">
          <h3 style="margin:0">${esc(j.name)}</h3>
          <div class="mut" style="font-size:12px">${j.participants.length} participant${j.participants.length===1?'':'s'} · ${rounds.length} round${rounds.length===1?'':'s'} · starts ${j.startMonth?esc(monthLabel(j.startMonth)):'—'}</div>
        </div>
      </div>`;
    }).join('') || '<div class="panel empty">No Jamiah set up yet — click "+ New Jamiah" to start.</div>'}</div>`;
}
function openNewJamiah(){
  if(blockIfSyncing()) return;
  const name = prompt('Name this Jamiah (e.g. "Family Jamiah 2026"):');
  if(!name) return;
  const j = { id: nextJamiahId(), name: name.trim(), account: null, startMonth: todayStr().slice(0,7), durationMonths: 6, groups: [], participants: [], roundGroup: {}, tags: {} };
  D.jamiahs.push(j);
  persistJamiah(j);
  jamiahDetailId = j.id;
  renderJamiahPage();
}
function openJamiahDetail(id){ jamiahDetailId = id; renderJamiahPage(); }
function closeJamiahDetail(){ jamiahDetailId = null; renderJamiahPage(); }
async function deleteJamiah(id){
  if(blockIfSyncing()) return;
  if(!confirm('Delete this Jamiah? This only removes the tracking setup — it does not touch any ledger transactions.')) return;
  const j = findJamiah(id);
  D.jamiahs = D.jamiahs.filter(x=>x.id!==id);
  persistLocal();
  await syncWrite('pd_jamiahs', 'delete', {id}, j? j.updated_at||null : null);
  jamiahDetailId = null;
  renderJamiahPage();
}
function duplicateJamiah(id){
  if(blockIfSyncing()) return;
  const src = findJamiah(id); if(!src) return;
  const name = prompt('Name for the duplicated Jamiah:', src.name+' (Copy)');
  if(!name) return;
  const copy = {
    id: nextJamiahId(), name: name.trim(), account: src.account, startMonth: src.startMonth, durationMonths: src.durationMonths,
    groups: src.groups.map(g=>({...g})),
    participants: src.participants.map(p=>({...p})),
    roundGroup: {...src.roundGroup},
    tags: {}, // deliberately not copied — the source's tags point at specific already-posted transactions;
              // carrying them over would count the same real payment as paid in two Jamiahs at once
  };
  D.jamiahs.push(copy);
  persistJamiah(copy);
  jamiahDetailId = copy.id;
  renderJamiahPage();
  toast('Duplicated as "'+copy.name+'" — groups, participants, pledges and the round schedule all carried over. Transaction tags start fresh.');
}

      ${jamiahSetupExpanded ? `
      <div class="section-h">Groups</div>

      <table><thead><tr><th>Group</th><th class="num">Participants</th><th class="num">Total Pledge / Round</th><th></th></tr></thead>
      <tbody>${j.groups.map(g=>{

        return `<tr><td><input value="${esc(g.name)}" onchange="renameJamiahGroup(${j.id},${g.id},this.value)" style="font-size:13px"></td><td class="num">${members.length}</td><td class="num mono">${money(total)}</td><td><button class="x" onclick="deleteJamiahGroup(${j.id},${g.id})">✕</button></td></tr>`;
      }).join('') || '<tr><td colspan="4" class="empty">No groups yet</td></tr>'}</tbody></table>

      <div class="section-h">Participants</div>
      <table><thead><tr><th>Name</th><th>Group</th><th class="num">Pledge / Round</th><th></th></tr></thead>
      <tbody>${j.participants.map(p=>{
        const groupOptions = j.groups.map(g=>`<option value="${g.id}" ${p.groupId===g.id?'selected':''}>${esc(g.name)}</option>`).join('');
        return `<tr>

          <td class="num"><input type="text" inputmode="decimal" class="num" value="${fmt2(p.pledgeAmount)}" onfocus="this.value=jamiahParticipantRaw(${j.id},${p.id})" onblur="updateJamiahParticipantAmt(${j.id},${p.id},this)" style="width:100px"></td>
          <td><button class="x" onclick="deleteJamiahParticipant(${j.id},${p.id})">✕</button></td>
        </tr>`;
      }).join('') || '<tr><td colspan="4" class="empty">No participants yet</td></tr>'}</tbody></table>
      <div class="row" style="margin-top:10px"><input id="newPartName_${j.id}" placeholder="Participant name" onkeydown="if(event.key==='Enter') addJamiahParticipant(${j.id})"><button class="btn ghost sm" onclick="addJamiahParticipant(${j.id})">+ Add Participant</button></div>

      <div class="section-h">Rounds — who receives the pot</div>

      <table><thead><tr><th>Round</th><th>Receiving Group</th></tr></thead>

      ` : ''}
    </div>
  `;
}
function toggleJamiahSetup(){ jamiahSetupExpanded = !jamiahSetupExpanded; renderJamiahDetail(jamiahDetailId); }
function setJamiahField(id, field, val){
  if(blockIfSyncing()) return;
  const j = findJamiah(id); if(!j) return;
  j[field] = val;
  persistJamiah(j);
  renderJamiahDetail(id);
}
function addJamiahGroup(id){
  if(blockIfSyncing()) return;
  const j = findJamiah(id); if(!j) return;
  const gid = nextJamiahGroupId(j);
  j.groups.push({id:gid, name:'Group '+gid});
  persistJamiah(j);

const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_MONTHS_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// ===== Arabic Settlement Statement — translation engine =====
// Layer 3 fallback: a free, keyless, CORS-friendly translation API. Quality is decent but not
// great — every AI-sourced line is flagged for review in the statement UI, never sent silently.
async function aiTranslateToArabic(text){
  try{
    const res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|ar');
    if(!res.ok) return null;
    const data = await res.json();
    return data?.responseData?.translatedText || null;
  }catch(e){ return null; }
}
// Applies your saved name spellings (Settings → Name Translations) as a find-and-replace pass,
// so names come out correctly regardless of which layer translated the surrounding sentence.
function applyNameTranslations(text){
  let result = text;
  Object.entries(D.nameTranslations||{}).forEach(([en,ar])=>{
    if(!en || !ar) return;
    const re = new RegExp('\\b'+en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    result = result.replace(re, ar);
  });
  return result;
}
// Strips a trailing month-tag (e.g. "- Jul 26'" or "- Jul - 26'") off a description, translating
// it separately with Arabic month names, so the pattern/learned-dictionary lookups below match
// against the stable base text regardless of which month it happened to be posted in.
function splitDescrMonthTag(descr){
  const m = String(descr).match(/\s*-\s*([A-Za-z]{3})\s*-?\s*(\d{2})'?\s*$/);
  if(!m) return {base: descr, arTag: ''};
  const idx = AR_MONTHS_ABBR.findIndex(mo=>mo.toLowerCase()===m[1].toLowerCase());
  if(idx<0) return {base: descr, arTag: ''};
  return {base: descr.slice(0, m.index).trim(), arTag: ' - '+AR_MONTHS[idx]+' '+m[2]};
}
// Layer 2: a small set of common recurring transaction phrasings, seeded from real usage. $1/$2
// are the captured English fragments (typically names), fixed up afterward by applyNameTranslations.
const ITEM_WORD_AR = {phone:'هاتف', laptop:'لابتوب', device:'جهاز'};
const DESCR_PATTERNS = [
  {re:/^incoming transfer from (.+) for (.+)$/i, ar:'تحويل وارد من $1 مقابل $2'},
  {re:/^incoming transfer from (.+) from (.+)$/i, ar:'تحويل وارد من $1 من $2'},
  {re:/^incoming transfer from (.+)$/i, ar:'تحويل وارد من $1'},
  {re:/^additional transfer to (.+)$/i, ar:'تحويل إضافي إلى $1'},
  {re:/^transfer to (.+) for (.+)$/i, ar:'تحويل إلى $1 مقابل $2'},
  {re:/^transfer to (.+) as per (.+) for (.+)$/i, ar:'تحويل إلى $1 حسب طلب $2 مقابل $3'},
  {re:/^transfer to (.+)$/i, ar:'تحويل إلى $1'},
  {re:/^(.+) monthly gift$/i, ar:'هدية شهرية من $1'},
  {re:/^(.+) amount from (.+?)(?:\s+for)?$/i, ar:'مبلغ $1 من $2'},
  {re:/^(.+) rest of (.+)$/i, ar:'باقي $2 من $1'},
  {re:/^(.+) new (phone|laptop|device) \+ shipping$/i, ar:'$2 جديد لـ $1 + الشحن', wordMap:{2:'item'}},
  {re:/^(.+) new (phone|laptop|device)$/i, ar:'$2 جديد لـ $1', wordMap:{2:'item'}},
];
// Full translation pipeline for one description: learned dictionary -> pattern rules -> AI fallback.
// Synchronous where possible; only calls the network if genuinely nothing else matched.
async function translateDescriptionToArabic(descr){
  const {base, arTag} = splitDescrMonthTag(descr||'');
  const normalized = base.trim().toLowerCase();
  if(!normalized) return {text:'', source:'empty'};
  if(D.descrTranslations[normalized]){
    return {text: applyNameTranslations(D.descrTranslations[normalized])+arTag, source:'learned'};
  }
  for(const pat of DESCR_PATTERNS){
    const m = base.match(pat.re);
    if(m){
      let result = pat.ar;
      for(let i=1;i<m.length;i++){
        let piece = m[i]||'';
        if(pat.wordMap && pat.wordMap[i]==='item') piece = ITEM_WORD_AR[piece.toLowerCase()] || piece;
        result = result.split('$'+i).join(piece);
      }
      return {text: applyNameTranslations(result)+arTag, source:'pattern'};
    }
  }
  const ai = await aiTranslateToArabic(base);
  if(ai) return {text: applyNameTranslations(ai)+arTag, source:'ai'};
  return {text: base+arTag, source:'failed'}; // couldn't translate at all — show original, let the person fix it manually
}
// Called when the person edits an AI-translated (or failed) line in the statement review screen
// and confirms it — grows the learned dictionary so the same phrase doesn't need AI help again.
async function learnDescrTranslation(originalDescr, correctedArabicFull){
  const {base, arTag} = splitDescrMonthTag(originalDescr||'');
  const normalized = base.trim().toLowerCase();
  if(!normalized) return;
  // Strip the (already-appended) Arabic month tag back off before storing, so the dictionary
  // entry generalizes across months rather than being locked to this one specific month.
  let toStore = correctedArabicFull;
  if(arTag && toStore.endsWith(arTag)) toStore = toStore.slice(0, -arTag.length).trim();
  D.descrTranslations[normalized] = toStore;
  persistLocal();
  await syncWrite('pd_descr_translations', 'upsert', {id:1, translations:D.descrTranslations}, null);
}

let settlementDraft = null;
async function openSettlementStatement(acc){
  // Deliberately re-queries D.ledger directly (not the page's own filtered unallocItems()) so the
  // statement is always complete, regardless of any search/account filter currently active on the
  // Allocations page itself.
  const lines = D.ledger.filter(l=>l.acc===acc && !l.alloc).sort((a,b)=>(a.date||'').localeCompare(b.date||'') || a.id-b.id);
  if(!lines.length){ toast('No unallocated transactions for this account', true); return; }
  showModal(`<h3>📄 Generating Arabic statement…</h3><div class="mut" style="margin:16px 0">Translating ${lines.length} line(s) — this can take a few seconds for anything the saved phrases and pattern rules don't already cover.</div>`, true);
  const translated = await Promise.all(lines.map(async l=>{
    const r = await translateDescriptionToArabic(l.descr);
    return {id:l.id, date:l.date, amt:Number(l.amt), original:l.descr, arText:r.text, source:r.source};
  }));
  settlementDraft = {acc, lines: translated};
  renderSettlementStatement();
}

          ${l.source==='failed'? '<div class="mut noprint" style="font-size:10px;color:var(--red)">⚠ تعذّرت الترجمة — يرجى التعديل يدويًا</div>' : ''}
        </td>

    <div class="row noprint" style="justify-content:flex-end;margin-top:14px"><button class="btn pri" onclick="closeModal()">تم — Done</button></div>

async function editSettlementLine(i, newVal){
  const d = settlementDraft;
  if(!d || !d.lines[i]) return;
  const line = d.lines[i];
  const changed = newVal !== line.arText;
  line.arText = newVal;
  if(changed && (line.source==='ai' || line.source==='failed')){
    await learnDescrTranslation(line.original, newVal);
    line.source = 'learned';
    toast('Correction saved for next time ✓');
  }
}
function monthLabelAr(ym){ const [y,m] = ym.split('-').map(Number); return AR_MONTHS[m-1]+' '+y; }
const JAMIAH_AR = {
  title: 'الملخص — من دفع ومن لم يدفع بعد',
  note: 'المبلغ المستحق يُحسب حتى الشهر الحالي فقط. يتم تمييز صف المشاركين الذين ستذهب لهم الدفعة هذا الشهر، وكذلك عمود الشهر الحالي.',
  participant: 'المشارك', group: 'المجموعة', amountDue: 'المبلغ المستحق', amountPaid: 'المبلغ المدفوع',
  total: 'الإجمالي', pendingLabel: 'المتبقي', paidBadge: '✓ مدفوع', pendingCell: 'معلّق', ofWord: 'من', none: '—', arrow: '→',
};
function renderJamiahSummary(j){
  const rounds = jamiahRounds(j);
  if(!rounds.length || !j.participants.length) return '';
  const currentMonth = todayStr().slice(0,7);
  const elapsedRounds = rounds.filter(m=>m<=currentMonth);
  const isCurrentMonthInRange = rounds.includes(currentMonth);
  const paidByPart = {}; // lifetime total paid per participant (all rounds)
  Object.entries(j.tags).forEach(([lineId, pid])=>{
    const line = D.ledger.find(l=>l.id===Number(lineId));
    if(!line) return;
    paidByPart[pid] = (paidByPart[pid]||0) + Math.abs(Number(line.amt));
  });
  const paidByPartRound = jamiahPaidByPartRound(j); // paid per participant per round (for the ✓/pending cells)
  const groupsById = {}; j.groups.forEach(g=>groupsById[g.id]=g);
  const currentGroupId = j.roundGroup[currentMonth]||null;

  const sortedParticipants = j.participants.slice().sort((a,b)=>{
    const ga = j.groups.findIndex(g=>g.id===a.groupId), gb = j.groups.findIndex(g=>g.id===b.groupId);
    return (ga<0?9999:ga) - (gb<0?9999:gb);
  });

  let totalDue=0, totalPaid=0;
  const rows = sortedParticipants.map(p=>{
    const due = elapsedRounds.length * Number(p.pledgeAmount||0);
    const paid = paidByPart[p.id]||0;
    totalDue += due; totalPaid += paid;
    const curPaid = paidByPartRound[p.id+'_'+currentMonth]||0;
    const curOk = curPaid >= Number(p.pledgeAmount||0) - 0.005;
    return {p, due, paid, isCurrentGroup: !!(p.groupId && p.groupId===currentGroupId), curOk};
  });

  const ar = jamiahSummaryLang==='ar';
  const t = ar ? JAMIAH_AR : {
    title: "Summary — who's paid, who's pending",
    note: "Amount Due counts pledges through the current month only. Rows for whoever's group is due to receive this month's pot are highlighted, as is this month's column. This month's name shows green once paid, red while still pending.",
    participant:'Participant', group:'Group', amountDue:'Amount Due', amountPaid:'Amount Paid',
    total:'Total', pendingLabel:'Pending', paidBadge:'✓ Paid', pendingCell:'Pending', ofWord:'of', none:'—', arrow:'→',
  };
  const mLabel = m => ar? monthLabelAr(m) : monthLabel(m);

  return `<div class="panel" style="overflow-x:auto">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h3 style="margin:0">${t.title}</h3>
      <button class="btn ghost sm noprint" onclick="toggleJamiahLang()">${ar? 'English View' : '🌐 Arabic View'}</button>
    </div>
    <div class="mut" style="font-size:11.5px;margin:8px 0">${t.note}</div>
    <table style="min-width:700px" ${ar? 'dir="rtl"':''}>
      <thead><tr><th>${t.participant}</th><th class="num">${t.amountDue}</th><th class="num">${t.amountPaid}</th><th>${t.group}</th>${rounds.map(m=>`<th class="num" style="${m===currentMonth?'background:var(--chip);border-bottom:2px solid var(--accent)':''}">${esc(mLabel(m))}${j.roundGroup[m]?`<div class="mut" style="font-size:10px;font-weight:400">${t.arrow} ${esc(groupsById[j.roundGroup[m]]?.name||'')}</div>`:''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(({p,due,paid,isCurrentGroup,curOk})=>{
        const nameColor = isCurrentMonthInRange? (curOk? 'color:var(--green)' : 'color:var(--red)') : '';
        return `<tr ${isCurrentGroup?'style="background:var(--chip)"':''}>
        <td style="${nameColor};font-weight:${isCurrentMonthInRange?'600':'400'}">${esc(p.name)}</td>
        <td class="num mono">${money(due)}</td>
        <td class="num mono">${money(paid)}</td>
        <td class="mut">${esc(groupsById[p.groupId]?.name||t.none)}</td>
        ${rounds.map(m=>{
          const paidR = paidByPartRound[p.id+'_'+m]||0;
          const ok = paidR >= Number(p.pledgeAmount||0) - 0.005;
          const isFuture = m>currentMonth;
          const cellBg = m===currentMonth? 'background:var(--chip)' : '';
          let content;
          if(ok) content = `<span class="badge pos">${t.paidBadge}</span>`;
          else if(paidR>0) content = `<span class="badge neg">${money(paidR)} ${t.ofWord} ${money(p.pledgeAmount)}</span>`;
          else if(isFuture) content = `<span class="mut">${t.none}</span>`;
          else content = `<span class="badge warn">! ${t.pendingCell}</span>`;
          return `<td class="num" style="text-align:center;${cellBg}">${content}</td>`;
        }).join('')}
      </tr>`;
      }).join('')}</tbody>
      <tfoot><tr style="font-weight:700">
        <td>${t.total}</td>
        <td class="num mono">${money(totalDue)}</td>
        <td class="num mono">${money(totalPaid)}</td>
        <td></td>
        <td class="num mono ${moneyClass(totalDue-totalPaid)}" colspan="${rounds.length}">${t.pendingLabel}: ${money(totalDue-totalPaid)}</td>
      </tr></tfoot>
    </table>
  </div>`;
}

// ===== Section-order drag reordering — Pointer Events (unlike native HTML5 drag-and-drop,
// Pointer Events work reliably on iOS/Android touch, which is why this replaces Move Up/Down
// without reintroducing the mobile-reliability problem that motivated those buttons originally) =====
let sectionDrag = null;
function startSectionDrag(e){
  e.preventDefault();
  const item = e.currentTarget.closest('.section-order-item');
  const list = document.getElementById('forecastSectionOrderList');
  if(!item || !list) return;
  sectionDrag = {item, list, startY: e.clientY};
  item.style.position = 'relative';
  item.style.zIndex = '10';
  item.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
  if(item.setPointerCapture) item.setPointerCapture(e.pointerId);
  document.addEventListener('pointermove', onSectionDragMove);
  document.addEventListener('pointerup', onSectionDragEnd, {once:true});
}
function onSectionDragMove(e){
  if(!sectionDrag) return;
  const dy = e.clientY - sectionDrag.startY;
  sectionDrag.item.style.transform = `translateY(${dy}px)`;
  const siblings = Array.from(sectionDrag.list.children).filter(el=>el!==sectionDrag.item);
  const draggedRect = sectionDrag.item.getBoundingClientRect();
  const draggedMid = draggedRect.top + draggedRect.height/2;
  for(const sib of siblings){
    const r = sib.getBoundingClientRect();
    const mid = r.top + r.height/2;
    if(draggedMid < mid && sib.previousElementSibling !== sectionDrag.item){
      sectionDrag.list.insertBefore(sectionDrag.item, sib);
      break;
    } else if(draggedMid > mid && sib===siblings[siblings.length-1] && sib.nextElementSibling !== sectionDrag.item){
      sectionDrag.list.insertBefore(sectionDrag.item, sib.nextSibling);
      break;
    }
  }
}
function onSectionDragEnd(){
  if(!sectionDrag) return;
  document.removeEventListener('pointermove', onSectionDragMove);
  sectionDrag.item.style.transform = '';
  sectionDrag.item.style.position = '';
  sectionDrag.item.style.zIndex = '';
  sectionDrag.item.style.boxShadow = '';
  const newOrder = Array.from(sectionDrag.list.children).map(el=>el.dataset.key);
  setForecastSectionOrderList(newOrder);
  sectionDrag = null;
}

// Flat cash-flow model for the Forecast page's top summary panel — Starting Balance + all green
// (inflow) categories + all red (outflow) categories = Closing Balance, matching the workbook's
// "Cash & Banks" layout exactly. Category assignment (green vs red) is fixed regardless of a given
// month's actual sign.
// Every table on the Forecast page (Cash Flow panel + every category section) uses these exact
// same column widths with table-layout:fixed, regardless of collapse state or cell content type
// (input box vs. plain read-only text) — that consistency is what keeps every month column
// aligned across all of them, since browsers otherwise auto-size each table's columns independently.
const FORECAST_ACCOUNT_COL_WIDTH = 200;
const FORECAST_BALANCE_COL_WIDTH = 110;
const FORECAST_LABEL_COL_WIDTH = FORECAST_ACCOUNT_COL_WIDTH + FORECAST_BALANCE_COL_WIDTH; // the Cash Flow panel's single label column matches this combined width exactly
const FORECAST_MONTH_COL_WIDTH = 110;
const FORECAST_INFLOW_CATS  = ['income','invest_income_st','invest_income_lt','asset_st','asset_lt'];
const FORECAST_OUTFLOW_CATS = ['expense','invest_expense_st','invest_expense_lt','liability_st','liability_lt','provision','accrual'];
// Per-category display sign flip for the Cash Position panel — a local display preference (not
// synced), configured in Forecast Settings. Deliberately flows through into every downstream total
// (Total Inflows/Outflows, Cash Change, Closing Balance) per explicit instruction — so when any
// flip is active, Closing Balance may no longer equal your real bank balance, by design.
function getForecastSignFlips(){
  try{ const v = JSON.parse(localStorage.getItem('forecastSignFlips')||'{}'); return (v && typeof v==='object')? v : {}; }catch(e){ return {}; }
}
function setForecastSignFlip(catKey, flipped){
  const flips = getForecastSignFlips();
  if(flipped) flips[catKey] = true; else delete flips[catKey];
  localStorage.setItem('forecastSignFlips', JSON.stringify(flips));
}
function categorySignMultiplier(catKey){ return getForecastSignFlips()[catKey] ? -1 : 1; }
function anyForecastSignFlipActive(){ return Object.keys(getForecastSignFlips()).length>0; }
function renderForecastSignFlipList(){
  const flips = getForecastSignFlips();
  const cats = [...FORECAST_INFLOW_CATS, ...FORECAST_OUTFLOW_CATS];
  return cats.map(key=>`
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;cursor:pointer">
      <input type="checkbox" class="chk" ${flips[key]?'checked':''} onchange="setForecastSignFlip('${key}', this.checked); renderForecastSettingsPage()"> ${esc(FORECAST_CATEGORIES[key].label)} ${flips[key]?'<span class="badge neg">reversed</span>':''}
    </label>`).join('');
}
function bankBalanceAsOf(asOfDate){
  const ids = new Set(D.accounts.filter(a=>a.category==='Bank Accounts' && a.id!==10199).map(a=>a.id));
  return sumAcc(l=>ids.has(l.acc), undefined, asOfDate);
}
function forecastCategoryAccounts(catKey){
  return forecastableAccounts().filter(a=>getForecastCategory(a)===catKey);
}
// This month's plan-or-actual flow for every account tagged with this forecast category — same
// plan/actual fallback used everywhere else on the Forecast page. Sign-flip applies to the WHOLE
// row (historical, current month, and future) uniformly, per explicit instruction — not just the
// future portion.
function categoryMonthFlow(catKey, monthKey, currentMonth){
  let sum = 0;
  forecastCategoryAccounts(catKey).forEach(a=>{
    // Inactive accounts are hidden from the Forecast page and don't contribute to current/future
    // totals — but their real historical activity (before they went inactive) stays counted in
    // past totals for accuracy.
    if(monthKey>=currentMonth && a.status==='Inactive') return;
    const c = computeForecastCell(a, monthKey, currentMonth);
    const val = c.plan!==null? c.plan : (monthKey<currentMonth? c.actual : 0);
    sum += Number(val)||0;
  });
  return sum * categorySignMultiplier(catKey);
}
function earliestLedgerMonth(){
  if(!D.ledger.length) return todayStr().slice(0,7);
  return D.ledger.reduce((min,l)=> l.date<min?l.date:min, todayStr()).slice(0,7);
}
// Closing Balance = Starting + Inflow + Outflow, chained uniformly from the earliest real ledger
// month all the way through whichever month is needed — for EVERY month, not just future ones
// (Option B, chosen explicitly: simpler, but means a category's sign flip now visibly affects
// every column including historical/current, and if your categorization has any gaps, Closing
// Balance can differ slightly from your real bank balance even with no flips active — see the
// month-by-month discrepancy row on the panel itself).
function computeMonthlyCashFlowPure(months, currentMonth){
  const anchorMonth = earliestLedgerMonth();
  const trueAnchorBalance = 0; // nothing predates the earliest-ever ledger entry, by definition
  const chain = {};
  function computeMonth(monthKey, priorClosing){
    const subrows = {};
    [...FORECAST_INFLOW_CATS, ...FORECAST_OUTFLOW_CATS].forEach(c=>{ subrows[c] = categoryMonthFlow(c, monthKey, currentMonth); });
    const inflow = FORECAST_INFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const outflow = FORECAST_OUTFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const starting = priorClosing;
    const change = inflow+outflow;
    return {starting, inflow, outflow, change, closing: starting+change, subrows};
  }
  chain[anchorMonth] = computeMonth(anchorMonth, trueAnchorBalance);
  const maxNeeded = months.filter(m=>m>anchorMonth).sort().pop();
  if(maxNeeded){
    let mk = anchorMonth, guard = 0;
    while(mk < maxNeeded && guard<1200){
      const nextMk = nextMonthKeyPlain(mk);
      chain[nextMk] = computeMonth(nextMk, chain[mk].closing);
      mk = nextMk; guard++;
    }
  }
  return months.map(m=>{
    if(chain[m]) return {month:m, ...chain[m]};
    // a requested month before any real ledger history exists — nothing to show
    return {month:m, starting:0, inflow:0, outflow:0, change:0, closing:0, subrows:Object.fromEntries([...FORECAST_INFLOW_CATS,...FORECAST_OUTFLOW_CATS].map(c=>[c,0]))};
  });
}
// Toggle: re-anchors the current month's Starting Balance to your real ledger balance (as of the
// end of last month), then re-chains current + every future month forward from that real number —
// so future projections build on solid ground even if older historical months have categorization
// gaps. Past months are always left exactly as the pure chain shows them, untouched, so you can
// still see and diagnose where discrepancies originate. Default ON.
function getCashPositionAnchorToActual(){
  const v = localStorage.getItem('cashPositionAnchorToActual');
  return v===null ? true : v==='true';
}
function setCashPositionAnchorToActual(v){
  localStorage.setItem('cashPositionAnchorToActual', v?'true':'false');
}
function computeMonthlyCashFlow(months, currentMonth){
  const pureRows = computeMonthlyCashFlowPure(months, currentMonth);
  if(!getCashPositionAnchorToActual()) return pureRows;
  const realAnchor = bankBalanceAsOf(monthRange(prevMonthKey(currentMonth))[1]);
  const anchoredChain = {};
  function anchoredMonth(monthKey, priorClosing){
    const subrows = {};
    [...FORECAST_INFLOW_CATS, ...FORECAST_OUTFLOW_CATS].forEach(c=>{ subrows[c] = categoryMonthFlow(c, monthKey, currentMonth); });
    const inflow = FORECAST_INFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const outflow = FORECAST_OUTFLOW_CATS.reduce((s,c)=>s+subrows[c],0);
    const change = inflow+outflow;
    return {starting:priorClosing, inflow, outflow, change, closing:priorClosing+change, subrows};
  }
  anchoredChain[currentMonth] = anchoredMonth(currentMonth, realAnchor);
  const maxNeeded = months.filter(m=>m>currentMonth).sort().pop();
  if(maxNeeded){
    let mk = currentMonth, guard=0;
    while(mk < maxNeeded && guard<1200){
      const nextMk = nextMonthKeyPlain(mk);
      anchoredChain[nextMk] = anchoredMonth(nextMk, anchoredChain[mk].closing);
      mk = nextMk; guard++;
    }
  }
  return months.map((m,i) => {
    if(m < currentMonth) return pureRows[i]; // past stays exactly as the pure chain shows it
    return {month:m, ...anchoredChain[m]};
  });
}
// Month-by-month gap between the PURE chain's computed Closing Balance and your real bank balance
// as of that same point — always based on the pure (unanchored) chain regardless of the toggle
// above, so it stays a meaningful diagnostic tool either way. Only meaningful for past/current
// months (future months have no real balance yet to compare against).
function computeCashPositionDiscrepancies(months, currentMonth){
  const pureRows = computeMonthlyCashFlowPure(months, currentMonth);
  return months.map((m,i)=>{
    if(m>currentMonth) return null;
    const asOf = m===currentMonth? todayStr() : monthRange(m)[1];
    return pureRows[i].closing - bankBalanceAsOf(asOf);
  });
}

      : 'Every month here is Starting + Inflows + Outflows, chained from your earliest ledger activity, with no correction for any historical gaps.'}

function renderForecastCell(a, m, currentMonth){
  const c = computeForecastCell(a, m, currentMonth);
  const isInactive = a.status==='Inactive';
  const cellBg = m===currentMonth? 'background:var(--chip)' : '';
  const title = isInactive? 'Account is inactive — no forecast input possible' : 'Plan: '+(c.plan!==null?money(c.plan):'—')+' | Actual: '+money(c.actual)+(c.variance!==null?' | Variance: '+money(c.variance):'');
  if(isInactive){
    return `<td class="num mut" style="${cellBg};opacity:0.45" title="${esc(title)}">${c.plan!==null?money(c.plan):'—'}</td>`;
  }
  if(c.editable){
    const raw = (c.plan!==null && c.plan!==undefined)? c.plan : '';
    return `<td class="num" style="${cellBg}" title="${esc(title)}"><input type="text" inputmode="decimal" class="num" style="width:100px" value="${raw!==''?fmt2(raw):''}" placeholder="—" data-raw="${raw}"
      onfocus="this.value=this.dataset.raw" onblur="setManualPlan(${a.id},'${m}',this.value)"></td>`;
  }
  let badge = c.conflict? ` <span class="badge neg click" title="Provisions and Budget disagree — click to open the provision group" onclick="openProvisionSourceFor(${a.id},'${m}')">⚠</span>` : '';
  let provTag = (c.source==='provisions')? ` <span class="badge pos click" title="Sourced from Provisions — click to open" onclick="openProvisionSourceFor(${a.id},'${m}')">P</span>` : '';
  let budgetTag = (c.source==='budget'||c.source==='budget-empty')? ` <span class="badge click" style="background:rgba(154,107,31,0.18);color:var(--accent)" title="${c.source==='budget'?'Sourced from Budget':'No Budget entry yet'} — click to edit on the Budget page" onclick="jumpToBudgetPage(${a.id},'${m}')">B</span>` : '';
  let eventsTitle = title;
  let eventBg = '';
  let eventTag = '';
  if(c.events && c.events.length){
    eventsTitle += ' | Events: ' + c.events.map(e=>e.description+' ('+money(e.amount)+')').join('; ');
    eventBg = 'background:rgba(70,110,200,0.12);'; // distinct blue tint — this cell is locked because it's linked to a Long Term Event, not Provisions/Budget/autoclear
    eventTag = ` <span class="badge click" style="background:rgba(70,110,200,0.18);color:#3a5fb0" title="Linked to a Long Term Event — edit it there, not here" onclick="jumpToForecastEvents()">📅</span>`;
  }
  return `<td class="num mono" style="${cellBg}${eventBg}" title="${esc(eventsTitle)}">${c.plan!==null?money(c.plan):'<span class="mut">—</span>'}${badge}${provTag}${budgetTag}${eventTag}</td>`;
}
function getForecastSectionOrder(){
  const allKeys = Object.keys(FORECAST_CATEGORIES).filter(k=>k!=='ignore');

    const saved = JSON.parse(localStorage.getItem('forecastSectionOrder')||'[]');
    const merged = saved.filter(k=>allKeys.includes(k));
    allKeys.forEach(k=>{ if(!merged.includes(k)) merged.push(k); });

  }catch(e){ return allKeys; }
}

// Keeps every horizontally-scrollable table on the Forecast page (Cash Position + each category
// section) locked to the same scroll position, so columns for the same month always line up
// visually across the whole page, no matter which panel you actually grab to scroll.
function syncForecastScrollContainers(){
  const body = document.getElementById('forecastBody');
  if(!body) return;
  const containers = Array.from(body.querySelectorAll('.panel')).filter(p=>p.style.overflowX==='auto');
  let syncing = false;
  containers.forEach(c=>{
    c.addEventListener('scroll', ()=>{
      if(syncing) return;
      syncing = true;
      containers.forEach(other=>{ if(other!==c) other.scrollLeft = c.scrollLeft; });
      syncing = false;
    });
  });
}

  syncForecastScrollContainers();
}

function createBalancingJV(acc){
  const accSelected = [...allocSelected].filter(id=>{ const l=D.ledger.find(x=>x.id===id); return l && l.acc===acc; });
  const selSum = accSelected.reduce((s,id)=>{ const l=D.ledger.find(x=>x.id===id); return s+(l?Number(l.amt):0); },0);
  const needed = Math.round(-selSum*100)/100;
  resetJVDraft();
  jvDraft.lines[0].acc = acc;
  jvDraft.lines[0].amt = needed;
  jvDraft.lines[0].descr = 'Balance allocation for '+accShort(acc);
  reconcileAcc = null;
  jvReturnScreen = 'alloc';
  go('newjv');
  toast('Prefilled a line for '+accShort(acc)+' ('+money(needed)+') to balance your selection — add the offsetting account and post');
}
function selectAllForAccount(acc){
  const items = unallocItems().filter(l=>l.acc===acc);
  const allSelected = items.length>0 && items.every(l=>allocSelected.has(l.id));
  if(allSelected){
    items.forEach(l=>allocSelected.delete(l.id));
  } else {
    // selecting a different account's lines clears any other account's existing selection, same rule as single-line toggling
    const firstId = [...allocSelected][0];
    if(firstId!==undefined){ const firstLine = D.ledger.find(l=>l.id===firstId); if(firstLine && firstLine.acc!==acc){ allocSelected.clear(); } }
    items.forEach(l=>allocSelected.add(l.id));
  }
  renderAllocUnallocResults();
}
function toggleAllocSel(id, acc){
  // an allocation can only ever contain lines from one account — starting a selection in a
  // different account's group clears whatever was selected elsewhere first
  if(!allocSelected.has(id) && allocSelected.size>0){
    const firstId = [...allocSelected][0];
    const firstLine = D.ledger.find(l=>l.id===firstId);
    if(firstLine && firstLine.acc!==acc){ allocSelected.clear(); }
  }
  if(allocSelected.has(id)) allocSelected.delete(id); else allocSelected.add(id);
  renderAllocUnallocResults();
}
async function assignAllocation(acc){
  if(blockIfSyncing()) return;
  const input = document.getElementById('allocNumInput_'+acc);
  const raw = input.value.trim();
  const num = parseInt(raw,10);
  if(!num || num<1){ toast('Enter a valid allocation number', true); return; }
  const ids = [...allocSelected];
  const accs = new Set(ids.map(id=>{ const l=D.ledger.find(x=>x.id===id); return l?l.acc:null; }));
  if(accs.size>1){ toast('An allocation can only group transactions from a single account', true); return; }
  const touched = [];
  ids.forEach(id=>{ const l = D.ledger.find(x=>x.id===id); if(l){ const base=l.updated_at||null; l.alloc = num; touched.push({row:l, base}); } });
  persistLocal();
  for(const t of touched){ await syncWrite('pd_ledger', 'upsert', {id:t.row.id, jv:t.row.jv, entry_date:t.row.date, acc:t.row.acc, descr:t.row.descr, amt:t.row.amt, alloc:t.row.alloc, allocatable:t.row.allocatable}, t.base); }
  toast('Allocation #'+pad5(num)+' created with '+ids.length+' lines ✓');
  allocSelected.clear();
  renderAlloc();
}

async function renumberAllocation(oldNum){
  if(blockIfSyncing()) return;
  const raw = document.getElementById('allocRenumInput').value.trim();
  const newNum = parseInt(raw,10);
  if(!newNum || newNum<1){ toast('Enter a valid allocation number', true); return; }
  if(newNum===oldNum){ toast("That's already the current number"); return; }
  const collision = D.ledger.some(l=>l.alloc===newNum);
  if(collision){ toast('Allocation #'+pad5(newNum)+' is already in use — pick a different number', true); return; }
  const rows = D.ledger.filter(l=>l.alloc===oldNum);
  const touched = rows.map(l=>({row:l, base:l.updated_at||null}));
  rows.forEach(l=>{ l.alloc=newNum; });
  persistLocal();
  for(const t of touched){ await syncWrite('pd_ledger', 'upsert', {id:t.row.id, jv:t.row.jv, entry_date:t.row.date, acc:t.row.acc, descr:t.row.descr, amt:t.row.amt, alloc:t.row.alloc, allocatable:t.row.allocatable}, t.base); }
  toast('Renumbered to #'+pad5(newNum)+' ✓');
  viewAllocGroup(newNum);
  renderAlloc();
}
async function unassignLine(id,n){
  if(blockIfSyncing()) return;
  const l = D.ledger.find(x=>x.id===id);
  if(l){
    const base = l.updated_at||null;
    l.alloc=null;
    persistLocal();
    await syncWrite('pd_ledger', 'upsert', {id:l.id, jv:l.jv, entry_date:l.date, acc:l.acc, descr:l.descr, amt:l.amt, alloc:l.alloc, allocatable:l.allocatable}, base);
  }
  const remaining = D.ledger.filter(l=>l.alloc===n).length;
  if(remaining) viewAllocGroup(n); else closeModal();
  renderAlloc();
  toast('Removed from allocation');
}

async function doConnect(){
  const url = document.getElementById('sbUrl').value.trim();
  const key = document.getElementById('sbKey').value.trim();
  if(!url||!key){ toast('Enter both the URL and key', true); return; }
  try{ await connectCloud(url,key,false); toast('Connected to your cloud database ✓'); renderSettings(); }
  catch(e){ /* status already set */ }
}

function exportJSON(){
  const blob = new Blob([JSON.stringify({...D, drafts: jvDrafts},null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ledger-backup.json'; a.click();
  toast('Backup downloaded');
}
function handleRestoreFile(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast('That file isn\'t valid JSON', true); inputEl.value=''; return; }
    if(!parsed || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.ledger)){
      toast('That doesn\'t look like a ledger backup file', true); inputEl.value=''; return;
    }
    const summary = 'Accounts: '+parsed.accounts.length+', Ledger: '+parsed.ledger.length+', Budget: '+(parsed.budget||[]).length+', Templates: '+(parsed.templates||[]).length;
    if(!confirm('Restore this backup?\n\n'+summary+'\n\nThis replaces everything currently shown in this browser'+(usingCloud?' AND your connected cloud project':'')+'.')){ inputEl.value=''; return; }
    await restoreFromBackup(parsed);
    inputEl.value='';
  };
  reader.readAsText(file);
}
async function restoreFromBackup(parsed){
  if(blockIfSyncing()) return;
  D = { accounts: parsed.accounts||[], ledger: parsed.ledger||[], budget: parsed.budget||[], templates: parsed.templates||[],
        categories: parsed.categories||(SEED.categories||[]).map(c=>({...c})), subcategories: parsed.subcategories||(SEED.subcategories||[]).map(s=>({...s})),
        provisionGroups: parsed.provisionGroups||[], accrualMappings: parsed.accrualMappings||[], jamiahs: parsed.jamiahs||[],
        forecastPlans: parsed.forecastPlans||{}, forecastEvents: parsed.forecastEvents||[],
        nameTranslations: parsed.nameTranslations||{}, descrTranslations: parsed.descrTranslations||{} };
  jvDrafts = parsed.drafts||[];
  saveJVDraftsList();
  rebuildIndex(); persistLocal();
  if(!usingCloud){
    toast('Backup restored ✓');
    go('dashboard');
    return;
  }
  const ledgerChunks = Math.ceil(D.ledger.length/250) || 0;
  const budgetChunks = Math.ceil(D.budget.length/250) || 0;
  const totalSteps = 14 /*deletes*/ + 10 /*small table inserts*/ + ledgerChunks + budgetChunks + 1 /*verify*/;
  let step = 0;
  const bump = (label) => { step++; updateImportProgress(step, totalSteps, label); };
  showImportProgress('Restoring backup to the cloud…');
  await SB.from('pd_ledger').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_budget').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_templates').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_accounts').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_categories').delete().neq('digit',-1); bump('Clearing old data');
  await SB.from('pd_subcategories').delete().neq('sub_code',-1); bump('Clearing old data');
  await SB.from('pd_drafts').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_provisions').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_accrual_mappings').delete().neq('category',''); bump('Clearing old data');
  await SB.from('pd_jamiahs').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_forecast_plans').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_forecast_events').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_name_translations').delete().neq('id',-1); bump('Clearing old data');
  await SB.from('pd_descr_translations').delete().neq('id',-1); bump('Clearing old data');
  if(D.accounts.length) await insertWithRetry('pd_accounts', D.accounts.map(a=>({id:a.id,descr:a.descr,balance:a.balance,direction:a.direction,acc_type:a.acc_type,name:a.name,cf_type:a.cf_type,category:a.category,status:a.status,is_savings:!!a.is_savings,is_allocatable:!!a.is_allocatable,is_credit_card:!!a.is_credit_card,credit_limit:a.credit_limit,stmt_balance:a.stmt_balance,stmt_available:a.stmt_available,stmt_date:a.stmt_date,forecast_category:a.forecast_category||null})));
  bump('Restoring accounts');
  if(D.templates.length) await insertWithRetry('pd_templates', D.templates.map(t=>({id:t.id,name:t.name,lines:t.lines})));
  bump('Restoring templates');
  if(D.categories.length) await insertWithRetry('pd_categories', D.categories.map(c=>({digit:c.digit,name:c.name})));
  bump('Restoring categories');
  if(D.subcategories.length) await insertWithRetry('pd_subcategories', D.subcategories.map(s=>({cat_digit:s.catDigit,sub_code:s.subCode,name:s.name})));
  bump('Restoring subcategories');
  if(jvDrafts.length) await insertWithRetry('pd_drafts', jvDrafts.map(d=>({id:d.id, entry_date:d.date, lines:d.lines, saved_at:d.savedAt})));
  bump('Restoring drafts');
  if(D.provisionGroups.length) await insertWithRetry('pd_provisions', D.provisionGroups.map(g=>({id:g.id, name:g.name, lines:g.lines, months:g.months, last_bulk_fill_months:g.lastBulkFillMonths||null})));
  bump('Restoring provisions');
  if(D.accrualMappings.length) await insertWithRetry('pd_accrual_mappings', D.accrualMappings.map(m=>({category:m.category, liability_acc:m.liabilityAcc, expense_acc:m.expenseAcc})));
  bump('Restoring accrual mappings');
  if(D.jamiahs.length) await insertWithRetry('pd_jamiahs', D.jamiahs.map(j=>({id:j.id, name:j.name, account:j.account, start_month:j.startMonth, duration_months:j.durationMonths, groups:j.groups, participants:j.participants, round_group:j.roundGroup, tags:j.tags})));
  bump('Restoring Jamiahs');
  if(Object.keys(D.forecastPlans).length) await insertWithRetry('pd_forecast_plans', [{id:1, plans:D.forecastPlans}]);
  if(D.forecastEvents.length) await insertWithRetry('pd_forecast_events', D.forecastEvents.map(e=>({id:e.id, description:e.description, account:e.account, month:e.month, amount:e.amount})));
  bump('Restoring Forecast data');
  if(Object.keys(D.nameTranslations).length) await insertWithRetry('pd_name_translations', [{id:1, names:D.nameTranslations}]);
  bump('Restoring name translations');
  if(Object.keys(D.descrTranslations).length) await insertWithRetry('pd_descr_translations', [{id:1, translations:D.descrTranslations}]);
  bump('Restoring description translations');
  const BATCH=250;
  for(let i=0;i<D.ledger.length;i+=BATCH){
    const chunk = D.ledger.slice(i,i+BATCH).map(l=>({id:l.id,jv:l.jv,entry_date:l.date,acc:l.acc,descr:l.descr,amt:l.amt,alloc:l.alloc,allocatable:l.allocatable}));
    await insertWithRetry('pd_ledger', chunk);
    bump('Restoring ledger ('+Math.min(i+BATCH,D.ledger.length).toLocaleString()+'/'+D.ledger.length.toLocaleString()+')');
  }
  for(let i=0;i<D.budget.length;i+=BATCH){
    const chunk = D.budget.slice(i,i+BATCH).map(b=>({id:b.id,entry_date:b.date,acc:b.acc,descr:b.descr,amt:b.amt}));
    await insertWithRetry('pd_budget', chunk);
    bump('Restoring budget');
  }
  const check = await SB.from('pd_ledger').select('id',{count:'exact',head:true});
  bump('Verifying');
  if((check.count||0)===D.ledger.length){
    setStatus('Cloud synced','ok');
    finishImportProgress('Backup restored ✓\n'+D.accounts.length.toLocaleString()+' accounts, '+D.ledger.length.toLocaleString()+' ledger rows.');
  } else {
    setStatus('Restore incomplete','err');
    finishImportProgress('⚠ Only '+(check.count||0).toLocaleString()+' of '+D.ledger.length.toLocaleString()+' ledger rows made it to the cloud — try restoring again.');
  }
  go('dashboard');
}

/* ---- Manage Prebuilt Templates ---- */
function openTemplateModal(id){
  const t = id? D.templates.find(x=>x.id===id) : {id:null, name:'', lines:[]};
  const lines = t.lines.length? t.lines : [{acc:'',descr:'',amt:''}];
  window._tplDraft = {id:t.id, name:t.name, lines: lines.map(l=>({...l, _matches:[], _hi:-1, _q:''}))};
  window._tplSelected = new Set();
  renderTemplateModal();
}
function renderTemplateModal(){
  const t = window._tplDraft;
  const total = t.lines.reduce((s,l)=>s+(Number(l.amt)||0),0);
  const sel = window._tplSelected;
  const groupTotals = {};
  t.lines.forEach(l=>{ if(l.group!=null){ groupTotals[l.group] = (groupTotals[l.group]||0) + (Number(l.amt)||0); } });
  const rows = t.lines.map((l,i)=>{
    const grp = l.group;
    const prevGrp = i>0? t.lines[i-1].group : undefined;
    const nextGrp = i<t.lines.length-1? t.lines[i+1].group : undefined;
    const isFirst = grp!=null && grp!==prevGrp;

      boxStyle = 'background:var(--chip);border-left:2px solid var(--accent);border-right:2px solid var(--accent);';
      if(isFirst) boxStyle += 'border-top:2px solid var(--accent);';

    }
    const row = `<tr style="${boxStyle}">
      <td style="width:28px;text-align:center"><input type="checkbox" class="chk" ${sel.has(i)?'checked':''} onchange="toggleTplLineSelect(${i}, this.checked)"></td>
      <td class="autoc"><div style="display:flex;gap:4px;align-items:center">
        <input id="tplAcc_${i}" style="flex:1" placeholder="Search account…" value="${l.acc? esc(accName(Number(l.acc))) : (l._q||'')}"
          oninput="tplAccInput(${i},this.value)" onfocus="tplAccInput(${i},this.value)"
          onkeydown="tplAccKey(event,${i})" onblur="setTimeout(()=>closeTplAcDrop(${i}),150)">
        <div class="acdrop" id="tplAcDrop_${i}"></div>
      </div></td>
      <td><input id="tplDescr_${i}" value="${esc(l.descr)}" oninput="window._tplDraft.lines[${i}].descr=this.value" placeholder="Description"></td>
      <td><input id="tplAmt_${i}" class="num" type="number" step="0.01" value="${l.amt}" oninput="window._tplDraft.lines[${i}].amt=this.value; updateTplTotal()" placeholder="0.00"></td>
      <td>${grp!=null? `<button class="x" title="Ungroup" onclick="ungroupTplLine(${i})">⛓✕</button>` : ''}<button class="x" title="Remove line" onclick="window._tplDraft.lines.splice(${i},1); renderTemplateModal()">✕</button></td></tr>`;
    const subtotalRow = isLast? `<tr style="background:var(--chip);border-left:2px solid var(--accent);border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)">
      <td></td><td colspan="2" style="font-size:11px;font-weight:600">Group total ${Math.abs(groupTotals[grp])<0.005? '✓' : '— must be 0.00'}</td>
      <td class="num mono ${moneyClass(groupTotals[grp])}" style="font-weight:700">${money(groupTotals[grp])}</td><td></td>
    </tr>` : '';
    return row + subtotalRow;
  }).join('');
  showModal(`
    <h3>${t.id?'Edit Template':'New Template'}</h3>
    <label class="fl">Template Name</label><input id="tplName" value="${esc(t.name)}" placeholder="e.g. Month Start JV - Fixed Charges" style="margin-bottom:12px">
    <div class="mut" style="font-size:11px;margin-bottom:8px">Check two or more lines and click "Group Selected" to box them together — a reminder that they belong to the same transaction. Each group must net to zero before the template can be saved.</div>
    <table class="jv-lines"><thead><tr><th style="width:28px"></th><th style="width:30%">Account</th><th style="width:34%">Description</th><th style="width:16%">Amount</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="row noprint" style="margin-top:10px">
      <button class="btn ghost sm" onclick="window._tplDraft.lines.push({acc:'',descr:'',amt:'',_matches:[],_hi:-1,_q:''}); renderTemplateModal()">+ Add line</button>
      <button class="btn ghost sm" ${sel.size<2?'disabled':''} onclick="groupSelectedTplLines()">⛓ Group Selected</button>
    </div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">

      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="saveTemplateModal()">Save Template</button>

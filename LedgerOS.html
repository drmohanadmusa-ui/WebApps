// kind: 'upsert' | 'delete'. row: full row object (must include pk). base: updated_at this device
// last saw for that row before this edit (null = brand new row, never existed before).
async function syncWrite(table, kind, row, base){
  if(kind==='upsert') row.updated_at = nowISO();
  const online = usingCloud && SB && navigator.onLine!==false;
  if(online){
    try{
      const r = kind==='upsert' ? await SB.from(table).upsert(row) : await SB.from(table).delete().eq('id', row.id);
      if(!r.error){ updateSyncBadge(); return {ok:true}; }
      console.warn('sync write failed, queueing:', r.error.message);
      logActivity('sync', 'Write to '+table+' (id '+(row.id!==undefined?row.id:'?')+') failed and was queued: '+r.error.message);
    } catch(e){ console.warn('sync write exception, queueing:', e); logActivity('sync', 'Write to '+table+' (id '+(row.id!==undefined?row.id:'?')+') threw an exception and was queued: '+(e&&e.message?e.message:e)); }
  }
  syncQueue.push({qid: Date.now()+'_'+Math.random().toString(36).slice(2), table, kind, row: kind==='upsert'?row:{id:row.id}, base, ts: nowISO()});
  saveSyncQueue();
  updateSyncBadge();
  return {ok:false, queued:true};
}
// Runs many syncWrite() calls with a small worker pool instead of one at a time — used by CSV
// imports so the post-processing "syncing to the cloud" phase doesn't sit fully serial (which is
// what made large imports appear to hang at 100% with no feedback). Each op: {table, kind, row, base}.
async function syncWriteMany(ops, opts){
  const concurrency = Math.max(1, (opts && opts.concurrency) || 6);
  const onProgress = opts && opts.onProgress;
  const total = ops.length;
  let idx = 0, completed = 0;
  async function worker(){
    while(idx < ops.length){
      const i = idx++;
      const op = ops[i];
      await syncWrite(op.table, op.kind, op.row, op.base);
      completed++;
      if(onProgress) onProgress(completed, total);
    }
  }
  const workers = [];
  for(let i=0;i<Math.min(concurrency, ops.length);i++) workers.push(worker());
  await Promise.all(workers);
}
async function flushSyncQueue(){
  if(!usingCloud || !SB || !syncQueue.length){ updateSyncBadge(); return; }
  setStatus('Syncing '+syncQueue.length+' pending change(s)…');
  const remaining = [];
  const newConflicts = [];
  for(const op of syncQueue){
    let serverRow = null, serverUpdatedAt = null;
    try{
      const r = await SB.from(op.table).select('*').eq('id', op.row.id).maybeSingle();
      serverRow = r.data || null;
      serverUpdatedAt = serverRow ? (serverRow.updated_at || null) : null;
    } catch(e){ remaining.push(op); continue; }
    const baseVal = op.base || null;
    if(serverUpdatedAt !== baseVal){
      // someone else's write already landed on this row since we last saw it — real conflict
      newConflicts.push({op, serverRow});
      continue;
    }
    try{
      const r = op.kind==='upsert' ? await SB.from(op.table).upsert(op.row) : await SB.from(op.table).delete().eq('id', op.row.id);
      if(r.error) remaining.push(op);
    } catch(e){ remaining.push(op); }
  }
  syncQueue = remaining;
  saveSyncQueue();
  if(newConflicts.length){
    syncConflicts = syncConflicts.concat(newConflicts);
    updateSyncBadge();
    showConflictModal();
  } else if(remaining.length){
    updateSyncBadge();
    toast(remaining.length+' change(s) still couldn\'t sync — will retry later', true);
  } else {
    updateSyncBadge();
    toast('All pending changes synced ✓');
    await fetchAllFromCloud(); rebuildIndex(); go(screen||'dashboard');
  }
}

function setAllConflicts(choice){ syncConflicts.forEach(c=>{ conflictChoices[c.op.qid]=choice; }); showConflictModal(); }
async function applyConflictResolutions(){
  let ok=0, failed=0;
  for(const c of syncConflicts){
    const choice = conflictChoices[c.op.qid]||'mine';
    if(choice==='mine'){
      try{
        const r = c.op.kind==='upsert' ? await SB.from(c.op.table).upsert(c.op.row) : await SB.from(c.op.table).delete().eq('id', c.op.row.id);
        if(r.error){ failed++; continue; }
        ok++;
      } catch(e){ failed++; continue; }
    } else {
      applyServerRowToD(c.op.table, c.serverRow, c.op.row.id);
      ok++;
    }
  }
  persistLocal();
  syncConflicts = [];
  conflictChoices = {};
  updateSyncBadge();
  closeModal();
  if(failed){ toast(failed+' resolution(s) failed to push — try again', true); }
  else { toast('All conflicts resolved ✓'); }
  await fetchAllFromCloud(); rebuildIndex(); go(screen||'dashboard');
}

async function fetchAllRows(table, orderCol, selectCols, onProgress){
  selectCols = selectCols || '*';
  let all = [];
  let from = 0;
  const PAGE = 1000;
  let total = null;
  if(onProgress){
    const countRes = await SB.from(table).select('id',{count:'exact',head:true});
    total = countRes.count || 0;
    onProgress(0, total);
  }
  while(true){
    const r = await SB.from(table).select(selectCols).order(orderCol||'id').range(from, from+PAGE-1);
    if(r.error) return {data:null, error:r.error};
    all = all.concat(r.data);
    if(onProgress) onProgress(all.length, total);
    if(r.data.length < PAGE) break;
    from += PAGE;
  }
  return {data: all, error: null};
}

async function insertWithRetry(table, chunk, attempts){
  attempts = attempts || 3;
  let lastErr = null;
  for(let a=1; a<=attempts; a++){
    const r = await SB.from(table).upsert(chunk);
    if(!r.error) return r;
    lastErr = r.error;
    console.warn(table+' batch attempt '+a+' failed:', r.error.message);
    await new Promise(res=>setTimeout(res, 800*a));
  }
  return {error:lastErr};
}
async function seedCloud(){
  const localDrafts = jvDrafts.slice(); // preserve any local-only drafts made before first connecting
  const localProvisions = D.provisionGroups.slice();
  const localAccrualMappings = D.accrualMappings.slice();
  const localJamiahs = D.jamiahs.slice();
  const localRealEstateBuildings = D.realEstateBuildings.slice();
  const localForecastPlans = {...D.forecastPlans};
  loadSeedIntoD();
  setStatus('Setting up your new project…');
  if(D.accounts.length) await insertWithRetry('pd_accounts', D.accounts.map(a=>({id:a.id,descr:a.descr,balance:a.balance,direction:a.direction,acc_type:a.acc_type,name:a.name,cf_type:a.cf_type,category:a.category,status:a.status,is_savings:!!a.is_savings,is_allocatable:!!a.is_allocatable,is_credit_card:!!a.is_credit_card,credit_limit:a.credit_limit,stmt_balance:a.stmt_balance,stmt_available:a.stmt_available,stmt_date:a.stmt_date,forecast_category:a.forecast_category||null})));
  if(D.templates.length) await insertWithRetry('pd_templates', D.templates.map(t=>({id:t.id,name:t.name,lines:t.lines})));
  if(D.categories.length) await insertWithRetry('pd_categories', D.categories.map(c=>({digit:c.digit,name:c.name})));
  if(D.subcategories.length) await insertWithRetry('pd_subcategories', D.subcategories.map(s=>({cat_digit:s.catDigit,sub_code:s.subCode,name:s.name})));
  if(localDrafts.length){ await insertWithRetry('pd_drafts', localDrafts.map(d=>({id:d.id, entry_date:d.date, lines:d.lines, saved_at:d.savedAt}))); jvDrafts = localDrafts; saveJVDraftsList(); }
  if(localProvisions.length){ await insertWithRetry('pd_provisions', localProvisions.map(g=>({id:g.id, name:g.name, lines:g.lines, months:g.months, last_bulk_fill_months:g.lastBulkFillMonths||null, dup_balance_exempt:!!g.dupBalanceExempt}))); D.provisionGroups = localProvisions; }
  if(localAccrualMappings.length){ await insertWithRetry('pd_accrual_mappings', localAccrualMappings.map(m=>({category:m.category, liability_acc:m.liabilityAcc, expense_acc:m.expenseAcc}))); D.accrualMappings = localAccrualMappings; }
  if(localJamiahs.length){ await insertWithRetry('pd_jamiahs', localJamiahs.map(j=>({id:j.id, name:j.name, account:j.account, start_month:j.startMonth, duration_months:j.durationMonths, groups:j.groups, participants:j.participants, round_group:j.roundGroup, tags:j.tags}))); D.jamiahs = localJamiahs; }
  if(localRealEstateBuildings.length){ await insertWithRetry('pd_real_estate_buildings', localRealEstateBuildings.map(b=>({id:b.id, name:b.name, apartment_account_ids:b.apartmentAccountIds, expense_account_ids:b.expenseAccountIds}))); D.realEstateBuildings = localRealEstateBuildings; }
  if(Object.keys(localForecastPlans).length){ await insertWithRetry('pd_forecast_plans', [{id:1, plans:localForecastPlans}]); D.forecastPlans = localForecastPlans; }
  const BATCH=250;
  const failedBatches = [];
  for(let i=0;i<D.ledger.length;i+=BATCH){
    const chunk = D.ledger.slice(i,i+BATCH).map(l=>({id:l.id,jv:l.jv,entry_date:l.date,acc:l.acc,descr:l.descr,amt:l.amt,alloc:l.alloc,allocatable:l.allocatable,acc_name_snapshot:l.accNameSnapshot||null}));
    const r = await insertWithRetry('pd_ledger', chunk);
    if(r.error){ console.error('Ledger batch permanently failed at row '+i+':', r.error); failedBatches.push(i); }
    setStatus('Seeding cloud… '+Math.min(i+BATCH,D.ledger.length)+'/'+D.ledger.length);
  }
  for(let i=0;i<D.budget.length;i+=BATCH){
    const chunk = D.budget.slice(i,i+BATCH).map(b=>({id:b.id,entry_date:b.date,acc:b.acc,descr:b.descr,amt:b.amt}));
    await insertWithRetry('pd_budget', chunk);
  }
  if(D.ledger.length){
    const check = await SB.from('pd_ledger').select('id',{count:'exact',head:true});
    const cloudCount = check.count||0;
    if(failedBatches.length || cloudCount!==D.ledger.length){
      setStatus('Seed incomplete','err');
      toast('Cloud seed incomplete: '+cloudCount+' of '+D.ledger.length+' ledger rows saved.', true);
    } else {
      toast('Cloud seeded ✓ ('+cloudCount+' rows verified)');
    }
  } else {
    toast('Connected ✓ — starting with a blank ledger. Add your chart of accounts in Settings to get going.');
  }
}

// Returns SCREENS in the person's saved order. Any screen missing from the saved order (i.e. a
// page added by a later version) is appended rather than dropped, so a new page can never
// silently disappear for someone with a saved ordering. Settings is always forced last.
function orderedScreens(){
  const saved = getPageOrder();
  const byId = {};
  SCREENS.forEach(s=>{ byId[s[0]] = s; });
  const out = [];
  if(saved){
    saved.forEach(id=>{ if(byId[id] && id!==PINNED_LAST_SCREEN && !out.includes(byId[id])) out.push(byId[id]); });
  }
  SCREENS.forEach(s=>{ if(s[0]!==PINNED_LAST_SCREEN && !out.includes(s)) out.push(s); });
  const pinned = byId[PINNED_LAST_SCREEN];
  if(pinned) out.push(pinned);
  return out;
}
// The reorderable subset: everything except the pinned Settings entry.
function reorderableScreens(){ return orderedScreens().filter(s=>s[0]!==PINNED_LAST_SCREEN); }
async function savePageOrder(ids){
  D.uiPrefs = D.uiPrefs || {};
  const base = D.uiPrefs.updated_at||null;
  D.uiPrefs.pageOrder = ids;
  D.uiPrefs.updated_at = nowISO();
  await syncWrite('pd_ui_prefs','upsert',{id:1, page_order:ids}, base);
  persistLocal();
}
/* ============================= LOCAL STORAGE EXPLORER =============================
   localStorage is capped at roughly 5 MB PER ORIGIN — shared by every app served from the same
   hostname, not per app. LedgerOS and CalendarOS are both on the same GitHub Pages domain, so
   they compete for one pool. This scans the WHOLE origin deliberately: filtering to LedgerOS's
   own keys is exactly what would hide the situation where another app is the real consumer
   (and vice versa — it's how LedgerOS's own 4.9 MB key went unnoticed from inside CalendarOS).
*/
const LEDGEROS_KEYS = [
  'ledgerData_v1','activityLog_v1','syncQueue_v1','jvDrafts_v1','ledgerLastChanged',
  'sb_url','sb_key','forecastSignFlips','forecastSectionOrder','forecastCollapsedSections',
  'budgetCollapsedSections','statementSortDesc','driftDismissals','driftSettings',
  'hiddenPages','sidebarPinned','theme','invFxUsdSar',
];
const LS_ORIGIN_LIMIT_BYTES = 5 * 1024 * 1024; // browsers land near 5 MB; treated as approximate
function isLedgerOsKey(k){
  return LEDGEROS_KEYS.includes(k) || /^ledger|^jv|^forecast|^drift|^budgetCollapsed|^acc/.test(k);
}
function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/(1024*1024)).toFixed(2) + ' MB';
}
// Size as key.length + value.length: both count toward the quota.
function scanLocalStorage(){
  const entries = [];
  let total = 0, mine = 0, foreign = 0;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    let v = '';
    try{ v = localStorage.getItem(k) || ''; }catch(e){ v = ''; }
    const size = k.length + v.length;
    const ours = isLedgerOsKey(k);
    entries.push({key:k, size, ours});
    total += size;
    if(ours) mine += size; else foreign += size;
  }
  entries.sort((a,b)=>b.size-a.size);
  return {entries, total, mine, foreign, pct: total/LS_ORIGIN_LIMIT_BYTES*100};
}
// Breaks the single ledgerData_v1 blob down by collection, so "4.94 MB" becomes an answer to
// "of what?" rather than a number to guess at.
function analyzeLedgerCache(){
  let raw = '';
  try{ raw = localStorage.getItem(LS_CACHE_KEY) || localStorage.getItem(LS_TRIMMED_KEY) || ''; }catch(e){ return null; }
  if(!raw) return null;
  let obj;
  try{ obj = JSON.parse(raw); }catch(e){ return {totalSize: raw.length, parts: null, parseError:true}; }
  const parts = Object.keys(obj).map(k=>{
    const val = obj[k];
    const size = JSON.stringify(val === undefined ? null : val).length + k.length + 4;
    const count = Array.isArray(val)? val.length : (val && typeof val==='object'? Object.keys(val).length : null);
    return {key:k, size, count, perRecord: (count && count>0)? Math.round(size/count) : null};
  }).sort((a,b)=>b.size-a.size);
  return {totalSize: raw.length, parts};
}
function renderStorageExplorer(){
  const scan = scanLocalStorage();
  const cache = analyzeLedgerCache();
  const weAreTheProblem = scan.total>0 && (scan.mine/scan.total) > 0.5 && scan.pct > 60;
  const nearFull = scan.pct >= 85;
  const barColor = scan.pct>=90? 'var(--red)' : (scan.pct>=70? '#c8a44d' : 'var(--green)');
  const pendingSync = (typeof syncQueue!=='undefined' && syncQueue.length) || 0;
  return `
    <div class="panel">
      <h3>💾 Local Storage</h3>
      <div class="mut" style="font-size:12px;margin-bottom:12px">Your browser allows roughly 5 MB of local storage per domain, shared by <em>every</em> app served from it — not 5 MB each. This lists everything on this domain, including other apps, because a neighbour filling the pool looks identical to running out of room yourself.</div>

      ${nearFull? `<div class="panel" style="border-left:3px solid var(--red);margin-bottom:12px">
        <div style="font-weight:700;color:var(--red);margin-bottom:4px">⚠ Storage is ${scan.pct>=99?'full':'nearly full'}</div>
        <div class="mut" style="font-size:12px">Writes are failing or about to fail. When that happens, changes may not persist locally and other apps on this domain can silently lose data.</div>
      </div>`:''}

      ${weAreTheProblem? `<div class="panel" style="border-left:3px solid #c8a44d;margin-bottom:12px">
        <div style="font-weight:700;margin-bottom:4px">LedgerOS is the main consumer here</div>
        <div class="mut" style="font-size:12px">LedgerOS accounts for ${fmtBytes(scan.mine)} of the ${fmtBytes(scan.total)} in use (${Math.round(scan.mine/scan.total*100)}%). Any other app on this domain has whatever is left.</div>
      </div>`:''}

      <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <div style="font-weight:700">${fmtBytes(scan.total)} used</div>
        <div class="mut" style="font-size:12px">${scan.pct.toFixed(1)}% of ~5 MB</div>
      </div>
      <div style="height:10px;background:var(--chip);border-radius:999px;overflow:hidden;margin-bottom:10px">
        <div style="height:100%;width:${Math.min(100,scan.pct).toFixed(1)}%;background:${barColor}"></div>
      </div>
      <div class="row" style="gap:16px;margin-bottom:14px;font-size:12px">
        <div><span class="mut">LedgerOS:</span> <b>${fmtBytes(scan.mine)}</b></div>
        <div><span class="mut">Other apps on this domain:</span> <b>${fmtBytes(scan.foreign)}</b></div>
      </div>

      <div class="panel" style="margin-bottom:12px;background:var(--chip)">
        <div style="font-weight:700;margin-bottom:4px">Offline cache: ${_idbUnavailable? 'localStorage (fallback)' : 'IndexedDB'}</div>
        <div class="mut" style="font-size:12px">${_idbUnavailable
          ? 'IndexedDB isn\'t available in this browser or mode, so the cache falls back to localStorage and is trimmed to the last '+TRIMMED_LEDGER_MONTHS+' months of history to stay small. Older history is still available whenever you are online.'
          : 'Your ledger history lives in IndexedDB, which has its own much larger quota and does not compete with other apps for the ~5 MB shown here.'}</div>
      </div>
      <div style="overflow-x:auto"><table style="min-width:420px"><thead><tr><th>Key</th><th>Owner</th><th class="num">Size</th><th class="num">Share</th></tr></thead>
      <tbody>${scan.entries.map(e=>`<tr>
        <td class="mono" style="word-break:break-all">${esc(e.key)}</td>
        <td>${e.ours? '<span class="badge">LedgerOS</span>' : '<span class="badge neg">other app</span>'}</td>
        <td class="num mono">${fmtBytes(e.size)}</td>
        <td class="num mono">${scan.total>0? (e.size/scan.total*100).toFixed(1)+'%' : '—'}</td>
      </tr>`).join('') || '<tr><td colspan="4" class="empty">Nothing stored</td></tr>'}</tbody></table></div>
    </div>

    ${cache? `<div class="panel">
      <h3>🔍 Inside the offline cache</h3>
      <div class="mut" style="font-size:12px;margin-bottom:10px">What the localStorage copy of the cache (${fmtBytes(cache.totalSize)}) is made of. This is a mirror of your cloud data kept for offline use — Supabase remains the source of truth.</div>
      ${cache.parts? `<div style="overflow-x:auto"><table style="min-width:460px"><thead><tr><th>Collection</th><th class="num">Records</th><th class="num">Size</th><th class="num">Bytes/record</th><th class="num">Share</th></tr></thead>
      <tbody>${cache.parts.map(p=>`<tr>
        <td class="mono">${esc(p.key)}</td>
        <td class="num mono">${p.count===null?'—':p.count.toLocaleString()}</td>
        <td class="num mono">${fmtBytes(p.size)}</td>
        <td class="num mono">${p.perRecord===null?'—':p.perRecord}</td>
        <td class="num mono">${(p.size/cache.totalSize*100).toFixed(1)}%</td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="empty">Cache could not be parsed</div>'}
    </div>

    <div class="panel">
      <h3>🧹 Free up space now</h3>
      <div class="mut" style="font-size:12px;margin-bottom:10px">Clearing the offline cache releases that space immediately. It is <b>not</b> your data — everything is in Supabase and will be re-downloaded on the next load. The only cost is a slower first load and no offline access until it rebuilds.</div>
      ${pendingSync>0
        ? `<div class="mut" style="font-size:12px;color:var(--red)"><b>Not safe right now:</b> ${pendingSync} change(s) have not reached the cloud yet. Wait for sync to finish, then come back.</div>`
        : `<button class="btn del sm" onclick="clearLocalLedgerCache()">Clear offline cache (${cache? fmtBytes(cache.totalSize) : '0 B'})</button>`}
    </div>` : ''}`;
}
// Guarded on an empty sync queue: the cache is disposable, but only once every pending change
// has actually reached Supabase.
function clearLocalLedgerCache(){
  if(typeof syncQueue!=='undefined' && syncQueue.length){
    toast('Not safe — '+syncQueue.length+' change(s) still waiting to sync', true);
    return;
  }
  if(!confirm('Clear the local offline cache?\n\nThis frees the space immediately. Your data stays safe in the cloud and will be re-downloaded next time you open LedgerOS. The only effect is a slower first load until it rebuilds.')) return;
  try{
    localStorage.removeItem(LS_CACHE_KEY);
    localStorage.removeItem(LS_TRIMMED_KEY);
    logActivity('action', 'Cleared the local offline cache to free browser storage');
    toast('Offline cache cleared ✓');
    renderSettings();
  }catch(e){
    toast('Could not clear the cache: '+e.message, true);
  }
}

/* ============================= FULL DATABASE SCHEMA =============================
   STANDING CONVENTION (as of v4.12.0, applies to every release from here on):
   whenever a table or column is added, changed, or removed anywhere in this app,
   DB_SCHEMA_SQL below must be updated in the same change. It is shown to the person
   under Settings → Database Schema and is the script they would run to stand up a
   brand-new empty database. If it goes stale it is worse than useless, because it
   would silently produce a database the app cannot work against.

   Scope: schema + structural singleton rows only (rows the app needs in order to
   function at all). It deliberately contains NO personal data — accounts, ledger,
   budgets and so on come back via Settings → Backup & Restore.

   ONE SCRIPT, BOTH JOBS (as of v4.22.0): DB_SCHEMA_SQL is DB_SCHEMA_CORE below plus a
   generated "column top-up" — an `alter table ... add column if not exists` for every column
   of every table. That second half is what lets the single script work against a database
   that ALREADY exists: `create table if not exists` is skipped WHOLESALE when the table is
   there, including any column added in a later version, and it reports success either way.

   The top-up is DERIVED from the create-table blocks below, never written out by hand. A
   hand-kept second copy of every column is exactly the thing that goes stale the first time
   someone adds a column and updates only one of the two lists. Add a column to its table
   below and existing databases are upgraded automatically; there is no second list.

   Adding a column is the only safe automatic operation. Changing an existing column's type
   or default is deliberately NOT generated — that needs a considered migration.
*/
const DB_SCHEMA_VERSION = '4.23.0';
const DB_SCHEMA_CORE = `-- =====================================================================
-- LedgerOS — complete database schema (v${'4.13.0'})
-- Run this once against a brand-new Supabase project to create everything
-- LedgerOS needs. Safe to re-run: every statement is guarded.
--
-- After running this, open LedgerOS and use Settings -> Backup & Restore
-- to load your data. This script creates structure only, never your data.
-- =====================================================================

  updated_at   timestamptz default now()
);

-- owners is a jsonb array attributing units per owner, e.g. [{"ownerId":1,"units":10}].
-- Ownership percentages are DERIVED from these units and never stored.
-- cash_side: where the money comes from (buy) or goes to (sell) — 'bank' or 'cash'.
--   'cash' means the platform's own USD cash balance, so no money moves at the bank.
-- usd_amount: the USD figure typed when cash is the counterparty (SAR is derived from it at the
--   configured rate, so the two can never disagree).
-- fee_pct: management fee charged to FAMILY owners on this transaction. Deliberately stored as
--   the rate rather than as an already-adjusted owners array, so the attribution stays derived
--   and editing the rate re-derives cleanly instead of compounding.
-- cash_side also accepts 'opening' (a pre-existing holding declared with no funding source, so
-- it never gets a matching ledger entry to reconcile against) and 'transfer' (one leg of a
-- position moved between platforms — see link_id / fee_units below).
-- link_id ties the two legs of a cross-platform position transfer together (the sell-shaped
-- "leaving" row and the buy-shaped "arriving" row share the same link_id) so they can be shown
-- and edited as a pair. NULL for every ordinary transaction.
-- fee_units is the quantity of the asset lost to a transfer fee, recorded on the leaving leg
-- only, purely for display — the actual realised loss falls out of the normal weighted-average
-- engine because the arriving leg's cost is deliberately smaller by that amount.
create table if not exists pd_inv_transactions (
  id           bigint primary key,
  position_id  bigint,
  entry_date   date,
  kind         text default 'buy',
  units        numeric default 0,
  total_sar    numeric default 0,
  owners       jsonb default '[]'::jsonb,
  note         text default '',
  cash_side    text default 'bank',
  usd_amount   numeric default 0,
  fee_pct      numeric default 0,
  link_id      bigint,
  fee_units    numeric default 0,
  updated_at   timestamptz default now()
);

-- Platform-level cash movements that aren't tied to any position.
--   kind 'deposit'    — money wired from the bank onto the platform.
--   kind 'withdrawal' — money taken off the platform back to the bank. capital_usd/profit_usd
--                       split it the same way the JV would be booked (capital to the In account,
--                       profit to the Profit account), which is what keeps the reconciliation
--                       bridge exact.
--   kind 'transfer'   — moves cash to to_platform_id. fee_usd is borne by the self owner alone.
-- owners is a jsonb array attributing the USD across owners, e.g. [{"ownerId":1,"usd":500}].
create table if not exists pd_inv_cash_movements (
  id              bigint primary key,
  platform_id     bigint,
  entry_date      date,
  kind            text default 'deposit',
  usd_amount      numeric default 0,
  to_platform_id  bigint,
  fee_usd         numeric default 0,
  capital_usd     numeric default 0,
  profit_usd      numeric default 0,
  owners          jsonb default '[]'::jsonb,
  note            text default '',
  updated_at      timestamptz default now()
);

-- page_order is a jsonb array of screen ids, e.g. ["dashboard","ledger","budget"].

-- =====================================================================
-- Structural singleton rows.
-- These are NOT your data — they are rows the app needs to exist at all.
-- Single-row blob tables need their row present before the app can write to it.
-- =====================================================================
insert into pd_forecast_plans (id, plans)            values (1, '{}'::jsonb) on conflict (id) do nothing;
insert into pd_name_translations (id, names)         values (1, '{}'::jsonb) on conflict (id) do nothing;

-- =====================================================================
-- Ledger change marker
-- Lets the app skip re-downloading the whole ledger when nothing has
-- changed since its last load. Purely an optimisation: if this table or
-- its trigger is absent the app falls back to a full fetch, so it is
-- safe (just slower) without it.
-- =====================================================================
create table if not exists pd_sync_meta (
  table_name   text primary key,
  last_changed timestamptz default now()
);

insert into pd_sync_meta (table_name, last_changed)
values ('pd_ledger', now())
on conflict (table_name) do nothing;

create or replace function pd_touch_sync_meta() returns trigger as $fn$
begin
  insert into pd_sync_meta (table_name, last_changed)
  values (tg_argv[0], now())
  on conflict (table_name) do update set last_changed = now();
  return null;
end;
$fn$ language plpgsql;

drop trigger if exists trg_pd_ledger_sync_meta on pd_ledger;
create trigger trg_pd_ledger_sync_meta
  after insert or update or delete on pd_ledger
  for each statement execute function pd_touch_sync_meta('pd_ledger');

-- =====================================================================
-- Row Level Security.
-- LedgerOS is a single-user app using the anon key, so every table gets one
-- permissive policy. If you later add real auth, replace these with policies
-- scoped to auth.uid().
-- =====================================================================
do $$
declare t text;
begin
  foreach t in array array[
    'pd_accounts','pd_ledger','pd_budget','pd_templates','pd_drafts',
    'pd_categories','pd_subcategories','pd_provisions','pd_accrual_mappings',
    'pd_jamiahs','pd_forecast_plans','pd_forecast_account_rules',
    'pd_custom_forecast_categories','pd_name_translations','pd_descr_translations',
    'pd_real_estate_buildings','pd_inv_owners','pd_inv_platforms','pd_inv_positions',
    'pd_inv_transactions','pd_inv_valuations','pd_inv_cash_movements','pd_inv_settings','pd_ui_prefs',
    'pd_sync_meta'
  ]
  loop
    execute format('alter table %I enable row level security', t);
    execute format('drop policy if exists "allow all" on %I', t);
    execute format('create policy "allow all" on %I for all using (true) with check (true)', t);
  end loop;
end $$;

-- =====================================================================
-- Done. Point LedgerOS at this project's URL and anon key, then restore
-- your backup from Settings -> Backup & Restore.
-- =====================================================================
`;
/* ---- Column top-up: what makes ONE script work on a database that already exists ----
   Generated from the create-table blocks above, never written out by hand — see the note at
   the top of this section for why that matters. */
function buildSchemaColumnTopUp(core){
  const out = [];
  const tableRe = /create table if not exists (\w+) \(([\s\S]*?)\n\);/g;
  let m;
  while((m = tableRe.exec(core)) !== null){
    const table = m[1];
    const cols = [];
    for(let line of m[2].split('\n')){
      let t = line.trim();
      if(!t) continue;
      t = t.replace(/--.*$/, '').trim();   // strip trailing comments
      t = t.replace(/,$/, '').trim();      // strip the trailing comma
      if(!t) continue;
      // Table-level constraints (e.g. a composite "primary key (a, b)") are not columns.
      if(/^(primary key|unique|constraint|foreign key|check|references)\b/i.test(t)) continue;
      const sp = t.indexOf(' ');
      if(sp < 1) continue;
      const name = t.slice(0, sp);
      // A column-level PRIMARY KEY can't be re-declared this way, and on an existing table the
      // key column is always already there, so the constraint is dropped from the alter form.
      const def = t.slice(sp+1).replace(/\s+primary\s+key/i, '').trim();
      if(!name || !def) continue;
      cols.push('alter table '+table+' add column if not exists '+name+' '+def+';');
    }
    if(cols.length) out.push('-- '+table+'\n'+cols.join('\n'));
  }
  return out.join('\n\n');
}
const DB_SCHEMA_SQL = DB_SCHEMA_CORE + `
-- =====================================================================
-- Bring an EXISTING database up to date
--
-- Everything above uses "if not exists". Against a database that already
-- has these tables, Postgres skips those statements ENTIRELY -- including
-- any column added in a later version -- and reports success either way.
--
-- This section closes that gap: every column is asserted individually, so
-- a table you already have gains whatever it is missing. Columns you
-- already have are left exactly as they are. No data is read or changed.
--
-- On a brand-new database these are all no-ops. Safe to re-run any time.
-- =====================================================================

` + buildSchemaColumnTopUp(DB_SCHEMA_CORE) + '\n';

function copySqlText(text, label){
  const doCopy = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(label+' copied ✓'); }
    catch(e){ toast('Copy failed — select the text and copy manually', true); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast(label+' copied ✓')).catch(doCopy);
  } else doCopy();
}

function downloadSqlText(text, filename){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8;'});
  const dl = document.createElement('a');
  dl.href = URL.createObjectURL(blob);
  dl.download = filename;
  dl.click();

}

let cmdPaletteOpen = false;
let cmdPaletteHi = -1;
let cmdPaletteResults = [];
// Ctrl/Cmd+Enter confirms the primary action of whatever modal is open. Deliberately scoped to
// modals: it applies to every current one and any added later with no extra wiring, because it
// finds the primary button rather than being hooked up per-modal. Destructive buttons (.btn.del)
// are never triggered this way.
function modalPrimaryButton(){
  const modal = document.querySelector('#modalRoot .modal');
  if(!modal) return null;
  const btns = Array.from(modal.querySelectorAll('button.btn.pri')).filter(b=>!b.disabled && b.offsetParent!==null);
  // The confirm action sits in the footer, so the LAST primary button is the right one when a
  // modal has more than one (e.g. an inline "+ New" above the footer's Save).
  return btns.length? btns[btns.length-1] : null;
}
document.addEventListener('keydown', (ev)=>{
  if((ev.ctrlKey||ev.metaKey) && ev.key==='Enter'){
    const btn = modalPrimaryButton();
    if(btn){ ev.preventDefault(); btn.click(); return; }
  }
  if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==='k'){
    ev.preventDefault();
    cmdPaletteOpen? closeCmdPalette() : openCmdPalette();
  } else if(cmdPaletteOpen && ev.key==='Escape'){
    ev.preventDefault();
    closeCmdPalette();
  } else if(!cmdPaletteOpen && ev.key==='Escape' && document.getElementById('sidebar')?.classList.contains('open')){
    closeMobileNav();
  } else if(cmdPaletteOpen && ev.key==='ArrowDown'){
    ev.preventDefault();
    cmdPaletteHi = Math.min(cmdPaletteHi+1, cmdPaletteResults.length-1);
    renderCmdPaletteResults();
  } else if(cmdPaletteOpen && ev.key==='ArrowUp'){
    ev.preventDefault();
    cmdPaletteHi = Math.max(cmdPaletteHi-1, 0);
    renderCmdPaletteResults();
  } else if(cmdPaletteOpen && ev.key==='Enter'){
    ev.preventDefault();
    if(cmdPaletteResults[cmdPaletteHi]) selectCmdPaletteResult(cmdPaletteHi);
  }
});

function searchCmdPalette(q){
  const query = q.trim().toLowerCase();
  const results = [];
  const hidden = getHiddenPages();
  orderedScreens().filter(([id])=> ALWAYS_VISIBLE_SCREENS.includes(id) || !hidden.includes(id)).forEach(([id,label,icon])=>{
    if(!query || label.toLowerCase().includes(query)) results.push({type:'Page', label:(icon? icon+' '+label : label), sub:'', action:()=>{ closeCmdPalette(); go(id); }});
  });
  if(query){
    const jvQuery = query.replace(/^jv\s*#?/,'').trim();
    if(jvQuery && /^\d+$/.test(jvQuery)){
      const jvNum = Number(jvQuery);
      if(D.ledger.some(l=>l.jv===jvNum)){
        results.push({type:'Journal Voucher', label:'JV #'+jvNum, sub:'', action:()=>{ closeCmdPalette(); viewJV(jvNum); }});
      }
    }
    const accMatches = D.accounts.filter(a=>a.status!=='Deleted' && (String(a.id).includes(query) || (a.name||'').toLowerCase().includes(query) || (a.descr||'').toLowerCase().includes(query))).slice(0,8);

  } else {
    // No query yet — still offer a few recent JVs and top accounts for quick access.
    const recentJvs = [...new Set(D.ledger.map(l=>l.jv).filter(x=>x!=null))].sort((a,b)=>b-a).slice(0,3);
    recentJvs.forEach(jv=>results.push({type:'Journal Voucher', label:'JV #'+jv, sub:'', action:()=>{ closeCmdPalette(); viewJV(jv); }}));
  }

  cmdPaletteHi = results.length? 0 : -1;
  renderCmdPaletteResults();
}

function sumAcc(pred, fromDate, toDate){
  let t=0;
  for(const l of D.ledger){
    if(!pred(l)) continue;
    if(fromDate && l.date<fromDate) continue;
    if(toDate && l.date>toDate) continue;
    t += Number(l.amt)||0;
  }
  return t;
}
function accountBalance(accId){ if(_forecastFastIndexes) return _forecastFastIndexes.balanceIdx[accId] || 0; return sumAcc(l=>l.acc===accId); }
// ============================= SMART RULES FRAMEWORK =============================
// A small, general-purpose "value expression" language for computing a number from live
// data — used by both prebuilt JV template lines (this file) and Forecast per-account
// overrides. New expression types can be added here without touching either consumer.
// Expression shapes:
//   {type:'fixed', value}
//   {type:'account_balance', account, sign}                    — accountBalance(account) * sign
//   {type:'account_period_sum', account, period, sign}         — sum of that account's ledger
//        transactions in a given month, period is a signed integer month offset from "now"
//        (0 = this month, -1 = last month, -2 = two months ago, ...) * sign
//   {type:'ref', ref, sign}                                    — another line's ALREADY-computed
//        value (by index, within the same JV template) * sign — this is what makes "insert two
//        lines with the same amount but reversed sign" possible without hardcoding it.
// sign defaults to 1 if omitted.
function smartRulePeriodRange(offset){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + (offset||0));
  const mk = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return monthRange(mk);
}
function evaluateSmartRuleExpr(expr, ctx){
  ctx = ctx || {};
  if(!expr) return 0;
  const sign = expr.sign===-1? -1 : 1;
  if(expr.type==='fixed') return Number(expr.value)||0;
  if(expr.type==='account_balance') return accountBalance(expr.account) * sign;
  if(expr.type==='account_period_sum'){
    const [from,to] = smartRulePeriodRange(expr.period||0);
    return sumAcc(l=>l.acc===expr.account, from, to) * sign;
  }
  if(expr.type==='ref'){
    const vals = ctx.lineValues||[];
    const v = vals[expr.ref];
    return (v!==undefined && v!==null)? v*sign : 0;
  }
  return 0;
}
// Evaluates every line's amtRule in order (so later lines' 'ref' can point at earlier lines'
// already-computed values) and returns the resulting amounts array.
function evaluateSmartTemplateLines(lines){
  const lineValues = [];
  lines.forEach(l=>{
    const v = l.amtRule? evaluateSmartRuleExpr(l.amtRule, {lineValues}) : Number(l.amt)||0;
    lineValues.push(v);
  });
  return lineValues;
}
function smartRuleExprLabel(expr){
  if(!expr) return '';
  const sign = expr.sign===-1? ' (reversed)' : '';
  if(expr.type==='fixed') return 'Fixed '+money(expr.value);
  if(expr.type==='account_balance') return 'Balance of '+accShort(expr.account)+sign;
  if(expr.type==='account_period_sum'){
    const p = expr.period||0;
    const label = p===0?'this month':p===-1?'last month':(p<0? Math.abs(p)+' months ago' : p+' months ahead');
    return 'Sum for '+accShort(expr.account)+' ('+label+')'+sign;
  }
  if(expr.type==='ref') return 'Same as line '+(Number(expr.ref)+1)+sign;
  return '';
}

// ============================= FORECAST FAST PATH =============================
// Without this, forecastActual/provisionsPlanFor/budgetPlanFor each re-scan the
// ENTIRE ledger/budget/provisions/events on every single call — and computeForecastCell calls
// them once per (account, month) cell. For a bulk render (Forecast Grid, Real Estate) that's
// ledger_size × accounts × months work, repeated. beginForecastFastPath() builds one-pass
// lookup indexes instead, turning each of those calls into an O(1) lookup. Wrap any bulk render
// in try{ beginForecastFastPath(); ...render... }finally{ endForecastFastPath(); } — the finally
// is essential: leaving a stale index active would silently corrupt unrelated single-cell calls
// elsewhere in the app after data changes. Isolated single-cell calls (no active fast path)
// keep using the original scanning behavior unchanged.
let _forecastFastIndexes = null;
function beginForecastFastPath(){
  const ledgerIdx = {};
  const balanceIdx = {};
  D.ledger.forEach(l=>{
    const mk = l.date.slice(0,7);
    const acc = ledgerIdx[l.acc] || (ledgerIdx[l.acc]={});
    acc[mk] = (acc[mk]||0) + (Number(l.amt)||0);
    balanceIdx[l.acc] = (balanceIdx[l.acc]||0) + (Number(l.amt)||0);
  });
  const budgetIdx = {};
  D.budget.forEach(b=>{
    const mk = b.date.slice(0,7);

  }

  let msg = 'Import complete: '+matched.toLocaleString()+' matched ('+catChanged.toLocaleString()+' category changes, '+planWritten.toLocaleString()+' month values written)';
  msg += '\nTook '+elapsedSec+'s';
  if(unmatched) msg += '\n'+unmatched.toLocaleString()+' row(s) skipped (no matching account)';
  let errorReport = null;
  if(mismatches.length || unmatchedRows.length){
    if(mismatches.length){
      const list = mismatches.slice(0,25).map(m=>`${m.name} (${m.acc}) — ${monthLabel(m.month)}: imported ${money(m.imported)}, kept computed ${money(m.computed)}`).join('\n');
      msg += '\n\n⚠ '+mismatches.length+' locked/computed cell(s) didn\'t match what the app computes (Expense/Asset LT/Liability LT from Budget or Provisions, or Provision). These were NOT overwritten — the computed value was kept:\n'+list+(mismatches.length>25?`\n…and ${mismatches.length-25} more — export the full list below.`:'');
    }
    if(unmatchedRows.length) msg += '\n\nExport the full report below for a complete list, including unmatched rows.';
    const mismatchRows = mismatches.map(m=>['Value Mismatch', m.acc, m.name, m.month, m.imported, m.computed, Number((m.imported-m.computed).toFixed(2))]);
    const unmatchedReportRows = unmatchedRows.map(u=>['Unmatched Account', u.attemptedId, u.name, '', '', '', '']);

}

/* ============================= DRIFT DETECTION ============================= */
// Flags Provisions lines and fixed-value Smart Rules whose planned amounts have quietly stopped
// matching what's actually posting — e.g. an insurance premium that renewed at a higher rate but
// the provision was never updated. Fully local computation, no server involvement.
function getDriftSettings(){
  const defaults = {thresholdPct:15, minMonths:2};
  try{ const v = JSON.parse(localStorage.getItem('driftSettings')||'{}'); return {...defaults, ...v}; }
  catch(e){ return defaults; }
}
function setDriftSettings(s){ return safeSetItemWarn('driftSettings', JSON.stringify(s)); }
function getDriftDismissals(){
  try{ const v = JSON.parse(localStorage.getItem('driftDismissals')||'{}'); return (v&&typeof v==='object')? v : {}; }
  catch(e){ return {}; }
}
// A dismissal is stamped with the "anchor month" (the most recent fully-past month in the
// comparison window) at the moment you dismissed it. It stays silenced only until a newer month
// closes and enters that window — at which point it's stale and the flag is freshly re-evaluated
// against current numbers, rather than staying permanently muted or nagging every single day.
function setDriftDismissed(key, anchorMonth){
  const d = getDriftDismissals(); d[key] = anchorMonth;
  return safeSetItemWarn('driftDismissals', JSON.stringify(d));
}
function driftLookbackMonths(n){
  const currentMonth = todayStr().slice(0,7);
  const months = [];
  let mk = currentMonth;
  for(let i=0;i<n;i++){ mk = prevMonthKey(mk); months.unshift(mk); }
  return months; // oldest first; last entry is the most recent fully-past month (the "anchor")
}
function computeDriftFlags(){
  const settings = getDriftSettings();
  const dismissals = getDriftDismissals();
  const months = driftLookbackMonths(Math.max(1, settings.minMonths));
  const anchorMonth = months[months.length-1];
  const flags = [];

  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    g.lines.forEach(line=>{
      const key = 'provision:'+g.id+':'+line.lineId;
      if(dismissals[key] && dismissals[key]>=anchorMonth) return;
      let allDrifted = true, sumPlan=0, sumActual=0, validCount=0;
      months.forEach(mk=>{
        const raw = (g.months[mk]||{})[line.lineId];
        const plan = (raw===undefined||raw===null||raw==='')? null : Number(raw);
        if(plan===null || plan===0){ allDrifted=false; return; } // nothing planned that month — can't compare, so not "drifted"
        const actual = forecastActual(line.acc, mk);
        const pct = Math.abs(actual-plan)/Math.abs(plan)*100;
        if(pct < settings.thresholdPct) allDrifted=false;
        sumPlan += plan; sumActual += actual; validCount++;
      });
      if(allDrifted && validCount===months.length){
        flags.push({key, kind:'provision', groupId:g.id, groupName:g.name, lineId:line.lineId, acc:line.acc, avgPlan:sumPlan/validCount, avgActual:sumActual/validCount, months});
      }
    });
  });

  D.forecastAccountRules.forEach(rule=>{
    if(rule.rule.type!=='fixed') return; // account_balance / account_period_sum already derive from live data — nothing independent to drift from
    const key = 'smartrule:'+rule.id;
    if(dismissals[key] && dismissals[key]>=anchorMonth) return;
    const plan = Number(rule.rule.value)||0;
    if(plan===0) return;
    let allDrifted = true, sumActual=0;
    months.forEach(mk=>{
      const actual = forecastActual(rule.account, mk);
      sumActual += actual;
      const pct = Math.abs(actual-plan)/Math.abs(plan)*100;
      if(pct < settings.thresholdPct) allDrifted=false;
    });
    if(allDrifted){
      flags.push({key, kind:'smartrule', ruleId:rule.id, ruleName:rule.name, acc:rule.account, avgPlan:plan, avgActual:sumActual/months.length, months});
    }
  });

  return flags;
}
function dismissDriftFlag(key){
  const settings = getDriftSettings();
  const months = driftLookbackMonths(Math.max(1, settings.minMonths));
  setDriftDismissed(key, months[months.length-1]);
  go(screen);

  if(!minMonths || minMonths<1){ toast('Consecutive months must be at least 1', true); return; }

function shiftMonthKey(mk, delta){
  let [y,m]=mk.split('-').map(Number);
  m += delta;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return y+'-'+String(m).padStart(2,'0');
}
function monthsBetweenKeys(fromYm, toYm){
  const out=[]; let mk=fromYm;
  let guard=0;
  while(mk<=toYm && guard<600){ out.push(mk); mk=nextMonthKeyPlain(mk); guard++; }
  return out;
}

// Finds the D.budget row(s) and provision (group,line) contributor(s) behind an account+month's
// Budget figure and Provisions figure respectively — used by the conflict resolver below to decide
// whether a side can be safely auto-written (exactly one contributor) or needs a manual fix (2+).
function budgetContributorsFor(accId, monthKey){
  const [from,to] = monthRange(monthKey);
  return D.budget.filter(b=>b.acc===accId && b.date>=from && b.date<=to);
}
function provisionContributorsFor(accId, monthKey){
  const out = [];
  D.provisionGroups.forEach(g=>{
    ensureLineIds(g);
    const cell = g.months[monthKey];
    if(!cell) return;
    g.lines.forEach(line=>{
      if(line.acc!==accId) return;
      const v = cell[line.lineId];
      if(v===undefined||v===null||v==='') return;
      out.push({group:g, line});
    });
  });
  return out;
}
// Writes `val` to the Budget row and/or Provisions line for one account+month, where possible.
// strict=true (used by the bulk "apply to all months" flow): only writes if BOTH sides have
// exactly one contributor — otherwise writes nothing for this month and reports it as skipped.
// strict=false (single-month manual resolve): writes whichever side(s) can be safely written
// and reports the rest via notes, matching the original single-month behavior.
async function applyForecastResolutionToMonth(accId, monthKey, val, opts){
  const strict = !!(opts && opts.strict);
  const budgetRows = budgetContributorsFor(accId, monthKey);
  const provContributors = provisionContributorsFor(accId, monthKey);
  const budgetWritable = budgetRows.length<=1;
  const provWritable = provContributors.length===1;
  if(strict && (!budgetWritable || !provWritable)){
    return {ok:false, notes:[(!budgetWritable? 'Budget has '+budgetRows.length+' entries.' : 'Provisions has '+provContributors.length+' lines.')]};
  }
  const notes = [];
  if(budgetWritable){
    if(budgetRows.length===1){
      const row = budgetRows[0];
      row.amt = val;
      await syncWrite('pd_budget', 'upsert', {id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:val}, row.updated_at||null);
    } else {
      const row = {id: nextBudgetId(), date: monthKey+'-01', acc: accId, descr: 'Budget - '+monthLabel(monthKey), amt: val};
      D.budget.push(row);
      await syncWrite('pd_budget', 'upsert', {id:row.id, entry_date:row.date, acc:row.acc, descr:row.descr, amt:val}, null);
    }
  } else {
    notes.push('Budget has '+budgetRows.length+' entries this month — left untouched, adjust manually.');
  }
  if(provWritable){
    const {group, line} = provContributors[0];
    if(!group.months[monthKey]) group.months[monthKey] = {};
    group.months[monthKey][line.lineId] = val;
    await persistProvisionGroup(group);
  } else if(provContributors.length>1){
    notes.push('Provisions has '+provContributors.length+' lines this month — left untouched, adjust manually.');
  }
  return {ok: notes.length===0, notes};
}

function resolveForecastConflictCustom(accId, monthKey){
  const el = document.getElementById('conflictCustomVal');
  const clean = String(el? el.value : '').replace(/,/g,'').trim();
  const val = Number(clean);

async function resolveForecastConflict(accId, monthKey, value){
  if(blockIfSyncing()) return;
  const val = Number(value);
  if(isNaN(val)){ toast('Invalid figure', true); return; }
  const result = await applyForecastResolutionToMonth(accId, monthKey, val, {strict:false});
  persistLocal();
  closeModal();
  if(!result.ok){
    toast('Set to '+money(val)+' — '+result.notes.join(' '), true);
  } else {
    toast('Resolved — both now match at '+money(val)+' ✓');
  }
  logActivity('action', 'Resolved Budget/Provisions mismatch for '+accShort(accId)+' ('+accId+'), '+monthLabel(monthKey)+' — set to '+money(val)+(!result.ok?' (partial: '+result.notes.join(' ')+')':''));
  renderForecastBody();
}
// "Apply to all mismatched months" — for every future month (through the configured Grid End
// Month) where this account currently has a Budget/Provisions conflict, uses that month's OWN
// figure from the chosen source (numbers can differ month to month, unlike the single-figure
// resolve above). Strict mode: a month is only touched if both sides are single-contributor;
// otherwise it's skipped entirely (no partial writes) and reported back.
async function resolveForecastConflictAllMonths(accId, strategy, customValue){
  if(blockIfSyncing()) return;
  const a = D.accounts.find(x=>x.id===accId); if(!a) return;
  const strategyLabel = strategy==='provisions'?'Provisions':strategy==='budget'?'Budget':('the custom figure '+money(customValue));
  if(!confirm('Apply '+strategyLabel+' to every currently-mismatched future month for '+accShort(accId)+'? This writes to both Budget and Provisions where each month allows it.')) return;
  const currentMonth = todayStr().slice(0,7);
  const gridEnd = getGridEndMonth();
  // Pre-scan for the actual list of mismatched months first, so the progress bar reflects real
  // work about to happen rather than the whole (much longer) date range it's scanning through.
  const conflictMonths = [];
  let mk = currentMonth, guard = 0;
  while(mk<=gridEnd && guard<600){
    if(computeForecastCell(a, mk, currentMonth).conflict) conflictMonths.push(mk);
    mk = nextMonthKeyPlain(mk); guard++;
  }
  closeModal();
  if(!conflictMonths.length){ toast('No mismatched months found for '+accShort(accId)); return; }
  showImportProgress('Resolving '+conflictMonths.length+' month(s) for '+accShort(accId)+'…');
  let resolvedCount = 0;
  const skippedMonths = [];
  for(let i=0;i<conflictMonths.length;i++){
    const cmk = conflictMonths[i];
    const cell = computeForecastCell(a, cmk, currentMonth);
    const val = strategy==='provisions'? cell.provPlan : strategy==='budget'? cell.budgetPlan : customValue;
    const result = await applyForecastResolutionToMonth(accId, cmk, val, {strict:true});
    if(result.ok) resolvedCount++; else skippedMonths.push(cmk);
    updateImportProgress(i+1, conflictMonths.length, 'Resolving');
  }
  persistLocal();
  let msg = 'Resolved '+resolvedCount+' month(s) for '+accShort(accId)+' using '+strategyLabel+'.';
  if(skippedMonths.length){ msg += ' Skipped '+skippedMonths.length+' month(s) with multiple entries: '+skippedMonths.map(monthLabel).join(', ')+'.'; }
  finishImportProgress(msg, null, {title: skippedMonths.length? '⚠ Resolved with some skips':'✓ Resolved', logPrefix:'Bulk-resolved Budget/Provisions mismatch using '+strategy+': '});
  renderForecastBody();
}
function resolveForecastConflictAllMonthsCustom(accId){
  const el = document.getElementById('conflictCustomAllVal');
  const clean = String(el? el.value : '').replace(/,/g,'').trim();
  const val = Number(clean);
  if(clean===''||isNaN(val)){ toast('Enter a valid number', true); return; }
  return resolveForecastConflictAllMonths(accId, 'custom', val);
}
// Computes {plan, actual, variance, editable, locked, conflict, source} for one account+month,
// dispatching on that account's forecast category behavior.
function computeForecastCell(a, monthKey, currentMonth){
  // Smart Rules (Settings → Smart Rules) override the normal category behavior for this specific
  // account. Each rule has a target offset (0 = current month, +1/+2/+3 = that many months
  // ahead). Every month from the current month up to (but not including) the target is forced
  // to 0 — nothing happens there by design (e.g. a quarterly sweep). The target month itself
  // gets the live-computed value (e.g. today's account balance, reversed). Months after the
  // target are untouched by the rule and use the account's normal forecast category logic. This
  // still avoids the circular-dependency problem of trying to project a rule-driven value forward
  // using data that doesn't exist yet — the target month's value is always computed from TODAY's
  // real data, not a simulation of what that future month will actually look like.
  if(monthKey>=currentMonth){
    const rule = D.forecastAccountRules.find(r=>r.account===a.id);
    if(rule){
      const offset = rule.targetOffset||0;
      const targetMonth = shiftMonthKey(currentMonth, offset);
      if(monthKey===targetMonth){
        const actual = forecastActual(a.id, monthKey);
        const plan = evaluateSmartRuleExpr({...rule.rule, account: rule.account}, {});
        return {plan, actual, variance: actual-plan, editable:false, locked:true, source:'smart_rule', smartRuleName:rule.name};
      }
      if(monthKey<targetMonth){
        const actual = forecastActual(a.id, monthKey);
        return {plan:0, actual, variance: actual, editable:false, locked:true, source:'smart_rule', smartRuleName:rule.name};
      }
      if(monthKey>targetMonth && rule.freezeAfterTarget && getManualPlan(a.id, monthKey)===null){
        const actual = forecastActual(a.id, monthKey);
        return {plan:0, actual, variance: actual, editable:false, locked:true, source:'smart_rule', smartRuleName:rule.name};
      }
    }
  }
  const behavior = FORECAST_CATEGORIES[getForecastCategory(a)]?.behavior;
  const actual = forecastActual(a.id, monthKey);
  const isInactive = a.status==='Inactive';
  if(behavior==='manual'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    }
    const plan = getManualPlan(a.id, monthKey);
    return {plan, actual, variance: plan!==null? actual-plan : null, editable: !isInactive, locked:isInactive, source:'manual'};
  }
  if(behavior==='manual_or_provision'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    }
    const provPlan = provisionsPlanFor(a.id, monthKey);
    if(provPlan!==null){
      return {plan: provPlan, actual, variance: actual-provPlan, editable:false, locked:true, source:'provisions'};
    }
    const plan = getManualPlan(a.id, monthKey);
    return {plan, actual, variance: plan!==null? actual-plan : null, editable: !isInactive, locked:isInactive, source: plan!==null?'manual':null};
  }
  if(behavior==='expense'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    }
    const provPlan = provisionsPlanFor(a.id, monthKey);
    const budgetPlan = budgetPlanFor(a.id, monthKey);
    let plan, source;
    if(provPlan!==null){ plan = provPlan; source = 'provisions'; }
    else if(budgetPlan!==null){ plan = budgetPlan; source = 'budget'; }
    else { plan = 0; source = 'budget-empty'; } // no Provisions, no Budget entry yet — shows 0, still links to Budget to plan it
    const conflict = provPlan!==null && budgetPlan!==null && Math.abs(provPlan-budgetPlan)>0.5;
    return {plan, actual, variance: actual-plan, editable:false, locked:true, conflict, source, provPlan, budgetPlan};
  }
  if(behavior==='autoclear'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    } else if(monthKey === currentMonth){
      const priorEnd = monthRange(prevMonthKey(monthKey))[1];
      const priorBalance = D.ledger.filter(l=>l.acc===a.id && l.date<=priorEnd).reduce((s,l)=>s+Number(l.amt),0);
      const plan = -priorBalance;
      return {plan, actual, variance: actual-plan, editable:false, locked:true, source:'autoclear'};
    } else {
      // Future months for autoclear categories (Asset ST / Liability ST / Accrual): the current
      // month is assumed to clear the account to zero, so there is nothing left to plan beyond it.
      // Locked at 0, not editable. Any previously-stored manual plan value for these months is
      // intentionally left untouched in pd_forecast_plans but no longer read here.
      return {plan: 0, actual, variance: 0-actual, editable:false, locked:true, source:'autoclear'};
    }
  }
  if(behavior==='provision'){
    if(monthKey < currentMonth){
      return {plan: actual, actual, variance: 0, editable:false, locked:true, source:'actual'};
    }
    const plan = provisionsPlanFor(a.id, monthKey);
    return {plan, actual, variance: plan!==null? actual-plan : null, editable:false, locked:true, source: plan!==null?'provisions':null};
  }
  return {plan:null, actual, variance:null, editable:false, locked:true, source:null};
}

function kpiValue(raw, cls, fmtName){
  const fmtFn = fmtName==='absMoney'?absMoney:money;
  // Only start at 0 (to be animated by animateKpiCountUps) when a real count-up is about to play.
  // Otherwise — e.g. a re-render triggered while already on the dashboard, such as saving a
  // statement balance — show the real value immediately so KPIs never get stuck displaying 0.
  const initial = dashboardNeedsCountUp ? fmtFn(0) : fmtFn(raw);
  return `<div class="v ${cls||''}" data-count-target="${raw}" data-count-fmt="${fmtName||'money'}">${initial}</div>`;
}
function animateKpiCountUps(){
  if(!dashboardNeedsCountUp) return;
  dashboardNeedsCountUp = false;
  const els = document.querySelectorAll('.kpi .v[data-count-target]');
  els.forEach(el=>{
    const target = Number(el.dataset.countTarget)||0;
    const fmtFn = el.dataset.countFmt==='absMoney'? absMoney : money;
    const duration = 650;
    const start = performance.now();
    function frame(now){
      const progress = Math.min((now-start)/duration, 1);
      const eased = 1-Math.pow(1-progress,3);
      el.textContent = fmtFn(target*eased);
      if(progress<1) requestAnimationFrame(frame);
      else el.textContent = fmtFn(target);
    }
    requestAnimationFrame(frame);
  });
}
/* ---- Dashboard: "This Month Expense" against budget ----
   Uses exactly the same budget definition as the P&L page's Total Expenses card
   (pnlBudgetForAccountInRange, which prefers a provision plan over the plain budget plan and
   covers every non-deleted expense account), so the two screens can never disagree.

   The comparison is month-to-date spend against the whole month's budget.

   Variances use pnlVarianceMagnitude, not raw subtraction — positive always means under budget
   regardless of which sign convention the underlying accounts use. */
function dashboardExpenseBudget(ym, actualMTD){
  const [mFrom, mTo] = monthRange(ym);
  const expAccs = D.accounts.filter(a=>firstDigit(a.id)===6 && (a.acc_type==='Individual Account'||a.acc_type==='Accrual Account') && a.status!=='Deleted');
  let budget = 0;
  expAccs.forEach(a=>{ budget += pnlBudgetForAccountInRange(a.id, mFrom, mTo); });
  return {
    budget,
    hasBudget: Math.abs(budget) >= 0.005,
    fullVariance: pnlVarianceMagnitude(budget, actualMTD)
  };
}
// Full-month budget only. A prorated "on pace" figure was shown here originally, but it wasn't
// a useful signal in practice — the plain over/under against the month's budget is what gets read.
function dashboardExpenseBudgetLine(b){
  if(!b.hasBudget) return '<span class="mut">No budget set for this month</span>';
  const v = b.fullVariance;
  const word = Math.abs(v)<0.005 ? 'On budget' : (v>0 ? 'Under budget by '+money(Math.abs(v)) : 'Over budget by '+money(Math.abs(v)));
  return `<span class="${moneyClass(v)}">${word}</span>`;
}
// Jump from the dashboard straight to the P&L for the current month. go() runs the page render,

}

let jvDraft = { date: todayStr(), lines: [] };
function freshLine(){ return {key:Math.random().toString(36).slice(2), acc:'', descr:'', amt:'', _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1}; }
function resetJVDraft(){ jvDraft = { date: todayStr(), lines: [freshLine(),freshLine()] }; }
if(jvDraft.lines.length===0) resetJVDraft();

function jvTotal(){ return jvDraft.lines.reduce((s,l)=>s+(Number(l.amt)||0),0); }
function jvIsBlankLine(l){ return !l.acc && (!l.descr||!l.descr.trim()) && (l.amt===''||l.amt===null||l.amt===undefined); }
function jvIsCompleteLine(l){ return l.acc && l.descr && l.descr.trim() && l.amt!==''&&l.amt!==null&&l.amt!==undefined && !isNaN(Number(l.amt)); }
function jvBalanced(){
  const nonBlank = jvDraft.lines.filter(l=>!jvIsBlankLine(l));
  if(nonBlank.some(l=>!jvIsCompleteLine(l))) return false;
  return Math.abs(jvTotal()) < 0.005 && nonBlank.length>=2;
}
function reconcileProjected(){
  const posted = accountBalance(reconcileAcc);
  const draft = jvDraft.lines.filter(l=>Number(l.acc)===reconcileAcc).reduce((s,l)=>s+(Number(l.amt)||0),0);
  return posted + draft;
}
function reconcileBannerHTML(){
  if(!reconcileAcc) return '';
  const a = ACC_BY_ID[reconcileAcc];
  if(!a || a.stmt_balance===null || a.stmt_balance===undefined) { reconcileAcc=null; return ''; }
  const projected = reconcileProjected();
  const remaining = Number(a.stmt_balance) - projected;
  const done = Math.abs(remaining) < 0.005;
  return `<div class="panel" style="background:${done?'#146c4322':'var(--chip)'};border-color:${done?'var(--green)':'var(--accent)'}">
    <div class="row" style="justify-content:space-between">
      <div><b>🏦 Reconciling ${a.id} — ${esc(accShort(a.id))}</b>
        <div class="mut" style="font-size:12px;margin-top:3px">Statement: <b class="mono">${money(a.stmt_balance)}</b> &nbsp; Ledger incl. this draft: <b class="mono" id="reconcileProjected">${money(projected)}</b></div>
      </div>
      <div style="text-align:right">
        <div class="mut" style="font-size:11px;text-transform:uppercase">Remaining</div>
        <div class="mono" id="reconcileRemaining" style="font-size:18px;font-weight:700;color:${done?'var(--green)':'var(--red)'}">${done? 'Reconciled ✓' : money(remaining)}</div>
      </div>
      <button class="x noprint" onclick="reconcileAcc=null; renderNewJV()" title="Exit reconciliation">✕</button>
    </div>
  </div>`;
}
function updateReconcileBanner(){
  if(!reconcileAcc) return;
  const a = ACC_BY_ID[reconcileAcc]; if(!a) return;
  const projected = reconcileProjected();
  const remaining = Number(a.stmt_balance) - projected;
  const done = Math.abs(remaining) < 0.005;
  const pEl = document.getElementById('reconcileProjected'); if(pEl) pEl.textContent = money(projected);
  const rEl = document.getElementById('reconcileRemaining');
  if(rEl){ rEl.textContent = done? 'Reconciled ✓' : money(remaining); rEl.style.color = done? 'var(--green)':'var(--red)'; }
}

// Lightweight update used while typing an amount — avoids re-rendering (and de-focusing) inputs
function updateJVTotals(){
  const t = jvTotal(), bal = jvBalanced();
  const disp = document.getElementById('jvTotalDisp');
  if(disp){ disp.textContent = money(t); disp.style.color = bal?'var(--green)':'var(--red)'; }
  const btn = document.getElementById('jvPostBtn');
  if(btn){ btn.disabled = !bal || syncInProgress; }
  updateReconcileBanner();
}
function jvLineRow(l,i){
  return `<tr>
    <td class="autoc"><div style="display:flex;gap:4px;align-items:center">
      <input id="jvAcc_${i}" style="flex:1" placeholder="Search account…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${l.acc? esc(accName(l.acc)) : (l._q||'')}"
        oninput="jvAccInput(${i},this.value)" onfocus="jvAccInput(${i},this.value)"
        onkeydown="jvAccKey(event,${i})" onblur="setTimeout(()=>closeAcDrop(${i}),150)">
      ${i>0? `<button type="button" class="x" title="Copy account from line above" onclick="copyAccAbove(${i})">⤴</button>` : ''}
      <button type="button" class="x" title="Clear" onclick="clearJVField(${i},'acc')">✕</button>
      <div class="acdrop" id="acdrop_${i}"></div>
    </div></td>
    <td class="autoc"><div style="display:flex;gap:4px;align-items:center">
      <input id="jvDescr_${i}" style="flex:1" autocomplete="off" value="${esc(l.descr)}" oninput="jvDescrInput(${i},this.value)" onfocus="jvDescrInput(${i},this.value)"
        onkeydown="jvDescrKey(event,${i})" onblur="setTimeout(()=>closeDescrDrop(${i}),150)" placeholder="Description">
      ${i>0? `<button type="button" class="x" title="Copy description from line above" onclick="copyDescrAbove(${i})">⤴</button>` : ''}
      <button type="button" class="x" title="Clear" onclick="clearJVField(${i},'descr')">✕</button>
      <div class="acdrop" id="descrdrop_${i}"></div>
    </div></td>
    <td><div style="display:flex;gap:4px;align-items:center">
      <input id="jvAmt_${i}" class="num" style="flex:1" type="text" inputmode="decimal" autocomplete="off" value="${l.amt===''?'':fmt2(l.amt)}"
        oninput="jvDraft.lines[${i}].amt=this.value; updateJVTotals()"
        onfocus="this.value = (jvDraft.lines[${i}].amt===''?'':jvDraft.lines[${i}].amt)"
        onblur="jvAmtBlur(${i})"
        onkeydown="jvAmtKey(event,${i})" placeholder="0.00 or 1+5-2">
      <button type="button" class="x" title="Clear" onclick="clearJVField(${i},'amt')">✕</button>
    </div></td>
    <td><button class="x" title="Remove line" onclick="removeJVLine(${i})">🗑</button></td>
  </tr>`;
}
function clearJVField(i, field){
  const l = jvDraft.lines[i]; if(!l) return;
  if(field==='acc'){ l.acc=''; l._q=''; l._matches=[]; l._hi=-1; const el=document.getElementById('jvAcc_'+i); if(el){ el.value=''; el.focus(); } closeAcDrop(i); }
  else if(field==='descr'){ l.descr=''; const el=document.getElementById('jvDescr_'+i); if(el){ el.value=''; el.focus(); } }
  else if(field==='amt'){ l.amt=''; const el=document.getElementById('jvAmt_'+i); if(el){ el.value=''; el.focus(); } }
  updateJVTotals();
}
function copyDescrAbove(i){
  if(i<1 || i>=jvDraft.lines.length) return;
  const val = jvDraft.lines[i-1].descr||'';
  jvDraft.lines[i].descr = val;
  const el = document.getElementById('jvDescr_'+i);
  if(el) el.value = val;
  const amtEl = document.getElementById('jvAmt_'+i);
  if(amtEl) amtEl.focus();
}
function copyAccAbove(i){
  if(i<1 || i>=jvDraft.lines.length) return;
  const acc = jvDraft.lines[i-1].acc;
  if(!acc) return;
  jvDraft.lines[i].acc = acc;
  jvDraft.lines[i]._q = '';
  jvDraft.lines[i]._matches = [];
  jvDraft.lines[i]._hi = -1;
  const el = document.getElementById('jvAcc_'+i);
  if(el) el.value = accName(acc);
  closeAcDrop(i);
  const descrEl = document.getElementById('jvDescr_'+i);
  if(descrEl) descrEl.focus();
}
// Description autocomplete: suggests descriptions already typed on OTHER lines of this same JV
// (since a debit/credit pair usually shares the same description), and when picked, fills this
// line's amount as the reverse sign of the matched line's amount to help balance the entry.
function jvDescrInput(i, val){
  jvDraft.lines[i].descr = val;
  const q = val.toLowerCase().trim();
  if(!q){ jvDraft.lines[i]._descrMatches=[]; closeDescrDrop(i); return; }
  const seen = new Set(); const uniq=[];
  jvDraft.lines.forEach((l,idx)=>{
    if(idx===i) return;
    if(l.descr && l.descr.toLowerCase().includes(q) && !seen.has(l.descr)){ seen.add(l.descr); uniq.push(l); }
  });
  jvDraft.lines[i]._descrMatches = uniq.slice(0,8);
  jvDraft.lines[i]._descrHi = -1;
  renderDescrDrop(i);
}
function renderDescrDrop(i){
  const l = jvDraft.lines[i];
  const matches = l._descrMatches||[];
  const el = document.getElementById('descrdrop_'+i);
  const html = matches.map((m,idx)=>`<div class="${idx===l._descrHi?'hi':''}" onmousedown="pickDescrMatch(${i},'${m.key}')">${esc(m.descr)} <span class="mut" style="float:right">${m.amt!==''&&m.amt!==null&&!isNaN(Number(m.amt))?money(-Number(m.amt)):''}</span></div>`).join('');
  el.innerHTML = html;
  el.className = html? 'acdrop show' : 'acdrop';
}
function closeDescrDrop(i){ const el=document.getElementById('descrdrop_'+i); if(el){ el.innerHTML=''; el.className='acdrop'; } }
function jvDescrKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  const matches = jvDraft.lines[i]._descrMatches||[];
  if(ev.key==='ArrowDown'){ if(matches.length){ ev.preventDefault(); jvDraft.lines[i]._descrHi = Math.min(matches.length-1, (jvDraft.lines[i]._descrHi??-1)+1); renderDescrDrop(i); } }
  else if(ev.key==='ArrowUp'){ if(matches.length){ ev.preventDefault(); jvDraft.lines[i]._descrHi = Math.max(0, (jvDraft.lines[i]._descrHi??0)-1); renderDescrDrop(i); } }
  else if(ev.key==='Enter'){
    if(matches.length && jvDraft.lines[i]._descrHi>=0){ ev.preventDefault(); pickDescrMatch(i, matches[jvDraft.lines[i]._descrHi].key); }
    else { ev.preventDefault(); closeDescrDrop(i); const el = document.getElementById('jvAmt_'+i); if(el) el.focus(); }
  }
  else if(ev.key==='Escape'){ closeDescrDrop(i); }
}
function pickDescrMatch(i, key){
  const matched = jvDraft.lines.find(l=>l.key===key);
  if(!matched) return;
  jvDraft.lines[i].descr = matched.descr;
  const hasAmt = matched.amt!==''&&matched.amt!==null&&!isNaN(Number(matched.amt));
  const reverseAmt = hasAmt ? -Number(matched.amt) : '';
  jvDraft.lines[i].amt = reverseAmt;
  const descrEl = document.getElementById('jvDescr_'+i); if(descrEl) descrEl.value = matched.descr;
  const amtEl = document.getElementById('jvAmt_'+i); if(amtEl) amtEl.value = reverseAmt===''? '' : fmt2(reverseAmt);
  jvDraft.lines[i]._descrMatches = [];
  closeDescrDrop(i);
  updateJVTotals();
  advanceAfterAmount(i);
}
function advanceAfterAmount(i){
  if(i+1 < jvDraft.lines.length){
    const el = document.getElementById('jvAcc_'+(i+1));
    if(el) el.focus();
  } else {
    addJVLine();
    const el = document.getElementById('jvAcc_'+(jvDraft.lines.length-1));
    if(el) el.focus();
  }
}
// Safely evaluates a typed arithmetic expression like "1+5-2" and rounds to 2 decimals.
// Only fires if the text actually contains an operator (so plain negative numbers like "-100" pass through untouched).
function tryEvalFormula(str){
  if(!/^[\d+\-*/.() \t]+$/.test(str)) return null;
  if(!/[+\-*/]/.test(str.slice(1))) return null;
  try{
    const result = Function('"use strict"; return (' + str + ')')();
    if(typeof result==='number' && isFinite(result)) return Math.round(result*100)/100;
  } catch(e){}
  return null;
}
function jvAmtBlur(i){
  const raw = jvDraft.lines[i].amt;
  let num;
  if(raw===''||raw===null){ num=''; }
  else{
    const cleaned = String(raw).replace(/,/g,'').trim();
    const formulaResult = tryEvalFormula(cleaned);
    num = formulaResult!==null ? formulaResult : Number(cleaned);
  }
  jvDraft.lines[i].amt = (num===''||isNaN(num))? '' : num;
  const el = document.getElementById('jvAmt_'+i);
  if(el) el.value = jvDraft.lines[i].amt===''? '' : fmt2(jvDraft.lines[i].amt);
  updateJVTotals();
}
function jvAmtKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  if(ev.key==='ArrowUp'||ev.key==='ArrowDown'){
    ev.preventDefault();
    const target = ev.key==='ArrowUp'? i-1 : i+1;
    const el = document.getElementById('jvAmt_'+target);
    if(el){ el.focus(); el.select(); }
  } else if(ev.key==='Enter'){
    ev.preventDefault();
    jvAmtBlur(i);
    advanceAfterAmount(i);
  }
}
// New lines start BLANK, even while reconciling. Pre-filling them with the account being
// reconciled meant every line added after the first repeated the account already sitting on
// line 1 — which reads as the first line's account mysteriously copying itself down the JV.
// Reconciling is normally about entering the OFFSETTING accounts, so the account under
// reconciliation is exactly the one you don't want repeated. The ⤴ button on each row still
// copies the account from the line above for the cases where you do want it.
// Note this does NOT affect the flows that pre-fill line 1 (starting a reconciliation from an
// account, or balancing an allocation) — those set the line directly rather than going through
// here, so picking a target from a list and having its amount filled in still works.
function addJVLine(){ jvDraft.lines.push(freshLine()); renderNewJV(); }
function removeJVLine(i){ jvDraft.lines.splice(i,1); renderNewJV(); }
function jvAccInput(i,val){
  jvDraft.lines[i]._q = val;
  if(!val){ jvDraft.lines[i].acc=''; }
  const matches = accountSearchMatches(val, postableAccounts());
  jvDraft.lines[i]._matches = matches; jvDraft.lines[i]._hi = -1;
  renderAcDrop(i);
}
function renderAcDrop(i){
  const l = jvDraft.lines[i];
  const matches = l._matches||[];
  const el = document.getElementById('acdrop_'+i);
  const html = matches.map((a,idx)=>
    `<div class="${idx===l._hi?'hi':''}" onmousedown="pickJVAcc(${i},${a.id})">${a.id} — ${esc(accShort(a.id))}</div>`).join('') || (l._q? '<div class="mut">No match</div>' : '');
  el.innerHTML = html;
  el.className = html? 'acdrop show' : 'acdrop';
}
function jvAccKey(ev,i){
  if(ev.ctrlKey||ev.metaKey) return;
  const l = jvDraft.lines[i];
  const matches = l._matches||[];
  if(ev.key==='ArrowDown'){ if(matches.length){ ev.preventDefault(); l._hi = Math.min(matches.length-1, l._hi+1); renderAcDrop(i); } }
  else if(ev.key==='ArrowUp'){ if(matches.length){ ev.preventDefault(); l._hi = Math.max(0, l._hi-1); renderAcDrop(i); } }
  else if(ev.key==='Enter'){
    ev.preventDefault();
    if(matches.length && l._hi>=0){ pickJVAcc(i, matches[l._hi].id); }
    else { closeAcDrop(i); const d = document.getElementById('jvDescr_'+i); if(d) d.focus(); }
  }
  else if(ev.key==='Tab'){
    // commit the highlighted (or the only) match, then move focus to Description ourselves
    if(matches.length){
      const pick = l._hi>=0 ? matches[l._hi] : (matches.length===1 ? matches[0] : null);
      if(pick){ ev.preventDefault(); pickJVAcc(i, pick.id); }
    }
  }
  else if(ev.key==='Escape'){ closeAcDrop(i); }
}
function pickJVAcc(i,accId){
  jvDraft.lines[i].acc = accId; jvDraft.lines[i]._matches=[]; jvDraft.lines[i]._hi=-1;
  const inp = document.getElementById('jvAcc_'+i);
  if(inp) inp.value = accName(accId);
  closeAcDrop(i);
  updateJVTotals();
  const descr = document.getElementById('jvDescr_'+i);
  if(descr) descr.focus();
}
function closeAcDrop(i){ const el=document.getElementById('acdrop_'+i); if(el){ el.innerHTML=''; el.className='acdrop'; } }

function renderAccrualPanel(){
  return `
    <div class="panel" style="background:var(--chip);border-color:var(--accent)">

      </div>` : ''}
    </div>`;

function computeAccrualJV(){
  const monthInput = document.getElementById('accrualMonthInput');
  accrualMonth = monthInput? monthInput.value : accrualMonth;
  const mappings = getAccrualMappings();
  if(!mappings.length){ toast('No accrual mappings configured — set them up in Settings first', true); return; }
  const [mFrom, mTo] = monthRange(accrualMonth);
  const lines = [];
  const explanation = [];
  mappings.forEach(map=>{
    const catAccs = D.accounts.filter(a=>a.category===map.category && firstDigit(a.id)===6).map(a=>a.id);
    if(!catAccs.length){ return; }
    const budget = D.budget.filter(b=>catAccs.includes(b.acc) && b.date>=mFrom && b.date<=mTo).reduce((s,b)=>s+Number(b.amt),0);
    const actual = D.ledger.filter(l=>catAccs.includes(l.acc) && l.date>=mFrom && l.date<=mTo).reduce((s,l)=>s+Number(l.amt),0);
    const variance = budget - actual; // positive = under budget (surplus to accrue)
    if(Math.abs(variance)<0.005){ explanation.push({category:map.category, budget, actual, variance:0, action:'On budget — no accrual needed'}); return; }
    const tag = monthTag(accrualMonth);
    if(variance>0){
      // under budget: accrue the surplus — Dr the 99-account, Cr the liability
      lines.push({key:Math.random().toString(36).slice(2), acc:map.expenseAcc, descr:map.category+' Accrual - '+tag, amt: Math.round(variance*100)/100, _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
      lines.push({key:Math.random().toString(36).slice(2), acc:map.liabilityAcc, descr:map.category+' Accrual - '+tag, amt: -Math.round(variance*100)/100, _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
      explanation.push({category:map.category, budget, actual, variance, action:'Under budget — accrued '+money(variance)+' to liability'});
    } else {
      const overage = -variance;
      const liabBalance = accountBalance(map.liabilityAcc); // negative number
      const available = Math.abs(Math.min(liabBalance,0));
      const draw = Math.min(overage, available);
      if(draw<0.005){ explanation.push({category:map.category, budget, actual, variance, action:'Over budget by '+money(overage)+' but no liability balance available to draw from'}); return; }
      lines.push({key:Math.random().toString(36).slice(2), acc:map.liabilityAcc, descr:map.category+' Accrual Drawdown - '+tag, amt: Math.round(draw*100)/100, _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
      lines.push({key:Math.random().toString(36).slice(2), acc:map.expenseAcc, descr:map.category+' Accrual Drawdown - '+tag, amt: -Math.round(draw*100)/100, _matches:[], _hi:-1, _descrMatches:[], _descrHi:-1});
      const note = draw<overage-0.005? ' (capped — only '+money(available)+' was available)' : '';
      explanation.push({category:map.category, budget, actual, variance, action:'Over budget — drew '+money(draw)+' from liability'+note});
    }
  });
  accrualExplanation = explanation;
  if(!lines.length){ toast('Nothing to accrue for '+monthLabel(accrualMonth)+' — every mapped category is on budget', true); renderNewJV(); return; }
  jvDraft.date = mTo;
  jvDraft.lines = lines;
  renderNewJV();
  toast('Generated accrual JV for '+monthLabel(accrualMonth)+' — review the explanation and lines before posting');
}

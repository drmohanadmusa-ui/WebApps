function updateTplTotal(){
  const total = window._tplDraft.lines.reduce((s,l)=>s+(Number(l.amt)||0),0);
  const el = document.getElementById('tplTotalDisplay');
  if(el){ el.textContent = money(total); el.className = 'mono '+moneyClass(total); }
}
function toggleTplLineSelect(i, checked){
  if(checked) window._tplSelected.add(i); else window._tplSelected.delete(i);
  renderTemplateModal();
}
function nextTplGroupId(){ return 1 + window._tplDraft.lines.reduce((m,l)=>Math.max(m, Number(l.group)||0), 0); }
function groupSelectedTplLines(){
  const idxs = Array.from(window._tplSelected).sort((a,b)=>a-b);
  if(idxs.length<2) return;
  const lines = window._tplDraft.lines;
  // Reuse an existing group id if any selected line already has one, else mint a new one.
  const existingGroup = idxs.map(i=>lines[i].group).find(g=>g!=null);
  const groupId = existingGroup!=null? existingGroup : nextTplGroupId();
  const selectedLines = idxs.map(i=>lines[i]);
  selectedLines.forEach(l=>{ l.group = groupId; });
  // Move the selected lines to be contiguous, at the position of the first selected line.
  const remaining = lines.filter((l,i)=>!idxs.includes(i));
  const firstIdx = idxs[0];
  const insertPos = firstIdx; // nothing before firstIdx was removed, since idxs is sorted ascending
  remaining.splice(insertPos, 0, ...selectedLines);
  window._tplDraft.lines = remaining;
  window._tplSelected = new Set();
  renderTemplateModal();
}
function ungroupTplLine(i){
  const groupId = window._tplDraft.lines[i].group;
  if(groupId==null) return;
  window._tplDraft.lines.forEach(l=>{ if(l.group===groupId) delete l.group; });
  renderTemplateModal();
}
function tplAccInput(i, val){
  const l = window._tplDraft.lines[i];
  l._q = val;
  if(!val){ l.acc = ''; }
  const q = val.toLowerCase();
  const matches = postableAccounts().filter(a=> String(a.id).includes(q) || (a.name||'').toLowerCase().includes(q)).slice(0,25);
  l._matches = matches; l._hi = -1;
  renderTplAcDrop(i);
}
function renderTplAcDrop(i){
  const l = window._tplDraft.lines[i];
  const matches = l._matches||[];
  const el = document.getElementById('tplAcDrop_'+i);
  if(!el) return;
  const html = matches.map((a,idx)=>`<div class="${idx===l._hi?'hi':''}" onmousedown="tplPickAcc(${i},${a.id})">${a.id} — ${esc(accShort(a.id))}</div>`).join('') || (l._q? '<div class="mut">No match</div>' : '');
  el.innerHTML = html;
  el.className = html? 'acdrop show' : 'acdrop';
}
function tplAccKey(ev, i){
  if(ev.ctrlKey||ev.metaKey) return;
  const l = window._tplDraft.lines[i];
  const matches = l._matches||[];
  if(ev.key==='ArrowDown'){ if(matches.length){ ev.preventDefault(); l._hi = Math.min(matches.length-1, l._hi+1); renderTplAcDrop(i); } }
  else if(ev.key==='ArrowUp'){ if(matches.length){ ev.preventDefault(); l._hi = Math.max(0, l._hi-1); renderTplAcDrop(i); } }
  else if(ev.key==='Enter'){
    ev.preventDefault();
    if(matches.length && l._hi>=0){ tplPickAcc(i, matches[l._hi].id); }
    else { closeTplAcDrop(i); }
  }
}
function tplPickAcc(i, accId){
  const l = window._tplDraft.lines[i];
  l.acc = accId; l._matches=[]; l._hi=-1; l._q='';
  const inp = document.getElementById('tplAcc_'+i);
  if(inp) inp.value = accName(accId);
  closeTplAcDrop(i);
  const d = document.getElementById('tplDescr_'+i);
  if(d) d.focus();
}
function closeTplAcDrop(i){ const el=document.getElementById('tplAcDrop_'+i); if(el){ el.innerHTML=''; el.className='acdrop'; } }
async function saveTemplateModal(){
  if(blockIfSyncing()) return;
  const name = document.getElementById('tplName').value.trim();
  if(!name){ toast('Name the template', true); return; }
  const lines = window._tplDraft.lines.filter(l=>l.acc && l.amt!==''&&l.amt!==null).map(l=>({acc:Number(l.acc), descr:l.descr||'', amt:Number(l.amt), group: l.group!=null? l.group : undefined}));
  if(lines.length<1){ toast('Add at least one line', true); return; }
  const groupTotals = {};
  lines.forEach(l=>{ if(l.group!=null){ groupTotals[l.group] = (groupTotals[l.group]||0) + l.amt; } });
  const unbalancedGroups = Object.entries(groupTotals).filter(([g,total])=>Math.abs(total)>=0.005);
  if(unbalancedGroups.length){
    const msg = unbalancedGroups.map(([g,total])=>'Group total: '+money(total)+' (must be 0.00)').join('\n');
    toast('Can\'t save — a group doesn\'t net to zero yet:\n'+msg, true);
    return;
  }
  const id = window._tplDraft.id || nextTemplateId();
  const existing = D.templates.find(x=>x.id===id);
  const base = existing? existing.updated_at||null : null;
  const obj = {id, name, lines};
  if(existing) Object.assign(existing, obj); else D.templates.push(obj);
  persistLocal(); closeModal(); renderSettings();
  toast('Template saved ✓');
  logActivity('action', (existing?'Edited':'Created')+' template "'+name+'" ('+lines.length+' lines)');
  await syncWrite('pd_templates', 'upsert', obj, base);
}
async function deleteTemplate(id){
  if(blockIfSyncing()) return;
  if(!confirm('Delete this template?')) return;
  const t = D.templates.find(x=>x.id===id);
  D.templates = D.templates.filter(t=>t.id!==id);
  persistLocal(); renderSettings();
  toast('Template deleted');
  await syncWrite('pd_templates', 'delete', {id}, t? t.updated_at||null : null);
}

/* ---- CSV import ---- */
function parseCSV(text){
  const rows = []; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(field); field=''; rows.push(row); row=[]; }
      else field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0]===''));
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>{ const o={}; headers.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o; });
}
function downloadTemplateCSV(kind){
  const templates = {
    ledger: 'JV#,Date,Account#,Description,Amount,Alloc#\n2900,2026-07-15,10101,Example cash deposit,500,\n2900,2026-07-15,10102,Example transfer out,-500,\n',
    allocations: 'JV#,Account#,Amount,Alloc#\n2900,10101,500,50000\n',
    coa: 'Acc#,Name,Category,Account Type,Cash Flow Type,Direction,Status\n60199,Example Expense Account,Home Accounts,Individual Account,Expenses - Monthly,Outflow,\n'
  };
  const blob = new Blob([templates[kind]], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = kind+'-import-template.csv'; a.click();
}
function handleImportFile(kind, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = csvToObjects(reader.result);
    if(!rows.length){ toast('No rows found in that CSV', true); inputEl.value=''; return; }
    if(kind==='ledger') await importLedgerCSV(rows);
    else if(kind==='allocations') await importAllocationsCSV(rows);
    else if(kind==='coa') await importCOACSV(rows);
    inputEl.value='';
  };
  reader.readAsText(file);
}
async function importLedgerCSV(rows){
  if(blockIfSyncing()) return;
  if(!confirm('Import '+rows.length+' ledger rows? This adds new transactions — it does not check that they balance to zero.')) return;
  let id = nextLedgerId();
  const newRows = [];
  let skippedInactive = 0;
  rows.forEach(r=>{
    const acc = parseInt(r['account#']||r['account'],10);
    const amt = Number(r['amount']);
    if(!acc || isNaN(amt)) return;
    const accObj = D.accounts.find(a=>a.id===acc);
    if(accObj && accObj.status==='Inactive'){ skippedInactive++; return; }
    const jv = parseInt(r['jv#']||r['jv'],10) || nextJV()+newRows.length;
    const alloc = parseInt(r['alloc#']||r['alloc'],10) || null;
    newRows.push({id: id++, jv, date: r['date']||todayStr(), acc, descr: r['description']||r['descr']||'', amt, alloc: alloc||null, allocatable:false});
  });
  D.ledger.push(...newRows);
  persistLocal();
  showImportProgress('Importing '+newRows.length.toLocaleString()+' ledger rows…');
  let li=0;
  for(const l of newRows){ await syncWrite('pd_ledger', 'upsert', {id:l.id,jv:l.jv,entry_date:l.date,acc:l.acc,descr:l.descr,amt:l.amt,alloc:l.alloc,allocatable:l.allocatable}, null); li++; updateImportProgress(li, newRows.length, 'Syncing'); }
  finishImportProgress('Imported '+newRows.length.toLocaleString()+' ledger rows ✓'+(skippedInactive? '\n'+skippedInactive.toLocaleString()+' row(s) skipped — posted against an Inactive account':''));
  renderSettings();
}
async function importAllocationsCSV(rows){
  if(blockIfSyncing()) return;
  let matched=0, unmatched=0;
  const touched = [];
  rows.forEach(r=>{
    const jv = parseInt(r['jv#']||r['jv'],10);
    const acc = parseInt(r['account#']||r['account'],10);
    const amt = Number(r['amount']);
    const alloc = parseInt(r['alloc#']||r['alloc'],10);
    if(!jv||!acc||isNaN(amt)||!alloc){ unmatched++; return; }
    const line = D.ledger.find(l=>l.jv===jv && l.acc===acc && Math.abs(l.amt-amt)<0.01 && !l.alloc);
    if(line){ const base=line.updated_at||null; line.alloc = alloc; touched.push({row:line, base}); matched++; } else unmatched++;
  });
  persistLocal();
  showImportProgress('Applying '+touched.length.toLocaleString()+' allocation matches…');
  let ai=0;
  for(const t of touched){ await syncWrite('pd_ledger', 'upsert', {id:t.row.id, jv:t.row.jv, entry_date:t.row.date, acc:t.row.acc, descr:t.row.descr, amt:t.row.amt, alloc:t.row.alloc, allocatable:t.row.allocatable}, t.base); ai++; updateImportProgress(ai, touched.length, 'Syncing'); }
  finishImportProgress('Allocations: '+matched.toLocaleString()+' matched, '+unmatched.toLocaleString()+' unmatched');
  renderSettings();
}
async function importCOACSV(rows){
  if(blockIfSyncing()) return;
  let added=0, updated=0;
  const touched = [];
  rows.forEach(r=>{
    const id = parseInt(r['acc#']||r['account#'],10);
    const name = r['name']||r['account name'];
    if(!id||!name) return;
    const obj = { id, descr:name, name:id+' - '+name, category:r['category']||'', acc_type:r['account type']||'Individual Account', cf_type:r['cash flow type']||'', direction:r['direction']||'', status:r['status']||null, is_savings:false, balance:0 };
    const existing = D.accounts.find(x=>x.id===id);
    const base = existing? existing.updated_at||null : null;
    if(existing){ Object.assign(existing, obj); updated++; } else { D.accounts.push(obj); added++; }
    touched.push({row:obj, base});
  });
  rebuildIndex(); persistLocal();
  showImportProgress('Updating Chart of Accounts…');
  let ci=0;
  for(const t of touched){ await syncWrite('pd_accounts', 'upsert', t.row, t.base); ci++; updateImportProgress(ci, touched.length, 'Syncing'); }
  finishImportProgress('Chart of Accounts: '+added.toLocaleString()+' added, '+updated.toLocaleString()+' updated');
  renderSettings();
}

/* ============================= THEME ============================= */
const ACCENT_PALETTES = {
  amber:  {label:'Amber (default)', light:['#9a6b1f','#b9822b'], dark:['#d9a643','#e8bc63']},
  blue:   {label:'Blue',            light:['#2f5fa8','#4a7dc9'], dark:['#6fa8f5','#8ec1ff']},
  green:  {label:'Green',           light:['#146c43','#1f8a58'], dark:['#3fbf85','#5cd9a0']},
  purple: {label:'Purple',          light:['#6b3fa0','#8657c4'], dark:['#b98ff0','#cba8f7']},
  rust:   {label:'Rust',            light:['#a3352c','#c14839'], dark:['#e3695f','#f08a80']},
  teal:   {label:'Teal',            light:['#0f766e','#14a08f'], dark:['#2dd4bf','#5eead4']},
};
function applyAccent(){
  const name = localStorage.getItem('accentColor')||'amber';
  if(name==='custom'){
    const hex = localStorage.getItem('customAccentColor')||'#9a6b1f';
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent2', shadeColor(hex, 18));
    return;
  }
  const pal = ACCENT_PALETTES[name]||ACCENT_PALETTES.amber;
  const dark = document.documentElement.dataset.theme==='dark';
  const [a,a2] = dark? pal.dark : pal.light;
  document.documentElement.style.setProperty('--accent', a);
  document.documentElement.style.setProperty('--accent2', a2);
}
function shadeColor(hex, percent){
  const num = parseInt(hex.replace('#',''),16);
  let r = (num>>16) + Math.round(255*percent/100);
  let g = ((num>>8)&0xff) + Math.round(255*percent/100);
  let b = (num&0xff) + Math.round(255*percent/100);
  r = Math.min(255,Math.max(0,r)); g = Math.min(255,Math.max(0,g)); b = Math.min(255,Math.max(0,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function setAccentColor(name){ localStorage.setItem('accentColor', name); applyAccent(); renderSettings(); toast('Color updated ✓'); }
function setCustomAccentColor(hex){
  localStorage.setItem('accentColor','custom');
  localStorage.setItem('customAccentColor', hex);
  applyAccent(); renderSettings(); toast('Custom accent color set ✓');
}

const FONT_FAMILIES = {
  system: {label:'System Default (current)', stack:"-apple-system,'Segoe UI',Roboto,Arial,sans-serif"},
  serif:  {label:'Classic Serif', stack:"Georgia,'Iowan Old Style',serif"},
  humanist: {label:'Humanist Sans', stack:"Verdana,Tahoma,Geneva,sans-serif"},
  rounded: {label:'Rounded', stack:"'Trebuchet MS',Verdana,sans-serif"},
};
function applyTypography(){
  const sizeKey = localStorage.getItem('fontSize')||'medium';
  const famKey = localStorage.getItem('fontFamily')||'system';
  const size = FONT_SIZES[sizeKey]||FONT_SIZES.medium;
  const fam = FONT_FAMILIES[famKey]||FONT_FAMILIES.system;
  document.documentElement.style.setProperty('--basefs', size.px);
  document.documentElement.style.setProperty('--sans', fam.stack);
}
function setFontSize(v){ localStorage.setItem('fontSize', v); applyTypography(); renderSettings(); toast('Font size updated ✓'); }
function setFontFamily(v){ localStorage.setItem('fontFamily', v); applyTypography(); renderSettings(); toast('Font updated ✓'); }
const DEFAULT_SEMANTIC_COLORS = { light:{green:'#146c43', red:'#a3352c'}, dark:{green:'#3fbf85', red:'#e3695f'} };
function getCustomColor(kind){
  const dark = document.documentElement.dataset.theme==='dark';
  const stored = localStorage.getItem('color_'+kind+'_'+(dark?'dark':'light'));
  return stored || DEFAULT_SEMANTIC_COLORS[dark?'dark':'light'][kind];
}
function setCustomColor(kind, val){
  const dark = document.documentElement.dataset.theme==='dark';
  localStorage.setItem('color_'+kind+'_'+(dark?'dark':'light'), val);
  applySemanticColors();
  renderSettings();
  toast((kind==='green'?'Positive':'Negative')+' color updated ✓');
}
function resetCustomColor(kind){
  const dark = document.documentElement.dataset.theme==='dark';
  localStorage.removeItem('color_'+kind+'_'+(dark?'dark':'light'));
  applySemanticColors();
  renderSettings();
  toast('Reset to default');
}
function applySemanticColors(){
  document.documentElement.style.setProperty('--green', getCustomColor('green'));
  document.documentElement.style.setProperty('--red', getCustomColor('red'));
}
function getHiddenPages(){ try{ return JSON.parse(localStorage.getItem('hiddenPages')||'[]'); }catch(e){ return []; } }
function togglePageVisibility(id, visible){
  let hidden = getHiddenPages();
  if(visible){ hidden = hidden.filter(x=>x!==id); } else { if(!hidden.includes(id)) hidden.push(id); }
  localStorage.setItem('hiddenPages', JSON.stringify(hidden));
  renderNav();
  toast(visible? 'Page shown':'Page hidden');
}
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const b = document.getElementById('themeBtn'); if(b) b.textContent = (t==='dark'?'☀️':'🌙');
  try{ localStorage.setItem('uiTheme',t); }catch(e){}
  applyAccent();
  applyTypography();
  applySemanticColors();
}
function toggleTheme(){ applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); }

boot();

</script>
